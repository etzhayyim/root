# no-server-key: read-only — pending Stage A-E member-signed-writes refactor per ADR-2605231525
version: '3.8'

services:
  # Next.js Application
  scap-web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

      # Database Configuration
      DATABASE_URL: ${DATABASE_URL}

      # NVD API Configuration
      NVD_API_KEY: ${NVD_API_KEY}

      # Application Configuration
      WORKER_STATUS_REFRESH_INTERVAL: 30000
      MOCK_MODE: false

    depends_on:
      - redis
    restart: unless-stopped

  # Integrated SCAP Worker (all data sources)
  integrated-scap-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      WORKER_TYPE: integrated-scap

      # Database Configuration
      DATABASE_URL: ${DATABASE_URL}

      # NVD API Configuration
      NVD_API_KEY: ${NVD_API_KEY}

    restart: unless-stopped
    deploy:
      replicas: 1

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - scap-web
    restart: unless-stopped

volumes:
  redis_data:

networks:
  default:
    name: scap-etzhayyim-network
