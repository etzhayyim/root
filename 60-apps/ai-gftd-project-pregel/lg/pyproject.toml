[project]
name = "lg-pregel"
version = "0.0.1"
description = "LangGraph Server for pregel.etzhayyim.com — Outlook email triage resident worker (ADR-2605080600)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2.61",
    "langchain-core>=0.3.30",
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    "pydantic>=2.10",
    "structlog>=24.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1.300",
]

[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "lg_pregel*",
]
