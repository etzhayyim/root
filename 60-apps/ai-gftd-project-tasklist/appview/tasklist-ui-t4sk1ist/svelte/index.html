<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasklist Approval Console</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1016;
        --panel: #151d29;
        --panel-2: #1a2331;
        --line: #2a3647;
        --txt: #ecf3ff;
        --muted: #99a8bf;
        --ok: #3bd18a;
        --bad: #ff6b73;
        --warn: #ffd45d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--txt);
        background: radial-gradient(1200px 600px at 20% -20%, #24324a 0%, var(--bg) 55%);
      }
      .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
      .header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; }
      .title { font-size: 26px; font-weight: 700; margin: 0; }
      .sub { color: var(--muted); margin-top: 6px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .chip {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--txt);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 13px;
      }
      button {
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--txt);
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button:hover { border-color: #415573; }
      button.ok { background: rgba(59, 209, 138, 0.14); border-color: rgba(59, 209, 138, 0.5); }
      button.bad { background: rgba(255, 107, 115, 0.14); border-color: rgba(255, 107, 115, 0.45); }
      .grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 18px; }
      .card {
        border: 1px solid var(--line);
        background: rgba(21, 29, 41, 0.86);
        border-radius: 14px;
        padding: 14px;
      }
      .status-requested { color: var(--warn); }
      .status-approved { color: var(--ok); }
      .status-denied { color: var(--bad); }
      .meta { color: var(--muted); font-size: 13px; }
      .summary { margin: 8px 0; font-size: 16px; }
      .plan { margin-top: 10px; background: #0d141e; border: 1px solid #283245; padding: 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; font-size: 12px; color: #c7d5ec; }
      .error { color: var(--bad); margin-top: 12px; }
      .empty { color: var(--muted); padding: 22px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="header">
        <div>
          <h1 class="title">Tasklist Approval Console</h1>
          <div class="sub">Review and decide scheduler Human-in-the-loop tasks.</div>
        </div>
        <div class="row">
          <span class="chip" id="countChip">0 requests</span>
          <button id="refreshBtn">Refresh</button>
        </div>
      </div>

      <div class="row" style="margin-top:12px;">
        <button data-status="requested">Requested</button>
        <button data-status="approved">Approved</button>
        <button data-status="denied">Denied</button>
        <button data-status="more_info">More Info</button>
        <button data-status="">All</button>
      </div>

      <div id="error" class="error"></div>
      <section id="list" class="grid"></section>
    </main>

    <script type="module">
      import { createPromiseClient } from "https://esm.sh/@connectrpc/connect@1.6.1";
      import { createConnectTransport } from "https://esm.sh/@connectrpc/connect-web@1.6.1";
      import { Message, MethodKind, proto3 } from "https://esm.sh/@bufbuild/protobuf@1.10.0";

      const MCP_BASE = window.location.hostname === "tasklist.etzhayyim.com"
        ? "https://1.etzhayyim.com"
        : (window.localStorage.getItem("TASKLIST_MCP_BASE") || "https://1.etzhayyim.com");
      const DECIDER = window.localStorage.getItem("TASKLIST_DECIDER") || "tasklist-human";

      let statusFilter = "requested";

      class CallToolRequest extends Message {
        constructor(data) {
          super();
          this.name = "";
          this.arguments = "";
          proto3.util.initPartial(data, this);
        }
        static runtime = proto3;
        static typeName = "controlplane.v1.CallToolRequest";
        static fields = proto3.util.newFieldList(() => [
          { no: 1, name: "name", kind: "scalar", T: 9 },
          { no: 2, name: "arguments", kind: "scalar", T: 9 }
        ]);
        static fromBinary(bytes, options) { return new CallToolRequest().fromBinary(bytes, options); }
        static fromJson(jsonValue, options) { return new CallToolRequest().fromJson(jsonValue, options); }
        static fromJsonString(jsonString, options) { return new CallToolRequest().fromJsonString(jsonString, options); }
        static equals(a, b) { return proto3.util.equals(CallToolRequest, a, b); }
      }

      class ToolContent extends Message {
        constructor(data) {
          super();
          this.type = "";
          this.text = "";
          proto3.util.initPartial(data, this);
        }
        static runtime = proto3;
        static typeName = "controlplane.v1.ToolContent";
        static fields = proto3.util.newFieldList(() => [
          { no: 1, name: "type", kind: "scalar", T: 9 },
          { no: 2, name: "text", kind: "scalar", T: 9 }
        ]);
        static fromBinary(bytes, options) { return new ToolContent().fromBinary(bytes, options); }
        static fromJson(jsonValue, options) { return new ToolContent().fromJson(jsonValue, options); }
        static fromJsonString(jsonString, options) { return new ToolContent().fromJsonString(jsonString, options); }
        static equals(a, b) { return proto3.util.equals(ToolContent, a, b); }
      }

      class ToolResult extends Message {
        constructor(data) {
          super();
          this.content = [];
          proto3.util.initPartial(data, this);
        }
        static runtime = proto3;
        static typeName = "controlplane.v1.ToolResult";
        static fields = proto3.util.newFieldList(() => [
          { no: 1, name: "content", kind: "message", T: ToolContent, repeated: true }
        ]);
        static fromBinary(bytes, options) { return new ToolResult().fromBinary(bytes, options); }
        static fromJson(jsonValue, options) { return new ToolResult().fromJson(jsonValue, options); }
        static fromJsonString(jsonString, options) { return new ToolResult().fromJsonString(jsonString, options); }
        static equals(a, b) { return proto3.util.equals(ToolResult, a, b); }
      }

      class ToolError extends Message {
        constructor(data) {
          super();
          this.message = "";
          proto3.util.initPartial(data, this);
        }
        static runtime = proto3;
        static typeName = "controlplane.v1.ToolError";
        static fields = proto3.util.newFieldList(() => [
          { no: 1, name: "message", kind: "scalar", T: 9 }
        ]);
        static fromBinary(bytes, options) { return new ToolError().fromBinary(bytes, options); }
        static fromJson(jsonValue, options) { return new ToolError().fromJson(jsonValue, options); }
        static fromJsonString(jsonString, options) { return new ToolError().fromJsonString(jsonString, options); }
        static equals(a, b) { return proto3.util.equals(ToolError, a, b); }
      }

      class CallToolResponse extends Message {
        constructor(data) {
          super();
          this.result = undefined;
          this.error = undefined;
          this.content = [];
          this.isError = false;
          proto3.util.initPartial(data, this);
        }
        static runtime = proto3;
        static typeName = "controlplane.v1.CallToolResponse";
        static fields = proto3.util.newFieldList(() => [
          { no: 1, name: "result", kind: "message", T: ToolResult },
          { no: 2, name: "error", kind: "message", T: ToolError },
          { no: 3, name: "content", kind: "message", T: ToolContent, repeated: true },
          { no: 4, name: "is_error", jsonName: "isError", kind: "scalar", T: 8 }
        ]);
        static fromBinary(bytes, options) { return new CallToolResponse().fromBinary(bytes, options); }
        static fromJson(jsonValue, options) { return new CallToolResponse().fromJson(jsonValue, options); }
        static fromJsonString(jsonString, options) { return new CallToolResponse().fromJsonString(jsonString, options); }
        static equals(a, b) { return proto3.util.equals(CallToolResponse, a, b); }
      }

      const MCPService = {
        typeName: "controlplane.v1.MCPService",
        methods: {
          callTool: {
            name: "CallTool",
            I: CallToolRequest,
            O: CallToolResponse,
            kind: MethodKind.Unary
          }
        }
      };

      const mcpClient = createPromiseClient(
        MCPService,
        createConnectTransport({
          baseUrl: `${MCP_BASE}/api/grpc`,
          useBinaryFormat: false
        })
      );

      function asPlainObject(value) {
        return value && typeof value.toJson === "function" ? value.toJson() : value;
      }

      async function callTool(name, args = {}) {
        const payload = await mcpClient.callTool(new CallToolRequest({
          name,
          arguments: JSON.stringify(args)
        }));
        if (payload.error && !payload.result) throw new Error(payload.error.message || "MCP error");
        const normalized = asPlainObject(payload.result ?? payload);
        if (typeof normalized?.content === "string") {
          try {
            return JSON.parse(normalized.content);
          } catch {
            return normalized;
          }
        }
        return normalizeToolResult(normalized);
      }

      function normalizeToolResult(result) {
        if (!result || typeof result !== "object") return result;
        if (result.approvals || result.approval || result.approval_id) return result;
        if (!Array.isArray(result.content) || !result.content.length) return result;
        const text = result.content[0]?.text;
        if (!text) return result;
        try {
          return JSON.parse(text);
        } catch {
          return result;
        }
      }

      function cardHTML(item) {
        const st = (item.status || "").toLowerCase();
        const safeSummary = escapeHtml(item.summary || "(no summary)");
        const safeMeta = escapeHtml(`${item.app_id || "app"} / ${item.ticket_id || "-"} / ${item.id}`);
        const safeBy = escapeHtml(item.requested_by || "scheduler");
        const safePlan = escapeHtml(item.plan_json || "");

        return `
          <article class="card">
            <div class="row" style="justify-content: space-between;">
              <div class="meta">${safeMeta}</div>
              <div class="status-${st}">${st || "unknown"}</div>
            </div>
            <div class="summary">${safeSummary}</div>
            <div class="meta">requested_by=${safeBy} / created=${escapeHtml(item.created_at || "-")}</div>
            ${safePlan ? `<div class="plan">${safePlan}</div>` : ""}
            <div class="row" style="margin-top:10px;">
              <button class="ok" data-action="approve" data-id="${item.id}">Approve</button>
              <button class="bad" data-action="deny" data-id="${item.id}">Deny</button>
            </div>
          </article>
        `;
      }

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      async function decide(approvalId, decision) {
        const note = decision === "approved" ? "approved from tasklist.etzhayyim.com" : "denied from tasklist.etzhayyim.com";
        await callTool("approvals.decide", {
          approval_id: approvalId,
          decision,
          note,
          decided_by: DECIDER
        });
      }

      async function refresh() {
        const err = document.getElementById("error");
        const list = document.getElementById("list");
        err.textContent = "";
        list.innerHTML = "";

        try {
          const result = await callTool("approvals.list", {
            status: statusFilter,
            limit: 200
          });
          const items = result.approvals || [];
          document.getElementById("countChip").textContent = `${items.length} requests`;

          if (!items.length) {
            list.innerHTML = `<div class="empty">No approval requests for status: ${statusFilter || "all"}</div>`;
            return;
          }

          list.innerHTML = items.map(cardHTML).join("");
          for (const btn of list.querySelectorAll("button[data-action]")) {
            btn.addEventListener("click", async (ev) => {
              const id = ev.currentTarget.getAttribute("data-id");
              const action = ev.currentTarget.getAttribute("data-action");
              try {
                await decide(id, action === "approve" ? "approved" : "denied");
                await refresh();
              } catch (e) {
                err.textContent = String(e);
              }
            });
          }
        } catch (e) {
          err.textContent = String(e);
        }
      }

      document.getElementById("refreshBtn").addEventListener("click", refresh);
      for (const btn of document.querySelectorAll("button[data-status]")) {
        btn.addEventListener("click", () => {
          statusFilter = btn.getAttribute("data-status") || "";
          refresh();
        });
      }

      refresh();
    </script>
  </body>
</html>
