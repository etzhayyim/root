// ═══ Actor Model: every object is an actor with physics ═══
class Actor{
  constructor(id,x,y,r,mass){
    this.id=id;this.x=x;this.y=y;this.vx=0;this.vy=0;
    this.r=r;this.mass=mass;this.active=true;this.grounded=true;
    this.z=0;this.vz=0; // vertical (3D height for falling bananas)
  }
  update(){
    this.x+=this.vx;this.y+=this.vy;
    this.vx*=FRIC;this.vy*=FRIC;
    // 3D vertical (banana fall)
    if(this.z>0||this.vz!==0){this.vz-=G;this.z+=this.vz;if(this.z<=0){this.z=0;this.vz=0;this.grounded=true}}
    // Arena clamp
    this.x=Math.max(-ARENA+this.r,Math.min(ARENA-this.r,this.x));
    this.y=Math.max(-ARENA+this.r,Math.min(ARENA-this.r,this.y));
  }
  distTo(b){return Math.hypot(this.x-b.x,this.y-b.y)}
  // Elastic collision response
  collideWith(b,knockMult){
    let dx=b.x-this.x,dy=b.y-this.y,d=Math.hypot(dx,dy);
    if(d<1)d=1;let nx=dx/d,ny=dy/d;
    let overlap=this.r+b.r-d;if(overlap<=0)return false;
    // Separate
    let totalM=this.mass+b.mass;
    let ratA=b.mass/totalM,ratB=this.mass/totalM;
    this.x-=nx*overlap*ratA;this.y-=ny*overlap*ratA;
    b.x+=nx*overlap*ratB;b.y+=ny*overlap*ratB;
    // Impulse
    let dvx=this.vx-b.vx,dvy=this.vy-b.vy;
    let dvn=dvx*nx+dvy*ny;if(dvn>0)return true;
    let j=-2*dvn/totalM*BOUNCE*knockMult;
    this.vx+=j*b.mass*nx;this.vy+=j*b.mass*ny;
    b.vx-=j*this.mass*nx;b.vy-=j*this.mass*ny;
    return true;
  }
}

const BOOT_READY_T=5400;
function drawBoot(dt){
  bootTime+=dt;
  cx.fillStyle='#0a0a0a';cx.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=3){cx.fillStyle='rgba(0,0,0,0.15)';cx.fillRect(0,y,W,1)}
  let vg=cx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.4)');
  cx.fillStyle=vg;cx.fillRect(0,0,W,H);
  cx.font='13px "Courier New",Consolas,"Liberation Mono",monospace';cx.textBaseline='top';
  let visibleLines=[];
  for(let i=0;i<BOOT_SEQ.length;i++){if(bootTime>=BOOT_SEQ[i].t)visibleLines.push(BOOT_SEQ[i])}
  let startY=Math.max(20,H-40-visibleLines.length*18);
  for(let i=0;i<visibleLines.length;i++){
    let line=visibleLines[i].text,y=startY+i*18;
    if(y>H-40)continue;
    if(line.startsWith('[  OK  ]')){
      cx.fillStyle='#22cc44';cx.fillText('[  OK  ]',30,y);
      cx.fillStyle='#ccddcc';cx.fillText(line.slice(8),30+cx.measureText('[  OK  ]').width,y);
    }else if(line.startsWith('[BOOT]')){
      cx.fillStyle='#44aaff';cx.fillText('[BOOT]',30,y);
      let rest=line.slice(6);
      if(rest.endsWith('OK')){
        cx.fillStyle='#99aabb';cx.fillText(rest.slice(0,-2),30+cx.measureText('[BOOT]').width,y);
        cx.fillStyle='#22cc44';cx.fillText('OK',30+cx.measureText('[BOOT]'+rest.slice(0,-2)).width,y);
      }else{cx.fillStyle='#99aabb';cx.fillText(rest,30+cx.measureText('[BOOT]').width,y)}
    }else if(line.includes('K A M I')){
      cx.font='bold 28px "Courier New",Consolas,monospace';cx.fillStyle='#ff4444';
      let tw=cx.measureText(line).width;cx.fillText(line,(W-tw)/2,y-4);
      cx.font='13px "Courier New",Consolas,"Liberation Mono",monospace';
    }else if(line.startsWith('Copyright')){cx.fillStyle='#666';cx.fillText(line,30,y)}
    else if(line.startsWith('KAMI ENGINE')){cx.fillStyle='#fff';cx.font='bold 15px "Courier New",Consolas,monospace';cx.fillText(line,30,y);cx.font='13px "Courier New",Consolas,"Liberation Mono",monospace'}
    else{cx.fillStyle='#99aabb';cx.fillText(line,30,y)}
  }
  bootCursorT+=dt;if(bootCursorT>500){bootCursorT-=500;bootCursor=!bootCursor}

// ═══ Tree Actor (physics body + banana source + hiding spot) ═══
class Tree extends Actor{
  constructor(x,y){
    super('tree',x,y,20,999); // very heavy, immovable
    this.h=40+rng()*30;this.bananaSlots=2+Math.floor(rng()*3); // 2-4 bananas per tree
    this.shake=0;this.safe=true;
  }
  shakeTree(){this.shake=20;sfxDrop()}
  update(){
    super.update();
    if(this.shake>0)this.shake--;
  }
}

// ═══ Banana Actor (SDF 3D, physics, falls from trees) ═══
class Banana extends Actor{
  constructor(x,y,gold){
    super('banana',x,y,BR,0.5);
    this.gold=gold;this.collected=false;this.bobble=rng()*60;
    this.z=3+rng()*2;this.vz=rng()*0.5;this.grounded=false; // start in air (falling from tree)
  }
  update(){
    super.update();
    if(!this.collected)this.bobble++;
  }
}

// ═══ Init ═══
function initGame(){
  phase='sneak';tick=0;score=0;bananaCount=0;combo=0;comboTimer=0;stamina=100;msg='';msgTick=0;
  wave=0;waveRestTimer=0;nearMissTimer=0;nearMissCount=0;hideTimer=0;hiding=false;peaceTimer=0;peacePath=false;
  lives=3;invincTimer=0;
  tutStep=0;tutTimer=TUT[0].dur;tutDone=false;pts=[];
  player=new Actor('player',0,-180,14,1);
  gorilla=new Actor('gorilla',0,0,26,10); // gorilla is 10x heavier
  gorilla.state='sleeping';gorilla.anger=0;gorilla.wakeTimer=0;gorilla.buttPulse=0;gorilla.chestBeat=0;
  // Spawn trees in a ring
  trees=[];
  for(let i=0;i<12;i++){
    let a=(i/12)*Math.PI*2+rng()*.3;
    let r=80+rng()*180;
    trees.push(new Tree(Math.cos(a)*r,Math.sin(a)*r));
  }
  bananas=[];bananasNeeded=0;
  ensureMusic();
}

function spawnBananasFromTrees(){
  let wc=WAVE_CFG[wave]||WAVE_CFG[WAVE_CFG.length-1];
  bananas=[];bananaCount=0;bananasNeeded=wc.bn+wc.gold;
  // Distribute bananas to random trees
  let normalCount=wc.bn,goldCount=wc.gold;
  let treesCopy=[...trees].sort(()=>rng()-.5);
  for(let i=0;i<normalCount;i++){
    let t=treesCopy[i%treesCopy.length];
    let ox=(rng()-.5)*30,oy=(rng()-.5)*30;
    bananas.push(new Banana(t.x+ox,t.y+oy,false));
    t.shakeTree();
  }
  for(let i=0;i<goldCount;i++){
    // Golden bananas fall near gorilla's position
    let ox=(rng()-.5)*50,oy=(rng()-.5)*50;
    bananas.push(new Banana(gorilla.x+ox,gorilla.y+oy,true));
  }
}

function drawGorilla(gx,gy,s,anger){
  cx.save();cx.translate(gx,gy);cx.scale(s,s);
  let bp=.3+Math.abs(Math.sin(tick*.08+anger*.02))*.7;
  let br=18+bp*8;
  // Shadow
  cx.fillStyle='rgba(0,0,0,0.35)';cx.beginPath();cx.ellipse(0,22,32,10,0,0,Math.PI*2);cx.fill();

  let bR=Math.floor(200+bp*55),bG=Math.floor(30+(1-bp)*30),bB=Math.floor(20+(1-bp)*20);
  let grd=cx.createRadialGradient(-10,8,br*.1,-10,8,br*.6);
  grd.addColorStop(0,`rgb(${bR+30},${bG+40},${bB+40})`);grd.addColorStop(1,`rgb(${bR},${bG},${bB})`);
  cx.fillStyle=grd;cx.beginPath();cx.ellipse(-10,8,br*.6,br*.55,0,0,Math.PI*2);cx.fill();

  grd.addColorStop(0,`rgb(${bR+30},${bG+40},${bB+40})`);grd.addColorStop(1,`rgb(${bR},${bG},${bB})`);
  cx.fillStyle=grd;cx.beginPath();cx.ellipse(10,8,br*.6,br*.55,0,0,Math.PI*2);cx.fill();
  cx.fillStyle=`rgba(255,180,160,${.15+bp*.2})`;cx.beginPath();cx.ellipse(0,4,br*.25,br*.25,0,0,Math.PI*2);cx.fill();
  // Body
  grd=cx.createRadialGradient(-5,-8,5,0,-5,28);grd.addColorStop(0,'#5a3518');grd.addColorStop(1,'#3a1a08');
  cx.fillStyle=grd;cx.beginPath();cx.ellipse(0,-5,26,30,0,0,Math.PI*2);cx.fill();
  // Belly
  grd=cx.createRadialGradient(0,4,3,0,2,20);grd.addColorStop(0,'#6a4020');grd.addColorStop(1,'#4a2a10');
  cx.fillStyle=grd;cx.beginPath();cx.ellipse(0,2,18,22,0,0,Math.PI*2);cx.fill();
  // Arms
  cx.fillStyle='#4a2a10';cx.beginPath();cx.ellipse(-30,-2,11,20,-.3,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.ellipse(30,-2,11,20,.3,0,Math.PI*2);cx.fill();
  // Fists
  cx.fillStyle='#2a1206';cx.beginPath();cx.arc(-34,14,9,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(34,14,9,0,Math.PI*2);cx.fill();
  // Head
  grd=cx.createRadialGradient(-2,-35,3,0,-32,16);grd.addColorStop(0,'#4a2a12');grd.addColorStop(1,'#2d1808');
  cx.fillStyle=grd;cx.beginPath();cx.ellipse(0,-32,17,15,0,0,Math.PI*2);cx.fill();
  cx.fillStyle='#251408';cx.beginPath();cx.ellipse(0,-46,6,9,0,0,Math.PI*2);cx.fill();
  cx.fillRect(-13,-36,26,5);
  // Eyes
  if(gorilla.state==='sleeping'){cx.strokeStyle='#111';cx.lineWidth=2;cx.beginPath();cx.moveTo(-9,-32);cx.lineTo(-5,-30);cx.lineTo(-9,-30);cx.stroke();cx.beginPath();cx.moveTo(9,-32);cx.lineTo(5,-30);cx.lineTo(9,-30);cx.stroke()}
  else if(gorilla.state==='waking_peace'||gorilla.state==='friendly'){
    // Gentle eyes (round, warm brown)
    cx.fillStyle='#fff';cx.beginPath();cx.arc(-7,-31,5,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(7,-31,5,0,Math.PI*2);cx.fill();
    cx.fillStyle='#553311';cx.beginPath();cx.arc(-7,-31,3,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(7,-31,3,0,Math.PI*2);cx.fill();
    // Gentle eyebrows (flat, not angry)
    cx.strokeStyle='#2d1808';cx.lineWidth=2;cx.beginPath();cx.moveTo(-11,-36);cx.lineTo(-3,-36);cx.stroke();cx.beginPath();cx.moveTo(11,-36);cx.lineTo(3,-36);cx.stroke();
    // Smile
    cx.strokeStyle='#2a1206';cx.lineWidth=2;cx.beginPath();cx.arc(0,-22,6,0.2,Math.PI-0.2);cx.stroke();
  }
  else{cx.fillStyle='#fff';cx.beginPath();cx.arc(-7,-31,5.5,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(7,-31,5.5,0,Math.PI*2);cx.fill();
    cx.fillStyle=gorilla.state==='chasing'?'#ff2200':'#331100';cx.beginPath();cx.arc(-7,-31,3,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(7,-31,3,0,Math.PI*2);cx.fill();
    cx.strokeStyle='#111';cx.lineWidth=3;cx.beginPath();cx.moveTo(-13,-38);cx.lineTo(-4,-36);cx.stroke();cx.beginPath();cx.moveTo(13,-38);cx.lineTo(4,-36);cx.stroke()}
  // Nose + mouth
  cx.fillStyle='#2a1206';cx.beginPath();cx.ellipse(0,-26,7,5,0,0,Math.PI*2);cx.fill();
  cx.fillStyle='#1a0a04';cx.beginPath();cx.arc(-3,-25,2.5,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(3,-25,2.5,0,Math.PI*2);cx.fill();
  if(gorilla.state==='chasing'){cx.fillStyle='#220000';cx.beginPath();cx.ellipse(0,-20,11,7,0,0,Math.PI*2);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.moveTo(-6,-24);cx.lineTo(-4,-18);cx.lineTo(-8,-18);cx.fill();cx.beginPath();cx.moveTo(6,-24);cx.lineTo(4,-18);cx.lineTo(8,-18);cx.fill()}
  // Legs
  cx.fillStyle='#4a2a10';cx.beginPath();cx.ellipse(-12,22,9,11,0,0,Math.PI*2);cx.fill();cx.beginPath();cx.ellipse(12,22,9,11,0,0,Math.PI*2);cx.fill();
  // Steam
  if(gorilla.state==='chasing'&&tick%4<2){cx.fillStyle='rgba(200,200,200,0.5)';cx.beginPath();cx.arc(-9,-28-(tick%20),3.5,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(9,-28-(tick%20),3.5,0,Math.PI*2);cx.fill()}
  cx.restore();
}

  cx.fillStyle='#ddb896';let as=Math.sin(tick*.3)*3;cx.fillRect(-17,-6+as,6,15);cx.fillRect(12,-6-as,6,15);
  grd=cx.createRadialGradient(-2,-22,3,0,-20,11);grd.addColorStop(0,'#e8c8a6');grd.addColorStop(1,'#c8a880');
  cx.fillStyle=grd;cx.beginPath();cx.arc(0,-20,11,0,Math.PI*2);cx.fill();
  cx.fillStyle='#222';cx.beginPath();cx.arc(0,-23,11,Math.PI,0);cx.fill();cx.fillRect(-11,-24,22,4);
  cx.fillStyle='#111';cx.beginPath();cx.arc(-4,-20,2.5,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(4,-20,2.5,0,Math.PI*2);cx.fill();
  cx.strokeStyle='#111';cx.lineWidth=1.5;cx.beginPath();cx.arc(0,-17,5,.1,Math.PI-.1);cx.stroke();
  // Paddle
  cx.fillStyle='#b8844a';cx.save();cx.translate(17,-2-as);cx.rotate(.3);cx.fillRect(-2,-19,5,23);
  grd=cx.createRadialGradient(1,-24,2,1,-22,9);grd.addColorStop(0,'#e8c070');grd.addColorStop(1,'#b8844a');
  cx.fillStyle=grd;cx.beginPath();cx.ellipse(1,-23,8,11,0,0,Math.PI*2);cx.fill();cx.restore();
  // Sprint dust
  if(sprint&&stamina>0&&(Math.abs(player.vx)>.5||Math.abs(player.vy)>.5)){
    cx.fillStyle='rgba(255,255,255,0.3)';for(let i=0;i<3;i++){cx.beginPath();cx.arc(-player.vx*(i+1)*4,-player.vy*(i+1)*4+5,3-i,0,Math.PI*2);cx.fill()}}
  cx.restore();
}

function drawBanana3D(bx,by,bz,gold,bob){
  cx.save();
  let shadowScale=1-bz*0.05;
  // Shadow on ground
  cx.fillStyle='rgba(0,0,0,'+(0.2*shadowScale)+')';cx.beginPath();cx.ellipse(bx,by,8*shadowScale,3*shadowScale,0,0,Math.PI*2);cx.fill();
  // Banana at height
  let drawY=by-bz*12+Math.sin(bob*.08)*2;
  cx.translate(bx,drawY);cx.rotate(.3);
  if(gold){
    let gg=cx.createRadialGradient(-2,-1,2,0,0,13);gg.addColorStop(0,'#fff44f');gg.addColorStop(1,'#ffaa00');
    cx.fillStyle=gg;cx.beginPath();cx.ellipse(0,0,13,7,0,0,Math.PI*2);cx.fill();
    cx.globalAlpha=.3+Math.sin(bob*.06)*.2;cx.fillStyle='#ffaa00';cx.beginPath();cx.arc(0,0,18,0,Math.PI*2);cx.fill();cx.globalAlpha=1;
    cx.fillStyle='#fff';cx.font='bold 10px system-ui';cx.textAlign='center';cx.fillText('x3',0,-14);
  }else{
    let grd=cx.createRadialGradient(-2,-1,2,0,0,11);grd.addColorStop(0,'#fff44f');grd.addColorStop(1,'#e8b800');
    cx.fillStyle=grd;cx.beginPath();cx.ellipse(0,0,11,5.5,0,0,Math.PI*2);cx.fill();
    cx.fillStyle='#aa8800';cx.beginPath();cx.arc(9,-2,2.5,0,Math.PI*2);cx.fill();
    cx.globalAlpha=.25+Math.sin(bob*.1)*.12;cx.fillStyle='#ffee88';cx.beginPath();cx.arc(0,0,14,0,Math.PI*2);cx.fill();cx.globalAlpha=1;
  }
  cx.restore();
}

function drawTree(t){
  let shx=t.shake?Math.sin(tick*2)*t.shake*.15:0;
  cx.fillStyle='#5a3a1a';cx.fillRect(t.x-4+shx,t.y-t.h,8,t.h);
  let grd=cx.createRadialGradient(t.x+shx,t.y-t.h,5,t.x+shx,t.y-t.h,24);grd.addColorStop(0,'#2a8a1a');grd.addColorStop(1,'#1a6a12');
  cx.fillStyle=grd;cx.beginPath();cx.arc(t.x+shx,t.y-t.h,24,0,Math.PI*2);cx.fill();
  cx.fillStyle='#228a18';cx.beginPath();cx.arc(t.x-8+shx,t.y-t.h-6,16,0,Math.PI*2);cx.fill();
  // Safe zone ring
  if(t.safe){cx.strokeStyle='rgba(0,200,0,0.2)';cx.lineWidth=1;cx.setLineDash([3,3]);cx.beginPath();cx.arc(t.x,t.y,30,0,Math.PI*2);cx.stroke();cx.setLineDash([])}
}

// ═══ Update ═══
function update(){
  updateScreenShake();updateWipe();
  if(hitStopTimer>0){hitStopTimer--;return}
  if(phase==='title'||phase==='opening'||phase==='victory'||phase==='gameover'||phase==='peace_victory')return;

  // Rest phase
  if(phase==='rest'){waveRestTimer--;
    if(waveRestTimer<=0){wave++;
      if(wave>=WAVE_CFG.length){phase='victory';score+=500*wave;sfxVic();stopMusic();
        showM('MORI WA MODOTTA!',300);if(score>hi){hi=score;try{localStorage.setItem('goriketsu-hi',String(score))}catch(e){}}endGameSubmit('victory');return}
      gorilla.state='sleeping';gorilla.anger=wave*15;gorilla.x=0;gorilla.y=0;gorilla.vx=0;gorilla.vy=0;
      phase='sneak';showM(WAVE_CFG[wave].msg,90)}
    pts=pts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life--;return p.life>0});return}

  tick++;
  if(msgTick>0){msgTick--;if(msgTick===0)msg=''}
  if(comboTimer>0){comboTimer--;if(comboTimer===0)combo=0}

  // ── Player input (keyboard + touch joystick) ──
  let dx=0,dy=0;
  if(keys.ArrowLeft||keys.KeyA||keys.a)dx-=1;
  if(keys.ArrowRight||keys.KeyD||keys.d)dx+=1;
  if(keys.ArrowUp||keys.KeyW||keys.w)dy-=1;
  if(keys.ArrowDown||keys.KeyS||keys.s)dy+=1;
  if(touchJoy.active){dx+=touchJoy.dx;dy+=touchJoy.dy}
  sprint=keys.ShiftLeft||keys.ShiftRight||keys.Shift||(touchJoy.active&&Math.hypot(touchJoy.dx,touchJoy.dy)>.85);
  let len=Math.hypot(dx,dy);if(len>0){dx/=len;dy/=len}
  let speed=3.2;
  if(sprint&&stamina>0){speed=5.5;stamina=Math.max(0,stamina-1.2)}
  else if(stamina<100)stamina=Math.min(100,stamina+.4);
  player.vx+=dx*speed*.3;player.vy+=dy*speed*.3;

  // ── Slap action ──
  if(slap&&phase==='sneak'){
    slap=false;
    let d=player.distTo(gorilla);
    if(d<SR){
      sfxSlap();setTimeout(sfxRoar,200);
      phase='alert';gorilla.state='waking';gorilla.wakeTimer=60;gorilla.anger=30;
      score+=100;sp(gorilla.x,gorilla.y-20,'#ff3333',12,'BACHI!!');
      shakeScreen(12,20);hitStop(6);
      showM('ZETTAI ZETSUMEI !!',90);tutDone=true;
      // Bananas fall from all nearby trees!
      spawnBananasFromTrees();
      // Shake all trees
      for(let t of trees)if(player.distTo(t)<150)t.shakeTree();
    }else showM('toodoi! motto chikadzuke!',45);
  }
  slap=false;

  // ── Peaceful path: wait 30s without slapping → gorilla wakes peacefully ──
  if(phase==='sneak'&&!peacePath){
    peaceTimer++;
    // Hint at 15s
    if(peaceTimer===900)showM('...gorira ga ugoki hajimeta...',90);
    // Peaceful wake at 30s
    if(peaceTimer>=1800){
      peacePath=true;tutDone=true;
      gorilla.state='waking_peace';gorilla.wakeTimer=90;
      showM('gorira ga sotto me wo aketa...',120);
      sfxPeace();
    }
  }

  // ── Actor physics updates ──
  player.update();gorilla.update();
  for(let t of trees)t.update();
  for(let b of bananas)b.update();

  // ── Tree collision (player & gorilla bounce off trees) ──
  for(let t of trees){
    player.collideWith(t,1);
    if(gorilla.state==='chasing'){
      if(gorilla.collideWith(t,1.5)){
        t.shakeTree(); // gorilla smashing into tree shakes it
        // Tree hit spawns extra banana!
        if(rng()<.3){
          let b=new Banana(t.x+(rng()-.5)*20,t.y+(rng()-.5)*20,false);
          bananas.push(b);sfxDrop(); // bonus banana — does NOT increase target
        }
      }
    }
  }

  // ── Banana collection ──
  for(let b of bananas){if(b.collected||!b.grounded)continue;
    if(player.distTo(b)<BR+player.r){
      b.collected=true;b.active=false;bananaCount++;combo++;comboTimer=90;
      let mult=b.gold?3:1;let bonus=10*combo*mult;score+=bonus;
      sfxBanana();sp(b.x,b.y,b.gold?'#ffaa00':'#ffdd00',b.gold?8:5,'+'+bonus);
      if(b.gold)showM('GOLDEN BANANA! x3!',40);
      if(combo>=3){sfxCombo();showM('COMBO x'+combo+'!',40)}
    }
  }

  // ── Hiding behind trees ──
  if(phase==='chase'&&!hiding){
    for(let t of trees){if(t.safe&&player.distTo(t)<28){hiding=true;hideTimer=180;showM('Ki ni kakureta!',40);break}}
  }
  if(hiding){hideTimer--;if(hideTimer<=0){hiding=false;showM('Mitsukatta!',30)}}

  // ── Gorilla AI ──
  gorilla.buttPulse=.3+Math.abs(Math.sin(tick*.08))*.7;
  if(gorilla.state==='sleeping'){if(tick%90===0)sfxSnore();if(tick%40===0)sp(gorilla.x+15,gorilla.y-30,'#aaf',1,'Z')}
  if(gorilla.state==='waking_peace'){
    gorilla.wakeTimer--;
    // Gorilla slowly opens eyes, looks at player, stands up gently
    if(gorilla.wakeTimer===60)showM('gorira ga kocchi wo mita...',60);
    if(gorilla.wakeTimer===30){showM('...banana wo sashidashita!',90);
      // Gorilla gives banana to player
      let b=new Banana(gorilla.x,gorilla.y-20,true);b.z=0;b.grounded=true;bananas.push(b);bananasNeeded=1}
    if(gorilla.wakeTimer<=0){
      gorilla.state='friendly';
      phase='peace_victory';score+=2000;sfxPeace();stopMusic();
      showM('tataku yori wakariaeta!',300);endGameSubmit('peace_victory');
      if(score>hi){hi=score;try{localStorage.setItem('goriketsu-hi',String(score))}catch(e){}}
    }
  }
  if(gorilla.state==='waking'){gorilla.wakeTimer--;gorilla.chestBeat=Math.sin(tick*.5)>0?1:0;if(tick%10===0)sfxCB();
    if(gorilla.wakeTimer<=0){gorilla.state='chasing';phase='chase';sfxRoar();showM('NIGEROOOO!!',60)}}
  if(gorilla.state==='chasing'){
    let wc=WAVE_CFG[wave]||WAVE_CFG[WAVE_CFG.length-1];
    gorilla.anger=Math.min(100,gorilla.anger+.08);
    let cs=wc.spd+(gorilla.anger/100)*(wc.maxS-wc.spd);
    if(hiding){let wa=tick*.02;gorilla.vx+=Math.cos(wa)*.3;gorilla.vy+=Math.sin(wa)*.3}
    else{let gdx=player.x-gorilla.x,gdy=player.y-gorilla.y,gd=Math.hypot(gdx,gdy);
      if(gd>1){gorilla.vx+=(gdx/gd)*cs*.2;gorilla.vy+=(gdy/gd)*cs*.2}}
    if(wc.gp&&tick%120===0&&gorilla.anger>30){sfxGP();sp(gorilla.x,gorilla.y,'#8B4513',8,'DODO!!')}
    if(tick%150===0)sfxRoar();if(tick%8===0)sp(gorilla.x,gorilla.y+15,'#654321',2);

    // Near-miss
    let pd=player.distTo(gorilla);
    if(pd<CR+12&&pd>=CR&&!hiding){
      if(nearMissTimer<=0){nearMissTimer=30;nearMissCount++;score+=25*nearMissCount;
        sp(player.x,player.y-30,'#ff4444',3,'ABUNAI! +'+25*nearMissCount)}
    }
    if(nearMissTimer>0)nearMissTimer--;
    if(pd<CR+40&&tick%30===0&&!hiding)sfxHB();

    // ═══ GORILLA KNOCKBACK — player gets launched! ═══
    if(invincTimer>0)invincTimer--;
    if(!hiding&&invincTimer<=0&&pd<CR+player.r){
      let hit=player.collideWith(gorilla,14); // massive knockback — FLY!!
      if(hit){
        sfxKnock();sp(player.x,player.y,'#ff4444',10,'FUKITOBASHI!!');
        showM('FUKITOBASHI!!',30);score-=50;if(score<0)score=0;
        shakeScreen(18,25);hitStop(8);
        invincTimer=90; // 1.5s invincibility after hit
        lives--;
        if(lives<=0){
          phase='gameover';gorilla.state='caught';sfxCaught();stopMusic();showM('TSUKAMATTA...',300);shakeScreen(20,30);
          sp(player.x,player.y,'#ff0000',15,'GYAA!');
          if(score>hi){hi=score;try{localStorage.setItem('goriketsu-hi',String(score))}catch(e){}}
          endGameSubmit('gameover');
        }
      }
    }
  }

  // ── Wave clear ──
  let collected=bananas.filter(b=>b.collected).length;
  let grounded=bananas.filter(b=>b.grounded&&!b.collected).length;
  if(phase==='chase'&&collected>=bananasNeeded){
    if(wave>=WAVE_CFG.length-1){phase='victory';score+=500*(wave+1);sfxVic();stopMusic();shakeScreen(10,15);
      showM('MORI WA MODOTTA!',300);if(score>hi){hi=score;try{localStorage.setItem('goriketsu-hi',String(score))}catch(e){}}endGameSubmit('victory')}
    else{phase='rest';waveRestTimer=120;showM('Wave '+(wave+1)+' CLEAR!',90);sfxVic();sfxWaveBanner();shakeScreen(6,10);gorilla.state='resting';gorilla.vx=0;gorilla.vy=0}
  }

  // ── Tutorial ──
  if(!tutDone&&tutStep<TUT.length){tutTimer--;if(tutTimer<=0){tutStep++;if(tutStep<TUT.length)tutTimer=TUT[tutStep].dur;else tutDone=true}}

  pts=pts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life--;return p.life>0});
  // Camera with look-ahead (Nintendo-style: camera leads player movement)
  let lookX=player.x+player.vx*12,lookY=player.y+player.vy*12;
  camX+=(lookX-camX)*.06;camY+=(lookY-camY)*.06;
}

// ═══ Draw ═══
function draw(){
  cx.fillStyle='#1a0e05';cx.fillRect(0,0,W,H); // burnt wasteland background
  cx.save();cx.translate(W/2-camX+screenShakeX,H/2-camY+screenShakeY);
  // Burnt wasteland outside arena
  cx.fillStyle='#1a0e05';cx.fillRect(-ARENA-200,-ARENA-200,ARENA*2+400,ARENA*2+400);
  // Dead stumps outside
  for(let i=0;i<20;i++){let a=(i/20)*Math.PI*2,r=ARENA+30+i*8;
    cx.fillStyle='#2a1a0a';cx.fillRect(Math.cos(a)*r-3,Math.sin(a)*r-15,6,15);
    // Smoke wisps
    if(i%3===0){cx.fillStyle='rgba(80,70,60,'+(0.15+Math.sin(tick*.003+i)*.08)+')';cx.beginPath();cx.arc(Math.cos(a)*r,Math.sin(a)*r-20-(tick*.01+i*5)%30,8,0,Math.PI*2);cx.fill()}}
  // Ash patches
  for(let i=0;i<15;i++){let a=(i/15)*Math.PI*2+.5,r=ARENA+20+i*12;
    cx.fillStyle='rgba(40,30,20,0.4)';cx.beginPath();cx.ellipse(Math.cos(a)*r,Math.sin(a)*r,15+i*2,6+i,a,0,Math.PI*2);cx.fill()}
  // Green jungle arena (the last remaining forest)
  cx.fillStyle='#0d3808';cx.fillRect(-ARENA,-ARENA,ARENA*2,ARENA*2);
  cx.strokeStyle='#0a2f06';cx.lineWidth=.5;
  for(let i=-ARENA;i<=ARENA;i+=40){cx.beginPath();cx.moveTo(i,-ARENA);cx.lineTo(i,ARENA);cx.stroke();cx.beginPath();cx.moveTo(-ARENA,i);cx.lineTo(ARENA,i);cx.stroke()}
  cx.strokeStyle='#2a5a1a';cx.lineWidth=3;cx.strokeRect(-ARENA,-ARENA,ARENA*2,ARENA*2);
  // Trees (behind)
  for(let t of trees)drawTree(t);
  // Bananas (SDF 3D with height)
  for(let b of bananas){if(!b.collected)drawBanana3D(b.x,b.y,b.z,b.gold,b.bobble)}
  // Gorilla
  let gs=gorilla.state==='waking'?1+gorilla.chestBeat*.08:1;
  drawGorilla(gorilla.x,gorilla.y,gs,gorilla.anger);
  // Player (unless hiding)
  if(invincTimer>0&&tick%4<2){}else{if(!hiding||tick%10<7)drawPlayer(player.x,player.y,1)}
  // Particles
  for(let p of pts){cx.globalAlpha=p.life/p.maxLife;if(p.text){cx.fillStyle=p.color;cx.font='bold 16px system-ui';cx.textAlign='center';cx.fillText(p.text,p.x,p.y)}else{cx.fillStyle=p.color;cx.beginPath();cx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2);cx.fill()}cx.globalAlpha=1}
  // Distance line (sneak)
  if(phase==='sneak'){
    let d=player.distTo(gorilla);
    if(d<80){cx.strokeStyle=d<SR?'#ff4444':'#ffaa44';cx.setLineDash([4,4]);cx.lineWidth=2;cx.beginPath();cx.moveTo(player.x,player.y);cx.lineTo(gorilla.x,gorilla.y);cx.stroke();cx.setLineDash([])}
    // Peace timer visual hint (subtle, growing)
    if(peaceTimer>600){let prog=Math.min(1,(peaceTimer-600)/1200);
      cx.strokeStyle='rgba(100,255,150,'+(prog*.4)+')';cx.lineWidth=2;
      cx.beginPath();cx.arc(gorilla.x,gorilla.y,35+prog*15,0,Math.PI*2*prog);cx.stroke();
    }
  }
  cx.restore();

  // HUD
  cx.fillStyle='rgba(0,0,0,0.7)';cx.fillRect(0,0,W,44);
  cx.fillStyle='#ffdd33';cx.font='bold 18px system-ui';cx.textAlign='left';cx.fillText('SCORE: '+score,12,28);
  cx.fillStyle='#ffee66';cx.font='14px system-ui';cx.fillText('HI: '+hi,180,28);
  // Lives (gorilla icons)
  for(let i=0;i<3;i++){let lx=W/2-36+i*24,ly=30;cx.font='18px system-ui';cx.textAlign='center';cx.fillStyle=i<lives?'#ff6644':'#333';cx.fillText('\uD83E\uDD8D',lx,ly)}
  if(invincTimer>0&&tick%8<4){cx.fillStyle='rgba(255,100,100,0.15)';cx.fillRect(0,0,W,H)}
  cx.fillStyle='#ffe033';cx.font='bold 16px system-ui';cx.textAlign='right';cx.fillText('BANANA: '+bananaCount+'/'+bananasNeeded,W-12,28);
  cx.fillStyle='#aaa';cx.font='bold 14px system-ui';cx.textAlign='center';cx.fillText('WAVE '+(wave+1)+'/'+WAVE_CFG.length,W/2,16);
  // Stamina bar
  let bW2=120,bX2=W/2-60;cx.fillStyle='#333';cx.fillRect(bX2,32,bW2,8);
  cx.fillStyle=stamina>30?'#44cc44':'#cc4444';cx.fillRect(bX2,32,bW2*stamina/100,8);
  cx.fillStyle='#aaa';cx.font='10px system-ui';cx.fillText('STAMINA',W/2,30);
  if(combo>=2){cx.fillStyle='#ff8800';cx.font='bold 20px system-ui';cx.fillText('COMBO x'+combo,W/2,72)}
  // Wave banner (rest phase)
  if(phase==='rest'&&waveRestTimer>60){let bp=(120-waveRestTimer)/60;let ea=bp<.5?2*bp*bp:1-Math.pow(-2*bp+2,2)/2;
    cx.fillStyle='rgba(0,0,0,'+(0.7*ea)+')';cx.fillRect(0,H/2-50,W,100);
    cx.globalAlpha=ea;cx.fillStyle='#ffdd33';cx.font='bold 36px system-ui';cx.fillText('WAVE '+(wave+1)+' CLEAR!',W/2,H/2+5);
    cx.fillStyle='#88ff88';cx.font='16px system-ui';cx.fillText('NEXT WAVE INCOMING...',W/2,H/2+32);cx.globalAlpha=1}
  // Message (Nintendo-style: big impact text with outline)
  if(msg){let isZ=msg.includes('ZETTAI')||msg.includes('FUKI')||msg.includes('FINAL');
    let isWave=msg.includes('Wave');cx.save();cx.textAlign='center';
    let ma=Math.min(1,msgTick/15);cx.globalAlpha=ma;
    if(isZ){cx.translate(W/2+Math.sin(tick*.5)*4,H/2-40);cx.fillStyle='#ff0000';cx.font='bold 40px system-ui';
      cx.strokeStyle='#440000';cx.lineWidth=3;cx.strokeText(msg,0,0);cx.fillText(msg,0,0)}
    else if(isWave){cx.translate(W/2,H/2-40);let ws=1.2-ma*.2;cx.scale(ws,ws);
      cx.fillStyle='#ffdd33';cx.font='bold 32px system-ui';cx.strokeStyle='#664400';cx.lineWidth=2;cx.strokeText(msg,0,0);cx.fillText(msg,0,0)}
    else{cx.fillStyle='#fff';cx.font='bold 22px system-ui';cx.fillText(msg,W/2,H/2-40)}
    cx.restore()}
  // Anger meter
  if(phase==='chase'){cx.fillStyle='rgba(0,0,0,0.6)';cx.fillRect(W-140,50,130,20);
    cx.fillStyle='rgb('+(200+gorilla.anger*.55|0)+','+(50-gorilla.anger*.4|0)+',20)';cx.fillRect(W-138,52,126*gorilla.anger/100,16);

  // Hiding
  if(hiding){cx.fillStyle='rgba(0,100,0,0.12)';cx.fillRect(0,0,W,H);cx.fillStyle='#88ff88';cx.font='bold 14px system-ui';cx.textAlign='center';cx.fillText('HIDING... '+(hideTimer/60|0)+'s',W/2,H-30)}
  // Virtual joystick overlay (touch)
  if(touchJoy.active){

    cx.beginPath();cx.arc(touchJoy.sx,touchJoy.sy,60,0,Math.PI*2);cx.stroke();
    cx.globalAlpha=.5;cx.fillStyle='#fff';
    cx.beginPath();cx.arc(touchJoy.sx+touchJoy.dx*60,touchJoy.sy+touchJoy.dy*60,20,0,Math.PI*2);cx.fill();
    cx.restore();
  }
  // Touch slap hint
  if(phase==='sneak'&&!touchJoy.active&&'ontouchstart' in window){

  // Version tag (always visible)
  cx.fillStyle='rgba(100,100,100,0.4)';cx.font='10px system-ui';cx.textAlign='right';cx.fillText(VER,W-6,H-4);
  drawWipe();
  // Tutorial
  if(!tutDone&&tutStep<TUT.length){let t=TUT[tutStep];let a=Math.min(1,tutTimer/15);cx.save();cx.globalAlpha=a;
    cx.fillStyle='rgba(0,0,0,0.75)';cx.fillRect(0,H-80,W,70);cx.fillStyle='#fff';cx.font='bold 20px system-ui';cx.textAlign='center';cx.fillText(t.text,W/2,H-40);
    cx.fillStyle='#555';cx.font='12px system-ui';cx.fillText((tutStep+1)+'/'+TUT.length,W-15,H-15);cx.restore()}
}

// ═══ Nintendo-Style Title Animation ═══
function initTitleAnim(){
  let ta=titleAnim;ta.stage=0;ta.timer=0;ta.letterIdx=0;ta.logoY=-120;ta.logoVY=0;ta.logoBounce=0;
  ta.subtitleAlpha=0;ta.gorBreath=0;ta.pressAlpha=0;ta.pressDir=1;ta.bgScroll=0;ta.ready=false;
  ta.stars=[];for(let i=0;i<40;i++)ta.stars.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*3,sp:.5+Math.random()*2,a:Math.random()});
  ta.sparkles=[];
}
initTitleAnim();

function updateTitleAnim(){
  let ta=titleAnim;ta.timer++;ta.bgScroll+=.3;ta.gorBreath=Math.sin(ta.timer*.04)*.03;
  // Stars twinkle
  for(let s of ta.stars){s.y-=s.sp;s.a=.3+Math.sin(ta.timer*.05+s.x)*.7;if(s.y<-10){s.y=H+10;s.x=Math.random()*W}}
  // Sparkles
  if(ta.timer%3===0&&ta.stage>=2)ta.sparkles.push({x:W*.2+Math.random()*W*.6,y:80+Math.random()*100,life:30,s:2+Math.random()*4});
  ta.sparkles=ta.sparkles.filter(s=>{s.life--;s.y-=.5;return s.life>0});

  // Stage machine
  if(ta.stage===0){// Black → logo drops
    if(ta.timer>30){ta.stage=1;ta.timer=0;sfxLogoDrop()}}
  if(ta.stage===1){// Logo falling with gravity + bounce
    ta.logoVY+=.8;ta.logoY+=ta.logoVY;
    if(ta.logoY>=130){ta.logoY=130;ta.logoVY*=-.4;ta.logoBounce++;
      if(ta.logoBounce===1){sfxLogoLand();shakeScreen(8,12)}
      if(ta.logoBounce>=3){ta.logoVY=0;ta.logoY=130;ta.stage=2;ta.timer=0;sfxTitleReveal()}}}
  if(ta.stage===2){// Subtitle letter-by-letter reveal
    let sub='ZETTAI ZETSUMEI !!';
    if(ta.timer%3===0&&ta.letterIdx<sub.length)ta.letterIdx++;
    ta.subtitle=sub.substring(0,ta.letterIdx);
    if(ta.letterIdx>=sub.length&&ta.timer>60){ta.stage=3;ta.timer=0}}
  if(ta.stage===3){// Gorilla fade in + "PRESS START" blink
    ta.subtitleAlpha=Math.min(1,ta.subtitleAlpha+.03);
    ta.pressAlpha+=ta.pressDir*.025;
    if(ta.pressAlpha>=1)ta.pressDir=-1;if(ta.pressAlpha<=.2)ta.pressDir=1;
    if(ta.timer>30)ta.ready=true}
}

function drawTitle(){
  let ta=titleAnim;updateTitleAnim();
  // Background — parallax jungle silhouettes
  cx.fillStyle='#060f04';cx.fillRect(0,0,W,H);
  // Stars
  for(let s of ta.stars){cx.globalAlpha=s.a*.6;cx.fillStyle='#ffffcc';cx.beginPath();cx.arc(s.x,s.y,s.s*.5,0,Math.PI*2);cx.fill()}
  cx.globalAlpha=1;
  // Parallax tree silhouettes (3 layers)
  for(let layer=0;layer<3;layer++){let lf=.15+layer*.12;let col=['#081a04','#0a2206','#0d2a08'][layer];
    cx.fillStyle=col;for(let i=0;i<10+layer*5;i++){let tx=((i*110+ta.bgScroll*(1+layer*.3))%(W+120))-60;let th=100+layer*50+Math.sin(i*2.3)*30;
      cx.fillRect(tx-4,H-th,8,th);cx.beginPath();cx.arc(tx,H-th,20+layer*8+Math.sin(i*1.7)*8,0,Math.PI*2);cx.fill()}}
  // Ground
  cx.fillStyle='#0a1f06';cx.fillRect(0,H-50,W,50);

  // Sparkles
  for(let s of ta.sparkles){cx.globalAlpha=s.life/30;cx.fillStyle='#ffeeaa';
    cx.save();cx.translate(s.x,s.y);cx.rotate(s.life*.2);
    cx.fillRect(-s.s/2,-1,s.s,2);cx.fillRect(-1,-s.s/2,2,s.s);cx.restore()}
  cx.globalAlpha=1;

  cx.textAlign='center';

  // Gorilla (sleeping, breathing)

  // HOW TO PLAY box
  if(ta.ready){
    cx.fillStyle='rgba(0,0,0,0.7)';cx.beginPath();cx.roundRect(60,418,W-120,118,12);cx.fill();
    cx.strokeStyle='#2a6a2a';cx.lineWidth=2;cx.beginPath();cx.roundRect(60,418,W-120,118,12);cx.stroke();

    let bGlow=.6+Math.sin(ta.timer*.08)*.4;
    cx.shadowColor='rgba(255,68,34,'+bGlow+')';cx.shadowBlur=20;
    cx.fillStyle='#ff4422';cx.beginPath();cx.roundRect(W/2-110,548+bp,220,46,14);cx.fill();
    cx.shadowBlur=0;
    cx.fillStyle='#fff';cx.font='bold 22px system-ui';cx.fillText('KETSU WO TATAKE!',W/2,578+bp);

    // "PRESS START" blink
    cx.globalAlpha=ta.pressAlpha;
    cx.fillStyle='#ffdd33';cx.font='bold 16px system-ui';cx.fillText('\u25B6 PRESS SPACE or TAP \u25C0',W/2,H-42);

  if(hi>0){cx.fillStyle='#aaa';cx.font='14px system-ui';cx.fillText('HIGH SCORE: '+hi,W/2,H-12)}

}

function bootToOpening(){if(phase==='boot'&&bootReady){ensA();sfxMenuSelect();phase='opening';opTime=0;ensureMusic()}}
function onClick(e){let r=cv.getBoundingClientRect(),sx=W/r.width,sy=H/r.height,mx=(e.clientX-r.left)*sx,my=(e.clientY-r.top)*sy;
  if(phase==='boot'){bootToOpening();return}
  if(wipeProgress>=0)return;
  if(phase==='title'){ensA();sfxMenuSelect();if(!opPlayed){opPlayed=true;startOp()}else{startWipe(()=>initGame())}}
  else if(phase==='opening'){startWipe(()=>initGame())}
  else if(phase==='victory'||phase==='gameover'||phase==='peace_victory'){if(mx>W/2-100&&mx<W/2+100&&my>470&&my<610){sfxMenuSelect();leaderboardData=null;startWipe(()=>{initTitleAnim();initGame()})}}}
cv.addEventListener('click',onClick);
// ═══ Virtual Joystick (touch) ═══
let touchJoy={active:false,id:-1,sx:0,sy:0,cx:0,cy:0,dx:0,dy:0};
let touchSlap={active:false,id:-1};
cv.addEventListener('touchstart',function(e){e.preventDefault();
  for(let t of e.changedTouches){
    let r=cv.getBoundingClientRect(),tx=(t.clientX-r.left)/r.width*W,ty=(t.clientY-r.top)/r.height*H;
    if(phase==='boot'||phase==='title'||phase==='opening'||phase==='victory'||phase==='gameover'||phase==='peace_victory'){onClick({clientX:t.clientX,clientY:t.clientY});continue}
    // Left half = joystick, Right half = slap
    if(tx<W/2){touchJoy.active=true;touchJoy.id=t.identifier;touchJoy.sx=tx;touchJoy.sy=ty;touchJoy.cx=tx;touchJoy.cy=ty;touchJoy.dx=0;touchJoy.dy=0}
    else{touchSlap.active=true;touchSlap.id=t.identifier;slap=true}
  }
});
cv.addEventListener('touchmove',function(e){e.preventDefault();
  for(let t of e.changedTouches){
    if(t.identifier===touchJoy.id){
      let r=cv.getBoundingClientRect();touchJoy.cx=(t.clientX-r.left)/r.width*W;touchJoy.cy=(t.clientY-r.top)/r.height*H;
      let jdx=touchJoy.cx-touchJoy.sx,jdy=touchJoy.cy-touchJoy.sy;
      let jl=Math.hypot(jdx,jdy);let maxR=60;
      if(jl>maxR){jdx=jdx/jl*maxR;jdy=jdy/jl*maxR}
      touchJoy.dx=jdx/maxR;touchJoy.dy=jdy/maxR;
    }
  }
});
cv.addEventListener('touchend',function(e){e.preventDefault();
  for(let t of e.changedTouches){
    if(t.identifier===touchJoy.id){touchJoy.active=false;touchJoy.dx=0;touchJoy.dy=0;touchJoy.id=-1}
    if(t.identifier===touchSlap.id){touchSlap.active=false;touchSlap.id=-1}
  }
});
cv.addEventListener('touchcancel',function(e){touchJoy.active=false;touchJoy.dx=0;touchJoy.dy=0;touchJoy.id=-1;touchSlap.active=false;touchSlap.id=-1});
window.addEventListener('keydown',function(e){keys[e.code]=true;keys[e.key]=true;
  if(phase==='boot'){bootToOpening();return}
  if(e.code==='Space'||e.key===' '){e.preventDefault();
    if(phase==='title'&&wipeProgress<0){ensA();sfxMenuSelect();if(!opPlayed){opPlayed=true;startOp()}else{startWipe(()=>initGame())}}
    else if(phase==='opening'&&wipeProgress<0){startWipe(()=>initGame())}
    else slap=true}
  if(e.code==='Enter'&&(phase==='victory'||phase==='gameover'||phase==='peace_victory')&&wipeProgress<0){sfxMenuSelect();startWipe(()=>{initTitleAnim();initGame()})}
});
window.addEventListener('keyup',function(e){keys[e.code]=false;keys[e.key]=false});

// ═══ Loop ═══
function loop(){let now=performance.now(),dt=now-lastT;lastT=now;
  if(phase==='boot'){drawBoot(dt);requestAnimationFrame(loop);return}
  update();
  if(phase==='opening'){drawOp(dt);drawWipe()}else if(phase==='title')drawTitle();
  else if(phase==='victory'||phase==='gameover'||phase==='peace_victory'){draw();drawEnd()}else draw();
  requestAnimationFrame(loop)}
loop();
})();
</script>
</body>
