<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="description" content="Goriketsu Dash!! — KAMI Engine WebGPU"/>
<title>Goriketsu Dash!! (KAMI Engine WebGPU)</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif}
.gc{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#060f04;touch-action:none;user-select:none;-webkit-user-select:none;flex-direction:column}
canvas{max-width:100%;max-height:calc(100% - 60px);aspect-ratio:4/3;border-radius:4px}
.hud{position:fixed;top:0;left:0;right:0;height:44px;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#ffdd33;font-size:14px;font-weight:bold;z-index:10}
.hud .score{font-size:18px}
.hud .wave{color:#aaa;font-size:13px}
.hud .banana{color:#ffe033;font-size:15px}
.controls{position:fixed;bottom:0;left:0;right:0;height:50px;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;gap:8px;color:#888;font-size:12px;z-index:10}
.controls kbd{background:#333;color:#ddd;padding:2px 8px;border-radius:4px;font-size:11px}
.loading{color:#88cc88;font-size:20px;text-align:center}
.error{color:#ff6644;font-size:16px;text-align:center;max-width:600px;padding:20px}
</style>
</head>
<body>
<div class="hud" id="hud" style="display:none">
  <span class="score" id="hud-score">SCORE: 0</span>
  <span class="wave" id="hud-wave">WAVE 1/3</span>
  <span class="banana" id="hud-banana">BANANA: 0/0</span>
</div>
<div class="gc" id="container">
  <div class="loading" id="loading">
    KAMI Engine WebGPU<br>
    <small>Loading WASM + Scene...</small>
  </div>
  <canvas id="gc" width="1024" height="768" style="display:none"></canvas>
</div>
<div class="controls" id="controls" style="display:none">
  <kbd>WASD</kbd> Move
  <kbd>E</kbd> Slap
  <kbd>Space</kbd> Sprint
</div>

<script type="module">
import init, { run_with_game } from '/kami_web.js';

const loading = document.getElementById('loading');
const canvas = document.getElementById('gc');
const hud = document.getElementById('hud');
const controls = document.getElementById('controls');

async function start() {
  try {
    // Check WebGPU
    if (!navigator.gpu) {
      loading.innerHTML = '<div class="error">WebGPU is not supported in this browser.<br>Try Chrome 113+ or Edge 113+.</div>';
      return;
    }

    loading.textContent = 'Initializing WASM...';
    await init();

    loading.textContent = 'Loading scene...';
    const sceneResp = await fetch('/scenes/ketsu-gorilla-jungle.jsonld');
    let sceneJson;
    if (sceneResp.ok) {
      sceneJson = await sceneResp.text();
    } else {
      // Fallback: use island_gen scene (minimal)
      sceneJson = JSON.stringify({
        "@context": "https://etzhayyim.co.jp/ns/kami/scene",
        "@type": "IslandScene",
        name: "Goriketsu Dash!!",
        genre: "chase",
        ambient_color: [0.05, 0.08, 0.03],
        sun_direction: [-0.5, -2.0, -1.0],
        sun_intensity: 2.0,
        entities: [
          // Ground
          { id: "ground", position: [0, -0.5, 0], rotation: [0,0,0,1], scale: [60, 1, 60],
            mesh: { Plane: { color: [0.08, 0.35, 0.05, 1.0], width: 60, depth: 60, subdivisions: 1 } }, components: [] },
          // Gorilla
          { id: "gorilla", position: [0, 1.4, 0], rotation: [0,0,0,1], scale: [1,1,1],
            mesh: { Sphere: { color: [0.25, 0.15, 0.08, 1.0], radius: 1.8 } }, components: [] },
          // Gorilla butt
          { id: "gorilla-butt", position: [0, 1.0, -1.0], rotation: [0,0,0,1], scale: [2.2, 2.2, 2.2],
            mesh: { Sphere: { color: [0.9, 0.15, 0.1, 1.0], radius: 1.1 } }, components: [] },
          // Player
          { id: "player", position: [0, 0.8, -18], rotation: [0,0,0,1], scale: [1,1,1],
            mesh: { Cube: { color: [0.16, 0.16, 0.3, 1.0] } },
            components: [{ PlayerSpawn: null }] },
          // Trees (12)
          ...Array.from({length: 12}, (_, i) => {
            const a = (i / 12) * Math.PI * 2;
            const r = 8 + (i * 1.7) % 14;
            return { id: `tree-${i}`, position: [Math.cos(a)*r, 3, Math.sin(a)*r], rotation: [0,0,0,1], scale: [1,1,1],
              mesh: { Cylinder: { color: [0.35, 0.22, 0.1, 1.0], h: 6 + (i*0.7)%3, r1: 0.5, r2: 0.3 } }, components: [] };
          }),
          // Bananas (pre-allocate 10 slots)
          ...Array.from({length: 10}, (_, i) => ({
            id: `banana-${i}`, position: [0, -10, 0], rotation: [0,0,0,1], scale: [0,0,0],
            mesh: { Sphere: { color: [1.0, 0.88, 0.2, 1.0], radius: 0.3 } }, components: []
          })),
        ],
        characters: [],
        camera_mode: null,
        layers: [],
        viewport: null,
      });
    }

    loading.textContent = 'Starting game...';
    canvas.style.display = 'block';
    loading.style.display = 'none';
    hud.style.display = 'flex';
    controls.style.display = 'flex';

    await run_with_game('gc', sceneJson, 'ketsu-gorilla');

  } catch (e) {
    console.error(e);
    loading.innerHTML = `<div class="error">Failed to start:<br>${e}</div>`;
  }
}

start();
</script>
</body>
</html>
