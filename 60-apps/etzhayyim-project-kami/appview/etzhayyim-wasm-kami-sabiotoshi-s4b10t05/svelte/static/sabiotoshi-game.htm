<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<title>Sabi-Otoshi!! — KAMI Engine WebGPU</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#f0ead6;font-family:'Nunito','Hiragino Kaku Gothic ProN',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:10;padding:10px 14px}
#hud-top{display:flex;justify-content:space-between;align-items:flex-start}
.hud-box{background:rgba(255,255,255,.85);border-radius:12px;padding:6px 12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#hud-item{font-weight:900;font-size:16px;color:#3a2a1a}
#hud-item-sub{font-size:12px;color:#8a7a5a;font-weight:700}
#hud-score{font-weight:900;font-size:22px;color:#3a2a1a;text-align:right}
#hud-combo{font-weight:900;font-size:14px;color:#e65100;text-align:right}
#hud-time{font-weight:900;font-size:20px;text-align:center}
#hud-progress{width:120px;height:6px;background:#e0d8c8;border-radius:3px;margin:4px auto 0}
#hud-progress-fill{height:100%;background:#4caf50;border-radius:3px;transition:width .3s}
#hud-msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:900;font-size:24px;color:#3a2a1a;text-shadow:0 2px 6px rgba(255,255,255,.8);z-index:12;pointer-events:none;opacity:0;transition:opacity .3s}
#hud-msg.show{opacity:1}
#hud-rust{margin-top:4px}
#hud-rust-bar{width:100%;height:4px;background:#e0d8c8;border-radius:2px}
#hud-rust-fill{height:100%;background:#1565c0;border-radius:2px;transition:width .15s}
#tools{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;pointer-events:auto}
.tbtn{background:rgba(255,255,255,.88);border:2px solid #ccc;border-radius:10px;padding:6px 10px;font-weight:700;font-size:11px;font-family:inherit;cursor:pointer;transition:all .12s;white-space:nowrap}
.tbtn.active{border-color:#1565c0;background:#e3f2fd;box-shadow:0 2px 6px rgba(21,101,192,.25)}
.tbtn:active{transform:scale(.95)}
#ctrl{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);font-size:11px;color:#8a7a5a;font-weight:700;text-align:center;z-index:10;pointer-events:none}
#fx{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:11}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f0ead6;z-index:20;font-weight:900;color:#3a2a1a}
#ld h1{font-size:40px}
#ld p{font-size:14px;color:#8a7a5a;margin-top:4px}
.bar{width:180px;height:6px;background:#e0d8c8;border-radius:3px;margin-top:14px;overflow:hidden}
.fill{height:100%;background:#1565c0;border-radius:3px;transition:width .3s}
</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet"/>
</head>
<body>
<canvas id="gc"></canvas>

<div id="ld">
  <h1>錆落とし!!</h1>
  <p id="ld-msg">Loading KAMI Engine...</p>
  <div class="bar"><div class="fill" id="ld-fill" style="width:10%"></div></div>
</div>

<div id="hud" style="display:none">
  <div id="hud-top">
    <div class="hud-box">
      <div id="hud-item"></div>
      <div id="hud-item-sub"></div>
      <div id="hud-rust"><div id="hud-rust-bar"><div id="hud-rust-fill" style="width:0%"></div></div></div>
    </div>
    <div class="hud-box" style="text-align:center">
      <div id="hud-time">90s</div>
      <div id="hud-progress"><div id="hud-progress-fill" style="width:0%"></div></div>
    </div>
    <div class="hud-box" style="text-align:right">
      <div id="hud-score">0</div>
      <div id="hud-combo"></div>
    </div>
  </div>
</div>

<div id="hud-msg"></div>

<div id="tools" style="display:none">
  <button class="tbtn active" data-t="0">1:高圧洗浄機</button>
  <button class="tbtn" data-t="1">2:ワイヤーブラシ</button>
  <button class="tbtn" data-t="2">3:サンドペーパー</button>
  <button class="tbtn" data-t="3">4:錆取り液</button>
  <button class="tbtn" data-t="4">5:研磨クロス</button>
  <button class="tbtn" data-t="5">6:超音波洗浄</button>
</div>
<div id="ctrl" style="display:none">ドラッグ:回転 | スクロール:ズーム | Space:ツール適用 | E:分解 | 1-6:ツール切替</div>

<div id="fx"></div>

<script type="module">
// ═══ KamiSound (Web Audio Synth — Nintendo Quality) ═══
let aC=null;
const S={
  _i(){if(!aC)aC=new(window.AudioContext||window.webkitAudioContext)();return aC},
  _o(f,t,d,v,dl){const c=this._i(),tm=c.currentTime+(dl||0);const o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.setValueAtTime(f,tm);g.gain.setValueAtTime(v||.12,tm);g.gain.exponentialRampToValueAtTime(.001,tm+d);o.connect(g);g.connect(c.destination);o.start(tm);o.stop(tm+d)},
  _n(d,v,dl){const c=this._i(),tm=c.currentTime+(dl||0);const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate);const dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=Math.random()*2-1;const s=c.createBufferSource(),g=c.createGain(),fl=c.createBiquadFilter();s.buffer=b;fl.type='bandpass';fl.frequency.value=3000;fl.Q.value=.5;g.gain.setValueAtTime(v||.06,tm);g.gain.exponentialRampToValueAtTime(.001,tm+d);s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(tm);s.stop(tm+d)},
  title_select(){this._o(660,'sine',.06,.12);this._o(880,'sine',.08,.1,.05)},
  nozzle_switch(){this._o(880,'sine',.04,.1);this._o(1100,'sine',.04,.08,.03)},
  spray_loop(){if(Math.random()<.3)this._n(.04,.03);if(Math.random()<.1)this._o(180+Math.random()*40,'sawtooth',.03,.015)},
  spray_hit(){this._n(.06,.05);this._o(300+Math.random()*200,'triangle',.05,.04)},
  zone_clear(){this._o(523,'sine',.1,.14);this._o(659,'sine',.1,.14,.08);this._o(784,'sine',.15,.11,.16);this._n(.04,.04,.08)},
  combo_ding(n){const b=440+Math.min(n||1,12)*40;this._o(b,'sine',.12,.12);this._o(b*1.5,'sine',.08,.06,.06)},
  rust_crack(){this._o(120,'square',.08,.1);this._n(.1,.07);this._o(80,'sawtooth',.12,.05,.05)},
  item_complete(){[523,659,784,1047].forEach((f,i)=>this._o(f,'sine',.2,.14,i*.1));this._n(.05,.05,.3);this._o(1047,'triangle',.4,.08,.4)},
  perfect_finish(){[523,659,784,880,1047,1319].forEach((f,i)=>this._o(f,'sine',.25,.11,i*.08));this._o(1568,'sine',.5,.09,.5)},
  all_clear(){[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>this._o(f,'sine',.3,.14,i*.12));this._n(.1,.05,.9);this._o(1568,'triangle',.8,.09,1)},
  timeout(){this._o(330,'square',.15,.1);this._o(220,'square',.2,.08,.12);this._o(165,'square',.3,.07,.28)},
  error(){this._o(220,'square',.12,.1);this._o(165,'square',.15,.08,.1)},
  tick(){this._o(1600+Math.random()*400,'sine',.02,.04)},
};

// ═══ Haptic ═══
const H={
  _ok:!!navigator.vibrate,
  0(){if(this._ok)navigator.vibrate(15)},
  1(){if(this._ok)navigator.vibrate(40)},
  2(){if(this._ok)navigator.vibrate([60,30,60])},
  3(){if(this._ok)navigator.vibrate([30,50,30,50,80])},
};

// ═══ Float Text Effect ═══
const fx=document.getElementById('fx');
function floatText(text,color){
  const el=document.createElement('div');
  el.textContent=text;
  el.style.cssText=`position:fixed;left:50%;top:40%;color:${color||'#3a2a1a'};font-size:20px;font-weight:900;font-family:Nunito,sans-serif;pointer-events:none;text-shadow:0 2px 4px rgba(255,255,255,.6);z-index:13;transition:all .7s cubic-bezier(.2,1,.3,1);opacity:1;transform:translate(-50%,0) scale(1)`;
  fx.appendChild(el);
  requestAnimationFrame(()=>{el.style.opacity='0';el.style.transform='translate(-50%,-50px) scale(1.2)'});
  setTimeout(()=>el.remove(),800);
}

// ═══ DOM refs ═══
const fill=document.getElementById('ld-fill');
const ld=document.getElementById('ld');
const ldMsg=document.getElementById('ld-msg');
const hud=document.getElementById('hud');
const tools=document.getElementById('tools');
const ctrl=document.getElementById('ctrl');
const elItem=document.getElementById('hud-item');
const elItemSub=document.getElementById('hud-item-sub');
const elScore=document.getElementById('hud-score');
const elCombo=document.getElementById('hud-combo');
const elTime=document.getElementById('hud-time');
const elProg=document.getElementById('hud-progress-fill');
const elRust=document.getElementById('hud-rust-fill');
const elMsg=document.getElementById('hud-msg');

// ═══ GPU check ═══
async function checkGPU(){
  if(navigator.gpu){try{const a=await navigator.gpu.requestAdapter();if(a)return'webgpu'}catch(e){}}
  const c=document.createElement('canvas');if(c.getContext('webgl2'))return'webgl2';
  return null;
}
fill.style.width='20%';
const gpu=await checkGPU();
if(!gpu){ldMsg.textContent='WebGPU/WebGL2 unavailable';throw 0}
ldMsg.textContent=`Loading KAMI Engine (${gpu.toUpperCase()})...`;
fill.style.width='30%';

// ═══ Load scene ═══
let sceneJson;
try{const r=await fetch('./scenes/sabiotoshi-workshop.jsonld');sceneJson=await r.text()}catch(e){ldMsg.textContent='Scene load error: '+e;throw e}
fill.style.width='50%';

// ═══ Load WASM ═══
let run_with_sabiotoshi;
try{const m=await import('./kami_web.js');await m.default();run_with_sabiotoshi=m.run_with_sabiotoshi}catch(e){ldMsg.textContent='WASM load error: '+e;throw e}
fill.style.width='100%';

// ═══ Launch ═══
await new Promise(r=>setTimeout(r,200));
ld.style.display='none';
hud.style.display='';tools.style.display='';ctrl.style.display='';

try{await run_with_sabiotoshi('gc',sceneJson)}catch(e){
  console.error('KAMI:',e);ld.style.display='flex';ldMsg.textContent='Engine error: '+e;
}

// ═══ Tool buttons ═══
document.querySelectorAll('.tbtn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    window.dispatchEvent(new KeyboardEvent('keydown',{code:'Digit'+(+b.dataset.t+1)}));
    S.nozzle_switch();
  });
});

// ═══ HUD Bridge — read window.__kami_sabiotoshi each frame ═══
let lastPhase='',lastCombo=0,lastScore=0,lastMsg='',msgTimer=0;
function hudLoop(){
  requestAnimationFrame(hudLoop);
  const g=window.__kami_sabiotoshi;
  if(!g)return;

  // Phase change
  if(g.phase!==lastPhase){
    lastPhase=g.phase;
    if(g.phase==='all_clear')floatText('ALL CLEAR!!','#e65100');
    if(g.phase==='timeout')floatText("TIME'S UP!",'#b71c1c');
    if(g.phase==='item_clear')floatText('PIKAPIKA!!','#1565c0');
  }

  // SFX
  if(g.sfx&&g.sfx.length>0){
    for(const s of g.sfx){
      const name=s.replace(/combo_ding_\d+/,'combo_ding');
      if(S[name])S[name](g.combo);
      else if(s.startsWith('combo_ding'))S.combo_ding(g.combo);
    }
  }

  // Haptic
  if(g.haptic!==undefined&&g.haptic!==null){
    const fn=H[g.haptic];if(fn)fn.call(H);
  }

  // Combo change
  if(g.combo>lastCombo&&g.combo>1)floatText('x'+g.combo+' COMBO!','#e65100');
  lastCombo=g.combo;

  // Score change
  if(g.score>lastScore){
    const diff=g.score-lastScore;
    if(diff>0&&diff<10000)floatText('+'+diff,'#1565c0');
  }
  lastScore=g.score;

  // HUD update
  elItem.textContent=(g.itemNameJa||'')+(g.itemName?' ('+g.itemName+')':'');
  elItemSub.textContent='Difficulty: '+'★'.repeat(g.itemDiff||0)+'☆'.repeat(5-(g.itemDiff||0))+' | '+g.toolJa;
  elScore.textContent=(g.score||0).toLocaleString();
  elCombo.textContent=g.combo>1?'x'+g.combo+' COMBO':'';
  const t=Math.ceil(g.timeLeft||0);
  elTime.textContent=t+'s';
  elTime.style.color=t<=10?'#b71c1c':t<=20?'#e65100':'#1565c0';
  elProg.style.width=((g.itemsCleared||0)/(g.totalItems||1)*100)+'%';
  elRust.style.width=((g.rustProgress||0)*100)+'%';

  // Message
  if(g.message&&g.message!==lastMsg){
    lastMsg=g.message;elMsg.textContent=g.message;elMsg.classList.add('show');
    clearTimeout(msgTimer);msgTimer=setTimeout(()=>elMsg.classList.remove('show'),2500);
  }
}
hudLoop();

// Audio unlock on first interaction
document.addEventListener('pointerdown',()=>{if(aC&&aC.state==='suspended')aC.resume()},{once:false});
</script>
</body>
</html>
