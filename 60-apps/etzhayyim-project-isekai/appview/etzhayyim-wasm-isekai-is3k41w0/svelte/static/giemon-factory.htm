<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Giemon ロボット製造工場 — kami-engine + kotoba 4D BIM</title>
<style>
  html, body { margin:0; height:100%; background:#0b0e13; color:#cfe; font-family:system-ui, sans-serif; overflow:hidden; }
  #gc { display:block; width:100vw; height:100vh; }
  #hud {
    position: fixed; top: 8px; left: 8px; padding: 9px 13px;
    background: rgba(0,0,0,0.55); border-radius: 8px;
    font: 12px/1.55 ui-monospace, monospace; color: #9fc; pointer-events: none; min-width: 270px;
  }
  #hud .head { color:#ffb648; font-weight:600; }
  #hud .k { color:#8aa; } #hud .v { color:#fff; }
  #step { color:#7fffd4; }
  #err { color:#f88; font-size:11px; }
  #ctl {
    position: fixed; top: 8px; right: 8px; display:flex; gap:6px;
    font: 12px ui-monospace, monospace;
  }
  #ctl button {
    background:#1b2330; color:#cfe; border:1px solid #2c3a4f; border-radius:7px;
    padding:7px 11px; cursor:pointer;
  }
  #ctl button.active { background:#ffb648; color:#1b2330; border-color:#ffb648; font-weight:700; }
  #hint {
    position: fixed; bottom: 12px; left: 8px; padding: 6px 10px;
    background: rgba(0,0,0,0.55); border-radius: 8px;
    font: 11px/1.4 ui-monospace, monospace; color: #9fc; pointer-events: none; max-width: 92vw;
  }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="hud">
  <div><span class="head">Giemon ロボット製造工場 R0</span></div>
  <div><span class="k">layout/建材/手順:</span> <span class="v">kami-engine + kotoba EAVT</span></div>
  <div><span class="k">engine:</span>  <span class="v">kami-genesis 3-D + contact</span></div>
  <div><span class="k">mode:</span>    <span class="v" id="h-mode">完成工場 (live)</span></div>
  <div><span class="k">step:</span>    <span class="v" id="step">—</span></div>
  <div><span class="k">clashes:</span> <span class="v" id="clash">—</span> <span style="color:#888">(赤=構造貫通 橙=設備調整)</span></div>
  <div><span class="k">backend:</span> <span class="v" id="h-backend">—</span></div>
  <div><span class="k">fps:</span>     <span class="v" id="h-fps">—</span></div>
  <div id="err"></div>
</div>
<div id="ctl">
  <button id="b-live" class="active">完成工場</button>
  <button id="b-build">建築手順 4D</button>
</div>
<div id="hint">
  drag = orbit ・ wheel = zoom ・
  <b>完成工場</b> = arm6 ワークセル稼働 + AGV が壁/柱/機械に衝突 ・
  <b>建築手順 4D</b> = construction.edn の順序 (基礎→鉄骨→屋根→外装→床→機械→ロボット) で建設再生
</div>
<script type="module">
import init, { run_giemon_factory_v1, run_giemon_factory_build_v1, giemonFactoryStep, giemonFactoryClashCount }
  from './giemon-factory/kami_app_giemon_factory.js';

const errEl  = document.getElementById('err');
const stepEl = document.getElementById('step');
const modeEl = document.getElementById('h-mode');
const bLive  = document.getElementById('b-live');
const bBuild = document.getElementById('b-build');

// The two entries each take over the RAF loop, so mode is chosen via ?mode= and
// a reload (a running wgpu loop cannot be torn down cleanly in-page).
const params = new URLSearchParams(location.search);
const mode = params.get('mode') === 'build' ? 'build' : 'live';
if (mode === 'build') { bBuild.classList.add('active'); bLive.classList.remove('active'); modeEl.textContent = '建築手順 4D (playback)'; }
bLive.onclick  = () => { location.search = '?mode=live'; };
bBuild.onclick = () => { location.search = '?mode=build'; };

(async () => {
  await init();
  const hudFps = document.getElementById('h-fps');
  const hudBk  = document.getElementById('h-backend');
  setInterval(() => {
    const h = window.__kami_hud_giemon_factory ?? window.__kami_hud_giemon_factory_build ?? window.__kami_hud;
    if (h) { hudFps.textContent = `${(h.fps ?? 0).toFixed(0)}`; hudBk.textContent = h.backend ?? '—'; }
    if (mode === 'build') {
      try { const s = giemonFactoryStep(); if (s) stepEl.textContent = s; } catch (_) {}
    } else {
      stepEl.textContent = '— (line running)';
    }
    try { const n = giemonFactoryClashCount(); document.getElementById('clash').textContent = `${n} 件`; } catch (_) {}
  }, 250);
  if (mode === 'build') await run_giemon_factory_build_v1('gc');
  else await run_giemon_factory_v1('gc');
})().catch((e) => {
  errEl.textContent = `init error: ${e?.message ?? e}`;
  console.error('[giemon-factory]', e);
});
</script>
</body>
</html>
