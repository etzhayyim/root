<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ISEKAI · Omniverse / PhysX / OpenUSD — kami-engine nv-compat</title>
<style>
  html, body { margin:0; height:100%; background:#0c0e14; color:#cfe; font-family:system-ui, sans-serif; overflow:hidden; }
  #gc { display:block; width:100vw; height:100vh; }
  #hud {
    position: fixed; top: 8px; left: 8px; padding: 8px 12px;
    background: rgba(0,0,0,0.55); border-radius: 8px;
    font: 12px/1.5 ui-monospace, monospace; color: #9fc;
    pointer-events: none; min-width: 280px;
  }
  #hud .head { color:#ffcf6b; font-weight:600; }
  #hud .k { color:#8aa; }
  #hud .v { color:#fff; }
  #hud .nv { color:#a8e; font-size:11px; margin-top:4px; }
  #hint {
    position: fixed; bottom: 12px; left: 8px; padding: 6px 10px;
    background: rgba(0,0,0,0.55); border-radius: 8px;
    font: 11px/1.4 ui-monospace, monospace; color: #9fc;
    pointer-events: none; max-width: 90vw;
  }
  #scene-editor {
    position: fixed; top: 8px; right: 8px;
    width: 380px; max-height: 70vh; display: flex; flex-direction: column;
    background: rgba(0,0,0,0.65); border-radius: 8px; padding: 8px;
    font: 11px/1.4 ui-monospace, monospace; color: #cfe;
  }
  #scene-editor textarea {
    width: 100%; height: 240px; box-sizing: border-box;
    background:#0c0e14; color:#cfe; border:1px solid #234; border-radius:4px;
    font: 11px/1.3 ui-monospace, monospace; padding:6px; resize: vertical;
  }
  #scene-editor .row { display:flex; gap:6px; margin-top:6px; }
  #scene-editor button {
    background:#1b3a5a; color:#cfe; border:1px solid #2a5378;
    border-radius:4px; padding:5px 10px; font:11px ui-monospace; cursor:pointer;
  }
  #scene-editor button:hover { background:#2a5378; }
  #scene-editor .title { color:#ffcf6b; font-weight:600; margin-bottom:4px; }
  #err { color:#f88; padding:4px 0; font-size:11px; }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="hud">
  <div><span class="head">ISEKAI · Omniverse / PhysX / OpenUSD</span></div>
  <div><span class="k">backend:</span> <span class="v" id="h-backend">—</span></div>
  <div><span class="k">fps:</span>     <span class="v" id="h-fps">—</span></div>
  <div><span class="k">pos:</span>     <span class="v" id="h-pos">—</span></div>
  <div><span class="k">yaw/pitch:</span> <span class="v" id="h-yp">—</span></div>
  <div class="nv" id="h-nv">loading nv-compat banner…</div>
</div>
<div id="scene-editor">
  <div class="title">OpenUSD stage (.usda)</div>
  <textarea id="usda" spellcheck="false"></textarea>
  <div class="row">
    <button id="btn-reload">Reload scene</button>
    <button id="btn-default">Default</button>
  </div>
  <div id="err"></div>
</div>
<div id="hint">
  Click canvas to lock pointer ・ WASD move ・ Space/Shift fly ・ mouse look ・
  <b>J / L = push cartpole left / right</b> ・
  edit .usda above → Reload to swap stage ・
  <a href="./worlds.htm" style="color:#9cf">▸ world gallery</a>
</div>
<script type="module">
import init, {
  runIsekaiOmniverse,
  isekaiOmniverseBanner,
  isekaiOmniverseDefaultUsda,
  isekaiSetCartForce,
} from './v2/kami_app_isekai.js';

// Cartpole force control: J = push left (−10 N), L = push right (+10 N).
// Released keys zero the force. PhysX-shaped drive target via wasm bridge.
const CART_F = 10.0;
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.key === 'j' || e.key === 'J') isekaiSetCartForce(-CART_F);
  else if (e.key === 'l' || e.key === 'L') isekaiSetCartForce(CART_F);
});
window.addEventListener('keyup', (e) => {
  if (['j', 'J', 'l', 'L'].includes(e.key)) isekaiSetCartForce(0);
});

const usdaEl = document.getElementById('usda');
const errEl  = document.getElementById('err');
const nvEl   = document.getElementById('h-nv');

(async () => {
  // wasm-bindgen: init() loads the .wasm side-by-side with the JS glue.
  await init();
  nvEl.textContent = isekaiOmniverseBanner();
  const defaultUsda = isekaiOmniverseDefaultUsda();
  const stored = sessionStorage.getItem('isekai-omniverse-usda');
  const usdaText = stored ?? defaultUsda;
  usdaEl.value = usdaText;
  // Stash the canonical default so the "Default" button can restore it
  // even after edits + reloads.
  usdaEl.dataset.default = defaultUsda;

  // HUD subscription — kami-app publishes pos/yaw/pitch/fps to a global.
  const hudPos = document.getElementById('h-pos');
  const hudYp  = document.getElementById('h-yp');
  const hudFps = document.getElementById('h-fps');
  const hudBk  = document.getElementById('h-backend');
  setInterval(() => {
    const h = window.__kami_hud_isekai;
    if (!h) return;
    hudPos.textContent = `${h.pos?.x?.toFixed(1)}, ${h.pos?.y?.toFixed(1)}, ${h.pos?.z?.toFixed(1)}`;
    hudYp.textContent  = `${(h.yaw ?? 0).toFixed(2)} / ${(h.pitch ?? 0).toFixed(2)}`;
    hudFps.textContent = `${(h.fps ?? 0).toFixed(0)}`;
    hudBk.textContent  = h.backend ?? '—';
  }, 250);

  await runIsekaiOmniverse('gc', usdaText);
})().catch((e) => {
  errEl.textContent = `init error: ${e?.message ?? e}`;
  console.error('[isekai-omniverse]', e);
});

// "Reload scene" button: re-init wasm with the new USDA. We tear down
// the old canvas + GPU context by reloading the page with the stage
// stored in sessionStorage. This is the simplest correct approach for
// R0 — kami-app does not yet expose a public scene-swap API.
document.getElementById('btn-reload').addEventListener('click', () => {
  sessionStorage.setItem('isekai-omniverse-usda', usdaEl.value);
  location.reload();
});
document.getElementById('btn-default').addEventListener('click', () => {
  sessionStorage.removeItem('isekai-omniverse-usda');
  usdaEl.value = usdaEl.dataset.default ?? '';
});
</script>
</body>
</html>
