<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>KAMI Quarry Walk — Full Rust</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a1a; color: #ecf5ff; font: 14px/1.5 sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(20,22,28,0.82); border-radius: 8px; padding: 8px 12px;
    border: 1px solid rgba(255,255,255,0.08); font-size: 12px; min-width: 170px; display: none; }
  #hud h2 { font-size: 14px; margin-bottom: 4px; color: #d4c190; }
  #hud div { display: flex; justify-content: space-between; }
  #hud span:last-child { color: #d4c190; font-weight: 700; }
  #controls { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(20,22,28,0.82); border-radius: 8px; padding: 6px 14px;
    font-size: 11px; color: #9c9080; display: none; }
  #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 20; font-size: 16px; color: #d4c190; }
</style>
</head>
<body>
<div id="loading"><span id="s-loading">Loading...</span></div>
<div id="hud">
  <h2>KAMI Quarry Walk</h2>
  <div><span>View</span><span id="s-view">3P</span></div>
  <div><span>Position</span><span id="s-pos">-</span></div>
  <div><span>Height</span><span id="s-h">-</span></div>
  <div><span>Speed</span><span id="s-speed">-</span></div>
  <div><span>Plants</span><span id="s-plants">-</span></div>
  <div><span>FPS</span><span id="s-fps">-</span></div>
</div>
<div id="controls">WASD: Walk | Shift: Sprint | Space: Jump | F: FP/3P | Click: Mouse Look</div>
<canvas id="c"></canvas>
<script type="module">
  import init, { run_with_quarry_walk } from './kami_web.js';
  await init();
  await run_with_quarry_walk('c');
</script>
</body>
</html>
