<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="description" content="ISEKAI World — Minecraft × Pokoa × Brainrot Open 3D World"/>
<title>ISEKAI World</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0e1a;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif;color:#e8e4d0}
.gc{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0e1a;touch-action:none;user-select:none;-webkit-user-select:none;flex-direction:column}
canvas{max-width:100%;max-height:calc(100% - 60px);aspect-ratio:16/9;border-radius:4px}
.hud{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(0,0,0,0.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;gap:12px}
.hud-left,.hud-right{display:flex;align-items:center;gap:14px}
.hud .hp-bar{width:120px;height:10px;background:#333;border-radius:5px;overflow:hidden}
.hud .hp-fill{height:100%;background:linear-gradient(90deg,#4caf50,#8bc34a);border-radius:5px;transition:width .3s}
.hud .pokoa-party{display:flex;gap:4px}
.hud .pokoa-slot{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);font-size:10px;display:flex;align-items:center;justify-content:center}
.hud .pokoa-slot.active{background:rgba(76,175,80,0.4);border-color:#4caf50}
.hud .biome{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.1em}
.hud .time{font-size:13px;color:#ffe066}
.hud .coords{font-size:11px;color:#888;font-family:monospace}
.inventory-bar{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:10}
.inv-slot{width:48px;height:48px;background:rgba(0,0,0,0.7);border:2px solid rgba(255,255,255,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative}
.inv-slot.selected{border-color:#ffe066;background:rgba(255,224,102,0.12)}
.inv-slot .qty{position:absolute;bottom:2px;right:4px;font-size:9px;color:#ccc}
.crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;pointer-events:none;z-index:8}
.crosshair::before,.crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.5)}
.crosshair::before{width:2px;height:24px;left:11px;top:0}
.crosshair::after{width:24px;height:2px;top:11px;left:0}
.encounter-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:30;flex-direction:column;gap:20px}
.encounter-overlay.show{display:flex}
.encounter-title{font-size:28px;font-weight:900;color:#ffe066;text-shadow:0 0 20px rgba(255,224,102,0.4)}
.encounter-pokoa{font-size:64px;animation:pokoa-bounce 1s ease-in-out infinite}
.encounter-info{text-align:center;line-height:1.8}
.encounter-actions{display:flex;gap:12px}
.encounter-actions button{appearance:none;border:none;border-radius:999px;padding:12px 24px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;transition:transform .15s}
.encounter-actions button:active{transform:scale(.95)}
.btn-fight{background:#ff5252;color:#fff}
.btn-catch{background:#4caf50;color:#fff}
.btn-run{background:rgba(255,255,255,0.12);color:#ddd}
.encounter-actions button:disabled{opacity:0.4;cursor:not-allowed}
.battle-phase{width:100%;max-width:480px;padding:0 20px 10px}
.battle-hps{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.battle-hp-row{display:flex;align-items:center;gap:10px}
.b-name{width:110px;font-size:12px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-bar{flex:1;height:10px;background:rgba(255,255,255,0.12);border-radius:5px;overflow:hidden}
.b-fill{height:100%;border-radius:5px;transition:width .35s}
.b-fill.enemy{background:#ff5252}
.b-fill.player{background:#4caf50}
.b-hp{width:32px;font-size:12px;text-align:right;color:#ccc;font-family:monospace}
.battle-log{font-size:13px;color:#e0e0e0;min-height:44px;text-align:center;padding:8px 4px;line-height:1.5;border:1px solid rgba(255,255,255,0.08);border-radius:8px;background:rgba(0,0,0,0.3)}
.battle-moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.battle-moves button{padding:10px 8px;border:none;border-radius:8px;font:inherit;font-weight:700;font-size:12px;cursor:pointer;background:rgba(255,255,255,0.1);color:#fff;transition:background .15s;text-transform:capitalize}
.battle-moves button:hover:not(:disabled){background:rgba(255,255,255,0.22)}
.battle-moves button:disabled{opacity:0.35;cursor:not-allowed}
.battle-outcome{text-align:center;font-size:22px;font-weight:900;padding:12px 0 4px;color:#ffe066}
.battle-continue{appearance:none;border:none;border-radius:999px;padding:10px 28px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:rgba(255,255,255,0.15);color:#fff;margin-top:8px;transition:background .15s}
.battle-continue:hover{background:rgba(255,255,255,0.28)}
.brainrot-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;color:#ff00ff;text-shadow:0 0 30px #ff00ff,0 0 60px #8b00ff;pointer-events:none;z-index:25;opacity:0;transition:opacity .3s}
.brainrot-banner.show{opacity:1;animation:glitch-text .5s ease-in-out}
.minimap{position:fixed;top:56px;right:12px;width:120px;height:120px;background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.15);border-radius:12px;z-index:10;overflow:hidden}
.minimap canvas{width:100%;height:100%}
.virtual{position:fixed;inset:auto 0 8px 0;display:none;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:none;z-index:12}
.dpad,.actions{display:flex;gap:8px;pointer-events:auto}
.dpad{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;grid-template-areas:". up ." "left down right"}
.dpad button,.actions button{appearance:none;border:none;border-radius:16px;background:rgba(0,0,0,0.55);color:#e8e4d0;border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(6px);font:inherit;font-weight:800;cursor:pointer;touch-action:none}
.dpad button{width:56px;height:56px;font-size:18px}
.actions{flex-direction:column;gap:8px}
.actions button{min-width:80px;min-height:56px;padding:0 14px;font-size:12px}
.actions .mine{background:rgba(139,69,19,0.65);color:#ffe4c4}
.actions .pokoa-btn{background:rgba(76,175,80,0.6);color:#e7ffd9}
.actions .jump{background:rgba(33,150,243,0.55);color:#e3f2fd}
.dpad .up{grid-area:up}.dpad .left{grid-area:left}.dpad .right{grid-area:right}.dpad .down{grid-area:down}
.controls{position:fixed;bottom:0;left:0;right:0;height:50px;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;gap:8px;color:#888;font-size:12px;z-index:10}
.controls kbd{background:#333;color:#ddd;padding:2px 8px;border-radius:4px;font-size:11px}
.loading{color:#88aacc;font-size:20px;text-align:center}
.loading small{color:#667;font-size:14px}
.error{color:#ff6644;font-size:16px;text-align:center;max-width:600px;padding:20px}
@keyframes pokoa-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes glitch-text{0%{transform:translate(-50%,-50%) skew(0)}20%{transform:translate(-48%,-52%) skew(-5deg)}40%{transform:translate(-52%,-48%) skew(3deg)}60%{transform:translate(-50%,-50%) skew(-2deg)}100%{transform:translate(-50%,-50%) skew(0)}}
@media(hover:none){.virtual{display:flex}.controls{display:none}}
.debug-overlay{position:fixed;top:0;right:0;bottom:0;width:280px;background:rgba(0,0,0,0.88);color:#0f0;font:10px/1.6 'SF Mono',Consolas,monospace;padding:52px 10px 10px;z-index:20;pointer-events:none;overflow-y:auto;white-space:pre;border-left:1px solid rgba(0,255,0,0.15)}
.debug-overlay .warn{color:#fa0}
.debug-overlay .bad{color:#f44}
.debug-overlay .good{color:#0f0}
.debug-overlay .dim{color:#666}
.debug-overlay .head{color:#0ff;font-weight:700;border-bottom:1px solid rgba(0,255,255,0.2);display:block;margin:4px 0 2px}
.debug-overlay .val{color:#fff}
.debug-overlay .expect{color:#888;font-style:italic}
.debug-overlay .match{color:#0f0}
.debug-overlay .mismatch{color:#f44;font-weight:700}
</style>
</head>

<script type="module">
import init, { run_with_scene } from '/kami_web.js';

const EMBED = new URLSearchParams(location.search).has('embed');
const loading = document.getElementById('loading');
const canvas = document.getElementById('gc');
const hud = document.getElementById('hud');
const minimap = document.getElementById('minimap');
const crosshair = document.getElementById('crosshair');
const hotbar = document.getElementById('hotbar');
const controls = document.getElementById('controls');
const virtualControls = document.getElementById('virtual-controls');
const encounter = document.getElementById('encounter');
const brainrotBanner = document.getElementById('brainrot-banner');

const hudBiome = document.getElementById('hud-biome');
const hudTime = document.getElementById('hud-time');
const hudCoords = document.getElementById('hud-coords');
const hpFill = document.getElementById('hp-fill');

let audioCtx = null;

/** Ensure Web Audio context. */
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

/** Procedural tone. */
function playTone({ freq = 440, type = 'sine', duration = 0.12, gain = 0.02, at = 0 } = {}) {
  const ctx = ensureAudio();
  const start = ctx.currentTime + at;
  const osc = ctx.createOscillator();
  const amp = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  amp.gain.setValueAtTime(0.0001, start);
  amp.gain.linearRampToValueAtTime(gain, start + 0.01);
  amp.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  osc.connect(amp).connect(ctx.destination);
  osc.start(start);
  osc.stop(start + duration + 0.02);
}

/** Noise burst (impact/break). */
function playNoise({ duration = 0.06, gain = 0.02, highpass = 800, at = 0 } = {}) {
  const ctx = ensureAudio();
  const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * duration)), ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), amp = ctx.createGain();
  flt.type = 'highpass'; flt.frequency.value = highpass; amp.gain.value = gain;
  src.buffer = buf; src.connect(flt).connect(amp).connect(ctx.destination);
  src.start(ctx.currentTime + at);
}

/** Block mine/break SFX — crunch + debris. */
function playMineSfx() {
  playTone({ freq: 180, type: 'square', gain: 0.03, duration: 0.05 });
  playNoise({ duration: 0.08, gain: 0.025, highpass: 600 });
  playTone({ freq: 120, type: 'triangle', gain: 0.02, duration: 0.08, at: 0.03 });
  playNoise({ duration: 0.05, gain: 0.015, highpass: 1200, at: 0.04 });
}

/** Block place SFX — thud + click. */
function playPlaceSfx() {
  playTone({ freq: 250, type: 'triangle', gain: 0.025, duration: 0.08 });
  playTone({ freq: 400, type: 'sine', gain: 0.015, duration: 0.06, at: 0.02 });
  playNoise({ duration: 0.03, gain: 0.01, highpass: 2000, at: 0.01 });
}

/** Footstep SFX (alternating pitch). */
let stepPhase = 0;
function playFootstep() {
  const f = stepPhase++ % 2 === 0 ? 140 : 160;
  playTone({ freq: f, type: 'triangle', gain: 0.012, duration: 0.04 });
  playNoise({ duration: 0.03, gain: 0.008, highpass: 1500 });
}

/** Catch SFX — ascending tones + sparkle. */
function playCatchSfx(legendary = false) {
  const base = legendary ? 880 : 523;
  [0, 0.08, 0.16, 0.24].forEach((at, i) =>
    playTone({ freq: base + i * 120, type: 'triangle', gain: 0.028, duration: 0.2, at })
  );
  if (legendary) {
    playTone({ freq: 1568, type: 'sine', gain: 0.02, duration: 0.4, at: 0.3 });
    playNoise({ duration: 0.15, gain: 0.015, highpass: 3000, at: 0.32 });
  }
}

/** Brainrot encounter SFX — distorted bass + glitch. */
function playBrainrotSfx() {
  playTone({ freq: 110, type: 'sawtooth', gain: 0.04, duration: 0.25 });
  playTone({ freq: 165, type: 'square', gain: 0.03, duration: 0.2, at: 0.08 });
  playTone({ freq: 82, type: 'sawtooth', gain: 0.035, duration: 0.3, at: 0.15 });
  playNoise({ duration: 0.1, gain: 0.02, highpass: 400, at: 0.2 });
}

/** Ambient BGM — procedural lo-fi loop (C Am F G). */
let bgmTimer = null;
function startBGM() {
  if (bgmTimer) return;
  ensureAudio();
  const chords = [
    [262, 330, 392],  // C
    [220, 262, 330],  // Am
    [175, 220, 262],  // F
    [196, 247, 294],  // G
  ];
  let step = 0, beat = 0;
  function tick() {
    const chord = chords[step % 4];
    const note = chord[beat % 3];
    // Melody
    playTone({ freq: note * 2, type: 'sine', gain: 0.008, duration: 0.35 });
    // Bass
    if (beat === 0) playTone({ freq: chord[0] / 2, type: 'triangle', gain: 0.012, duration: 0.45 });
    // Rhythm
    if (beat % 2 === 0) playTone({ freq: note, type: 'square', gain: 0.005, duration: 0.1 });
    beat++;
    if (beat >= 4) { beat = 0; step++; }
  }
  tick();
  bgmTimer = setInterval(tick, 380);
}

/** Stop BGM. */
function stopBGM() { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }

/** Wire block edit events from WASM state. */
let lastMineCount = 0, lastPlaceCount = 0, stepTimer = 0;
function pollGameAudio() {
  const s = window.__kami_isekai_state;
  if (!s) return;
  if (s.mineCount > lastMineCount) { playMineSfx(); lastMineCount = s.mineCount; }
  if (s.placeCount > lastPlaceCount) { playPlaceSfx(); lastPlaceCount = s.placeCount; }
  // Footsteps when moving
  if (s.moving) { stepTimer++; if (stepTimer % 20 === 0) playFootstep(); } else { stepTimer = 0; }
}

/** Show brainrot NPC encounter banner. */
function showBrainrot(npcName) {
  brainrotBanner.textContent = `${npcName} appeared!`;
  brainrotBanner.classList.add('show');
  playBrainrotSfx();
  setTimeout(() => brainrotBanner.classList.remove('show'), 2000);
}

/** Show wild Pokoa encounter — Phase 1. */
function showEncounter(speciesId, level, isLegendary) {
  document.getElementById('enc-title').textContent = isLegendary ? 'A LEGENDARY Pokoa appeared!' : 'A wild Pokoa appeared!';
  document.getElementById('enc-title').style.color = isLegendary ? '#ff00ff' : '#ffe066';
  document.getElementById('enc-pokoa').textContent = isLegendary ? '🌟' : '🐾';
  document.getElementById('enc-info').innerHTML = `Species #${String(speciesId).padStart(3,'0')} — Lv.${level}<br>${isLegendary ? 'BRAINROT LEGENDARY' : 'Wild encounter'}`;
  document.getElementById('encounter-phase').style.display = '';
  document.getElementById('battle-phase').style.display = 'none';
  enableEncounterButtons();
  encounter.classList.add('show');
  currentEncounter = { speciesId, level, isLegendary };
  currentBattle = null;
  battleBusy = false;
  playCatchSfx(isLegendary);
}

/** Dismiss encounter. */
function hideEncounter() { encounter.classList.remove('show'); currentEncounter = null; currentBattle = null; battleBusy = false; }

/* ------------------------------------------------------------------ */
/*  XRPC Battle System                                                 */
/* ------------------------------------------------------------------ */

let currentEncounter = null;  // { speciesId, level, isLegendary }
let currentBattle = null;     // full battle context
let battleBusy = false;

/** Minimal XRPC POST helper — relative URL works on any domain. */
async function xrpc(nsid, args) {
  const did = window.__kami_player_did ?? 'anon';
  const resp = await fetch(`/xrpc/${nsid}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ did, ...args }),
  });
  if (!resp.ok) throw new Error(`XRPC ${nsid} → ${resp.status}`);
  return resp.json();
}

/** Lead Pokoa — from WASM state party or default starter. */
function getLeadPokoa() {
  const p = window.__kami_isekai_state?.party?.[0];
  if (p) return p;
  return { speciesId: 1, level: 5, instanceId: 'starter', hp: 35, maxHp: 35 };
}

function enableEncounterButtons() {
  ['btn-fight','btn-catch','btn-run'].forEach(id => { const b = document.getElementById(id); b.disabled = false; b.style.opacity = ''; });
}
function disableEncounterButtons() {
  ['btn-fight','btn-catch','btn-run'].forEach(id => { const b = document.getElementById(id); b.disabled = true; b.style.opacity = '0.5'; });
}

function setBattleLog(msg) { document.getElementById('b-log').textContent = msg; }

function updateBattleHUD() {
  if (!currentBattle) return;
  const b = currentBattle;

  document.getElementById('b-player-fill').style.width = `${Math.max(0,(b.playerHp/b.playerMaxHp)*100)}%`;

/** FIGHT — call startBattle XRPC, switch to battle phase. */
async function onFight() {
  if (!currentEncounter || battleBusy) return;
  battleBusy = true;
  disableEncounterButtons();
  const lead = getLeadPokoa();
  try {
    const res = await xrpc('com.etzhayyim.isekai.startBattle', {
      playerSpeciesId: lead.speciesId,
      playerLevel:     lead.level,
      playerInstanceId: lead.instanceId ?? 'starter',
      enemySpeciesId:  currentEncounter.speciesId,
      enemyLevel:      currentEncounter.level,
      biome: window.__kami_isekai_state?.biome ?? 'plains',
    });
    if (res.error) { setBattleLog(`Error: ${res.error}`); battleBusy = false; enableEncounterButtons(); return; }

    currentBattle = {
      battleId:        res.battleId,
      playerSpeciesId: res.player.speciesId,
      playerLevel:     res.player.level,
      playerInstanceId: res.player.instanceId,
      playerHp:        res.player.hp,
      playerMaxHp:     res.player.maxHp,
      enemySpeciesId:  res.enemy.speciesId,
      enemyLevel:      res.enemy.level,
      enemyHp:         res.enemy.hp,
      enemyMaxHp:      res.enemy.maxHp,
    };

    document.getElementById('encounter-phase').style.display = 'none';
    document.getElementById('battle-phase').style.display = '';
    document.getElementById('b-outcome').style.display = 'none';
    updateBattleHUD();
    setBattleLog(res.message ?? 'Battle started!');
    buildMoveButtons(res.player.moves);
    playMineSfx();
  } catch (e) {
    setBattleLog('Worker offline — deploy to play battles.');
    document.getElementById('encounter-phase').style.display = 'none';
    document.getElementById('battle-phase').style.display = '';
    document.getElementById('b-moves').innerHTML = `<button onclick="hideEncounter()" style="grid-column:1/-1">← Back</button>`;
    console.error(e);
  }
  battleBusy = false;
}

/** Use a move in battle. */
async function onUseMove(moveIndex) {
  if (!currentBattle || battleBusy) return;
  battleBusy = true;
  setMoveButtonsEnabled(false);
  const b = currentBattle;
  try {
    const res = await xrpc('com.etzhayyim.isekai.useMove', {
      battleId:        b.battleId,
      moveIndex,
      turn:            0,
      playerSpeciesId: b.playerSpeciesId,
      playerLevel:     b.playerLevel,
      playerInstanceId: b.playerInstanceId,
      playerHp:        b.playerHp,
      enemySpeciesId:  b.enemySpeciesId,
      enemyLevel:      b.enemyLevel,
      enemyHp:         b.enemyHp,
    });
    if (res.error) { setBattleLog(`Error: ${res.error}`); setMoveButtonsEnabled(true); battleBusy = false; return; }

    currentBattle.playerHp = res.playerHp;
    currentBattle.enemyHp  = res.enemyHp;
    updateBattleHUD();
    setBattleLog(res.message ?? '');

    if (res.battleStatus !== 'ongoing') {
      showBattleOutcome(res.battleStatus === 'won', res.evolved ? `#${res.evolved.fromSpecies}→#${res.evolved.toSpecies}!` : null);
      if (res.battleStatus === 'won') playCatchSfx(true);
      battleBusy = false;
      return;
    }
    setMoveButtonsEnabled(true);
  } catch (e) {
    setBattleLog('Connection error');
    setMoveButtonsEnabled(true);
    console.error(e);
  }
  battleBusy = false;
}

/** CATCH — call catchPokoa XRPC directly. */
async function onCatch() {
  if (!currentEncounter || battleBusy) return;
  battleBusy = true;
  disableEncounterButtons();
  const ballType = 'standard-ball';
  try {
    const res = await xrpc('com.etzhayyim.isekai.catchPokoa', {
      enemySpeciesId: currentEncounter.speciesId,
      enemyLevel:     currentEncounter.level,
      ballType,
      biome: window.__kami_isekai_state?.biome ?? 'plains',
    });
    if (res.error) {
      document.getElementById('enc-info').textContent = `Error: ${res.error}`;
      enableEncounterButtons(); battleBusy = false; return;
    }
    if (res.caught) {
      playCatchSfx(true);
      document.getElementById('enc-info').innerHTML = `✅ Caught!<br>Added to party.`;
      showBrainrot(`${currentEncounter.isLegendary ? '🌟 LEGENDARY ' : ''}Pokoa #${currentEncounter.speciesId} caught!`);
      setTimeout(hideEncounter, 1800);
    } else {
      playCatchSfx(false);
      document.getElementById('enc-info').innerHTML = `${res.message ?? 'It escaped!'}<br>Ball consumed.`;
      enableEncounterButtons();
    }
  } catch (e) {
    document.getElementById('enc-info').textContent = 'Worker offline — deploy to catch Pokoa.';
    enableEncounterButtons();
    console.error(e);
  }
  battleBusy = false;
}

/** RUN — flee battle or wild encounter. */
async function onRun() {
  if (battleBusy) return;
  if (currentBattle) {
    battleBusy = true;
    try {
      const res = await xrpc('com.etzhayyim.isekai.fleeBattle', { battleId: currentBattle.battleId });
      if (res.fled) { hideEncounter(); } else { setBattleLog("Can't escape!"); setMoveButtonsEnabled(true); }
    } catch { hideEncounter(); }
    battleBusy = false;
  } else {
    // Wild encounter — local 50% flee
    if (Math.random() < 0.5) { hideEncounter(); }
    else { document.getElementById('enc-info').textContent = "Can't escape!"; }
  }
}

/** Performance profiler. */
const perf = {
  frames: 0, lastFpsTime: 0, fps: 0,
  frameTimes: new Float64Array(120), frameIdx: 0,
  physicsMs: 0, renderMs: 0, sceneMs: 0, totalMs: 0,
  chunkCount: 0, entityCount: 0, voxelVertices: 0,
  playerPos: [0,0,0], playerVelY: 0, onGround: false,
  targetBlock: null, biome: 'unknown',
};

/** Measure frame timing. */
function perfTick(now) {
  perf.frameTimes[perf.frameIdx % 120] = now;
  perf.frameIdx++;
  perf.frames++;
  if (now - perf.lastFpsTime >= 1000) {
    perf.fps = perf.frames;
    perf.frames = 0;
    perf.lastFpsTime = now;
  }
}

/** Calculate percentile frame time. */
function framePercentile(p) {
  const n = Math.min(perf.frameIdx, 120);
  if (n < 2) return 0;
  const diffs = [];
  for (let i = 1; i < n; i++) {
    const a = (perf.frameIdx - n + i) % 120;
    const b = (perf.frameIdx - n + i - 1) % 120;
    diffs.push(perf.frameTimes[a] - perf.frameTimes[b]);
  }
  diffs.sort((a,b) => a - b);
  return diffs[Math.floor(diffs.length * p / 100)] || 0;
}

/** Compare actual vs expected, return styled string. */
function chk(label, actual, expected, unit='') {
  const av = typeof actual === 'number' ? actual.toFixed(1) : String(actual);
  const ev = typeof expected === 'number' ? expected.toFixed(1) : String(expected);
  const ok = typeof actual === 'number' && typeof expected === 'number'
    ? Math.abs(actual - expected) < Math.max(Math.abs(expected) * 0.3, 2)
    : String(actual) === String(expected);
  return `${label.padEnd(14)}<span class="val">${av}${unit}</span> <span class="${ok?'match':'mismatch'}">← ${ev}${unit}</span>`;
}

/** Seeded PRNG (mulberry32). */
function rng(seed) {
  let s = seed | 0;
  return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/** Seeded 2D value noise for terrain heightmap. */
function makeNoise(seed) {
  const rand = rng(seed);
  const perm = Array.from({length:256}, () => (rand()*256)|0);
  function hash(x, y) { return perm[((perm[x & 255] || 0) + y) & 255] || 0; }
  function lerp(a, b, t) { return a + t * (b - a); }
  function smooth(t) { return t * t * (3 - 2 * t); }
  return function noise2d(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = smooth(x - ix), fy = smooth(y - iy);
    const a = hash(ix, iy) / 255, b = hash(ix+1, iy) / 255;
    const c = hash(ix, iy+1) / 255, d = hash(ix+1, iy+1) / 255;
    return lerp(lerp(a, b, fx), lerp(c, d, fx), fy);
  };
}

/** Multi-octave fractal noise. */
function fbm(noise, x, y, octaves=4, lacunarity=2, gain=0.5) {
  let v = 0, amp = 1, freq = 1, max = 0;
  for (let i = 0; i < octaves; i++) { v += noise(x*freq, y*freq)*amp; max += amp; amp *= gain; freq *= lacunarity; }
  return v / max;
}

/**
 * Generate a 16^3 voxel chunk from world-space chunk coords.
 * Improved terrain: varied heightmap, proper trees, caves, ore veins, structures.
 */
function generateChunk(cx, cy, cz, noise, rand, biomeAt) {
  const data = new Uint8Array(4096);
  const S = 16; // chunk size
  const set = (lx,ly,lz,b) => { if(lx>=0&&lx<S&&ly>=0&&ly<S&&lz>=0&&lz<S) data[ly*256+lz*16+lx]=b; };
  const get = (lx,ly,lz) => (lx>=0&&lx<S&&ly>=0&&ly<S&&lz>=0&&lz<S) ? data[ly*256+lz*16+lx] : 0;

  // Pass 1: terrain heightmap + layers
  for (let lz = 0; lz < S; lz++) for (let lx = 0; lx < S; lx++) {
    const wx = cx*S+lx, wz = cz*S+lz;
    const biome = biomeAt(wx, wz);
    // Multi-scale heightmap for interesting terrain
    const h1 = fbm(noise, wx*0.008, wz*0.008, 4) * 6;     // gentle rolling hills
    const h2 = fbm(noise, wx*0.025+50, wz*0.025+50, 2) * 2; // soft bumps
    const height = Math.floor(h1 + h2 + 6 + biome.hOffset);
    const waterLevel = 5;

    for (let ly = 0; ly < S; ly++) {
      const wy = cy*S+ly;
      const idx = ly*256+lz*16+lx;

      // Cave carving (3D noise)
      // Caves disabled — surface stability. Re-enable when chunk boundary culling is robust.
      const isCave = false;

      if (wy === 0) {
        data[idx] = BT.Stone; // bedrock — prevent seeing through bottom
      } else if (wy > height) {
        data[idx] = wy <= waterLevel ? BT.Water : BT.Air;
      } else if (isCave) {
        data[idx] = BT.Air; // cave
      } else if (wy === height) {
        data[idx] = wy <= waterLevel ? BT.Sand : biome.surface; // sand at water edge
      } else if (wy >= height - 3) {
        data[idx] = biome.sub;
      } else if (wy >= height - 6) {
        data[idx] = BT.Stone;
      } else {
        // Deep: stone + ore distribution
        const oreN = fbm(noise, wx*0.07+100, wy*0.1+wz*0.07, 2);
        if (oreN > 0.82) data[idx] = BT.Ore;
        else if (oreN > 0.78 && wy < 4) data[idx] = BT.Metal; // deep metal
        else data[idx] = BT.Stone;
      }
    }
  }

  // Pass 2: trees (proper 3D shape — trunk + spherical canopy)
  for (let lz = 1; lz < S-1; lz++) for (let lx = 1; lx < S-1; lx++) {
    const wx = cx*S+lx, wz = cz*S+lz;
    const biome = biomeAt(wx, wz);
    if (!biome.trees) continue;
    // Deterministic tree placement using position hash (not random per frame)
    const treeHash = (Math.abs(wx*73+wz*179+cx*37+cz*91) % 1000) / 1000;
    if (treeHash >= biome.treeDensity) continue;

    // Find surface
    let surfY = -1;
    for (let ly = S-1; ly >= 0; ly--) {
      if (get(lx,ly,lz) === biome.surface) { surfY = ly; break; }
    }
    if (surfY < 0 || surfY > S-8) continue; // need room for tree

    const trunkH = 3 + (Math.abs(wx*17+wz*31) % 3); // 3-5 blocks
    // Trunk
    for (let t = 1; t <= trunkH; t++) set(lx, surfY+t, lz, BT.Wood);
    // Canopy (sphere of leaves)
    const canopyR = 2;
    const canopyY = surfY + trunkH;
    for (let dy = -1; dy <= canopyR; dy++) for (let dx = -canopyR; dx <= canopyR; dx++) for (let dz = -canopyR; dz <= canopyR; dz++) {
      if (dx*dx + dy*dy + dz*dz <= canopyR*canopyR + 1) {
        const ty = canopyY+dy, tx = lx+dx, tz = lz+dz;
        if (tx>=0&&tx<S&&ty>=0&&ty<S&&tz>=0&&tz<S && get(tx,ty,tz) === BT.Air) {
          set(tx, ty, tz, BT.Leaf);
        }
      }
    }
  }

  return data;
}

/** Generate seed-based isekai overworld IslandScene with voxel terrain. */
function generateIsekaiScene(seed) {
  seed = seed || Math.floor(Math.random() * 2**32);
  const rand = rng(seed);
  const noise = makeNoise(seed);
  const Q = [0,0,0,1];
  const e = []; // entities

  // ── Biome definitions ──
  const biomeDefs = [
    { id:"plains", surface:BT.Grass, sub:BT.Dirt, hOffset:0, trees:true, treeDensity:0.02 },
    { id:"forest", surface:BT.Grass, sub:BT.Dirt, hOffset:2, trees:true, treeDensity:0.08 },
    { id:"desert", surface:BT.Sand, sub:BT.Sand, hOffset:-1, trees:false, treeDensity:0 },
    { id:"tundra", surface:BT.Snow, sub:BT.Dirt, hOffset:3, trees:true, treeDensity:0.01 },
    { id:"nether", surface:BT.Gravel, sub:BT.Stone, hOffset:-3, trees:false, treeDensity:0 },
  ];

  // Biome centers (seed-driven)
  const biomeCenters = [
    { def:biomeDefs[0], cx:0, cz:0 },
    { def:biomeDefs[1], cx:48+rand()*32|0, cz:32+rand()*20|0 },
    { def:biomeDefs[2], cx:-(40+rand()*25|0), cz:-(30+rand()*25|0) },
    { def:biomeDefs[3], cx:(rand()*20-10)|0, cz:60+(rand()*25|0) },
    { def:biomeDefs[4], cx:40+(rand()*20|0), cz:-(50+(rand()*20|0)) },
  ];

  /** Determine biome at world XZ by nearest center. */
  function biomeAt(wx, wz) {
    let best = biomeDefs[0], bestD = Infinity;
    for (const bc of biomeCenters) {
      const d = (wx-bc.cx*1.5)**2 + (wz-bc.cz*1.5)**2;
      if (d < bestD) { bestD = d; best = bc.def; }
    }
    return best;
  }

  // ── Generate voxel chunks (5×2×5 = 50 chunks around origin) ──
  const RANGE = 4; // -4..4 = 9 chunks per axis = 144×16×144 blocks
  for (let cx = -RANGE; cx <= RANGE; cx++) for (let cz = -RANGE; cz <= RANGE; cz++) for (let cy = 0; cy < 1; cy++) {
    const chunkData = generateChunk(cx, cy, cz, noise, rand, biomeAt);
    // Skip empty chunks (all air)
    if (chunkData.every(b => b === 0)) continue;
    e.push({
      id: `chunk_${cx}_${cy}_${cz}`,
      position: [cx * 16, cy * 16, cz * 16],
      rotation: Q,
      scale: [1, 1, 1],
      mesh: { type: "voxel", chunk_data: Array.from(chunkData), palette: VOXEL_PALETTE },
      components: [],
    });
  }

  // World edge constant (used for physics boundary in Rust — no visible entities)
  const WORLD_EDGE = RANGE * 16;

  // ── Player spawn (on top of terrain) ──
  const spawnH = Math.floor(fbm(noise, 0, 0, 4) * 6 + fbm(noise, 0, 0, 2) * 2 + 6) + 3;
  // Player spawn — invisible marker. Uses voxel type (same pipeline, no z-fight).
  // Single Air chunk = 0 vertices = nothing drawn.
  e.push({ id:"player", position:[0,spawnH,0], rotation:Q, scale:[1,1,1],
    mesh:{type:"voxel", chunk_data:Array.from(new Uint8Array(4096)), palette:VOXEL_PALETTE},
    components:[{type:"player_spawn"}] });

  // Biome references for NPC placement
  const nb = biomeCenters[4], db = biomeCenters[2], tb = biomeCenters[3], frb = biomeCenters[1];
  const wx = 20+rand()*10, wz = rand()*15-7;

  // ── 10 Brainrot NPCs (SDF Character marching-cubes bodies) ──
  /**
   * Voxel NPC entity — Minecraft-style mob rendered as a small voxel chunk.
   * Uses the same fs_color pipeline as terrain, no z-fight with PBR pipeline.
   * 4×6×4 voxel body (head + torso + legs) in a 16^3 chunk.
   */
  const npcEntity = (id, pos, bodyColor, headColor, height=2.0) => {
    const data = new Uint8Array(4096); // 16^3
    const set = (x,y,z,b) => { if(x>=0&&x<16&&y>=0&&y<16&&z>=0&&z<16) data[y*256+z*16+x]=b; };
    // NPC palette: 0=Air, 1=body, 2=head, 3=eye, 4=accent
    const npcPalette = [
      [0,0,0,0],   // 0 Air
      bodyColor,   // 1 Body
      headColor,   // 2 Head/Skin
      [0.1,0.1,0.1,1], // 3 Eye (dark)
      [0.8,0.8,0.8,1], // 4 Highlight
      ...VOXEL_PALETTE.slice(5), // fill rest
    ];

    // Legs (2 columns, y=0-2)
    for(let y=0;y<3;y++) { set(6,y,7,1); set(6,y,8,1); set(9,y,7,1); set(9,y,8,1); }
    // Torso (4×3×2, y=3-5)
    for(let y=3;y<6;y++) for(let x=6;x<10;x++) for(let z=7;z<9;z++) set(x,y,z,1);
    // Arms (y=3-5, beside torso)
    for(let y=3;y<6;y++) { set(5,y,7,1); set(5,y,8,1); set(10,y,7,1); set(10,y,8,1); }
    // Head (4×4×4, y=6-9)
    for(let y=6;y<10;y++) for(let x=6;x<10;x++) for(let z=6;z<10;z++) set(x,y,z,2);
    // Eyes (dark pixels on face, y=8)
    set(7,8,6,3); set(8,8,6,3);

    return [{
      id, position:[pos[0]-0.5, pos[1], pos[2]-0.5], rotation:Q, scale:[1,1,1],
      mesh: { type:"voxel", chunk_data: Array.from(data), palette: npcPalette },
      components: [{type:"npc",name:id,waypoints:[]}],
    }];
  };

  /** Get terrain height at world XZ — matches generateChunk heightmap. */
  function terrainY(wx, wz) {
    const b = biomeAt(wx, wz);
    return Math.floor(fbm(noise, wx*0.008, wz*0.008, 4)*6 + fbm(noise, wx*0.025+50, wz*0.025+50, 2)*2 + 6 + b.hOffset) + 1;
  }

  // 10 Brainrot NPCs — cube+sphere, all 30+ blocks from spawn (0,0)
  const npcs = [

    { id:"rizz-master",      x:-(35+rand()*10),z:30+rand()*10, body:[0.85,0.2,0.3,1],   head:[0.7,0.5,0.35,1], h:2.0 },
    { id:"fanum-tax",        x:35+rand()*15,  z:-(30+rand()*10),body:[0.3,0.25,0.2,1],  head:[0.55,0.4,0.28,1], h:2.0 },
    { id:"gyatt-guardian",   x:-(45+rand()*10),z:-(40+rand()*10),body:[0.8,0.65,0.2,1], head:[0.6,0.45,0.3,1], h:2.5 },
    { id:"mewing-cat",       x:30+rand()*15,  z:35+rand()*10,  body:[0.85,0.75,0.6,1],  head:[0.85,0.75,0.6,1], h:1.2 },
    { id:"baby-gronk",       x:-(30+rand()*15),z:-(30+rand()*15),body:[0.15,0.25,0.6,1],head:[0.7,0.5,0.35,1], h:1.5 },
    { id:"livvy-dunne",      x:-(35+rand()*10),z:-(35+rand()*10),body:[0.9,0.4,0.6,1],  head:[0.75,0.55,0.4,1], h:2.0 },
  ];
  // NPCs disabled — voxel-only terrain stability test.

  // ── 10 Brainrot Characters (Mii-style parametric, CharacterDef) ──
  const characters = [
    { "@type":"KamiCharacter", id:"char-skibidi", name:"Skibidi Commander", role:"boss",
      appearance:{face:"square",skin_hue:0.08,skin_lightness:0.65,eye:"wide",eye_color_hue:0.1,eye_size:1.4,nose:"large",mouth:"grin",mouth_size:1.5,hair:"buzz",hair_color_hue:0.08,hair_color_lightness:0.2,body:"stocky",height:1.15,accessory1:"sunglasses",accessory2:"none"},
      spawn_points:["isekai"] },
    { "@type":"KamiCharacter", id:"char-sigma", name:"Sigma Grindset", role:"npc",
      appearance:{face:"diamond",skin_hue:0.06,skin_lightness:0.55,eye:"narrow",eye_color_hue:0.6,eye_size:0.8,nose:"pointed",mouth:"neutral",mouth_size:0.7,hair:"spiky",hair_color_hue:0.0,hair_color_lightness:0.1,body:"athletic",height:1.1,accessory1:"sunglasses",accessory2:"none"},
      spawn_points:["isekai"] },

      appearance:{face:"long",skin_hue:0.0,skin_lightness:0.3,eye:"cat",eye_color_hue:0.0,eye_size:1.3,nose:"flat",mouth:"wide",mouth_size:1.4,hair:"mohawk",hair_color_hue:0.0,hair_color_lightness:0.05,body:"tall",height:1.2,accessory1:"mask",accessory2:"none"},
      spawn_points:["isekai"] },

      appearance:{face:"round",skin_hue:0.75,skin_lightness:0.4,eye:"round",eye_color_hue:0.75,eye_size:1.2,nose:"button",mouth:"smile",mouth_size:1.3,hair:"bald",hair_color_hue:0.75,hair_color_lightness:0.3,body:"stocky",height:1.15,accessory1:"none",accessory2:"none"},
      spawn_points:["isekai"] },
    { "@type":"KamiCharacter", id:"char-rizz", name:"Rizz Master", role:"npc",

      spawn_points:["isekai"] },

      spawn_points:["isekai"] },
    { "@type":"KamiCharacter", id:"char-mewing", name:"Mewing Cat", role:"npc",
      appearance:{face:"round",skin_hue:0.08,skin_lightness:0.75,eye:"cat",eye_color_hue:0.35,eye_size:1.3,nose:"button",mouth:"neutral",mouth_size:0.6,hair:"short",hair_color_hue:0.08,hair_color_lightness:0.7,body:"slim",height:0.7,accessory1:"none",accessory2:"none"},

/** Boot KAMI Engine. */
async function boot() {
  try {
    loading.innerHTML = '<strong>ISEKAI WORLD</strong><br><small>Initializing KAMI Engine WebGPU...</small>';
    await init();

    loading.innerHTML = '<strong>ISEKAI WORLD</strong><br><small>Loading scene data...</small>';
    let sceneJson;
    try {
      const resp = await fetch('/scenes/isekai-overworld.jsonld');
      sceneJson = await resp.text();
    } catch {
      // Fallback — use inline scene
    }
    // Always use procedural generation (seed-based)
    const urlSeed = new URLSearchParams(location.search).get('seed');
    const seed = urlSeed ? parseInt(urlSeed, 10) : Math.floor(Math.random() * 2**32);
    window.__kami_isekai_seed = seed;
    const sceneObj = generateIsekaiScene(seed);
    perf.entityCount = sceneObj.entities.length;
    perf.chunkCount = sceneObj.entities.filter(e => e.mesh?.type === 'voxel').length; // terrain + NPC voxel chunks
    const sdfCount = sceneObj.entities.filter(e => e.mesh?.type === 'sdf_character').length;
    const npcCount = sceneObj.entities.filter(e => e.id?.includes('-body')).length;
    perf.playerPos = [0, 10, 0];
    console.log(`[isekai] seed=${seed} entities=${perf.entityCount} chunks=${perf.chunkCount} sdf=${sdfCount} npcs=${npcCount} chars=${sceneObj.characters.length}`);
    sceneJson = JSON.stringify(sceneObj);
    document.title = `ISEKAI World — seed:${seed}`;

    loading.style.display = 'none';
    canvas.style.display = 'block';
    hud.style.display = 'flex';
    minimap.style.display = 'block';
    crosshair.style.display = 'block';
    hotbar.style.display = 'flex';
    controls.style.display = 'flex';

    startHudLoop();
    drawMinimap();

    await run_with_scene('gc', sceneJson);

  } catch (e) {
    console.error(e);
    loading.innerHTML = `<div class="error">Failed to start KAMI Engine:<br>${e}<br><br><small>WebGPU required. Try Chrome 113+ or Edge 113+.</small></div>`;
  }
}

// First click activates audio + starts BGM
document.addEventListener('click', () => { ensureAudio(); startBGM(); }, { once: true });

boot();
