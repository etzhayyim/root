<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ISEKAI World Map (ADR-0040 Phase 1 preview)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; background: #f0ead6; font-family: system-ui, sans-serif; color: #222; }
  header { padding: 10px 14px; border-bottom: 1px solid #d9d2b8; }
  h1 { margin: 0 0 4px; font-size: 16px; }
  p  { margin: 0; font-size: 12px; color: #555; }
  #wrap { display: grid; grid-template-columns: 1fr 280px; gap: 16px; padding: 16px; height: calc(100vh - 72px); box-sizing: border-box; }
  #stage { position: relative; background: #fffbe6; border: 1px solid #d9d2b8; border-radius: 12px; overflow: hidden; }
  #map { display: block; width: 100%; height: 100%; }
  aside { background: #fff; border: 1px solid #d9d2b8; border-radius: 12px; padding: 12px; overflow-y: auto; font-size: 12px; line-height: 1.55; }
  aside h2 { margin: 0 0 6px; font-size: 13px; }
  aside table { width: 100%; border-collapse: collapse; font-size: 11px; }
  aside th, aside td { padding: 3px 6px; text-align: left; border-bottom: 1px solid #f0ead6; }
  aside tr.hover td { background: #ffd86b55; }
  .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>ISEKAI World Map — ADR-0040 Phase 1 preview</h1>
  <p>200 m × 200 m map. Scene placements read live from <code>com.etzhayyim.isekai.listScenes</code>. Click a circle to jump to the scene page. Hover for details.</p>
</header>
<div id="wrap">
  <div id="stage"><canvas id="map"></canvas></div>
  <aside>
    <h2>Scenes</h2>
    <div class="legend" style="margin-bottom:8px">
      <span style="background:#e15759"></span>DEC physics
      <span style="background:#4e79a7;margin-left:8px"></span>VRM
    </div>
    <table id="scenes">
      <thead><tr><th>#</th><th>Type</th><th>(x, z) m</th><th>r m</th></tr></thead>
      <tbody></tbody>
    </table>
  </aside>
</div>
<script type="module">
  const WORLD_W_M = 200, WORLD_H_M = 200;
  const WORLD_MAP_URI = 'at://did:web:isekcom.etzhayyim.ai/com.etzhayyim.isekai.worldMap/world-v1';
  // Direct Worker endpoint (same-origin). PDS pipethrough (atproto.etzhayyim.ai)
  // picks up new NSIDs asynchronously; direct route is deterministic.
  const XRPC_ENDPOINT = '/xrpc/com.etzhayyim.isekai.listScenes';

  // Fallback seed — used only if the XRPC call fails (offline / cold start).
  // Keep in sync with /tmp/isekai-world-seed.sql so preview still works.
  const FALLBACK = [
    { idx:0,  sceneType:'dec_physics_0',  x_dm: 300,   z_dm: 300,   radius_dm: 80,  label:'Heat' },
    { idx:1,  sceneType:'dec_physics_1',  x_dm: 700,   z_dm: 300,   radius_dm: 80,  label:'Moisture' },
    { idx:2,  sceneType:'dec_physics_2',  x_dm: 1100,  z_dm: 300,   radius_dm: 80,  label:'Wind' },
    { idx:3,  sceneType:'dec_physics_3',  x_dm: 1500,  z_dm: 300,   radius_dm: 80,  label:'Projection' },
    { idx:4,  sceneType:'dec_physics_4',  x_dm: 300,   z_dm: 1000,  radius_dm: 100, label:'Walls + vorticity' },
    { idx:5,  sceneType:'dec_physics_5',  x_dm: 700,   z_dm: 1000,  radius_dm: 80,  label:'Maxwell EM' },
    { idx:6,  sceneType:'dec_physics_6',  x_dm: 1100,  z_dm: 1000,  radius_dm: 80,  label:'Fire propagation' },
    { idx:7,  sceneType:'dec_physics_7',  x_dm: 1500,  z_dm: 1000,  radius_dm: 90,  label:'Water extinguish' },
    { idx:8,  sceneType:'dec_physics_8',  x_dm: 300,   z_dm: 1700,  radius_dm: 80,  label:'Gravity' },
    { idx:9,  sceneType:'dec_physics_9',  x_dm: 700,   z_dm: 1700,  radius_dm: 80,  label:'Wind drag' },
    { idx:10, sceneType:'dec_physics_10', x_dm: 1100,  z_dm: 1700,  radius_dm: 120, label:'Coupled' },
    { idx:12, sceneType:'vrm_playground', x_dm: 1500,  z_dm: 1700,  radius_dm: 120, label:'VRM character' },
  ];
  let SEED = FALLBACK;

  async function loadScenes() {
    try {
      const url = `${XRPC_ENDPOINT}?worldMapUri=${encodeURIComponent(WORLD_MAP_URI)}&limit=500`;
      const res = await fetch(url, { headers: { accept: 'application/json' } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const scenes = Array.isArray(data?.scenes) ? data.scenes : [];
      if (scenes.length > 0) {
        SEED = scenes.map((s) => {
          // Extract scene idx from dec_physics_N or mark vrm_playground as 12.
          const m = /dec_physics_(\d+)/.exec(s.sceneType ?? '');
          const idx = m ? Number(m[1]) : (s.sceneType === 'vrm_playground' ? 12 : -1);
          return { idx, sceneType: s.sceneType, x_dm: s.x, z_dm: s.z, radius_dm: s.radius, label: s.label };
        }).filter((s) => s.idx >= 0);
      }
    } catch (e) {
      console.warn('[world-map] listScenes XRPC failed; using fallback:', e);
    }
    renderTable(); draw();
  }

  const canvas = document.getElementById('map');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, hovered = -1;
  function fit() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width  = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = r.width; H = r.height;
    draw();
  }
  function worldToPx(xDm, zDm) {
    const xM = xDm / 10, zM = zDm / 10;
    const pad = 20;
    const sx = (W - pad * 2) / WORLD_W_M;
    const sy = (H - pad * 2) / WORLD_H_M;
    const s  = Math.min(sx, sy);
    const ox = (W - WORLD_W_M * s) / 2;
    const oy = (H - WORLD_H_M * s) / 2;
    return { x: ox + xM * s, y: oy + zM * s, s };
  }
  function colorOf(sceneType) {
    return sceneType.startsWith('dec_physics') ? '#e15759' : '#4e79a7';
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    // grid
    ctx.strokeStyle = '#eee4bd'; ctx.lineWidth = 1;
    const { x: ox, y: oy, s } = worldToPx(0, 0);
    for (let g = 0; g <= WORLD_W_M; g += 20) {
      ctx.beginPath(); ctx.moveTo(ox + g * s, oy); ctx.lineTo(ox + g * s, oy + WORLD_H_M * s); ctx.stroke();
    }
    for (let g = 0; g <= WORLD_H_M; g += 20) {
      ctx.beginPath(); ctx.moveTo(ox, oy + g * s); ctx.lineTo(ox + WORLD_W_M * s, oy + g * s); ctx.stroke();
    }
    // scenes
    for (const sc of SEED) {
      const p = worldToPx(sc.x_dm, sc.z_dm);
      const r = (sc.radius_dm / 10) * p.s;
      ctx.fillStyle = colorOf(sc.sceneType) + '33';
      ctx.strokeStyle = colorOf(sc.sceneType);
      ctx.lineWidth = sc.idx === hovered ? 3 : 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#222'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(String(sc.idx), p.x, p.y + 4);
    }
  }
  canvas.addEventListener('mousemove', (e) => {
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    let best = -1, bestD = 999;
    for (const sc of SEED) {
      const p = worldToPx(sc.x_dm, sc.z_dm);
      const d = Math.hypot(p.x - mx, p.y - my);
      if (d < (sc.radius_dm / 10) * p.s && d < bestD) { best = sc.idx; bestD = d; }
    }
    if (best !== hovered) { hovered = best; draw(); updateRowHighlight(); }
  });
  canvas.addEventListener('click', () => {
    if (hovered < 0) return;
    const sc = SEED.find((s) => s.idx === hovered);
    if (!sc) return;
    if (sc.sceneType === 'vrm_playground') location.href = 'v3-demos.htm#scene=12';
    else location.href = 'v3-demos.htm#scene=' + sc.idx;
  });
  function updateRowHighlight() {
    for (const tr of document.querySelectorAll('#scenes tbody tr')) {
      tr.classList.toggle('hover', Number(tr.dataset.idx) === hovered);
    }
  }
  function renderTable() {
    const tb = document.querySelector('#scenes tbody');
    tb.innerHTML = '';
    for (const sc of SEED) {
      const tr = document.createElement('tr');
      tr.dataset.idx = String(sc.idx);
      tr.innerHTML = `<td>${sc.idx}</td><td>${sc.label}</td><td>(${sc.x_dm/10}, ${sc.z_dm/10})</td><td>${sc.radius_dm/10}</td>`;
      tr.addEventListener('mouseenter', () => { hovered = sc.idx; draw(); updateRowHighlight(); });
      tb.appendChild(tr);
    }
  }
  window.addEventListener('resize', fit);
  fit();
  loadScenes();
</script>
</body>
</html>
