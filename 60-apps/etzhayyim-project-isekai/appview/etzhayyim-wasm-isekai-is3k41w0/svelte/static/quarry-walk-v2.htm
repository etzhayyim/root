<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Quarry Walk v2 — kami-app Builder</title>
<style>
  html, body { margin:0; height:100%; background:#0c0e14; color:#fce; font-family:system-ui, sans-serif; overflow:hidden; }
  #gc { display:block; width:100vw; height:100vh; }
  #hud {
    position: fixed; top: 8px; left: 8px; padding: 8px 12px;
    background: rgba(0,0,0,0.55); border-radius: 8px;
    font: 12px/1.5 ui-monospace, monospace; color: #fca; min-width: 220px;
    pointer-events: none;
  }
  #hud .head { color:#ffcf6b; font-weight:600; }
  #hud .k { color:#a97; }
  #hud .v { color:#fff; }
  #hint {
    position: fixed; bottom: 12px; left: 8px; padding: 6px 10px;
    background: rgba(0,0,0,0.55); border-radius: 8px;
    font: 11px/1.4 ui-monospace, monospace; color: #fca;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="hud">
  <div><span class="head">Quarry Walk v2</span> — kami-app / kami-pipelines</div>
  <div><span class="k">backend:</span> <span class="v" id="h-backend">—</span></div>
  <div><span class="k">fps:</span>     <span class="v" id="h-fps">—</span></div>
  <div><span class="k">pos:</span>     <span class="v" id="h-pos">—</span></div>
  <div><span class="k">yaw/pitch:</span> <span class="v" id="h-yp">—</span></div>
</div>
<div id="hint">Click canvas to lock pointer ・ WASD/↑↓←→ ・ Space/Shift ・ mouse look</div>
<script type="module">
import init, { run_quarry_walk_v2 } from './quarry-walk-v2/kami_app_quarry_walk.js';

(async () => {
  await init('./quarry-walk-v2/kami_app_quarry_walk_bg.wasm');
  console.log('[qw-v2] wasm initialized');
  await run_quarry_walk_v2('gc');

  const $b = document.getElementById('h-backend');
  const $f = document.getElementById('h-fps');
  const $p = document.getElementById('h-pos');
  const $y = document.getElementById('h-yp');
  setInterval(() => {
    const h = window.__kami_hud_quarry_walk;
    if (!h) return;
    $b.textContent = h.backend;
    $f.textContent = h.fps.toFixed(0);
    $p.textContent = `${h.x.toFixed(1)}, ${h.y.toFixed(1)}, ${h.z.toFixed(1)}`;
    $y.textContent = `${(h.yaw*180/Math.PI).toFixed(0)}° / ${(h.pitch*180/Math.PI).toFixed(0)}°`;
  }, 100);
})();
</script>
</body>
</html>
