name = "magatama-www-crawler"
main = "src/app.ts"
compatibility_date = "2026-03-19"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

routes = [
  { pattern = "crawler.gftd.ai/*", zone_name = "gftd.ai" },
  { pattern = "cr4wl3r0.gftd.ai/*", zone_name = "gftd.ai" }
]

[observability]
enabled = true

[vars]
APP_VERSION = "0.2.0"
APP_TEMPLATE = "canvas"
APP_SOURCE = "custom"
SPIN_VARIABLE_PERFORMER_ID = "cr4wl3r0"

[[services]]
binding = "PDS_SERVICE"
service = "magatama-pds"

[[secrets_store_secrets]]
binding = "SS_OPENROUTER_API_KEY"
store_id = "1824561668fe47cc9127d493961885af"
secret_name = "openrouter_api_key"

[[r2_buckets]]
binding = "CDN_R2"
bucket_name = "ai-gftd-graph"

[durable_objects]
bindings = [
  { name = "MAGATAMA", class_name = "MagatamaContainer" }
]

[[migrations]]
tag = "v1"
new_classes = ["MagatamaContainer"]

[[migrations]]
tag = "v2"
renamed_classes = [{from = "MagatamaContainer", to = "MagatamaContainerLegacy"}]
new_sqlite_classes = ["MagatamaContainer"]
