[project]
name = "browser-agent"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.3",
    "langgraph-cli[inmem]>=0.1.71",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "httpx>=0.27",
    "pydantic>=2",
    "aiohttp>=3.10",
    "psycopg[binary,pool]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_agent"]

[tool.uv]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pyright>=1.1",
    "langgraph-cli[inmem]>=0.4.26",
]
