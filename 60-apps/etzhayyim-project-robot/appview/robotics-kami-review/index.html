<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3Ccircle cx='8' cy='8' r='4' fill='white'/%3E%3C/svg%3E">
  <title>Robotics KAMI Review</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #f6f7f9; }
    body { margin: 0; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 100vh; }
    .stage { position: relative; overflow: hidden; background: #eef2f5; }
    .grid { position: absolute; inset: 24px; background-image: linear-gradient(#d6dde5 1px, transparent 1px), linear-gradient(90deg, #d6dde5 1px, transparent 1px); background-size: 32px 32px; border: 1px solid #c9d1db; }
    .node { position: absolute; border: 0; border-radius: 6px; transform: translate(-50%, -50%); box-shadow: 0 8px 20px #0f172a26; cursor: pointer; }
    .node span { position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: #223047; background: #ffffffe6; border: 1px solid #d7dde5; border-radius: 4px; padding: 2px 5px; }
    aside { background: #fff; border-left: 1px solid #d8dee7; padding: 20px; overflow: auto; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0; color: #5c6678; margin: 22px 0 10px; }
    p { margin: 0; color: #536071; line-height: 1.45; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    li { border: 1px solid #e1e6ed; border-radius: 6px; padding: 9px 10px; display: grid; gap: 3px; }
    li span { color: #566275; font-size: 13px; }
    .topics { display: flex; gap: 6px; flex-wrap: wrap; }
    code { background: #edf2f7; border: 1px solid #d8e1ea; border-radius: 4px; padding: 3px 6px; font-size: 12px; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } .stage { min-height: 58vh; } aside { border-left: 0; border-top: 1px solid #d8dee7; } }
  </style>
</head>
<body>
<main>
  <section class="stage" aria-label="KAMI robotics review scene">
    <div class="grid" id="scene"></div>
  </section>
  <aside>
    <h1 id="title">Robotics KAMI Review</h1>
    <p id="scope"></p>
    <h2>Process Forms</h2>
    <ul id="forms"></ul>
    <h2>Dependencies</h2>
    <ul id="dependencies"></ul>
    <h2>Missing Prerequisites</h2>
    <ul id="missing"></ul>
    <h2>Approval Gates</h2>
    <ul id="gates"></ul>
    <h2>BPMN Start Bridge</h2>
    <ul id="startBridge"></ul>
    <h2>Telemetry</h2>
    <div class="topics" id="topics"></div>
    <h2>Dry-Run Chain</h2>
    <ul id="dryRun"></ul>
  </aside>
</main>
<script type="module">
const plan = {
  planId: "robotics-review-cell",
  scope: "sales-to-engineering-to-manufacturing-to-warehouse-to-transport-to-service",
  forms: [
    { process: "sales", title: "Sales order / RFQ intake" },
    { process: "engineering", title: "CAD / CAE / CAM engineering release" },
    { process: "manufacturing", title: "Robot work execution" },
    { process: "quality", title: "Inspection and quality release" },
    { process: "transport", title: "Transport and route planning" },
    { process: "finance", title: "Costing, billing, and margin close" }
  ],
  approvalGates: [
    "sales terms accepted before engineering release",
    "engineering release approved before robot work dispatch",
    "SCADA / robot safety envelope approved before motion",
    "quality release approved before shipment",
    "transport custody proof approved before invoice close"
  ],
  dependencies: [
    { from: "sales", to: "engineering", gate: "requirements baseline approved" },
    { from: "engineering", to: "manufacturing", gate: "engineering release package complete" },
    { from: "manufacturing", to: "quality", gate: "manufacturing telemetry and traceability captured" },
    { from: "quality", to: "transport", gate: "quality release approved and inventory staged" },
    { from: "transport", to: "finance", gate: "delivery proof and order terms matched" }
  ],
  missingPrerequisites: [],
  telemetryTopics: [
    "robotics.work.state",
    "robotics.asset.pose",
    "robotics.quality.release",
    "robotics.transport.handoff",
    "robotics.sales.fulfillment"
  ],
  startBridge: [
    { tool: "robotics.workflow.start", kind: "business-process", bpmnProcessId: "robotics_business_process_plan" },
    { tool: "robotics.workflow.start", kind: "work-execution", bpmnProcessId: "robotics_execute_work" },
    { tool: "robotics.workflow.start", kind: "transport-sales", bpmnProcessId: "robotics_transport_sales_plan" },
    { tool: "robotics.workflow.start", kind: "observe-mission", bpmnProcessId: "robotics_observe_mission" }
  ],
  dryRunChain: [
    { tool: "robotics.telemetry.schema", output: "telemetry contract" },
    { tool: "robotics.mission.simulate", output: "mission simulation" },
    { tool: "robotics.approval.record", output: "approval audit record" },
    { tool: "robotics.telemetry.ingest", output: "validated telemetry frame" },
    { tool: "robotics.mission.status", output: "mission status rollup" },
    { tool: "robotics.fulfillment.close", output: "quality, delivery, and invoice close check" }
  ],
  sceneNodes: [
    { id: "engineering-station", kind: "cnc-mill", label: "Engineering / CAM station", position: [-420, 0, 200], scale: [800, 500, 400], color: "#64748b" },
    { id: "robot-workcell", kind: "robot-arm", label: "Robot workcell", position: [0, 0, 300], scale: [900, 900, 600], color: "#d97706" },
    { id: "warehouse-flow", kind: "material-handling", label: "Warehouse and staging flow", position: [420, 0, 150], scale: [1600, 500, 300], color: "#2563eb" },
    { id: "quality-gate", kind: "inspection", label: "Quality gate", position: [840, 0, 150], scale: [500, 500, 300], color: "#7c3aed" },
    { id: "safety-zone", kind: "safety-zone", label: "Robot safety zone", position: [0, 0, 0], scale: [1200, 1200, 80], color: "#ef4444" },
    { id: "route-origin", kind: "material-handling", label: "Factory dock", position: [0, 0, 20], scale: [180, 180, 40], color: "#2563eb" },
    { id: "route-staging", kind: "material-handling", label: "Warehouse staging", position: [18000, 4000, 20], scale: [180, 180, 40], color: "#2563eb" },
    { id: "route-destination", kind: "material-handling", label: "Outbound handoff", position: [42000, 8000, 20], scale: [180, 180, 40], color: "#2563eb" }
  ]
};

const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const xs = plan.sceneNodes.map((node) => node.position[0]);
const ys = plan.sceneNodes.map((node) => node.position[1]);
const minX = Math.min(...xs, -1000);
const maxX = Math.max(...xs, 1000);
const minY = Math.min(...ys, -1000);
const maxY = Math.max(...ys, 1000);
const spanX = Math.max(1, maxX - minX);
const spanY = Math.max(1, maxY - minY);

document.getElementById("title").textContent = plan.planId;
document.getElementById("scope").textContent = plan.scope;
document.getElementById("scene").innerHTML = plan.sceneNodes.map((node) => {
  const left = ((node.position[0] - minX) / spanX) * 100;
  const top = ((node.position[1] - minY) / spanY) * 100;
  const width = Math.max(10, Math.min(22, node.scale[0] / 80));
  const height = Math.max(10, Math.min(22, node.scale[1] / 80));
  return `<button class="node" style="left:${left.toFixed(2)}%;top:${top.toFixed(2)}%;width:${width.toFixed(1)}px;height:${height.toFixed(1)}px;background:${esc(node.color)}" title="${esc(node.kind)}: ${esc(node.label)}"><span>${esc(node.label)}</span></button>`;
}).join("");
document.getElementById("forms").innerHTML = plan.forms.map((form) => `<li><strong>${esc(form.process)}</strong><span>${esc(form.title)}</span></li>`).join("");
document.getElementById("dependencies").innerHTML = plan.dependencies.map((dependency) => `<li><strong>${esc(dependency.from)} -> ${esc(dependency.to)}</strong><span>${esc(dependency.gate)}</span></li>`).join("") || "<li>No internal dependencies in selected process slice</li>";
document.getElementById("missing").innerHTML = plan.missingPrerequisites.map((dependency) => `<li><strong>${esc(dependency.from)} -> ${esc(dependency.to)}</strong><span>${esc(dependency.gate)}</span></li>`).join("") || "<li>None</li>";
document.getElementById("gates").innerHTML = plan.approvalGates.map((gate) => `<li>${esc(gate)}</li>`).join("");
document.getElementById("startBridge").innerHTML = plan.startBridge.map((entry) => `<li><strong>${esc(entry.kind)}</strong><span><code>${esc(entry.tool)}</code> -> <code>${esc(entry.bpmnProcessId)}</code></span></li>`).join("");
document.getElementById("topics").innerHTML = plan.telemetryTopics.map((topic) => `<code>${esc(topic)}</code>`).join("");
document.getElementById("dryRun").innerHTML = plan.dryRunChain.map((entry) => `<li><strong>${esc(entry.tool)}</strong><span>${esc(entry.output)}</span></li>`).join("");
</script>
</body>
</html>
