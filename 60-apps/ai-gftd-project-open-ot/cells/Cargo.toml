[workspace]
resolver = "2"
members = [
    "openot-bfb-rs",
    "pid-limited",
    "droop-p-f",
    "anti-islanding-rocof",
    "pid-stack-100",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gftdcojp/etzhayyim/root"
authors = ["gftd.co.jp"]

[workspace.dependencies]
heapless = { version = "0.8", default-features = false }
openot-bfb-rs = { path = "openot-bfb-rs", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
