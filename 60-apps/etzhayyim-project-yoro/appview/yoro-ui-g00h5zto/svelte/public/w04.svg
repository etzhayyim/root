<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#88E830"/><stop offset="100%" stop-color="#38A400"/></linearGradient>
<linearGradient id="gl" x1="0.1" y1="0" x2="0.65" y2="1"><stop offset="0%" stop-color="#FFF" stop-opacity="0.88"/><stop offset="100%" stop-color="#ECF0F6" stop-opacity="0.74"/></linearGradient>
<linearGradient id="glBd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFF" stop-opacity="0.5"/><stop offset="100%" stop-color="#FFF" stop-opacity="0.1"/></linearGradient>
<linearGradient id="glHi" x1="0.5" y1="0" x2="0.5" y2="0.38"><stop offset="0%" stop-color="#FFF" stop-opacity="0.6"/><stop offset="100%" stop-color="#FFF" stop-opacity="0"/></linearGradient>
<radialGradient id="pu" cx="0.36" cy="0.28" r="0.5"><stop offset="0%" stop-color="#34346A"/><stop offset="100%" stop-color="#0E0E22"/></radialGradient>
