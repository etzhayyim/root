<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#92EC38"/>
      <stop offset="40%" stop-color="#62D010"/>
      <stop offset="100%" stop-color="#3EAA00"/>
    </linearGradient>
    <radialGradient id="amb" cx="0.28" cy="0.12" r="0.7">
      <stop offset="0%" stop-color="#D4FF90" stop-opacity="0.25"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <!-- Body: emoji-style smooth gradient -->
    <radialGradient id="body" cx="0.42" cy="0.32" r="0.65">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#EEF0F4"/>
      <stop offset="100%" stop-color="#E0E4EA"/>
    </radialGradient>
    <!-- Top highlight -->
    <radialGradient id="bodyHi" cx="0.38" cy="0.15" r="0.45">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottom shadow on body -->
    <radialGradient id="bodySh" cx="0.5" cy="0.95" r="0.5">
      <stop offset="0%" stop-color="#C8CDD6" stop-opacity="0.4"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <!-- Belly -->
    <radialGradient id="belly" cx="0.5" cy="0.42" r="0.42">
      <stop offset="0%" stop-color="#F0FDDF"/>
      <stop offset="100%" stop-color="#E4F4C8" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Eye -->
    <radialGradient id="ew" cx="0.44" cy="0.38" r="0.5">
      <stop offset="0%" stop-color="#FEFEFE"/>
      <stop offset="100%" stop-color="#DDE2E8"/>
    </radialGradient>
    <radialGradient id="pu" cx="0.38" cy="0.28" r="0.5">
      <stop offset="0%" stop-color="#34344E"/>
      <stop offset="100%" stop-color="#101020"/>
    </radialGradient>
    <!-- Antenna bubble -->
    <radialGradient id="antBub" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8ECF2"/>
    </radialGradient>
    <!-- Shadows -->
    <filter id="mainSh">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="16"/>
      <feColorMatrix values="0 0 0 0 0.06 0 0 0 0 0.2 0 0 0 0 0 0 0 0 0.3 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="limbSh">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
      <feOffset dy="2.5"/>
      <feColorMatrix values="0 0 0 0 0.06 0 0 0 0 0.18 0 0 0 0 0 0 0 0 0.14 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#amb)"/>

  <!-- Ground shadow -->
  <ellipse cx="512" cy="870" rx="220" ry="30" fill="#2A8800" opacity="0.18"/>

  <g filter="url(#mainSh)">
    <!-- Feet -->
    <g filter="url(#limbSh)">
      <ellipse cx="395" cy="830" rx="56" ry="26" fill="url(#body)"/>
      <ellipse cx="629" cy="830" rx="56" ry="26" fill="url(#body)"/>
    </g>

    <!-- Main body -->
    <ellipse cx="512" cy="500" rx="280" ry="340" fill="url(#body)"/>
    <!-- Bottom shading -->
    <ellipse cx="512" cy="500" rx="280" ry="340" fill="url(#bodySh)"/>
    <!-- Top highlight -->
    <ellipse cx="460" cy="280" rx="190" ry="130" fill="url(#bodyHi)" opacity="0.65"/>

    <!-- Belly -->
    <ellipse cx="512" cy="580" rx="160" ry="150" fill="url(#belly)" opacity="0.55"/>

    <!-- Left arm waving -->
    <g filter="url(#limbSh)" transform="rotate(-30, 248, 480)">
      <ellipse cx="210" cy="480" rx="58" ry="34" fill="url(#body)"/>
    </g>

    <!-- Right arm -->
    <g filter="url(#limbSh)" transform="rotate(15, 776, 510)">
      <ellipse cx="808" cy="510" rx="54" ry="32" fill="url(#body)"/>
    </g>

    <!-- Chat bubble antenna -->
    <g filter="url(#limbSh)">
      <!-- Stem -->
      <path d="M 590 182 C 598 140, 620 110, 640 95" stroke="url(#body)" stroke-width="12" fill="none" stroke-linecap="round"/>
      <!-- Bubble -->
      <ellipse cx="660" cy="82" rx="42" ry="34" fill="url(#antBub)"/>
      <!-- Dots in bubble -->
      <circle cx="646" cy="82" r="6" fill="#A8E860"/>
      <circle cx="660" cy="82" r="6" fill="#78D420"/>
      <circle cx="674" cy="82" r="6" fill="#50B800"/>
    </g>
  </g>

  <!-- Eyes - big emoji style -->
  <ellipse cx="410" cy="420" rx="70" ry="76" fill="url(#ew)"/>
  <ellipse cx="428" cy="418" rx="42" ry="46" fill="url(#pu)"/>
  <circle cx="444" cy="400" r="18" fill="#FFF"/>
  <circle cx="424" cy="434" r="7" fill="#FFF" opacity="0.35"/>

  <ellipse cx="618" cy="420" rx="70" ry="76" fill="url(#ew)"/>
  <ellipse cx="636" cy="418" rx="42" ry="46" fill="url(#pu)"/>
  <circle cx="652" cy="400" r="18" fill="#FFF"/>
  <circle cx="632" cy="434" r="7" fill="#FFF" opacity="0.35"/>

  <!-- Blush -->
  <ellipse cx="328" cy="500" rx="38" ry="20" fill="#FFAB91" opacity="0.35"/>
  <ellipse cx="700" cy="500" rx="38" ry="20" fill="#FFAB91" opacity="0.35"/>

  <!-- Happy mouth - open smile -->
  <path d="M 460 530 Q 514 590 568 530" stroke="#1A3800" stroke-width="6" fill="#FF8A80" fill-opacity="0.25" stroke-linecap="round" stroke-opacity="0.3"/>
</svg>
