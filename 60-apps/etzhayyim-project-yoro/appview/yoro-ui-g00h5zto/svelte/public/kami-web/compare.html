<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAMI — 3D Generation Comparison</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #141418; color: #ccc; font: 11px system-ui, sans-serif; overflow-y: auto; overflow-x: hidden; }
  .nav { padding: 4px 8px; font-size: 10px; }
  .nav a { color: #58CC02; text-decoration: none; }
  .tabs { display: flex; gap: 1px; padding: 0 4px; }
  .tab { flex: 1; padding: 5px 2px; text-align: center; font-size: 9px; font-weight: 700; border-radius: 4px 4px 0 0; cursor: pointer; }
  .tab.active { background: #1e1e28; color: #58CC02; }
  .tab:not(.active) { background: #111; color: #555; }
  .tab:hover:not(.active) { color: #888; }
  .tab .sc { font-size: 7px; opacity: 0.5; margin-top: 1px; }
  .hdr { display: grid; grid-template-columns: 36px 1fr 1fr 1fr; height: 16px; line-height: 16px; text-align: center; font-size: 8px; font-weight: 700; color: #555; background: #1e1e28; }
  .wrap { background: #1e1e28; padding: 2px; }
  .grid { display: grid; grid-template-columns: 36px 1fr 1fr 1fr; grid-template-rows: repeat(3, minmax(120px, 1fr)); gap: 2px; }
  .rl { display: flex; align-items: center; justify-content: center; font-size: 7px; font-weight: 700; writing-mode: vertical-rl; color: #58CC02; background: #111; border-radius: 2px; }
  .cell { position: relative; background: #111; border-radius: 2px; overflow: hidden; min-height: 120px; }
  .cell canvas { width: 100%; height: 100%; display: block; }
  .nfo { position: absolute; bottom: 1px; left: 1px; right: 1px; font-size: 7px; color: #444; background: rgba(0,0,0,0.6); padding: 1px 2px; border-radius: 1px; text-align: center; }
  .panel { display: none; }
  .panel.active { display: block; }
  .log { height: 18px; line-height: 18px; padding: 0 8px; font: 8px monospace; color: #58CC02; background: #0d0d0d; }
</style>
</head>
<body>
<div class="nav"><a href="index.html">← KAMI Showcase</a></div>
<div class="tabs" id="tabs">
  <div class="tab active" data-t="char">キャラ<div class="sc">SCAD 2 | SDF 9 | NeRF 6</div></div>
  <div class="tab" data-t="arch">建築<div class="sc">SCAD 10 | SDF 6 | NeRF 4</div></div>
  <div class="tab" data-t="nat">自然<div class="sc">SCAD 5 | SDF 10 | NeRF 9</div></div>
  <div class="tab" data-t="item">小物<div class="sc">SCAD 9 | SDF 7 | NeRF 4</div></div>
</div>
<div class="hdr"><span></span><span>16³</span><span>32³</span><span>48³</span></div>

<div class="panel active" id="p-char"><div class="wrap"><div class="grid">
  <div class="rl">SCAD</div><div class="cell"><canvas id="c0"></canvas><div class="nfo" id="i0"></div></div><div class="cell"><canvas id="c1"></canvas><div class="nfo" id="i1"></div></div><div class="cell"><canvas id="c2"></canvas><div class="nfo" id="i2"></div></div>
  <div class="rl">SDF</div><div class="cell"><canvas id="c3"></canvas><div class="nfo" id="i3"></div></div><div class="cell"><canvas id="c4"></canvas><div class="nfo" id="i4"></div></div><div class="cell"><canvas id="c5"></canvas><div class="nfo" id="i5"></div></div>
  <div class="rl">NeRF</div><div class="cell"><canvas id="c6"></canvas><div class="nfo" id="i6"></div></div><div class="cell"><canvas id="c7"></canvas><div class="nfo" id="i7"></div></div><div class="cell"><canvas id="c8"></canvas><div class="nfo" id="i8"></div></div>
</div></div></div>

<div class="panel" id="p-arch"><div class="wrap"><div class="grid">
  <div class="rl">SCAD</div><div class="cell"><canvas id="a0"></canvas><div class="nfo" id="j0"></div></div><div class="cell"><canvas id="a1"></canvas><div class="nfo" id="j1"></div></div><div class="cell"><canvas id="a2"></canvas><div class="nfo" id="j2"></div></div>
  <div class="rl">SDF</div><div class="cell"><canvas id="a3"></canvas><div class="nfo" id="j3"></div></div><div class="cell"><canvas id="a4"></canvas><div class="nfo" id="j4"></div></div><div class="cell"><canvas id="a5"></canvas><div class="nfo" id="j5"></div></div>
  <div class="rl">NeRF</div><div class="cell"><canvas id="a6"></canvas><div class="nfo" id="j6"></div></div><div class="cell"><canvas id="a7"></canvas><div class="nfo" id="j7"></div></div><div class="cell"><canvas id="a8"></canvas><div class="nfo" id="j8"></div></div>
</div></div></div>

<div class="panel" id="p-nat"><div class="wrap"><div class="grid">
  <div class="rl">SCAD</div><div class="cell"><canvas id="n0"></canvas><div class="nfo" id="k0"></div></div><div class="cell"><canvas id="n1"></canvas><div class="nfo" id="k1"></div></div><div class="cell"><canvas id="n2"></canvas><div class="nfo" id="k2"></div></div>
  <div class="rl">SDF</div><div class="cell"><canvas id="n3"></canvas><div class="nfo" id="k3"></div></div><div class="cell"><canvas id="n4"></canvas><div class="nfo" id="k4"></div></div><div class="cell"><canvas id="n5"></canvas><div class="nfo" id="k5"></div></div>
  <div class="rl">NeRF</div><div class="cell"><canvas id="n6"></canvas><div class="nfo" id="k6"></div></div><div class="cell"><canvas id="n7"></canvas><div class="nfo" id="k7"></div></div><div class="cell"><canvas id="n8"></canvas><div class="nfo" id="k8"></div></div>
</div></div></div>

<div class="panel" id="p-item"><div class="wrap"><div class="grid">
  <div class="rl">SCAD</div><div class="cell"><canvas id="t0"></canvas><div class="nfo" id="l0"></div></div><div class="cell"><canvas id="t1"></canvas><div class="nfo" id="l1"></div></div><div class="cell"><canvas id="t2"></canvas><div class="nfo" id="l2"></div></div>
  <div class="rl">SDF</div><div class="cell"><canvas id="t3"></canvas><div class="nfo" id="l3"></div></div><div class="cell"><canvas id="t4"></canvas><div class="nfo" id="l4"></div></div><div class="cell"><canvas id="t5"></canvas><div class="nfo" id="l5"></div></div>
  <div class="rl">NeRF</div><div class="cell"><canvas id="t6"></canvas><div class="nfo" id="l6"></div></div><div class="cell"><canvas id="t7"></canvas><div class="nfo" id="l7"></div></div><div class="cell"><canvas id="t8"></canvas><div class="nfo" id="l8"></div></div>
</div></div></div>

<div class="log" id="log">select a tab</div>

<script type="module">
const $ = id => document.getElementById(id);
const log = msg => $('log').textContent = msg;

const CHAR_SCAD=`union(){color([0.34,0.80,0.01])sphere(r=1.5);translate([0,2.8,0])color([0.34,0.80,0.01])sphere(r=1.4);translate([-0.55,2.85,1.1])color([1,1,1])scale([1,1,0.5])sphere(r=0.45);translate([0.55,2.85,1.1])color([1,1,1])scale([1,1,0.5])sphere(r=0.45);translate([0,3.9,0])color([0.9,0.9,0.92])cube([1.3,0.12,1.3],center=true);translate([0,4.3,0])color([0.93,0.93,0.95])cube([1.0,0.6,1.0],center=true);}`;
const CHAR_SDF=JSON.stringify({"@type":"Union","children":[
  {"@type":"SmoothUnion","k":0.4,"children":[
    {"@type":"Sphere","r":1.6,"pos":[0,1.2,0],"color":"#58CC02"},
    {"@type":"Sphere","r":1.5,"pos":[0,2.9,0],"color":"#58CC02"},
    {"@type":"Capsule","h":1.2,"r":0.3,"pos":[-1.5,1.3,0],"rot":[0,0,35],"color":"#46A302"},
    {"@type":"Capsule","h":1.2,"r":0.3,"pos":[1.5,1.3,0],"rot":[0,0,-35],"color":"#46A302"},
    {"@type":"Sphere","r":0.45,"pos":[-0.55,0.1,0.2],"scale":[1,0.5,1.3],"color":"#46A302"},
    {"@type":"Sphere","r":0.45,"pos":[0.55,0.1,0.2],"scale":[1,0.5,1.3],"color":"#46A302"}
  ]},
  {"@type":"Sphere","r":0.55,"pos":[-0.65,3.0,1.6],"scale":[1,1,0.5],"color":"white"},
  {"@type":"Sphere","r":0.55,"pos":[0.65,3.0,1.6],"scale":[1,1,0.5],"color":"white"},
  {"@type":"Sphere","r":0.35,"pos":[-0.65,3.0,1.85],"scale":[1,1,0.4],"color":"#1CB0F6"},
  {"@type":"Sphere","r":0.35,"pos":[0.65,3.0,1.85],"scale":[1,1,0.4],"color":"#1CB0F6"},
  {"@type":"Sphere","r":0.15,"pos":[-0.65,3.0,1.95],"scale":[1,1,0.3],"color":"#1A1A2E"},
  {"@type":"Sphere","r":0.15,"pos":[0.65,3.0,1.95],"scale":[1,1,0.3],"color":"#1A1A2E"},
  {"@type":"Cylinder","h":0.15,"r":0.8,"pos":[0,4.25,0],"color":"#E0E0E0"},
  {"@type":"Cylinder","h":0.9,"r":0.55,"pos":[0,4.75,0],"color":"#EEEEEE"},
  {"@type":"Sphere","r":0.58,"pos":[0,5.25,0],"color":"#F0F0F0"}
]});
const ARCH_SCAD=`union(){color([0.85,0.75,0.65])cube([4,3,3],center=true);translate([0,2.5,0])color([0.6,0.25,0.15])scale([1,0.6,1])rotate([0,0,45])cube([3.5,3.5,3.5],center=true);translate([0,-0.5,1.6])color([0.4,0.3,0.2])cube([1,2,0.1],center=true);}`;
const ARCH_SDF=JSON.stringify({"@type":"Union","children":[{"@type":"Box","size":[4,3,3],"pos":[0,1.5,0],"color":"#D9C0A5"},{"@type":"Box","size":[5,1.5,4],"pos":[0,3.5,0],"color":"#993D26"},{"@type":"Box","size":[1,2,0.15],"pos":[0,1,1.6],"color":"#66503A"},{"@type":"Box","size":[0.8,0.8,0.08],"pos":[-1.2,2,1.6],"color":"#99CCFF"},{"@type":"Box","size":[0.8,0.8,0.08],"pos":[1.2,2,1.6],"color":"#99CCFF"}]});
const NAT_SCAD=`union(){color([0.5,0.45,0.4])sphere(r=1.5);translate([0,0.8,0])color([0.45,0.4,0.35])sphere(r=1.2);translate([3,0,0])color([0.4,0.25,0.15])cylinder(h=3,r=0.3,center=true);translate([3,2.5,0])color([0.2,0.6,0.15])sphere(r=1.5);}`;
const NAT_SDF=JSON.stringify({"@type":"Union","children":[{"@type":"SmoothUnion","k":0.5,"children":[{"@type":"Sphere","r":1.8,"pos":[0,0.8,0],"color":"#807366"},{"@type":"Sphere","r":1.3,"pos":[0.5,1.5,0.3],"color":"#736659"}]},{"@type":"Cylinder","h":3.5,"r":0.35,"pos":[3.5,1.75,0],"color":"#66402A"},{"@type":"SmoothUnion","k":0.4,"children":[{"@type":"Sphere","r":1.6,"pos":[3.5,3.8,0],"color":"#339926"},{"@type":"Sphere","r":1.2,"pos":[3.0,4.5,0.5],"color":"#2D8C22"}]}]});
const ITEM_SCAD=`union(){color([0.9,0.88,0.85])cylinder(h=2.5,r=1,center=true);translate([0,1.3,0])color([0.85,0.83,0.8])cylinder(h=0.1,r=1.1,center=true);translate([0,-1.2,0])color([0.8,0.78,0.75])cylinder(h=0.15,r=0.7,center=true);}`;
const ITEM_SDF=JSON.stringify({"@type":"Union","children":[{"@type":"Cylinder","h":2.5,"r":1.0,"pos":[0,1.25,0],"color":"#E6E0D9"},{"@type":"Torus","R":0.6,"r":0.12,"pos":[1.2,1.0,0],"rot":[0,0,90],"color":"#E6E0D9"},{"@type":"Cylinder","h":0.15,"r":0.75,"pos":[0,0.08,0],"color":"#CCC6BF"}]});

const CFG={
  char:{scad:CHAR_SCAD,sdf:CHAR_SDF,p:'c',i:'i'},
  arch:{scad:ARCH_SCAD,sdf:ARCH_SDF,p:'a',i:'j'},
  nat:{scad:NAT_SCAD,sdf:NAT_SDF,p:'n',i:'k'},
  item:{scad:ITEM_SCAD,sdf:ITEM_SDF,p:'t',i:'l'},
};
const RES=[16,32,48];
const done={};
let m=null;

async function go(label,cid,iid,fn){
  const t=performance.now();
  try{log(label);await fn();$(iid).textContent=(performance.now()-t).toFixed(0)+'ms';}
  catch(e){$(iid).textContent='err';log(label+': '+(e?.message||e));}
}

$('tabs').onclick=async e=>{
  const t=e.target.closest('.tab'); if(!t)return;
  const k=t.dataset.t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  $('p-'+k).classList.add('active');
  if(done[k])return; done[k]=1;
  if(!m){if(!navigator.gpu){log('no WebGPU');return;} log('loading WASM...'); m=await import('./kami_web.js'); await m.default('./kami_web_bg.wasm');}
  const c=CFG[k];
  for(let i=0;i<3;i++) await go(k+'/SCAD/'+RES[i],c.p+i,c.i+i,()=>m.run_embed_scad(c.p+i,c.scad,RES[i],'dense'));
  for(let i=0;i<3;i++) await go(k+'/SDF/'+RES[i],c.p+(i+3),c.i+(i+3),()=>m.run_embed_sdf_jsonld(c.p+(i+3),c.sdf,RES[i],'dense'));
  for(let i=0;i<3;i++) await go(k+'/NeRF/'+RES[i],c.p+(i+6),c.i+(i+6),()=>m.run_embed_nerf(c.p+(i+6),RES[i],'dense'));
  log(k+': done');
};
document.querySelector('.tab.active').click();
</script>
</body>
</html>
