<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#78E020"/><stop offset="100%" stop-color="#2EA000"/></linearGradient>
<linearGradient id="gl" x1="0.1" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#FFF" stop-opacity="0.92"/><stop offset="100%" stop-color="#E8EEF6" stop-opacity="0.8"/></linearGradient>
<linearGradient id="glHi" x1="0.5" y1="0" x2="0.5" y2="0.38"><stop offset="0%" stop-color="#FFF" stop-opacity="0.65"/><stop offset="100%" stop-color="#FFF" stop-opacity="0"/></linearGradient>
<radialGradient id="pu" cx="0.34" cy="0.26" r="0.5"><stop offset="0%" stop-color="#3030A0"/><stop offset="100%" stop-color="#0A0A28"/></radialGradient>
<filter id="sh"><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="12"/><feColorMatrix values="0 0 0 0 0.04 0 0 0 0 0.14 0 0 0 0 0 0 0 0 0.28 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="tsh"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="4"/><feColorMatrix values="0 0 0 0 0.04 0 0 0 0 0.16 0 0 0 0 0 0 0 0 0.3 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
<!-- Bold outlined glass face -->
<g filter="url(#sh)">
<rect x="162" y="108" width="700" height="540" rx="180" fill="url(#gl)" stroke="#2A8800" stroke-width="6" stroke-opacity="0.2"/>
</g>
<rect x="198" y="126" width="628" height="180" rx="145" fill="url(#glHi)" opacity="0.45"/>
