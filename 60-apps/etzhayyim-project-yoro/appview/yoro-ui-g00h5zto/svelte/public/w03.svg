<ellipse cx="648" cy="366" rx="50" ry="54" fill="url(#pu)"/>
<circle cx="670" cy="342" r="20" fill="#FFF"/>
<circle cx="658" cy="358" r="9" fill="#FFF" opacity="0.55"/>
