<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00BFA5"/>
      <stop offset="100%" stop-color="#00897B"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#004D40" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Teal gradient background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg3)"/>

  <!-- Big rounded chat bubble character (the mascot IS the bubble) -->
  <g filter="url(#shadow3)">
    <rect x="162" y="100" width="700" height="500" rx="110" fill="#FFFFFF"/>
    <!-- Tail -->
    <path d="M 350 600 Q 320 680, 280 720 Q 340 680, 380 600 Z" fill="#FFFFFF"/>
  </g>

  <!-- Big kawaii eyes -->
  <ellipse cx="380" cy="320" rx="56" ry="64" fill="#1A1A2E"/>
  <ellipse cx="644" cy="320" rx="56" ry="64" fill="#1A1A2E"/>
  <!-- Eye highlights -->
  <circle cx="400" cy="300" r="20" fill="#FFFFFF"/>
  <circle cx="664" cy="300" r="20" fill="#FFFFFF"/>
  <circle cx="388" cy="330" r="8" fill="#FFFFFF"/>
  <circle cx="652" cy="330" r="8" fill="#FFFFFF"/>

  <!-- Happy mouth -->
  <path d="M 440 400 Q 512 470, 584 400" stroke="#1A1A2E" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Blush cheeks -->
  <ellipse cx="310" cy="390" rx="36" ry="22" fill="#FF8A80" opacity="0.5"/>
  <ellipse cx="714" cy="390" rx="36" ry="22" fill="#FF8A80" opacity="0.5"/>

  <!-- YORO text below mascot - bold and playful -->
  <text x="512" y="860" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="200" fill="#FFFFFF" letter-spacing="-4">YORO</text>

  <!-- Small typing dots inside bubble bottom -->
  <circle cx="460" cy="490" r="14" fill="#B2DFDB"/>
  <circle cx="512" cy="490" r="14" fill="#80CBC4"/>
  <circle cx="564" cy="490" r="14" fill="#4DB6AC"/>
</svg>
