<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0%" stop-color="#90EE3A"/><stop offset="50%" stop-color="#58CC02"/><stop offset="100%" stop-color="#32A800"/></linearGradient>
<linearGradient id="gl" x1="0.08" y1="0" x2="0.65" y2="1"><stop offset="0%" stop-color="#FFF" stop-opacity="0.88"/><stop offset="100%" stop-color="#ECF0F6" stop-opacity="0.74"/></linearGradient>
<linearGradient id="glBd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFF" stop-opacity="0.55"/><stop offset="100%" stop-color="#FFF" stop-opacity="0.1"/></linearGradient>
<linearGradient id="glHi" x1="0.5" y1="0" x2="0.5" y2="0.4"><stop offset="0%" stop-color="#FFF" stop-opacity="0.65"/><stop offset="100%" stop-color="#FFF" stop-opacity="0"/></linearGradient>
<radialGradient id="pu" cx="0.34" cy="0.26" r="0.5"><stop offset="0%" stop-color="#3838A0"/><stop offset="100%" stop-color="#0E0E2A"/></radialGradient>
<filter id="sh"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="14"/><feColorMatrix values="0 0 0 0 0.04 0 0 0 0 0.16 0 0 0 0 0 0 0 0 0.28 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="tsh"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dy="4"/><feColorMatrix values="0 0 0 0 0.04 0 0 0 0 0.16 0 0 0 0 0 0 0 0 0.3 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
<!-- Anime speed lines -->
<g opacity="0.18" stroke="#FFF" stroke-linecap="round">
<line x1="80" y1="300" x2="20" y2="260" stroke-width="5"/><line x1="76" y1="360" x2="10" y2="350" stroke-width="4"/>
<line x1="944" y1="280" x2="1004" y2="240" stroke-width="5"/><line x1="948" y1="340" x2="1010" y2="330" stroke-width="4"/>
<line x1="90" y1="420" x2="30" y2="440" stroke-width="3"/><line x1="934" y1="400" x2="994" y2="420" stroke-width="3"/>
</g>
<!-- Dynamic tilted glass face -->
<g filter="url(#sh)" transform="rotate(-5, 512, 380)">
<rect x="172" y="112" width="680" height="530" rx="185" fill="url(#gl)" stroke="url(#glBd)" stroke-width="2"/>
</g>
<rect x="208" y="130" width="608" height="180" rx="145" fill="url(#glHi)" opacity="0.45" transform="rotate(-5, 512, 380)"/>
