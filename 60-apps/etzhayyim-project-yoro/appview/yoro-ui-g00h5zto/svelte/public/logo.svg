<ellipse cx="652" cy="366" rx="48" ry="52" fill="url(#pu)"/>
<circle cx="672" cy="344" r="18" fill="#FFF"/>
<circle cx="662" cy="358" r="8" fill="#FFF" opacity="0.5"/>
<circle cx="640" cy="388" r="5" fill="#FFF" opacity="0.3"/>
<!-- Blush - anime pink -->
<ellipse cx="316" cy="440" rx="34" ry="16" fill="#FF8A80" opacity="0.4"/>
<ellipse cx="708" cy="440" rx="34" ry="16" fill="#FF8A80" opacity="0.4"/>
