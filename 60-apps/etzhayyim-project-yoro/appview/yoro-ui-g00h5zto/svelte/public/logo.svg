<path d="M 160 180 L 168 200 L 176 180 L 188 192 L 176 204 L 168 224 L 160 204 L 148 192 Z" opacity="0.6"/>
<path d="M 850 160 L 856 174 L 862 160 L 870 168 L 862 176 L 856 190 L 850 176 L 842 168 Z" opacity="0.5"/>
<path d="M 880 580 L 884 590 L 888 580 L 894 586 L 888 592 L 884 602 L 880 592 L 874 586 Z" opacity="0.35"/>
<path d="M 130 560 L 134 570 L 138 560 L 144 566 L 138 572 L 134 582 L 130 572 L 124 566 Z" opacity="0.3"/>
