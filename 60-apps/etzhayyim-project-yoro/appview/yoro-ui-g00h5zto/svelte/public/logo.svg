<!-- YORO bold dynamic -->
<g transform="rotate(-3, 512, 860)">
<text x="512" y="880" text-anchor="middle" font-family="'SF Pro Rounded','-apple-system','Nunito',sans-serif" font-weight="900" font-size="190" fill="#FFF" letter-spacing="6" filter="url(#tsh)">YORO</text>
