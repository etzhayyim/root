<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#92EC38"/>
      <stop offset="40%" stop-color="#62D010"/>
      <stop offset="100%" stop-color="#3EAA00"/>
    </linearGradient>
    <radialGradient id="amb" cx="0.28" cy="0.12" r="0.7">
      <stop offset="0%" stop-color="#D4FF90" stop-opacity="0.25"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <!-- Green body -->
    <radialGradient id="gbody" cx="0.38" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#88E830"/>
      <stop offset="100%" stop-color="#4CB808"/>
    </radialGradient>
    <radialGradient id="gbodyHi" cx="0.32" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#B8FF60" stop-opacity="0.5"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <!-- Light belly -->
    <radialGradient id="lbelly" cx="0.5" cy="0.4" r="0.45">
      <stop offset="0%" stop-color="#E8FFD0"/>
      <stop offset="100%" stop-color="#C8F0A0"/>
    </radialGradient>
    <radialGradient id="ew" cx="0.42" cy="0.36" r="0.55">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="100%" stop-color="#E0E4EA"/>
    </radialGradient>
    <radialGradient id="pu" cx="0.36" cy="0.3" r="0.55">
      <stop offset="0%" stop-color="#2C2C4E"/>
      <stop offset="100%" stop-color="#0C0C1C"/>
    </radialGradient>
    <filter id="bsh">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="12"/>
      <feColorMatrix values="0 0 0 0 0.06 0 0 0 0 0.2 0 0 0 0 0 0 0 0 0.28 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="limb">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
      <feOffset dy="2.5"/>
      <feColorMatrix values="0 0 0 0 0.08 0 0 0 0 0.25 0 0 0 0 0 0 0 0 0.15 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tsh">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dy="4"/>
      <feColorMatrix values="0 0 0 0 0.06 0 0 0 0 0.2 0 0 0 0 0 0 0 0 0.3 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#amb)"/>

  <!-- YORO-kun: Duo-style green bird-bubble creature -->
  <g filter="url(#bsh)">
    <!-- Feet -->
    <g filter="url(#limb)">
      <ellipse cx="395" cy="728" rx="48" ry="22" fill="#3AA000"/>
      <ellipse cx="395" cy="726" rx="46" ry="20" fill="#5CC808"/>
      <ellipse cx="630" cy="728" rx="48" ry="22" fill="#3AA000"/>
      <ellipse cx="630" cy="726" rx="46" ry="20" fill="#5CC808"/>
    </g>

    <!-- Body - egg/bean shape -->
    <ellipse cx="512" cy="440" rx="265" ry="300" fill="#3AA800"/>
    <ellipse cx="512" cy="438" rx="263" ry="298" fill="url(#gbody)"/>
    <!-- Body highlight -->
    <ellipse cx="440" cy="280" rx="180" ry="110" fill="url(#gbodyHi)" opacity="0.5"/>

    <!-- Light belly -->
    <ellipse cx="512" cy="520" rx="160" ry="140" fill="url(#lbelly)" opacity="0.6"/>

    <!-- Left wing/arm waving up -->
    <g filter="url(#limb)" transform="rotate(-30, 260, 400)">
      <ellipse cx="225" cy="400" rx="55" ry="30" fill="#3AA800"/>
      <ellipse cx="226" cy="398" rx="53" ry="28" fill="url(#gbody)"/>
    </g>

    <!-- Right wing/arm -->
    <g filter="url(#limb)" transform="rotate(18, 764, 430)">
      <ellipse cx="790" cy="430" rx="50" ry="28" fill="#3AA800"/>
      <ellipse cx="789" cy="428" rx="48" ry="26" fill="url(#gbody)"/>
    </g>

    <!-- Speech bubble top (like antenna/crest) -->
    <path d="M 560 155 C 575 100, 620 70, 660 60 C 640 95, 625 135, 618 158" fill="url(#gbody)" stroke="#3AA800" stroke-width="1"/>
    <!-- Small bubble dots -->
    <circle cx="680" cy="80" r="14" fill="url(#gbody)" stroke="#3AA800" stroke-width="1"/>
    <circle cx="705" cy="60" r="9" fill="url(#gbody)" stroke="#3AA800" stroke-width="1"/>
  </g>

  <!-- Face plate (white area for eyes) -->
  <ellipse cx="512" cy="360" rx="180" ry="140" fill="#FFF" opacity="0.92"/>

  <!-- Eyes -->
  <ellipse cx="440" cy="350" rx="58" ry="64" fill="url(#ew)"/>
  <ellipse cx="454" cy="348" rx="32" ry="36" fill="url(#pu)"/>
  <circle cx="466" cy="334" r="13" fill="#FFF"/>
  <circle cx="450" cy="362" r="5" fill="#FFF" opacity="0.4"/>

  <ellipse cx="600" cy="350" rx="58" ry="64" fill="url(#ew)"/>
  <ellipse cx="614" cy="348" rx="32" ry="36" fill="url(#pu)"/>
  <circle cx="626" cy="334" r="13" fill="#FFF"/>
  <circle cx="610" cy="362" r="5" fill="#FFF" opacity="0.4"/>

  <!-- Beak/mouth -->
  <path d="M 480 420 L 512 448 L 544 420" stroke="#E8A020" stroke-width="10" fill="#FFD040" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>

  <!-- Blush -->
  <ellipse cx="370" cy="410" rx="28" ry="14" fill="#FFAB91" opacity="0.35"/>
  <ellipse cx="654" cy="410" rx="28" ry="14" fill="#FFAB91" opacity="0.35"/>

  <!-- YORO text -->
  <g filter="url(#tsh)">
    <text x="512" y="930" text-anchor="middle"
          font-family="'SF Pro Rounded','SF Pro Display','-apple-system','Nunito','Helvetica Neue',sans-serif"
          font-weight="800" font-size="170" fill="#FFFFFF" letter-spacing="10">YORO</text>
  </g>

  <!-- Accents -->
  <circle cx="130" cy="180" r="20" fill="#C8FF70" opacity="0.12" filter="url(#glow)"/>
  <circle cx="894" cy="200" r="16" fill="#C8FF70" opacity="0.1" filter="url(#glow)"/>
</svg>
