<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#6200EA"/>
    </linearGradient>
  </defs>

  <!-- Deep purple rounded square -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg2)"/>

  <!-- Mascot-style speech bubble character -->
  <!-- Main bubble body -->
  <rect x="190" y="120" width="644" height="460" rx="100" fill="#FFFFFF"/>
  <!-- Bubble tail -->
  <polygon points="300,580 400,580 330,700" fill="#FFFFFF"/>

  <!-- YORO bold text inside bubble -->
  <text x="512" y="340" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="180" fill="#7C4DFF" letter-spacing="-6">YORO</text>

  <!-- Subtitle -->
  <text x="512" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="48" fill="#B388FF" letter-spacing="8">MESSENGER</text>

  <!-- Kawaii face on the bubble -->
  <!-- Eyes -->
  <ellipse cx="380" cy="260" rx="20" ry="24" fill="#7C4DFF"/>
  <ellipse cx="644" cy="260" rx="20" ry="24" fill="#7C4DFF"/>
  <!-- Eye highlights -->
  <circle cx="388" cy="252" r="7" fill="#FFFFFF"/>
  <circle cx="652" cy="252" r="7" fill="#FFFFFF"/>

  <!-- Small sparkles around -->
  <circle cx="160" cy="800" r="16" fill="#FFD740" opacity="0.9"/>
  <circle cx="864" cy="780" r="12" fill="#FFD740" opacity="0.7"/>
  <circle cx="820" cy="860" r="8" fill="#B388FF" opacity="0.6"/>
  <circle cx="200" cy="880" r="10" fill="#B388FF" opacity="0.5"/>

  <!-- Emoji-style wave hand at bottom -->
  <text x="512" y="900" text-anchor="middle" font-size="120">👋</text>
</svg>
