<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAMI Engine — Effects &amp; Rendering</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #141418; color: #ccc; font: 11px system-ui, sans-serif; overflow: hidden; }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; background: #0d0d0d; border-bottom: 1px solid #2a2a34;
  }
  .header h1 { font-size: 12px; font-weight: 700; color: #58CC02; }
  .header a { color: #58CC02; font-size: 10px; text-decoration: none; opacity: 0.7; }
  .header a:hover { opacity: 1; }
  .compare {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    height: calc(100% - 36px - 28px);
  }
  .side { position: relative; overflow: hidden; }
  .side:first-child { border-right: 1px solid #2a2a34; }
  .side canvas { width: 100%; height: 100%; display: block; }
  .side .badge {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    font-size: 10px; font-weight: 700; padding: 4px 12px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.5px; pointer-events: none;
  }
  .side .badge.flat { background: rgba(100,100,100,0.8); color: #ccc; }
  .side .badge.pbr { background: rgba(88,204,2,0.85); color: #111; }
  .side .detail {
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    font-size: 9px; color: #888; background: rgba(0,0,0,0.75);
    padding: 6px 8px; border-radius: 4px; line-height: 1.5;
  }
  .side .detail strong { color: #ccc; }
  .side .info {
    position: absolute; top: 8px; right: 8px;
    font-size: 9px; color: #666;
    background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 3px;
  }
  .divider {
    position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 3px; background: #58CC02; opacity: 0.4; pointer-events: none;
    z-index: 10;
  }
  .divider-label {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 9px; font-weight: 700; color: #58CC02; background: #141418;
    padding: 2px 8px; border-radius: 10px; border: 1px solid #58CC02;
    z-index: 11; pointer-events: none;
  }
  .log { height: 28px; line-height: 28px; padding: 0 12px; font: 9px monospace; color: #58CC02; background: #0d0d0d; border-top: 1px solid #2a2a34; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<div class="header">
  <h1>Effects &amp; Rendering</h1>
  <a href="index.html">&larr; Showcase</a>
</div>

<div class="compare" style="position: relative;">
  <div class="side">
    <canvas id="flat"></canvas>
    <div class="badge flat">Flat Primitives</div>
    <div class="info" id="i-flat">...</div>
    <div class="detail">
      <strong>run_embed</strong> &mdash; Procedural sphere/cube entities. Individual primitives, no fusion. Phong-style shading.
    </div>
  </div>
  <div class="side">
    <canvas id="pbr"></canvas>
    <div class="badge pbr">Full SDF PBR</div>
    <div class="info" id="i-pbr">...</div>
    <div class="detail">
      <strong>run_embed_sdf_jsonld</strong> &mdash; SDF Smooth Union + Marching Cubes. Organic fusion, multi-material PBR, arms/legs/hat.
    </div>
  </div>
  <div class="divider"></div>
  <div class="divider-label">VS</div>
</div>

<div class="log" id="log">loading...</div>

<script type="module">
const logEl = document.getElementById('log');
function log(msg) { logEl.textContent = msg; }

// Flat scene: procedural entities (no ground, basic shapes)
const FLAT_SCENE = JSON.stringify({
  name: "YORO",
  entities: [
    { id: "body", position: [0,1.2,0], rotation: [0,0,0,1], scale: [1,0.85,0.9], mesh: { type: "sphere", color: [0.34,0.80,0.01,1], radius: 1.5 }, components: [] },
    { id: "head", position: [0,2.8,0], rotation: [0,0,0,1], scale: [1,1,1], mesh: { type: "sphere", color: [0.34,0.80,0.01,1], radius: 1.4 }, components: [] },
    { id: "el", position: [-0.55,2.85,1.1], rotation: [0,0,0,1], scale: [1,1,0.5], mesh: { type: "sphere", color: [1,1,1,1], radius: 0.45 }, components: [] },
    { id: "er", position: [0.55,2.85,1.1], rotation: [0,0,0,1], scale: [1,1,0.5], mesh: { type: "sphere", color: [1,1,1,1], radius: 0.45 }, components: [] },
    { id: "hat", position: [0,3.9,0], rotation: [0,0,0,1], scale: [1.3,0.12,1.3], mesh: { type: "cube", color: [0.93,0.93,0.95,1] }, components: [] },
    { id: "hatb", position: [0,4.3,0], rotation: [0,0,0,1], scale: [1.0,0.6,1.0], mesh: { type: "cube", color: [0.93,0.93,0.95,1] }, components: [] }
  ],
  ambient_color: [0.06, 0.06, 0.09],
  sun_direction: [-0.5, -2.0, -1.0],
  sun_intensity: 2.8
});

// Full SDF: smooth union with arms, legs, hat, eyes
const SDF = JSON.stringify({"@type":"SmoothUnion","k":0.4,"children":[
  {"@type":"Sphere","r":1.6,"pos":[0,1.2,0],"color":"#58CC02"},
  {"@type":"Sphere","r":1.5,"pos":[0,2.9,0],"color":"#58CC02"},
  {"@type":"Sphere","r":0.48,"pos":[-0.6,2.95,1.1],"scale":[1,1,0.55],"color":"white"},
  {"@type":"Sphere","r":0.48,"pos":[0.6,2.95,1.1],"scale":[1,1,0.55],"color":"white"},
  {"@type":"Sphere","r":0.32,"pos":[-0.6,3.0,1.3],"scale":[1,1,0.45],"color":"#1CB0F6"},
  {"@type":"Sphere","r":0.32,"pos":[0.6,3.0,1.3],"scale":[1,1,0.45],"color":"#1CB0F6"},
  {"@type":"Cylinder","h":0.12,"r":0.7,"pos":[0,4.0,0],"color":"#E8E8EA"},
  {"@type":"Cylinder","h":0.8,"r":0.5,"pos":[0,4.45,0],"color":"#EDEDF0"},
  {"@type":"Sphere","r":0.52,"pos":[0,4.85,0],"color":"#EDEDF0"},
  {"@type":"Capsule","h":1.2,"r":0.3,"pos":[-1.5,1.3,0],"rot":[0,0,35],"color":"#46A302"},
  {"@type":"Capsule","h":1.2,"r":0.3,"pos":[1.5,1.3,0],"rot":[0,0,-35],"color":"#46A302"},
  {"@type":"Sphere","r":0.45,"pos":[-0.55,0.1,0.2],"scale":[1,0.5,1.3],"color":"#46A302"},
  {"@type":"Sphere","r":0.45,"pos":[0.55,0.1,0.2],"scale":[1,0.5,1.3],"color":"#46A302"}
]});

if (!navigator.gpu) {
  log('WebGPU not supported');
} else {
  (async () => {
    log('loading WASM...');
    const mod = await import('./kami_web.js');
    await mod.default('./kami_web_bg.wasm');
    log('WASM ready, rendering comparison...');

    // Left: Flat primitives
    const t0 = performance.now();
    try {
      log('rendering: flat primitives...');
      await mod.run_embed('flat', FLAT_SCENE);
      document.getElementById('i-flat').textContent = (performance.now() - t0).toFixed(0) + 'ms';
    } catch(e) {
      document.getElementById('i-flat').textContent = 'err';
      log('flat error: ' + (e?.message || e));
    }

    // Right: Full SDF PBR
    const t1 = performance.now();
    try {
      log('rendering: SDF PBR...');
      await mod.run_embed_sdf_jsonld('pbr', SDF, 32, 'dense');
      document.getElementById('i-pbr').textContent = (performance.now() - t1).toFixed(0) + 'ms';
    } catch(e) {
      document.getElementById('i-pbr').textContent = 'err';
      log('SDF error: ' + (e?.message || e));
    }

    log('done: flat vs SDF PBR comparison');
  })();
}
</script>
</body>
</html>
