<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAMI Engine — Lighting &amp; Materials</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #141418; color: #ccc; font: 11px system-ui, sans-serif; overflow: hidden; }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; background: #0d0d0d; border-bottom: 1px solid #2a2a34;
  }
  .header h1 { font-size: 12px; font-weight: 700; color: #58CC02; }
  .header a { color: #58CC02; font-size: 10px; text-decoration: none; opacity: 0.7; }
  .header a:hover { opacity: 1; }
  .labels { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 8px 12px 0; }
  .labels span { text-align: center; font-size: 10px; font-weight: 700; color: #888; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 8px 12px; height: calc(100% - 36px - 28px - 28px); }
  .cell { position: relative; background: #111; border-radius: 6px; overflow: hidden; border: 1px solid #2a2a34; }
  .cell canvas { width: 100%; height: 100%; display: block; }
  .cell .tag {
    position: absolute; top: 4px; left: 4px;
    font-size: 8px; font-weight: 700; color: #58CC02;
    background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 3px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .cell .info {
    position: absolute; bottom: 4px; right: 4px;
    font-size: 8px; color: #666;
    background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 3px;
  }
  .log { height: 28px; line-height: 28px; padding: 0 12px; font: 9px monospace; color: #58CC02; background: #0d0d0d; border-top: 1px solid #2a2a34; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<div class="header">
  <h1>Lighting &amp; Materials</h1>
  <a href="index.html">&larr; Showcase</a>
</div>

<div class="labels">
  <span>Procedural Entities</span>
  <span>SDF JSON-LD (res 32)</span>
  <span>OpenSCAD CSG</span>
</div>

<div class="grid">
  <div class="cell">
    <canvas id="c0"></canvas>
    <div class="tag">run_embed</div>
    <div class="info" id="i0">...</div>
  </div>
  <div class="cell">
    <canvas id="c1"></canvas>
    <div class="tag">SDF JSON-LD</div>
    <div class="info" id="i1">...</div>
  </div>
  <div class="cell">
    <canvas id="c2"></canvas>
    <div class="tag">OpenSCAD</div>
    <div class="info" id="i2">...</div>
  </div>
</div>

<div class="log" id="log">loading...</div>

<script type="module">
const logEl = document.getElementById('log');
function log(msg) { logEl.textContent = msg; }

const SCENE = JSON.stringify({
  name: "YORO",
  entities: [
    { id: "body", position: [0,1.2,0], rotation: [0,0,0,1], scale: [1,0.85,0.9], mesh: { type: "sphere", color: [0.34,0.80,0.01,1], radius: 1.5 }, components: [] },
    { id: "head", position: [0,2.8,0], rotation: [0,0,0,1], scale: [1,1,1], mesh: { type: "sphere", color: [0.34,0.80,0.01,1], radius: 1.4 }, components: [] },
    { id: "el", position: [-0.55,2.85,1.1], rotation: [0,0,0,1], scale: [1,1,0.5], mesh: { type: "sphere", color: [1,1,1,1], radius: 0.45 }, components: [] },
    { id: "er", position: [0.55,2.85,1.1], rotation: [0,0,0,1], scale: [1,1,0.5], mesh: { type: "sphere", color: [1,1,1,1], radius: 0.45 }, components: [] },
    { id: "hat", position: [0,3.9,0], rotation: [0,0,0,1], scale: [1.3,0.12,1.3], mesh: { type: "cube", color: [0.93,0.93,0.95,1] }, components: [] },
    { id: "hatb", position: [0,4.3,0], rotation: [0,0,0,1], scale: [1.0,0.6,1.0], mesh: { type: "cube", color: [0.93,0.93,0.95,1] }, components: [] }
  ],
  ambient_color: [0.06, 0.06, 0.09],
  sun_direction: [-0.5, -2.0, -1.0],
  sun_intensity: 2.8
});

const SDF = JSON.stringify({"@type":"SmoothUnion","k":0.4,"children":[
  {"@type":"Sphere","r":1.6,"pos":[0,1.2,0],"color":"#58CC02"},
  {"@type":"Sphere","r":1.5,"pos":[0,2.9,0],"color":"#58CC02"},
  {"@type":"Sphere","r":0.48,"pos":[-0.6,2.95,1.1],"scale":[1,1,0.55],"color":"white"},
  {"@type":"Sphere","r":0.48,"pos":[0.6,2.95,1.1],"scale":[1,1,0.55],"color":"white"},
  {"@type":"Sphere","r":0.32,"pos":[-0.6,3.0,1.3],"scale":[1,1,0.45],"color":"#1CB0F6"},
  {"@type":"Sphere","r":0.32,"pos":[0.6,3.0,1.3],"scale":[1,1,0.45],"color":"#1CB0F6"},
  {"@type":"Cylinder","h":0.12,"r":0.7,"pos":[0,4.0,0],"color":"#E8E8EA"},
  {"@type":"Cylinder","h":0.8,"r":0.5,"pos":[0,4.45,0],"color":"#EDEDF0"},
  {"@type":"Sphere","r":0.52,"pos":[0,4.85,0],"color":"#EDEDF0"},
  {"@type":"Capsule","h":1.2,"r":0.3,"pos":[-1.5,1.3,0],"rot":[0,0,35],"color":"#46A302"},
  {"@type":"Capsule","h":1.2,"r":0.3,"pos":[1.5,1.3,0],"rot":[0,0,-35],"color":"#46A302"},
  {"@type":"Sphere","r":0.45,"pos":[-0.55,0.1,0.2],"scale":[1,0.5,1.3],"color":"#46A302"},
  {"@type":"Sphere","r":0.45,"pos":[0.55,0.1,0.2],"scale":[1,0.5,1.3],"color":"#46A302"}
]});

const SCAD = `union(){color([0.34,0.80,0.01])sphere(r=1.5);translate([0,2.8,0])color([0.34,0.80,0.01])sphere(r=1.4);translate([-0.55,2.85,1.1])color([1,1,1])scale([1,1,0.5])sphere(r=0.45);translate([0.55,2.85,1.1])color([1,1,1])scale([1,1,0.5])sphere(r=0.45);translate([0,3.9,0])color([0.9,0.9,0.92])cube([1.3,0.12,1.3],center=true);translate([0,4.3,0])color([0.93,0.93,0.95])cube([1.0,0.6,1.0],center=true);}`;

if (!navigator.gpu) {
  log('WebGPU not supported');
} else {
  (async () => {
    log('loading WASM...');
    const mod = await import('./kami_web.js');
    await mod.default('./kami_web_bg.wasm');
    log('WASM ready, rendering 3 pipelines...');

    async function run(label, id, infoId, fn) {
      const t0 = performance.now();
      try {
        log('rendering: ' + label);
        await fn();
        document.getElementById(infoId).textContent = (performance.now() - t0).toFixed(0) + 'ms';
      } catch(e) {
        document.getElementById(infoId).textContent = 'err';
        log(label + ' error: ' + (e?.message || e));
      }
    }

    // Left: Procedural entities (run_embed)
    await run('Procedural', 'c0', 'i0', () => mod.run_embed('c0', SCENE));

    // Center: SDF JSON-LD (smooth marching cubes)
    await run('SDF JSON-LD', 'c1', 'i1', () => mod.run_embed_sdf_jsonld('c1', SDF, 32, 'dense'));

    // Right: OpenSCAD CSG
    await run('OpenSCAD', 'c2', 'i2', () => mod.run_embed_scad('c2', SCAD, 32, 'dense'));

    log('done: 3 pipelines rendered');
  })();
}
</script>
</body>
</html>
