<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YORO 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #141418; }
  canvas { width: 100%; height: 100%; display: block; }
  #log { position: absolute; bottom: 8px; left: 8px; right: 8px; color: #58CC02; font: 11px monospace; white-space: pre-wrap; max-height: 50%; overflow-y: auto; background: rgba(0,0,0,0.7); padding: 6px; border-radius: 4px; }
</style>
</head>
<body>
<canvas id="kami-embed"></canvas>
<div id="log"></div>
<script type="module">
const logEl = document.getElementById('log');
function log(msg) {
  const line = new Date().toISOString().slice(11,23) + ' ' + msg;
  logEl.textContent += line + '\n';
  logEl.scrollTop = logEl.scrollHeight;
  console.log('[KAMI]', msg);
}

window.onerror = (msg, src, line, col, err) => {
  log('GLOBAL ERROR: ' + msg + ' at ' + src + ':' + line);
};
window.onunhandledrejection = (e) => {
  log('UNHANDLED REJECTION: ' + (e.reason?.message || e.reason));
};

log('embed.html loaded');

// Step 1: WebGPU check
if (!navigator.gpu) {
  log('FAIL: navigator.gpu is undefined — WebGPU not supported');
} else {
  log('OK: navigator.gpu exists');

  try {
    log('step 1: requesting adapter...');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) {
      log('FAIL: no adapter returned');
    } else {
      log('OK: adapter = ' + adapter.info?.device + ' / ' + adapter.info?.vendor);

      // Step 2: Import JS
      log('step 2: importing kami_web.js...');
      let mod;
      try {
        mod = await import('./kami_web.js');
        log('OK: kami_web.js imported, exports: ' + Object.keys(mod).join(', '));
      } catch (e) {
        log('FAIL: import error: ' + e.message);
        throw e;
      }

      // Step 3: Init WASM
      log('step 3: initializing WASM...');
      try {
        await mod.default();
        log('OK: WASM initialized');
      } catch (e) {
        log('FAIL: WASM init error: ' + e.message);
        throw e;
      }

      // Step 4: Check run_embed exists
      if (typeof mod.run_embed !== 'function') {
        log('FAIL: run_embed is not a function, type=' + typeof mod.run_embed);
      } else {
        log('OK: run_embed is a function');

        // Step 5: Run scene
        const scene = JSON.stringify({
          name: "YORO",
          entities: [
            { id: "body", position: [0,1.2,0], rotation: [0,0,0,1], scale: [1,0.85,0.9], mesh: { type: "sphere", color: [0.34,0.80,0.01,1], radius: 1.5 }, components: [] },
            { id: "head", position: [0,2.8,0], rotation: [0,0,0,1], scale: [1,1,1], mesh: { type: "sphere", color: [0.34,0.80,0.01,1], radius: 1.4 }, components: [] },
            { id: "el", position: [-0.55,2.85,1.1], rotation: [0,0,0,1], scale: [1,1,0.5], mesh: { type: "sphere", color: [1,1,1,1], radius: 0.45 }, components: [] },
            { id: "er", position: [0.55,2.85,1.1], rotation: [0,0,0,1], scale: [1,1,0.5], mesh: { type: "sphere", color: [1,1,1,1], radius: 0.45 }, components: [] },
            { id: "hat", position: [0,3.9,0], rotation: [0,0,0,1], scale: [1.3,0.12,1.3], mesh: { type: "cube", color: [0.93,0.93,0.95,1] }, components: [] },
          ],
          ambient_color: [0.06, 0.06, 0.09],
          sun_direction: [-0.5, -2.0, -1.0],
          sun_intensity: 2.8,
        });

        log('step 5: calling run_embed("kami-embed", scene)...');
        try {
          await mod.run_embed('kami-embed', scene);
          log('OK: run_embed completed — 3D rendering active');
          logEl.style.display = 'none';
        } catch (e) {
          log('FAIL: run_embed error: ' + e.message);
          log('stack: ' + (e.stack || '').slice(0, 300));
        }
      }
    }
  } catch (e) {
    log('FATAL: ' + (e?.message || e));
  }
}
</script>
</body>
</html>
