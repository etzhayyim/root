<!-- Heart accent -->
<path d="M 840 400 C 840 385, 855 378, 862 390 C 869 378, 884 385, 884 400 C 884 418, 862 432, 862 432 C 862 432, 840 418, 840 400 Z" fill="#FF6B8A" opacity="0.35"/>
<text x="512" y="890" text-anchor="middle" font-family="'SF Pro Rounded','-apple-system','Nunito',sans-serif" font-weight="900" font-size="185" fill="#FFF" letter-spacing="6" filter="url(#tsh)" transform="rotate(2, 512, 890)">YORO</text>
