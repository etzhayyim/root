<path d="M 120 200 L 128 220 L 136 200 L 148 212 L 136 224 L 128 244 L 120 224 L 108 212 Z" opacity="0.55"/>
<path d="M 900 180 L 906 194 L 912 180 L 920 188 L 912 196 L 906 210 L 900 196 L 892 188 Z" opacity="0.45"/>
<path d="M 870 620 L 874 630 L 878 620 L 884 626 L 878 632 L 874 642 L 870 632 L 864 626 Z" opacity="0.3"/>
