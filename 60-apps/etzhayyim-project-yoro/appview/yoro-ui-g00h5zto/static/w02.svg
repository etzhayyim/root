<ellipse cx="395" cy="360" rx="74" ry="80" fill="#FFF" opacity="0.92"/>
<ellipse cx="412" cy="356" rx="46" ry="50" fill="url(#pu)"/>
<circle cx="430" cy="336" r="18" fill="#FFF"/>
<circle cx="420" cy="350" r="8" fill="#FFF" opacity="0.5"/>
<!-- Right eye - wink! ^  -->
<path d="M 580 360 Q 630 320, 680 360" stroke="#1A2A50" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6"/>
<!-- Blush -->
<ellipse cx="322" cy="430" rx="36" ry="18" fill="#FF8A80" opacity="0.4"/>
<ellipse cx="710" cy="420" rx="36" ry="18" fill="#FF8A80" opacity="0.4"/>
<!-- Open happy mouth -->
<ellipse cx="512" cy="480" rx="45" ry="30" fill="#FF8A80" opacity="0.3"/>
<path d="M 467 470 Q 512 515, 557 470" stroke="#1A3A00" stroke-width="5.5" fill="none" stroke-linecap="round" opacity="0.25"/>
</g>
<!-- Sparkles -->
