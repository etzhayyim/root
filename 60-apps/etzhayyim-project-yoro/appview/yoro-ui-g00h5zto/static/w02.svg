<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A0F050"/><stop offset="40%" stop-color="#5ED010"/><stop offset="100%" stop-color="#30A600"/></linearGradient>
<linearGradient id="gl" x1="0.08" y1="0" x2="0.65" y2="1"><stop offset="0%" stop-color="#FFF" stop-opacity="0.9"/><stop offset="100%" stop-color="#ECF0F6" stop-opacity="0.76"/></linearGradient>
<linearGradient id="glBd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFF" stop-opacity="0.55"/><stop offset="100%" stop-color="#FFF" stop-opacity="0.1"/></linearGradient>
<linearGradient id="glHi" x1="0.5" y1="0" x2="0.5" y2="0.38"><stop offset="0%" stop-color="#FFF" stop-opacity="0.7"/><stop offset="100%" stop-color="#FFF" stop-opacity="0"/></linearGradient>
<radialGradient id="pu" cx="0.34" cy="0.26" r="0.5"><stop offset="0%" stop-color="#3838A0"/><stop offset="100%" stop-color="#0E0E2A"/></radialGradient>
<filter id="sh"><feGaussianBlur in="SourceAlpha" stdDeviation="20"/><feOffset dy="16"/><feColorMatrix values="0 0 0 0 0.04 0 0 0 0 0.16 0 0 0 0 0 0 0 0 0.3 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="tsh"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dy="4"/><feColorMatrix values="0 0 0 0 0.04 0 0 0 0 0.16 0 0 0 0 0 0 0 0 0.3 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
<!-- Glass face - bouncy tilt -->
<g filter="url(#sh)" transform="rotate(4, 520, 370)">
<rect x="162" y="100" width="700" height="545" rx="190" fill="url(#gl)" stroke="url(#glBd)" stroke-width="2"/>
</g>
<rect x="200" y="118" width="624" height="185" rx="150" fill="url(#glHi)" opacity="0.45" transform="rotate(4, 520, 370)"/>
<g transform="rotate(4, 520, 370)">
