<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#7EE028"/>
      <stop offset="100%" stop-color="#3CA600"/>
    </linearGradient>
    <radialGradient id="bgHi" cx="0.3" cy="0.2" r="0.65">
      <stop offset="0%" stop-color="#A0FF50" stop-opacity="0.35"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bub" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E5EC"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#72DA18"/>
      <stop offset="100%" stop-color="#349000"/>
    </linearGradient>
    <radialGradient id="ew" cx="0.4" cy="0.35">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="100%" stop-color="#D8DEE6"/>
    </radialGradient>
    <radialGradient id="pp" cx="0.35" cy="0.3">
      <stop offset="0%" stop-color="#2C2C50"/>
      <stop offset="100%" stop-color="#0C0C1E"/>
    </radialGradient>
    <filter id="bs"><feDropShadow dx="4" dy="16" stdDeviation="14" flood-color="#145000" flood-opacity="0.45"/></filter>
    <filter id="ts"><feDropShadow dx="3" dy="6" stdDeviation="1.5" flood-color="#145000" flood-opacity="0.5"/></filter>
    <filter id="es"><feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.2"/></filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#bgHi)"/>

  <!-- Bubble - bigger, bouncier, slightly tilted -->
  <g filter="url(#bs)" transform="rotate(2, 512, 350)">
    <rect x="150" y="90" width="724" height="470" rx="110" fill="url(#bub)"/>
    <path d="M 560 560 L 650 560 L 680 700 Z" fill="#DCE1E9"/>
    <path d="M 562 560 L 648 560 L 676 692 Z" fill="url(#bub)"/>
  </g>
  <!-- Gloss -->
  <ellipse cx="440" cy="180" rx="260" ry="70" fill="#FFF" opacity="0.25" transform="rotate(2, 512, 350)"/>

  <!-- YORO with bounce feel -->
  <g transform="rotate(2, 512, 350)">
    <!-- 3D offset -->
    <text x="512" y="408" text-anchor="middle"
          font-family="'Fredoka One','Nunito Black','Baloo 2','Rubik','Arial Rounded MT Bold',sans-serif"
          font-weight="900" font-size="230" fill="#287800" letter-spacing="6" opacity="0.25"
          dy="10" dx="4">YORO</text>
    <text x="512" y="408" text-anchor="middle"
          font-family="'Fredoka One','Nunito Black','Baloo 2','Rubik','Arial Rounded MT Bold',sans-serif"
          font-weight="900" font-size="230" fill="url(#txt)" letter-spacing="6"
          filter="url(#ts)">YORO</text>
  </g>

  <!-- Eyes - looking up-right, excited -->
  <g filter="url(#es)">
    <ellipse cx="370" cy="790" rx="68" ry="70" fill="url(#ew)" stroke="#C0C6D0" stroke-width="2.5"/>
    <ellipse cx="390" cy="786" rx="34" ry="36" fill="url(#pp)"/>
    <circle cx="404" cy="774" r="14" fill="#FFF"/>
    <circle cx="386" cy="798" r="5.5" fill="#FFF" opacity="0.5"/>

    <ellipse cx="620" cy="790" rx="68" ry="70" fill="url(#ew)" stroke="#C0C6D0" stroke-width="2.5"/>
    <ellipse cx="640" cy="786" rx="34" ry="36" fill="url(#pp)"/>
    <circle cx="654" cy="774" r="14" fill="#FFF"/>
    <circle cx="636" cy="798" r="5.5" fill="#FFF" opacity="0.5"/>
  </g>

  <!-- Excited eyebrows -->
  <path d="M 316 730 Q 370 708, 424 726" stroke="#2A8000" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M 566 726 Q 620 708, 674 730" stroke="#2A8000" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Big smile -->
  <path d="M 435 860 Q 495 905, 555 860" stroke="#2A8000" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Motion lines (animation feel) -->
  <line x1="108" y1="200" x2="68" y2="170" stroke="#FFF" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <line x1="100" y1="260" x2="55" y2="255" stroke="#FFF" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <line x1="918" y1="210" x2="960" y2="185" stroke="#FFF" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <line x1="930" y1="270" x2="968" y2="268" stroke="#FFF" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
</svg>
