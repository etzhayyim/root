<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84E028"/>
      <stop offset="100%" stop-color="#45A800"/>
    </linearGradient>
    <radialGradient id="bgShine" cx="0.35" cy="0.25" r="0.7">
      <stop offset="0%" stop-color="#96F03A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#58CC02" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubbleGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E8ED"/>
    </linearGradient>
    <linearGradient id="bubbleShine" x1="0.5" y1="0" x2="0.5" y2="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="txtFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ED617"/>
      <stop offset="100%" stop-color="#389200"/>
    </linearGradient>
    <radialGradient id="eyeW" cx="0.42" cy="0.38">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDE2E8"/>
    </radialGradient>
    <radialGradient id="pup" cx="0.38" cy="0.32">
      <stop offset="0%" stop-color="#28284A"/>
      <stop offset="100%" stop-color="#08081A"/>
    </radialGradient>
    <filter id="bSh"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1A5500" flood-opacity="0.4"/></filter>
    <filter id="tSh"><feDropShadow dx="0" dy="5" stdDeviation="2" flood-color="#1A5500" flood-opacity="0.4"/></filter>
    <filter id="eSh"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>

  <!-- BG -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#bgShine)"/>

  <!-- 3D bubble -->
  <g filter="url(#bSh)" transform="rotate(-3, 512, 380)">
    <rect x="168" y="120" width="688" height="440" rx="96" fill="url(#bubbleGrad)"/>
    <path d="M 320 560 L 410 560 L 340 680 Z" fill="#DDE2E8"/>
    <path d="M 322 560 L 408 560 L 345 670 Z" fill="url(#bubbleGrad)"/>
  </g>
  <!-- Shine overlay -->
  <rect x="200" y="135" width="624" height="180" rx="80" fill="url(#bubbleShine)" opacity="0.6" transform="rotate(-3, 512, 380)"/>

  <!-- YORO text - bold rounded, 3D with shadow offset -->
  <g transform="rotate(-3, 512, 380)">
    <!-- Text shadow (offset darker copy) -->
    <text x="512" y="430" text-anchor="middle"
          font-family="'Nunito Black','Baloo 2','Fredoka One','Rubik','Arial Rounded MT Bold','Arial Black',sans-serif"
          font-weight="900" font-size="210" fill="#2B7A00" letter-spacing="2" opacity="0.3"
          dy="8">YORO</text>
    <!-- Main text -->
    <text x="512" y="430" text-anchor="middle"
          font-family="'Nunito Black','Baloo 2','Fredoka One','Rubik','Arial Rounded MT Bold','Arial Black',sans-serif"
          font-weight="900" font-size="210" fill="url(#txtFill)" letter-spacing="2"
          filter="url(#tSh)">YORO</text>
  </g>

  <!-- 3D Eyes -->
  <g filter="url(#eSh)">
    <!-- L eye -->
    <ellipse cx="395" cy="808" rx="64" ry="66" fill="url(#eyeW)" stroke="#C8CDD4" stroke-width="2"/>
    <ellipse cx="410" cy="814" rx="32" ry="34" fill="url(#pup)"/>
    <circle cx="422" cy="800" r="13" fill="#FFF"/>
    <circle cx="406" cy="822" r="5" fill="#FFF" opacity="0.5"/>
    <!-- R eye -->
    <ellipse cx="635" cy="808" rx="64" ry="66" fill="url(#eyeW)" stroke="#C8CDD4" stroke-width="2"/>
    <ellipse cx="650" cy="814" rx="32" ry="34" fill="url(#pup)"/>
    <circle cx="662" cy="800" r="13" fill="#FFF"/>
    <circle cx="646" cy="822" r="5" fill="#FFF" opacity="0.5"/>
  </g>

  <!-- Eyebrows (playful arched) -->
  <path d="M 348 755 Q 395 738, 442 750" stroke="#2D8800" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.35"/>
  <path d="M 588 750 Q 635 738, 682 755" stroke="#2D8800" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.35"/>

  <!-- Smile -->
  <path d="M 468 856 Q 515 890, 562 856" stroke="#2D8800" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.45"/>
</svg>
