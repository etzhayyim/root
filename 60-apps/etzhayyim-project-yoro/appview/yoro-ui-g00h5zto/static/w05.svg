<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#96F040"/><stop offset="100%" stop-color="#28A000"/></linearGradient>
<radialGradient id="burst" cx="0.5" cy="0.4" r="0.55"><stop offset="0%" stop-color="#FFF" stop-opacity="0"/><stop offset="70%" stop-color="#FFF" stop-opacity="0"/><stop offset="100%" stop-color="#FFF" stop-opacity="0.08"/></radialGradient>
<linearGradient id="gl" x1="0.08" y1="0" x2="0.65" y2="1"><stop offset="0%" stop-color="#FFF" stop-opacity="0.9"/><stop offset="100%" stop-color="#ECF0F6" stop-opacity="0.76"/></linearGradient>
<linearGradient id="glHi" x1="0.5" y1="0" x2="0.5" y2="0.35"><stop offset="0%" stop-color="#FFF" stop-opacity="0.65"/><stop offset="100%" stop-color="#FFF" stop-opacity="0"/></linearGradient>
<radialGradient id="pu" cx="0.34" cy="0.26" r="0.5"><stop offset="0%" stop-color="#3838A0"/><stop offset="100%" stop-color="#0E0E2A"/></radialGradient>
<filter id="sh"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="14"/><feColorMatrix values="0 0 0 0 0.04 0 0 0 0 0.16 0 0 0 0 0 0 0 0 0.28 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="tsh"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="5"/><feColorMatrix values="0 0 0 0 0.04 0 0 0 0 0.16 0 0 0 0 0 0 0 0 0.35 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
<!-- Radial burst lines -->
<g stroke="#FFF" stroke-linecap="round" opacity="0.12">
<line x1="512" y1="400" x2="60" y2="100" stroke-width="6"/>
<line x1="512" y1="400" x2="964" y2="80" stroke-width="6"/>
<line x1="512" y1="400" x2="30" y2="500" stroke-width="5"/>
<line x1="512" y1="400" x2="994" y2="480" stroke-width="5"/>
<line x1="512" y1="400" x2="120" y2="900" stroke-width="4"/>
<line x1="512" y1="400" x2="900" y2="920" stroke-width="4"/>
<line x1="512" y1="400" x2="512" y2="20" stroke-width="5"/>
<line x1="512" y1="400" x2="50" y2="300" stroke-width="4"/>
<line x1="512" y1="400" x2="974" y2="280" stroke-width="4"/>
</g>
<rect width="1024" height="1024" rx="224" fill="url(#burst)"/>
<!-- Face -->
<g filter="url(#sh)" transform="rotate(-6, 512, 370)">
<rect x="155" y="95" width="714" height="555" rx="190" fill="url(#gl)"/>
</g>
<rect x="195" y="115" width="634" height="185" rx="150" fill="url(#glHi)" opacity="0.45" transform="rotate(-6, 512, 370)"/>
<g transform="rotate(-6, 512, 370)">
<!-- Fired up eyes -->
<ellipse cx="388" cy="360" rx="78" ry="84" fill="#FFF" opacity="0.94"/>
<ellipse cx="408" cy="356" rx="50" ry="54" fill="url(#pu)"/>
<circle cx="430" cy="334" r="19" fill="#FFF"/>
<circle cx="418" cy="350" r="8" fill="#FFF" opacity="0.5"/>
<ellipse cx="636" cy="360" rx="78" ry="84" fill="#FFF" opacity="0.94"/>
<ellipse cx="656" cy="356" rx="50" ry="54" fill="url(#pu)"/>
<circle cx="678" cy="334" r="19" fill="#FFF"/>
<circle cx="666" cy="350" r="8" fill="#FFF" opacity="0.5"/>
<!-- Big grin -->
<path d="M 445 465 Q 512 530, 579 465" stroke="#1A3A00" stroke-width="7" fill="#FF8A80" fill-opacity="0.2" stroke-linecap="round" opacity="0.3"/>
<!-- Blush -->
<ellipse cx="314" cy="436" rx="34" ry="17" fill="#FF8A80" opacity="0.4"/>
<ellipse cx="710" cy="436" rx="34" ry="17" fill="#FF8A80" opacity="0.4"/>
</g>
<!-- Gold sparkles -->
<g fill="#FFD740">
<path d="M 130 180 L 140 205 L 150 180 L 166 196 L 150 212 L 140 237 L 130 212 L 114 196 Z" opacity="0.6"/>
<path d="M 880 150 L 888 170 L 896 150 L 908 164 L 896 178 L 888 198 L 880 178 L 868 164 Z" opacity="0.5"/>
</g>
<!-- YORO - impact style -->
<text x="512" y="895" text-anchor="middle" font-family="'SF Pro Rounded','-apple-system','Nunito',sans-serif" font-weight="900" font-size="200" fill="#FFF" letter-spacing="4" filter="url(#tsh)" transform="rotate(-4, 512, 895)">YORO</text>
</svg>
