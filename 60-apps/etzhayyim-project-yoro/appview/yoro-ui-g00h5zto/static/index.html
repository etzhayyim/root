    <!-- First-paint: warm the kotoba browser-node so the feed renders LOCALLY
         (kotoba Datom log) instead of falling through to the slow AppView.
         1) Register the module Service Worker as early as possible (during head
            parse, before any bundle/onMount) so it controls this navigation
            sooner. Idempotent with the +layout.svelte registration (which also
            rebinds the passkey identity). Best-effort; never blocks the app. -->
    <script>
      (function () {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/kotoba-sw.js", {
              type: "module",
              scope: "/",
            });
          }
        } catch (e) {
          /* best-effort — registration also retried in +layout.svelte */
        }
      })();
    </script>
    <!-- 2) Prefetch the 2.1MB kotoba WASM binary into the HTTP cache so the SW's

    <link
      rel="preload"
      href="/kotoba/kotoba_wasm_bg.wasm"
      as="fetch"
      type="application/wasm"
      crossorigin="anonymous"
    />

    <!-- 3) Boot skeleton: paints a placeholder feed during HTML parse (before
            SvelteKit hydration + WASM hydration) so the screen is never blank.
            Self-removing as soon as the app paints real content, with an 8s hard
            fallback so it can NEVER stay stuck over the app. JS-only removal,
            no app-code coupling, no CSP dependency (none is set). -->
    <div id="kboot" aria-hidden="true">
      <div class="kb-card"><div class="kb-av"></div><div class="kb-lines"><div class="kb-l kb-w70"></div><div class="kb-l kb-w40"></div></div></div>
      <div class="kb-card"><div class="kb-av"></div><div class="kb-lines"><div class="kb-l kb-w60"></div><div class="kb-l kb-w50"></div></div></div>
      <div class="kb-card"><div class="kb-av"></div><div class="kb-lines"><div class="kb-l kb-w80"></div><div class="kb-l kb-w30"></div></div></div>
      <div class="kb-card"><div class="kb-av"></div><div class="kb-lines"><div class="kb-l kb-w50"></div><div class="kb-l kb-w60"></div></div></div>
    </div>
    <style>
      #kboot {
        position: fixed;
        inset: 0;
        z-index: 0;
        padding: 4.5rem 1rem 1rem;
        max-width: 600px;
        margin-inline: auto;
        background: var(--gv2-bg-primary, #0a0a0a);
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      #kboot .kb-card {
        display: flex;
        gap: 0.75rem;
        padding: 0.9rem 0.2rem;
        border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent);
      }
      #kboot .kb-av {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        flex: none;
        background: color-mix(in srgb, currentColor 14%, transparent);
      }
      #kboot .kb-lines { flex: 1; display: flex; flex-direction: column; gap: 0.55rem; padding-top: 0.35rem; }
      #kboot .kb-l { height: 0.7rem; border-radius: 0.35rem; background: color-mix(in srgb, currentColor 12%, transparent); }
      #kboot .kb-w30 { width: 30%; } #kboot .kb-w40 { width: 40%; } #kboot .kb-w50 { width: 50%; }
      #kboot .kb-w60 { width: 60%; } #kboot .kb-w70 { width: 70%; } #kboot .kb-w80 { width: 80%; }
      #kboot .kb-card, #kboot .kb-av, #kboot .kb-l { animation: kb-pulse 1.3s ease-in-out infinite; }
      @keyframes kb-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    </style>
    <script>
      (function () {
        var k = document.getElementById("kboot");
        if (!k) return;
        var removed = false;
        var drop = function () {
          if (removed || !k) return;
          removed = true;
          k.style.opacity = "0";
          setTimeout(function () {
            if (k && k.parentNode) k.parentNode.removeChild(k);
          }, 220);
        };
        // Remove the moment the app paints any real (non-skeleton) element.
        try {
          var obs = new MutationObserver(function (muts) {
            for (var i = 0; i < muts.length; i++) {
              var added = muts[i].addedNodes;
              for (var j = 0; j < added.length; j++) {
                var n = added[j];
                if (n.nodeType === 1 && n.id !== "kboot") {
                  obs.disconnect();
                  drop();
                  return;
                }
              }
            }
          });
          obs.observe(document.body, { childList: true, subtree: true });
        } catch (e) {
          /* MutationObserver unsupported — rely on the timeout below */
        }
        // Hard fallback: never let the skeleton stay stuck over the app.
        setTimeout(drop, 8000);
      })();
    </script>
