---
# yata-bolt — Bolt v4/v5 TCP proxy (P3, ADR-2605210000 §P3).
# Forwards Neo4j driver connections to lg-yatabase pod via runCypher XRPC.
# No TLS — terminate at Vultr LB or cloudflared.
#
# Build + push:
#   cd 30-graph/yata-bolt
#   docker buildx build --platform linux/amd64 \
#     -t ghcr.io/etzhayyimcojp/yata-bolt:0.1.0-amd64 --push .
#
# Apply:
#   kubectl -n mitama-udf apply -f k8s/yata-bolt.yaml

apiVersion: v1
kind: Service
metadata:
  name: yata-bolt
  namespace: mitama-udf
  labels:
    app.kubernetes.io/component: bolt-proxy
    app.kubernetes.io/name: yata-bolt
    app.kubernetes.io/part-of: yatabase
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: yata-bolt
  ports:
    - name: bolt
      port: 7687
      protocol: TCP
      targetPort: bolt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yata-bolt
  namespace: mitama-udf
  labels:
    app.kubernetes.io/component: bolt-proxy
    app.kubernetes.io/name: yata-bolt
    app.kubernetes.io/part-of: yatabase
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: yata-bolt
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bolt-proxy
        app.kubernetes.io/name: yata-bolt
        app.kubernetes.io/part-of: yatabase
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: yata-bolt
          image: ghcr.io/etzhayyimcojp/yata-bolt:0.1.0-amd64
          imagePullPolicy: IfNotPresent
          ports:
            - name: bolt
              containerPort: 7687
              protocol: TCP
          env:
            - name: BOLT_PORT
              value: "7687"
            - name: LG_YATABASE_URL
              value: http://lg-yatabase.mitama-udf.svc.cluster.local:8000
            - name: LG_YATABASE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-yatabase-secrets
                  key: LG_YATABASE_API_KEY
            - name: RUST_LOG
              value: yata_bolt=info
          livenessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
