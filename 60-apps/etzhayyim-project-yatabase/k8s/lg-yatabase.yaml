---
# no-server-key: read-only — pending Stage A-E member-signed-writes refactor per ADR-2605231525
# lg-yatabase Granian/FastAPI pod. Mirrors lg-narou pattern.
# Owns vertex_bmc_* + vertex_api_key + vertex_lead writes per
# ADR-2605111200 (CF Worker is edge-only).
#
# Container image built locally + pushed to ghcr.io:
#   cd 60-apps/etzhayyim-project-yatabase/lg
#   docker buildx build --platform linux/amd64 \
#     --build-context py=../../../20-actors/magatama/py \
#     -t ghcr.io/etzhayyim/lg-yatabase:0.0.2-amd64 --push .
#
# Apply:
#   kubectl -n mitama-udf apply -f k8s/lg-yatabase.yaml

apiVersion: v1
kind: Service
metadata:
  name: lg-yatabase
  namespace: mitama-udf
  labels:
    app.kubernetes.io/component: langgraph-server
    app.kubernetes.io/name: lg-yatabase
    app.kubernetes.io/part-of: yatabase
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lg-yatabase
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lg-yatabase
  namespace: mitama-udf
  labels:
    app.kubernetes.io/component: langgraph-server
    app.kubernetes.io/name: lg-yatabase
    app.kubernetes.io/part-of: yatabase
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: lg-yatabase
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: langgraph-server
        app.kubernetes.io/name: lg-yatabase
        app.kubernetes.io/part-of: yatabase
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: lg-yatabase
          image: ghcr.io/etzhayyim/lg-yatabase:0.0.2-amd64
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              hostPort: 30800
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
            - name: PDS_URL
              value: https://atproto.etzhayyim.com
            - name: BPMN_DISPATCHER_INTERNAL_URL
              value: http://bpmn-dispatcher.mitama-udf.svc.cluster.local:8080
            - name: RW_URL
              valueFrom:
                secretKeyRef:
                  name: lg-yatabase-secrets
                  key: RW_URL
            - name: LG_CHECKPOINTER_URL
              valueFrom:
                secretKeyRef:
                  name: lg-yatabase-secrets
                  key: RW_URL
            - name: DISPATCHER_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: lg-yatabase-secrets
                  key: DISPATCHER_INTERNAL_SECRET
            - name: LG_YATABASE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-yatabase-secrets
                  key: LG_YATABASE_API_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-yatabase-secrets
                  key: OPENROUTER_API_KEY
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-yatabase-secrets
                  key: STRIPE_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /ok
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
