<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58CC02"/>
      <stop offset="100%" stop-color="#46A302"/>
    </linearGradient>
  </defs>

  <!-- Duolingo-style bright green rounded square -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg1)"/>

  <!-- Big friendly chat bubble - rounded, chunky -->
  <rect x="200" y="160" width="624" height="420" rx="80" fill="#FFFFFF"/>
  <!-- Bubble tail -->
  <polygon points="340,580 420,580 360,680" fill="#FFFFFF"/>

  <!-- Bold playful YORO text -->
  <text x="512" y="430" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="200" fill="#58CC02" letter-spacing="-8">YORO</text>

  <!-- Cute eyes (Duolingo owl style) -->
  <circle cx="390" cy="810" r="55" fill="#FFFFFF"/>
  <circle cx="634" cy="810" r="55" fill="#FFFFFF"/>
  <circle cx="405" cy="815" r="28" fill="#1A1A2E"/>
  <circle cx="649" cy="815" r="28" fill="#1A1A2E"/>
  <circle cx="415" cy="805" r="10" fill="#FFFFFF"/>
  <circle cx="659" cy="805" r="10" fill="#FFFFFF"/>
</svg>
