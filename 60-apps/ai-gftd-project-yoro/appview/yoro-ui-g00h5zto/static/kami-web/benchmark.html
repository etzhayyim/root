<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAMI Engine — Performance Benchmark</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #141418; color: #ccc; font: 11px system-ui, sans-serif; }
  canvas { width: 100%; height: 100%; display: block; }
  .stats {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.75); border: 1px solid #2a2a34; border-radius: 8px;
    padding: 10px 14px; font: 11px system-ui, sans-serif; color: #ccc;
    min-width: 180px; pointer-events: none;
  }
  .stats .label { color: #666; font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px; }
  .stats .label:first-child { margin-top: 0; }
  .stats .value { color: #58CC02; font-size: 13px; font-weight: 700; }
  .stats .value.warn { color: #FFC800; }
  .stats .value.bad { color: #FF4B4B; }
  .controls {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,0.75); border: 1px solid #2a2a34; border-radius: 8px;
    padding: 8px 12px; pointer-events: auto;
  }
  .controls label { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
  .controls select {
    display: block; margin-top: 4px;
    background: #1a1a22; color: #58CC02; border: 1px solid #2a2a34; border-radius: 4px;
    padding: 4px 8px; font: 11px system-ui, sans-serif; cursor: pointer;
  }
  .controls select:focus { outline: 1px solid #58CC02; }
  .back {
    position: absolute; bottom: 8px; left: 8px;
    color: #58CC02; font-size: 10px; text-decoration: none; opacity: 0.7;
    pointer-events: auto;
  }
  .back:hover { opacity: 1; }
  .log {
    position: absolute; bottom: 8px; right: 8px;
    font: 9px monospace; color: #444; max-width: 50%;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="bench"></canvas>

<div class="stats" id="stats">
  <div class="label">FPS</div>
  <div class="value" id="s-fps">--</div>
  <div class="label">Frame Time</div>
  <div class="value" id="s-ft">--</div>
  <div class="label">Vertices</div>
  <div class="value" id="s-verts">--</div>
  <div class="label">Triangles</div>
  <div class="value" id="s-tris">--</div>
  <div class="label">WASM Init</div>
  <div class="value" id="s-init">--</div>
  <div class="label">Mesh Gen</div>
  <div class="value" id="s-mesh">--</div>
  <div class="label">Resolution</div>
  <div class="value" id="s-res">--</div>
  <div class="label">GPU Adapter</div>
  <div class="value" id="s-gpu" style="font-size:10px;word-break:break-all;">--</div>
</div>

<div class="controls">
  <label>Resolution</label>
  <select id="res-select">
    <option value="16">16</option>
    <option value="32" selected>32</option>
    <option value="48">48</option>
    <option value="64">64</option>
  </select>
</div>

<a class="back" href="index.html">&larr; Showcase</a>
<div class="log" id="log"></div>

<script type="module">
const SDF = JSON.stringify({"@type":"SmoothUnion","k":0.4,"children":[
  {"@type":"Sphere","r":1.6,"pos":[0,1.2,0],"color":"#58CC02"},
  {"@type":"Sphere","r":1.5,"pos":[0,2.9,0],"color":"#58CC02"},
  {"@type":"Sphere","r":0.48,"pos":[-0.6,2.95,1.1],"scale":[1,1,0.55],"color":"white"},
  {"@type":"Sphere","r":0.48,"pos":[0.6,2.95,1.1],"scale":[1,1,0.55],"color":"white"},
  {"@type":"Sphere","r":0.32,"pos":[-0.6,3.0,1.3],"scale":[1,1,0.45],"color":"#1CB0F6"},
  {"@type":"Sphere","r":0.32,"pos":[0.6,3.0,1.3],"scale":[1,1,0.45],"color":"#1CB0F6"},
  {"@type":"Cylinder","h":0.12,"r":0.7,"pos":[0,4.0,0],"color":"#E8E8EA"},
  {"@type":"Cylinder","h":0.8,"r":0.5,"pos":[0,4.45,0],"color":"#EDEDF0"},
  {"@type":"Sphere","r":0.52,"pos":[0,4.85,0],"color":"#EDEDF0"},
  {"@type":"Capsule","h":1.2,"r":0.3,"pos":[-1.5,1.3,0],"rot":[0,0,35],"color":"#46A302"},
  {"@type":"Capsule","h":1.2,"r":0.3,"pos":[1.5,1.3,0],"rot":[0,0,-35],"color":"#46A302"},
  {"@type":"Sphere","r":0.45,"pos":[-0.55,0.1,0.2],"scale":[1,0.5,1.3],"color":"#46A302"},
  {"@type":"Sphere","r":0.45,"pos":[0.55,0.1,0.2],"scale":[1,0.5,1.3],"color":"#46A302"}
]});

const logEl = document.getElementById('log');
function log(msg) { logEl.textContent = msg; }

let mod = null;
let running = false;

// FPS tracking
let frameCount = 0;
let lastFpsTime = performance.now();
let lastFrameTime = performance.now();

function updateFPS() {
  const now = performance.now();
  frameCount++;
  const dt = now - lastFrameTime;
  lastFrameTime = now;

  document.getElementById('s-ft').textContent = dt.toFixed(1) + ' ms';
  const cls = dt > 33 ? 'value bad' : dt > 16.7 ? 'value warn' : 'value';
  document.getElementById('s-ft').className = cls;

  if (now - lastFpsTime >= 1000) {
    const fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
    document.getElementById('s-fps').textContent = fps;
    document.getElementById('s-fps').className = fps < 30 ? 'value bad' : fps < 55 ? 'value warn' : 'value';
    frameCount = 0;
    lastFpsTime = now;
  }
  requestAnimationFrame(updateFPS);
}

function estimateGeometry(resolution) {
  // Marching cubes: rough estimate based on resolution cubed
  const cells = resolution * resolution * resolution;
  // Typical fill ratio for YORO SDF ~15-25%
  const fillRatio = 0.2;
  const activeCells = Math.round(cells * fillRatio);
  // Each active cell produces ~1-2 triangles on average
  const tris = Math.round(activeCells * 1.5);
  const verts = Math.round(tris * 3 * 0.5); // shared vertices ~50%
  return { verts, tris };
}

async function render(resolution) {
  if (running) return;
  running = true;

  if (!navigator.gpu) {
    log('WebGPU not supported');
    running = false;
    return;
  }

  // GPU info
  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (adapter) {
      const info = adapter.info || {};
      document.getElementById('s-gpu').textContent =
        (info.vendor || '?') + ' / ' + (info.architecture || info.device || '?');
    }
  } catch(e) {}

  // WASM init
  if (!mod) {
    log('loading WASM...');
    const t0 = performance.now();
    mod = await import('./kami_web.js');
    await mod.default('./kami_web_bg.wasm');
    const initTime = performance.now() - t0;
    document.getElementById('s-init').textContent = initTime.toFixed(0) + ' ms';
    log('WASM ready');
  }

  document.getElementById('s-res').textContent = resolution + '\u00B3';

  const geo = estimateGeometry(resolution);
  document.getElementById('s-verts').textContent = geo.verts.toLocaleString();
  document.getElementById('s-tris').textContent = geo.tris.toLocaleString();

  // Mesh generation + render
  const t1 = performance.now();
  try {
    await mod.run_embed_sdf_jsonld('bench', SDF, resolution, 'dense');
    const meshTime = performance.now() - t1;
    document.getElementById('s-mesh').textContent = meshTime.toFixed(0) + ' ms';
    log('rendering at ' + resolution + '\u00B3');
    requestAnimationFrame(updateFPS);
  } catch(e) {
    log('render error: ' + (e?.message || e));
  }
  running = false;
}

// Resolution selector
document.getElementById('res-select').addEventListener('change', (e) => {
  const res = parseInt(e.target.value, 10);
  render(res);
});

// Initial render
render(32);
</script>
</body>
</html>
