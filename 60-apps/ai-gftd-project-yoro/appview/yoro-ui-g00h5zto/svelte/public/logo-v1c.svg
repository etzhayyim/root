<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8AE840"/>
      <stop offset="40%" stop-color="#58CC02"/>
      <stop offset="100%" stop-color="#38A000"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#B4FF6A" stop-opacity="0.3"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
    <!-- Bubble as 3D pill shape -->
    <linearGradient id="bub3d" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F6F8FA"/>
      <stop offset="100%" stop-color="#D4DAE2"/>
    </linearGradient>
    <linearGradient id="bubEdge" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#B0B8C4" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="txt3d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80E020"/>
      <stop offset="50%" stop-color="#58CC02"/>
      <stop offset="100%" stop-color="#2E9000"/>
    </linearGradient>
    <radialGradient id="ew3" cx="0.4" cy="0.35">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="100%" stop-color="#D0D6DE"/>
    </radialGradient>
    <radialGradient id="pp3" cx="0.35" cy="0.3">
      <stop offset="0%" stop-color="#303058"/>
      <stop offset="100%" stop-color="#0A0A20"/>
    </radialGradient>
    <filter id="bSh3"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0E4400" flood-opacity="0.45"/></filter>
    <filter id="tSh3"><feDropShadow dx="0" dy="6" stdDeviation="2" flood-color="#0E4400" flood-opacity="0.45"/></filter>
    <filter id="eSh3"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/></filter>
    <filter id="glow"><feGaussianBlur in="SourceGraphic" stdDeviation="4"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#bgGlow)"/>

  <!-- Bubble character - face IS the bubble -->
  <g filter="url(#bSh3)">
    <rect x="152" y="88" width="720" height="520" rx="120" fill="url(#bub3d)"/>
    <!-- Bottom edge shadow -->
    <rect x="152" y="460" width="720" height="148" rx="0" fill="url(#bubEdge)" clip-path="inset(0 0 0 0 round 0 0 120px 120px)"/>
    <!-- Tail -->
    <path d="M 280 608 Q 260 700, 240 740 Q 300 680, 350 608 Z" fill="url(#bub3d)"/>
  </g>
  <!-- Top shine -->
  <rect x="200" y="105" width="600" height="160" rx="100" fill="#FFF" opacity="0.3"/>

  <!-- Big kawaii eyes inside bubble -->
  <g filter="url(#eSh3)">
    <!-- L -->
    <ellipse cx="380" cy="310" rx="72" ry="80" fill="url(#ew3)" stroke="#BCC4D0" stroke-width="2"/>
    <ellipse cx="398" cy="320" rx="38" ry="42" fill="url(#pp3)"/>
    <circle cx="414" cy="304" r="16" fill="#FFF"/>
    <circle cx="394" cy="338" r="6" fill="#FFF" opacity="0.5"/>
    <!-- R -->
    <ellipse cx="644" cy="310" rx="72" ry="80" fill="url(#ew3)" stroke="#BCC4D0" stroke-width="2"/>
    <ellipse cx="662" cy="320" rx="38" ry="42" fill="url(#pp3)"/>
    <circle cx="678" cy="304" r="16" fill="#FFF"/>
    <circle cx="658" cy="338" r="6" fill="#FFF" opacity="0.5"/>
  </g>

  <!-- Blush -->
  <ellipse cx="290" cy="400" rx="42" ry="24" fill="#FF9E80" opacity="0.35"/>
  <ellipse cx="734" cy="400" rx="42" ry="24" fill="#FF9E80" opacity="0.35"/>

  <!-- Smile -->
  <path d="M 430 430 Q 512 500, 594 430" stroke="#1A3A00" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.3"/>

  <!-- Typing dots (animation feel) -->
  <circle cx="460" cy="530" r="18" fill="#B8E6A0" opacity="0.7">
  </circle>
  <circle cx="520" cy="530" r="18" fill="#8ED86E" opacity="0.8">
  </circle>
  <circle cx="580" cy="530" r="18" fill="#64C83C" opacity="0.9">
  </circle>

  <!-- YORO below - big, chunky, 3D -->
  <!-- Shadow text -->
  <text x="516" y="890" text-anchor="middle"
        font-family="'Fredoka One','Nunito Black','Baloo 2','Rubik','Arial Rounded MT Bold',sans-serif"
        font-weight="900" font-size="220" fill="#1A5000" letter-spacing="8" opacity="0.3"
        dy="10">YORO</text>
  <!-- Main text -->
  <text x="512" y="886" text-anchor="middle"
        font-family="'Fredoka One','Nunito Black','Baloo 2','Rubik','Arial Rounded MT Bold',sans-serif"
        font-weight="900" font-size="220" fill="#FFFFFF" letter-spacing="8"
        stroke="#D0F0B0" stroke-width="2"
        filter="url(#tSh3)">YORO</text>

  <!-- Sparkle accents -->
  <g opacity="0.6">
    <path d="M 130 180 L 138 200 L 146 180 L 158 188 L 146 196 L 138 216 L 130 196 L 118 188 Z" fill="#FFF"/>
    <path d="M 880 160 L 886 174 L 892 160 L 900 166 L 892 172 L 886 186 L 880 172 L 872 166 Z" fill="#FFF"/>
    <path d="M 900 720 L 905 730 L 910 720 L 916 725 L 910 730 L 905 740 L 900 730 L 894 725 Z" fill="#FFF" opacity="0.4"/>
  </g>
</svg>
