overwrite: true
schema:
  - 'http://localhost:8080/schema':
      headers:
        Content-Type: application/json
documents: 'ports/services/graphql/**/*.ts'
generates:
  ports/services/graphql/generated/types.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      skipTypename: false
      withHooks: true
      withComponent: false
      withHOC: false
      apolloClientVersion: 3
      enumsAsTypes: true
      scalars:
        DateTime: string
        JSON: any
      namingConvention:
        typeNames: 'keep'
        enumValues: 'keep'

