syntax = "proto3";

package emotional_analytics;

option go_package = "github.com/etzhayyim/kyber-erp/gen/emotionalanalytics";

import "google/protobuf/timestamp.proto";

message EmotionVector {
  float valence = 1;
  float arousal = 2;
  float dominance = 3;
  float urgency = 4;
  float confidence = 5;
  repeated string emotion_labels = 6;
}

message MessageSample {
  string message_id = 1;
  string text = 2;
  string role = 3;
  google.protobuf.Timestamp created_at = 4;
}

message AnalyzeMessageRequest {
  string tenant_id = 1;
  string conversation_id = 2;
  MessageSample message = 3;
  map<string, string> metadata = 4;
}

message AnalyzeMessageResponse {
  EmotionVector vector = 1;
  string model_name = 2;
  string model_version = 3;
  google.protobuf.Timestamp analyzed_at = 4;
}

message AnalyzeThreadRequest {
  string tenant_id = 1;
  string conversation_id = 2;
  repeated MessageSample messages = 3;
  int32 window_size = 4;
}

message AnalyzeThreadResponse {
  EmotionVector latest = 1;
  bool escalating = 2;
  string response_style_hint = 3;
  string model_name = 4;
  string model_version = 5;
  google.protobuf.Timestamp analyzed_at = 6;
}

service EmotionalAnalyticsService {
  rpc AnalyzeMessage(AnalyzeMessageRequest) returns (AnalyzeMessageResponse);
  rpc AnalyzeThread(AnalyzeThreadRequest) returns (AnalyzeThreadResponse);
}
