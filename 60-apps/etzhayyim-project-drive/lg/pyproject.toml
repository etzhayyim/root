[project]
name = "lg-drive"
version = "0.1.0"
description = "LangGraph + FastAPI XRPC for drive.etzhayyim.com — Google Drive v3 + Microsoft Graph (OneDrive) compatible drive API backed by kotoba datomic (ADR-2606010500)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2.61",
    "langchain-core>=0.3.30",
    "httpx>=0.28.1",
    "pydantic>=2.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "nanoid>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lg_drive*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
