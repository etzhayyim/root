[project]
name = "lg-pd-color"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "pymagatama",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lg_pd_color"]
