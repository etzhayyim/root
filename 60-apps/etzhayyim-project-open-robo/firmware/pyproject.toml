[project]
name = "armcrawler-jp-firmware"
version = "0.1.0"
description = "ArmCrawler JP Raspberry Pi 5 firmware"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.26",
    "scipy>=1.12",
    "RPi.GPIO>=0.7; platform_machine == 'aarch64'",
    "smbus2>=0.4",
    "picamera2>=0.3; platform_machine == 'aarch64'",
]

[project.optional-dependencies]
ros2 = [
    "rclpy",
    "sensor-msgs",
    "geometry-msgs",
    "trajectory-msgs",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
