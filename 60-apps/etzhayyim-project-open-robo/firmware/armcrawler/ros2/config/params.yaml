# OteteJP ROS2 node parameters
# Edit to match your hardware configuration

arm_controller:
  ros__parameters:
    servo_port: "/dev/ttyAMA0"
    tx_en_gpio: 17
    servo_ids: [1, 2, 3, 4, 5, 6]
    ik_tol_mm: 0.5

crawler:
  ros__parameters:
    wheel_base_m: 0.18
    max_speed: 1.0
    pwm_freq_hz: 20000

camera:
  ros__parameters:
    width: 640
    height: 480
    target_fps: 30
    encoding: "bgr8"
    camera_frame: "camera_link"

imu:
  ros__parameters:
    spi_bus: 0
    spi_device: 0
    spi_max_hz: 8000000
    accel_range: 4     # ±4g
    gyro_range: 500    # ±500 dps
