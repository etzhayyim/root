syntax = "proto3";

package har.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/etzhayyim/etzhayyim-har/gen/go/har/v1;harv1";

// Persona - AI + Human のハイブリッド・リソース定義
message HybridPersona {
  string id = 1;
  string name = 2;
  string description = 3;
  
  // AI部分の定義
  AiComponent ai_component = 4;
  
  // 人間（バックアップ）部分の定義
  HumanComponent human_component = 5;

  google.protobuf.Timestamp created_at = 6;
}

message AiComponent {
  string actor_image_url = 1; // Wasm Actor image
  repeated string capabilities = 2; // cap:har:*
  string base_model = 3; // e.g., "gpt-4o", "claude-3.5-sonnet"
}

message HumanComponent {
  string isco_role_code = 1; // ISCO-08 code (e.g., "2511")
  repeated string required_skills = 2; // ESCO skills
  string escalation_policy = 3; // e.g., "immediate", "daily_digest"
}
