syntax = "proto3";

package har.v1;

import "google/protobuf/timestamp.proto";
import "har/v1/persona.proto";

option go_package = "github.com/etzhayyim/etzhayyim-har/gen/go/har/v1;harv1";

// HarService - Human + AI Resource Management Service
service HarService {
  // ISCO-08職種の一覧取得（etzhayyim-project-open-iscoの全WASMコンポーネント）
  rpc ListIscoJobs(ListIscoJobsRequest) returns (ListIscoJobsResponse);

  // AIアクターからの支援要請（Human-in-the-loopの開始）
  rpc RequestEscalation(RequestEscalationRequest) returns (RequestEscalationResponse);
  
  // 人間によるAI成果物の査読・修正
  rpc ReviewAiOutput(ReviewAiOutputRequest) returns (ReviewAiOutputResponse);
  
  // AI+Humanの稼働ステータス監視
  rpc GetWorkforceHealth(GetWorkforceHealthRequest) returns (GetWorkforceHealthResponse);

  // エスカレーション履歴の取得
  rpc ListEscalations(ListEscalationsRequest) returns (ListEscalationsResponse);

  // タスクの実行 (AI -> 必要に応じてHuman)
  rpc ExecuteTask(ExecuteTaskRequest) returns (ExecuteTaskResponse);

  // Personaの購入・契約 (Stripe統合)
  rpc PurchasePersona(PurchasePersonaRequest) returns (PurchasePersonaResponse);

  // 決済完了後のPersona有効化
  rpc ActivatePersona(ActivatePersonaRequest) returns (ActivatePersonaResponse);

  // 自動成長サイクル (広告自動生成・投稿)
  rpc TriggerGrowthCycle(TriggerGrowthCycleRequest) returns (TriggerGrowthCycleResponse);
}

message Escalation {
  string id = 1;
  string ai_actor_id = 2;
  string title = 3;
  string description = 4;
  string context_json = 5; // AIの現在の状態やデータ
  string required_isco_role = 6; // 必要な人間の職能 (ISCO-08)
  string status = 7; // PENDING, IN_PROGRESS, RESOLVED, REJECTED
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  optional string human_performer_id = 10;
  optional string resolution_note = 11;
}

message RequestEscalationRequest {
  string ai_actor_id = 1;
  string title = 2;
  string description = 3;
  string context_json = 4;
  string required_isco_role = 5;
}

message RequestEscalationResponse {
  Escalation escalation = 1;
}

message ReviewAiOutputRequest {
  string escalation_id = 1;
  string human_performer_id = 2;
  string resolution_note = 3;
  string updated_context_json = 4;
  bool approved = 5;
}

message ReviewAiOutputResponse {
  Escalation escalation = 1;
}

message GetWorkforceHealthRequest {
  string org_id = 1;
}

message GetWorkforceHealthResponse {
  int32 active_ai_actors = 1;
  int32 pending_escalations = 2;
  double autonomous_rate = 3; // AIが自律的に完了した割合
}

message ListEscalationsRequest {
  string org_id = 1;
  optional string status = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListEscalationsResponse {
  repeated Escalation escalations = 1;
  int32 total = 2;
}

message ExecuteTaskRequest {
  string ai_actor_id = 1;
  string prompt = 2;
  string required_isco_role = 3;
}

message ExecuteTaskResponse {
  string task_id = 1;
  string status = 2; // PENDING, PROCESSING, ESCALATED, COMPLETED
  optional string result = 3;
}

message PurchasePersonaRequest {
  string persona_id = 1;
  string customer_id = 2;
  string currency = 3;
}

message PurchasePersonaResponse {
  string checkout_url = 1;
  string subscription_id = 2;
}

message ActivatePersonaRequest {
  string persona_id = 1;
  string customer_id = 2;
  string stripe_session_id = 3;
}

message ActivatePersonaResponse {
  bool success = 1;
  string activation_id = 2;
}

message TriggerGrowthCycleRequest {
  string target_platform = 1; // e.g., "X", "LinkedIn"
  string theme = 2;
}

message TriggerGrowthCycleResponse {
  string workflow_id = 1;
  string status = 2;
}

// ISCO-08 Occupation listing messages

message IscoJob {
  string code = 1;         // ISCO-08 unit group code (4 digits, e.g. "1111")
  string major_group = 2;  // First digit (0-9)
  string major_name = 3;   // e.g. "Managers"
  string sub_major = 4;    // First two digits (e.g. "11")
  string description = 5;  // Occupation title / description
  string component_id = 6; // full folder name from etzhayyim-project-open-isco
}

message ListIscoJobsRequest {
  optional string major_group = 1;  // filter by major group digit (0-9)
  optional string query = 2;        // text search in description
}

message ListIscoJobsResponse {
  repeated IscoJob jobs = 1;
  int32 total = 2;
}
