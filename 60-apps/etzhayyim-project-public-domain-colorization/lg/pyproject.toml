[project]
name = "lg-pd-color"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.30",
    "langgraph>=1.2.2",
    "langchain-core>=1.4.0",
    "httpx>=0.27.0",
    "kotodama",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.409",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "lg_pd_color",
]
