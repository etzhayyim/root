[tools]
go = "1.25"
node = "22"
python = "3.12"

[env]
WORKSPACE_ROOT = "{{config_root}}"
PORT = "8081"
_.file = "apps/.env"

# --- Development ---

[tasks.dev]
description = "Start all services (Ctrl+C to stop all)"
run = """
#!/bin/bash
trap 'kill 0' EXIT

# Kill existing processes on our ports
for port in 8081 1421; do
  pid=$(lsof -ti:$port 2>/dev/null)
  if [ -n "$pid" ]; then
    echo "Killing existing process on port $port (PID: $pid)"
    kill -9 $pid 2>/dev/null
    sleep 0.5
  fi
done

echo "Starting Go server on :8081..."
cd apps/server && go run cmd/server/main.go &

echo "Starting Svelte dev server on :1421..."
cd apps/web && pnpm dev &

echo ""
echo "=== All services started ==="
echo "  Web UI:    http://localhost:1421"
echo "  API:       http://localhost:8081"
echo "  Image Gen: run 'mise run image-gen' separately (MPS model loading is slow)"
echo ""
echo "Press Ctrl+C to stop all services."
wait
"""

[tasks.server]
description = "Start Go backend server"
dir = "apps/server"
run = """
#!/bin/bash
pid=$(lsof -ti:8081 2>/dev/null)
[ -n "$pid" ] && echo "Killing port 8081 (PID: $pid)" && kill -9 $pid && sleep 0.5
go run cmd/server/main.go
"""

[tasks.web]
description = "Start Svelte dev server"
dir = "apps/web"
run = """
#!/bin/bash
pid=$(lsof -ti:1421 2>/dev/null)
[ -n "$pid" ] && echo "Killing port 1421 (PID: $pid)" && kill -9 $pid && sleep 0.5
pnpm dev
"""

[tasks."image-gen"]
description = "Start local image generation service (MPS)"
dir = "apps/image-gen"
run = """
#!/bin/bash
pid=$(lsof -ti:8100 2>/dev/null)
[ -n "$pid" ] && echo "Killing port 8100 (PID: $pid)" && kill -9 $pid && sleep 0.5
source .venv/bin/activate && python app.py
"""

# --- Setup ---

[tasks.setup]
description = "Install all dependencies"
depends = ["setup:web", "setup:image-gen"]

[tasks."setup:web"]
description = "Install web dependencies"
dir = "apps/web"
run = "pnpm install"

[tasks."setup:image-gen"]
description = "Setup Python venv and install image-gen dependencies"
dir = "apps/image-gen"
run = "bash setup.sh"

# --- Code Generation ---

[tasks."buf:gen"]
description = "Regenerate protobuf code (Go + TypeScript)"
dir = "apps/server"
run = "buf generate"

# --- Build ---

[tasks.build]
description = "Build all services"
depends = ["build:server", "build:web"]

[tasks."build:server"]
description = "Build Go server binary"
dir = "apps/server"
run = "go build -o ../../bin/server cmd/server/main.go"

[tasks."build:web"]
description = "Build Svelte for production"
dir = "apps/web"
run = "pnpm build"
