[project]
name = "etzhayyim-organism-viz"
version = "0.2.0"
description = "Realtime + interactive visualization of the religious-corp artificial-organism ecosystem (bonsai metaphor: leaves / flowers / fruits / seeds)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0",
]

[project.scripts]
etzhayyim-viz = "etzhayyim_organism_viz.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etzhayyim_organism_viz"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "etzhayyim_organism_viz/dist"
