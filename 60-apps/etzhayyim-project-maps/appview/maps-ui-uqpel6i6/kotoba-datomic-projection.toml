# kotoba-datomic-projection manifest for maps-ui-uqpel6i6
#
# Per ADR-2605231500 — this directory's Kysely / RW reads are a derived
# read-path cache, not canonical state. Canonical state lives on:
#   - com.etzhayyim.maps.* records in the maps.etzhayyim.com PDS (MST)
#   - content blobs in IPFS (gsplat PLY/GLB, KAMI bake outputs)
#   - Base L2 anchor (MST root commitments, post-Phase 6)
#
# This manifest exempts the storage-substrate lint rule for files under this
# directory. The exemption is conditional on the rebuild runbook below
# remaining executable.

[projection]
name = "maps-spatial-rw"
level = "L0-projection"   # bumps to L1-projection after tools/rebuild-spatial-projection.ts lands + CI smoke
rebuild_runbook = "../../tools/rebuild-spatial-projection.md"
adr = "2605231500"
kotoba-datomic_companion_adr = "2605231400"
related_migration = "60-apps/etzhayyim-project-maps/MIGRATION-TODO.md"
owner = "maps-ui maintainers"
last_reviewed = "2026-05-23"

# Source-of-truth collections this projection is derived from. Every row
# in the tables below MUST be re-derivable from records in these collections.
source_collections = [
  # Geo + AdminArea + source registry (Tier A from MIGRATION-TODO)
  "com.etzhayyim.maps.feature",
  "com.etzhayyim.maps.adminArea",
  "com.etzhayyim.maps.region",
  "com.etzhayyim.maps.geoAlias",
  "com.etzhayyim.maps.source",
  "com.etzhayyim.maps.displayLayer",
  # Geography + transport register (Tier B)
  "com.etzhayyim.maps.spot",
  "com.etzhayyim.maps.river",
  "com.etzhayyim.maps.lake",
  "com.etzhayyim.maps.coastline",
  "com.etzhayyim.maps.mountain",
  "com.etzhayyim.maps.maritimeZone",
  "com.etzhayyim.maps.road",
  "com.etzhayyim.maps.railway",
  "com.etzhayyim.maps.seaRoute",
  "com.etzhayyim.maps.airRoute",
  "com.etzhayyim.maps.busRoute",
  "com.etzhayyim.maps.waterway",
  "com.etzhayyim.maps.port",
  "com.etzhayyim.maps.airport",
  "com.etzhayyim.maps.station",
  "com.etzhayyim.maps.busStop",
  "com.etzhayyim.maps.parking",
  "com.etzhayyim.maps.evCharger",
  # Digital twin (Tier B)
  "com.etzhayyim.maps.building",
  "com.etzhayyim.maps.buildingFloor",
  "com.etzhayyim.maps.physicalAsset",
  "com.etzhayyim.maps.twinState",
  "com.etzhayyim.maps.deviceBinding",
  "com.etzhayyim.maps.sensor",
  "com.etzhayyim.maps.sensorReading",
  # Transit timetable (Tier B + Tier C projection)
  "com.etzhayyim.maps.trip",
  "com.etzhayyim.maps.stopTime",
  # GTFS-RT (Tier C — projection-of-firehose)
  "com.etzhayyim.maps.vehiclePosition",
  "com.etzhayyim.maps.tripUpdate",
  "com.etzhayyim.maps.serviceAlert",
  # gsplat (Tier B + Tier D blob)
  "com.etzhayyim.maps.gsplatAsset",
  "com.etzhayyim.maps.gsplatMesh",
  "com.etzhayyim.maps.gsplatJob",
  # Vision / satellite (Tier B)
  "com.etzhayyim.maps.visionResult",
  "com.etzhayyim.maps.satelliteScene",
  # Mapraly / web-crawl / post-EXIF (Tier B + cross-actor)
  "com.etzhayyim.maps.mapralyPoi",
  "com.etzhayyim.maps.webCrawlGeoEntity",
  "com.etzhayyim.maps.postLocation",
  # Cross-app (read-only consumers)
  "app.bsky.feed.post",   # for maps-social profile derivation
]

# Projection tables this manifest exempts. Each table is rebuildable from
# the source_collections above; the rebuild path is documented in the runbook.
projection_tables = [
  "vertex_spatial",
  "vertex_spatial_count",
  "vertex_maps_building_",
  "vertex_maps_gsplat_asset",
  "vertex_maps_gsplat_job",
  "vertex_maps_gsplat_mesh",
  "vertex_maps_social_profile",
  "vertex_maps_stop_time",
  "vertex_maps_trip",
  "vertex_maps_vehicle_position",
  "vertex_maps_trip_update",
  "vertex_maps_service_alert",
  "vertex_legal_entity",
  "vertex_osm_element",
  "vertex_vessel",
]

# Streaming materialized views derived from the tables above. Treated as
# transitive projections — rebuildable as a side-effect of rebuilding the
# base tables (see rebuild runbook §3).
projection_mvs = [
  "mv_maps_recent_vehicle_position",
  "mv_maps_recent_trip_update",
  "mv_maps_active_alerts",
  "mv_maps_gsplat_job_latest",
]

# Substrates currently in use for the projection. Allowed by ADR-2605231500
# §"Allowed substrates for projections" — substrate choice is implementation
# detail; what matters is the rebuild guarantee above.
storage_substrates = [
  { kind = "risingwave", binding = "HYPERDRIVE", note = "primary projection — append-only INSERT via Kysely" },
  { kind = "r2", binding = "YATA_R2", note = "edge cache for tile / blob fallback" },
  { kind = "b2", note = "gsplat PLY/GLB content-addressed — migrates to IPFS in MIGRATION-TODO Phase 2" },
]

# Estimated wall-clock rebuild time on the current Murakumo fleet
# (10 nodes × ~6 cells, dominated by IPFS pin-set traversal + Kysely batch insert).
rebuild_estimated_minutes = 240
rebuild_estimated_minutes_note = "dominated by vertex_spatial (~10M rows) + GTFS feeds (~5M stop_times) + 6 month gsplat job log replay"

# Non-determinism enumeration (required for future L2-projection promotion).
# Every entry here is a piece of the projection that is intentionally not
# bit-identical across replays.
[[non_determinism]]
field = "vertex_spatial.row_id"
reason = "sequence-allocated on INSERT; replays produce same logical row, different physical ID"

[[non_determinism]]
field = "vertex_maps_*.created_at_db"
reason = "RW server timestamp at INSERT time, not in source record"

[[non_determinism]]
field = "mv_maps_recent_*.materialized_at"
reason = "streaming MV refresh timestamp; not a function of source"

# Promotion checklist — what's needed to bump this projection from L0 to L1.
[promotion_to_l1]
required = [
  "tools/rebuild-spatial-projection.ts implemented and exercised in CI smoke",
  "Projection consumer subscribes to com.atproto.sync.subscribeRepos for maps.etzhayyim.com PDS",
  "Out-of-order write rejection wired (refuse a projection write whose source PDS commit seq < last seen)",
  "Drift detector: periodic random-CID re-derive + alert on divergence",
]
target_quarter = "Q3 2026 (after MIGRATION-TODO Phase 3)"
