[project]
name = "lg-lawfirm-intake"
version = "0.1.0"
description = "LangGraph Server: lawfirm.etzhayyim.com intake triage + bengoshi matching pod."
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2.61",
    "langchain-core>=0.3.30",
    "httpx>=0.28.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "granian>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1.300",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lg_lawfirm_intake*"]
