<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etz Hayyim World State Monitor</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 1.5rem; color: #58a6ff; }
        .ipfs-badge {
            background-color: #238636;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-grow: 1;
        }
        .panel {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        h2 { font-size: 1.1rem; margin-top: 0; color: #8b949e; border-bottom: 1px solid #30363d; padding-bottom: 5px; }
        .log-window {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 0.9rem;
        }
        .log-entry { margin-bottom: 8px; }
        .log-time { color: #8b949e; margin-right: 10px; }
        .log-info { color: #c9d1d9; }
        .log-warn { color: #d29922; }
        .log-error { color: #f85149; }

        /* Grid for 1000 actors simulation */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(12px, 1fr));
            gap: 2px;
            margin-top: 10px;
        }
        .grid-node {
            width: 12px;
            height: 12px;
            background-color: #2ea043; /* Healthy green */
            border-radius: 2px;
            transition: background-color 0.3s;
        }
        .grid-node.faulty {
            background-color: #f85149; /* Error red */
            box-shadow: 0 0 5px #f85149;
        }
        .grid-node.cognitive {
            background-color: #a371f7; /* Purple for LLM thinking */
        }
    </style>
</head>
<body>
    <header>
        <h1>ETZ HAYYIM // WORLD STATE MONITOR</h1>
        <div>
            <span class="ipfs-badge">Hosted on Kotoba IPFS</span>
            <span style="margin-left:10px; color:#8b949e">Gateway: etzhayyim.com/apps</span>
        </div>
    </header>

    <div class="container">
        <!-- Visualization Panel -->
        <div class="panel" style="flex: 2;">
            <h2>Substrate Topology (1000 Actors)</h2>
            <div class="grid-container" id="actorGrid"></div>
        </div>

        <!-- Chaos & Routing Logs -->
        <div class="panel">
            <h2>Root Router Telemetry & Chaos Logs</h2>
            <div class="log-window" id="logWindow"></div>
        </div>
    </div>

    <script>
        // Initialize 1000 nodes
        const grid = document.getElementById('actorGrid');
        const nodes = [];
        for (let i = 0; i < 1000; i++) {
            const el = document.createElement('div');
            el.className = 'grid-node';
            grid.appendChild(el);
            nodes.push(el);
        }

        const logWindow = document.getElementById('logWindow');

        function addLog(msg, type='info') {
            const div = document.createElement('div');
            div.className = 'log-entry';
            const time = new Date().toISOString().split('T')[1].slice(0,-1);
            div.innerHTML = `<span class="log-time">[${time}]</span><span class="log-${type}">${msg}</span>`;
            logWindow.appendChild(div);
            logWindow.scrollTop = logWindow.scrollHeight;
        }

        // Simulate WebSocket stream from Root Router & Chaos Simulator
        setInterval(() => {
            const roll = Math.random();
            const target = Math.floor(Math.random() * 1000);

            if (roll < 0.05) {
                // Network Partition
                nodes[target].className = 'grid-node faulty';
                addLog(`[CHAOS] Network Partition detected at Actor Node ${target}`, 'error');

                // Heal after some time
                setTimeout(() => {
                    if(nodes[target]) nodes[target].className = 'grid-node';
                    addLog(`[HEAL] Node ${target} reconnected to consensus.`, 'info');
                }, 4000);
            } else if (roll < 0.2) {
                // Cognitive Processing
                nodes[target].className = 'grid-node cognitive';
                const platforms = ["stripe", "salesforce", "openai", "johndeere", "swift"];
                const p = platforms[Math.floor(Math.random() * platforms.length)];
                addLog(`[ROUTER] Ingress -> /${p}-compat/action. LLM Inference activated.`, 'warn');

                setTimeout(() => {
                    if(nodes[target]) nodes[target].className = 'grid-node';
                }, 800);
            }
        }, 300);

        addLog("Kotoba IPFS Gateway connected. Subscribing to Root Router...", "info");
        addLog("1000 Actors synchronized. Monitoring World State.", "info");
    </script>
</body>
</html>
