name: yatabase
displayName: yatabase — Graph DB + MCP
description: >
  Cloud graph database with Cypher queries, Supabase-compatible object storage,
  and a built-in MCP server. Connect any AI agent directly to your knowledge
  graph with one API key — no infrastructure required.
homepage: https://yatabase.gftd.ai
documentation: https://yatabase.gftd.ai/docs
categories:
  - database
  - graph
  - knowledge-graph
  - storage
license: commercial
startCommand:
  type: http
  url: https://yatabase.gftd.ai/mcp
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "Your yatabase API key (sk_live_yata_…). Get one at https://yatabase.gftd.ai/studio"
    required:
      - apiKey
tools:
  - name: yata.graph.cypher
    description: Execute a Cypher query (CREATE / MATCH / MERGE / DELETE) against your graph database
  - name: yata.storage.put
    description: Upload a file to your object storage bucket
  - name: yata.storage.get
    description: Download a file from your storage bucket
  - name: yata.storage.list
    description: List files in a storage bucket with optional prefix filter
  - name: yata.storage.delete
    description: Delete a file from your storage bucket
  - name: yata.storage.sign
    description: Generate a pre-signed URL for temporary anonymous access to a file
  - name: yata.auth.whoami
    description: Get the current tenant identity, plan tier, and billing period
  - name: yata.usage.get
    description: Retrieve API usage metrics for the last 24 hours or 30 days
