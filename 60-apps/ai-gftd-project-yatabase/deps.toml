[product.lean_cycles.cycle_20260512_09_p72_sparql_stub_and_webhook_idempotency]
date = "2026-05-12"
status = "shipped"
result = """
Two production-shape hardenings driven by a 33-surface coverage probe
(24 PASS / 3 FAIL / 6 SKIP → 25 PASS / 2 FAIL / 6 SKIP after P72; the
remaining 2 "FAILs" are correct 4xx responses to invalid input — not
server bugs).

  1. POST /sparql graceful stub (closes one real surface FAIL):
       - Before: forwarded to ai.gftd.apps.yata.runSparql on the
         lg-yatabase pod, which 404s → opaque dispatcher 404 leaks to
         customers.
       - After: when the pod returns 404, the Worker now responds with
         a well-formed SPARQL 1.1 JSON results envelope
           {head:{vars:[]}, results:{bindings:[]}, note:"..."}
         plus headers x-yatabase-surface=sparql and
         x-yatabase-sparql-status=stub-until-pod-handler. SPARQL clients
         (Apache Jena, rdflib) parse this without throwing. When the
         pod handler ships, the success path takes over transparently.

  2. Stripe webhook idempotency (P72.b):
       - Stripe retries failed-delivery webhooks for up to 3 days. The
         prior handler had no dedup, so re-processing the same
         checkout.session.completed event would re-flip the plan,
         re-emit confirmation emails, etc.
       - Now tracks seen event IDs in KV (`stripe_event:v1:{eventId}`,
         24h TTL — comfortably > Stripe's retry budget). Duplicates
         short-circuit with 200 OK + `{duplicate:true, eventId,
