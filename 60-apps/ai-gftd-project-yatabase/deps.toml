last_verified = "2026-05-13 — flip free→starter in 41s, journey 32/32 PASS (P107)"

customer_journey = "70-tools/scripts/yatabase-customer-journey.mjs"
customer_journey_runs = "32-step E2E: signup → plan → cypher (CREATE/MATCH/WHERE/MERGE/edges/two-hop/incoming/DELETE/SET) → /mcp tools/list + tools/call → storage (PUT/list/sign/anon-GET/DELETE/post-delete-404) → /s3 SigV4 → /webhook/stripe → plan flip → /api/usage → multi-tenant isolation → /api/webhooks register/dispatch/delete → /auth/v1/whoami → /auth/v1/attach-email → /auth/v1/recover (no enumeration) → /auth/v1/redeem (bad token) → /auth/v1/invite + /revoke (kv-revoked) → /api/outbox → /api/members → /api/audit → /api/schema (P106) → OPTIONS preflight (P107) → /api/export (CCPA/GDPR/JP §33) → /api/account/delete (irreversible)"
customer_journey_last_verified = "2026-05-13 — 32 PASS / 0 SOFT / 0 FAIL (journey=GREEN)."
customer_journey_classification = "PASS=hard requirement met; SOFT=infra dependency degraded (operational, not code regression); FAIL=code regression"

