[product.lean_cycles.cycle_20260512_22_p85_kv_global_burst_layer]
date = "2026-05-12"
status = "shipped"
result = """
P82 caveat: CF rate-limit binding is per-POP. Distributed clients
fanning across POPs each see their own 100/10s budget — global burst
escapes. P85 adds a KV-resident global counter on top:

  Layer 1 (P82 — per-POP synchronous): CF binding `YATA_BURST_LIMITER`.
    100 req per 10s per POP per orgDid. Catches single-POP sustained
    bursts (compromised key hammering from one location).
  Layer 2 (P85 — global eventually-consistent): KV counter
    `burst:v1:{orgDid}:{floor(epochSec)}` with 1-second buckets +
    threshold 25/s, synchronous get+put on every authenticated
    non-observability request, TTL 60s.

Honest semantics:
  - The KV read-then-write is non-atomic. A burst of N parallel
    requests within ONE 1-second bucket all see count=0 on read and
    all proceed. The race only escapes the very first window.
  - Sustained bursts (>1 second) DO trigger 429 once KV converges —
    typically within a few hundred ms. So a client maintaining
    pressure for >2-3 seconds gets blocked even when distributed.
  - Truly atomic enforcement requires a Durable Object per orgDid
    (or namespace). Deferred — KV layer is good enough for the
    expected abuse profile and adds no infra cost.

Cost: ~5-10ms of added latency per authenticated request (KV get +
put on the hot path). Acceptable for a graph-database API where
typical requests are 50-200ms anyway.

Also: purgeKvAndR2() now scrubs `burst:v1:{orgDid}:*` so an erased
tenant's stale counter doesn't briefly throttle a same-orgDid
re-signup.

Customer journey: 16/16 GREEN preserved (sequential journey is well
under the 25/s threshold).
"""

