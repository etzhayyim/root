codename = "io-yatabase"
host = "yatabase.gftd.ai"
positioning = "Real-time graph database + Supabase-style storage + MCP cell-membrane facade. Neo4j Cypher subset + S3 SigV4 + atproto auth."
status = "MVP shipped — 29/29 smoke PASS"
deploy_target = "Cloudflare Worker (magatama-y4t4b4se)"
backend = "RisingWave (Vultr LAX) via Hyperdrive + bpmn-dispatcher pyzeebe pool"

[product.market]
