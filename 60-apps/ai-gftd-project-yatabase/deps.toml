[product.lean_cycles.cycle_20260512_13_p76_recovery_flow_attach_recover_redeem]
date = "2026-05-12"
status = "shipped"
result = """
P76 closes the biggest commercial gap in the service: anonymous signup
means losing the API key = orphaned tenant. P76 ships the standard
SaaS recovery flow as four small endpoints:

  1. GET  /auth/v1/whoami      — current bearer's tenant identity
                                  (orgDid, plan, attachedEmail,
                                  stripeCustomerId, canOpenPortal)
  2. POST /auth/v1/attach-email — store an email for the current tenant
                                  (auth required). Also writes the
                                  hashed reverse index
                                  `email_to_orgs:v1:{sha256(email)}` so
                                  recovery can resolve email → orgs[]
                                  without storing plaintext.
  3. POST /auth/v1/recover     — anonymous, body `{email}`. Looks up
                                  orgs via hashed reverse index. ALWAYS
                                  returns 200 with neutral message (no
                                  enumeration). When orgs match, mints
                                  a 48-hex recover_token (15-min TTL)
                                  and emails the link via Resend.
  4. POST /auth/v1/redeem      — anonymous, body `{token}`. Validates
                                  token, mints fresh apiKey per
                                  matching orgDid via the lg-yatabase
                                  pod's invite forwarder (KV fallback
                                  when pod unreachable). Single-use:
                                  token is deleted before processing
                                  to prevent double-redeem on slow
                                  clients.

Security properties:
  - email plaintext NEVER stored in the reverse index (sha256 hashed)
  - recover ALWAYS 200s — bad-email vs. unattached-email look identical
  - 48-hex token requires 192 bits of entropy to guess
  - 15-min TTL bounds the attack window
  - single-use deletion before mint prevents race-redeem
  - existing keys remain valid after recovery (additive, not replacement)

Verified live with a real KV roundtrip:
  signup → attach-email → recover → token in KV → redeem with token →
  new apiKey works via /auth/v1/whoami → token replay = TokenExpired.

