  "api_request",
  "yata_query_cu_ms",
  "storage_gb_hour",
  "egress_gb",
  "mcp_call",
  "did_mint",
]
rate_card_source = "ADR-2605080000 §D1"

[product.cypher_subset]
read = [
  "MATCH (n:Label) [WHERE prop OP val [(AND|OR) ...]] RETURN n[.prop] [AS alias] [, ...]",
  "[ORDER BY n.prop ASC|DESC] [SKIP N] [LIMIT N]",
]
write = [
  "CREATE (n:Label {k: v, ...}) [RETURN ...]",
  "MATCH (n:Label {pk: v}) SET n.prop = expr [, ...] [RETURN ...]",
  "MATCH (n:Label {pk: v}) DELETE n",
]
graph_traversal = [
  "MATCH (a:L1)-[:R]->(b:L2) [WHERE ...] RETURN ...",
  "MATCH (a:L1{pk:v}),(b:L2{pk:v}) CREATE (a)-[:R]->(b)",
]
forbidden = ["DETACH DELETE", "FOREACH", "CALL { ...write... }"]
deferred = ["multi-hop", "variable-length path", "MERGE", "count() / collect()", "OPTIONAL MATCH", "WITH"]

[product.crm]
# Top-of-funnel CRM table + admin endpoints. Seeded by external scrapers
# (HN / GitHub stars / manual) and drained by nishino's 3rd pass.
table = "vertex_lead"
ingest_endpoint = "POST /api/leads/ingest (admin-keyed)"
list_endpoint = "GET /api/leads?status=&domain=&limit= (admin-keyed)"
operator_endpoints = [
  "POST /api/leads/{vertex_id}/approve  → outreach_status='approved'",
  "POST /api/leads/{vertex_id}/dismiss  → outreach_status='dismissed'",
  "POST /api/leads/{vertex_id}/contact  → set contact_email (body {email})",
  "POST /api/leads/{vertex_id}/send     → dry-run preview if RESEND_API_KEY missing, else POST Resend + flip lead+outbox to 'sent'",
  "POST /api/leads/send-batch          → bulk-fire over leadsSendable() or explicit vertex_ids[]; serial loop avoids Resend rate-limit fan-out; per-lead result array",
]
operator_ui = "Studio → Leads (admin) pane"
status_pipeline = "NULL → 'new' → 'drafted' → 'approved' / 'dismissed' → 'sent' → 'replied' / 'bounced' / 'dead'"
drain_agent = "nishino (pass 3, leadsReadyForOutreach() ORDER BY fit_score DESC)"
side_effect = "vertex_email_outbox kind='sales-onboarding-nudge' status='queued-no-recipient' until human approves"
idempotency = "handleLeadIngest SELECTs vertex_id first; existing rows skip-by-default (force:true to overwrite)"

[product.lead_sources]
# Automated lead generators that POST to /api/leads/ingest.
[product.lead_sources.enrich]
endpoint_single = "POST /api/leads/{vertex_id}/enrich (admin-keyed)"
endpoint_batch = "POST /api/leads/sources/enrich-batch (admin-keyed)"
operator_button = "Studio → Leads → enrich (per row)"
scheduled_handler = "scheduled() in src/app.ts dispatches by event.cron — '30 */6 * * *' fires _runEnrichBatch(env, 8) automatically"
strategy = "GET https://{domain}/ with custom UA, regex extract mailto: + role-prefix emails (info@/hello@/contact@/...), light tech-stack hints"
compliance = "public homepage only; self-identifying UA so site owners can robots.txt-block; 8s timeout; fails soft; skips RFC2606 example/test/invalid TLDs"
columns_updated = "vertex_lead.contact_email, vertex_lead.tech_stack"
verified_2026_05_11 = "supabase.com=no_email_tech_stack[7]; hackaday.com=tips@hackaday.com tech[2]; val.town=hi@val.town tech[5]; cyberinsider.com=contact@cyberinsider.com"
source_file = "src/lead-sources/enrich.ts"

[product.lead_sources.sendable]
endpoint = "GET /api/leads/sendable (admin-keyed) — outreach_status='approved' AND contact_email <> '' AND outreach_outbox <> ''"
operator_filter = "Studio → Leads → status filter → 'sendable (approved + email)'"
purpose = "operator's one-shot 'ready to fire' list. when Resend is wired, a single curl loop over this calls /api/leads/{id}/send for each."
sort = "fit_score DESC, ingested_at ASC"

[product.lead_sources.github]
endpoint_manual = "POST /api/leads/sources/github (admin-keyed)"
scheduled_handler = "scheduled() in src/app.ts dispatches '45 */6 * * *' to _runGithubScrapeAndIngest(perRepo:20, maxUsers:30, reposLimit:2)"
cron_schedule = "45 */6 * * *"
repos_scanned = ["neo4j/neo4j", "supabase/supabase", "hasura/graphql-engine", "dgraph-io/dgraph", "ArangoDB/arangodb"]
repo_rotation = "day-of-year mod len — 2 repos per fire, all 5 cycle weekly"
strategy = "GET /repos/{o}/{r}/stargazers + parallel /users/{login}; if user.blog parses as real domain (non-aggregator), ingest with fit=base + follower_bump"
auth_mode = "GITHUB_TOKEN env (optional; pushes 60→5000/h)"
caps = "perRepo=20 maxUsers=30 per fire; ~120 user-fetches/day across 4 fires"
verified_2026_05_11 = "9 leads ingested from neo4j+supabase scrape; 14 skipped no-blog; 3 skipped aggregator-only"
source_file = "src/lead-sources/github.ts"

[product.lead_sources.hn]
endpoint_manual = "POST /api/leads/sources/hn (admin-keyed)"
scheduled_handler = "scheduled() in src/app.ts — wired via direct npx wrangler deploy of wrangler.jsonc.cron variant since gftd deploy strips triggers"
cron_schedule = "0 */6 * * *"
queries = ["graph database", "neo4j", "supabase", "hasura", "dgraph", "arangodb", "firebase migrate"]
host_skip_list = "news.ycombinator.com / reddit.com / github.com / medium.com / x.com / wikipedia.org / openai.com / anthropic.com / huggingface.co / arxiv.org / dev.to / substack.com / etc."
fit_scoring = "base 60-75 by query, +0-15 by HN points, capped at 95"
caps = "windowHours=168 perQueryHits=30 maxLeads=25 per fire"
source_file = "src/lead-sources/hn.ts"

