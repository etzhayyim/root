<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GIEMON 五右衛門 · Robot Model + Physics Sim — kami-engine</title>
<style>
  html, body { margin:0; height:100%; background:#0c0e14; color:#cfe; font-family:system-ui, sans-serif; overflow:hidden; }
  #gc { display:block; width:100vw; height:100vh; }
  #hud {
    position: fixed; top: 8px; left: 8px; padding: 8px 12px;
    background: rgba(0,0,0,0.55); border-radius: 8px;
    font: 12px/1.5 ui-monospace, monospace; color: #9fc;
    pointer-events: none; min-width: 240px;
  }
  #hud .head { color:#f6a93b; font-weight:600; }
  #hud .k { color:#8aa; } #hud .v { color:#fff; }
  #panel {
    position: fixed; top: 8px; right: 8px; width: 300px;
    display: flex; flex-direction: column; gap: 6px;
    background: rgba(0,0,0,0.65); border-radius: 8px; padding: 10px;
    font: 12px/1.4 ui-monospace, monospace; color: #cfe;
  }
  #panel .title { color:#f6a93b; font-weight:600; margin-bottom:2px; }
  #panel .sub { color:#8aa; font-size:10px; margin-bottom:6px; }
  #panel button {
    text-align:left; background:#2a2013; color:#fde; border:1px solid #5a4520;
    border-radius:6px; padding:8px 10px; cursor:pointer; font:11px ui-monospace;
  }
  #panel button:hover { background:#3a2c18; border-color:#92702a; }
  #panel button.active { background:#3a2c18; border-color:#f6a93b; color:#ffe; }
  #panel button .n { color:#f6a93b; font-weight:600; display:block; }
  #panel button .d { color:#9ab; font-size:10px; }
  #hint {
    position: fixed; bottom: 12px; left: 8px; padding: 6px 10px;
    background: rgba(0,0,0,0.55); border-radius: 8px;
    font: 11px/1.4 ui-monospace, monospace; color: #9fc;
    pointer-events: none; max-width: 90vw;
  }
  #err { color:#f88; font-size:11px; }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="hud">
  <div><span class="head">GIEMON 五右衛門</span></div>
  <div><span class="k">model:</span>   <span class="v" id="h-model">—</span></div>
  <div><span class="k">backend:</span> <span class="v" id="h-backend">—</span></div>
  <div><span class="k">fps:</span>     <span class="v" id="h-fps">—</span></div>
</div>
<div id="panel">
  <div class="title">Giemon models</div>
  <div class="sub">procedural CAD viewer + kami-genesis arm physics</div>
  <div id="list"></div>
  <div id="err"></div>
</div>
<div id="hint">
  drag = orbit ・ wheel = zoom ・ click part = highlight ・
  <b>arm6: 1-6 = select joint ・ J / L = torque it</b> ・ <span id="selj">joint 1</span> ・ pick a model on the right →
</div>
<script type="module">
import init, {
  run_giemon_v1,
  run_giemon_hitogata_v1,
  run_giemon_caterpillar_v1,
  run_giemon_sim_v1,
  giemonSetJointTorque,
  giemonSelectJoint,
} from './giemon/kami_app_giemon.js';

const MODELS = [
  { id: 'physics-arm', name: 'Arm6 — 3-D Physics Sim', desc: 'kami-genesis 6-DOF spatial solver + contact (1-6 select · J/L torque)', run: run_giemon_sim_v1, physics: true },
  { id: 'armcrawler',  name: 'ArmCrawler — Viewer',      desc: '6-DOF arm + rubber-track crawler (display pose)', run: run_giemon_v1 },
  { id: 'hitogata',    name: 'Hitogata — Biped',         desc: '17-DOF humanoid (~285mm)', run: run_giemon_hitogata_v1 },
  { id: 'caterpillar', name: 'Caterpillar — UGV',        desc: 'heavy dual-track + LiDAR + stereo cam', run: run_giemon_caterpillar_v1 },
];

const errEl = document.getElementById('err');
const listEl = document.getElementById('list');
const modelEl = document.getElementById('h-model');

// Arm6 control: 1-6 select a joint, J/L torque it (− / +), key-up → 0.
const T = 8.0;
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.key >= '1' && e.key <= '6') {
    giemonSelectJoint(Number(e.key));
    const s = document.getElementById('selj');
    if (s) s.textContent = `joint ${e.key}`;
  } else if (e.key === 'j' || e.key === 'J') giemonSetJointTorque(-T);
  else if (e.key === 'l' || e.key === 'L') giemonSetJointTorque(T);
});
window.addEventListener('keyup', (e) => {
  if (['j','J','l','L'].includes(e.key)) giemonSetJointTorque(0);
});

(async () => {
  await init();

  const sel = sessionStorage.getItem('giemon-model') ?? MODELS[0].id;
  const model = MODELS.find((m) => m.id === sel) ?? MODELS[0];

  for (const m of MODELS) {
    const b = document.createElement('button');
    b.className = m.id === model.id ? 'active' : '';
    b.innerHTML = `<span class="n">${m.name}</span><span class="d">${m.desc}</span>`;
    b.addEventListener('click', () => {
      sessionStorage.setItem('giemon-model', m.id);
      location.reload();
    });
    listEl.appendChild(b);
  }
  modelEl.textContent = model.id;

  const hudFps = document.getElementById('h-fps');
  const hudBk  = document.getElementById('h-backend');
  setInterval(() => {
    const h = window.__kami_hud_giemon ?? window.__kami_hud;
    if (!h) return;
    hudFps.textContent = `${(h.fps ?? 0).toFixed(0)}`;
    hudBk.textContent  = h.backend ?? '—';
  }, 250);

  await model.run('gc');
})().catch((e) => {
  errEl.textContent = `init error: ${e?.message ?? e}`;
  console.error('[giemon]', e);
});
</script>
</body>
</html>
