<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>3DGS Viewer — Mapillary SfM point clouds · kami-pipelines GsplatAdapter</title>
<style>
  html, body { margin:0; height:100%; background:#06080c; color:#cfe; font-family:system-ui, sans-serif; overflow:hidden; }
  #gc { display:block; width:100vw; height:100vh; }
  #hud {
    position: fixed; top: 8px; left: 8px; padding: 9px 13px;
    background: rgba(0,0,0,0.6); border-radius: 8px;
    font: 12px/1.6 ui-monospace, monospace; color: #9fc; min-width: 240px;
  }
  #hud .head { color:#5ad1ff; font-weight:600; }
  #hud .k { color:#8aa; } #hud .v { color:#fff; }
  #hud .note { color:#fb6; font-size:10px; margin-top:5px; }
  #hud select { background:#142; color:#cfe; border:1px solid #2a6; border-radius:5px; font:11px ui-monospace; margin-top:6px; }
  #err { color:#f88; font-size:11px; }
  #hint {
    position: fixed; bottom: 12px; left: 8px; padding: 6px 10px;
    background: rgba(0,0,0,0.55); border-radius: 8px;
    font: 11px/1.4 ui-monospace, monospace; color: #9fc; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="hud">
  <div><span class="head">3DGS Viewer</span></div>
  <div><span class="k">source:</span> <span class="v">Mapillary SLS · OpenSfM (CC-BY-SA)</span></div>
  <div><span class="k">render:</span> <span class="v">kami GsplatAdapter</span></div>
  <div><span class="k">scene:</span>  <span class="v" id="h-scene">—</span></div>
  <div><span class="k">backend:</span><span class="v" id="h-backend">—</span> ・ <span class="k">fps:</span> <span class="v" id="h-fps">—</span></div>
  <div>
    <select id="city">
      <option value="sfm_Shibuya.splat">渋谷 Shibuya (Mapillary, live SfM)</option>
      <option value="sfm_Tsuru.splat">Tsuru 都留 (Japan)</option>
      <option value="sfm_Boston1.splat">Boston (USA)</option>
      <option value="sfm_Washington.splat">Washington (USA)</option>
    </select>
  </div>
  <div><label><input type="checkbox" id="phys"> physics agents (#3)</label></div>
  <div class="note">sparse SfM points (real street photos). dense photoreal = gsplat GPU train (next).</div>
  <div id="err"></div>
</div>
<div id="hint">drag = orbit ・ wheel = zoom ・ 実 Mapillary 街路写真から復元した 3D 点群を Gaussian 描画 ・ physics = splat 背景でエージェント物理走行</div>
<script type="module">
import init, { run_splat_viewer_v1, run_splat_physics_v1, shibuyaLoadSplat } from './shibuya/kami_app_shibuya.js';
const physics = new URLSearchParams(location.search).has('physics');
const errEl = document.getElementById('err');
async function load(name) {
  try {
    const r = await fetch('./shibuya/' + name);
    if (!r.ok) { errEl.textContent = 'not found: ' + name; return; }
    const ok = shibuyaLoadSplat(new Uint8Array(await r.arrayBuffer()));
    document.getElementById('h-scene').textContent = ok ? name.replace('sfm_','').replace('.splat','') : 'load failed';
  } catch (e) { errEl.textContent = 'load error: ' + (e?.message ?? e); }
}
(async () => {
  await init();
  const cb = document.getElementById('phys');
  cb.checked = physics;
  cb.addEventListener('change', () => { location.search = cb.checked ? '?physics=1' : ''; });
  const hudFps = document.getElementById('h-fps'), hudBk = document.getElementById('h-backend');
  setInterval(() => { const h = window.__kami_hud_splat ?? window.__kami_hud; if (h) { hudFps.textContent = (h.fps??0).toFixed(0); hudBk.textContent = h.backend ?? '—'; } }, 250);
  if (physics) await run_splat_physics_v1('gc'); else await run_splat_viewer_v1('gc');
  await load(document.getElementById('city').value);
  document.getElementById('city').addEventListener('change', (e) => load(e.target.value));
})().catch((e) => { errEl.textContent = 'init error: ' + (e?.message ?? e); console.error('[splat]', e); });
</script>
</body>
</html>
