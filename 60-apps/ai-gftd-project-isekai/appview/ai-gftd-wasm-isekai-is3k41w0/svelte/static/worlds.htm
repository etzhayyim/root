<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ISEKAI · Generated Worlds — kami-usd / kami-genesis nv-compat</title>
<style>
  html, body { margin:0; height:100%; background:#0c0e14; color:#cfe; font-family:system-ui, sans-serif; overflow:hidden; }
  #gc { display:block; width:100vw; height:100vh; }
  #hud {
    position: fixed; top: 8px; left: 8px; padding: 8px 12px;
    background: rgba(0,0,0,0.55); border-radius: 8px;
    font: 12px/1.5 ui-monospace, monospace; color: #9fc;
    pointer-events: none; min-width: 260px;
  }
  #hud .head { color:#ffcf6b; font-weight:600; }
  #hud .k { color:#8aa; } #hud .v { color:#fff; }
  #hud .nv { color:#a8e; font-size:11px; margin-top:4px; }
  #gallery {
    position: fixed; top: 8px; right: 8px; width: 320px; max-height: 80vh;
    display: flex; flex-direction: column; gap: 6px; overflow-y: auto;
    background: rgba(0,0,0,0.65); border-radius: 8px; padding: 10px;
    font: 12px/1.4 ui-monospace, monospace; color: #cfe;
  }
  #gallery .title { color:#ffcf6b; font-weight:600; margin-bottom:2px; }
  #gallery .sub { color:#8aa; font-size:10px; margin-bottom:6px; }
  #gallery button {
    text-align:left; background:#15263a; color:#cfe; border:1px solid #234;
    border-radius:6px; padding:8px 10px; cursor:pointer; font:11px ui-monospace;
  }
  #gallery button:hover { background:#1f3a58; border-color:#3a6492; }
  #gallery button.active { background:#1f3a58; border-color:#7fd; color:#dff; }
  #gallery button .wname { color:#9cf; font-weight:600; display:block; }
  #gallery button .wdesc { color:#9ab; font-size:10px; }
  #hint {
    position: fixed; bottom: 12px; left: 8px; padding: 6px 10px;
    background: rgba(0,0,0,0.55); border-radius: 8px;
    font: 11px/1.4 ui-monospace, monospace; color: #9fc;
    pointer-events: none; max-width: 90vw;
  }
  #err { color:#f88; font-size:11px; }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="hud">
  <div><span class="head">ISEKAI · Generated Worlds</span></div>
  <div><span class="k">world:</span>  <span class="v" id="h-world">—</span></div>
  <div><span class="k">backend:</span><span class="v" id="h-backend">—</span></div>
  <div><span class="k">fps:</span>    <span class="v" id="h-fps">—</span></div>
  <div><span class="k">pos:</span>    <span class="v" id="h-pos">—</span></div>
  <div class="nv" id="h-nv">loading nv-compat banner…</div>
</div>
<div id="gallery">
  <div class="title">Worlds</div>
  <div class="sub">authored as kami_usd::Stage → to_usda() → rendered via kami-genesis</div>
  <div id="world-list"></div>
  <div id="err"></div>
</div>
<div id="hint">
  Click canvas to lock pointer ・ WASD move ・ Space/Shift fly ・ mouse look ・
  <b>J / L = push cartpole</b> ・ pick a world on the right →
  <a href="./omniverse.htm" style="color:#9cf">edit USDA</a>
</div>
<script type="module">
import init, {
  runIsekaiOmniverse,
  isekaiOmniverseBanner,
  isekaiOmniverseWorldCatalog,
  isekaiSetCartForce,
} from './v2/kami_app_isekai.js';

const errEl = document.getElementById('err');
const nvEl  = document.getElementById('h-nv');
const listEl = document.getElementById('world-list');
const worldEl = document.getElementById('h-world');

// Cartpole force control: J / L. Released keys zero the force.
const CART_F = 10.0;
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.key === 'j' || e.key === 'J') isekaiSetCartForce(-CART_F);
  else if (e.key === 'l' || e.key === 'L') isekaiSetCartForce(CART_F);
});
window.addEventListener('keyup', (e) => {
  if (['j', 'J', 'l', 'L'].includes(e.key)) isekaiSetCartForce(0);
});

(async () => {
  await init();
  nvEl.textContent = isekaiOmniverseBanner();

  const catalog = JSON.parse(isekaiOmniverseWorldCatalog());
  if (!catalog.length) { errEl.textContent = 'empty world catalog'; return; }

  const selectedId = sessionStorage.getItem('isekai-world-id') ?? catalog[0].id;
  const world = catalog.find((w) => w.id === selectedId) ?? catalog[0];

  // Render the picker. Selecting a different world reloads with it stored
  // (kami-app does not yet expose a live scene-swap, so reload is the
  // simplest correct teardown of the GPU context).
  for (const w of catalog) {
    const b = document.createElement('button');
    b.className = w.id === world.id ? 'active' : '';
    b.innerHTML = `<span class="wname">${w.id}</span><span class="wdesc">${w.name}</span>`;
    b.addEventListener('click', () => {
      sessionStorage.setItem('isekai-world-id', w.id);
      location.reload();
    });
    listEl.appendChild(b);
  }

  worldEl.textContent = world.id;

  // HUD subscription.
  const hudPos = document.getElementById('h-pos');
  const hudFps = document.getElementById('h-fps');
  const hudBk  = document.getElementById('h-backend');
  setInterval(() => {
    const h = window.__kami_hud_isekai;
    if (!h) return;
    hudPos.textContent = `${(h.x ?? h.pos?.x ?? 0).toFixed(1)}, ${(h.y ?? h.pos?.y ?? 0).toFixed(1)}, ${(h.z ?? h.pos?.z ?? 0).toFixed(1)}`;
    hudFps.textContent = `${(h.fps ?? 0).toFixed(0)}`;
    hudBk.textContent  = h.backend ?? '—';
  }, 250);

  await runIsekaiOmniverse('gc', world.usda);
})().catch((e) => {
  errEl.textContent = `init error: ${e?.message ?? e}`;
  console.error('[isekai-worlds]', e);
});
</script>
</body>
</html>
