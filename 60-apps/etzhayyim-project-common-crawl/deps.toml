# common-crawl — Common Crawl ingestion pipeline
#
# Shannon-optimal pipeline (2026-04-15, v3 S3-connector SWAP):
#   WAT (gz) → Rust cc-phase3 (rayon) → Parquet (ZSTD) → S3 (kagami-graphar/cc-parquet-v2/)
#   → Kotoba/Datomic s3 connector → ALTER TABLE SWAP (no TRUNCATE, no downtime)
#
#   Page DID  = URL directory path (did:web:site.etzhayyim.com:{domain-slug}:{path-seg}:…)
#   Domain DID = did:web:site.etzhayyim.com:{domain-slug} (self-owned actor)
#   Legacy rkey (SHA-16 hex) coexists via vertex_did_alias + view_cc_page_canonical.
#
# S3 bucket layout (cc-parquet-v2/ prefix):
#   batch_{id}_pages.parquet   → vertex_page  (new URL-slug rkey, phase3h output)
#   batch_{id}_links.parquet   → edge_links_to (old SHA-hex src/dst; resolved via view_cc_edge_links_to_canonical)
#   batch_{id}_dlinks.parquet  → edge_links_to_domain (old SHA-hex; same alias resolution)
#
# Note: links/dlinks src_vid/dst_vid stay SHA-hex because transforming them requires a
#   global 985M-row rkey lookup (infeasible without re-running cc-phase3 on all WATs).
#   view_cc_edge_links_to_canonical + vertex_did_alias resolve at query time.
#
# SQL / JSONL output paths pruned 2026-04-14 (parquet single path, Shannon η=100%).
#
# LLM editing rules:
#   - Schema SSoT: 30-graph/graph-schema/src/database.ts (kysely). DDL migrations
#     in 30-graph/graph-schema/migrations/.
#   - Rust cc-phase3 src/main.rs defines `page_did_from_url()` (URL → rkey + DID);
#     Python mirror is scripts/phase3h_transform_parquet.py. Both must stay in sync.
#   - cc-phase3 is the primary pipeline. Python scripts are archived unless active.
#   - file_scan() does NOT support custom S3 endpoints → use CREATE TABLE WITH (connector='s3').

name = "common-crawl"
layer = 5
tier = "beta"
role = "data-ingestion"
kind = "app"
maturity = "beta"
workspace = "standalone"
execution_profiles = ["build", "test"]
description = "Common Crawl WAT → Parquet → Kotoba/Datomic plain Hummock ingest (vertex_page, edge_links_to, edge_links_to_domain)"
language = "rust"

depends_on = [
  "graph-schema-py",      # Schema SSoT (models.py)
  "kotoba-iceberg",   # Target DB infra module (current path uses plain Hummock tables)
  "linode-storage",       # S3 (Linode Objects sg-sin-1, bucket kagami-graphar)
]

provides = [
  "site.etzhayyim.com coverage",    # web domain → DID mapping
  "vertex_page",               # web pages (rkey PK, domain FK — HOSTS implicit)
  "vertex_domain",             # web domains (derived from vertex_page.domain via MV)
  "edge_links_to",             # page → page cross-links
  "edge_links_to_domain",      # domain → domain aggregated link count
]

[invariants]
target_db = "kotoba://kagami.etzhayyim.com:4566"
schema_source = "../../30-graph/graph-schema-py/graphar_schema/models.py"
cc_dataset = "common-crawl/CC-MAIN-*"
crawl_id = "CC-MAIN-2026-12"
wat_files = 49591
pipeline = "rust-parquet-direct"          # WAT → Parquet (no SQL intermediate)
active_ingest_path = "s3-connector-swap"
active_ingest_script = "scripts/phase3j_s3_upload_v2.py"
s3_prefix = "cc-parquet-v2"
s3_bucket = "kagami-graphar"
s3_region = "sg-sin-1"
s3_endpoint = "https://sg-sin-1.linodeobjects.com"
parquet_compression = "zstd"
screenshot_viewport = "390x844"           # mobile-first (iPhone 14/15)
screenshot_format = "webp"
screenshot_quality = 80
screenshot_quality_pdf = 85

# ���─ Primary pipeline: Rust WAT → Parquet ─────────────────

[files."rust/cc-phase3"]
role = "cc-pipeline"
flags = ["editable"]
description = "WAT → Parquet direct (rayon parallel, ZSTD). Primary pipeline. --format parquet (default)"

[files."rust/cc-domain-extract"]
role = "cc-domain-tool"
flags = ["editable"]
description = "Domain extraction from URL stream (standalone utility)"

