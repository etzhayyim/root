# ── Current ingest path (Phase 3g / path-j-cc-hummock) ───

[files."scripts/phase3g_copy_ingest.py"]
role = "cc-ingester"
flags = ["editable"]
description = "ACTIVE: Local parquet → Kotoba/Datomic plain Hummock tables via psycopg2 execute_values (path-j-cc-hummock). vertex_domain populate_domains() sets did = owner_did = did:web:site.etzhayyim.com:{slug} (self-owned domain actor, 2026-04-14)."

# ── Phase 3h: parquet-to-parquet transform (2026-04-14) ──
#
# Converts existing batch_*_pages.parquet (SHA-16 hex rkey, null owner_did)
# to new format (URL path slug rkey, per-page DID owner_did) without
# re-decompressing WAT files. ~20x faster than re-running cc-phase3 from
# WAT when the source parquet is already available.

[files."scripts/phase3h_transform_parquet.py"]
role = "cc-parquet-transform"
flags = ["editable"]
description = "ACTIVE (2026-04-14): Old parquet → new parquet, derives rkey/owner_did from URL via Python mirror of Rust page_did_from_url(). Skips WAT decompression entirely."

[files."scripts/phase3i_alias_backfill.py"]
role = "cc-alias-backfill"
flags = ["editable"]
description = "ACTIVE (2026-04-14): JOIN vertex_page legacy vs canonical on URL → populate vertex_did_alias. Runs after ingest of transformed parquet. Resumable via NOT EXISTS anti-join. Incremental: safe to run before full ingest completes."

# ── Phase 3j: S3 upload v2 (2026-04-15) ──────────────────────
#
# Uploads all 148,773 parquet files to kagami-graphar/cc-parquet-v2/:
#   pages  → parquet-rs-v2/ (new URL-slug rkey, phase3h output)
#   links  → parquet-rs/    (old SHA-hex src/dst — alias VIEW resolves at query)
#   dlinks → parquet-rs/    (old SHA-hex src/dst — alias VIEW resolves at query)
#
# Supersedes phase3g (COPY FROM STDIN) which was fragile to TCP disconnects.
# After upload, phase3k SQL creates S3-connector tables and SWAPs atomically.

[files."scripts/phase3j_s3_upload_v2.py"]
role = "cc-s3-upload"
flags = ["editable"]
description = "ACTIVE (2026-04-15): Upload all parquet to S3 cc-parquet-v2/. pages=new-format (parquet-rs-v2/), links/dlinks=old-format (parquet-rs/). 16-worker parallel, resumable via S3 list."

# ── Phase 3k: S3 connector + SWAP (2026-04-15) ───────────────
#
# SQL script run after phase3j upload completes:
#   1. CREATE TABLE *_new WITH (connector='s3', match_pattern='cc-parquet-v2/batch_*_TYPE.parquet')
#   2. ALTER TABLE SET PARALLELISM TO 8 (boost ingest rate)
#   3. Wait for ingest completion (COUNT(*) check)
#   4. ALTER TABLE vertex_page SWAP WITH vertex_page_new (atomic, no downtime)
#   5. DROP TABLE *_new (old data, after verification)
#
# No TRUNCATE. No data loss during ingest. Kotoba/Datomic 2.8.1 SWAP WITH supported.

[files."scripts/phase3k_s3_connector_swap.sql"]
role = "cc-s3-connector"
flags = ["editable"]
description = "ACTIVE (2026-04-15): CREATE TABLE with s3 connector + ALTER TABLE SWAP. Zero-downtime replacement of all 3 CC tables. Run after phase3j upload."

