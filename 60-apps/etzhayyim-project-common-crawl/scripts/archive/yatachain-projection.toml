# yatachain-projection manifest for etzhayyim-project-common-crawl/scripts/archive
#
# Per ADR-2605231500, these archived phase scripts are historical operator
# ingest tools for the same Common Crawl RisingWave read-path projection.
# They are retained for rebuild/audit reference and are not production runtime
# paths or canonical state.

[projection]
name = "common-crawl-archived-ingest-rw"
level = "L0-operator-script"
rebuild_runbook = "../../MIGRATION-TODO.md"
adr = "2605231500"
yatachain_companion_adr = "2605231400"
owner = "common-crawl maintainers"
last_reviewed = "2026-06-03"

source_collections = [
  "org.commoncrawl.warc",
  "org.commoncrawl.wat",
  "org.commoncrawl.wet",
]

projection_tables = [
  "vertex_common_crawl_domain",
  "vertex_common_crawl_page",
  "edge_common_crawl_link",
]

storage_substrates = [
  { kind = "risingwave", binding = "DATABASE_URL", note = "archived Common Crawl projection ingest path" },
]

rebuild_estimated_minutes = 480
rebuild_estimated_minutes_note = "archived phase scripts; use top-level scripts runbook for current replay"

[[non_determinism]]
field = "vertex_*.row_id"
reason = "sequence-allocated on INSERT; replay preserves logical keys but not physical row ids"

[[non_determinism]]
field = "vertex_*.created_at_db"
reason = "RisingWave server timestamp at INSERT time, not in source crawl data"

[promotion_to_l1]
required = [
  "Archived scripts either removed after current replay tooling lands or covered by sample replay fixtures",
]
target_quarter = "post-replay-cleanup"
