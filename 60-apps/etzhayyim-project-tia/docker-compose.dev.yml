# Development override for docker-compose.yml
# Use this for development-specific configurations
#
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Architecture Notes:
# - Seeker app is independent and does not depend on internal packages
# - Admin and InternetAccountOwner apps still use shared components from performers/ports
# - GraphQL API is implemented in Rust (performers/ports/graphql)
# - Database migrations are handled manually or via CI/CD (migrator service removed)

services:
  graphql:
    # Development: Use rust:alpine image for hot reload with cargo-watch
    image: rust:alpine
    build: null
    volumes:
      - ./performers/services/graphql:/app
      - cargo-cache:/usr/local/cargo/registry
    working_dir: /app
    entrypoint: null
    command: >
      sh -c "
        apk add --no-cache wget musl-dev postgresql16-dev postgresql16-client &&
        echo 'Waiting for database...' &&
        until pg_isready -h postgres -p 5432 -U postgres > /dev/null 2>&1; do
          echo 'Database is unavailable - sleeping'
          sleep 1
        done &&
        echo 'Database is ready!' &&
        echo 'Installing cargo-watch...' &&
        cargo install cargo-watch --locked --root /usr/local 2>&1 | tail -5 &&
        echo 'Starting GraphQL server with hot reload...' &&
        cargo watch --watch-when-idle -x 'run --bin graphql-server' || cargo run --bin graphql-server
      "
