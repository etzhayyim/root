[project]
name = "lg-curpus2skill"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "kotodama",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.300",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "lg_curpus2skill",
]
