syntax = "proto3";

package sheets;

option go_package = "github.com/etzhayyim/kyber-erp/gen/sheets";

import "google/protobuf/timestamp.proto";

// ============================================================================
// Enums
// ============================================================================

enum CellValueType {
  CELL_VALUE_TYPE_UNSPECIFIED = 0;
  CELL_VALUE_TYPE_STRING = 1;
  CELL_VALUE_TYPE_NUMBER = 2;
  CELL_VALUE_TYPE_BOOLEAN = 3;
  CELL_VALUE_TYPE_FORMULA = 4;
  CELL_VALUE_TYPE_DATE = 5;
  CELL_VALUE_TYPE_ERROR = 6;
}

enum ChartType {
  CHART_TYPE_UNSPECIFIED = 0;
  CHART_TYPE_BAR = 1;
  CHART_TYPE_LINE = 2;
  CHART_TYPE_PIE = 3;
  CHART_TYPE_SCATTER = 4;
  CHART_TYPE_AREA = 5;
  CHART_TYPE_COLUMN = 6;
  CHART_TYPE_DOUGHNUT = 7;
}

enum ConditionalFormatRuleType {
  CONDITIONAL_FORMAT_RULE_TYPE_UNSPECIFIED = 0;
  CONDITIONAL_FORMAT_RULE_TYPE_CELL_IS = 1;
  CONDITIONAL_FORMAT_RULE_TYPE_TEXT_CONTAINS = 2;
  CONDITIONAL_FORMAT_RULE_TYPE_DATE_IS = 3;
  CONDITIONAL_FORMAT_RULE_TYPE_CUSTOM_FORMULA = 4;
  CONDITIONAL_FORMAT_RULE_TYPE_COLOR_SCALE = 5;
}

enum DataValidationType {
  DATA_VALIDATION_TYPE_UNSPECIFIED = 0;
  DATA_VALIDATION_TYPE_LIST = 1;
  DATA_VALIDATION_TYPE_NUMBER = 2;
  DATA_VALIDATION_TYPE_TEXT_LENGTH = 3;
  DATA_VALIDATION_TYPE_DATE = 4;
  DATA_VALIDATION_TYPE_CUSTOM = 5;
}

enum AggregationFunction {
  AGGREGATION_FUNCTION_UNSPECIFIED = 0;
  AGGREGATION_FUNCTION_SUM = 1;
  AGGREGATION_FUNCTION_COUNT = 2;
  AGGREGATION_FUNCTION_AVERAGE = 3;
  AGGREGATION_FUNCTION_MAX = 4;
  AGGREGATION_FUNCTION_MIN = 5;
}

// ============================================================================
// Core Types
// ============================================================================

message Workbook {
  string id = 1;
  string name = 2;
  string description = 3;
  string owner_user_id = 4;
  repeated Sheet sheets = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Sheet {
  string id = 1;
  string name = 2;
  int32 index = 3;
  int32 row_count = 4;
  int32 column_count = 5;
  bool is_hidden = 6;
  string tab_color = 7;
}

message CellFormat {
  string font_family = 1;
  int32 font_size = 2;
  bool bold = 3;
  bool italic = 4;
  bool underline = 5;
  string text_color = 6;
  string background_color = 7;
  string horizontal_alignment = 8;
  string vertical_alignment = 9;
  string number_format = 10;
  bool wrap_text = 11;
}

message Cell {
  string sheet_id = 1;
  int32 row = 2;
  int32 column = 3;
  string value = 4;
  string formula = 5;
  CellValueType value_type = 6;
  string display_value = 7;
  CellFormat format = 8;
  string note = 9;
}

message CellRange {
  string sheet_id = 1;
  int32 start_row = 2;
  int32 start_column = 3;
  int32 end_row = 4;
  int32 end_column = 5;
  repeated Cell cells = 6;
}

message ChartDataRange {
  string sheet_id = 1;
  int32 start_row = 2;
  int32 start_column = 3;
  int32 end_row = 4;
  int32 end_column = 5;
}

message Chart {
  string id = 1;
  string workbook_id = 2;
  string sheet_id = 3;
  string title = 4;
  ChartType chart_type = 5;
  ChartDataRange data_range = 6;
  int32 position_row = 7;
  int32 position_column = 8;
  int32 width = 9;
  int32 height = 10;
  map<string, string> options = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message CollaborationState {
  string workbook_id = 1;
  bytes state = 2;
  int64 version = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message Template {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  string preview_url = 5;
  bytes content = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message NamedRange {
  string id = 1;
  string workbook_id = 2;
  string name = 3;
  string sheet_id = 4;
  int32 start_row = 5;
  int32 start_column = 6;
  int32 end_row = 7;
  int32 end_column = 8;
}

message ConditionalFormatRule {
  string id = 1;
  string sheet_id = 2;
  int32 start_row = 3;
  int32 start_column = 4;
  int32 end_row = 5;
  int32 end_column = 6;
  ConditionalFormatRuleType rule_type = 7;
  string condition_value = 8;
  CellFormat format = 9;
  int32 priority = 10;
}

message DataValidationRule {
  string id = 1;
  string sheet_id = 2;
  int32 start_row = 3;
  int32 start_column = 4;
  int32 end_row = 5;
  int32 end_column = 6;
  DataValidationType validation_type = 7;
  repeated string values = 8;
  string custom_formula = 9;
  string error_message = 10;
  bool strict = 11;
}

message PivotField {
  int32 source_column = 1;
  string name = 2;
  AggregationFunction aggregation = 3;
}

message PivotTable {
  string id = 1;
  string workbook_id = 2;
  string source_sheet_id = 3;
  int32 source_start_row = 4;
  int32 source_start_column = 5;
  int32 source_end_row = 6;
  int32 source_end_column = 7;
  string target_sheet_id = 8;
  int32 target_row = 9;
  int32 target_column = 10;
  repeated PivotField row_fields = 11;
  repeated PivotField column_fields = 12;
  repeated PivotField value_fields = 13;
  repeated PivotField filter_fields = 14;
  google.protobuf.Timestamp created_at = 15;
}

message SheetComment {
  string id = 1;
  string workbook_id = 2;
  string sheet_id = 3;
  int32 row = 4;
  int32 column = 5;
  string user_id = 6;
  string user_name = 7;
  string content = 8;
  bool is_resolved = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp resolved_at = 11;
}

message DeveloperMetadata {
  string id = 1;
  string workbook_id = 2;
  string key = 3;
  string value = 4;
  string location_type = 5;
  string location_id = 6;
  string visibility = 7;
}

message ProtectedRange {
  string id = 1;
  string workbook_id = 2;
  string sheet_id = 3;
  int32 start_row = 4;
  int32 start_column = 5;
  int32 end_row = 6;
  int32 end_column = 7;
  string description = 8;
  repeated string editor_user_ids = 9;
  bool warning_only = 10;
}

// ============================================================================
// Workbook RPCs - Request/Response Messages
// ============================================================================

message CreateWorkbookRequest {
  string name = 1;
  string description = 2;
  repeated Sheet sheets = 3;
}

message CreateWorkbookResponse {
  Workbook workbook = 1;
}

message GetWorkbookRequest {
  string id = 1;
}

message GetWorkbookResponse {
  Workbook workbook = 1;
}

message ListWorkbooksRequest {
  string owner_user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListWorkbooksResponse {
  repeated Workbook workbooks = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message DeleteWorkbookRequest {
  string id = 1;
}

message DeleteWorkbookResponse {}

// ============================================================================
// Cell RPCs - Request/Response Messages
// ============================================================================

message UpdateCellRequest {
  string workbook_id = 1;
  string sheet_id = 2;
  int32 row = 3;
  int32 column = 4;
  string value = 5;
  string formula = 6;
  CellFormat format = 7;
}

message UpdateCellResponse {
  Cell cell = 1;
}

message GetCellRequest {
  string workbook_id = 1;
  string sheet_id = 2;
  int32 row = 3;
  int32 column = 4;
}

message GetCellResponse {
  Cell cell = 1;
}

message GetCellRangeRequest {
  string workbook_id = 1;
  string sheet_id = 2;
  int32 start_row = 3;
  int32 start_column = 4;
  int32 end_row = 5;
  int32 end_column = 6;
}

message GetCellRangeResponse {
  CellRange range = 1;
}

// ============================================================================
// Chart RPCs - Request/Response Messages
// ============================================================================

message CreateChartRequest {
  string workbook_id = 1;
  string sheet_id = 2;
  string title = 3;
  ChartType chart_type = 4;
  ChartDataRange data_range = 5;
  int32 position_row = 6;
  int32 position_column = 7;
  int32 width = 8;
  int32 height = 9;
  map<string, string> options = 10;
}

message CreateChartResponse {
  Chart chart = 1;
}

message UpdateChartRequest {
  string id = 1;
  string title = 2;
  ChartType chart_type = 3;
  ChartDataRange data_range = 4;
  int32 position_row = 5;
  int32 position_column = 6;
  int32 width = 7;
  int32 height = 8;
  map<string, string> options = 9;
}

message UpdateChartResponse {
  Chart chart = 1;
}

message DeleteChartRequest {
  string id = 1;
}

message DeleteChartResponse {}

// ============================================================================
// Collaboration RPCs - Request/Response Messages
// ============================================================================

message SaveCollaborationStateRequest {
  string workbook_id = 1;
  bytes state = 2;
  int64 version = 3;
}

message SaveCollaborationStateResponse {
  CollaborationState collaboration = 1;
}

message GetCollaborationStateRequest {
  string workbook_id = 1;
}

message GetCollaborationStateResponse {
  CollaborationState collaboration = 1;
}

// ============================================================================
// Template RPCs - Request/Response Messages
// ============================================================================

message CreateTemplateRequest {
  string name = 1;
  string description = 2;
  string category = 3;
  bytes content = 4;
}

message CreateTemplateResponse {
  Template template = 1;
}

message GetTemplateRequest {
  string id = 1;
}

message GetTemplateResponse {
  Template template = 1;
}

message ListTemplatesRequest {
  string category = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListTemplatesResponse {
  repeated Template templates = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message CreateFromTemplateRequest {
  string template_id = 1;
  string name = 2;
  string description = 3;
}

message CreateFromTemplateResponse {
  Workbook workbook = 1;
}

// ============================================================================
// Named Range RPCs - Request/Response Messages
// ============================================================================

message CreateNamedRangeRequest {
  string workbook_id = 1;
  string name = 2;
  string sheet_id = 3;
  int32 start_row = 4;
  int32 start_column = 5;
  int32 end_row = 6;
  int32 end_column = 7;
}

message CreateNamedRangeResponse {
  NamedRange named_range = 1;
}

message GetNamedRangesRequest {
  string workbook_id = 1;
}

message GetNamedRangesResponse {
  repeated NamedRange named_ranges = 1;
}

// ============================================================================
// Conditional Format / Data Validation RPCs
// ============================================================================

message SetConditionalFormatRequest {
  string workbook_id = 1;
  ConditionalFormatRule rule = 2;
}

message SetConditionalFormatResponse {
  ConditionalFormatRule rule = 1;
}

message SetDataValidationRequest {
  string workbook_id = 1;
  DataValidationRule rule = 2;
}

message SetDataValidationResponse {
  DataValidationRule rule = 1;
}

// ============================================================================
// Pivot Table RPCs - Request/Response Messages
// ============================================================================

message CreatePivotTableRequest {
  string workbook_id = 1;
  string source_sheet_id = 2;
  int32 source_start_row = 3;
  int32 source_start_column = 4;
  int32 source_end_row = 5;
  int32 source_end_column = 6;
  string target_sheet_id = 7;
  int32 target_row = 8;
  int32 target_column = 9;
  repeated PivotField row_fields = 10;
  repeated PivotField column_fields = 11;
  repeated PivotField value_fields = 12;
  repeated PivotField filter_fields = 13;
}

message CreatePivotTableResponse {
  PivotTable pivot_table = 1;
}

// ============================================================================
// Comment RPCs - Request/Response Messages
// ============================================================================

message AddCommentRequest {
  string workbook_id = 1;
  string sheet_id = 2;
  int32 row = 3;
  int32 column = 4;
  string user_id = 5;
  string content = 6;
}

message AddCommentResponse {
  SheetComment comment = 1;
}

message ResolveCommentRequest {
  string id = 1;
}

message ResolveCommentResponse {
  SheetComment comment = 1;
}

// ============================================================================
// Developer Metadata RPCs - Request/Response Messages
// ============================================================================

message SetDeveloperMetadataRequest {
  string workbook_id = 1;
  string key = 2;
  string value = 3;
  string location_type = 4;
  string location_id = 5;
  string visibility = 6;
}

message SetDeveloperMetadataResponse {
  DeveloperMetadata metadata = 1;
}

message GetDeveloperMetadataRequest {
  string workbook_id = 1;
  string key = 2;
  string location_type = 3;
  string location_id = 4;
}

message GetDeveloperMetadataResponse {
  repeated DeveloperMetadata metadata = 1;
}

// ============================================================================
// Protected Range RPCs - Request/Response Messages
// ============================================================================

message ProtectRangeRequest {
  string workbook_id = 1;
  string sheet_id = 2;
  int32 start_row = 3;
  int32 start_column = 4;
  int32 end_row = 5;
  int32 end_column = 6;
  string description = 7;
  repeated string editor_user_ids = 8;
  bool warning_only = 9;
}

message ProtectRangeResponse {
  ProtectedRange protected_range = 1;
}

message UnprotectRangeRequest {
  string id = 1;
}

message UnprotectRangeResponse {}

// ============================================================================
// Import/Export RPCs - Request/Response Messages
// ============================================================================

message ImportCsvRequest {
  string workbook_id = 1;
  string sheet_id = 2;
  bytes csv_data = 3;
  string delimiter = 4;
  int32 start_row = 5;
  int32 start_column = 6;
}

message ImportCsvResponse {
  int32 rows_imported = 1;
  int32 columns_imported = 2;
}

message ExportCsvRequest {
  string workbook_id = 1;
  string sheet_id = 2;
  string delimiter = 3;
}

message ExportCsvResponse {
  bytes csv_data = 1;
}

// ============================================================================
// Service
// ============================================================================

service SheetsService {
  // Workbook RPCs
  rpc CreateWorkbook(CreateWorkbookRequest) returns (CreateWorkbookResponse);
  rpc GetWorkbook(GetWorkbookRequest) returns (GetWorkbookResponse);
  rpc ListWorkbooks(ListWorkbooksRequest) returns (ListWorkbooksResponse);
  rpc DeleteWorkbook(DeleteWorkbookRequest) returns (DeleteWorkbookResponse);

  // Cell RPCs
  rpc UpdateCell(UpdateCellRequest) returns (UpdateCellResponse);
  rpc GetCell(GetCellRequest) returns (GetCellResponse);
  rpc GetCellRange(GetCellRangeRequest) returns (GetCellRangeResponse);

  // Chart RPCs
  rpc CreateChart(CreateChartRequest) returns (CreateChartResponse);
  rpc UpdateChart(UpdateChartRequest) returns (UpdateChartResponse);
  rpc DeleteChart(DeleteChartRequest) returns (DeleteChartResponse);

  // Collaboration RPCs
  rpc SaveCollaborationState(SaveCollaborationStateRequest) returns (SaveCollaborationStateResponse);
  rpc GetCollaborationState(GetCollaborationStateRequest) returns (GetCollaborationStateResponse);

  // Template RPCs
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc CreateFromTemplate(CreateFromTemplateRequest) returns (CreateFromTemplateResponse);

  // Named Range RPCs
  rpc CreateNamedRange(CreateNamedRangeRequest) returns (CreateNamedRangeResponse);
  rpc GetNamedRanges(GetNamedRangesRequest) returns (GetNamedRangesResponse);

  // Conditional Format / Data Validation
  rpc SetConditionalFormat(SetConditionalFormatRequest) returns (SetConditionalFormatResponse);
  rpc SetDataValidation(SetDataValidationRequest) returns (SetDataValidationResponse);

  // Pivot Table
  rpc CreatePivotTable(CreatePivotTableRequest) returns (CreatePivotTableResponse);

  // Comments
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc ResolveComment(ResolveCommentRequest) returns (ResolveCommentResponse);

  // Developer Metadata
  rpc SetDeveloperMetadata(SetDeveloperMetadataRequest) returns (SetDeveloperMetadataResponse);
  rpc GetDeveloperMetadata(GetDeveloperMetadataRequest) returns (GetDeveloperMetadataResponse);

  // Protected Range
  rpc ProtectRange(ProtectRangeRequest) returns (ProtectRangeResponse);
  rpc UnprotectRange(UnprotectRangeRequest) returns (UnprotectRangeResponse);

  // Import/Export
  rpc ImportCsv(ImportCsvRequest) returns (ImportCsvResponse);
  rpc ExportCsv(ExportCsvRequest) returns (ExportCsvResponse);
}
