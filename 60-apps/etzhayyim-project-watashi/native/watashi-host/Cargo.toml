[package]
name = "watashi-host"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Watashi — cross-platform input sharing native host binary (cursor ferry between screens)"
homepage = "https://mfbtsuyc.etzhayyim.com/"
repository = "https://github.com/etzhayyim/etzhayyim-root"
documentation = "https://mfbtsuyc.etzhayyim.com/"
keywords = ["kvm", "mouse", "keyboard", "remote-desktop", "globalprotect"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[[bin]]
name = "watashi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
url = "2"
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# KAMI Engine crates
kami-bridge = { path = "../../../../40-engine/kami-engine/kami-bridge" }
kami-knp = { path = "../../../../40-engine/kami-engine/kami-knp" }
kami-input = { path = "../../../../40-engine/kami-engine/kami-input" }
kami-ui-gpu = { path = "../../../../40-engine/kami-engine/kami-ui-gpu" }
kami-text = { path = "../../../../40-engine/kami-engine/kami-text" }

# Kotodama host
kotodama-kami-host = { path = "../../../../40-engine/kotoba/crates/kotoba-kotodama/hosts/kotodama-kami-host" }

# mDNS peer discovery
mdns-sd = "0.11"
hostname = "0.4"

# Window + GPU
winit = "0.29"
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[package.metadata.wix]
product-name = "Watashi"
manufacturer = "GIFTED AGENT LLC"
description = "Cross-platform input sharing native host for LAN and relay-based enterprise sessions."
homepage = "https://mfbtsuyc.etzhayyim.com/"
upgrade-guid = "A4F56994-8948-4A74-A61D-5C06ACF42177"
path-guid = "DB8B022A-782A-4B6E-BB59-36838C06CD3C"
license = false
eula = false
