# ─── Substrate rules (CRITICAL — enforced by ADRs 2605172000 + 2605172100) ──

[platform.deployment]
# etzhayyim/* の deployment target は Murakumo Mac-mini fleet のみ。
# etzhayyim.com legacy は Vultr 残置(本 monorepo 範囲外)。
# ADR-2605191346 で hard rule 化。Stage 3 ansible playbook は
# ADR-2605232100 で religious-corp cells を Tier-1 stateful service として再分類。
tier_0_edge = "Cloudflare Workers / Pages (CDN as thin layer; persistent state in MST/IPFS/L2)"
tier_1_compute = "Murakumo Mac-mini fleet (10 nodes + jacob control plane, ADR-2605182312)"
tier_2_host = "user macOS/Linux box (launchd / systemd; ameno-daemon Path A/B)"
tier_3_browser = "user browser (WebGPU MediaPipe Gemma, svelte appview)"
control_plane_native = "systemd / launchd for stateless host-resident daemons (ameno-daemon, agent_daemon_main)"
control_plane_k3s = "k3s on Lima VMs across all 11 fleet nodes (1 Lima VM per Mac mini, joined via WireGuard wg0; ADR-2605232100)"
control_plane_k3s_bootstrap_playbook = "60-apps/ai-gftd-project-murakumo/ansible/k8s-gpu-cluster.yml"
control_plane_k3s_inventory = "60-apps/ai-gftd-project-murakumo/ansible/inventory/hosts.yml"
control_plane_k3s_role = "lima_k3s_gpu (modes: tools / preflight / bootstrap / deploy_llama_vulkan)"
control_plane_k3s_bootstrap_token_env = "MURAKUMO_K3S_TOKEN"
control_plane_k3s_smoke_test_only = "50-infra/k8s/lima-k3s/bring-up.sh (3-VM HA on developer host, NOT the fleet bootstrapper)"
prohibited = [
  "Vultr VKE / VPS / Object Storage",
  "EKS / GKE / AKS / DigitalOcean Kubernetes",
  "any commercial K8s control plane",
]
vultr_status = "etzhayyim.com legacy only; etzhayyim/* completely separated per ADR-2605191346"

[platform.substrate]
# Hard rules for any module under etzhayyim/root.
state_substrate = ["AT Protocol MST", "IPFS", "Base L2 anchor"]
state_prohibited = ["RisingWave", "Postgres", "Kysely", "MySQL", "MongoDB", "centralized DB"]
state_rule_adr = "2605172000"

# Learning loop status (Stage D Phase A, ADR-2605232200, 2026-05-23)
# UNSPSC actor invocations are wrapped with perceive→reason→act→record:
#   1. perceive: read up to 5 recent ObservationRecords from AtIpfsLocalBeliefStore
#   2. reason:   _compute_prior_consensus() → (outcome_count, dominant_status, confidence_permille, input_match_count)
#   3. act:      inner LangGraph runs; cells OPT-IN read state["_prior_consensus"] for prior-informed routing
#   4. record:   ObservationRecord persisted to SQLite hot cache + (when ETZ_PDS_SERVICE_TOKEN set) PDS createRecord
# Reference impl: c10101500.py verify_health prior_shortcut (conf >= 800 + n >= 3 + match >= 1 + dominant = authorized)
# Adoption surface: 1 / 18,342 actors today (reference only); other 18,341 keep deterministic-only behavior.
learning_loop_status = "Phase A — wrapper signal live across 18,342 actors; cell-side opt-in adoption pending (reference: c10101500)"
learning_loop_adr = "2605232200"
learning_loop_wrapper_module = "pymagatama.unispsc_capabilities.wrapper"
learning_loop_reference_cell = "20-actors/magatama/py/src/pymagatama/langgraph_graphs/unispsc_agents/c10101500.py"
learning_loop_publish_endpoint_env = "ETZ_PDS_ENDPOINT (https://pds.etzhayyim.com); auth via ETZ_PDS_SERVICE_TOKEN secret (optional — graceful degradation to local-only on absence)"

payment_substrate = ["USDC on Base L2", "ERC-4337 Smart Account", "Coinbase Smart Wallet", "Superfluid streams", "0xSplits", "Gnosis Safe escrow"]
payment_prohibited = ["Stripe", "PayPal", "Square", "Razorpay", "Braintree", "Adyen", "credit-card gateways", "bank ACH", "wire transfer"]
payment_rule_adr = "2605172100"

identity_substrate = ["did:web:etzhayyim.com", "did:plc", "WebAuthn passkey", "Coinbase Smart Wallet"]
auth_substrate = ["DID-bound signature", "WebAuthn", "passkey"]
sdk_seam = "@etzhayyim/sdk (20-actors/etzhayyim-sdk/) — only seam allowed to import substrate clients"
substrate_engine = "kotoba"               # ADR-2605262130 — canonical storage substrate engine (40-engine/kotoba; 17 crates Apache-2.0)
substrate_engine_adr = "2605262130"
substrate_engine_path = "40-engine/kotoba"
holochain_iso = "yatachain"               # SUPERSEDED by ADR-2605262130; retained as historical name; 10-protocol/yatachain/SPEC.md has deprecation banner (Phase 0.5)
holochain_iso_spec = "10-protocol/yatachain/SPEC.md"  # DEPRECATED 2026-05-26; retained one R-cycle then archived
holochain_iso_adr = "2605231400"          # SUPERSEDED by 2605262130
holochain_iso_projection_adr = "2605231500"          # SUPERSEDED by 2605262130 (no projection layer; kotoba-kqe arrangements serve hot-path reads directly)
holochain_iso_engine_exploration_adr = "2605232300"  # SUPERSEDED by 2605262130 (engine chosen = kotoba)
holochain_iso_engine_decision = "kotoba"  # closed by ADR-2605262130

# ── No-Server-Key posture (ADR-2605231525, Council ratify pending) ──
# etzhayyim-operated infrastructure holds zero signing capability.
# All writes are member-signed; etzhayyim runs read-only surfaces.
server_key_posture = "no-server-key"
server_key_adr = "2605231525"
server_key_status = "proposed-council-ratify-pending"
server_key_forbidden_env = [
  "YATA_DONATE_PRIVATE_KEY",     # Stage A — USDC signer (removed in donate.ts rewrite)
  "DATABASE_URL",                # Stage B — RisingWave creds (bulk-ingest moves to community)
  "B2_ACCESS_KEY_ID",            # Stage B/D — Backblaze blob upload (community-owned)
  "B2_SECRET_ACCESS_KEY",        # Stage B/D — Backblaze blob upload (community-owned)
  "MAPILLARY_ACCESS_TOKEN",      # Stage D — community-owned
  "RUNPOD_API_KEY",              # Stage D — community-owned
  "ODPT_API_KEY",                # Stage D — community-owned
  "EMBED_AUTH_TOKEN",            # Stage D — community-owned
  "SS_REPO_SIGNING_KEK",         # Stage C-4 — KEK envelope master (per-member after devolve)
  "AUTH_KEYS_KEK",               # Stage C-4 — auth Worker KEK alias
  "RESEND_API_KEY",              # Stage D — member-side SMTP after handover
  "DISPATCHER_INTERNAL_SECRET",  # Stage E — Worker↔pod HMAC (disappears with internal pods)
  "YATA_AGENT_ADMIN_KEY",        # Stage E — single-operator admin gate → Council multisig
]
server_key_allowed_surfaces = [
  "com.atproto.sync.subscribeRepos (read-only firehose)",
  "kotoba-kqe arrangement indexer (EAVT/AEVT/AVET/VAET; regenerable from MST + IPFS + Base L2 anchor; per ADR-2605262130 — supersedes yatachain-projection L0 indexer carve-out)",
  "Public DID Document serving (document itself signed off-line by Council Safe + committed to repo)",
  "Lexicon publication (00-contracts/lexicons/**/*.json as static assets)",
  "Contract verification via read-only Base L2 RPC",
  "IPFS pinning (content-addressed, signer-free)",
  "Static asset serving (Workers Assets / GitHub Pages)",
]
server_key_exemption_marker = "// no-server-key: read-only"  # comment marker for documented Stage handover rollback windows
server_key_verifier = "70-tools/e7m/src/e7m/commands.py:_check_no_server_key (9th constitutional invariant in `e7m verify`)"
server_key_charter_rider_amendment = "CHARTER-RIDER.md Annex A — §1.5 PLATFORM POSTURE proposed (Council 5-of-7 ratify pending)"

