[platform.dataset_substrate.did_worker]
# ADR-2605241500 §D9 (DID Worker scaffold). Cloudflare Worker mirrors
# the etzhayyim-esign / etzhayyim-pinner pattern. Identity is published
# at the spec-required /.well-known/did.json on the same hostname; the
# runtime actor (the actual pinning logic) lives on operator
# workstations under 70-tools/e7m-dataset/ — not on a public Worker.
