# ─── hodoki (解き) ELV disassembly + materials recovery Tier-B R0 scaffold (ADR-2605261215) ────────

[[adrs]]
id = "2605261215"
title = "hodoki (解き) — End-of-Life Vehicle Disassembly + Materials Recovery Tier-B Actor R0 Scaffold"
status = "proposed"
status_note = "Master charter establishing hodoki (解き, continuative noun of 解く to untie/dissolve/unmake; Buddhist 解脱 release echo — vehicles released from compound form back to elemental materials, then reborn through kanayama / makura / silicon) as Tier-B religious-corp first-party end-of-life vehicle (ELV) disassembly + materials recovery actor. Source methodology: YouTube `whyjio70IUU` 'How Audi Strips Down Thousand of Like-New Expensive Cars Inside Massive Facility' — methodology adopted (depollution → parts harvest → shred → sort); OEM-monopoly right-to-repair-restricting retail layer rejected per §2(e). R0 scope = M1 passenger vehicles (≤2.5t curb, ≤8 seats) gasoline/diesel/HEV/PHEV/BEV; full chain intake → depollution → battery handling → parts harvest → catalyst recovery → seat/textile recovery → shred → cross-actor feed. 14 constitutional gates G1..G14 IMMUTABLE R0–R3. **3 constitutional firsts**: (a) **G8 MANDATORY ECU + infotainment + telematics data wipe BEFORE disassembly** (cryptographic destruction + physical chip-shred fallback; ≥2 robot witness; §2(c) anti-surveillance operationalized for consumer vehicles, parallel to makura G14 + N9), (b) **G12 RIGHT-TO-REPAIR INVARIANT** — every harvested part has IPFS-pinned catalog entry with VIN provenance + part DID + condition + bilingual; no proprietary lock-in; no anti-DRM tolerated; §2(e) anti-gatekeeping operationalized at vehicle scale, (c) **G13 multilateral cross-actor circular invariant** binding hodoki ↔ kanayama (metals) ↔ makura (seat foam G13 closure) ↔ silicon Wave 2 (ECU PCB) ↔ hikari R2+ (Li-ion second-life) — first mandatory four-way invariant. Other gates: G2 mass-balance ≥98% closure on yatachain (inherits kanayama), G6 F-gas capture ≥95% no atmospheric venting, G7 Li-ion thermal-safety SOP, G10 SBT-gated refrigerant+airbag+Li-ion+PGM+ECU-shred personnel, G11 KPI caps M1 only ≤2.5t (N5 buses+trucks ≥3.5t / N10 H2 FCV / N9 Tesla cell-recovery = Wave 2 ADR), G14 PGM Pt/Pd/Rh yield ≥95%. 10 non-goals N1..N10: N1 military / N2 aerospace / N3 marine / N4 rail / N5 buses+trucks ≥3.5t / N6 anti-DRM circumvention without OEM cooperation / N7 VIN-stolen / N8 chop-shop / N9 Tesla cell-harvest / N10 H2 FCV. 9 Pregel cells (elv_intake_audit naphtali L1a / elv_depollution joseph L1b / elv_battery_handling levi L2 / elv_parts_harvest simeon L3a / elv_catalyst_recovery levi L3b / elv_seat_textile_recovery dan L3c→makura / elv_body_shred zebulun L4→kanayama+silicon / elv_emissions_audit levi cross / elv_provenance_binder judah terminal — all import-time RuntimeError; smoke test 9/9 pass). 8 lexicons (`app.etzhayyim.hodoki.{elvIntakeRecord, depollutionAttestation, batteryHandlingRecord, partsHarvestCatalog, catalystRecoveryRecord, shredOutputAttestation, dataWipeAttestation, silenDeconstructionReview}`; JSON 8/8 valid). 3 new robotics class reservation (Hagasu 剥がす paint/body-panel stripper R1+ / Nuku 抜く fluid-drain manipulator R1+ for G6 ≥95% F-gas capture / Tokike 解け body-fastener releaser R1+ namesake mini-robot) + 4 inherited reuse (Yokin kanayama R2+ for PGM bench smelter + Otete + Mimi + Quad kuni-umi). Murakumo no-new-node 7-node fleet reuse only (naphtali/joseph/levi/simeon/dan/zebulun/judah). 4-phase R0→R3 (R0 scaffold / R1 benchtop single-vehicle + data-wipe demo + 5-vehicle trial + ELV-recycler SME + F-gas technician SME / R2 pilot ≤10/day + tatekata-shared yard + cross-actor feed + 30-day public comment / R3 community-scale ≤500/month + ≥95% material recovery + 60-day public review). Tier-B sibling of kuni-umi / wadachi / tatekata / yakushi / watatsumi / mitsuho / hagukumi / makura / kanayama; upstream feeder for kanayama (metals) + makura (seat foam G13 closure) + silicon Wave 2 (ECU PCB) + hikari R2+ (Li-ion second-life)."
path = "90-docs/adr/2605261215-hodoki-elv-disassembly-tier-b-actor-r0.md"

