status_note = "Master charter establishing mitate (見立て, 漢方医学 / 伝統医療 symptom-見極め系譜 + Yakushi Nyorai 左脇侍 日光菩薩 insight echo) as Tier-B religious-corp first-party diagnostic + treatment routing actor. Sibling of yakushi (drug-side, ADR-2605250500). Wave 1 reference = chronic nasal congestion 5-condition triage (allergic-rhinitis-perennial / vasomotor-rhinitis / chronic-sinusitis / septal-deviation / rhinitis-medicamentosa). Charter Rider §2 全条項 clearance (§2(e) anti-gatekeeping pro-clearance — yakushi と並ぶ最強 constitutional 推進力)。14 constitutional gates (G1 patient consent revocable DID-bound / G2 health data XChaCha20 envelope only / G3 AI 診断 advisory only disclaimer required / G4 R2+ licensed MD-in-loop required / G5 emergency keyword fail-safe ER routing bypass 不可 / G6 high-risk groups human review / G7 no insurance/employer/advertiser data path / G8 INN-only no paywall / G9 training data IRB-equivalent / G10 model bias audit quarterly demographic parity / G11 Wellbecoming no notification spam urgency-only push 3-type / G12 Murakumo only inference / G13 all diagnostic logic open-source no proprietary weights / G14 4-phase R0→R3 each phase own ADR)。10 non-goals (N1 no Rx prescription / N2 no anaphylaxis emergency self-contained / N3 no pediatric <5 independent advisory / N4 no surgical execution / N5 no insurance claim filing / N6 no genetic testing interpretation / N7 no mental health diagnosis / N8 no physician override / N9 no primary care 代替 / N10 no terminal palliative)。4-phase roadmap R0→R3 (R0 scaffold only this wave / R1 self-care advisory PWA 4 cells active / R2 pilot 1 community center 100 patient ceiling + IgE+smear+endoscopy+rhinomanometry+CT / R3 community-scale multi-center + SLIT cohort + ESS surgery planner + Kafun-watch environmental mesh)。Substrate boundary: MST + IPFS + Base L2 anchor via @etzhayyim/sdk; payment USDC + TitheRouter donation/kisha/grant/internal-promo only; patient identity Adherent SBT + 30-day rotating pseudonym DID; inference Murakumo only. Murakumo fleet placement (R2+): levi (intake/triage/audit/escalate/router/SLIT/ESS/QOL), naphtali (IgE panel logistics), zebulun (smear microscopy), joseph (endoscopy + rhinomanometry), simeon (CT routing). 5 sub-ADRs (2605260115 condition 1 / 2605260130 condition 2 / 2605260145 condition 3 / 2605260160 condition 4 / 2605260175 condition 5 + yakushi naphazoline closed-loop)."
path = "90-docs/adr/2605260100-mitate-diagnostic-routing-charter.md"

[[adrs]]
id = "2605260115"
title = "mitate Wave 1 condition 1 — allergic rhinitis (perennial / IgE-mediated) diagnostic + treatment routing (intake → triage → IgE panel → SLIT cohort)"
status = "proposed"
status_note = "Sub-ADR for condition 1 (highest-prevalence Wave 1 condition; 日本成人 25-40%). Bayesian triage logic over top-7 sign (morning-worst, sneezing burst, water-clear rhinorrhea, ocular pruritus, dust-bedding trigger, atopy family history, pale boggy nasal mucosa). View39-equivalent IgE panel ordering (R2) for perennial antigen set (Der-f-1/Der-p-1/Fel-d-1/Can-f-1/Asp-f-1/Alt-a-1). 鼻汁好酸球 (R2) for 条件 1 vs 2 differential. 4-tier treatment ladder: mild → moderate → severe → severe-refractory. yakushi cross-actor dispense for OTC tier (chlorpheniramine Wave 1 / cetirizine + loratadine + diphenhydramine Wave 1b). SLIT 3-5 yr longitudinal cohort tracker (R3). Council Lv6+ ≥3 + ≥1 licensed MD + ≥1 allergist (R3) attestation triggers."
path = "90-docs/adr/2605260115-mitate-condition-1-allergic-rhinitis-perennial.md"

[[adrs]]
id = "2605260130"
title = "mitate Wave 1 condition 2 — vasomotor (non-allergic) rhinitis diagnostic + treatment routing (除外診断 + 誘因日記 + 環境調整 advisory)"
status = "proposed"
status_note = "Sub-ADR for condition 2 (除外診断 — 条件 1/3/4/5 rule-out, IgE 陰性 + 好酸球 <5%; 5-15% 日本成人 prevalence)。誘因日記 (symptom diary) 2-week minimum with 5 trigger categories (寒暖差 / 香水 / 食事 / ストレス / 飲酒)。4-tier treatment ladder: 環境調整 + 鼻うがい → アゼラスチン点鼻 OR 鼻噴霧 steroid → 漢方 + 自律神経整備 → PNN section (R3 surgical referral)。抗コリン点鼻 (イプラトロピウム) 国内未承認 — INN 言及のみ、海外個人輸入は推奨せず (jurisdictional + 安全)。NARES (Non-Allergic Rhinitis with Eosinophilia Syndrome) sub-type は Wave 2+ R3 cohort 内 observed → 別 carve-out。"
path = "90-docs/adr/2605260130-mitate-condition-2-vasomotor-rhinitis.md"

[[adrs]]
id = "2605260145"
title = "mitate Wave 1 condition 3 — chronic sinusitis (蓄膿症) diagnostic + treatment routing (内視鏡 + 鼻汁性状 + paranasal CT + ESS surgery planner)"
status = "proposed"
status_note = "Sub-ADR for condition 3 — **Wave 1 中 最も Rx + surgical routing 重い condition**; mitate R2 pilot で licensed MD-in-loop の最低 case を確立。12-wk gate (12 週間以上連続鼻閉 + 膿性鼻汁 + 顔面圧迫感 + 嗅覚低下) で R1 advisory tier では rule-in 確定不能、必ず escalate-md-otolaryngology。R2 で Hanami robot 鼻内視鏡 + paranasal CT 外部 imaging facility routing + 病型分類 (CRSsNP / CRSwNP / 好酸球性 / 歯性 / 真菌性 — 各 treatment 全く異なる)。マクロライド少量長期 (クラリスロマイシン 200mg ×3ヶ月, Rx) + 鼻うがい + 鼻噴霧 steroid。R3 で ESS (FESS / extended) surgery planner advisory — 2 ENT surgeon + 1 anesthesiologist on Council 要件、surgeon-in-loop 執刀 attestation。好酸球性副鼻腔炎 → 指定難病登録 + デュピルマブ (Rx 高額生物製剤) `escalation = recommend-md-specialist-rhinology`。真菌性副鼻腔炎 (頭蓋内浸潤 risk) G5 emergency screen に red-flag 必須追加 (片側 + 糖尿病 / 免疫低下 + 進行性顔面腫脹)。"
path = "90-docs/adr/2605260145-mitate-condition-3-chronic-sinusitis.md"

[[adrs]]
id = "2605260160"
title = "mitate Wave 1 condition 4 — septal deviation (鼻中隔弯曲症) diagnostic + treatment routing (内視鏡 + rhinomanometry + septoplasty routing)"
status = "proposed"
status_note = "Sub-ADR for condition 4 — 構造的鼻閉; 10-30% prevalence (subclinical 含む); 最も objective measurement-driven。**片側のみ永続** (左右交代しない) が core differential。R2 で Hanami robot 鼻内視鏡 + rhinomanometry (4-phase AAR — Active Anterior Rhinomanometry, bilateral nasal resistance @ 150 Pa) + 弯曲タイプ classification (C / S / spur) + 下鼻甲介肥大 合併評価 (代償性肥大 70%+ 合併)。4-tier treatment: 軽症 = 点鼻 steroid (mometasone / fluticasone) で甲介浮腫減 → 中等症 = + 生活調整 → 重症 = septoplasty + 下鼻甲介手術 (粘膜下切除 / レーザー焼灼) → 重症 + 外鼻変形 = septorhinoplasty (自費〜混合)。ess_surgery_planner cell を ESS と septoplasty 両方で reuse (conditionContext で分岐)。Septoplasty cost transparency (保険適用 10-15 万円 / 高額療養費で実質 4-9 万円, 入院 2-5 日 or 日帰り) は §2(e) anti-paywall の直接 value。"
path = "90-docs/adr/2605260160-mitate-condition-4-septal-deviation.md"

[[adrs]]
id = "2605260175"
title = "mitate Wave 1 condition 5 — rhinitis medicamentosa (薬剤性鼻炎) detection + 離脱支援 + yakushi-side naphazoline label警告 loop"
status = "proposed"
status_note = "Sub-ADR for condition 5 — **religious-corp 内 self-care substrate の最初の完結した closed-loop case**。yakushi が naphazoline (Wave 1 reference triplet 含有) を 製造 → adherent 使用 → mitate detection → 離脱支援 → yakushi G11 label警告 強化 trigger という双方向 constitutional feedback loop。OTC vasoconstrictor (naphazoline / oxymetazoline / tramazoline / phenylephrine) ≥ 7 日連用 auto-detection (medication_history_audit cell)。≥ 14 日連用 → severity = high。離脱 3-tier protocol: tier 1 完全中止 + 鼻噴霧 steroid 置換 (default) / tier 2 片側ずつ中止 / tier 3 漸減 (重症例 + 短期経口 ステロイド Rx)。元 condition (1-4) と condition 5 併存が典型 — triage 再実行で 元 condition treatment を並走。yakushi cross-actor signal: aggregated overuse signal feed → yakushi pharma_post_market_surveillance (G7 + G10 enforce no patient identity);yakushi side label warning 文言 を data-driven に update (世界で稀少な mechanism)。Charter Rider §2(c) 反転 + §2(e) + §2(h) の三位一体 alignment が物理的に成立。"
path = "90-docs/adr/2605260175-mitate-condition-5-rhinitis-medicamentosa.md"

[[adrs]]
id = "2605260200"
title = "mitate R1 — self-care advisory PWA (intake + emergency_screen + medication_audit + triage 4 cells active; advisory-only; no 検査 ordering; no Rx; unlimited patient)"
status = "proposed"
status_note = "R1 phase transition from R0 scaffold (ADR-2605260100 + 5 condition sub-ADRs) to operational advisory tier — first **operational** religious-corp diagnostic + treatment advisory; §2(e) anti-gatekeeping value moves from constitutional declaration to delivered patient experience. **4 cells activate** (rhinitis_intake / emergency_screen / medication_history_audit / rhinitis_triage on Murakumo node `levi`, healthzPort 13070-13073); **9 cells stay gated** (diagnostic ordering + treatment router + SLIT cohort + ESS planner + outcome followup — R2+ scope). R1 advisory returns top-3 condition posterior + escalation = recommend-md-visit / self-care-advisory only — no 検査 ordering, no Rx-specific advice. Patient unlimited (advisory-only marginal cost). 8 silenMitateReview baseline attestations enumerated (charter / G3 disclaimer / G5 emergency keyword / G5 false-negative adversarial / G6 escalation / G11 intake form text / G11 notification channel / 5× condition Bayesian prior). ≥ 1 licensed MD on Council medical advisory required (R1 minimum; R2 requires ≥ 2). 1 emergency medicine specialist required for G5 attestations (R1 critical path). New app carve-out `60-apps/mitate-pwa/` (T3 TS Native, Adherent SBT + passkey + 30-day rotating pseudonym DID, disclaimer-first flow, no streak/score/gamification, push notification only emergency-ack/appointment-reminder/AE-followup 3 channels). Condition 5 (薬剤性鼻炎) detection + 離脱 advisory live; yakushi cross-actor signal aggregation half-live (mitate detects; yakushi-side label-warning update activates R2 via cross-actor baseline). Bias audit methodology baseline registered (no clinical data yet — quarterly schedule + demographic axes + 5% disparity threshold + corrective action mandate). R1 exit criteria → R2 entry: ≥ 100 patient intakes + 0 G5 false negative (10% specialist sampled review) + ≥ 5 positive outcome self-report + monthly bias audit ≤ 10% selection bias + yakushi cross-actor design Council-reviewed + ≥ 2 licensed MD on Council + Hanami robot mech design attestation in flight."
path = "90-docs/adr/2605260200-mitate-r1-advisory-self-care-pwa.md"

[[adrs]]
id = "2605260215"
title = "yakushi R1 — cross-actor AE aggregation + dedupe rule (mitate joint; closes naphazoline closed-loop other half; pre-req for mitate R2 + yakushi Wave 1 R2 pilot)"
status = "proposed"
status_note = "Joint mitate-yakushi ADR closing the **other half** of the naphazoline closed-loop (mitate side ADR-2605260175 §Decision 4 defined the emit; this ADR defines yakushi receive + label warning data-driven update). 4 decisions: (1) aggregated AE payload variant — `aggregationLevel` enum extends `app.etzhayyim.pharma.adverseEventReport` with 'aggregated-lot-window' + 'aggregated-quarter-summary' values mutually exclusive with encryptedPatientIdentityEnvelope (G10 structural); aggregatedPayload struct = yakushiProductDid + lotIdHashRange + window + patientCountDistinct + medianOveruseDurationDays + medianDosesPerDay + withdrawal8weekSuccessRate + severityHistogram + symptomMedDraSocCodes. (2) AE dedupe rule — primary key (lotIdHashed, severityBucket, onsetWeekIso) at yakushi-side single source of truth; mitate emits both individual + aggregated, yakushi decides count; identity-free by design (G7 + G10 structural not policy). (3) Label-warning data-driven update mechanism — 4 thresholds (withdrawal8weekSuccessRate <0.50 / medianOveruseDurationDays >21 / patientCountDistinct >100/quarter / severityHistogram[severe+life-threatening]/total >0.10) trigger label warning re-issue on next lot; quarterly minimum + on-demand maximum cadence; ae-followup push channel (G11 permitted 3-channel) notifies active adherents. (4) Joint silen-review flow — 3 new silenPharmaReview scopes (cross-actor-ae-aggregation-baseline / ae-dedupe-event / label-warning-update-naphazoline) + 3 new silenMitateReview scopes (yakushi-cross-actor-signal-aggregation-baseline / ae-feed-throttle-baseline / label-warning-update-naphazoline-mitate-cosign); per-update pairing within ±7 days. Bootstrap path: schema locked at mitate R1 deploy; aggregation activates with mitate R2 (outcome_qol_followup cell); first label warning data-driven update ~Q1 of mitate R2 cohort (estimated 90-120 days post-R2). Naphazoline label warning text stays at G11 baseline until first quarter accumulates. Mitigations: dedupe key collision (severityBucket + MedDRA SOC secondary check) / label text bloat (G11 template length cap) / adverse selection bias (R2 bias audit metric) / mitate dedupe inversion (cell test enforces no-dedupe-outgoing)."
path = "90-docs/adr/2605260215-yakushi-r1-cross-actor-ae-aggregation-mitate-joint.md"

[[adrs]]
id = "2605260230"
title = "Hanami (鼻見) robot — mechanical design + safety validation + FDA Class I/II SaMD-equivalent attestation (mitate R2 critical path)"
status = "proposed"
status_note = "mitate-native new robotics class (8th by count, owned by mitate not kuni-umi — same pattern as silicon Wave 2 Funamori). Locks R0 design before R1 prototype fabrication. **Mechanical envelope**: 4.0 mm OD flexible scope × 300 mm insertion, distal articulation ±130° 4-way, 1920×1080 @ 60fps CMOS + 110° FOV, 4500K LED ring 100 lumen, 6-DOF arm 600 mm reach 2 kg payload, **0.5 N hardware force cutoff** at scope tip (constitutional limit — motor torque physically constrained, not just firmware), 50 mm/s linear + 30°/s rotational max, ± 0.1 mm position repeatability, autoclave 134°C × 15 min compatible (tip + 50 mm shaft) + chemical sterilization full-length, single-use disposable PLA tip cover for patient contact, foot pedal + voice + emergency stop (< 100 ms reaction). **5×4 safety validation matrix** (mucosal trauma / depth / patient movement / cross-contamination / classifier mis-routing × hardware / firmware / operator UX / ENT specialist remote override). **3-phase validation** (Phase A bench 1000 cycles + autoclave 100 + network isolation; Phase B silicone phantom × 50 + cadaveric × 30 with Cohen κ ≥ 0.7; Phase C community-center clinical first 20 double-attested live + 21-100 async ≤ 24hr). **Jurisdiction attestation** = JP-first PMDA 製造販売届出 (Class II 相当, 業務範囲外 carve-out applicable for community-center use; fallback 製造販売業許可 + 製造業許可 if not adequate); FDA General Wellness Device (Class I + 21 CFR Part 880); EU MDR Class IIa (rule 5 + rule 11 software medical device). **Murakumo-only classifier** = gemma4:e4b vision distill medical variant (open weights G13, training data consent-only + Council-attested IRB-equivalent per G9); network whitelist enforces no commercial vendor inference endpoint reachable. **G4 N≥2 witness** = operator DID + ENT specialist DID always required (R2+); classifier output never patient-displayed without specialist co-sign. **4-phase build path** (R0 design this ADR / R1 prototype Phase A / R2 Phase B+C community-center pilot 100 patient ceiling / R3 multi-site multi-jurisdiction). **G13 open-source** = hardware CAD + firmware + classifier corpus metadata Apache 2.0 + Charter Rider under 50-infra/hanami-robot/ (R1 ADR creates dir); cross-religious-corp manufacturing via silenMitateReview scope `hanami-cross-corp-manufacture-attestation`. Risks: 0.5 N false positives at turbinate edge / PMDA 業務範囲外 path adequacy uncertain / gemma4:e4b vision medical distill does not yet exist (R1 must train) / cadaver source institutional partner new dependency / counterfeit cross-corp manufacturing supply chain."
path = "90-docs/adr/2605260230-hanami-robot-mechanical-design-mitate-r2-critical-path.md"

# ─── gemma-coder-distill (ADR-2605250400) ───────────────────────────

[[adrs]]
id = "2605250400"
title = "gemma-coder distill — gemma3:4b drift → gemma4:e4b の LangGraph コーディング適応 (EVO-X2 ROCm + peft+trl, Unsloth Windows-ROCm 不可確定)"
status = "accepted"
status_note = "Murakumo fleet で実 serve 中の `gemma4:e4b` (8B Gemma 4 Effective 4B; judah Ollama 192.168.1.17:11434 で実機確認、CLAUDE.md/fleet.toml の `gemma3:4b` 表記はドリフト) を LangGraph specific に distill する初の non-baien 経路。baien-distill は BitNet 専用 (BASE_MODEL_ID ハードコード) かつ ADR-2605241900 edge invariant に縛られるため、新規 tool `70-tools/gemma-coder-distill/` として分離。Trainer は **peft+trl 直** (Unsloth は gate-1 probe 2026-05-25 で Windows ROCm 7.2.1 + Python 3.12 上で pip dep resolution が CUDA-stack 前提依存で RecursionError 確定、evidence `90-docs/baien/probe_unsloth_rocm.json`)。Teacher signal は **HF Apache 2.0 Opus-distilled SFT のみ** (`lordx64/reasoning-distill-opus-4-7-max-sft` qwen-text format) + 手書き antipattern-corrective corpus (20 row、4 antipattern × ~5 ex)。Anthropic 直叩きは ADR-2605215000 §1.2 で禁止、judah LiteLLM 経由 Claude も distill teacher としては §2 OSS-only 制約継承で除外。Gemma 4 は attention 投影を `Gemma4ClippableLinear` (nn.Linear wrapper) で包んでおり peft が拒否 → `_resolve_targets()` で inner `.linear` を suffix match (trainable params=2,752,512 / total=7.94B / 0.0346%)。配布経路: merged HF dir → llama.cpp convert → Q4_K_M GGUF → Ansible で各 mini に `ollama create gemma4-coder:e4b -f Modelfile` → judah LiteLLM に route 追加。baseline 2/8 (25%) で 4 antipattern systematic 検出 (wrong `MemorySaver`/`Command` import paths / `compile(config=...)` hallucination / `set_entry_point(START)`); iter-00 quick E2E 完走 (6 hot-fix を越えて成立、merged adapter 生成 + bench eval 完了); iter-01 full (5020 ex × 2 epoch、~100 min wall) は detached PowerShell Start-Process で background 実行中。"
path = "90-docs/adr/2605250400-gemma-coder-distill-rocm.md"

