[[adrs]]
id = "2605231525"
title = "No-Server-Key Religious-Corp Architecture — etzhayyim infra holds zero signing capability; member-write model + 5-stage flip roadmap"
status = "proposed"
status_note = "Constitutional invariant: etzhayyim-operated infrastructure (Workers, K8s pods, CronJobs, CI runners, hosted bots) MUST NOT hold private keys, signing tokens, or master credentials. All writes are signed by the member, donor, contributor, or community operator. etzhayyim provides public read surfaces only (AT firehose relay, yatachain-projection L0 indexer, DID Document serving via Council-Safe-signed static blob, lexicon publication, contract verification via read-only RPC, IPFS pinning, static asset serving). 13-row server-secret inventory enumerated (YATA_DONATE_PRIVATE_KEY / DATABASE_URL / B2_ACCESS_KEY_ID / B2_SECRET_ACCESS_KEY / MAPILLARY_ACCESS_TOKEN / RUNPOD_API_KEY / ODPT_API_KEY / EMBED_AUTH_TOKEN / SS_REPO_SIGNING_KEK / AUTH_KEYS_KEK / RESEND_API_KEY / DISPATCHER_INTERNAL_SECRET / YATA_AGENT_ADMIN_KEY) with per-row member-write replacement. 5-stage flip roadmap: A USDC signer removal (donate.ts verify-only via Base L2 RPC; EIP-1193 wallet flow in Studio billing + auth sign-up — APPLIED), B bulk-ingest community-operator handover (13 maps pods republished to etzhayyim-community/*, ETZHAYYIM_SUBSTRATE_MODE=mst, relay subscribe — scaffold APPLIED, GitHub org creation pending), C identity-signing devolution (did:web:etzhayyim.com multi-controller with Council 5-of-7 Safe via ERC-1271, did:web:authn.etzhayyim.com per-agent device-generated ES256, SS_REPO_SIGNING_KEK 30-day quarantine drop — Stage C-1 scaffold APPLIED, C-2/C-3/C-4 pending Council ratify), D external-API liability handover (RESEND/B2/Mapillary/RunPod/ODPT/EMBED to community-operator-owned credentials — scaffold APPLIED), E internal-HMAC dissolution (DISPATCHER_INTERNAL_SECRET + YATA_AGENT_ADMIN_KEY removed in final PR — pending Stages A-D). Acceptance criteria: `e7m verify --no-server-key` invariant added (9th constitutional check, scans wrangler.jsonc / k8s manifests / docker-compose / GitHub Actions for 13 forbidden env names; `// no-server-key: read-only` marker exemption for documented rollback windows). Charter Rider v2.0 §1.5 PLATFORM POSTURE amendment proposed (CHARTER-RIDER.md Annex A, Council 5-of-7 ratify pending). Companion runbooks: 60-apps/ai-gftd-project-yatabase/RUNBOOK-USDC-DONATE.md (Stage A operator), 60-apps/ai-gftd-project-maps/bulk-ingest/COMMUNITY-OPERATOR-HANDOVER.md (Stage B), 60-apps/ai-gftd-project-auth/STAGE-C-IDENTITY-SIGNING-DEVOLUTION.md (Stage C), _working/STAGE-D-EXTERNAL-API-HANDOVER.md (Stage D), 50-infra/etzhayyim-did-web/STAGE-C1-DID-CUTOVER.md + cutover-stage-c1.sh (Stage C-1 Council signing flow)."
