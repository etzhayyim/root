status_note = "Sub-charter under manabi master (ADR-2605261045). Adds sixth Pregel cell `cert_prep` alongside literacy / numeracy / civics_charter / vocational / lifelong_inquiry. Knowledge-domain study substrate ONLY for CISA CBK 5 domains + CISSP CBK 8 domains; manabi never issues these credentials (preserves G7 anti-credentialism invariant — credentials remain external to ISACA / (ISC)²). **3 additional gates layered on top of manabi G1..G14**: G15 no pass-rate KPI (silenEducationReview cert_prep section schema-rejects pass-rate fields; only sessionCount + domainCoverageBreadth) / G16 no official past-question reproduction (questionSource closed enum at PDS write — only `synthetic-baien-generated` or `user-imported-personal-only`; `official-isaca-reproduced` / `official-isc2-reproduced` / `commercial-test-bank-reproduced` are NOT valid members) / G17 no external credential body partnership (ISACA / (ISC)² / CompTIA / EC-Council / SANS / Offensive Security — §2(b) ad-free + §2(e) anti-gatekeeping + §1.12 routing-around-state-aligned-bodies). **3 additional non-goals N11..N13**: pass guarantee / formal partnership / cert completion as employment gate within religious-corp roles (adherent competence judged by domainMasteryAttestation subject-specific demonstration, never external credential possession). **Question-source pathway** (G16 detail): (1) synthetic-baien-generated via baien-server-moemoekyun-* on Murakumo fleet (judah LiteLLM gateway per ADR-2605215000), grounded in public CBK outline structure + NIST SP / ISO 27001/27002 conceptual references / COBIT framework descriptions / GDPR+APPI+CCPA + Geneva Convention IHL (all already ingested via ADR-2605262800 legal corpus); deterministic sha256 questionSeed (regenerable; question text bodies NOT persisted). (2) user-imported-personal-only — adherent uploads personally-purchased material (ISACA Review Manual / Wiley / Sybex), client-side XChaCha20-Poly1305 encrypted (ADR-2605181100), `internalOnly:true` (Tier-C pattern from ADR-2605262400), single-recipient ownerDid, never projected to public MST, never LLM training, hard delete on owner request. **LLM-assistance contract** (system-prompt-level): no praise / no pass-rate prediction / no official past-question reproduction even if user paraphrases / cite NIST/ISO/COBIT source / acknowledge uncertainty / Socratic ≥50% (cert_prep targets above master G13 ≥30%). **Data flow**: passkey → manabi-cert-prep PWA → @etzhayyim/sdk consent capability → judah → baien (Murakumo) → synthetic question; sessions persist as XChaCha20 envelope wrapping app.etzhayyim.manabi.certPrepSession, recipientDids:[owner] only. **3 lexicons**: certPrepSession (G15 negative-space + G16 closed enum + G6 inherited via learnerAgeBucket) / personalMaterialImport (internalOnly const true + ownerDid single-recipient + licenseAcknowledgment) / domainMasteryAttestation (credentialClaimedAttested const false; L5 Vocation pathway gating uses this, never external credential). **4 cell stubs** (import-time RuntimeError R0): domain_review / practice_question / self_assessment / personal_material. **PWA**: 60-apps/manabi-cert-prep/ (CF Worker + static, sibling pattern of mitate-pwa). 4-phase R0→R3 (R0 this commit / R1 post-Council ratify wires judah + baien + encrypted-envelope persistence ≤50 adherents / R2 post-R1 30-day public objection enables personal_material + self_assessment ≤500 / R3 integrated with L5 Vocation pathway = charters_compliance reviewer steward + toritate audit steward + Murakumo operator steward recognized vocational tracks gated on domainMasteryAttestation, never external credential). **Landing path**: W0+W1 bytes landed via WIP catch-all commit `67d2d5a0e` (parallel-session lefthook pre-commit race; same pattern as ADR-2605264300 §1 Notes); §Notes paragraph in this ADR is the canonical content reference."
