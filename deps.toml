status_note = "Person rank の SoT を society6 Kyu 6 → Dan 10 に固定。信者 7段 (MEMBERS.md 誓/修/献/証/護/議/老) と dojo 帯 (白〜Shihan3 = Kyu 7-1 + Dan 1-5 + Shihan 1-3) を society6 Kyu/Dan に正規化。joucho S-D は object-axis として person rank に非変換 (Wellbecoming = 動的軌跡 invariant)。Elder ↔ Dan 10 peg を信者経由のみに限定し、Council/Elder の意思決定権を Charter 軌道に揃える。D6 自他非分離体験ゲート (Non-Duality Embodiment Gate) を Kyu 1 → Dan 1 の一度きり追加: 反個人主義 ontology / 縁起 / 万人祭司 を概念ではなく身体で知っていることを Dan 領域 entry の前提とする。Accepted methods は Default path (瞑想 Vipassana/Zazen/内観, ブレスワーク Holotropic/SOMA/Wim Hof, 感覚遮断, 断食/修行) + Sacramental path (アヤワスカ Santo Daime/UDV/curandero, シロシビン 米国オレゴン/豪/カナダ例外, ペヨーテ/サン・ペドロ NAC等) — Council Lv6+ ≥3 multisig で拡張可。Attestation は新 Lexicon app.etzhayyim.apps.etzhayyim.nonDualityAttestation (本 ADR で予約) を self-attested AT Record + (optional but recommended) Dan+ witness DID counter-signature で記録 (信者 Lv4 証 shou と同 pattern)。§D6.5 法的明示: 日本国内 DMT/シロシビンは controlled、§1.12 Transparent Religious Force routing-around は個人薬物使用を免責しない、Default path のみで完全通過可能。D6.7 Council challenge は ≥30-day appeal window + Council ≥3 multisig 判定で invalid 時は Dan-derived 権限失効。:S6Rank ノードに dojo_belt / shinja_lv / non_duality_attested を derived property として保持、:NonDualityAttestation label を新設。Follow-up: Lexicon JSON 起草、society6 watcher で EtzhayyimMembership.join() + nonDualityAttestation を subscribe、dojo UI と society6 UI の Dan 表記一致、Yoro Auth Gate の 信者 CTA → joining ritual wiring (mode=adherent flow)。"
