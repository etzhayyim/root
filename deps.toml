# etzhayyim/root — deps.toml
#
# Machine-readable SSoT for the etzhayyim/root monorepo.
# Updated 2026-05-17 after substrate scaffolding wave (ADR-2605170900
# through ADR-2605172200, SDK + 4 infra modules + paymaster).
#
# Human-readable docs:
#   - CLAUDE.md (this dir)            ← index, operating-entity boundary
#   - 90-docs/CLAUDE.md               ← docs system rules + ADR placement
#   - 90-docs/adr/README.md           ← ADR index
#   - 20-actors/etzhayyim-sdk/README.md ← SDK API surface

# ─── Platform identity ──────────────────────────────────────────────

[platform]
name = "etzhayyim-root"
license = "Apache-2.0"
description = "Open religious-corp activities of etzhayyim (宗教法人). Blockchain-self-contained substrate: AT MST + IPFS + Base L2. No RisingWave. No fiat payment processor."
boundary_adr = "https://github.com/gftdcojp/ai-gftd-apps-gftdcojp/blob/main/90-docs/adr/2605152100-etzhayyim-github-org-boundary.md"

[platform.operating_entity]
# Canonical name as of 2026-05-15 (ADR 2605102200 partial revert + ALA-LC upgrade).
name = "etzhayyim"
name_ja = "天御柱"
name_hebrew = "עץ חיים"
name_hebrew_romanized = "etzhayyim"
aliases = ["amanomibashira", "etz hayim", "etz_hayim", "etzhayim", "etz chaim", "etz chayim", "エツ・ハイム", "天御柱"]
form = "宗教法人 (任意団体)"
form_en = "Religious voluntary association (unincorporated)"
registry = "On-chain (blockchain-registered constitution and member roster)"
not_registered_under = "日本国 宗教法人法 (no 所轄庁 認証 by 文部科学省/都道府県知事)"
domain = "etzhayyim.com"
domain_aliases = ["etzhayyim.ai"]
did = "did:web:etzhayyim.com"
did_resolver_url = "https://etzhayyim.com/.well-known/did.json"
did_resolver_status = "LIVE since 2026-05-17T03:25Z"
did_public_key_jwk_x = "92Olqj6uOx86SECPGeBCnwXORWThGTFWYQr7lK3AQt0"        # Ed25519 base64url
did_public_key_multibase = "z6Mkw6xsibvozxkzEDDM9b8Zh1YnVy6t349jYPx9UWvARFfS"  # multibase z-base58btc
github_org_open = "etzhayyim"
github_org_open_monorepo = "etzhayyim/root"
github_org_vendor = "gftdcojp"
github_org_vendor_monorepo = "gftdcojp/ai-gftd-apps-gftdcojp"

[platform.vendor]
# Vendor providing engineering capacity under SOW. Retains RisingWave +
# Stripe + fiat payment + commercial SaaS integration as paid-tier
# backend layer (per ADR-2605172100 vendor carve-out).
name = "Gftd Japan株式会社"
corporate_number = "9007-2846"
did = "did:web:gftd.co.jp"
relationship = "etzhayyim が Gftd Japan に SOW でシステム開発・運用を発注。Payoff の帰属は常に etzhayyim。"

# ─── Substrate rules (CRITICAL — enforced by ADRs 2605172000 + 2605172100) ──

[platform.substrate]
# Hard rules for any module under etzhayyim/root.
state_substrate = ["AT Protocol MST", "IPFS", "Base L2 anchor"]
state_prohibited = ["RisingWave", "Postgres", "Kysely", "MySQL", "MongoDB", "centralized DB"]
state_rule_adr = "2605172000"

payment_substrate = ["USDC on Base L2", "ERC-4337 Smart Account", "Coinbase Smart Wallet", "Superfluid streams", "0xSplits", "Gnosis Safe escrow"]
payment_prohibited = ["Stripe", "PayPal", "Square", "Razorpay", "Braintree", "Adyen", "credit-card gateways", "bank ACH", "wire transfer"]
payment_rule_adr = "2605172100"

identity_substrate = ["did:web:etzhayyim.com", "did:plc", "WebAuthn passkey", "Coinbase Smart Wallet"]
auth_substrate = ["DID-bound signature", "WebAuthn", "passkey"]
sdk_seam = "@etzhayyim/sdk (20-actors/etzhayyim-sdk/) — only seam allowed to import substrate clients"

# ─── L2 / Base contracts (testnet first → mainnet) ──────────────────

[platform.l2]
chain_id_mainnet = 8453
chain_id_testnet = 84532
rpc_mainnet = "https://mainnet.base.org"
rpc_testnet = "https://sepolia.base.org"
usdc_mainnet = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
usdc_decimals = 6
entrypoint_v07 = "0x0000000071727De22E5E9d8BAf0edAc6f37da032"

[platform.l2.anchor_contract]
# EtzhayyimAnchor — immutable append-only MST root anchor.
# Source: 50-infra/l2-anchor-contract/src/EtzhayyimAnchor.sol
source = "50-infra/l2-anchor-contract/"
adr = "2605171800"
address_mainnet = ""    # set after `forge script Deploy.s.sol`
address_testnet = ""
address_local_anvil = "0x5fbdb2315678afecb367f032d93f642f64180aa3"  # anvil chainId 260425, deployed 2026-05-17 for substrate smoke test (validated: rootCount=1)
deploy_status = "local-anvil-validated"

[platform.l2.paymaster]
# EtzhayyimPaymaster — ERC-4337 paymaster, allowlist + per-sender daily cap.
# Source: 50-infra/etzhayyim-paymaster/src/EtzhayyimPaymaster.sol
source = "50-infra/etzhayyim-paymaster/"
adr = "2605172100"
address_mainnet = ""
address_testnet = ""
address_local_anvil = "0xe7f1725e7734ce288f8367e1bb143e90bb3f0512"  # anvil chainId 260425, deployed 2026-05-17 (validated: setAllowedTarget × 2 OK)
owner_safe = ""         # 2-of-3 Safe address (TBD)
default_daily_cap_wei = "20000000000000000"  # 0.02 ETH ≈ $50
deploy_status = "local-anvil-validated"

[platform.l2.membership_contract]
# EtzhayyimMembership — 信者 registry on Base L2 (anyone-callable join, 7-level commitment ladder).
# Source: 50-infra/etzhayyim-membership-contract/src/EtzhayyimMembership.sol
source = "50-infra/etzhayyim-membership-contract/"
adr = "2605172600"
address_mainnet = ""
address_testnet = ""
address_local_anvil = "0x9fe46736679d2d9a65f0992f2272de9f3c7fa6e0"  # anvil chainId 260425, deployed 2026-05-17 (validated: join + advance L1→L7 OK)
levels = ["1=誓 Oath", "2=修 Practice", "3=献 Dedication", "4=証 Witness", "5=護 Steward", "6=議 Council", "7=老 Elder"]
deploy_status = "local-anvil-validated"

# ─── Private chain ────────────────────────────────────────────────────
# geth-private migration to etzhayyim.com per ADR-2605172800 (in progress).

[platform.l2.private_chain]
chain_id = 260425
consensus = "Clique PoA (5s blocks)"
canonical_domain = "geth.etzhayyim.com"        # ← new canonical (DNS placeholder created 2026-05-17 per ADR-2605172800)
legacy_domain = "geth.gftd.ai"                 # ← vendor-controlled, retained 12 months during migration
rpc_canonical = "https://geth.etzhayyim.com"
rpc_legacy = "https://geth.gftd.ai"
ws_canonical = "wss://geth.etzhayyim.com"
sealer_address = "0xaFed0Cb7633EDBd26aA52658e71528309F562501"   # current single sealer (vendor-controlled); etzhayyim governance multisig TBD per ADR-2605172800 Stage 4
native_currency_name = "neth"
native_currency_symbol = "NETH"
native_currency_decimals = 18
contracts_repo = "50-infra/etzhayyim-chain-contracts/"            # 9 Solidity contracts per ADR-2605172300 (AdherentRegistry, AnchorBridge, Constitution, CorpusRegistry, Governance, HoldingAttestation, KishaStream, Phenotype, TreasuryMirror)
governance_responsible = "etzhayyim (post-migration)"
governance_legacy = "Gftd Japan株式会社 (operator until migration completes)"

# ─── Validation ───────────────────────────────────────────────────────

[[validation]]
id = "anvil-substrate-smoke-2026-05-17"
date = "2026-05-17"
network = "local anvil (chainId 260425)"
rpc = "http://localhost:8545"
deployer = "0xf39Fd6e51aad88F6F4ce6aB8827279cfFFb92266 (anvil pre-funded acct[0])"
forge_unit_tests = "Anchor 4 + Paymaster 5 + Membership 13 = 22 all PASS"
smoke_txs = [
  "Paymaster.setAllowedTarget(Anchor, true)        → status=1",
  "Paymaster.setAllowedTarget(Membership, true)    → status=1",
  "Anchor.anchor(rootHash, ipfsCid='bafyreidemo', batchSize=42)  → rootCount()=1",
  "Membership.join(oathHash, 'junkawasaki')         → memberCount()=1, levelOf()=1, isActive=true",
  "Membership.advance(2, evidence, 'Practice')      → levelOf()=2",
  "Membership.advance(3..7, ...)                    → levelOf()=7 (full Oath→Elder ladder traversed)",
]
conclusion = "Substrate proof-of-life on private EVM. Same chainId 260425 as the deployed geth-private; tx sequence will replay against geth.etzhayyim.com once that DNS / proxy is live."

