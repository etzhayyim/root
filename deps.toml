# Machine-readable SSoT for the etzhayyim/root monorepo.
# Updated 2026-05-17 after:
#   1. Substrate scaffolding wave (ADR-2605170900 through ADR-2605172200,
#      SDK + 4 infra modules + paymaster)
#   2. Mechanical legacy-prefix sweep (1934 files rewritten, ADR-2605172900
#      classifies what was preserved as historical vs deferred)
#   3. GitGuardian RisingWave credential-leak incident response (ADR-2605173100,
#      8 defense layers — HEAD scrub, filter-repo, secret-scan
#      hook, ClusterIP lockdown, RW root auth enforced via ALTER USER,
#      CF Private Tunnel for Hyperdrive, 1Password rotation runbook,
#      Vultr firewall template)
