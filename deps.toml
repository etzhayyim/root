description = "Vision PII filter (ADR-2605262500 §5 / G2). **5-backend matrix**: (a) StubVisionPiiBackend (ETZ_VISION_PII_ALLOW_STUB=1 for tests); (b) OnnxFaceBackend generic for Nx{5,6,7}-row bbox output (W3.1, cycle 20); (c) CenterFaceOnnxBackend subclass — canonical CenterFace decode (heatmap + scale + offset → 3×3 local-max → exp(scale)*4 → NMS at IoU≥0.4) (W3.1.1, cycle 21); (d) Yolov8FaceOnnxBackend subclass — Ultralytics (1, N, 6+) / (1, 6+, N) layout auto-detect via channel-count hint {5..20} + cxcywh→xywh + NMS (W3.1.2, cycle 26); (e) RetinaFaceOnnxBackend subclass — post-processed Nx{15,16} (5 bbox + 10 landmark + score) + xyxy fallback + NMS (W3.1.3, cycle 33). All 3 canonical face detector backends have FULL E2E test coverage: pure decoder (synthetic arrays) + ORT session round-trip (synthetic ONNX) + Pillow blur pixel-verified (checker-pattern → mid-gray) + G5 child-fail-closed (age classification + regression). Fail-closed by default — operator opts in via ETZ_VISION_PII_BACKEND={centerface-onnx,yolov8-face-onnx,retinaface-onnx,stub-allow}. Model paths via env: ETZ_VISION_PII_FACE_MODEL (required) / PLATE_MODEL (optional, []-return when unset) / AGE_MODEL (optional, 0-return when unset). Real blur via Pillow GaussianBlur σ≥15px faces / σ≥20px plates. Child-presence detection triggers FULL-FRAME REJECTION (no partial blur attempted; fail-closed per §5). Lives at e7m_dataset.vision_pii_filter so fetchers/mapillary.py imports cleanly without dragging pymagatama's langchain → pydantic env-fragile chain. W3.1/W3.1.1/W3.1.2/W3.1.3 all shipped + E2E test-locked 2026-05-26/27."

