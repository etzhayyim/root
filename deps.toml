[[adrs]]
id = "2605282300"
title = "kotoba_murakumo relocated out of the kotoba subrepo to 40-engine/kotoba_murakumo/ (downstream-consumer placement)"
status = "proposed"
status_note = "Closure ADR for the structural mistake surfaced by the first git subrepo push attempt on 2026-05-28 evening (id originally 2605282200 collided with kawase-yui ADR; renumbered to 2605282300). Root cause: kotoba_murakumo was placed inside the kotoba subrepo working tree but is a religious-corp downstream consumer, NOT part of kotoba's canonical external surface. When upstream github.com/etzhayyim/kotoba had force-pushed away the merge-base commit (17e30d9db5...) recorded in .gitrepo, all three git-subrepo sync paths (pull, branch, pull --force) failed or were destructive. The honest fix is structural relocation, not a git-workflow patch. This ADR documents the relocation + the durable stay-in-vs-move-out rule: a Python sibling stays inside a subrepo iff (1) it IS canonical upstream-shipped content (e.g. kotoba_langgraph compiles to WASM Components for kotoba-runtime), (2) it imports only documented external interfaces, (3) the upstream release tag includes it. Moves OUT iff (1) it consumes the subrepo via HTTP/wire format but isn't part of its external surface, (2) it imports monorepo-only modules, (3) its constitutional invariants are religious-corp-specific. kotoba_murakumo matches all 3 move-out criteria. Relocation preserved git history via git mv. The Rust scaffold economy_xrpc.rs stays inside the subrepo (it IS intended for upstream eventually; R1.3d-wiring will turn the cfg-gate off). Depends on ADR-2605282000 (the subject) + ADR-2605282100 (lives alongside) + ADR-2605262130 (kotoba substrate)."
path = "90-docs/adr/2605282300-kotoba-murakumo-relocated-out-of-kotoba-subrepo.md"

