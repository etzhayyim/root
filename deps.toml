status = "proposed"
status_note = "Registers Kusawake (草分け 'trailblazer / first through the grass') as religious-corp robot class for autonomous wheeled agri-platform. Methodology reference = SwagBot (University of Sydney ACFR, 4WD/4WS electric, livestock + weed-control modes); methodology adopted, vendor lock-in / closed firmware / data-monetization telemetry NOT adopted. Manufacturer = suki Wave 2 (orchard/vineyard <50 hp electric carve-out per ADR-2605261500 §scope). Operator = mitsuho (new `autonomous_mobile` cell + existing `harvest_robotics` consumer). Sim binding = e7m-sim per ADR-2605261600 (R1 MuJoCo MJX + Mitsuba 3 + Embree; Omniverse / Isaac Sim / Isaac Lab runtime / OptiX / RTX / Replicator NEVER). Wave 1 envelope: 4WD/4WS electric, ≤300 kg with 50 kg payload deck, LFP ≤2 kWh swap (sodium-ion R2+), road ≤6 km/h / field ≤4 km/h / tele-op ≤8 km/h, IP67, ARM64/RISC-V open SoC (tsutae pool), GPS-RTK + IMU + ≤16-line solid-state lidar + 2× RGB + 1× thermal + 4× ultrasonic, Wi-Fi 6 mesh + LoRa (cellular hardware-removable per tsutae G6), SAE J3016 Level 3 ceiling. **10 constitutional gates G1..G10**: G1 open firmware end-to-end (Apache 2.0 + Charter Rider; no binary blobs except removable cellular modem) / G2 dual-layer R2R (tsutae G3 hardware + suki G10 firmware inheritance — IPFS-pinned BoM per VIN) / G3 SAE J3016 Level 3 ceiling (N5 Level 4/5 NEVER) / G4 witness quorum ≥2 Ed25519 sigs (robot DID + operator OR peer robot) per ADR-2605191524 / G5 no surveillance telemetry (data flow onboard → Murakumo → yatachain only) / G6 no synthetic pesticide application (mitsuho G6 inheritance; neonicotinoid / glyphosate / paraquat / organochlorine schema-rejected) / G7 no livestock force escalation (sound + visual + slow follow only; electric shock / projectile / tranquilizer NEVER §2(a)) / G8 Murakumo-fleet-only inference per ADR-2605215000 / G9 open CAN bus + open ISOBUS-compatible implement detection (suki G9 inheritance) / G10 yatachain per-unit lineage (per-VIN DID + IPFS BoM + repair