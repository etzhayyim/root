status = "accepted"
status_note = "6th Move of the baien multi-modal graft sequence. Robotics: tier-split for safety reasons per Charter Rider §2(h) (no harm) + §2(a) (no autonomous weapons). Edge tier ships scene-description capability only (no action output to robot controller). Server tier may add an OpenVLA-style action head, but ONLY post-Council ratification (Council Lv6+ supermajority required). Companion to wadachi (ADR-2605242000) and kuni-umi (ADR-2605201400-2605201900) autonomous-mobility / planetary-infra robotics actors — those actors do NOT use baien Move 6 today; they use task-specific stacks under their own governance gates."
path = "90-docs/adr/2605242120-baien-mx-move6-robotics-graft.md"

[[adrs]]
id = "2605242400"
title = "baien smoke is destructive finding — Move 1 Phase A + distill iter-00 honest signal; minimum-informative training tier"
status = "accepted"
status_note = "Formalises the lesson from two same-day real-train runs (Move 1 Phase A: 0/4 vs baseline 2/5; distill iter-00: Δ=-0.380 abort). Both run ≤3 SGD steps from a random-init head and produce strictly worse outputs than the frozen baseline — the pattern is mechanical (3 SGD steps from random init under Adam+bf16 defaults push the trainable head into a degenerate region; the frozen trunk then completes the disrupted prefix into template loops). Decision: (a) Phase A is pipeline validation, not learning; (b) minimum-informative tier = Phase B (1000 samples, ~250 SGD steps, ~40min) for Move 1, --n-per-category 200 --max-iter 2 (~30 min) for distill; (c) operator gate against publishing smoke-tier adapters to distilled-models.jsonl — new entries require ≥250 SGD steps OR ≥+5pp microbench improvement over baseline. Companion: trl 1.4.0 API drift fixes in 70-tools/baien-distill/src/baien_distill/nodes/train.py (drop max_seq_length, add use_cpu=not torch.cuda.is_available(), migrate dataset schema to {prompt, completion})."
path = "90-docs/adr/2605242400-baien-smoke-is-destructive-finding.md"

