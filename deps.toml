mechanism = "MoE 9/128 active experts × ~100 MB held in 8-10 GB macOS page cache; per-token disk read only on expert turnover (~6.25%) = ~85-170 MB/token = ~0.7-1.3 GB/s effective demand at 7.9 tok/s = within both tiers"
mechanism_deep_5_layer_analysis = """
ROOT CAUSE — why ADR-2605253000 §5 prediction overestimated by 15×:

Predicted: per-token = compute (9.5 ms) + disk read (110 ms), disk = active_params (1.5 GB) / disk_bandwidth
Reality:   per-token disk demand = 1-13 MB, not 1.5 GB

Layer 1 — MoE expert sparsity (known but insufficient): 9/128 = 7% active → 105 MB/token UPPER BOUND
Layer 2 — Router routing stability (BLIND SPOT): adjacent tokens have STRONG router correlation; only 0.5-1 expert changes per token (not all 8) → marginal new = 6-13 MB/token. Was the largest miss in the prediction.
Layer 3 — macOS unified memory page cache LRU: 16 GB RAM × ~60% = ~10 GB cache budget; hot expert set (20-30 experts = 3-5 GB) stays resident; cache hit rate ~80-90% after warm-up → marginal disk demand = 1-2 MB/token
Layer 4 — Compute UNDERESTIMATED: predicted 9.5 ms FMA only; actual ~50-75 ms (Q3_K_M→FP16 dequant 20-30 + matmul 10 + attention KV q8_0 r/w 15-20 + softmax+LN 5-10 + sampling 2-5). Of total 127 ms, disk pure contribution = only ~25-40 ms.
Layer 5 — Kernel async I/O + readahead: llama.cpp MAP_PRIVATE + sequential → kernel prefetches during compute; effective disk impact = max(0, disk_time - compute_time) ≈ ~0.

CORRECTED per-token disk demand:
  1.5 GB naive
  × 0.07 sparsity     = 105 MB
  × 0.12 stability    = 13 MB
  × 0.15 cache hit    = 2 MB
  overlap w/ compute  → effective 0-2 MB
@ 7.9 tok/s × 13 MB worst-case steady = 103 MB/s actual disk demand
= 12% of SanDisk USB 3.2 Gen 2 (836 MB/s) capacity
= 4% of internal NVMe (2300 MB/s) capacity
→ both tiers have huge headroom; bandwidth NOT the bottleneck

REAL bottleneck: compute (50-75 ms/token) — storage-tier-independent.
"""
mechanism_evidence_from_measurements = """
Measurement       Internal NVMe    SanDisk USB 3.2   Delta   Interpretation
Page faults       2,348,015        2,327,311          -1%    Identical cache miss pattern
Peak RSS          10.30 GB         9.99 GB            -3%    Both saturate ~10 GB cache budget
Peak mem fp       7.20 GB          7.20 GB             0%    IDENTICAL working set size
Wall (200 tok)    119.0 sec        127.7 sec          +7%    Cold-load 80 sec disk-bound portion only
Gen tok/s         7.7              7.9                +3%    Run-to-run noise (statistical tie)
Prompt tok/s      3.2              3.1                -3%    Run-to-run noise
"""
applicability_scope = """
APPLIES to:
  - MoE active ratio ≤10% (Gemma 4 26B-A4B, Qwen3.5-A3B, Mixtral 8x7B, GPT-OSS 20B/120B)
  - Single-session inference (not parallel streams)
  - Context ≤4K (KV cache must not evict experts from page cache)
  - Mac mini M4 16GB unified memory class

DOES NOT apply to:
  - MoE active ratio 20-50% (DeepSeek-V2 21B/236B): sparsity effect halved
  - Dense models (Llama 3.1 70B, Qwen2.5 72B): all params touched per token, no cache benefit
  - Long-context (ctx ≥16K): KV cache eviction destroys expert cache
  - Multi-stream concurrent inference: cache contention destroys hit rate
  → Dense model substrate validation deferred to R5
"""
