status = "proposed"
status_note = "Master charter establishing tsutae (伝え, transmission / handing-down; multi-gen communication echo) as Tier-B religious-corp first-party **handheld communication device (smartphone-class consumer electronics)** actor. Methodology source = YouTube `J4GoOScUO5k` (Samsung smartphone factory build documentary; SMT + AOI + OLED + Knox firmware + final QC pipeline); manufacturing methodology adopted; **proprietary IP + closed firmware + surveillance hardware + addictive UX + mass-production-at-any-cost explicitly rejected per Charter Rider §2(b) + §2(c) + §2(d) + §2(e)** (watatsumi precedent + makura precedent + manabi G3 precedent compound). R0 scope = handheld communication device assembly (smartphone-class form factor ≤200 g + ≤7-inch display + ≤500 cm³ enclosure); ARM64 or RISC-V 64-bit SoC; modular battery + display + camera + USB-C + cellular module. **14 constitutional gates G1..G14 + 12 non-goals N1..N12** (+2 non-goals over igata's 10 reflecting smartphone-specific §2(c) + §2(d) compound risk). Key gates: G1 open hardware (PCB Gerbers + chassis CAD + HDL public) / G2 open firmware (no Knox / no SEP / no Qualcomm closed BSP; bootloader unlock = default state) / G3 repair-rightful (modular screw-fastened + adhesive ≤5g/assembly + iFixit ≥9/10) / G6 §2(c) anti-surveillance (cellular module hardware-removable + Wi-Fi-default boot + microphone hardware kill switch + open biometric firmware) / G7 firmware binary blob ratio ≤5% by mass + Council waiver per blob / G8 §2(d) anti-addiction UX (calm-default OS + notification batching ≥15 min default + no infinite-scroll OS-API + no dopamine-loop API) / G9 §2(b) anti-IP locking (open SoC mandatory; R1 = StarFive JH7110 / SiFive Unmatched / Allwinner D1; R2+ = iwakura SoC; Snapdragon / Apple A / closed Helio / closed Exynos NEVER) / G10 Li-ion LFP-preferred + user-replaceable hand tools + take-back recycling ≥80% R3 (kanayama integration) + no parts pairing / G11 §1.13 Wellbecoming screen-time aggregate self-report only / G12 production rate ≤200 devices / 8-hr line R3 / G13 30-day prior + 1 km community feedback / G14 every device = open serial + DID + IPFS-pinned BoM + repair-history-ready. Key non-goals: N1 proprietary SoC NEVER §2(b) / N2 closed bootloader NEVER §2(b) / N3 mandatory cellular modem NEVER §2(c) / N4 always-on surveillance sensors NEVER §2(c) / N5 addictive UX patterns NEVER §2(d) / N6 licensed IP partnerships NEVER §2(b) / N7 proprietary glue assembly NEVER / N8 mass production ≥100k units/year post-R3 + Council Lv6+ supermajority (igata N1 parity) / N9 external commercial sale SBT↔SBT internal only / N10 carrier-locked SIM NEVER §2(e) / N11 adware / bloatware / mandatory account NEVER §2(b)+§2(d) / N12 AI / cloud-mandatory features NEVER §2(c). **8 Pregel cells** (pcb_smt naphtali + chassis_assembly zebulun + display_attachment joseph + firmware_load joseph + final_qc levi + packaging simeon + device_attestation levi + recycling_intake dan, 全 import-time RuntimeError R0). **6 lexicons** (pcbAttestation + chassisAttestation + firmwareAttestation + deviceAttestation + recyclingCertificate + silenTsutaeReview, 全 R0 stub). **2 new robotics class reservation** (Tedama 手玉 SMT pick-and-place juggler R2+ / Tezukai 手使い precise final-assembly handcraftsman R2+ — tsutae-native) + 4 inherited reuse (Otete precision small-part / Mimi AOI+X-ray / Hitogata R2+ class-A clean for OLED / Funamori marine intl transport). **Vendor independence chain 5th link** (after silicon Wave 1 GPU + yakushi OTC + watatsumi 潜水艇 + kanayama Al + igata HPDC; consumer electronics tier). **4-phase R0→R3** (R0 scaffold this ADR / R1 benchtop single-device PoC build + StarFive JH7110 RISC-V SoC + LCD + SBT pilot ≤10 devices / R2 pilot ≤100 devices/year + iwakura SoC integration R&D (silicon Wave 1 R2 dependency) + OLED + Hitogata class-A + SBT ≤500 / R3 community-scale ≤10,000 devices/year + iwakura mass-integration + igata HPDC Al chassis + kanayama EOL loop closure + 法務 (電波法 + 個人情報保護法 + GDPR) audit). Reserved follow-on slots: R1 = ADR-2605261315 / R2 = ADR-2605261330 / R3 = ADR-2605261345."
