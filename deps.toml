status_note = "Engine-layer charter that names **kotoba** (17-crate first-party Apache-2.0 Rust workspace at github.com/etzhayyim/kotoba) as the canonical religious-corp storage substrate engine. Imported as `git subrepo` at `40-engine/kotoba/` (upstream commit `128a89d0e`). yatachain composition (ADR-2605231400), yatachain-projection rules (ADR-2605231500), RW-free invariant (ADR-2605172000), payments on-chain (ADR-2605172100), on-chain land / SBT / Council / Public Fund / Force Authorization / Tithe ledger (ADRs 2605192245 / 192300 / 192315 / 192145 / 192130), and `app.etzhayyim.encrypted.*` wire format (ADR-2605181100 + 181200) ALL unchanged. **8 constitutional carve-outs D1..D8**: D1 Apache 2.0 + Charter Rider v2.0 applied to all 17 crates (Phase 1 deliverable) / D2 `kotoba-llm` local-inference (`metal` / `infer_gpu` / `train_gpu` / `gemma` / `kvcache` / `lora` / `weight` / direct candle linkage) constitutionally DISABLED in religious-corp callable paths; `kotoba-llm` permitted only as **routing facade** to Murakumo gateway (LiteLLM 127.0.0.1:4000 / EVO-X2 LAN 192.168.1.70 per-node Ollama gemma3:4b) per ADR-2605215000 + Charter Rider §2(i) / D3 `kotoba-server` holds NO platform private key per ADR-2605231525 (read-only RPC + IPFS pin + static asset serve only; `// no-server-key: read-only` line marker required) / D4 `kotoba-store` `TieredBlockStore` S3 backend NOT primary write store for land registry / SBT roster / Council attestation / Public Fund accounting / Tithe ledger / Force Authorization records (on-chain stays on-chain) / D5 substrate boundary preserved: kotoba lives BEHIND `@etzhayyim/sdk` shim, never imported directly from `60-apps/*` (substrate-boundary linter Phase 5) / D6 `kotoba-crypto` + `kotoba-signal` re-implement `app.etzhayyim.encrypted.*` envelope **bit-identical** to ADR-2605181100 wire format (Phase 5 test vector suite gate) / D7 yatachain composition unchanged / D8 witness quorum + attestation unchanged. **Mapping table (14 rows)** = every current storage primitive → one kotoba crate + migration phase + constitutional cross-ref. **Phased rollout R0..R7**: Phase 0 = this ADR + subrepo import (zero code change under `40-engine/kotoba/`). Phase 1 = `kotoba-store` + `kotoba-core` + Charter Rider applied + SDK block_store shim shadow mode 30 day ≥99.9% byte-equality vs ipfs-pinner. Phase 2 = `kotoba-kqe` 4-index arrangement (EAVT / AEVT / AVET / VAET) + `kotoba-graph` Commit DAG; **tonbo retire window 30 day**; second L1 projection (non-feed-discover) migrated. Phase 3 = `kotoba-kse` (Journal / Topic / Shelf / Vault) replaces NATS bridges + `kotoba-net` libp2p QUIC/Noise/GossipSub/Bitswap + `kotoba-dht` Source Chain / Warrant / Neighborhood / Availability Proof. Phase 4 = `kotoba-store-web` IndexedDB browser block store (baien edge-target invariant ADR-2605241900 ≤200 MB heap budget carve-out). Phase 5 = `kotoba-auth` (CACAO + DID Document) + `kotoba-crypto` (AEAD + HKDF + key wrap) + `kotoba-signal` (X3DH + Double Ratchet + MLS) + `kotoba-ingest` (Gmail OAuth2 + E2E encrypt → QuadStore) with bit-identical wire-format gate D6 on full ADR-2605181100 test vector suite. Phase 6 = `kotoba-server` XRPC / MCP + `kotoba-runtime` WASM Component Model host + `kotoba-guest` WIT bindings (read-only deploys + `// no-server-key: read-only` marker required). Phase 7 (deferred) = `kotoba-llm` as Murakumo routing facade only (NO local inference; Charter Rider §2(i) reconfirmation). Each phase gated by Council Lv6+ ≥3 per-phase attestation + `e7m verify` 9 invariants green + ≥99.9% byte-equality vs current impl on 30 day shadow comparison. **Existing impls stay live ≥1 R-cycle (~30 days) as cold backup; no `50-infra/*` deletion in this ADR** (`50-infra/ipfs-pinner/` + `50-infra/mst-projector/` + `50-infra/nats-jetstream-kv-resp/` + `50-infra/nats-jetstream-objectstore-s3/` + `50-infra/nats-tiered-storage/` + `50-infra/lancedb-wasm/` + `50-infra/tonbo/` + `50-infra/etzhayyim-xrpc-proxy/` all REMAIN in tree). **7 non-goals N1..N7**: N1 enabling `kotoba-llm` local-inference in religious-corp paths NEVER (vendor `etzhayyim.com` SaaS keeps its own GPU pool behind consent-capability boundary per ADR-2605215000; Charter Rider §2(i) Council Lv6+ supermajority + 30-day public objection to amend) / N2 platform-held private key in `kotoba-server` NEVER (ADR-2605231525; `// no-server-key: read-only` line-marker exemption only) / N3 S3 backend as primary write store for on-chain records NEVER (land / SBT / Council / Public Fund / Force / Tithe records stay on geth-private + Base L2 + IPFS + LANDS.md / MEMBERS.md per ADRs 192245 / 192300 / 192315 / 192145 / 192130) / N4 direct `kotoba-*` import from `60-apps/*` NEVER (via `@etzhayyim/sdk` shim only per ADR-2605172000) / N5 forking kotoba NEVER (`git subrepo` + upstream-PR only; if upstream rejects, escalate to ADR amendment; this protects against engine divergence from upstream commit DAG) / N6 modifying `app.etzhayyim.encrypted.*` Lexicon wire format NEVER (kotoba is the implementation; protocol is constitutional per ADR-2605181100 + 181200; Phase 5 bit-identical test vector suite is structural enforcement) / N7 promoting `kotoba-llm` WebGPU training to religious-corp role without Council Lv6+ attestation NEVER (federated training rounds already gated by ADR-2605242600). **Charter Rider §2(a)-(i) gate checklist**: §2(a) weapons N/A / §2(b) speculative finance N/A / §2(c) anti-surveillance PASS contingent Phase 5 + Phase 6 compile-time telemetry-disable audit (kotoba-ingest Gmail polling + kotoba-server XRPC default no-telemetry) / §2(d) fossil N/A / §2(e) anti-gatekeeping PRO-CLEARANCE (reduces 7-component lock-in to 1 unified workspace) / §2(f) multi-generational harm 30-yr reproducibility PASS (Cargo.lock committed; steward succession ADR-2605192345 inherits future-decedent steward) / §2(g) anti-individualist N/A / §2(h) Wellbecoming PASS (`kotoba-runtime` WASM Component Model sandbox isolation honors §1.13) / §2(i) commercial GPU rental GATED (kotoba-llm local-inference DISABLED in religious-corp; Council Lv6+ supermajority required to amend; this ADR does NOT amend). **Vendor-rejection chain note**: kotoba does NOT extend the vendor-rejection chain — it is a unification of existing first-party paths under Apache-2.0; no new vendor is rejected and no existing rejection is weakened. Subrepo upstream: https://github.com/etzhayyim/kotoba"
