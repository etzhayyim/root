[experiments."bit-packed-xnor-kernels-260524".coreml_ane_mac_m4.findings]
ane_is_silver_medal = "ANE is the fastest dense fp16 path on M4 silicon (4.13 TFLOPS @ 4096^3 = 11% of vendor-claimed 38 TFLOPS peak), but the bit-packed AND/XNOR-popcount kernels beat it by 50-60% (6.31-6.82 TOPS). ANE wins on dense paths because no user-programmable XNOR exists; the only way to exceed ANE on M4 is custom Metal popcount kernels."
ane_not_programmable = "Apple Neural Engine is closed silicon — no custom kernels, no XNOR-popcount path. Bench measures dense fp16 only. The 50-60% margin between bit-packed Metal and ANE is the silicon-level advantage of 1-bit on M4."
coreml_gpu_overhead = "Core ML CPU_AND_GPU (1.61 TFLOPS) is HALF MLX direct (3.23 TFLOPS) at 4096^3. Core ML Metal dispatch has per-op overhead that compounds for single-op models. Use Core ML only for ANE-eligible models or whole-network compile; for arbitrary GEMM prefer MLX direct."
compiler_dispatch_choice = "ALL ≈ CPU_AND_NE at 4096^3 (4.13 vs 4.09 TFLOPS), confirming the Core ML compiler chose to dispatch the matmul to ANE for this shape. For smaller shapes (64,1024,512) ALL drops to 0.378 TFLOPS vs CPU_ONLY 1.021 — small GEMMs are better off on CPU than ANE due to ANE setup cost."

[experiments."bit-packed-xnor-kernels-260524".bit_techniques_metal_mac_m4.findings]
and_vs_xnor = "AND-popcount slightly beats XNOR-popcount (6.817 vs 6.31 TOPS, +8%) because AND kernel saves one bitwise-NOT op. Choice between AND ({0,1}) and XNOR ({-1,+1}) is a training-stability question, not a perf question."
bitslice_overhead = "Un-fused bit-slice paths pay 2-4x kernel launch overhead. A fused Metal kernel doing all bit-plane multiplies in one launch should hit ~3-5 TOPS for W=2bit/X=1bit, closing most of the gap with the dedicated AND/XNOR kernels."
lut_cache_pressure = "LUT 8x8 needs a 128 KB int16 table (256x256 products). M4 GPU L1 = 32 KB, so the table lives in L2 and each lookup pays an L2 hit (~10x slower than register-resident popcount). LUT path wins only when K is small enough to amortize the table load + small enough to fit in L1."
fp8_fp4_silicon_gap = "Both fp8 and fp4 are blocked on Apple Silicon at the SILICON LEVEL, not just software. M-series GPUs do not contain fp8 or fp4 matrix-multiply units. Listed as out-of-scope for the Apple Silicon edge-target invariant (ADR-2605241900)."

[experiments."bit-packed-xnor-kernels-260524".key_findings]
finding_1 = "PyTorch eager bit-packed XNOR-popcount caps near dense bf16 throughput because of broadcast + dispatch overhead; custom kernels are required to unlock the speedup"
finding_2 = "Mac M4 NEON CPU achieves 13.70x speedup at 4096^3 because the popcount instruction (vcntq_u8) is a single cycle on 16 bytes while the bf16 matmul falls back to NEON fmla on f16"
finding_3 = "Mac M4 Metal GPU achieves 1.98x speedup at 4096^3; absolute throughput 6.31 TOPS sustained (highest measured in this run) while dense bf16 also wins on parallelism"
finding_4 = "Theoretical 16-32x peak vs FP16 (from vendor specs for bit-matmul-capable hw like NV B200 int1 / AMD MI300X dpp_bcnt) is unreachable in pytorch-eager mode at the per-call granularity; would need kernel fusion across RMSNorm + activation binarization to amortize"
finding_5 = "Correctness oracle is the pure-PyTorch SWAR popcount kernel; all 4 backend sources share the same `2*popcount(~(x^w))-K_padded-pad` formula so EVO build (when unblocked) is expected to pass without source changes"

