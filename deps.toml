go         = { name = "gopls",                     version = "v0.18.1",    install = "go install golang.org/x/tools/gopls@v0.18.1" }
lua        = { name = "lua-language-server",       version = "3.15.0",     install = "brew install lua-language-server" }
ruby       = { name = "ruby-lsp",                  version = "0.23.0",     install = "gem install --user-install ruby-lsp -v 0.23.0" }

[platform.cell_fleet]
runtime = "Python 3 + web3.py + eth-account (uv-managed)"
heartbeat_period_seconds = 60
