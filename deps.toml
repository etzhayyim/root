status_note = "Single SoT for how pymagatama.organism actors consume large public-domain corpora (OSM Planet, RIR delegated stats, MaxMind GeoLite2, RIPE-RIS / Routeviews BGP MRT dumps, IANA root zone, Rapid7 Sonar FDNS, OpenINTEL, CAIDA AS-rank, Common Crawl URL index, CZDS per-TLD opt-in zones) without violating substrate boundary. Two-path split: (A) PERCEPTION = hot-path heartbeat sensors resolve latest datasetPin CID → bounded in-memory hot_sample(n) → InboxBuffer push (tier flag) → joucho 情緒 → cadence flag; (B) TRAINING = cold-path corpus-recipe.toml → assemble-public-corpus.py → multi-source IPFS-CID resolve + Charter §2 + PII re-scan + NDJSON shard write → IPFS-pinned corpus subdataset → baien-moemoekyun-train SFT / baien-distill on Murakumo fleet → R1.5-style eval-gated commit_node. License ladder: Tier A (OSM ODbL / GeoNames CC-BY / Wikidata CC0 / RIR public / IANA public / GeoLite2 CC-BY-SA / RIPE-RIS / Routeviews) publishable; Tier C (Rapid7 Sonar / OpenINTEL / CAIDA / Common Crawl / CZDS = CC-BY-NC) admitted under G13 fleet-internal carve-out — `-nc-` infix mandatory + judah LiteLLM + SBT-gate only (same pattern as ADR-2605262100 R1.4). DatasetSensor Protocol in pymagatama.organism.sensors.* with W1 implementations osm_region_sensor / rir_delegated_sensor / geolite2_sensor / ris_routing_sensor / iana_root_sensor; tier='C' Observations carry internal_only=True flag that PostSink drops on external paths. 3 new KaizenObserver rules R7 (stale-sensor-pin) / R8 (charter-fail-rate >5% / 24h) / R9 (tier-c-leak backstop = critical = halts cell + Council Lv6+ escalation). PII filter (pii_filter.py) precedes Charter Rider §2 scan; redacts emails / E.164 / postal addresses / WHOIS registrant blocks in place on the redacted view (annex bytes preserved). PASSIVE-ONLY discipline per user decision 2026-05-26: organisms MUST NOT perform live DNS resolution / port probes / traceroute / WHOIS / RDAP / DoH against third parties (CHARTER-RIDER §2(c) covert-ops avoidance); only pre-published public archives. Inference UNCHANGED Murakumo-only per ADR-2605215000; train-rental amendment ADR-2605262200 independent. 14 gates G1..G14 (Charter scan + PII filter + replicationMin:2 + tier-C drop + `-nc-` infix + SBT-gate + Murakumo-only + no-active-probe lint + hot_sample determinism + recipe-in-git + ≤5% FP / 24h + cadence-respect + datasetPin mandatory + manifest append). 12 non-goals N1..N12 (N1 NOT live DNS/IP/BGP probing / N2 NOT WHOIS query engine / N3 NOT port-scan / N4 NOT route-hijack detector / N5 NOT NetFlow collector / N6 NOT tor harvester / N7 NOT alt resolver / N8 NOT new substrate engine / N9 NOT Tier-D vendor feeds / N10 NOT commercial GPU rental / N11 NOT cross-religious-corp federation / N12 NOT maps_sentinel_murakumo M1 replacement). 4-wave delivery: W0 = this ADR (proposed-status + deps.toml + README + CLAUDE.md row) / W1 = Tier-A foundations (RIR / GeoLite2 / IANA + 3 sensors + PII first cut + R7-9 Kaizen rules; 2-3 days) / W2 = Routing (RIPE-RIS / Routeviews + 2 sensors; 2-3 days) / W3 = Tier-C NC carve-out (Rapid7 / OpenINTEL / CAIDA + G13 enforcement + R9 leak-test harness; 3-4 days) / W4 = CZDS per-TLD + Common Crawl CDX (per-TLD individual Council attestation)."
path = "90-docs/adr/2605262400-public-data-organism-ipfs-ingestion.md"

