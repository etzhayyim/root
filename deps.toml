# ─── Labor Liberation Transition Mechanism (ADR-2605261000 master + 4 actor R0) ────
# Per ADR-2605261000: 7-stage Liberation Ladder L0..L6. Each stage gated on
# actor maturity + Public Fund reserve + adherent ceiling + Council attestation.
# 4 new Tier-B actors close L2 + L4 + L5 capability gates.

[[adrs]]
id = "2605261000"
title = "Labor Liberation Transition Mechanism — Adherent SBT → Minimum Livelihood Guarantee (7-Stage Liberation Ladder L0..L6)"
status = "proposed"
status_note = "Strategic master ADR closing the gap between the mission charter (ADR-2605192100 人類の構造的労働解放) and operational delivery. Defines 7-stage Liberation Ladder (L0 pre-bootstrap / L1 Witness ≤100 adherents / L2 Sustenance ≤1,000 / L3 Shelter ≤5,000 / L4 Care ≤25,000 / L5 Vocation ≤100,000 / L6 Liberation ≤1M) with explicit OECD-baseline labor-hours/wk reduction targets (40→≤5). Each stage activation requires: (a) required actors at minimum R-phase (e.g., L2 = mitsuho R2 + yakushi R2 + hikari R2; L4 = hagukumi R2 + manabi R2); (b) Public Fund USDC reserve ≥ adherent-ceiling × per-adherent-cost × stage-reserve-multiple (L1 $150K / L2 $10M / L3 $210M / L4 $2.1B / L5 $20B / L6 $300B); (c) Adherent ceiling capacity cap (Sybil-resistant ZK biometric + Council attestation + 30-day public objection per mint); (d) ≥2-quarter previous-stage achievement ratio ≥0.8 of Liberation Metric (aggregate hours-liberated KPI on-chain via ChartersComplianceRegistry.reportLiberationMetric). 8 non-goals N1..N8 immutable (N1 no fiat-replacement UBI / N2 no make-work / N3 no coercive participation / N4 no state-safety-net replacement / N5 no stage-skipping / N6 no donor-directed adherent funding / N7 no non-adherent welfare extension / N8 no eschatological framing). Implementation surface: 4 new lexicons under app.etzhayyim.liberation.* (metricReport + stageAdvanceAttestation + wellbecomingAttestation + adherentExitNotice; all aggregate-only or encrypted-payload structural enforcement); 3 new Pregel cells (liberation_stage_advance + liberation_metric_aggregate + liberation_wellbecoming_audit on levi); Solidity LiberationLadder.sol + ChartersComplianceRegistry/PublicFund extension. Activation L0→L1 requires Council Seats 2-5 closure + 30-day public objection + this ADR ratification."
path = "90-docs/adr/2605261000-labor-liberation-transition-mechanism.md"

[[adrs]]
id = "2605261015"
title = "mitsuho (瑞穂) — Food / Agriculture Tier-B Actor R0 Scaffold"
status = "proposed"
status_note = "Master charter establishing mitsuho (瑞穂, ancient honorific name for Japan; Kojiki 瑞穂国 multi-gen food-abundance echo) as Tier-B religious-corp first-party food production actor. R0 scope = plant agriculture + freshwater aquaculture + alternative protein (yeast/koji/spirulina + insect-farm support). Excludes animal slaughter (R0-R3; ethics gate deferred R4+ Council Lv7 unanimity), industrial monoculture, patented seeds, GMO without Council attestation, contract farming, commodities trading, ocean factory-fishing (Funamori marine carve-out). 14 constitutional gates G1..G14 (G2 seed sovereignty open-source seed banks / G4 soil regeneration ≥0 net carbon balance / G5 water cap ≤ regional sustainable yield / G6 no synthetic pesticides IPM + organic only / G7 no GMO without Council Lv6+ ≥3 + 30-day public objection / G12 energy ≤1 kWh/kg dry matter R2 / G14 waste log per harvest). 10 non-goals N1..N10. 4-phase roadmap R0→R3 (R0 scaffold / R1 ≤0.01 ha single crop / R2 ≤1 ha integrated rotation + aquaculture + alt-protein + L2 eligibility / R3 ≤10 ha community-scale + cold-chain to 1,000 adherents). 5 Pregel cells (field_cultivation naphtali / aquaculture zebulun / alt_protein_fermentation levi / harvest_robotics joseph / food_preservation simeon) — all import-time RuntimeError R0. 5 lexicons (app.etzhayyim.mitsuho.{parcelAttestation, cropPlanAttestation, harvestAttestation, foodLotAttestation, silenAgricultureReview}). Robotics class = kuni-umi Giemon/Otete/Mimi/Sora R0; Tsumugi (紡ぎ) greenhouse R2+ separate mech-design ADR. Parent ADR = 2605261000 (Liberation Ladder L2 gate)."
path = "90-docs/adr/2605261015-mitsuho-food-agriculture-tier-b-actor-r0.md"

[[adrs]]
id = "2605261030"
title = "hagukumi (育み) — Care (childcare + eldercare + daily-living) Tier-B Actor R0 Scaffold"
status = "proposed"
status_note = "Master charter establishing hagukumi (育み, continuative noun of 育む; multi-gen nurturing echo — children and elders share verb in Japanese) as Tier-B religious-corp first-party care delivery actor. Cross-actor sibling of mitate (diagnosis → care continuity). R0 scope = daily-living non-medical care (childcare ages 2+ / eldercare / chronic-care continuity / meal delivery / respite support). Excludes medical procedures (mitate/yakushi), under-2 childcare (specialist actor TBD), hospice palliative, behavioral psych, surveillance, in-home recording, legal-guardian replacement, abuse investigation (state mandatory-report only). **PRIVACY INVARIANT**: ADR-2605181100 XChaCha20 envelope MANDATORY for careSessionAttestation; structural lexicon-schema enforcement (additionalProperties: false + encryptedPayloadCid required); R0 cells RuntimeError specifically to prevent plaintext data flow. 14 gates G1..G14 (G2 no video recording firmware-level / G3 per-session consent default-deny / G4 caregiver Council vetting ≥3 Lv6+ / G5 child cognitive load cap / G6 elder autonomy invariant / G7 no behavioral modification / G9 human-in-loop required / G10 caregiver 12-hr work cap / G11 mitate emergency escalation / G13 no addictive UX / G14 multi-gen ratio ≥40% under-18 + ≥30% over-65 + ≤30% adults). 10 non-goals N1..N10. 4-phase R0→R3 (R0 scaffold / R1 advisory + caregiver onboarding ≤50 pairs / R2 pilot 5 community centers ≤200 ceiling + L4 eligibility / R3 community-scale 50 sites ≤25,000). 5 Pregel cells on levi/simeon/dan. 4 lexicons (caregiverAttestation + careSessionAttestation + consentRecord + silenCareReview). Robotics: human caregivers R0-R1; Hitogata-A gentle subset R2+ (Council-attested, never alone under G9); Sukoyaka cold-chain (yakushi inheritance); Yutori (ゆとり) telepresence R2+ separate mech-design ADR (hanami precedent). Parent ADR = 2605261000 (Liberation Ladder L4 gate)."
path = "90-docs/adr/2605261030-hagukumi-care-tier-b-actor-r0.md"

[[adrs]]
id = "2605261045"
title = "manabi (学び) — Education Tier-B Actor R0 Scaffold"
status = "proposed"
status_note = "Master charter establishing manabi (学び, continuative noun of 学ぶ; etymologically 真似ぶ to imitate/emulate; multi-gen lifelong-learning echo) as Tier-B religious-corp first-party education actor. R0 scope = open-curriculum literacy + numeracy + civics/charter + vocational + lifelong inquiry. Excludes formal accreditation, degree issuance, examination-as-gatekeeper, behavioral conditioning, for-profit textbook publishing, proprietary LMS, surveillance edtech, family/cultural-transmission replacement, advertising, political-party content. **ANTI-CREDENTIALISM INVARIANT G7**: no degrees/transcripts/GPA; only skillAttestation (subject-specific replayable demonstration) used by L5+ adherent productive contribution. **ANTI-ADDICTION UX G3**: no streaks/rewards/FOMO/leaderboards/badges-as-status; calm-state-default UX. **MINOR PRIVACY G6**: under-18 sessions emit aggregate-only attestations (sessionDuration, moduleId, completionFraction); per-learner detail structurally rejected via learnerAgeBucket discriminator; 30-day rotating pseudonym DID for minors. 14 gates including G4 Council Lv6+ ≥3 charter alignment per module (multi-gen + anti-individualism + Wellbecoming + non-eschatology) + G14 comparative religion mandated (etzhayyim itself never taught as exclusive truth). 10 non-goals N1..N10. 4-phase R0→R3 (R0 scaffold / R1 IPFS curriculum ≤100 learners advisory-only / R2 live tutors + vocational ≤25,000 + L4 eligibility / R3 Yutori telepresence ≤100,000 + L5 eligibility). 5 Pregel cells on levi (smallest fleet footprint — content distribution + tutor coordination, low compute). 4 lexicons (curriculumAttestation + learningSessionAttestation + charterUnderstandingAttestation + silenEducationReview). civics_charter cell output = charterUnderstandingAttestation = Adherent SBT informed-consent baseline per ADR-2605261000 §2.1. Parent ADR = 2605261000 (Liberation Ladder L4 + L5 gates)."
path = "90-docs/adr/2605261045-manabi-education-tier-b-actor-r0.md"

