[platform.langserver]
# etzhayyim-langserver — Murakumo-fleet LSP 常駐 substrate.
# Tier 1 launchd 常駐 per ADR-2605192415 §7.1.
# Status as of 2026-05-21: L1–L9 all 9 reverse-topo layers landed in one
# session (host inventory → plist → binary pins → socket transport → mesh →
# health probe → observability → editor bridge → cell-runner integration).
# plist load gated on user confirmation per CLAUDE.md (HW probe required).
# ADR: 2605212150-etzhayyim-langserver-substrate.md
adr = "2605212150"
session_built = "2026-05-21 (reverse-topo, 9 layers in one /loop run)"
module_path = "50-infra/etzhayyim-langserver/"
manifest    = "50-infra/etzhayyim-langserver/langservers.toml"
hosts_toml  = "50-infra/etzhayyim-langserver/hosts.toml"
plist_template = "50-infra/etzhayyim-langserver/launchd/com.etzhayyim.langserver.template.plist"
listen_port_range_proposed = [15500, 15600]  # collision-free vs cells 13000-14000, phenotype 14000+
languages_pinned = ["rust", "python", "typescript", "go", "lua", "ruby"]
transport_prereqs = ["socat@1.8.0.3", "jq@1.7.1"]
ssot_authority = "langservers.toml"  # deps.toml mirrors; bumps land in langservers.toml first
transports_toml = "50-infra/etzhayyim-langserver/transports.toml"

[platform.langserver.transport_ports]
# Mirror of transports.toml [[transport]] entries (L4 SSoT).
# Default mode = mesh-both (Unix socket + mesh-IP TCP). L5 upgrades bind addr.
rust       = 15510
python     = 15511
typescript = 15512
go         = 15513
lua        = 15514
ruby       = 15515
socket_dir_macos = "/tmp/etzhayyim-langserver-$USER"
socket_mode = "0600"

[platform.langserver.mesh]
# L5 mesh binding policy. Mesh substrate: 50-infra/cluster/murakumo/.
# Runtime mesh-IP resolved from ~/.etzhayyim/mesh/identity.json (target) or
# ~/.gftd/mesh/identity.json (legacy; cutover pending).
mesh_substrate_path = "50-infra/cluster/murakumo/"
mesh_subnet = "10.99.0.0/16"
default_bind_policy = "mesh"      # bind langserver TCP to mesh-IP, not loopback
fleet_registry_script = "50-infra/etzhayyim-langserver/scripts/generate-fleet-registry.sh"
fleet_registry_output = "50-infra/etzhayyim-langserver/scripts/lsp-fleet.json"
listen_addr_default = "mesh-both"  # ETZHAYYIM_LISTEN_ADDR default in run-langserver.sh

[platform.langserver.healthz]
# L6 health-check sidecar. Spawned as background process by run-langserver.sh
# (Python stdlib http.server, no third-party deps). Port = LSP port + 100.
sidecar = "50-infra/etzhayyim-langserver/healthz/healthz-sidecar.py"
port_range = [15600, 15700]
port_offset_from_lsp = 100
watchdog_script = "50-infra/etzhayyim-langserver/scripts/watchdog.sh"
endpoint_path = "/healthz"
probe_modes = ["tcp_connect", "lsp_initialize_handshake"]
probe_mode_default = "tcp_connect"  # --deep flag opts into lsp_initialize_handshake
process_supervision = "launchd KeepAlive + ThrottleInterval=15 (defined in plist)"
flap_handling = "ThrottleInterval=15s minimum between restarts; deeper flap handling in future LangserverHealthMonitoringCell (L9)"

[platform.langserver.observability]
# L7 observability stack. Three signals: on-disk logs (launchd), metrics
# (Prometheus textfile on healthz sidecar /metrics), optional stream (NATS).
obs_toml = "50-infra/etzhayyim-langserver/obs.toml"
on_disk_log_pattern = "/Users/<tribe>/.etzhayyim/log/langserver.<lang>.{stdout,stderr}.log"
rotation_mechanism = "macOS newsyslog (system-provided)"
rotation_config = "50-infra/etzhayyim-langserver/newsyslog.d/etzhayyim-langserver.conf"
rotation_size_mb = 50
rotation_keep = 5
metrics_endpoint = "/metrics on healthz sidecar (Prometheus text/plain v0.0.4)"
metrics_exposed = [
  "etzhayyim_langserver_up",
  "etzhayyim_langserver_uptime_seconds",
  "etzhayyim_langserver_probe_latency_seconds (probe=tcp|deep)",
  "etzhayyim_langserver_probe_failures_total",
  "etzhayyim_langserver_probe_total",
]
nats_forwarder = "50-infra/etzhayyim-langserver/scripts/ship-logs-to-nats.sh"
nats_enabled_default = false  # opt-in via --apply
nats_subject_template = "etzhayyim.langserver.<host>.<lang>.<stream>"
nats_dep = "nats CLI (brew install nats-io/nats-tools/nats)"
prometheus_existing_endpoint = "http://murakumo.etzhayyim.local:9090"  # per [monitoring] in fleet.toml

[platform.langserver.editor_bridge]
# L8 editor remote-LSP attach. Single shim (attach-langserver.sh) is the
# fleet-wide socat stdio↔TCP bridge; Neovim is special-cased to use its
# native vim.lsp.rpc.connect() (no socat needed).
attach_script = "50-infra/etzhayyim-langserver/scripts/attach-langserver.sh"
attach_script_dependency = "socat (L3 prereq)"
configs_dir = "50-infra/etzhayyim-langserver/editor-configs/"
editors_supported = ["nvim", "helix", "zed", "vscode"]
nvim_transport = "vim.lsp.rpc.connect (native TCP, no socat)"
other_editor_transport = "stdio via attach-langserver.sh shim → socat → tcp://<mesh-ip>:<port>"
source_of_truth = "scripts/lsp-fleet.json (no IPs duplicated in editor configs)"

[platform.langserver.cell_integration]
# L9 root layer. Pregel cells query fleet LSPs via langserver_client helper.
client_module = "20-actors/magatama/py/src/pymagatama/primitives/langserver_client.py"
reference_cell_module = "20-actors/magatama/py/src/pymagatama/primitives/langserver_murakumo.py"
reference_cell_name = "LangserverHealthMonitoringCell"
reference_cell_node = "levi"
reference_cell_trigger = "cron */5 * * * *"
reference_cell_healthz_port = 13028  # registered in cells.toml; sibling of joucho 13027
cells_toml_path = "50-infra/cluster/murakumo/cell-runner/cells.toml"
mst_listener_nsid_target = "app.etzhayyim.apps.etzhayyim.langserver.health"  # pending lexicon registration
lexicon_status = "deferred (00-contracts/lexicons/app/etzhayyim/langserver/ unregistered as of 2026-05-21)"
helpers_available = ["initialize", "shutdown", "hover", "definition", "references", "rename"]
transport_default = "tcp"  # mesh-IP path; "unix" available for same-host cells

[platform.langserver.pins]
# Mirror of [[langserver]] entries in langservers.toml — keep in sync.
# Bump via PR-per-language; refuse silent upgrades.
rust       = { name = "rust-analyzer",             version = "2026-01-13", install = "rustup component add rust-analyzer" }
python     = { name = "pyright",                   version = "1.1.401",    install = "npm install -g pyright@1.1.401" }
typescript = { name = "typescript-language-server", version = "4.3.4",     install = "npm install -g typescript-language-server@4.3.4 typescript@5.7.3" }
go         = { name = "gopls",                     version = "v0.18.1",    install = "go install golang.org/x/tools/gopls@v0.18.1" }
lua        = { name = "lua-language-server",       version = "3.15.0",     install = "brew install lua-language-server" }
ruby       = { name = "ruby-lsp",                  version = "0.23.0",     install = "gem install --user-install ruby-lsp -v 0.23.0" }

[platform.cell_fleet]
runtime = "Python 3 + web3.py + eth-account (uv-managed)"
heartbeat_period_seconds = 60
anchor_target = "https://geth.etzhayyim.com → EtzhayyimAnchor 0x5fbdb2315678afecb367f032d93f642f64180aa3"
