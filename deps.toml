[[adrs]]
id = "2605261600"
title = "Robotics Simulation Substrate R0 Charter — OSS USD+Hydra+MuJoCo MJX+Embree+BlenderProc 5-stack reference; Omniverse / Isaac Sim / OptiX / RTX Renderer / Replicator structurally rejected"
