[platform.dataset_substrate]
# ADR-2605241500 — DataLad + git-annex (directory remote) + sidecar IPFS
# pinner for large (10TB+) training/reference/baien datasets. Bytes
# never enter git history; CIDs in 90-docs/baien/datasets.jsonl and PDS
# records (app.etzhayyim.substrate.datasetPin).
adr = "2605241500"
superdataset_path = "90-docs/baien/datasets"
