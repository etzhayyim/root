[[adrs]]
id = "2605264000"
title = "ossekai (御節介) — non-profit religious-corp information-arbitrage elimination + Wellbecoming-nudge artificial-organism actor R0 charter (AT Protocol social-post + feed + @mention first-touch)"
status = "proposed"
status_note = "Sixth-priority gap-closure actor (gap audit row 6 = 情報非対称 / information arbitrage). Artificial-organism Tier-B actor at did:web:ossekai.etzhayyim.com (20-actors/ossekai/) whose dual mandate is (a) AGGREGATE PUBLICATION of societal information asymmetries (public-good intel surface) and (b) OSSEKAI-MODE NUDGE — caring proactive notification to opted-in Adherent SBT members (encrypted private digest per ADR-2605181100) + Council-gated single-touch @mention to non-member companies/individuals on AT Protocol — all delivered via AT Protocol native primitives (NO email / SMTP / commercial CRM at R0-R2). First-touch channel = AT Proto `app.bsky.feed.post` (existing membrane per ADR-2605231902 preserved unchanged) + custom feed generator `feed.ossekai.wellbecoming` + `@mention` to AT Proto handles. Etymology: 御節介 = caring proactive intervention (cultural knife-edge between compassionate-helpfulness and unwelcome-meddling; constitutional discipline structurally pins on caring side). **Constitutional novelty G4 aggregate-first** — anonymized public-feed channel is the DEFAULT mode; targeted dispatch is the SECONDARY mode; silenOssekaiReview.anonAggregateSharePctIntegerHundredths minimum 5000 (≥50.00%) STRUCTURAL schema constraint; the default order MUST NOT be inverted at runtime. Inverts the industry-default (HubSpot / Mailchimp / Salesforce individual-first model) — structural enforcement of Charter §2(c) covert-ops avoidance + Charter §1.4 anti-individualism in information-delivery domain. **AT Proto first-touch resolves seven distinct constitutional tensions** that arise with email-based outreach: (1) vendor CRM data-sovereignty → N/A AT Proto open-spec; (2) signed sender DKIM/SPF/DMARC brittleness → built-in DID-bound + cryptographic signature; (3) 1-click unsubscribe friction RFC 8058 → built-in via app.bsky.graph.block + mute; (4) spam-classifier evasion risk → mooted (Bluesky clients render mute/block transparently); (5) per-jurisdiction email law (GDPR Article 7 / CCPA / CAN-SPAM / APPI 第18条 / LGPD) → largely resolved (AT Proto activity is voluntary publication); (6) dark patterns (urgency / shame / engagement-hacking) → discoverable (every post public + replayable + auditable); (7) auditability of unsent drafts → cleaner (G15 rejection BEFORE composition; no 'unsent draft' record). **Constitutional discipline 15-gate**: G1 Charter Rider §2(a)-(h) scan on every input AND output / G2 yatachain attestation lineage / G3 PASSIVE-ONLY collection (no live DNS/probe/traceroute/WHOIS/RDAP/DoH/handle-enumeration; pre-published archives + voluntary AT Proto activity only per ADR-2605262400) / G4 aggregate-first publication (≥50% aggregate-public-feed by volume quarterly) / G5 NO commercial intel/CRM/marketing software (Salesforce/HubSpot/Marketo/Mailchimp/SendGrid commercial/Constant Contact/Pardot/ZoomInfo/Apollo/Clay/Lemlist/Outreach/SalesLoft/Gong/Chorus/6sense/Cognism/LeadIQ/Drift PROHIBITED per Charter Rider §2(e) anti-gatekeeping + §2(c) vendor data-sovereignty) / G6 NO dark patterns (AT Proto native mute/block/quote-block honored at projection layer G15) / G7 rate limit hard-coded (non-member ≤1/90d/handle; member ≤1 digest/week + ≤1 ad-hoc/month default) / G8 encrypted envelope MANDATORY for member digest per ADR-2605181100 / G9 signed sender DID transparent (did:web:ossekai.etzhayyim.com + cryptographic signature) / G10 Wellbecoming-positive framing only (Charter §1.13; framing-audit attestation in every advisory) / G11 anti-individualism (Charter §1.4; community + multi-gen context preferred) / G12 Murakumo-only inference per ADR-2605215000 / G13 Council Lv6+ ≥3 attestation for non-member @mention campaign (≥4 if campaignSize>50) / G14 silenOssekaiReview quarterly audit / G15 AT Proto native mute/block honored at projection layer (mention_dispatcher rejects dispatch BEFORE composing post; the post never enters MST). **8 cells** under 20-actors/magatama/cells/ossekai_*/ (R0 path-reserved, import-time RuntimeError; issachar Murakumo node): arbitrage_observer (continuous heartbeat; sensor consume) + intel_analyzer (joucho-cadence; framing audit) + aggregate_publisher (hourly; AT Proto feed-post DEFAULT) + member_digest (weekly; encrypted envelope) + mention_dispatcher (event; Council attestation gated) + consent_registry (continuous; AT Proto block/mute ingest) + kaizen_observer (quarterly; KaizenObserverCell pattern per ADR-2605240200) + emergency_advisory (event; kazaori cross-actor). **9 Lexicons** under app.etzhayyim.ossekai.*: arbitrageGapReport (G3 STRUCTURAL passive-only attested + G1 Charter Rider scan pass const true) + wellbecomingAdvisory (G10 framingAuditPass const true + G11 audienceShareDistribution required + crossActorCitation for UPL/medical/financial/pharma/diagnostic/emergency boundary) + feedPostAttestation (G9 senderDidConst const did:web:ossekai.etzhayyim.com + G15 muteBlockCheckPass const true) + memberDigestSubscription (per-category granularity; cadence default weekly) + memberDigestRecord (G8 STRUCTURAL encryptedPayloadCid REQUIRED) + mentionDispatchAttestation (G13 STRUCTURAL attestingCouncilDids minLength 3; ≥4 enforced at consumer if campaignSize>50; G7 rateLimitWindowAttested const true) + externalMentionConsent (G6 per-category granularity + ≤365-day expiry default + revocable any time) + unsubscribeRecord (G15 STRUCTURAL effectiveImmediatelyAttested const true; ingests AT Proto app.bsky.graph.block + app.bsky.graph.mute) + silenOssekaiReview (G4 anonAggregateSharePctIntegerHundredths minimum 5000 + G5 commercialIntelCrmSoftwarePenetrationPct const 0 + G10 framingAuditWellbecomingPreservationCompliant const true + G14 councilAttestations minLength 3 + G15 reEngagementAfterOptOutCount const 0 — critical: any nonzero count triggers chigiri.disputeMediation + immediate cell halt). **12 non-goals N1..N12**: N1 NOT email-based outreach at R0-R2 (AT Proto first-touch only; email-bridge to AT Proto DM for opted-in members is R3+ Council Lv7+ unanimity; non-member email contact permanently prohibited at this charter level) + N2 NOT surveillance/OSINT-for-hire/private-detective service + N3 NOT marketing automation/growth-hacking/viral-loop engineering + N4 NOT corporate intelligence-for-hire/competitive intel/industrial espionage + N5 NOT social pressure/public shaming/vigilante coordination + N6 NOT lobbying/political campaign mailing + N7 NOT commercial outreach/upsell/affiliate + N8 NOT credit-score/financial-blacklist/debt-collection + N9 NOT match-making/dating + N10 NOT recruitment/headhunting/employment-targeting + N11 NOT children-targeted (manabi G3 anti-dependency parallel) + N12 NOT chigiri/legal-threat proxy/Transparent-Force proxy/excommunication-procedure proxy. **4-phase R0..R3**: R0 this commit / R1 post-Council ratify + e7m-dataset Tier-A foundations + legal-foundations-r1 recipe + chigiri R1 active (UPL boundary) + iyashi R1 active (medical boundary) + custom feed generator feed.ossekai.wellbecoming live; ≤100 advisories/week / R2 +30-day public objection + first silenOssekaiReview + ≥1 cross-actor advisory cycle; +member_digest ≤500 opt-in members + mention_dispatcher Council Lv6+ ≥3 gate live ≤50 non-member handles/quarter + consent_registry AT Proto block/mute ingest live / R3 Council Lv7+ unanimity + multi-juris consent compliance (JP 個人情報保護法 第27条 + GDPR Article 7 + APPI 第18条 + CCPA opt-out + Brazil LGPD + CAN-SPAM honest-sender all attested by chigiri R3+) + ≥4 consecutive silenOssekaiReview G14-compliant cycles; +kaizen_observer 6 new rules R12..R17 + emergency_advisory kazaori cross-actor; ≤5000 opt-in members + ≤200 non-member handles/quarter cumulative."
