mmsheaf_v3_ternary + 70-tools/scripts/bench/mmsheaf-microbench. **Phase plan**: R0 ADR + registry (this wave); R1 V1-V4 + synthetic bench replicate ≥+10% over GCN; R2 Ele-Fashion replicate ≥85.5%±1.0; R3 feed-discover production + V3 ternary checkpoint ≤2GB; R4 baien-federated R2+ extension via WebGPU LoRA on restriction maps (separate ADR). Each R-phase requires its own ADR. **New runtime dep**: PyG (torch_geometric ≥2.5) — ROCm wheel availability requires R1 PoC verification. **Reported paper baselines** (replication targets): MMSheafV4 86.14% > DiagSheaf 85.58% > MLP 84.98% > SAGE 84.41% > MMGCN 82.39% on Ele-Fashion (97 766 nodes, ViT+T5, 12 classes, homophily 0.7675); synthetic +5%–+31% absolute over GCN/GAT across all configurations."
