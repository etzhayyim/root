title = "suki (鋤) — Farm Tractor Manufacturing Tier-B Actor R0 Scaffold"
status = "proposed"
status_note = "Master charter establishing suki (鋤, plow; foundational agricultural artisan tool; silicon iwakura 磐座 / fuigo 鞴 / igata 鋳型 / kanayama 金山 naming series) as Tier-B religious-corp first-party **farm tractor manufacturing** actor. **Manufacturing-side counterpart of mitsuho operator-side (ADR-2605261015)** — parallel to sarutahiko↔wadachi (truck) sibling pattern. Methodology source = YouTube `aSmoLQKdX9E` 'Inside Ultra-Modern European Factories Building Massive Farm Tractors From Scratch' (Fendt/AGCO/Claas/Massey Ferguson/Valtra/Deutz-Fahr/Same/Kubota EU/Case IH/New Holland/John Deere EU class); manufacturing methodology adopted; **John Deere-class DRM ECU + dealer-locked diagnostics + patent-locked seed integration + mega-farm consolidation + fossil-fuel-only powertrain + surveillance hardware integration all explicitly rejected per §2(b) + §2(c) + §2(e) + §2(g) + §1.13**. R0 scope = farm tractor assembly (~50-200 hp Wave 1; community-scale farming target; mega-tractor ≥400 hp = N3 post-R3 + Council Lv6+ supermajority). **14 constitutional gates G1..G14 + 12 non-goals N1..N12** (sarutahiko + tsutae density). **Religious-corp first explicit Right-to-Repair constitutional first-class invariant at firmware level**: G10 = no software lockouts requiring dealer authorization + replacement parts catalogued openly + ECU re-flash on parts swap NOT manufacturer-gated + diagnostic codes interpretable from open docs. Combined with tsutae G3 (device-level R2R: modular hardware + iFixit ≥9/10) = **dual-layer R2R constitutional** (tsutae G3 hardware + suki G10 firmware). N4 = closed ECU / proprietary CAN bus DRM / dealer-locked diagnostics / John Deere-style software lockout NEVER. N5 = patent-locked seed integration (John Deere SeedStar) NEVER (mitsuho G2 seed sovereignty alignment). Other key gates: G7 fuel transition R0/R1 B100 biodiesel + diesel hybrid → R2+ LFP / H₂ / methanol fuel-cell only (sarutahiko G7 parallel; religious-corp 2nd declared phase-gate fuel transition); G9 open ECU + open CAN bus (ISOBUS / ISO 11783 open) + open hydraulic + open implement-detection; G3 modular Cat I/II/III 3-point hitch + PTO 540/1000 RPM (ISO 730 + ISO 500); G12 KPI cap Wave 1 ≤200 hp / road ≤40 km/h / field ≤15 km/h / **autonomous ≤ SAE J3016 Level 3 (Level 5 = N6 NEVER farmer-land-relationship preservation)**; G14 every tractor = open VIN + per-vehicle DID + IPFS-pinned BoM + repair-history-ready blockchain + EOL recyclability ≥85% (kanayama loop closure). **9 Pregel cells** (chassis_fabrication naphtali + powertrain_assembly joseph + cab_assembly zebulun + hitch_pto_assembly joseph + paint_finishing simeon + electrical_ecu_load levi + quality_field_test levi + emissions_audit levi + vehicle_attestation_binder judah terminal; sarutahiko 9-cell + judah binder parity). **9 lexicons** (chassisAttestation + powertrainAttestation + cabAttestation + hitchPtoAttestation + paintAttestation + electricalEcuAttestation + fieldTestRecord + emissionsAuditRecord + silenSukiReview). **2 new robotics class reservation** (Norikata 乗り方 SAE Level 3 driver-in-seat public-field test driver R2+ + Kuwa 鍬 precision hitch + PTO assembly R2+ — suki-native) + 6 inherited reuse (Otete-heavy + Mimi-precision + Migaki kanayama + Kasane sarutahiko + Tsutsumi sarutahiko + Akari sarutahiko). Murakumo no-new-node 7-node fleet reuse (sarutahiko parity). 4-phase R0→R3 (R0 scaffold this ADR / R1 benchtop 1-tractor prototype ≤50 hp + B100 biodiesel + Kuwa/Norikata PoC firmware + 5 nodes / R2 pilot ≤10 tractors/year + LFP hybrid 50-150 hp + 30-day public comment + 6 nodes / R3 community-scale ≤100 tractors/year + H₂ fuel-cell + zero tailpipe + 60-day public + cross-actor mitsuho.harvest_robotics + kanayama EoL loop closure + 法務 (道路運送車両法 + 農業機械化促進法) audit + full 7-node fleet). **Cross-actor supply loop**: kanayama Wave 1+2+3 (Al + steel + Cu) → suki (tractor) → mitsuho (field operation) → kanayama (EoL recovery) closes 4-actor agricultural supply chain. Constitutional firsts: (a) religious-corp first explicit RTR constitutional first-class at firmware level + dual-layer R2R with tsutae G3 device level; (b) agricultural constitutional autonomy via 4-actor closed supply loop; (c) manufacturing-side / operator-side sibling pattern stabilized (2nd example after sarutahiko↔wadachi); (d) G7 fuel sunset pattern reused (religious-corp 2nd actor); (e) multi-gen farmer-land-relationship preservation (G12 + N3 + N6). Reserved follow-on slots: R1 = ADR-2605261515 / R2 = ADR-2605261530 / R3 = ADR-2605261545."
