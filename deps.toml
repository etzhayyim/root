status_note = "Scaffolds 70-tools/nvme-disk-inference/ as religious-corp first-party project for MoE × mmap disk inference on Murakumo fleet. Triggered by 2026-05-25 21:30 JST empirical A/B finding: SanDisk USB 3.2 Gen 2 (raw 0.836 GB/s) vs internal AP0256Z NVMe (raw 2.30 GB/s) on Gemma 4 26B-A4B MoE shows generation tok/s 7.9 vs 7.7 = +3% delta despite 2.75× raw bandwidth gap. Steady-state generation is storage-INDEPENDENT because MoE × mmap hot working set (active 9/128 experts × ~100 MB held in 8-10 GB page cache) saturates at ~1.4 GB/s = within both tiers. Disk bandwidth only matters for cold-load first-token latency (~80 sec wall). This finding CORRECTS ADR-2605253000 §5 TB5 SSD speedup prediction (was 1.5-1.85× = 12.5-15.5 tok/s; revised to +3-5% = 8.0-8.8 tok/s steady-state, -50% = ~40 sec cold-load). Project R0 lands: README.md (project authoritative doc) + scripts/cache-flush.sh (14 GB junk write+read, user-space no-sudo) + scripts/bench-storage-tier.sh (A/B protocol per tier: flush → cold llama-cli → capture wall/RSS/page faults/swaps/tok/s to results/) + bench/llama-cli-flags.txt (reference invocation + 3-flag set rationale) + results/baseline-260525.md (initial A/B writeup) + results/{internal,sandisk}-cold-260525-2130.txt (raw bench outputs). R-phase roadmap R0→R5 (R0 scaffold / R1 TB4 enclosure A/B / R2 TB5 + M4 Pro / R3 speculative decoding / R4 Murakumo cell-runner integration / R5 dense model substrate). Constitutional: ADR-2605215000 Murakumo-only + ADR-2605241900 baien edge-target preserved + ADR-2605172000 RW-free boundary unchanged."
