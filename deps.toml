# ─── futawa (二輪) small-displacement motorcycle Tier-B R0 scaffold (ADR-2605261330) ────────

[[adrs]]
id = "2605261330"
title = "futawa (二輪) — Small-Displacement Motorcycle Manufacturing Tier-B Actor R0 Scaffold"
status = "proposed"
status_note = "Master charter establishing futawa (二輪, two-wheel; concrete-noun style mirroring wadachi 轍 wheel-rut) as Tier-B religious-corp first-party small-displacement motorcycle manufacturing actor. Source methodology: YouTube `1xxRYlHY2e8` 'Inside Massive German Factory Building BMW Motorrad Bikes From Scratch' (Berlin Spandau methodology adopted; luxury / premium / ≥500cc / racing-focus / connected-app surveillance retail positioning rejected per §2(e) + §2(c) + §1.13). R0 scope = ≤250cc 4-stroke single-cylinder gasoline OR ≤15kW peak electric; commuter+utility positioning; curb ≤200kg + cargo ≤30kg panniers; full chain frame → engine/motor → drivetrain → harness → suspension+brake → body+paint → final → test → provenance (with hodoki VIN pre-registration). 14 constitutional gates G1..G14 IMMUTABLE R0–R3. **4 constitutional firsts**: (a) **G7 ABS-MANDATORY ≥125cc / electric ≥6kW** — no ABS-delete, no track-only carve-out, no cost-down strip; dual-channel hydraulic; first safety-mandatory-at-build constitutional anchor; elevates EU 168/2013 Annex II to constitutional invariant; §1.13 adherent safety non-negotiable; (b) **G8 BUILD-TIME ANTI-SURVEILLANCE** — NO GPS / NO connected-app / NO telematics / NO V2X / NO proprietary diagnostic-DRM built-in; only passive odometer + safety ECU + optional user-installed-after-purchase open-source GPS module; §2(c) operationalized at build time; **companion to hodoki G8 (EOL data destroy)** — closes §2(c) anti-surveillance loop across full vehicle lifecycle; (c) **G12 RIGHT-TO-REPAIR FORWARD-PUBLISHING** — every new vehicle ships with IPFS-pinned full parts catalog + CAD source + firmware source + service manual + open diagnostic protocol at manufacture time; no proprietary lock-in; no anti-DRM; no warranty void on user repair; part discontinuation prohibited 30 years post-launch; §2(e) operationalized at build time; **companion to hodoki G12 (EOL parts catalog)** — closes right-to-repair loop across full vehicle lifecycle; (d) **G14 30-YEAR MINIMUM design service life** — frame + engine + transmission + motor + structural suspension designed for 30yr fatigue/corrosion/wear; mandatory parts availability 30yr post-discontinue; planned obsolescence prohibited; firmware 30-year update commitment; §1.13 wellbecoming applied to durable goods. Other gates: G1 CAD + firmware + fixture open-source / G2 mass-balance ≥98% closure (inherits kanayama + hodoki) / G3 ≥2-robot witness quorum on frame weld + engine + brake torque / G4 bilingual owner+service manual+parts catalog / G5 Charter §2(a-h) paint artwork scan (no military / licensed-IP / addictive-thrill / racing-glorification) / G6 sound ≤80 dB @ 7.5m (UN-ECE R41) no loud-exhaust enablement / G9 Murakumo no-VKE inference / G10 SBT-gated hot work + brake + paint + battery / G11 KPI caps ≤250cc/≤15kW/≤200kg curb (N5 ≥500cc / N9 H2 FCV = Wave 2 ADR) / G13 cross-actor circular feed (VIN pre-registered with hodoki at production; ≥10% recycled-content kanayama-via-hodoki by R3; hikari R2+ Li-ion second-life SoH ≥85% for electric). 10 non-goals N1..N10: N1 軍用 / N2 ≥500cc / N3 racing+track / N4 luxury+licensed-IP / N5 connected-app+telematics+GPS+V2X+cloud-ECU built-in / N6 trikes+sidecars+ATV / N7 純人力+e-bike (Wave 2) / N8 aftermarket loud-exhaust+street-illegal mods / N9 H2 FCV / N10 surveillance-tier touring. 5-layer motorcycle assembly process (L1 frame welding on naphtali + Tsugite witness / L2a engine ≤250cc/≤15kW on joseph / L2b drivetrain on zebulun / L3a harness + ECU on simeon with G8 negative audit / L3b suspension+brake on dan with G7 ABS verification / L4 body+paint on simeon with G5 Charter+Suri robot / L5a final assembly on dan with G12 parts catalog publish + G13 hodoki VIN pre-reg / L5b dyno+emissions+sound+ABS+road on levi / terminal provenance binder on judah). 9 Pregel cells (moto_frame_welding + moto_engine_assembly + moto_drivetrain_assembly + moto_electrical_harness + moto_suspension_brake + moto_body_paint + moto_final_assembly + moto_test_dyno_road + moto_provenance_binder — all import-time RuntimeError; smoke test 9/9 pass). 8 lexicons (`app.etzhayyim.futawa.{frameAttestation, engineAttestation, electricalAttestation, paintAttestation, vehicleLotAttestation, testRecord, partsCatalog, silenMobilityReview}`; JSON 8/8 valid). 2 new robotics class reservation (Tsugite 継ぎ手 welding-joint robot TIG/MIG vision-guided R1+ / Suri 摺 paint-sprayer robot electrostatic+HVLP R1+) + 5 inherited reuse (Yokin kanayama R2+ engine block + Otete + Mimi + Quad + Tokike hodoki bolt-down). Murakumo no-new-node 7-node fleet reuse only (naphtali/joseph/zebulun/simeon/dan/levi/judah). 4-phase roadmap R0→R3 (R0 scaffold / R1 benchtop ≤1 vehicle + Tsugite+Suri prototypes + first IPFS parts catalog publication + hodoki handshake; motorcycle engineer SME + ABS calibration SME / R2 pilot ≤10/month + tatekata-shared shop + ≥5 model variants catalog live + hodoki pre-reg operational + 30-day public comment / R3 community-scale ≤500/month + ≥10% recycled content via hodoki+kanayama + 30-year service-life commitment registry + 60-day public review). **Cross-lifecycle invariants (futawa build-side ↔ hodoki EOL-side)**: G8 build (NO surveillance built-in) ↔ G8 EOL (data destroy before disassembly) = §2(c) loop closed; G12 build (parts catalog at manufacture) ↔ G12 EOL (parts catalog at scrap) = §2(e) loop closed; G13 build (VIN pre-reg with hodoki) ↔ G13 EOL (≥95% material recovery) = §2(h) circular loop closed. Tier-B sibling of wadachi / hodoki / kanayama / makura / kuni-umi / yakushi / watatsumi / tatekata / mitsuho / hagukumi."
path = "90-docs/adr/2605261330-futawa-motorcycle-tier-b-actor-r0.md"

