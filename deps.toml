title = "Baien ameno per-kernel inference R0 — WGSL BitLinear + WASM SIMD ternary (bitnet.cpp API mirror)"
status = "proposed"
status_note = "Closes the kernel-level gap left open by ADR-2605092350 §4 (browser runtime kernel table) and ADR-2605190824 (3-kernel axis: webgpu / wasm-ternary / mediapipe-gpu). Until this lands, baien-bitnet-2b in ameno runs as bf16-as-fp16 through transformers.js ORT-Web default EP — the ternary structure is wasted at edge. R0 = ADR + path-reserved Rust crate (40-engine/baien-wasm-ternary/) + ameno WGSL kernel sources (BitLinear forward + i2_s → f16 dequant) + bitnet-bridge.ts (WASM module loader + typed wrapper) + dispatcher (probeBitnetBackend ladder: webgpu-bitlinear → wasm-ternary-simd → wasm-ternary-scalar → fp16-fallback). 14 gates G1..G14 + 12 non-goals N1..N12. R1a = isolated WGSL kernel numeric test (±1 ULP fp16 vs scalar reference). R1b = transformers.js layer-replacement bridge (end-to-end token generation). R1c = v128 SIMD inner loop + wasm-bindgen pointer marshalling + LUT-expanded matmul. R2 = modality encoder kernels (SigLIP / Whisper-tiny / YAMNet). bitnet.cpp public API mirrored at the kernel-task level ONLY (ggml_bitnet_init / ggml_bitnet_can_mul_mat / ggml_bitnet_mul_mat_task_compute / ggml_bitnet_transform_tensor / ggml_bitnet_get_type_traits + GGML_TYPE_I2_S=40 + i2_s 2-bit-signed layout 4-weights-per-byte little-endian); llama-wrapper layer NOT mirrored (ameno owns load+tokenize via transformers.js). Clean-room Rust re-impl, NOT a vendored fork (per CLAUDE.md `Do not add Charter Rider to 3rd-party vendored code` rule). API names used under Google v. Oracle 2021 fair use, same posture as kami-engine nv-compat layer per ADR-2605261800 §D11. Edge invariant per ADR-2605241900: ≤4B trunk, ≤2GB @4k ctx, ≤2.5GB @16k ctx, WASM-32 + iPhone 12+ + Android 4GB; current path's bf16-expansion at load time pushes ~3.4GB peak on iPhone 12 = silent G1 violation that R1c closes. Murakumo-only inference (ADR-2605215000) unaffected — this is edge browser inference, not server."
path = "90-docs/adr/2605263300-baien-ameno-per-kernel-inference-r0.md"

