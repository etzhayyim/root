[[adrs]]
id = "2605231400"
title = "karute consent capability + iryo billing bridge"
status = "proposed"
status_note = "Closes the substrate hop between etzhayyim (PHI custody, USDC self-pay) and vendor iryo.gftd.ai (RisingWave + Stripe + DPC/DRG insurance billing) without weakening the 3-axis-split rule (ADR-2605172400). Introduces `app.etzhayyim.consent.capability` — an Ed25519-signed delegation token (granter/grantee/purpose/scope/expiresAt/constraints) stored as a public AT Protocol record in the granter's PDS. 6 purpose values (insurance-billing / second-opinion / data-portability / research-deidentified / emergency-disclosure / legal-disclosure). XRPC surface (4): grantConsent / revokeConsent / listConsent / requestIryoBilling. Actor manifest pipelines added for all 4. PatientPortalView grant/revoke UI integrated. Single primitive serves clinician-peer second opinion, vendor billing bridge, patient-initiated portability, research opt-in. Constitutional guarantees preserved: vendor calls remain progressive enhancement; substrate boundary unchanged; capability metadata public (signature verifiable) but record ciphertext still requires key-wrap. Revocation observable but not retroactive — mitigated by audit webhook + downstream-redistribution constraint."
path = "90-docs/adr/2605231400-karute-consent-capability-iryo-bridge.md"

[[adrs]]
id = "2605231603"
title = "Per-record rekey + tombstone protocol"
status = "proposed"
status_note = "Closes ADR-2605181100 §5.3 (group rekey on member removal) + §5.4 (forward-secrecy follow-up) for the etzhayyim substrate. Introduces `app.etzhayyim.encrypted.tombstone` — an Ed25519-signed record that binds prior↔successor envelope CIDs (3 kinds: `rekey`/`redact`/`sealed`) with 3 scopes (`single-record`/`channel-window`/`group-rekey`). Karute XRPC surface (3): `rekeyRecord` / `redactRecord` / `listTombstones`. Logical-present view algorithm specified for consumers. Consent-revocation-flush protocol formalized — `revokeConsent` triggers automated rekey of every envelope whose key-wrap set included the revoked grantee. Forward secrecy guarantee: new readers cannot decrypt prior records under rekey'd keys. Limitation acknowledged: cached-key recipients retain access to historical ciphertext (fundamental cryptographic limit — mitigated by contractual obligation + audit webhook event flow). Charter-authorized override path exists for `regulator-order` reason."
path = "90-docs/adr/2605231603-per-record-rekey-tombstone-protocol.md"

[[adrs]]
id = "2605231700"
title = "Audit webhook subsystem (constitutional observability)"
status = "proposed"
status_note = "Closes the consent observability gap from ADR-2605231400 §'Revocation semantics' + ADR-2605231603 §'Audit emission'. Introduces `app.etzhayyim.audit.event` — a typed, PHI-free, Ed25519-signed, hash-chained event record written to the subject's PDS (typically the patient). 13 eventType values cover consent.{granted,revoked,invoked,expired} / encrypted.{write,read,keyWrap.issued,keyWrap.refused} / tombstone.{rekey,redact,sealed} / billing.{requested,claim.statusChanged} / phi.guard.violation. `auditChainPrev` forms a per-(actor, subject) hash chain detecting silent omission. Per-(subject) timeline aggregates events from every actor that touches their data, enabling clinician-licensure board / regulator subpoena patterns. Karute XRPC `listAuditEvents` exposes the timeline. PatientPortalView audit-log card displays the feed. Events are public-within-subject-PDS by design — PHI-aware redaction deferred to Phase 4."
path = "90-docs/adr/2605231700-audit-webhook-subsystem.md"

[[adrs]]
id = "2605231900"
title = "karute deployment topology — DID Worker + LangServer Pod + CF Pages"
status = "proposed"
status_note = "Operationalizes karute (ADR-2605231100/1400/1603/1700) by specifying the concrete CF Worker + k3s Pod + CF Tunnel + CF Pages layout. Single public origin `karute.etzhayyim.com` resolves three concerns: `/.well-known/did.json` (DID Document, served by karute-did-web Worker), `/xrpc/*` (proxied to lg-karute Pod via CF Tunnel `karu7t3e.etzhayyim.com`), and `/*` (Svelte SuperApp static bundle on CF Pages). lg-karute Pod uses the 2-container ADR-2605171800 pattern (Python langgraph server + TS @etzhayyim/sdk-checkpointer sidecar) with PHI sealing mandatory (ETZ_CHECKPOINTER_ENCRYPT_CELLS=did:web:karute.etzhayyim.com). PVC 16Gi ReadWriteOnce Retain. Pregel module ships as Phase 1 stub at `pymagatama.projects.karute.pregel:app` — 31-pipeline StateGraph that mirrors actor-manifest.jsonld nodes; every node returns `{status: stub}` until substrate seams wire in Phase 3. ALSO provisions `did:web:audit.etzhayyim.com` DID Worker (closes ADR-2605231700 substrate-wide audit-target gap — every actor's emission step now has a real target). End-to-end deploy: `50-infra/karute-deploy.sh` orchestrates 6 stages (did-worker / audit-worker / k8s-pod / cf-tunnel / pages-deploy / smoke) with idempotent --only flags."
path = "90-docs/adr/2605231900-karute-deployment-topology.md"

[[adrs]]
id = "2605232000"
title = "Agent-led autonomous deploy — e7m actor + e7m agent-token + capability-gated authority"
status = "proposed"
status_note = "Closes the 'how does an autonomous agent actually deploy a new actor?' gap. (1) Declarative `actor.toml` per actor — read by `gftd actor deploy --actor <name>` (Go implementation in 70-tools/etzhayyim-cli/actor.go). Stages typed (cf-worker / cf-pages / k8s / docker-build / cf-tunnel / cmd / smoke) with `require_cap` scope NSIDs. (2) `gftd agent-token --lxm <nsid> --ttl <sec>` mints Ed25519-signed JWS (single scope per token, max TTL 3600s); signing key from macOS Keychain or --key-file. (3) `app.etzhayyim.consent.capability` purpose enum extended with `deploy-execution` — Steward issues a 24h capability binding agent DID to a scope set; e7m actor deploy gates each stage against the capability. 3-tier credential model: T1 cloud-provider creds (CF API token / GHCR PAT / k8s context, long-lived from 1Password), T2 deploy capability (hours-to-day, PDS record, revocable), T3 scoped per-call JWS (60-300s, in-memory). Every stage emits a `DEPLOY_EVENT` audit row (Phase 1: stderr structured JSON; Phase 2: POST to audit.etzhayyim.com aggregator). Smoke verified: `gftd actor deploy --actor karute --dry-run --only pages-build` parses actor.toml, evaluates the stage, emits DEPLOY_EVENT, completes. JWT mint verified: `gftd agent-token --lxm deploy.cfWorker:karute-did-web --ttl 300 --key-file test.b64` produces a valid Ed25519 JWS decodable by the standard `jwt`/`jose` libraries. 2 new lexicons (app.etzhayyim.deploy.agentToken, app.etzhayyim.deploy.deployEvent)."
path = "90-docs/adr/2605232000-agent-led-autonomous-deploy.md"

