[[adrs]]
id = "2605232300"
title = "yatachain — engine architecture options exploration (Hummock fork / RW fork / GraphAr+MV no-fork)"
status = "proposed"
authoritative = false
status_note = "EXPLORATORY ONLY — NOT ADOPTED. Captures numerical comparison of 4 options for the yatachain projection engine layer: (A) Hummock fork as yata-slate (150-230K new LOC, 44-67 person-months, completion risk 50%, strategic independence ★★★), (B) RisingWave full fork as yata-wave (57-99K new LOC, 20-29 person-months, completion risk 85%, strategic independence ★), (D) RW upstream + Apache GraphAr + MV with no fork — 'yatabase' configuration (30-50K new LOC, 20-32 person-months, completion risk 90-95%, strategic independence ★★, 7-axis weighted score 8.4/10 = numerically dominant). (C) SlateDB fork rejected early — pure KV LSM lacks Pregel epoch semantics required for LangGraph super-step / Hummock barrier isomorphism. (E) Lance dropped per user direction. Bulk graph frameworks surveyed and triaged: Apache Giraph ✗ dormant, Spark GraphX ✗ deprecated, Spark GraphFrames △ overkill, Apache HAMA ✗ Attic, NVIDIA cuGraph ✗ CUDA-only (Mac Silicon incompatible), GraphScope △ Stage-2 candidate via GraphAr external connection, timely-dataflow △ research, Materialize ✗ BSL incompatible with Charter Rider. 5 strategic findings recorded: (1) Hummock epoch = LangGraph Pregel super-step internal isomorphism, (2) Mac Silicon unified memory forces CPU/GPU per-node co-location not either/or, (3) data sovereignty achievable without engine fork via GraphAr/Parquet open format, (4) GraphAr append-only chunk semantics integrate with MST immutability, (5) options compose evolutionary D→D+plugin→D+B-partial→A across 2026-2029+. 7 open questions deferred (GraphAr religious-corp extension upstream contribution, witness quorum + GraphAr chunk hash unification, Arrow Flight UDF server topology for 18,345 agents, GraphQL Subscription / barrier alignment, MLX production stability benchmark, Lance re-introduction conditions, Solidity Base L2 event → RW source connector). Decision deferred pending: Council 5-of-7 multisig (post-2026-06-19), GraphAr Apache Incubator graduation outlook, Mac Silicon MLX production benchmark, religious-corp constitutional weight on engine ownership vs format ownership. Future decision ADR will reference this as input."
path = "90-docs/adr/2605232300-yatachain-engine-options-exploration.md"

[[adrs]]
id = "2605241500"
title = "etzhayyim Dataset CID Substrate — DataLad + git-annex (directory remote) + sidecar IPFS pinner, CIDs anchored as datasetPin records on PDS"
status = "proposed"
status_note = "Defines how the monorepo references large (10TB+) training / reference / baien datasets without putting bytes in git. Six layers: (1) DataLad superdataset at 90-docs/baien/datasets/ — pointers + provenance commits; (2) git-annex SHA256E catalog; (3) `directory` special remote `local-store` at ${ETZ_DATASET_ROOT}/annex-store/<subdataset>/ — bytes at rest on a per-machine external volume; (4) sidecar IPFS pinner (`e7m-dataset publish-ipfs`) walks the directory remote, runs Kubo `/api/v0/add` per annex object, composes a SHA256E-key → IPFS-CID map JSON, pins the map and returns its root CID; (5) Kubo data root co-located on the same volume — substrate-compliant distribution layer; (6) app.etzhayyim.substrate.datasetPin records on PDS — religious-corp-canonical receipt. The `type=external externaltype=ipfs` route is deliberately NOT taken because every in-the-wild `git-annex-remote-ipfs` returns FAILURE for CHECKPRESENT / REMOVE; the sidecar pinner sidesteps that class of failure. Phase 1 smoke (2026-05-24 JST) verified end-to-end: 2 random blobs → annex add → copy --to local-store → publish-ipfs → map CID `bafkreiep2df7htkfdkzamahpbr6gmqatmkfxth2fzl3nmizd2ksldf5z2q` round-trip; per-entry `ipfs cat` returned bytes with matching SHA-256 on the deciding Mac (volume `/Volumes/260317`, Kubo peer `12D3KooWGRn…`). Follow-ups: HF `add` flow, real PDS emit (currently dry-run), SHA256E backend default (smoke used DataLad's text2git default of MD5E), Charter Rider scanner availability (currently warn-only when pymagatama unimportable; tighten with ETZ_DATASET_CHARTER_STRICT=1), second always-on replica."
path = "90-docs/adr/2605241500-etzhayyim-dataset-cid-substrate.md"
depends_on = ["2605170900", "2605171800", "2605172000", "2605192200"]
related = ["2605231300", "2605232500"]

[[adrs]]
id = "2605232400"
title = "yatachain Tier D blob primitive + gsplat IPFS swap + yoro substrate-facade closure"
status = "active"
status_note = "Closes the last two substrate-boundary gaps that survived the 2026-05-23 yatachain wave. (1) Adds a cross-language Tier D blob upload primitive — `Etzhayyim.uploadBlob({data, mediaType?})` in `@etzhayyim/sdk` (TS, wraps the existing `pinBlob` against Kubo `/api/v0/add?pin=true&cid-version=1`) and `Etzhayyim.upload_blob(data, media_type=?)` in `pymagatama.substrate` (Python, httpx multipart) — with a bit-identical `{cid,sizeBytes,mediaType}` receipt shape and 7 vitest + 6 pytest covering empty-payload / missing-apiUrl rejection / NDJSON last-line parsing / 5xx surfacing / mediaType default + Blob.type derivation / trailing-slash normalisation. (2) Wires the primitive through `60-apps/ai-gftd-project-maps/bulk-ingest/workers/gsplat_train_dumper.py` via a new `_blob_upload` / `_blob_download` dispatch behind `USE_PYMAGATAMA_SUBSTRATE_BLOB=1` — train side pins PLY (and GLB on the bake path) through `pymagatama.substrate.upload_blob` and writes `ipfs://{cid}` URIs into `vertex_maps_gsplat_{asset,mesh}.b2_key` instead of B2 keys; bake side branches on the `ipfs://` scheme via Kubo `/api/v0/cat`; the legacy B2 path stays bit-for-bit identical when the flag is off so blue/green cutover is non-disruptive. Boot guard relaxed: `B2_*` becomes optional when the flag is set, replaced by `ETZ_IPFS_API_URL` requirement. (3) Completes the yoro `@atproto/api` → `@etzhayyim/sdk/atproto` facade migration — 6 callsites rewritten (lib/atproto-agent.ts, lib/superapp/messaging-client.ts, lib/translate/client.ts, lib/mcp/client.ts, lib/actor/ActorEmbed.svelte, routes/moderation/blocked-accounts/+page.svelte); `@etzhayyim/sdk` added as a workspace dependency on `60-apps/ai-gftd-project-yoro/appview/yoro-ui-g00h5zto/svelte/package.json`; `pnpm check:ts` clean. SDK test count: 111 → 118 (+7 vitest), pymagatama.substrate 18 → 24 (+6 pytest). Tier A + Tier B + Tier D are now end-to-end SDK-mediated; Tier C / projection remains the ADR-2605222330 carve-out until the projection-sweep ADR ships. Backfill of existing B2 blobs into IPFS pins and the browser-side gsplat loader URL swap remain follow-ups in maps MIGRATION-TODO Phase 2."
path = "90-docs/adr/2605232400-yatachain-tier-d-blob-substrate-closure.md"
depends_on = ["2605172000", "2605231400", "2605231500", "2605241500"]
related = ["2605171800", "2605231525"]

[[adrs]]
id = "2605231737"
title = "e7m PDS / yoro substrate probes — operator + MCP surface for timeline-class debugging"
status = "active"
status_note = "Closes the 'how does the operator (or an agent) debug yoro timeline-class failures through a sanctioned surface' gap that surfaced during the 2026-05-23 timeline-load incident. Three root causes diagnosed by ad-hoc curl + grep + wrangler: (1) deployed yoro-ui bundle's minified `atQuery` emitted POST for every XRPC because the source fix had not been rebuilt — patched in-place on static/assets/index-KYx0b32R.js (`Rf(\"POST\",t,a,void 0,o)` → `Rf(\"GET\",t,void 0,a,o)`, 1-byte diff) and redeployed as magatama-yoro Version a054ad4d-f5d7-4803-8a0d-7cac4a727685; (2) rw-free `collectFeed` 500'd with `Could not find repo: did:web:yoro.etzhayyim.com` because the configured pds.etzhayyim.com has no repo for that DID — try/catch added to return empty feed instead of 500, redeployed as yoro-xrpc-adapter Version a60f975d-a578-429e-bc26-3a42de1aa7fe; (3) no sanctioned operator surface existed for any of the probes — closed by this ADR. Adds to 70-tools/e7m (Python operator CLI + MCP server): `e7m pds describe-server | list-repos | describe-repo | resolve-handle | xrpc | create-account` and `e7m yoro probe` (composite). Host aliases: atproto | pds | yoro | apex, or full URL. 6 new MCP tools exposed via e7m-mcp; the write-class `create-account` is intentionally CLI-only (mirrors the prune_approve carve-out — substrate mutation stays operator-attributed). `e7m pds xrpc` POST to non-safelisted NSIDs requires explicit `--allow-write`. Smoke verified: `e7m --json yoro probe` returns ok=true with 5 checks after today's fixes; MCP round-trip (initialize → tools/list → tools/call etzhayyim_yoro_probe) returns 22 tools total (16 baseline + 6 new) and runs the probe end-to-end. Wheel build verified via `uv build --wheel`. Implementation: new e7m/src/e7m/pds.py (~270 lines, httpx-based) + thin wrappers in commands.py + subcommand wiring in __main__.py + tool entries in mcp_server.py. Downstream `did:web:yoro.etzhayyim.com` PDS seed is now a one-liner `e7m pds create-account --host pds --handle yoro.etzhayyim.com --did did:web:yoro.etzhayyim.com --invite <CODE>` blocked on operator obtaining the invite code (correct boundary)."
path = "90-docs/adr/2605231737-e7m-pds-yoro-substrate-probes.md"
depends_on = ["2605172000", "2605192100", "2605211000"]
related = ["2605222330", "2605211000"]

