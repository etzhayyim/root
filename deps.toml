# ─── Mac mini M4 16GB Gemma 4 26B-A4B MoE NVMe disk inference (ADR-2605253000) ──

[[adrs]]
id = "2605253000"
title = "Mac mini M4 16GB で Gemma 4 26B-A4B MoE を NVMe disk inference で動作確認"
status = "accepted"
status_note = "Empirically verified that gemma-4-26B-A4B-it-UD-Q3_K_M.gguf (12 GB on disk, Unsloth Dynamic Q3_K_M) runs at 8.4 tok/s generation on Mac mini M4 base 16GB via llama.cpp b9290 with `-ngl 0 -c 2048 -fa 1 -ctk q8_0 -ctv q8_0 -t 4 -no-cnv -st --simple-io < /dev/null`. MoE × mmap synergy validated: only 8/128 experts + shared touched per token → working set ~15% of dense → mmap page cache hit rate enables disk paging at usable throughput. Peak RSS 8.5 GB (12 GB model only ~70% resident), 2.3M page faults, 0 swaps when idle-wait avoided. Failed paths recorded: (1) Metal full offload `-ngl 99` → res=-3 (12.7 GB working set exceeded), (2) Metal partial `-ngl 4..16` → same OOM (gemma4 MoE expert tensors not Metal/CPU splittable), (3) `--no-conversation` alone insufficient → gemma4 chat template forces interactive mode, 3-flag set `-no-cnv -st --simple-io < /dev/null` mandatory. Constitutional: ADR-2605215000 Murakumo-only compliant (no commercial GPU rental), ADR-2605241900 baien edge-target untouched (fleet-side path only, iPhone/Android/WASM-32 trunk still ≤4B BitNet 1.58). TB5 SSD speedup prediction: 1.5-1.85× → 12.5-15.5 tok/s (current 92% disk-bound; M4 compute ceiling ~105 tok/s assuming 4 P-core × 200 GFLOPS FP16; TB5 enclosures real-world 6.0-6.4 GB/s vs internal 3.1 GB/s = ~2× raw bandwidth)."
path = "90-docs/adr/2605253000-mac-mini-m4-16gb-gemma4-26b-moe-disk-inference.md"

