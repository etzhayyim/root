[[adrs]]
id = "2605260000"
title = "L5 Gov Auth — DID-primary identity + MyNumber opt-in binding + WebAuthn platform authenticator"
status = "proposed"
status_note = "Master charter operationalizing the authentication layer of L5 routing-around ladder (ADR-2605250100/200/300). DID-primary identity model with optional trust-elevation credentials (MyNumber card IC chip binding + WebAuthn FaceID/TouchID/Windows Hello). Trust Level 1 = DID + WebAuthn platform authenticator only. Trust Level 2 = Trust Level 1 + MyNumber IC binding (XChaCha20-encrypted, Signal-wrapped per-recipient keys per ADR-2605181100). One-way read of MyNumber (Web NFC local processing only; no state database interaction) is consistent with §0.4 non-registration. Plaintext credentials encrypted at rest (ADR-2605181100 XChaCha20 mandatory). Public attestation contains no PII (blake2b_256 DID hash only). 3 lexicons (credentialBinding + didTrustAttestation + webauthnChallenge) + 2 Pregel cells (gov_auth_mynumber_bind + gov_auth_trust_attestation). All cells R0 scaffold with import-time RuntimeError; full implementation deferred to R1 ADR-2605260100 (post-Council bootstrap 2026-06-19). ADR-2605250100 §4 Boundary 4 revised to permit opt-in MyNumber binding."
path = "90-docs/adr/2605260000-l5-gov-auth-mynumber-webauthn.md"

