# ─── baien ameno ONNX graph layer-replacement R1b (ADR-2605263700) ──

[[adrs]]
id = "2605263700"
title = "Baien ameno ONNX graph layer-replacement R1b — transformers.js MatMul → BitLinear interceptor + end-to-end token gen"
status = "proposed-scoping-only"
status_note = "R1b of the R-roadmap pinned by ADR-2605263300 §10. First R-step that produces user-observable behaviour change — closes the silent ADR-2605241900 §G1 violation that has been open since baien-bitnet-2b landed in ameno on 2026-05-09 (current load-time bf16 expansion pushes ~3.4 GB peak on iPhone 12, exceeding the ≤2 GB @ 4 k ctx ceiling). 5 harness candidates evaluated: (A) offline ONNX rewrite + forked HF model — rejected ops burden / (B) in-browser ONNX rewrite — CHOSEN for encode/prefill / (C) ORT-Web custom op WASM EP only — rejected loses webgpu-bitlinear / (D) full transformers.js forward override — CHOSEN for decode-step (where throughput win lives) / (E) patch ORT-Web itself — rejected non-public API. R1b = (B)+(D) hybrid. R1b deliverables across 8-commit chain over multiple cycles ~1500-2000 LoC: (1) onnx-proto-min.ts ~400 LoC protobuf encoder/decoder for ModelProto/GraphProto/NodeProto/TensorProto; (2) bitnet-graph-patcher.ts replaces matching *.{q,k,v,o,gate,up,down}_proj.weight MatMul nodes ONLY (NOT attention QK^T runtime matmuls); (3) bitnet-custom-op.ts registers etzhayyim.ai::BitLinear via ORT-Web env.experimental.customOps; (4) BitNetForwardOverride decode bypass; (5) inference.ts useBitLinearBridge flag-gating on MODELS[baien-bitnet-2b]; (6) microbench against 15-prompt verifiable set (4 backends × 3 device classes = 12 cells); (7) iPhone 12 + Pixel 6 real-device run-log emits; (8) G1 close attestation. Failure ladder: dispatch throws → fall back to WGSL_BITNET_PACKED_DEQUANT fp16 dense dequant + telemetry → second failure = catastrophic abort. 4 new gates R1b-G1..G4 (replaced-count expectation / shape validation / telemetry on fallback / microbench manifest device-class + adapter + commit SHA). Inherited G1 (closes via microbench) / G4 (every backend vs scalar reference) / G9 (upgraded — fallback OK but MUST emit telemetry) / G14 (NO LONGER APPLIES — R1b is behaviour-change step, flag-gated per model). Out of scope: R1c v128 SIMD / R2 encoder kernels / R3 WebNN NPU / R4 q8 KV-cache / real-device matrix bench (R1b ships harness only) / baien-server-XL (edge-only)."
