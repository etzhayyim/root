# ─── Energy substrate constitutional re-framing — dependency vs substance decomposition (ADR-2605263500) ──

[[adrs]]
id = "2605263500"
title = "Energy substrate constitutional re-framing — dependency vs substance decomposition; microbial hydrocarbon biosynthesis + nuclear fusion conditional permission; commercial extraction + fission absolute prohibition retained"
status = "proposed-pending-council-ratification"
status_note = "CONSTITUTIONAL AMENDMENT. Decomposes the conflated G4 (no nuclear) + G5 (no fossil) absolute bans of ADR-2605261100 into 5 independent constitutional gates D1..D5: D1 Dependency (§1.6 中間排除 — no commercial-extractive / state-licensed fuel-cycle / third-party fuel-supply dependency), D2 Multi-gen waste hazard bound (≤100 yr hazard half-life default; intermediate-level case-by-case Council Lv7+; high-level >1,000 yr categorically excluded; atmospheric CO₂ excluded unless D3 satisfied), D3 Closed-loop carbon (net atmospheric CO₂ Δ ≤ 0 annual; combustion carbon MUST originate from atmospheric CO₂ within prior 10 yr — geological fossil categorically fails), D4 Proliferation hygiene (no weapons-grade fissile material; dual-use LEU/Li-6/tritium capped with Council Lv6+ ≥3 attestation), D5 Open-hardware (Apache 2.0 + Charter Rider for all firmware + strain genomes + plasma diagnostics). RE-EVALUATION: §2.1 PERMITTED unchanged (solar PV / small wind / geothermal micro / LFP+Na-ion / thermal storage / microgrid). §2.2 NEWLY PERMITTED — microbial hydrocarbon biosynthesis (cyanobacteria / engineered photosynthetic organisms fixing atmospheric CO₂ → alkanes; carbonSourceAttestation + atmospheric-only feedstock + open-genome OpenMTA + BSL-1/2 + double kill-switch + religious-corp-internal use + ≤10 t/yr cap through R3 + annual silenHydrocarbonReview net-zero mass-balance). §2.3 NEWLY PERMITTED CONDITIONAL — nuclear fusion (preference: aneutronic p-B¹¹ / D-He³ > D-D > D-T; D-T requires Council Lv6+ ≥4/7 per-program + tritium ≤10 kg aggregate + Li-6 ≤100 kg + LANDS jurisdictional risk attestation; low-activation structural materials V-Cr-Ti / ODS-FeCrAl / SiC-SiC mandatory keeping activation half-life ≤100 yr; plasma-control AI Murakumo-only extending ADR-2605215000; ≤1 MW thermal R&D cap through R4). §2.4 RE-AFFIRMED PROHIBITED on independent grounds (commercial petroleum/coal/gas = D1+D3+§2(d) triple-independent; nuclear fission PWR/BWR/SMR/Gen-IV = D1+D2+D4 triple-independent; RTG = D2+D1 double; weapons-grade fissile material = D4+§1.12 double). PARTIAL SUPERSESSION of ADR-2605261100 §G4+§G5+§N1+§N2 (rest of hikari R0 preserved) and ADR-2605202000 SMR/水素/核融合 deferral section (hydrogen still deferred to own ADR; fusion now has conditional permit; SMR + RTG categorically banned). 7 new Lexicons app.etzhayyim.hikari.{carbonSourceAttestation / hydrocarbonBatchRecord / silenHydrocarbonReview / fusionFacilityAttestation / fusionInventoryRecord / silenFusionReview / energyGateD1..D5Attestation}. Cross-actor: mitsuho BSL+adjacency consultation per §2.2.5; transport actors (wadachi/sarutahiko/futawa/suki) UNCHANGED electric-battery roadmap (microbial hydrocarbon §2.2.7 stationary-only). Procedural: P0 today drafted / P1 2026-05-20→2026-06-19 Bootstrap Council Seats 2-5 RFP / P2 Council Lv7+ unanimity vote (same threshold as bans being amended; no governance lock relaxation) / P3 30-day public objection / P4 effective ≥2026-07-19 absent objection. Founder Lv7+ emergency authorization explicitly NOT taken (institutional integrity over R&D urgency; no R&D blockage exists since hikari R0-R3 carries L2 ceiling). User decision 2026-05-26: ban based on dependency, not on substance per se — re-frames legacy G4/G5 conflation."
