status_note = "First-class religious-corp legal procedure actor at did:web:chigiri.etzhayyim.com (20-actors/chigiri/). Procedural template + on-chain attestation + routing substrate; NOT a commercial law firm; NOT an unauthorized practice of law (UPL constitutionally prohibited per G14 — chigiri does NOT render legal advice; human counsel contracted via Public Fund per ADR-2605192145 Council Lv6+). Form = 任意団体 internal procedure substrate (NOT 一般社団 / NPO / 公益財団 / 宗教法人 法人格 — Preamble §0.4 Lv7+ unanimity lock, N2 invariant). 7-section scope: internal procedures (Charter Rider attestation / Council Lv6/Lv7 vote / Adherent SBT lifecycle / cooperative mediation) + excommunication 破門 (Council Lv6+ ≥4/7 + 30-day cure, G12 structural) + external legal interfaces (employment law / multi-juris tax-receipt / IP defense / trademark / vendor Rider scrutiny / GDPR/CCPA/APPI/LGPD) + Charter §1.12 state-function routing-around (marriage / naming / funeral / inheritance / ID alternatives via covenant attestation + SBT-link) + defensive force / Just War legal (Reformed Just War 9-checkpoint + IHL compliance + Transparent Force authorization procedural front-end ADR-2605192315; G7 structurally rejects offensive force) + Eros/Gore content moderation (Charter §1.13) + steward labor flow (L0..L6 Liberation Ladder ADR-2605261000; G13 structurally enforces volunteer ≠ employee — `employee` is NOT a valid employmentRelation enum value). 12 Pregel cells under 20-actors/magatama/cells/chigiri_*/ (R0 path-reserved): charters_attestation / council_procedure / member_onboarding / member_offboarding / covenant_ceremony / inheritance / dispute_mediation / ip_licensing / tax_receipt / employment_compliance / data_privacy / transparent_force_authorization. 9 Lexicons under app.etzhayyim.chigiri.*: covenantAttestation / excommunicationProcedure / withdrawalAttestation / inheritanceChain / disputeMediation / ipLicenseClaim / taxReceipt / stewardLaborAttestation / forceAuthorizationRecord. 14 immutable gates G1..G14 + 12 non-goals N1..N12 + 4-phase R0→R3 (R0 this commit / R1 post-Bootstrap-Council 2026-06-19+ ratify, 3 core cells / R2 post-R1 + 30-day public objection, +5 cells + multi-juris tax / R3 post-R2 + Council Lv7+ unanimity, all 12 cells + IHL + DSAR + musubi/shidemori). Replaces legacy lawfirm.etzhayyim.com reference in 20-actors/hanrei/CLAUDE.md (religious-corp native, no gftd lineage). Cross-actor data: hanrei (case-law) + bunken (literature) read-only. Data substrate = sibling ADR-2605262800."
