status_note = "R0 scaffold landed via PR #273 (commit 0134acb1d, 8 files / 992 LoC). Smartphone / browser participation in baien post-train via WebGPU LoRA-only autograd (rank-16 on q/k/v/o_proj), frozen BitNet trunk + frozen modality encoders per ADR-2605241900. 5-layer architecture (L1 WebGPU kernel / L2 ameno PWA loop / L3 lexicon + DID / L4 Murakumo aggregator / L5 MST + L2 anchor). 11 constitutional gates (G1 trunk+encoders frozen / G2 LoRA rank-16 q/k/v/o_proj only / G3 IPFS+MST upload / G4 member passkey ES256 / G5 Murakumo-only aggregation / G6 on-device Charter Rider scan / G7 Adherent SBT gate / G8 Wellbecoming gate / G9 Byzantine median/Krum + DP-Gaussian / G10 round-frozen baseModelCid / G11 no per-delta payout). R0 deliverables landed: this ADR + lexicon app.etzhayyim.baien.distributedTrainDelta + 20-actors/ameno/src/train.ts throw-on-use scaffold + 70-tools/baien-distill/src/baien_distill/nodes/federated_aggregate.py dry-run-only planner + 20-actors/magatama/cells/baien_federated_aggregator/ Council-attestation-gated cell (import-time RuntimeError, L5-routing-around pattern from CLAUDE.md row 35). R1 ADR (2605242630) + R1a framework (PR #276) build directly on top."
