project: etzhayyim_graph_schema
default_gateway: risingwave
disable_anonymized_analytics: true

gateways:
  risingwave:
    connection:
      type: postgres
      host: "{{ env_var('RISINGWAVE_HOST', 'localhost') }}"
      port: "{{ env_var('RISINGWAVE_PORT', 4566) }}"
      user: "{{ env_var('RISINGWAVE_USER', 'root') }}"
      password: "{{ env_var('RISINGWAVE_PASSWORD', '') }}"
      database: "{{ env_var('RISINGWAVE_DATABASE', 'dev') }}"

model_defaults:
  dialect: postgres
  start: 2026-05-07
