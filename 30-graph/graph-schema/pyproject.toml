[project]
name = "gftd-graph-schema"
version = "0.1.0"
description = "RisingWave graph schema tooling using SQLAlchemy, Alembic, and SQLMesh."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.18.0",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.0",
  "sqlmesh[postgres]>=0.207.0",
]

[project.scripts]
graph-schema-drift = "graph_schema.drift:main"
graph-schema-gen-ts = "graph_schema.generate_database_ts:main"
graph-schema-kysely-to-alembic = "graph_schema.kysely_to_alembic:main"

[tool.pytest.ini_options]
pythonpath = ["."]
