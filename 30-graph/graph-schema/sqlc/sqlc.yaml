version: "2"
# Multi-language type-safe query generation (ADR-2605110227 §3.9 / 多言語 ORM).
# Schema authoring stays in Alembic (base tables) + SQLMesh (MVs).
# sqlc reads our SQL queries and emits typed bindings for TypeScript + Python.
# Run from this directory: `sqlc generate`.

plugins:
  - name: ts
    wasm:
      url: https://downloads.sqlc.dev/plugin/sqlc-gen-typescript_0.1.3.wasm
      sha256: 287df8f6cc06377d67ad5ba02c9e0f00c585509881434d15ea8bd9fc751a9368

sql:
  - engine: postgresql
    schema:
      - "schema/"
    queries:
      - "query/"
    codegen:
      - plugin: ts
        out: gen/ts
        options:
          runtime: node
          driver: postgres
# Python codegen TODO (ADR-2605110227 §3.9): add `sqlc-gen-python` plugin
# block under `plugins:` and a second `codegen:` entry. Skipped now to keep
# the first sqlc generate green; TS is the immediate consumer (mcp-adapter.ts).
