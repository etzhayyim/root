# =============================================================================
# Vertex DID Tier Classification (ADR-0040, Phase 1 audit 2026-04-21)
# =============================================================================
#
# 428 vertex_* table (live SSoT: graph-schema/src/database.ts) を 3 tier に分類:
#   Tier A = first-class actor DID (DNS handle, O(10^5) 上限)
#   Tier B = sub-path did:etzhayyim (parent authority 継承, handle 無し, O(10^6) 上限)
#   Tier C = DID 発行なし (参照 / 分類 / crawl / 分析 / infra, at:// URI で充分)
#
# ADR-0040 分類ルール:
#   1. authority 独立 + 外部 federation 可 → Tier A
#   2. parent actor から authority 継承 + project-scoped → Tier B
#   3. それ以外 (default) → Tier C
#
# 新規 vertex table migration は末尾に `-- tier: A|B|C` コメント必須。
# 昇格は可 (C→B→A)、降格は不可 (identity 保全のため)。
#
# SSoT 変遷:
# - Phase 1 初版 (2026-04-21 AM): migration 抽出 379 件。
# - Phase 2 reconcile (2026-04-21 PM): live `database.ts` Vertex*Row
#   interface 428 件に合わせて stale 34 件削除 + live-only 83 件追加。
# - Phase 3 audit pending (2026-04-25): live schema grew to 1191 vertex
#   relations. `tier:lint` reports grandfathered migration comments and a
#   partial registry. Do not infer DID issuance from the registry until Phase 3
#   closes; default for unclassified vertex relations remains Tier C.

[vertex_tier_policy]
adr = "adr-0040-vertex-did-tier-policy"
audit_date = "2026-04-21"
reconciled_date = "2026-04-21"
ssot = "30-graph/graph-schema/src/database.ts (Vertex*Row interfaces) + migrations/*.ts (declared but unapplied)"
status = "phase3-audit-pending"
total_tables = 1307
live_tables = 1193
declared_pending = 114  # migrations declared but not live in Kotoba/Datomic
counts = { tier_a = 22, tier_b = 506, tier_c = 777 }
registry_tables = 1307
registry_missing_live = 0
registry_stale = 114   # equals declared_pending; no unexpected stale registry rows
default_tier = "C"
migration_comment_required = true
lint_script = "30-graph/graph-schema/scripts/lint-vertex-tier.mjs"

[vertex_tier.tier_a]
# First-class actor DID — DNS handle, ADR-0019 + ADR-0029 root
# Each row = identity-bearing entity with independent authority
tables = [
  "vertex_actor",
