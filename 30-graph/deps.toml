[knowledge."global-product-resident-ingest-20260509"]
discovered_on = "2026-05-09"
category = "architecture"
severity = "info"
status = "active"
summary = "Global product ingest is evidence-first and runs through resident LangGraph, with official-site webfetch, intel, inference, GTIN identity, and kakaku offers"
details = """
ADR-2605091200 defines the Google-Shopping-like product graph as an internal
product intelligence substrate, not as a Google Shopping scraper.

Phase 1 schema is Alembic-owned under `alembic/current_versions`:
- `vertex_product_source_page` records official/merchant page evidence,
  fetch method, content hash, source kind, and authority rank.
- `vertex_product_fact_evidence` records extracted product facts with
  field-level source, method, confidence, model, and prompt version.
- `vertex_product_ingest_frontier` stores the resident ingest backlog for
  product hints, official URLs, merchant URLs, GTINs, retry state, and leases.
- `vertex_product_ingest_run` records resident dispatcher runs and child
  `global_product_enrich_one` dispatch responses.
- `edge_product_official_source` links canonical product DIDs to official
  manufacturer/brand pages.
- `edge_product_brand_owner` links product/brand evidence to legal/entity
  ownership candidates.

Runtime assistant:
- `global_product_enrich_one` is seeded as a `py_factory` LangGraph assistant
  and deployed at `langgraph.builtin.global_product_enrich_one`.
- It is the per-product transaction graph for official-page webfetch, merchant
  webfetch, product fact extraction, brand-owner candidate resolution,
  inference-backed match confidence, GTIN registration, kakaku offer ingest,
  evidence writes, and audit.
- `global_product_ingest_resident` is seeded as a `py_factory` LangGraph
  assistant and deployed at `langgraph.builtin.global_product_ingest_resident`.
  It selects bounded frontier batches, dispatches `global_product_enrich_one`
  through LangGraph Server, updates retry/lease state, and writes run lineage.
- `50-infra/vultr/mitama-langgraph-pool/templates/global-product-ingest-resident.yaml`
  runs the resident trigger in `{{ .Values.namespace }}` and never creates
  Kubernetes resources in the default namespace.

`gtin.etzhayyim.com` continues to own canonical product identity. `kakaku.etzhayyim.com`
continues to own merchant offers and price history. `yoro.etzhayyim.com` owns
operator-facing product research summaries.
"""
impact = "global product identity, price comparison, evidence lineage, LangGraph resident ingest"
related_files = [
  "90-docs/adr/2605091200-global-product-resident-ingest-langgraph.md",
  "30-graph/graph-schema/alembic/current_versions/r_20260509230000_global_product_ingest_evidence.py",
  "30-graph/graph-schema/alembic/current_versions/r_20260509233000_global_product_ingest_resident.py",
  "30-graph/graph-schema/sql_migrations/20260509230000_global_product_ingest_evidence.up.sql",
