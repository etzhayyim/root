[knowledge."bigquery-public-data-ingest-cost-topology-20260509"]
discovered_on = "2026-05-09"
category = "graph-schema"
severity = "info"
status = "proposed"
summary = "BigQuery public datasets are P0 catalog/sample and P1 profiling inputs before any Kotoba/Datomic graph projection; international-public-record substrate covering ~17 dim_world_domain app_hosts (patent / blockchain / weather / iryo / maps / US-gov / etc.). JP-vertical and industrial-IoT domains stay on dedicated collectors."
details = """
ADR-2605092700 defines the public-data ingest split:

- Use BigQuery for public dataset discovery, schema sampling, projection,
  dedupe, entity matching, time-window aggregation, and training corpus
  sampling.
- Use self-ingest for official APIs/files, live updates, WARC/WET/PBF/blob
  extraction, OCR, and source-specific canonicalization.
- Store only canonical `vertex_*`, typed `edge_*`, bounded `mv_*`, indexes,
  and lineage rows in Kotoba/Datomic. Raw/public all-history payloads stay in
  object storage with `vertex_ingest_artifact` references.

Initial scope is P0 + P1 only. P0 catalogs and samples public dataset metadata.
P1 profiles selected candidates for keys, null rates, text/language
distribution, PII/training risk, license decision, and recommended
Kotoba/Datomic vertex/edge targets. P2 production graph projection is blocked until
P0/P1 review creates an explicit allowlist and schema plan.

Cost model captured in the ADR:
- on-demand query scan: first 1 TiB/month free, then about USD 6.25/TiB.
- active logical BigQuery storage: about USD 23.552/TiB-month.
- P0 catalog/sample (~10 TiB scanned) is about USD 56 one-pass query cost.
- P1 profiling defaults to 20 TiB/month (about USD 119) with a 100 TiB hard
  cap (about USD 619) unless explicitly approved.
- P2 broad projection (~1 PiB scanned) is about USD 6.4k one-pass query cost.
- Literal all-public-data/all-column copying is rejected; 100 PiB+ scans would
  be about USD 639k+ before storage, egress, Kotoba/Datomic scale-up, embeddings,
  OCR, or training GPU.

Planned graph additions:
- vertex_public_dataset_catalog
- vertex_public_dataset_table
- vertex_public_dataset_sample
- vertex_public_dataset_profile
- vertex_bigquery_ingest_job
- vertex_bigquery_export_artifact
- vertex_bigquery_profile_run
- edge_dataset_produces_vertex_type
- edge_dataset_allowed_for_training_task
- mv_public_dataset_ingest_status
- mv_public_dataset_catalog_coverage
- mv_public_dataset_profile_rank
- mv_training_source_eligibility

Every BigQuery-backed ingest must use dry-run/query validation,
`maximum_bytes_billed`, explicit column lists, partition filters where
available, TTL'd staging tables, and `allowed_for_train=false` until license and
PII policy gates pass.

world-coverage mapping (formerly driven by `etzhayyim world-coverage`, CLI removed 2026-05-20; 2026-05-10 review):

- BigQuery public-data covers ~17 `dim_world_domain` app_hosts: `patent`,
  `blockchain`, `weather`, `iryo` (subset), `iryo-genomics`, `maps`, `gov` (US
  federal), `talent` (US), `bank` (US/FDIC), `finance` (US partial), `shizen`,
  `tentai`, `text-corpus`, `code`/`package-metadata`, `kuruma-transport` (US),
  `civic` (US cities), `vision`. Estimated post-P2 coverage delta:
  `mv_world_coverage_live` from 0.0087% → ~0.05–0.10% (5–10× jump from
  `patent` / `blockchain` / `weather` / `iryo-genomics` / US `gov` saturating
  their world totals).
- BigQuery cannot fill: `photos` (5T), `kessai`/`serial`/`seizo`/`nimotsu`/
  `bim`/`mac`/`iot` (each 100B–1T, industrial telemetry), `invoice`/`receipt`
  (each 500B, private), `natural-person` (108B), `shisan`/`haikibutsu`/
  `kachiku`/`phonenumber`/`keiyaku`/`software` (each 10–50B), all
  JP-vertical (`anime`/`manga`/`gameya`/`mercari`/`rakuten`/`ndl_books`/
  `houbun_jp`). These keep their dedicated collector / partnership pipelines.
- Topology decision: BigQuery is the international-public-record substrate;
  JP-vertical, industrial-IoT, private-transaction, and PII-observation
  domains stay on dedicated collectors. The two paths converge at
  `vertex_*`/`edge_*` in Kotoba/Datomic, never at the BigQuery layer.

P0 surface (landed 2026-05-09):
- migration `30-graph/graph-schema/sql_migrations/20260509600000_vertex_public_dataset_catalog.{up,down}.sql`
  + alembic revision `r_20260509600000_vertex_public_dataset_catalog` provisions
  `vertex_public_dataset_catalog`, `vertex_public_dataset_table`,
  `vertex_public_dataset_sample`, `vertex_bigquery_ingest_job`,
  `vertex_bigquery_export_artifact`, `vertex_bigquery_profile_run`, and
  `mv_public_dataset_catalog_coverage`.
- runner `70-tools/scripts/bigquery-public-dataset-catalog.mjs` enforces
  metadata-first discovery (INFORMATION_SCHEMA), bounded sample queries with
  `maximumBytesBilled`, artifact persistence to local fs (or `--artifact-prefix`
  object-store URI), and double-entry write to the BigQuery ledger plus the
  generic `vertex_ingest_run` / `vertex_ingest_artifact` spine.

P2 adapter pattern (landed 2026-05-11):

- 10 new target vertex tables in migration `20260511000000_p2_bq_target_vertices`
  (`vertex_air_quality_observation` / `vertex_taxi_trip` / `vertex_qa_post` /
  `vertex_marine_observation` / `vertex_synthetic_patient` /
  `vertex_forest_inventory` / `vertex_target_evidence` /
  `vertex_chemistry_patent` / `vertex_blockchain_block` / `vertex_blockchain_tx`).
- 11 per-dataset adapters under `70-tools/scripts/projection/bigquery/` sharing
  `_lib.mjs` (resumable cursors via `vertex_ingest_cursor`; periodic FLUSH
  every 20 chunks; `onChunkFlush` mid-run cursor advance; fresh
  `pg.Client` per record / maintained client per INSERT loop).
- Bindings gate: `edge_dataset_produces_vertex_type` 13 rows /
  `edge_dataset_allowed_for_training_task` 44 rows; ADR-2605101000 §D3
  refuses to dispatch an adapter without its binding.
- Pilot state (2026-05-11): vertex_air_quality_observation 110,421 +
  vertex_blockchain_block (ltc) 612 + vertex_blockchain_tx (ltc) 149,543.
  Cumulative BQ scan P0+P1+P2 = 7.9 TiB ≈ $48.27.

P1 surface (landed 2026-05-09):
- migration `30-graph/graph-schema/sql_migrations/20260509610000_vertex_public_dataset_profile.{up,down}.sql`
  + alembic revision `r_20260509610000_vertex_public_dataset_profile` provisions
  `vertex_public_dataset_profile`, `edge_public_dataset_profiles_table`,
  `edge_public_dataset_candidate_for_vertex_type`,
  `edge_public_dataset_candidate_for_training_task`,
  `edge_dataset_produces_vertex_type`, `edge_dataset_allowed_for_training_task`,
  `mv_public_dataset_profile_rank`, `mv_training_source_eligibility`, and
  `mv_public_dataset_ingest_status`.
- runner `70-tools/scripts/bigquery-public-dataset-profile.mjs` only operates
  on P0 candidates whose catalog `review_status <> 'rejected'`, enforces
  `maximumBytesBilled <= 2 TiB` per query, defaults monthly budget to 20 TiB
  (100 TiB hard cap requires `--approval-note`), uses `TABLESAMPLE SYSTEM`
  when the table exceeds the per-query cap, and defaults `allowed_for_train`
  to `false` until a license + PII review explicitly promotes a row.
"""
impact = "public dataset ingest, Kotoba/Datomic graph schema planning, LLM training corpus governance, BigQuery cost controls"
references = [
