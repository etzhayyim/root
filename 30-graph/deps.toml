[knowledge."rw-capability-storage-authority-20260509"]
discovered_on = "2026-05-09"
category = "security-architecture"
severity = "info"
status = "active"
summary = "Kotoba/Datomic stores capability hashes/grants/authority projections, not bearer caps or protected plaintext"
details = """
ADR-2605092700 accepts RW capability storage and authority boundary:

- RW remains the queryable graph/materialized-view plane.
- RW may store cap_hash, verify indexes, grant facts, delegation chains,
  caveats, revocation state, encrypted manifests, and audit rows.
- RW must not store raw read/write/admin capability secrets, DEKs, or protected
  plaintext for migrated object classes.
- auth.etzhayyim.com remains the OAuth/DPoP proof-of-possession session boundary.
- Capability evaluation normalizes did:web / did:plc facade DIDs to canonical
  `did:erc725:etzhayyim:260425:<identity>` root DIDs before grant matching.
- ERC725 / ERC-8004 remain the trust/discovery anchors; RW is the operational
  projection and verification index, not a replacement for the onchain root
  identity registry.

Target logical relations:
- vertex_cap_object
- vertex_cap_grant
- edge_cap_delegates
- vertex_cap_revocation
- vertex_cap_audit

Target MVs:
- mv_cap_effective_grant
- mv_cap_subject_authority
- mv_cap_object_visibility
- mv_cap_revocation_closure
"""
impact = "RW protected-object schema, MCP capability verifier, auth.etzhayyim.com integration, ERC725 root DID authority"
references = [
