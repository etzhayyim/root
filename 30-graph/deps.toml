[knowledge."generic-decision-context-graph-20260509"]
discovered_on = "2026-05-09"
category = "graph-schema"
severity = "info"
status = "active"
summary = "Generic capability / constraint / dependency context graph for agent loops, conversations, processes, and infrastructure"
details = """
`20260509170000_context_capability_constraint_dependency.ts` adds the generic
decision-context substrate:
- vertex_context_subject
- vertex_context_capability
- vertex_context_constraint
- vertex_context_dependency
- edge_context_has_capability
- edge_context_constrained_by
- edge_context_depends_on

The schema is intentionally not infra-specific. `subject_ref` can identify an
agent loop, conversation, process, training action, app, ADR, infra component,
or arbitrary decision subject. Direction contract:
- edge_context_depends_on.src_vid depends on edge_context_depends_on.dst_vid
- edge_context_constrained_by.src_vid is constrained by dst_vid
- edge_context_has_capability.src_vid has capability dst_vid

Live apply note: Kotoba/Datomic recovered repeatedly during this session and
foreground view / FLUSH paths returned meta-service recovery errors. To avoid
reintroducing heavy DDL, the migration now keeps only base vertex/edge tables
and lightweight lookup indexes. MCP reads base tables directly and falls back
from `mv_context_decision_surface` if a future view is absent.

Oka seed rows are live:
- subject=3 (`oka-training`, `oka-training:a40-fp8`, `oka-training:l40s-fp8`)
- capability=2 (A40 BF16 fallback, L40S FP8 training)
- constraint=2 (A40 FP8 hard block, FP8 BF16/FP32 fallback requirement)
- dependency=1 (L40S FP8 capacity + implementation gate)
- edges: has_capability=2, constrained_by=2, depends_on=1

Oka H100/27B session closeout is recorded in the top-level `deps.toml` and
ADR-2605092345: HF quality ingest added 4,900 records; Unsloth Gemma 3 27B
LoRA SFT completed 100 steps with `train_loss=1.297047061920166`; inference
eval measured base 5.0904 tok/s vs adapter 4.9798 tok/s; the public HF adapter
repo is `com-junkawasaki/oka-gemma3-27b-hf-quality-lora` at commit
`8ef48c441d0342ec3d6f04c2f955be95b0866dbb`; and the temporary RunPod H100 NVL
pod `etzhayyim-h100nvl-train-260509` was terminated after artifact preservation.
"""
impact = "agent decision memory, process routing, training precision policy, MCP context retrieval"
