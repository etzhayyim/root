[package]
name = "kg-appview"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Ephemeral in-memory SPARQL AppView for the etzhayyim Knowledge Graph. Stage K2.a of ADR-2605190900: load kg-projector out/ into an OxiGraph MemoryStore and expose SPARQL 1.1 over HTTP. No durable state; no SPARQL UPDATE; no centralized DB."
publish = false

[[bin]]
name = "kg-appview"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
futures-util = "0.3"
oxigraph = "0.4"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
