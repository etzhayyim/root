# pnpm workspace.
#
# Only packages retained by root are listed here. Extracted applications own
# their workspaces in their flat west repositories (ADR-2607201930).

# pnpm 10 defaults to autoInstallPeers=true. mst-projector declares
# @lancedb/lancedb / duckdb-async / @huggingface/{transformers,inference}
# as OPTIONAL peers (peerDependenciesMeta.optional = true) — they install
# on the projector pod at deploy time per ADR-2605212000, not in CI / local.
# Disabling auto peer install keeps the workspace install clean and matches
# the "in-memory ships, heavy deps graduate at deploy time" pattern (lessons
# learned in deps.toml phases-f-g-h-i milestone).
# Inlined here instead of .npmrc because .npmrc is gitignored (credentials).
autoInstallPeers: false

packages:
  # etzhayyim chain-substrate (ADR-2605211950 axis)
  - "50-infra/etzhayyim-authz"

  # ameno cohort
  - "orgs/etzhayyim/com-etzhayyim-ameno"

  # karute (電子カルテ / EMR) — ADR-2605231100
  - "../com-etzhayyim-signal"
  - "../com-etzhayyim-xrpc"
  - "../com-etzhayyim-svelte-auth"
  - "../com-etzhayyim-svelte-design-system"

  # etzhayyim substrate SDKs are immutable git dependencies managed by west.

  # 70-tools workspaces referenced by CI tsc matrix
  - "70-tools/lexicon-to-openapi"
  - "70-tools/lexicon-to-zod"

  # yorishiro generator + emitted MCP servers (ADR-2605211900)
  - "70-tools/etzhayyim-cli/yorishiro"
  # kotoba-kotodama MCP packages come from the etzhayyim/kotoba repo, cloned into
  # 40-engine/kotoba at CI/dev time (the submodule was removed, ADR-2606131645).
  - "40-engine/kotoba/crates/kotoba-kotodama/mcp/yorishiro-*-mcp"
  - "40-engine/kotoba/crates/kotoba-kotodama/mcp/open-seiyaku-mcp"

  # @etzhayyim/kami-engine-sdk canonical (ADR-2605265200, Phase 3
  # deletion of the legacy 20-actors duplicate completed earlier).
  # git-submodule of github.com/etzhayyim/kami-engine-sdk (the submodule
  # repo is the SoT per ADR-2606011500 stage 1; run `git submodule update
  # --init` to populate). `workspace:*` references in consumer apps resolve
  # here once the submodule is checked out.
  - "40-engine/kami-engine/kami-engine-sdk"

# pnpm overrides — dedupe onnxruntime-web to the version pinned by
# @huggingface/transformers@3.8.1 (the larger 1.26.0 release is 25 MiB and hits
# the Cloudflare Workers per-asset hard limit, blocking kotodama-yoro deploy).
# Two consumers in the yoro SPA bundle: (a) transformers (pinned to 1.22.0-dev),
# (b) src/lib/provider/diffusion-worker.ts (only uses stable InferenceSession
# API + type imports, compatible with 1.22.0-dev).
overrides:
  onnxruntime-web: "1.22.0-dev.20250409-89f8206ba4"
