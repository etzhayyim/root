# lefthook config — etzhayyim/root
#
# Scaffolding stub. Real hooks (adr-validate, docs-registry, bpmn-contract-gates,
# lint-dangerous-query, llm-model-ssot, etc.) will be added when the
# corresponding source paths land in this repo.

pre-commit:
  parallel: true
  commands:
    secret-scan:
      # Block obvious credentials before they hit git history.
      # Per the GitGuardian incident (2026-05-17): the RisingWave
      # PostgreSQL credential `rw_66a4db…` landed in HEAD via seeded
      # framework content and required remediation.
      #
      # Detection regex covers:
      #   - postgres://USER:PASSWORD@HOST/DB                     (DSN with embedded password — placeholder doc only)
      #   - sk_live_… / sk_test_… (Stripe-style secret keys)     (also matches arbitrary `sk_*` tokens)
      #   - rw_<32-hex>             (RisingWave password format used by upstream)
      #   - AWS_SECRET_ACCESS_KEY=  / aws_secret_access_key=     (env-style aws keys)
      #   - github_pat_              (GitHub personal access tokens)
      #   - ghp_ / ghs_ / ghr_ / gho_  (GitHub PATs short prefixes)
      #   - PRIVATE KEY-----         (PEM headers)
      glob: "*.{md,toml,yaml,yml,json,jsonc,ts,tsx,js,mjs,cjs,py,rs,go,sh,sol,sql,env,example}"
      run: |
        # Allow false-positive-ish matches inside ADR docs / tests
        # describing the secret pattern as a literal example.
        # Reject in all other code paths.
        leaks=$(grep -nE \
          'postgres(ql)?://[^@[:space:]]*:[^@[:space:]]+@|sk_(live|test)_[A-Za-z0-9]{16,}|rw_[a-f0-9]{32}|AWS_SECRET_ACCESS_KEY=[A-Za-z0-9/+]{16,}|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
          {staged_files} 2>/dev/null | \
          grep -vE '(REDACTED|<rw-host>|example|fixture|placeholder|EXAMPLE_|DUMMY_|XXXX|<your-|<insert-|/test/|_test\.|\.test\.|/tests/|\.example|\.sample)' || true)
        if [ -n "$leaks" ]; then
          echo "✘ secret-scan detected potential credential leak:"
          echo "$leaks"
          echo ""
          echo "  Move the value to a secret manager (Keychain / 1Password / k8s Secret) and"
          echo "  reference via env var instead. If this is a documented EXAMPLE format, mark"
          echo "  the line with the token 'EXAMPLE' or 'placeholder' to bypass this check."
          exit 1
        fi
      stage_fixed: false

    trailing-whitespace:
      # Exempt build outputs (analogous to no-cookie's path exemption).
      # `static/_app/immutable/` is where SvelteKit's adapter-cloudflare with
      # `fallback: 'spa'` writes its hashed chunks; the trailing whitespace
      # in those files is inside vendored error-message template literals
      # (e.g. MLC web-llm), not editable formatting.
      glob: "*.{md,toml,yaml,yml,json,jsonc,ts,tsx,js,mjs,cjs,py,rs,go,sh}"
      exclude:
        - "**/node_modules/**"
        - "**/.svelte-kit/**"
        - "**/build/**"
        - "**/dist/**"
        - "**/static/_app/immutable/**"
      run: |
        if grep -nE ' +$' {staged_files} 2>/dev/null; then
          echo "✘ trailing whitespace found"; exit 1
        fi
      stage_fixed: false

    end-of-file:
      glob: "*.{md,toml,yaml,yml,json,jsonc,ts,tsx,js,mjs,cjs,py,rs,go,sh}"
      exclude:
        - "**/node_modules/**"
        - "**/.svelte-kit/**"
        - "**/build/**"
        - "**/dist/**"
        - "**/static/_app/immutable/**"
      run: |
        for f in {staged_files}; do
          if [ -s "$f" ] && [ "$(tail -c1 "$f" | xxd -p)" != "0a" ]; then
            echo "✘ missing final newline: $f"; exit 1
          fi
        done
      stage_fixed: false

    substrate-boundary:
      # Enforce ADR-2605172000 (RW-free state substrate) and
      # ADR-2605172100 (no fiat payment processors) at commit time.
      # Blocks direct imports of kysely / pg / postgres / mysql /
      # mongodb / risingwave (storage), stripe / paypal / square / …
      # (payment), and @atproto/api / viem / @noble/ciphers /
      # @signalapp/libsignal-client / ipfs-http-client / helia
      # (substrate clients that must route through @etzhayyim/sdk).
      # See 70-tools/scripts/lint/substrate-boundary.mjs §allowedPrefixes
      # for the SDK-seam carve-outs. ADR-2605191648.
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,py,svelte}"
      run: node 70-tools/scripts/lint/substrate-boundary.mjs {staged_files}
      stage_fixed: false

    no-advertising:
      # Enforce ADR-2605192115 §1.2 (No Advertising hard rule) +
      # ADR-2605192100 §1.6 (Mission Charter middleman elimination).
      # Blocks imports of advertising networks / affiliate SDKs /
      # ad-context trackers + HTML/DOM advertising integration patterns.
      # See 70-tools/scripts/lint/no-advertising.mjs for the full list.
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,py,svelte,html,htm}"
      run: node 70-tools/scripts/lint/no-advertising.mjs {staged_files}
      stage_fixed: false

    no-cookie:
      # Enforce CHARTER-RIDER.md §2(c) (no surveillance / trackers) +
      # ADR-2605172000 (RW-free substrate, identity = DID + WebAuthn).
      # Blocks document.cookie writes, SvelteKit/hono/express cookies.set(),
      # setCookie() helpers, cookie.serialize(), and raw Set-Cookie header
      # construction. Reads are allowed (legacy-cookie migration is fine).
      # Inline bypass: add `// no-cookie: allow <reason>`.
      # The etzhayyim-did-web Worker is exempt (it IS the policy enforcer).
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,svelte}"
      run: node 70-tools/scripts/lint/no-cookie.mjs {staged_files}
      stage_fixed: false

    no-purchase-purpose:
      # Enforce ADR-2605192115 §1.3 + §3.3 + ADR-2605192130.
      # Blocks the v0 payment.sent.purpose enum values that were
      # removed in the v0→v1 narrow (subscription / purchase / tip /
      # refund / offering / split). Allowed: donation / kisha / grant /
      # tithe / escrow-refund + internal-* (SBT↔SBT carve-out only).
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,py,svelte,json}"
      run: node 70-tools/scripts/lint/no-purchase-purpose.mjs {staged_files}
      stage_fixed: false

    paywall-warn:
      # Warning-level surface for ADR-2605192115 §2.3 paywall patterns.
      # Non-blocking — Council Lv6+ reviews case by case. Always exits 0.
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,py,svelte,md}"
      run: node 70-tools/scripts/lint/paywall-warn.mjs {staged_files}
      stage_fixed: false

    sensor-no-active-probe:
      # Enforce ADR-2605262400 §7 + G8 (passive-only invariant). Scans
      # staged DatasetSensor sources under
      # `20-actors/magatama/py/src/pymagatama/organism/sensors/` for
      # forbidden network imports (socket / dnspython / aiodns / scapy /
      # nmap / paramiko) and for URL string literals targeting hosts
      # outside the religious-corp DID infrastructure allow-list.
      # Sensors MUST consume pre-captured public archives only.
      glob: "20-actors/magatama/py/src/pymagatama/organism/sensors/*.py"
      run: node 70-tools/scripts/lint/sensor-no-active-probe.mjs {staged_files}
      stage_fixed: false

    charter-rider-notice:
      # Enforce ADR-2605192200 v2.0 §3 + §4. Every Apache-2.0 first-party
      # package MUST have NOTICE (referencing the Rider) + CHARTER-RIDER.md
      # (file or symlink to repo-root canonical). 3rd-party vendored
      # directories (lib/, vendor/, *-fork/) are exempted. Run
      # `./70-tools/charter-rider-applicator/apply.sh` to fix violations.
      glob: "{package.json,Cargo.toml,pyproject.toml}"
      run: node 70-tools/scripts/lint/charter-rider-notice.mjs {staged_files}
      stage_fixed: false

    karute-phi-plaintext-guard:
      # Enforce ADR-2605231100 §"Substrate hard-rules" + ADR-2605181100.
      # Blocks plaintext writes whose collection / $type / nsid points to a
      # karute inner type (patient / encounter / soapNote / observation /
      # condition / medicationRequest / serviceRequest / dispenseRecord)
      # unless the surrounding lines are an encryptedWrite() context.
      # Exempt: lexicon SoTs, actor manifest, ADRs/docs, tests, the guard
      # script itself. Use '// phi-guard: allow' inline to bypass with
      # documented justification.
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,py,svelte,jsonld}"
      run: node 70-tools/scripts/lint/karute-phi-plaintext-guard.mjs {staged_files}
      stage_fixed: false

    validate-religious-corp-lexicons:
      # Validate etzhayyim religious-corp lexicons per AT Protocol Lexicon v1
      # rules (no float types, integer with implied units). Per ADR-2605190900.
      #
      # Staged-only mode (fix 2026-05-26): pass {staged_files} to --files so
      # pre-existing unrelated Lexicon issues in app/etzhayyim/gftd/ don't block
      # commits that touch only other Lexicon paths. Manual full-tree audit:
      #   python3 70-tools/scripts/validate-lexicons.py \
      #       --root 00-contracts/lexicons/app/etzhayyim/ --exit-on-error
      glob: "00-contracts/lexicons/app/etzhayyim/**/*.json"
      run: python3 70-tools/scripts/validate-lexicons.py --files {staged_files} --exit-on-error
      tags: lexicon

    no-external-purchase-purpose:
      # Enforce ADR-2605211900 §D2 + ADR-2605192115 §4 on every yorishiro
      # lexicon. Yorishiri are vessels (依代) that bridge external substrate;
      # their x-charter-purpose must be a non-empty subset of:
      #   donation / kisha / grant / tithe / escrow-refund
      # and must never include subscription / purchase / tip /
      # internal-purchase / internal-subscription / internal-promo
      # (the internal-* values belong on SBT↔SBT carveout apps, NOT on
      # yorishiri). x-yorishiro-external must also be true. See
      # 70-tools/scripts/lint/no-external-purchase-purpose.mjs.
      glob: "00-contracts/lexicons/ai/etzhayyim/yorishiro/**/*.json"
      run: node 70-tools/scripts/lint/no-external-purchase-purpose.mjs {staged_files}
      tags: lexicon yorishiro

    no-two-stage-gftd-domains:
      # Enforce ADR-2605212340 (legacy domain → etzhayyim.com cutover).
      # Blocks new introduction of the legacy gftd top-level zone literal
      # in canonical etzhayyim code, including in .jsonld @context URIs.
      # Alias docs (/CLAUDE.md, /README.md, /CHARTER-RIDER.md) are exempt.
      glob: "*.{md,toml,yaml,yml,json,jsonc,jsonld,ts,tsx,js,jsx,mjs,cjs,py,rs,go,sh,sol,svelte}"
      run: node 70-tools/scripts/lint/no-two-stage-gftd-domains.mjs {staged_files}
      stage_fixed: false

    dataset-substrate-guard:
      # Enforce ADR-2605241500 invariants:
      #   1. `90-docs/baien/datasets.jsonl` is append-only — no row
      #      may be modified or removed in place. Tombstone via a new
      #      row instead.
      #   2. No first-party file > 100 MiB enters git history. Datasets
      #      MUST go through `e7m-dataset add` (git-annex on
      #      /Volumes/<vol>/etzhayyim/annex-store/), not direct `git add`.
      #
      # The 100 MiB ceiling is conservative; GitHub itself rejects
      # blobs > 100 MiB. Exempt paths: 50-infra/etzhayyim-paymaster/lib/,
      # any path containing `/vendor/`, `/lib/forge-std/`, or under
      # 90-docs/baien/datasets/<subdataset>/ (those route through
      # git-annex symlinks, not regular blobs).
      run: |
        set -e
        viol=0

        # (1) datasets.jsonl append-only check
        if echo "{staged_files}" | tr ' ' '\n' | grep -qx '90-docs/baien/datasets.jsonl'; then
          # Diff existing rows in HEAD vs the staged version. If any row
          # disappears or changes in place, that's a violation.
          if git rev-parse --verify HEAD >/dev/null 2>&1 \
             && git show HEAD:90-docs/baien/datasets.jsonl > /tmp/dsm-head.$$ 2>/dev/null; then
            git show :90-docs/baien/datasets.jsonl > /tmp/dsm-staged.$$ 2>/dev/null || true
            head_lines=$(wc -l < /tmp/dsm-head.$$ | tr -d ' ')
            if ! head -n "$head_lines" /tmp/dsm-staged.$$ | diff -q /tmp/dsm-head.$$ - >/dev/null 2>&1; then
              echo "✘ datasets.jsonl is append-only (ADR-2605241500 §D1)."
              echo "  HEAD's $head_lines existing rows must remain byte-identical."
              echo "  To retire a row, APPEND a tombstone row instead."
              viol=1
            fi
            rm -f /tmp/dsm-head.$$ /tmp/dsm-staged.$$
          fi
        fi

        # (2) 100 MiB blob ceiling
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          case "$f" in
            */vendor/*|*/lib/forge-std/*|50-infra/etzhayyim-paymaster/lib/*|90-docs/baien/datasets/*) continue ;;
          esac
          size=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f" 2>/dev/null || echo 0)
          if [ "$size" -gt 104857600 ]; then
            echo "✘ $f is ${size} bytes (> 100 MiB)."
            echo "  Datasets MUST route via \`e7m-dataset add\` (ADR-2605241500 §D2)."
            echo "  Direct \`git add\` of large blobs is prohibited."
            viol=1
          fi
        done

        exit $viol
      stage_fixed: false

    e7m-verify:
      # Per ADR-2605221411 + ADR-2605192100 §1: every commit re-checks the
      # 8 constitutional hard-invariants surfaced by `e7m verify`. Unlike
      # the per-file lints above, this is a whole-repo scan that catches
      # invariant drift introduced by merges, vendored content, or out-of-
      # tree edits.
      #
      # If e7m is not installed (new contributor), the hook is informational
      # and exits 0. Install via:
      #   cd 70-tools/e7m && uv venv .venv && source .venv/bin/activate && uv pip install -e .
      run: |
        # Prefer the project-local venv binary because PATH `e7m` may
        # collide with an unrelated `gftd` shim that has no `verify`
        # subcommand on some workstations.
        if [ -x 70-tools/e7m/.venv/bin/e7m ]; then
          E7M_BIN=70-tools/e7m/.venv/bin/e7m
        elif command -v e7m >/dev/null 2>&1; then
          E7M_BIN=e7m
        else
          echo "ℹ e7m not on PATH; skipping constitutional verify."
          echo "  Install with: cd 70-tools/e7m && uv venv .venv && source .venv/bin/activate && uv pip install -e ."
          exit 0
        fi
        if ! "$E7M_BIN" --json verify > /tmp/e7m-verify.$$.json 2>/dev/null; then
          echo "✘ e7m verify failed — constitutional invariant violation"
          "$E7M_BIN" verify || true
          rm -f /tmp/e7m-verify.$$.json
          exit 1
        fi
        rm -f /tmp/e7m-verify.$$.json
      stage_fixed: false
