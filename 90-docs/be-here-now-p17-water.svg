<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1500" width="2400" height="1500" font-family="serif">
  <title>be·here·now P17 ── 水の上。櫂が止まる。パンが巡って還る(ki tov / いい感じ)</title>
  <defs>
    <linearGradient id="sky17" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3152"/>
      <stop offset="0.5" stop-color="#8a6a6a"/>
      <stop offset="1" stop-color="#e7ad6e"/>
    </linearGradient>
    <linearGradient id="water17" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c184"/>
      <stop offset="0.12" stop-color="#c89466"/>
      <stop offset="0.5" stop-color="#7a5a5e"/>
      <stop offset="1" stop-color="#2c2540"/>
    </linearGradient>
    <radialGradient id="glow17" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6bd" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe6bd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign17" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- 空(上1/4) -->
  <rect width="2400" height="380" fill="url(#sky17)"/>
  <ellipse cx="1280" cy="380" rx="560" ry="200" fill="url(#glow17)"/>
  <!-- 水 -->
  <rect y="380" width="2400" height="1120" fill="url(#water17)"/>

  <!-- 陽の道(水平線→パンへ伸びる導線=いい感じ) -->
  <polygon points="1180,392 1380,392 1120,1160 980,1160" fill="#ffe3ad" opacity="0.28"/>
  <g fill="#ffe9c0" opacity="0.5">
    <rect x="1210" y="430" width="120" height="9" rx="4"/>
    <rect x="1190" y="492" width="150" height="9" rx="4"/>
    <rect x="1170" y="566" width="120" height="8" rx="4"/>
    <rect x="1150" y="654" width="160" height="9" rx="4"/>
    <rect x="1124" y="760" width="120" height="9" rx="4"/>
  </g>

  <!-- 遠い岸(左)と そこへ降りる鳥 -->
  <path d="M0,392 C220,372 420,386 560,404 L560,392 Z" fill="#2a2238"/>
  <!-- 鳥(細いシルエット、首を伸ばしパンの方へ) -->
  <g fill="#16111f">
    <path d="M470,470 q40,-6 70,10 q-10,-30 -36,-40 q6,28 -34,30 Z"/>
    <path d="M520,484 l44,18 l-6,8 l-40,-14 Z"/>
    <line x1="476" y1="476" x2="476" y2="540" stroke="#16111f" stroke-width="5"/>
    <line x1="500" y1="486" x2="504" y2="540" stroke="#16111f" stroke-width="5"/>
  </g>
  <!-- 鳥の映り -->
  <g fill="#16111f" opacity="0.25"><rect x="472" y="544" width="34" height="40"/></g>

  <!-- 漂うパンと同心円の波紋 -->
  <g>
    <g fill="none" stroke="#f4e2bd" stroke-opacity="0.55">
      <ellipse cx="1110" cy="800" rx="70" ry="20" stroke-width="3"/>
      <ellipse cx="1110" cy="800" rx="140" ry="40" stroke-width="2.5" stroke-opacity="0.4"/>
      <ellipse cx="1110" cy="800" rx="230" ry="64" stroke-width="2" stroke-opacity="0.28"/>
      <ellipse cx="1110" cy="800" rx="340" ry="92" stroke-width="2" stroke-opacity="0.18"/>
    </g>
    <ellipse cx="1110" cy="800" rx="40" ry="16" fill="#caa069"/>
    <ellipse cx="1110" cy="795" rx="40" ry="16" fill="#ecc78d"/>
  </g>

  <!-- 手前:舟の舳先 と ナギ(後ろ姿・小さく右下) -->
  <g fill="#0d0a15">
    <!-- 舟べり -->
    <path d="M1400,1500 C1500,1300 1900,1230 2400,1250 L2400,1500 Z"/>
    <path d="M1380,1340 C1560,1280 1980,1268 2400,1300 L2400,1340 C1980,1310 1560,1322 1400,1372 Z" opacity="0.9"/>
    <!-- ナギ後ろ姿 -->
    <path d="M1760,1300 C1752,1180 1764,1092 1782,1024 C1788,994 1812,978 1838,978 C1864,978 1888,994 1894,1024 C1912,1092 1922,1180 1914,1300 Z"/>
    <circle cx="1838" cy="948" r="40"/>
  </g>
  <!-- 止まった櫂(水滴) -->
  <g>
    <rect x="1600" y="1020" width="220" height="14" rx="7" fill="#0d0a15" transform="rotate(-22 1710 1027)"/>
    <path d="M1556,1108 l-44,86" stroke="#0d0a15" stroke-width="18" stroke-linecap="round"/>
    <ellipse cx="1512" cy="1206" rx="22" ry="34" fill="#0d0a15"/>
    <g fill="#e9c184" opacity="0.7"><circle cx="1512" cy="1248" r="6"/><circle cx="1524" cy="1268" r="4"/></g>
  </g>

  <rect width="2400" height="1500" fill="url(#vign17)"/>
  <text x="60" y="120" fill="#f6ecd4" opacity="0.85" font-size="40" letter-spacing="6">P17</text>
  <text x="60" y="1450" fill="#f3e7d0" opacity="0.45" font-size="24">水の上。櫂が止まる。投げたパンを岸の鳥がついばむ ── 巡って還る。何も勝っていない、ただ、いい感じ。</text>
</svg>
