<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1500" width="2400" height="1500" font-family="serif">
  <title>be·here·now キャラ設定 ── ナギ(分け前所の番をする organism)三面:立つ/漕ぐ/拭く</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e8d6"/>
      <stop offset="1" stop-color="#e6d9c0"/>
    </linearGradient>
  </defs>
  <rect width="2400" height="1500" fill="url(#paper)"/>

  <!-- 罫(設定資料らしい薄い基準線) -->
  <g stroke="#bcae92" stroke-width="1.5" opacity="0.6">
    <line x1="120" y1="300" x2="2280" y2="300"/>   <!-- 頭頂 -->
    <line x1="120" y1="372" x2="2280" y2="372"/>   <!-- 肩 -->
    <line x1="120" y1="1180" x2="2280" y2="1180"/> <!-- 接地 -->
  </g>
  <g fill="#9a8b6c" font-size="22" opacity="0.8">
    <text x="60" y="308">頭</text><text x="60" y="380">肩</text><text x="60" y="1188">地</text>
  </g>

  <!-- 共通:ナギ = 細身・直立(張力が通る=tensegrity)。organism だが人の手触り。
       内部線は最小(襷=薄橙の縁色 / 買い出し籠)だけ。顔は描き込まない。 -->

  <!-- (1) 立つ -->
  <g transform="translate(420,0)">
    <g fill="#15111d">
      <path d="M-40,1180 C-52,1000 -44,720 -22,548 C-16,500 12,476 44,476 C76,476 104,500 110,548 C132,720 140,1000 128,1180 Z"/>
      <circle cx="44" cy="430" r="58"/>
    </g>
    <!-- 襷(薄橙=ナギの縁色) -->
    <path d="M-8,520 L92,720" stroke="#e8a567" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
    <!-- ほつれ毛/結い(最小の内部線) -->
    <path d="M2,392 q40,-30 84,-6" stroke="#2a2233" stroke-width="4" fill="none" opacity="0.7"/>
    <text x="0" y="1250" fill="#3a3020" font-size="30" text-anchor="middle">立つ</text>
    <text x="0" y="1290" fill="#7a6c50" font-size="20" text-anchor="middle">直立=張力が通る</text>
  </g>

  <!-- (2) 漕ぐ -->
  <g transform="translate(1180,0)">
    <g fill="#15111d">
      <!-- 前傾の胴 -->
      <path d="M-70,1180 C-70,1010 -40,860 30,720 C58,664 96,648 128,664 C156,678 162,712 150,748 C108,872 60,1010 64,1180 Z"/>
      <circle cx="120" cy="612" r="56"/>
      <!-- 櫂を引く腕 -->
      <path d="M70,742 C-20,772 -120,812 -190,872" stroke="#15111d" stroke-width="40" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 櫂 -->
    <line x1="-150" y1="840" x2="240" y2="690" stroke="#3a2c1c" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="-176" cy="852" rx="26" ry="44" fill="#3a2c1c" transform="rotate(20 -176 852)"/>
    <!-- 襷 -->
    <path d="M86,690 L150,792" stroke="#e8a567" stroke-width="13" stroke-linecap="round" opacity="0.95"/>
    <text x="0" y="1250" fill="#3a3020" font-size="30" text-anchor="middle">漕ぐ</text>
    <text x="0" y="1290" fill="#7a6c50" font-size="20" text-anchor="middle">進むためでなく、在ること</text>
  </g>

  <!-- (3) 拭く -->
  <g transform="translate(1900,0)">
    <g fill="#15111d">
      <!-- 棚に向かって少し屈む -->
      <path d="M-60,1180 C-58,1020 -36,900 18,800 C44,752 80,738 110,754 C136,768 140,800 126,832 C92,912 56,1020 60,1180 Z"/>
      <circle cx="96" cy="700" r="54"/>
      <!-- 拭く腕 -->
      <path d="M60,824 C120,808 184,800 240,812" stroke="#15111d" stroke-width="36" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 棚と布 -->
    <rect x="208" y="800" width="170" height="14" fill="#9a8b6c"/>
    <rect x="216" y="700" width="156" height="10" fill="#9a8b6c" opacity="0.7"/>
    <ellipse cx="250" cy="806" rx="28" ry="14" fill="#cdbfa0"/>
    <!-- 襷 -->
    <path d="M64,766 L126,860" stroke="#e8a567" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
    <text x="60" y="1250" fill="#3a3020" font-size="30" text-anchor="middle">拭く</text>
    <text x="60" y="1290" fill="#7a6c50" font-size="20" text-anchor="middle">いとなみの朝</text>
  </g>

  <!-- ヘッダ + ノート -->
  <g fill="#2e2718">
    <text x="120" y="160" font-size="64" letter-spacing="8">ナギ</text>
    <text x="124" y="210" font-size="26" fill="#6a5d44" letter-spacing="3">分け前所の番をする organism ── be·here·now パイロット</text>
  </g>
  <g fill="#4a3f2a" font-size="24">
    <text x="1430" y="150">設計メモ:</text>
    <text x="1430" y="192" fill="#6a5d44">・細身/直立を通底させる(tensegrity の体現)。</text>
    <text x="1430" y="228" fill="#6a5d44">・顔は描き込まない(ノードでなく縁を描く規則)。</text>
    <text x="1430" y="264" fill="#6a5d44">・内部線は最小:襷=薄橙(#e8a567=ナギの縁色)+ 籠 のみ。</text>
    <text x="1430" y="300" fill="#6a5d44">・急がない所作。沈黙の間(ま)が似合う。</text>
  </g>
  <!-- パレット -->
  <g>
    <text x="1430" y="1320" fill="#4a3f2a" font-size="24">パレット</text>
    <g>
      <rect x="1430" y="1340" width="70" height="70" fill="#15111d"/><text x="1430" y="1432" fill="#6a5d44" font-size="18">影 #15111d</text>
      <rect x="1530" y="1340" width="70" height="70" fill="#e8a567"/><text x="1530" y="1432" fill="#6a5d44" font-size="18">縁 #e8a567</text>
      <rect x="1630" y="1340" width="70" height="70" fill="#7e93d8"/><text x="1630" y="1432" fill="#6a5d44" font-size="18">藍 #7e93d8</text>
      <rect x="1730" y="1340" width="70" height="70" fill="#e6d9c0"/><text x="1730" y="1432" fill="#6a5d44" font-size="18">地 #e6d9c0</text>
    </g>
  </g>
</svg>
