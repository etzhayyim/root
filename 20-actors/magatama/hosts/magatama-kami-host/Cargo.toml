[package]
name = "magatama-kami-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "KAMI-powered native desktop host scaffold for Magatama WASM apps"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
kami-ui-gpu = { path = "../../../../40-engine/kami-engine/kami-ui-gpu" }
kami-devtools = { path = "../../../../40-engine/kami-engine/kami-devtools" }
kami-input = { path = "../../../../40-engine/kami-engine/kami-input" }
kami-text = { path = "../../../../40-engine/kami-engine/kami-text" }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.33"
pollster = "0.4"
png = "0.18"
wgpu = "24"
winit = "0.29"
