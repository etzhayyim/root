[project]
name = "pymagatama"
version = "0.3.110"
description = "Python runtime SDK for mitama reactive agents (ADR-0049 shared UDF pool)"
requires-python = ">=3.11"
dependencies = [
  # Arrow-based RisingWave External Python UDF framework (ADR-0044).
  # Provides @udf decorator and UdfServer (gRPC/arrow-flight transport).
  # Pinned to 0.3.1: 0.3.2+ changed _string_to_data_type, breaking FLOAT64/DOUBLE PRECISION.
  "arrow-udf==0.3.1",
  # Sync PG wire to RisingWave (arrow-udf handlers can't await async).
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  # LangGraph as library — shinka/koji/kyumei agent loop (ADR-0049 Phase C).
  "langgraph>=0.2.0",
  # Prometheus scrape endpoint on :9090.
  "prometheus-client>=0.21.0",
  # FastAPI + Granian — standard ASGI surface for Python worker pods.
  # Used for in-cluster health/metrics/control endpoints and pod-local HTTP
  # adapters; public XRPC/MCP facades remain in CF Worker / dispatcher.
  "fastapi>=0.115.0",
  "granian>=2.0.0",
  # aiohttp — retained for existing async HTTP clients and legacy dispatcher
  # entrypoints while FastAPI + Granian becomes the worker pod server standard.
  "aiohttp>=3.14.0",
  "nats-py>=2.7.0",  # ADR-2605091700: NATS JetStream fan-out (dispatcher)
  # HTTP client for public source fetches and llm.etzhayyim.com OpenAI-compatible calls.
  # `h2` extra is included so training_run._pod_submit_and_wait can opt into
  # HTTP/2 if the RunPod proxy turns out to fingerprint on TLS/h2 in addition
  # to User-Agent (ADR 2605092345, 2026-05-09 client-side fix follow-up).
  "httpx[http2]>=0.27.0",
  # ADR-0092 L2 — actor embedding (multilingual-e5-small, cpu-only).
  # Pulls torch (cpu), transformers, tokenizers (~600 MB image layer).
  # Only the actor_embed handler imports it; lazy-loaded on first call.
  "sentence-transformers>=3.0.0",
  # ADR-0057 — mangaka pipeline primitives (speech balloon overlay + page
  # composition). Pillow only loaded when the mangaka.* task type fires.
  "Pillow>=11.0.0",
  # ADR-0057 — direct PG INSERT for vertex_mangaka domain rows
  # (records.batchInsertPages). asyncpg is preferred over psycopg in async
  # primitives because it avoids blocking the worker event loop.
  "asyncpg>=0.30.0",
  # H3 geospatial index — maps3d.fetchMapillary uses H3 cell → bbox conversion.
  "h3>=3.7.0",
  # OWL reasoner (ADR-0044 Layer 2): EL++ + OWL DL via HermiT for
  # owl.el.classify / owl.dl.classify / owl.dl.consistency BPMN tasks.
  # Lazy-loaded — only imported when those task types fire.
  "owlready2>=0.46",
  # HuggingFace Hub client — training.push.huggingface LangServer task.
  # Lazy-loaded; only imported when that task type fires.
  "huggingface-hub>=0.23.0",
  # HuggingFace `datasets` — adsk.dataset.ingest streaming reader for
  # parquet datasets (Zero-To-CAD-100k / 1m, dsl_icl_eval-*). Lazy-loaded.
  "datasets>=2.14.0",
  # IVF+PQ batch training (site.ivfPq.* LangServer tasks) and Corpus2Skill
  # K-means distillation. faiss-cpu loaded lazily inside those task handlers.
  "faiss-cpu>=1.8.0",
  "scikit-learn>=1.4.0",
  # Hazelcast Python client — legacy process-mining bridge only.
  "hazelcast-python-client>=5.3.0",
  # SGP4 satellite propagation — N2YO-equivalent visibility passes
  # (satellite.pass.precompute / satellite.pass.compute LangServer tasks).
  # Lazy-loaded; only imported when those task types fire.
  "sgp4>=2.23",
  # ADR-2605070700 Addendum-of-Addendum — heavy GPU deps (peft / accelerate
  # / trl / torch CUDA wheel / lm_eval) live in the **unified RunPod 6000
  # Ada pod image** (`50-infra/runpod/vllm-gemma-image/Dockerfile`,
  # ADR-2605010000) NOT here. The CPU worker pool image
  # (mitama-training-pool) only needs to act as the orchestrator: it POSTs
  # to {pod}/train/run via plain urllib and polls /train/status/{id}.
  # Keeping the CPU image GPU-dep-free shrinks it from ~3 GB to <1 GB and
  # avoids the CUDA wheel cost on every mitama-udf-pool roll.
  # B2 / S3 PUT for chat artifacts (image_gen / file_save / report.compose).
  # Used by `pymagatama.primitives.chat` and `pymagatama.chat_server`.
  # Lazy-loaded; only imported when those code paths fire.
  "boto3>=1.34.0",
  # ADR-2605080200: Pydantic v2 — L6 boundary validation for LangServer
  # input/output, LangGraph BaseModel state, and Anthropic structured output.
  # pydantic-settings is included for env-driven config in worker entrypoints.
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  # ADR-2605080300: SQLAlchemy Core — L6 query building + Alembic engine backend.
  # Core only; ORM / Session / autoflush are not used.
  "sqlalchemy>=2.0.0",
  # LangChain Anthropic — used by newsletter_worker_main + webmk_worker_main
  # (ChatAnthropic LangGraph node). Top-level import so must be in main deps.
  "langchain-anthropic>=0.3.0",
  # LangChain OpenAI — used by pregel.graph classify_intent node (ChatOpenAI
  # pointed at etzhayyim_LLM_URL OpenAI-compatible endpoint).
  "langchain-openai>=0.3.0",
  "openpyxl>=3.1.5",
  "python-docx>=1.2.0",
  # L2 signing (ECDSA + keccak) for EligibilityCell phenotype payload.
  "eth-account>=0.12.0",
  # WebSocket client for MST subscriber (mst.subscribe stream).
  "websockets>=12.0",
  # CBOR2 decoder for MST event serialization (mst.subscribe CBOR packets).
  "cbor2>=5.6.0",
  # LanceDB vector store (mst-projector vector indexing, separate package).
  "lancedb>=0.30.0",
  # MstCheckpointSaver IPC envelope (ADR-2605171800). Tiny pure-msgpack;
  # framing + serde stay Python-side, MST/IPFS/L2 stay in @etzhayyim/sdk.
  "msgpack>=1.1.0",
  # OpenPGP E2EE for cross-provider email encryption (RFC 4880 / RFC 3156 PGP/MIME).
  # Used by pymagatama.primitives.pgp and pymagatama.gewp.
  # Outbound PGP emails are sent as PGP/MIME via Resend SMTP relay (smtp.resend.com:587).
  # pgpy is pure-Python; no GPG binary dependency.
  "pgpy>=0.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]
eligibility = [
  # ADR-2605172300 §3 — EligibilityCell EIP-191 payload construction must
  # produce a byte-identical hash to the on-chain Phenotype.payloadHash.
  # eth-abi + eth-utils give us encode() + keccak() with the exact same
  # semantics as Solidity's abi.encode + keccak256.
  "eth-abi>=5.0.0",
  "eth-utils>=4.0.0",
  # eth-utils delegates keccak to eth-hash, which needs a backend. On
  # Python 3.13+ wheels are spotty for some backends — pycryptodome is
  # the lowest-friction option that ships wheels for all maintained
  # interpreters.
  "pycryptodome>=3.20.0",
  # web3.py — chain RPC + transaction signing for the EligibilityCell
  # production ports (submit_phenotype against Phenotype.setMultiplier
  # on geth-private).
  "web3>=7.0.0",
  "eth-account>=0.13.0",
]
db-tools = [
  # ADR-2605080400: Alembic — Python-owned table migrations only.
  # Scope is limited to LangGraph checkpointer state and SQLMesh state tables.
  # Must NOT touch vertex_* / edge_* / mv_* (Kysely TypeScript scope).
  "alembic>=1.13.0",
  # ADR-2605080500: SQLMesh — MV SQL source of truth and lineage tracking.
  # Replaces Kysely TypeScript for materialized view management (long-term).
  # Heavy dep (~60 MB); lazy-loaded in sqlmesh/* tooling, not in worker hot path.
  "sqlmesh>=0.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
# magatama-cell-runner — Murakumo fleet cell daemon entrypoint (ADR-2605192415 §7.1)
magatama-cell-runner = "pymagatama.cell_runner_main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pymagatama"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `-p no:langsmith_plugin`: langsmith ships a pytest plugin that imports
# pydantic at module-load time. On machines where pydantic-core and
# pydantic versions are out of sync (common on system Python 3.14),
# its autoload crashes pytest collection before any test code runs.
# Pymagatama has langchain-* + pydantic in its dep tree, so this hits
# constantly. We don't use langsmith in tests, so the safest fix is
# to disable that plugin permanently. Ad-hoc alternative: prefix
# invocations with PYTEST_DISABLE_PLUGIN_AUTOLOAD=1.
addopts = "--import-mode=importlib -p no:langsmith_plugin"
