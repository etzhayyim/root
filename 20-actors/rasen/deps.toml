[project]
name = "rasen"
version = "0.1.0"
glyph = "螺旋"
adr = "2606101000"
tier = "B"
status = "R1-public-ingest-live"
description = "Public-genetics (公開遺伝) KG mirror — gene-scale sibling of inochi 命. Hosts PUBLIC reference genetics (genes/variants/phenotypes/pathways + population-AGGREGATE allele frequencies) across humans/animals/plants/microbes in the kotoba Datom log; edge-primary clinical/functional evidence routed to CARE & RESEARCH. Never an individual-genotype registry (G1)."

# Runtime methods are PURE STDLIB (no numpy, no third-party) — so they compile to a
# kotoba pywasm Component via componentize-py (analyze / datom_emit / coverage_report / cid).
# The outward ingest cell (ingest.py) uses only urllib (stdlib) and runs operator/mesh-side.
[dependencies]
# none — Python standard library only (honest: methods import nothing external)

[substrate]
state = "kotoba Datom log (ADR-2605312345)"
schema = "00-contracts/schemas/genome-ontology.kotoba.edn"
inference = "Murakumo-only (ADR-2605215000)"
content_address = "kotoba IPFS CIDv1 raw/sha2-256 (methods/cid.py; ipfs-parity, no daemon)"
large_assets = "DataLad → IPFS (80-data/genome); NO git-lfs"
runtime = "kotoba pywasm actor (componentize-py); ingest runs operator/mesh-side, not in-browser"

[ingest]
gated = "G7 — Council + operator DID for scope expansion beyond the bounded public slice"
sources = ["MyGene.info (Ensembl/NCBI gene reference)", "MyVariant.info (ClinVar + gnomAD aggregate)"]
individual_level = false   # PUBLIC + super-population AGGREGATE only (G1, by construction)
manifest = "data/ingest-sources.edn"

[cells]
analyze = "methods/analyze.py"
datom_emit = "methods/datom_emit.py"
coverage = "methods/coverage_report.py"
ingest = "methods/ingest.py"

[tests]
count = 17
runner = "python3 tests/test_analyze.py && python3 tests/test_coverage.py && python3 tests/test_ingest.py"
network = false   # all tests are network-free (live fetch covered by running ingest.py)
