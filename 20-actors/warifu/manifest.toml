# warifu 割符 — Open Zero-Fee Card (credit + debit) — Tier-B actor manifest
# ADR-2605302000

[actor]
name = "warifu"
kanji = "割符"
gloss = "split tally — two matching halves authenticate a transaction"
tier = "B"
status = "R0"             # R0 scaffold (proposed)
adr = "2605302000"
layer = "20-actors"
charter_rider = "v2.0"    # Apache-2.0 + Charter Compliance Rider v2.0
license = "Apache-2.0"

[purpose]
summary = "Open-source, zero-merchant-fee card payment service (credit + debit), API/wire-compatible with the existing card ecosystem; settles on-chain via USDC on Base L2 + ERC-4337."
labor_axis = "L0..L6 economic-participation membrane over the on-chain settlement substrate"

[economics]
merchant_fee_bps = 0          # 決済手数料ゼロ
network_assessment_bps = 0
interchange_bps = 0
credit_interest_bps = 0       # riba-free / qard hasan
gas_sponsorship = "etzhayyim-paymaster (ERC-4337) <- etzhayyim-public-fund (10% tithe pool)"
loss_mutualisation = "wakai 和会 (ADR-2605263500) — NOT insurance"

[settlement]
chain = "base"                # Base L2
asset = "usdc"
account_model = "erc-4337-smart-account"
finality = "T+0"
router = "50-infra/warifu-contracts/SettlementRouter.sol"

# Payment-purpose allow-list. Phase 1 = SBT<->SBT carve-out only (charter-clean).
# Phase 2 external open-loop is GATED on Council Lv7+ amendment of ADR-2605192115.
[purpose_allowlist]
phase1 = ["internal-purchase", "internal-subscription", "internal-promo", "escrow-refund"]
phase2_gated = ["purchase", "subscription"]   # DISABLED until Lv7+ amendment + vendor-arm bridge
gate = "Council Lv7+ unanimity (ADR-2605192115 amendment) + ADR-2605301036 vendor merchant-of-record"

[compat]
# "全く同じ api 規格" — three drop-in surfaces
surface_a_rest = "stripe-shaped REST (payment_intents/charges/refunds/customers/payment_methods + idempotency + webhooks)"
surface_b_emv  = "EMV applet (ISO 7816 / ISO 14443 + EMV contactless) + ISO 8583 0100/0110 gateway"
surface_c_nfc  = "Host Card Emulation + self Token Service Provider (replaces VTS/MDES); network-tokenized, no raw PAN"

[security]
threed_secure_equiv = "WebAuthn passkey + on-chain attestation (did:web:etzhayyim.com)"
confidentiality = "app.etzhayyim.encrypted.* (XChaCha20-Poly1305 + Signal-wrapped, ADR-2605181100)"
server_key = "none — passkey/smart-account signing only (ADR-2605231525 invariant)"
pci = "network tokenization; raw PAN never stored; merchant SAQ-A-class scope"

[ledger]
engine = "kotoba"             # ADR-2605262130; EAVT, no RisingWave/projection
entities = ["card", "auth_hold", "capture", "settlement", "credit_line", "dispute"]

[[pairs]]   # TIGHT actor pairings
actor = "wakai"
adr = "2605263500"
role = "credit underwriting float + fraud/chargeback loss mutualisation"

[[pairs]]
actor = "toritate"
adr = "2605262900"
role = "100% on-chain accounting + audit"

[[pairs]]
actor = "chigiri"
adr = "2605262700"
role = "dispute / chargeback legal procedure (UPL-prohibited substrate, not a law firm)"

[cells]
dir = "cells/"
list = ["authorize", "capture", "settle", "refund", "dispute"]   # full lifecycle (logic + EAVT shape; substrate edges R1)

[inference]
# Murakumo-only invariant (ADR-2605215000) — no commercial GPU in religious-corp paths
gateway = "litellm 127.0.0.1:4000"
note = "warifu is mostly deterministic settlement; any LLM use (e.g. dispute triage) routes Murakumo-only"
