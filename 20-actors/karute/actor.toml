# karute actor — declarative deployment manifest.
#
# Read by `etzhayyim actor deploy --actor karute` (see 70-tools/etzhayyim-cli/actor.go).
# Per ADR-2605232000 (agent-led autonomous deploy).
#
# Each stage is an executable step (cf-worker / cf-pages / k8s / docker-build /
# cf-tunnel / cmd / smoke). Stages with `require_cap` need a capability JWS
# that includes the listed scopes — agents authorized only for `deploy.cfWorker`
# cannot run the `k8s-pod-apply` stage, for example.

[actor]
name = "karute"
did = "did:web:karute.etzhayyim.com"
nanoid = "karu7t3e"
manifest = "20-actors/karute/actor-manifest.jsonld"
primary_adr = "90-docs/adr/2605231100-karute-emr-phase1.md"

# ── Stage 1: karute DID Worker ────────────────────────────────────────

[[stages]]
name = "did-worker"
description = "Cloudflare Worker serving did:web:karute.etzhayyim.com"
type = "cf-worker"
working_dir = "50-infra/karute-did-web"
command = ["wrangler", "deploy"]
require_cap = ["deploy.cfWorker:karute-did-web"]
on_error = "abort"
dry_run_safe = false

# ── Stage 2: audit DID Worker ─────────────────────────────────────────

[[stages]]
name = "audit-worker"
description = "CF Worker for did:web:audit.etzhayyim.com — substrate-wide audit subject"
type = "cf-worker"
working_dir = "50-infra/audit-did-web"
command = ["wrangler", "deploy"]
depends_on = ["did-worker"]
require_cap = ["deploy.cfWorker:audit-did-web"]
on_error = "abort"
dry_run_safe = false

# ── Stage 3a: lg-karute image build ───────────────────────────────────

[[stages]]
name = "image-build"
description = "Build lg-karute Docker image"
type = "docker-build"
working_dir = "."
command = ["bash", "50-infra/k8s/lg-karute/build.sh", "--push"]
require_cap = ["deploy.docker:lg-karute", "deploy.ghcr:lg-karute"]
on_error = "abort"
dry_run_safe = false

# ── Stage 3b: lg-karute apply ─────────────────────────────────────────

[[stages]]
name = "k8s-pod-apply"
description = "Apply lg-karute Deployment + PVC + Service to mitama-udf namespace"
type = "k8s"
working_dir = "."
command = ["kubectl", "apply", "-f", "50-infra/k8s/lg-karute/deployment.yaml"]
depends_on = ["image-build"]
require_cap = ["deploy.k8s:lg-karute"]
on_error = "abort"
dry_run_safe = false

[[stages]]
name = "k8s-pod-rollout"
description = "Wait for lg-karute rollout to settle"
type = "k8s"
working_dir = "."
command = ["kubectl", "-n", "mitama-udf", "rollout", "status", "deploy/lg-karute", "--timeout=180s"]
depends_on = ["k8s-pod-apply"]
require_cap = ["deploy.k8s:lg-karute"]
on_error = "abort"
dry_run_safe = true

# ── Stage 4: CF Tunnel ────────────────────────────────────────────────

[[stages]]
name = "cf-tunnel-ensure"
description = "Ensure cloudflared tunnel `lg-karute` is created + routed to karu7t3e.etzhayyim.com"
type = "cf-tunnel"
working_dir = "."
command = ["bash", "-c", "cloudflared tunnel list | grep -q lg-karute || (cloudflared tunnel create lg-karute && cloudflared tunnel route dns lg-karute karu7t3e.etzhayyim.com)"]
depends_on = ["k8s-pod-rollout"]
require_cap = ["deploy.cfTunnel:lg-karute"]
on_error = "abort"
dry_run_safe = true

# ── Stage 5: Svelte SuperApp on Cloudflare Pages ─────────────────────

[[stages]]
name = "pages-build"
description = "pnpm build of the Svelte SuperApp"
type = "cmd"
working_dir = "60-apps/etzhayyim-project-karute/appview/etzhayyim-wasm-karute-karu7t3e/svelte"
command = ["pnpm", "build"]
on_error = "abort"
dry_run_safe = true

[[stages]]
name = "pages-deploy"
description = "Deploy dist/ to Cloudflare Pages (project karute)"
type = "cf-pages"
working_dir = "60-apps/etzhayyim-project-karute/appview/etzhayyim-wasm-karute-karu7t3e/svelte"
command = ["wrangler", "pages", "deploy", "dist", "--project-name", "karute", "--branch", "main"]
depends_on = ["pages-build"]
require_cap = ["deploy.pages:karute"]
on_error = "abort"
dry_run_safe = false

# ── Stage 6: lexicon bundle rebuild + smoke ──────────────────────────

[[stages]]
name = "lexicon-bundle"
description = "Rebuild @etzhayyim/lexicons-bundle so the new karute lexicons are picked up"
type = "cmd"
working_dir = "10-protocol/lexicons-bundle"
command = ["node", "scripts/build-bundle.mjs"]
on_error = "abort"
dry_run_safe = true

[[stages]]
name = "smoke"
description = "Curl probes — DID + healthz + XRPC health + static bundle"
type = "smoke"
working_dir = "."
command = ["bash", "-c", "curl -fsS https://karute.etzhayyim.com/.well-known/did.json | jq -e .id && curl -fsS https://karute.etzhayyim.com/healthz | jq -e .ok && curl -fsS -o /dev/null -w '%{http_code}\\n' https://karute.etzhayyim.com/"]
depends_on = ["did-worker", "pages-deploy"]
on_error = "continue"
dry_run_safe = true
