[project]
name = "hakoniwa"
version = "0.1.0"
glyph = "箱庭"
adr = "2606111500"
tier = "B"
status = "R0-design-and-engine"
description = "Forward-simulation observatory — the charter-clean inversion of a swarm-intelligence prediction engine (the 666ghj/MiroFish shape). Runs a CONTAINED miniature world (箱庭) of FICTIONAL latent personas forward via Friedkin-Johnsen dynamics to surface a DISTRIBUTION over possible futures, routed to resilience & preparedness; feeds mitooshi 見通し proper-scoring. Never a point prediction (G2), never a real-person model (G1), never a steering campaign (G3)."

# Runtime methods are PURE STDLIB (no numpy, no third-party) — they compile to a kotoba pywasm
# Component via componentize-py (world / simulate / distribution / datom_emit). The deterministic
# kernel runs in-WASM; the optional LLM-persona variant runs operator/mesh-side (Murakumo-only).
[dependencies]
# none — Python standard library only (hashlib for deterministic seeded jitter; no Math.random)

[substrate]
state = "kotoba Datom log (ADR-2605312345)"
schema = "00-contracts/schemas/hakoniwa-scenario-ontology.kotoba.edn"
inference = "Murakumo-only (ADR-2605215000); swarm rides baien-edge (ADR-2605242600/2605241900)"
output = "mitooshi-shaped :forecast/kind :distribution record (ADR-2606051800); distribution-only (G2)"
runtime = "kotoba pywasm actor (componentize-py); deterministic kernel in-WASM, LLM-persona variant operator/mesh-side"

[gates]
g1_synthetic_only = true     # every persona :persona/synthetic true; no PII; real persons unrepresentable
g2_distribution_only = true  # :forecast/point-asserted structurally false; no point field
g3_non_steering = true       # resilience-only use enum; trade/target/manipulate/campaign unrepresentable
g8_gated = "Council + operator DID for live large-swarm runs, real-entity ingest, any social emission"

[cells]
world = "methods/world.py"
simulate = "methods/simulate.py"
distribution = "methods/distribution.py"
datom_emit = "methods/datom_emit.py"

[tests]
count = 13
runner = "python3 tests/test_simulate.py && python3 tests/test_distribution.py"
network = false   # all tests are network-free + deterministic
