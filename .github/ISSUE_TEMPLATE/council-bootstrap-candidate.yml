name: Bootstrap Council Self-Nomination
description: Self-nominate for one of Bootstrap Council Seats 2-5 (per ADR-2605192300). 30-day window 2026-05-20 → 2026-06-19.
title: "[Council Candidate] Seat <N> — <your handle>"
labels: ["council-bootstrap", "rfp-2026-05-20"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for considering Bootstrap Council service for `etzhayyim`.

        Before submitting, please confirm you have:

        - [ ] Read [ADR-2605192100](../blob/main/90-docs/adr/2605192100-etzhayyim-mission-charter.md) (Mission Charter) in full, including the harder positions (multi-generational priority / anti-individualist ontology / Transparent Religious Force / Eros-permitted-Gore-prohibited / non-eschatology).
        - [ ] Read [CHARTER-RIDER.md](../blob/main/CHARTER-RIDER.md) §2(a)–(h) prohibited categories.
        - [ ] Confirmed you do NOT publicly represent any entity in those categories.
        - [ ] Read [COUNCIL-BOOTSTRAP-RFP.md](../blob/main/COUNCIL-BOOTSTRAP-RFP.md) including the unpaid-service expectation.
        - [ ] Read [ADR-2605192300](../blob/main/90-docs/adr/2605192300-etzhayyim-bootstrap-council-five.md) (Bootstrap Council mechanics).

        Your application becomes a public discussion (linked from this issue) + a PDS AT Record (per the council-candidate-application Lexicon).
  - type: dropdown
    id: seat
    attributes:
      label: Which seat are you applying for?
      options:
        - "Seat 2 — Substrate / Technology"
        - "Seat 3 — Legal / Ethics"
        - "Seat 4 — Economics"
        - "Seat 5 — Stewardship / Land"
    validations:
      required: true
  - type: input
    id: did
    attributes:
      label: Your DID
      description: "did:web:<self> / did:plc:<id> / did:key:<id>"
      placeholder: "did:web:example.com"
    validations:
      required: true
  - type: input
    id: smart-wallet
    attributes:
      label: Your ERC-4337 Smart Wallet address
      description: "0x-prefixed Base L2 Smart Account. Coinbase Smart Wallet recommended."
      placeholder: "0x..."
    validations:
      required: true
  - type: textarea
    id: narrative
    attributes:
      label: Self-introduction narrative
      description: "Why this seat? Why now? Your religious commitment to the Mission Charter. (Public + permanent record.)"
      placeholder: "I am ..."
    validations:
      required: true
  - type: textarea
    id: qualifications
    attributes:
      label: Qualifications + evidence
      description: "Concrete prior work demonstrating you can hold this seat. Include URIs to evidence (publications / contributions / operational records). Markdown list welcome."
      placeholder: |
        - Substrate engineer at <project>, shipped <X>: <link>
        - Solidity audit report on <protocol>: <link>
        - ...
    validations:
      required: true
  - type: textarea
    id: coi
    attributes:
      label: Conflict-of-interest disclosure
      description: "Material conflicts must be declared. Non-disclosure is grounds for objection. If none, write 'none'."
      placeholder: "I am co-founder of <X>, which receives funding from <Y> ..."
    validations:
      required: true
  - type: checkboxes
    id: rider-affirmation
    attributes:
      label: Charter Rider v2.0 §2(a)-(h) affirmation
      description: I affirm that I do NOT publicly represent any entity whose primary business activity (revenue share ≥ 25% trailing 12 months) falls into:
      options:
        - label: "(a) Weapons / military / autonomous lethal systems / paramilitary services"
          required: true
        - label: "(b) Speculative finance / predatory lending (≥36% APR retail) / proprietary HFT"
          required: true
        - label: "(c) Surveillance capitalism / ad-tech DSP-SSP / data brokerage / biometric ID-to-state"
          required: true
        - label: "(d) NEW fossil fuel extraction (initiated after 2026-05-19)"
          required: true
        - label: "(e) Specialist gatekeeping rent-extraction in law / medicine / government administration"
          required: true
        - label: "(f) Multi-generational harm (≥25-year irreversible damage to descendants)"
          required: true
        - label: "(g) Strict individualist doctrinal organizations (Objectivist / strict-libertarian)"
          required: true
        - label: "(h) Wellbecoming-subordination products (addictive design / financialization of basic needs / cognitive-sovereignty-violating AI deployment)"
          required: true
  - type: input
    id: at-record-uri
    attributes:
      label: AT Record URI (optional but strongly preferred)
      description: "AT URI of your com.etzhayyim.apps.etzhayyim.council-candidate-application record. If you do not have a PDS yet, ok to skip — we will help."
      placeholder: "at://did:plc:.../com.etzhayyim.apps.etzhayyim.council-candidate-application/..."
  - type: checkboxes
    id: time-commitment
    attributes:
      label: Time commitment acknowledgment
      description: ""
      options:
        - label: "I acknowledge Council service is UNPAID and requires approximately 2-8 hours/week"
          required: true
        - label: "I acknowledge Bootstrap Council sunsets within 12 months (Phase 2 ADR transitions to 1 SBT = 1 vote election)"
          required: true
