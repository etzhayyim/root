name: docs-graph-jsonld-freshness

# Verify 90-docs/_registry/graph.jsonld stays in sync with the docs.json
# sidecar (which is itself in sync with the .md source-of-truth via
# docs-registry-freshness.yml).
#
# Chain: .md → docs.json → graph.jsonld
#
# Catches operators editing docs.json (intentionally or via the upstream
# docs-registry-freshness hook) without re-projecting the JSON-LD
# relation graph. Parallel pattern to deps-toml-paths.yml +
# docs-registry-freshness.yml (ADR-2605271100 closure cycle 49).
#
# Per 90-docs/CLAUDE.md "Documentation System Rules":
#   - Markdown 本文が canonical source
#   - docs.json is the normalized JSON sidecar
#   - graph.jsonld is the typed relation graph (this workflow guards it)
# This workflow enforces "正本 1 つを registry で指す" mechanically for
# the JSON-LD projection.

on:
  push:
    branches: [main]
    paths:
      - '90-docs/**/*.md'
      - '90-docs/_registry/docs.json'
      - '90-docs/_registry/graph.jsonld'
      - '70-tools/scripts/docs/regen-graph-jsonld.py'
      - '.github/workflows/docs-graph-jsonld-freshness.yml'
  pull_request:
    branches: [main]
    paths:
      - '90-docs/**/*.md'
      - '90-docs/_registry/docs.json'
      - '90-docs/_registry/graph.jsonld'
      - '70-tools/scripts/docs/regen-graph-jsonld.py'
      - '.github/workflows/docs-graph-jsonld-freshness.yml'
  schedule:
    # Nightly at 03:29 UTC = ~12:29 JST. Off-minute :29 (different from
    # docs-registry-freshness' :23 and deps-toml-paths' :17) for runner
    # load spread.
    - cron: '29 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: docs-graph-jsonld-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run generator unit tests (cycle 56; 8/8 must pass)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python3 -m pytest \
            70-tools/scripts/docs/test_regen_graph_jsonld.py \
            -v

      - name: Check graph.jsonld freshness (PR gate)
        run: |
          python3 70-tools/scripts/docs/regen-graph-jsonld.py --check \
            | tee /tmp/graph-check.log
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            echo ""
            echo "✘ graph.jsonld is out of sync with docs.json projection."
            echo "  Fix: run the regenerator and stage the updated graph:"
            echo "    python3 70-tools/scripts/docs/regen-graph-jsonld.py"
            echo "    git add 90-docs/_registry/graph.jsonld"
            echo ""
            echo "  Note: graph.jsonld is generated FROM docs.json, so if"
            echo "  docs.json itself is stale (docs-registry-freshness fails),"
            echo "  fix that first — both regenerators are idempotent and the"
            echo "  chain is .md → docs.json → graph.jsonld."
            exit "$exit_code"
          fi
          echo "✓ graph.jsonld in sync"

      - name: Step summary
        if: always()
        run: |
          if [ -f 90-docs/_registry/graph.jsonld ]; then
            nodes=$(python3 -c "import json; print(len(json.load(open('90-docs/_registry/graph.jsonld'))['@graph']))")
            relations=$(python3 -c "
          import json
          g = json.load(open('90-docs/_registry/graph.jsonld'))['@graph']
          n = sum(1 for x in g if x.get('related') or x.get('supersedes') or x.get('supersededBy') or x.get('amends') or x.get('amendedBy'))
          print(n)
          ")
            {
              echo "## 90-docs/_registry/graph.jsonld"
              echo ""
              echo "- **Total nodes**: ${nodes}"
              echo "- **Nodes with relations**: ${relations}"
              echo ""
              echo "Baseline as of ADR-2605271100 closure cycle 49 (2026-05-27):"
              echo "  - 657 nodes (full docs.json projection; was 76 pre-regen)"
              echo "  - 565 nodes with at least one typed relation"
              echo "  - Generator: \`70-tools/scripts/docs/regen-graph-jsonld.py\`"
              echo "  - Idempotent: sorted by \`id\`; full entries-only comparison"
              echo "  - Source: docs.json (which is regenerated from .md)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
