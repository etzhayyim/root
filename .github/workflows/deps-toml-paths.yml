name: deps-toml-paths

# Verify every `[[adrs]]` + `[[modules]]` `path` in deps.toml resolves to
# an existing file/dir under the repo root. Catches orphan book-keeping
# entries from renames / refactors / parallel-agent drift.
#
# Two modes:
#   1. **Strict-scoped (PR-gate)** — only checks ADR-2605262500 entries.
#      That scope was the source of the verifier itself (cycles 27-28)
#      and is currently 100% clean. Failure here = real regression
#      introduced by THIS PR. → PR blocked.
#
#   2. **Full-repo (nightly + summary)** — checks every entry. Baseline
#      as of cycle 46-47 (ADR-2605271100 closure, 2026-05-27): 573/588
#      resolve + 15 accepted-reserved (3 tatekata + 12 owner-asserted
#      with (reserved) or (deferred-rename) markers) + 0 bare drift.
#      Reports count in job summary; cycle 46 marker convention means
#      any new bare missing path (no marker) fails CI.
#
# Both modes also run the 17 unit tests for the verifier itself (cycle 46
# expanded from 10 to 17 tests covering marker semantics).

on:
  push:
    branches: [main]
    paths:
      - 'deps.toml'
      - '70-tools/scripts/lint/verify_deps_toml_paths.py'
      - '70-tools/scripts/lint/test_verify_deps_toml_paths.py'
      - '.github/workflows/deps-toml-paths.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deps.toml'
      - '70-tools/scripts/lint/verify_deps_toml_paths.py'
      - '70-tools/scripts/lint/test_verify_deps_toml_paths.py'
      - '.github/workflows/deps-toml-paths.yml'
  schedule:
    # Nightly at 03:17 UTC = ~12:17 JST (off-peak both regions).
    # Off-minute :17 to avoid the bandwidth-saturating top-of-hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: deps-toml-paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout kami-engine submodule (recursive — incl. nested kami-engine-sdk)
        # deps.toml references kami-engine-internal paths (e.g. the sdk's
        # IsekaiCanvas.svelte). kami-engine is now a git-submodule
        # (ADR-2606011500 stage 4) with kami-engine-sdk nested inside it, so
        # init kami-engine --recursive to resolve those paths. Targeted (not a
        # blanket `submodules: recursive`, which chokes on the local-only
        # baien/datasets superdataset).
        # NOTE: pre-existing full-repo drift remains (kotoba module entries:
        # a homebrew formula / launchd plist / GH URL that are not files, plus
        # kotoba's own un-inited submodule path) — unchanged by this PR.
        run: git submodule update --init --recursive --depth=1 40-engine/kami-engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run verifier unit tests (strict — 17/17 must pass)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python3 -m pytest \
            70-tools/scripts/lint/test_verify_deps_toml_paths.py \
            -v

      - name: Strict-scoped audit (ADR-2605262500) — PR gate
        run: |
          python3 70-tools/scripts/lint/verify_deps_toml_paths.py \
            --filter ADR-2605262500 \
            | tee /tmp/strict-audit.log
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            echo ""
            echo "✘ ADR-2605262500 path audit FAILED — this PR introduces drift in"
            echo "  the ADR-2605262500 deps.toml scope. Either restore the missing"
            echo "  file(s) or remove the orphan entries before merging."
            exit "$exit_code"
          fi
          echo "✓ ADR-2605262500 path audit clean"

      - name: Full-repo audit (non-strict, baseline tracker)
        run: |
          # Non-strict tracker: the verifier exits 1 when it finds drift, but
          # this step only REPORTS drift in the job summary — the strict-scoped
          # step above is the real PR gate. Capture the exit code without
          # letting `bash -e` abort the step (the prior code put `full_exit=$?`
          # on the next line, which `set -e` never reached on drift).
          full_exit=0
          python3 70-tools/scripts/lint/verify_deps_toml_paths.py \
            --json > /tmp/full-audit.json || full_exit=$?

          ok=$(python3 -c "import json; print(json.load(open('/tmp/full-audit.json'))['ok'])")
          total=$(python3 -c "import json; print(json.load(open('/tmp/full-audit.json'))['total'])")
          drift=$(python3 -c "import json; print(json.load(open('/tmp/full-audit.json'))['drift_count'])")
          accepted=$(python3 -c "import json; print(json.load(open('/tmp/full-audit.json'))['accepted_missing_count'])")
          stale=$(python3 -c "import json; print(json.load(open('/tmp/full-audit.json'))['stale_marker_count'])")

          {
            echo "## deps.toml path audit"
            echo ""
            echo "**${ok} / ${total} entries resolve**"
            echo ""
            echo "- Accepted-reserved (owner-asserted, not drift): **${accepted}**"
            echo "- Stale-marker (path exists, suffix should be dropped): **${stale}**"
            echo "- Bare drift (real CI gate): **${drift}**"
            echo ""
            echo "Baseline as of ADR-2605271100 closure (2026-05-27 cycle 46-47):"
            echo "  - 573/588 resolve"
            echo "  - 15 accepted-reserved (3 tatekata + 12 owner-asserted markers)"
            echo "  - 0 bare drift"
            echo ""
            if [ "$drift" -gt 0 ]; then
              echo "⚠️ Bare drift count **above baseline (0)** — new orphan(s) introduced without a (reserved) marker."
              echo ""
              echo "Drift entries:"
              echo '```json'
              python3 -c "import json; d = json.load(open('/tmp/full-audit.json'))['drift']; print(json.dumps(d, indent=2))"
              echo '```'
            elif [ "$stale" -gt 0 ]; then
              echo "ℹ️ ${stale} stale marker(s) — operator should drop the suffix:"
              echo '```json'
              python3 -c "import json; s = json.load(open('/tmp/full-audit.json'))['stale_markers']; print(json.dumps(s, indent=2))"
              echo '```'
            else
              echo "✓ Drift count matches baseline (0). No new orphans."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
