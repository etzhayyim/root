name: deps-toml-paths

# Verify every `[[adrs]]` + `[[modules]]` `path` in deps.toml resolves to
# an existing file/dir under the repo root. Catches orphan book-keeping
# entries from renames / refactors / parallel-agent drift.
#
# Two modes:
#   1. **Strict-scoped (PR-gate)** — only checks ADR-2605262500 entries.
#      That scope was the source of the verifier itself (cycles 27-28)
#      and is currently 100% clean. Failure here = real regression
#      introduced by THIS PR. → PR blocked.
#
#   2. **Full-repo (nightly + summary)** — checks every entry. Baseline
#      as of 2026-05-27: 492/507 resolve (15 known drifts from
#      tatekata reserved ADRs + ADR-2605180900 / 192415 / 250700 /
#      261600 / 262100 / 262400 orphans). Reports count in job
#      summary; non-blocking until those drifts are owner-resolved
#      via cross-ADR cleanup PR.
#
# Both modes also run the 10 unit tests for the verifier itself.

on:
  push:
    branches: [main]
    paths:
      - 'deps.toml'
      - '70-tools/scripts/lint/verify_deps_toml_paths.py'
      - '70-tools/scripts/lint/test_verify_deps_toml_paths.py'
      - '.github/workflows/deps-toml-paths.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deps.toml'
      - '70-tools/scripts/lint/verify_deps_toml_paths.py'
      - '70-tools/scripts/lint/test_verify_deps_toml_paths.py'
      - '.github/workflows/deps-toml-paths.yml'
  schedule:
    # Nightly at 03:17 UTC = ~12:17 JST (off-peak both regions).
    # Off-minute :17 to avoid the bandwidth-saturating top-of-hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: deps-toml-paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run verifier unit tests (strict — 10/10 must pass)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python3 -m pytest \
            70-tools/scripts/lint/test_verify_deps_toml_paths.py \
            -v

      - name: Strict-scoped audit (ADR-2605262500) — PR gate
        run: |
          python3 70-tools/scripts/lint/verify_deps_toml_paths.py \
            --filter ADR-2605262500 \
            | tee /tmp/strict-audit.log
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            echo ""
            echo "✘ ADR-2605262500 path audit FAILED — this PR introduces drift in"
            echo "  the ADR-2605262500 deps.toml scope. Either restore the missing"
            echo "  file(s) or remove the orphan entries before merging."
            exit "$exit_code"
          fi
          echo "✓ ADR-2605262500 path audit clean"

      - name: Full-repo audit (non-strict, baseline tracker)
        run: |
          python3 70-tools/scripts/lint/verify_deps_toml_paths.py \
            --json > /tmp/full-audit.json
          full_exit=$?

          ok=$(python3 -c "import json; print(json.load(open('/tmp/full-audit.json'))['ok'])")
          total=$(python3 -c "import json; print(json.load(open('/tmp/full-audit.json'))['total'])")
          missing=$(python3 -c "import json; print(json.load(open('/tmp/full-audit.json'))['missing_count'])")

          {
            echo "## deps.toml path audit"
            echo ""
            echo "**${ok} / ${total} entries resolve** (missing: ${missing})"
            echo ""
            echo "Baseline as of cycle-27 verifier landing (2026-05-27):"
            echo "  - 492/507 resolve"
            echo "  - 15 known drifts (3 tatekata reserved + 12 cross-ADR orphans)"
            echo ""
            if [ "$missing" -gt 15 ]; then
              echo "⚠️ Drift count **above baseline (15)** — new orphan(s) introduced."
              echo ""
              echo "Missing entries:"
              echo '```json'
              python3 -c "import json; m = json.load(open('/tmp/full-audit.json'))['missing']; print(json.dumps(m, indent=2))"
              echo '```'
            elif [ "$missing" -lt 15 ]; then
              echo "✅ Drift count **below baseline** — drift was resolved. Update baseline."
            else
              echo "✓ Drift count matches baseline. No new orphans."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
