name: test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vitest:
    name: vitest (${{ matrix.actor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        actor:
          - open-banking
          - hanrei
          - ipaddress
          - sbom
          - kiyo
          - ki
          - koke
          - hakkou
          - otakiage
          - houki
          - houbun
          - isin
          - isbn
          - gtin
          - dns
          - ndc
          - ocel
          - houshi
          - anime
          - manga
          - narou
          - gameka
          - bpmn
          - open-denki
          - yoro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install deps
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Run vitest
        working-directory: 60-apps/ai-gftd-project-${{ matrix.actor }}/rw-free
        run: pnpm test --reporter=verbose

  tsc:
    name: tsc (${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope:
          - 20-actors/etzhayyim-sdk-mock
          - 20-actors/etzhayyim-sdk-auth
          - 20-actors/mst-projector
          - 70-tools/lexicon-to-openapi
          - 70-tools/integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm@10
      - name: Install deps
        run: pnpm install --frozen-lockfile || pnpm install
      - name: tsc --noEmit
        working-directory: ${{ matrix.scope }}
        run: npx tsc --noEmit

  integration:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm@10
      - name: Install deps
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Run Phase H suite
        working-directory: 70-tools/integration-tests
        run: pnpm test --reporter=verbose
