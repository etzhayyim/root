name: test
# Path-scoped (ADR-2605302355 CI review): this matrix builds @etzhayyim/sdk and
# runs the rw-free vitest / tsc / integration suites. It only needs to run when
# the SDK or those JS packages change — docs / Rust / Python / lexicon-only PRs
# (e.g. the kotoba-WASM legal-services work) must not be gated by it. Known
# pre-existing break: the incomplete libsignal→XChaCha20 migration in
# src/encrypted.ts (commit a590e7f64) fails `@etzhayyim/sdk build`; that is a
# real SDK issue tracked separately, not a per-package regression.
on:
  pull_request:
    branches: [main]
    paths:
      - "20-actors/etzhayyim-sdk/**"
      - "20-actors/etzhayyim-sdk-mock/**"
      - "20-actors/etzhayyim-sdk-auth/**"
      - "50-infra/mst-projector/**"
      - "60-apps/etzhayyim-project-*/rw-free/**"
      - "70-tools/lexicon-to-openapi/**"
      - "70-tools/integration-tests/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "20-actors/etzhayyim-sdk/**"
      - "20-actors/etzhayyim-sdk-mock/**"
      - "20-actors/etzhayyim-sdk-auth/**"
      - "50-infra/mst-projector/**"
      - "60-apps/etzhayyim-project-*/rw-free/**"
      - "70-tools/lexicon-to-openapi/**"
      - "70-tools/integration-tests/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  vitest:
    name: vitest (${{ matrix.actor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        actor:
          - open-banking
          - hanrei
          - ipaddress
          - sbom
          - kiyo
          - ki
          - koke
          - hakkou
          - otakiage
          - houki
          - houbun
          - isin
          - isbn
          - gtin
          - dns
          - ndc
          - ocel
          - houshi
          - anime
          - manga
          - narou
          - gameka
          - bpmn
          - open-denki
          - yoro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install deps
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Build @etzhayyim/sdk
        run: pnpm -F @etzhayyim/sdk build
      - name: Run vitest
        working-directory: 60-apps/etzhayyim-project-${{ matrix.actor }}/rw-free
        run: pnpm test --reporter=verbose

  tsc:
    name: tsc (${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope:
          - 20-actors/etzhayyim-sdk-mock
          - 20-actors/etzhayyim-sdk-auth
          - 20-actors/mst-projector
          - 70-tools/lexicon-to-openapi
          - 70-tools/integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm@10
      - name: Install deps
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Build @etzhayyim/sdk
        run: pnpm -F @etzhayyim/sdk build
      - name: tsc --noEmit
        working-directory: ${{ matrix.scope }}
        run: pnpm exec tsc --noEmit

  integration:
    name: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm@10
      - name: Install deps
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Build @etzhayyim/sdk
        run: pnpm -F @etzhayyim/sdk build
      - name: Run Phase H suite
        working-directory: 70-tools/integration-tests
        run: pnpm test --reporter=verbose

  sdk-test:
    # Moved here from ci.yml so the SDK's own vitest suite is path-scoped to SDK
    # changes (was previously red-lighting every PR via the always-on CI job).
    # NOTE: currently fails on the known incomplete libsignal→XChaCha20 migration
    # in src/encrypted.ts (a590e7f64) — a real SDK issue, tracked separately.
    name: sdk-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test etzhayyim-sdk
        working-directory: 20-actors/etzhayyim-sdk
        run: |
          npm install
          npm run test
