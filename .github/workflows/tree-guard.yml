name: tree-guard

# Post-#1680 structural guards (incident analysis 2026-06-12).
#
# PR #1680 was meant as a one-line kotoba submodule pin bump but its branch
# tree contained ONLY 40-engine — merging it deleted 77,504 files from main,
# and every CI workflow stayed GREEN because they are all path-triggered:
# nothing fires on a tree that no longer contains the trigger paths. main was
# restored by #1682. The same analysis also found two ORPHAN submodule pins on
# main (98f9d2b3fd @ 06-08, 46e0bdaa6a @ 06-11 — commits that do not exist on
# the kotoba remote, so `git submodule update` at those states fails forever)
# and one pin REGRESSION (#1403 re-pinned 40930cd4, un-pinning d7941966).
#
# This workflow therefore has NO path filter ON PURPOSE — it must run on
# every PR and every push to main, especially the ones that delete things.
#
#   1. sentinel-files   — load-bearing files/dirs must exist in the merged
#                         tree (catches the #1680 class).
#   2. submodule-pins   — every engine-submodule gitlink must point to a
#                         commit that EXISTS on its upstream remote; when a
#                         PR moves a pin, the new pin must be a DESCENDANT
#                         of the base branch's pin (no regressions, no
#                         parallel-history pin swaps). A pre-existing orphan
#                         base pin downgrades the ancestry check to a warning
#                         (a PR cannot be blamed for history it didn't write).
#   3. mass-deletion    — a PR deleting more than 3000 files fails unless its
#                         title contains [mass-delete-ok]; deliberate
#                         migrations opt in explicitly (#1637 toml→edn was
#                         1,043 files — well under).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tree-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: sentinel files exist
        run: |
          fail=0
          for f in deps.edn CLAUDE.md CHARTER-RIDER.md LICENSE LANDS.md MEMBERS.md \
                   90-docs/adr/README.md 90-docs/_registry/docs.json .gitmodules \
                   00-contracts 10-protocol 20-actors 30-graph 50-infra 60-apps 70-tools 90-docs; do
            if [ ! -e "$f" ]; then
              echo "::error::sentinel missing from merged tree: $f"
              fail=1
            fi
          done
          if [ "$fail" != 0 ]; then
            echo "::error::the merged tree is missing load-bearing files — this is the #1680 tree-wipe signature. Refusing."
            exit 1
          fi
          echo "all sentinels present"

      - name: submodule pins exist upstream and never regress
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          overall=0
          for path in 40-engine/kotoba 40-engine/kami-engine; do
            url=$(git config -f .gitmodules "submodule.$path.url" || true)
            if [ -z "$url" ]; then
              echo "::warning::no .gitmodules entry for $path — skipped"
              continue
            fi
            pin=$(git ls-tree HEAD "$path" | awk '$2=="commit"{print $3}')
            if [ -z "$pin" ]; then
              echo "::error::$path has no gitlink in the merged tree"
              overall=1
              continue
            fi
            tmp=$(mktemp -d)
            git init -q "$tmp"
            # GitHub serves any reachable SHA (allowAnySHA1InWant), so a failed
            # fetch of the exact pin means the commit is NOT on the remote.
            if ! git -C "$tmp" fetch -q "$url" "$pin" 2>/dev/null; then
              echo "::error::$path pin $pin does not exist on $url — an orphan gitlink permanently breaks 'git submodule update' for this commit (the 98f9d2b3fd / 46e0bdaa6a failure mode)"
              overall=1
              rm -rf "$tmp"
              continue
            fi
            echo "$path pin $pin exists on $url"
            # Monotonicity (PR only): if this PR moves the pin, the new pin
            # must descend from the base branch's pin.
            if [ -n "$BASE_SHA" ]; then
              base_pin=$(git ls-tree "$BASE_SHA" "$path" 2>/dev/null | awk '$2=="commit"{print $3}')
              if [ -n "$base_pin" ] && [ "$base_pin" != "$pin" ]; then
                if ! git -C "$tmp" fetch -q "$url" "$base_pin" 2>/dev/null; then
                  echo "::warning::$path base pin $base_pin is itself absent from $url (pre-existing orphan) — ancestry check skipped"
                elif git -C "$tmp" merge-base --is-ancestor "$base_pin" "$pin"; then
                  echo "$path pin moves forward: $base_pin → $pin"
                else
                  echo "::error::$path pin moves to $pin which does NOT descend from the base pin $base_pin — this is a pin regression / parallel-history swap (the #1403 failure mode). Rebase the submodule bump onto the current upstream history."
                  overall=1
                fi
              fi
            fi
            rm -rf "$tmp"
          done
          exit $overall

      - name: mass-deletion alarm
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          deleted=$(git diff --name-only --diff-filter=D "$BASE_SHA"...HEAD | wc -l | tr -d ' ')
          echo "files deleted by this PR: $deleted"
          if [ "$deleted" -gt 3000 ]; then
            case "$PR_TITLE" in
              *"[mass-delete-ok]"*)
                echo "::warning::$deleted files deleted — explicitly opted in via [mass-delete-ok]"
                ;;
              *)
                echo "::error::this PR deletes $deleted files (>3000). If this is a deliberate migration, add [mass-delete-ok] to the PR title; otherwise the branch tree is probably missing content it never meant to delete (the #1680 failure mode)."
                exit 1
                ;;
            esac
          fi
