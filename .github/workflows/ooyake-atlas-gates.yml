name: ooyake-atlas-gates

# CI gate for the ooyake (公) world-government atlas per ADR-2606021600.
#
# Runs the actor's offline gate suite (20-actors/ooyake/deploy/run_tests.sh) on any
# change to the atlas. The suite institutionalises everything built into the atlas:
#   • check_seed_integrity.py — QID uniqueness/format, level/branch/sourcing enums
#     (mirroring the ontology), G5 provenance, address→unit + parent ref resolution
#   • integrity-guard self-tests (fires on synthetic duplicate/malformed/dangling)
#   • g20_coverage.py / world_coverage.py — coverage floors (regression guard)
#   • coverage_matrix.py — per-country functional coverage
#   • quality_audit.py — flags sub-national / historical mis-typings of national bodies
#   • export_geojson.py --check — derivable map is valid (>=4000 features)
#   • reconcile cell + the deploy read-side suites
#
# Two-layer defense (lefthook pre-commit + this PR-level CI) per the registry
# enforcement matrix (ADR-2605271200). Read-only; offline; no network, no secrets.

on:
  push:
    branches: [main]
    paths:
      - '20-actors/ooyake/**'
      - '00-contracts/schemas/gov-atlas-ontology.kotoba.edn'
      - '.github/workflows/ooyake-atlas-gates.yml'
  pull_request:
    branches: [main]
    paths:
      - '20-actors/ooyake/**'
      - '00-contracts/schemas/gov-atlas-ontology.kotoba.edn'
      - '.github/workflows/ooyake-atlas-gates.yml'
  schedule:
    # Nightly at 04:17 UTC (~13:17 JST). Off-minute :17 to deconflict with the
    # other nightly actor audits (kawase :05, etc.).
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-gates:
    name: gov-atlas integrity + coverage + quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the ooyake offline gate suite
        run: bash 20-actors/ooyake/deploy/run_tests.sh

      - name: Registry integrity (explicit, fail-loud)
        run: python3 20-actors/ooyake/scripts/check_seed_integrity.py

      - name: Quality audit (sub-national / historical mis-typings)
        run: python3 20-actors/ooyake/scripts/quality_audit.py

      - name: GeoJSON export validates
        run: python3 20-actors/ooyake/scripts/export_geojson.py --check
