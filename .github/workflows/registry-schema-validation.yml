name: registry-schema-validation

# Validate 90-docs/_registry/docs.json against docs.schema.json AND
# 90-docs/_registry/graph.jsonld against graph.schema.json.
#
# Fourth axis of registry enforcement (ADR-2605271100 closure cycle 50).
# Parallel pattern to cycles 27-30 deps-toml-paths.yml + cycle 48
# docs-registry-freshness.yml + cycle 49 docs-graph-jsonld-freshness.yml.
#
# **Cycle 51 mode: PR-GATE** (promoted from cycle 50's nightly-tracker
# baseline). Cycle 51 cleaned all 32 baseline .md front-matter
# violations (4 missing topic + 1 garbage last_verified + 27 empty
# related strings + others). Baseline = 0; ANY new schema violation
# fails CI.
#
# Source chain (all 4 layers):
#   .md → docs.json → graph.jsonld
#               ↓             ↓
#        docs.schema.json   graph.schema.json
#        (this workflow)
#
# Per 90-docs/CLAUDE.md "Documentation System Rules" — enforces
# normalized JSON shape conformance in addition to freshness.

on:
  push:
    branches: [main]
    paths:
      - '90-docs/_registry/docs.json'
      - '90-docs/_registry/graph.jsonld'
      - '90-docs/_registry/schemas/docs.schema.json'
      - '90-docs/_registry/schemas/graph.schema.json'
      - '70-tools/scripts/docs/validate-registry-schemas.py'
      - '.github/workflows/registry-schema-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - '90-docs/_registry/docs.json'
      - '90-docs/_registry/graph.jsonld'
      - '90-docs/_registry/schemas/docs.schema.json'
      - '90-docs/_registry/schemas/graph.schema.json'
      - '70-tools/scripts/docs/validate-registry-schemas.py'
      - '.github/workflows/registry-schema-validation.yml'
  schedule:
    # Nightly at 03:35 UTC = ~12:35 JST. Off-minute :35 (different from
    # docs-graph-jsonld :29 / docs-registry :23 / deps-toml :17) for
    # runner load spread across the 4 axes.
    - cron: '35 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: registry-schema-validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jsonschema + pytest
        run: pip install jsonschema pytest

      - name: Run validator unit tests (cycle 56; 6/6 must pass)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python3 -m pytest \
            70-tools/scripts/docs/test_validate_registry_schemas.py \
            -v

      - name: Validate registry artifacts (PR-gate — fail on any violation)
        id: validate
        run: |
          python3 70-tools/scripts/docs/validate-registry-schemas.py \
            --strict --json > /tmp/validation.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat /tmp/validation.json
          exit $rc

      - name: Step summary
        if: always()
        run: |
          if [ -f /tmp/validation.json ]; then
            docs_errors=$(python3 -c "import json; print(json.load(open('/tmp/validation.json'))['docs']['error_count'])")
            graph_errors=$(python3 -c "import json; print(json.load(open('/tmp/validation.json'))['graph']['error_count'])")
            total=$((docs_errors + graph_errors))
            {
              echo "## Registry schema validation"
              echo ""
              echo "- **docs.json errors**: ${docs_errors}"
              echo "- **graph.jsonld errors**: ${graph_errors}"
              echo "- **Total**: ${total}"
              echo ""
              echo "Baseline as of ADR-2605271100 closure cycle 51 (2026-05-27):"
              echo "  - 0 docs.json errors (all 31 baseline violations cleaned in cycle 51)"
              echo "  - 0 graph.jsonld errors (1 garbage-lastVerified cleaned)"
              echo "  - **PR-GATE mode**: any new violation fails CI"
              echo ""
              if [ "$total" -gt 0 ]; then
                echo "⚠️ **${total} schema violation(s)** — PR is blocked."
                echo ""
                echo "Schema errors detail:"
                echo '```json'
                cat /tmp/validation.json
                echo '```'
                echo ""
                echo "Fix: edit the .md front-matter to match docs.schema.json /"
                echo "graph.schema.json. Run locally:"
                echo "  python3 70-tools/scripts/docs/validate-registry-schemas.py"
              else
                echo "✓ All registry artifacts are schema-valid."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Validation skipped (no JSON output produced)" >> "$GITHUB_STEP_SUMMARY"
          fi
