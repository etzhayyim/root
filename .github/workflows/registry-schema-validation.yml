name: registry-schema-validation

# Validate 90-docs/_registry/docs.json against docs.schema.json AND
# 90-docs/_registry/graph.jsonld against graph.schema.json.
#
# Fourth axis of registry enforcement (ADR-2605271100 closure cycle 50).
# Parallel pattern to cycles 27-30 deps-toml-paths.yml + cycle 48
# docs-registry-freshness.yml + cycle 49 docs-graph-jsonld-freshness.yml.
#
# **Initial cycle 50 mode: NIGHTLY TRACKER (not PR-gate)** — same pattern
# as the cycle-30 deps-toml-paths full-repo step. Reports current
# validation error count in GitHub Actions step summary. Will be
# promoted to PR-gate after the known-violations baseline (32 errors
# as of cycle 50 — see step summary breakdown) is cleaned up in
# follow-on .md front-matter fix cycles.
#
# Source chain (all 4 layers):
#   .md → docs.json → graph.jsonld
#               ↓             ↓
#        docs.schema.json   graph.schema.json
#        (this workflow)
#
# Per 90-docs/CLAUDE.md "Documentation System Rules" — enforces
# normalized JSON shape conformance in addition to freshness.

on:
  push:
    branches: [main]
    paths:
      - '90-docs/_registry/docs.json'
      - '90-docs/_registry/graph.jsonld'
      - '90-docs/_registry/schemas/docs.schema.json'
      - '90-docs/_registry/schemas/graph.schema.json'
      - '70-tools/scripts/docs/validate-registry-schemas.py'
      - '.github/workflows/registry-schema-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - '90-docs/_registry/docs.json'
      - '90-docs/_registry/graph.jsonld'
      - '90-docs/_registry/schemas/docs.schema.json'
      - '90-docs/_registry/schemas/graph.schema.json'
      - '70-tools/scripts/docs/validate-registry-schemas.py'
      - '.github/workflows/registry-schema-validation.yml'
  schedule:
    # Nightly at 03:35 UTC = ~12:35 JST. Off-minute :35 (different from
    # docs-graph-jsonld :29 / docs-registry :23 / deps-toml :17) for
    # runner load spread across the 4 axes.
    - cron: '35 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: registry-schema-validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate registry artifacts (strict — fail on jsonschema unavailable)
        id: validate
        run: |
          python3 70-tools/scripts/docs/validate-registry-schemas.py \
            --strict --json > /tmp/validation.json
          rc=$?
          cp /tmp/validation.json /tmp/validation-public.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat /tmp/validation.json
        continue-on-error: true

      - name: Step summary
        if: always()
        run: |
          if [ -f /tmp/validation.json ]; then
            docs_errors=$(python3 -c "import json; print(json.load(open('/tmp/validation.json'))['docs']['error_count'])")
            graph_errors=$(python3 -c "import json; print(json.load(open('/tmp/validation.json'))['graph']['error_count'])")
            total=$((docs_errors + graph_errors))
            {
              echo "## Registry schema validation"
              echo ""
              echo "- **docs.json errors**: ${docs_errors}"
              echo "- **graph.jsonld errors**: ${graph_errors}"
              echo "- **Total**: ${total}"
              echo ""
              echo "Baseline as of ADR-2605271100 closure cycle 50 (2026-05-27):"
              echo "  - 31 docs.json errors (4 missing topic + 27 related-empty-strings + 0 last_verified after cycle 50 schema fix)"
              echo "  - 1 graph.jsonld error (1 free-form annotation in lastVerified)"
              echo "  - Total: 32 known violations in 5-6 .md front-matter sources"
              echo ""
              if [ "$total" -gt 32 ]; then
                echo "⚠️ Total errors **above baseline (32)** — new violation(s) introduced."
                echo ""
                echo "Schema errors detail:"
                echo '```json'
                cat /tmp/validation.json
                echo '```'
              elif [ "$total" -lt 32 ]; then
                echo "✅ Total errors **below baseline (32)** — some violations were cleaned up. Update baseline."
              else
                echo "✓ Total errors match baseline (32). No new violations."
              fi
              echo ""
              echo "**Cycle 50 mode**: NIGHTLY TRACKER — does not block PRs."
              echo "Will be promoted to PR-gate when baseline reaches 0."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Validation skipped (no JSON output produced)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Non-blocking: cycle 50 ships as tracker. Future cycle will
      # add `if: steps.validate.outputs.rc != '0'\n  run: exit 1` once
      # baseline = 0.
