name: kakaku-test

# Path-scoped test gate for the kakaku 価格 price-difference / supply-demand intel
# actor. Kept separate from the always-on ci.yml constitutional gate so an actor-local
# test issue does not red-light unrelated docs / Rust / lexicon PRs (ADR-2605302355 pattern).
# This is one step of kakaku deploy-autonomy: deploy.sh blocks on the same suite locally;
# CI re-asserts it on every PR that touches the actor.

on:
  push:
    branches: [ "main" ]
    paths:
      - '20-actors/kakaku/**'
  pull_request:
    paths:
      - '20-actors/kakaku/**'

jobs:
  kakaku-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # kakaku's suite is pure Clojure/babashka now (ADR-2606160842 py->cljc port
      # wave); test_ingest_mcp.cljc pins the same seed-parses-to-10-entities/~72-
      # datoms assertion the old `ingest_mcp.py --dry-run` step checked, so that
      # step is redundant and has been removed rather than re-pointed at a deleted
      # file.
      - name: Set up Babashka
        run: |
          curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb-install
          chmod +x /tmp/bb-install
          sudo /tmp/bb-install --version 1.12.218
          bb --version

      - name: Run kakaku agent suite
        run: bb 20-actors/kakaku/run_tests.clj
