name: datomic-ledger-audit

# Continuous datomic-ledger health gate. Runs the fleet audit
# (70-tools/scripts/datomic-health/fleet_audit.clj) on every PR + push that touches a ledger
# actor's persistence layer or the audit itself. The audit drives each standard-interface
# ledger actor's heartbeat into a throwaway temp commit-DAG and asserts: GROUND datoms appended,
# verify-chain :ok (prev-cid linkage intact), idempotent-by-content (a 2nd beat is a NO-OP), and
# ground-only (no derived :bond/* / :ops/* / :enkiri/* persisted). It exits non-zero ONLY on a
# standard-family regression; non-standard ledger actors (different interface / shared kotoba.datom
# lib) are inventoried, never failed. Kept separate from the always-on ci.yml so a ledger-local
# regression does not red-light unrelated PRs (ADR-2605302355 pattern). Pure audit: writes only to
# the runner's tmpdir, no network (no-server-key).

on:
  push:
    branches: ["main"]
    paths:
      - '20-actors/**/methods/kotoba.cljc'
      - '20-actors/**/methods/autorun.cljc'
      - '70-tools/scripts/datomic-health/**'
      - '.github/workflows/datomic-ledger-audit.yml'
  pull_request:
    paths:
      - '20-actors/**/methods/kotoba.cljc'
      - '20-actors/**/methods/autorun.cljc'
      - '70-tools/scripts/datomic-health/**'
      - '.github/workflows/datomic-ledger-audit.yml'

jobs:
  fleet-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install babashka
        run: |
          curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb-install
          sudo bash /tmp/bb-install
          bb --version

      - name: Run datomic-ledger fleet audit
        run: bb 70-tools/scripts/datomic-health/fleet_audit.clj
