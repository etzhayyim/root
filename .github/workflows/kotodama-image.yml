name: kotodama-image

# Build + push the kotodama container image used by every Python langserver
# Deployment under 50-infra/k8s/lg-*/ (currently lg-open-unispsc; lg-isin and
# others follow the same pattern). Path-filtered so commits outside the
# Python tree don't burn CI minutes.

on:
  # The kotodama Python source is owned by the etzhayyim/kotoba repo, so root pushes no
  # longer change it — rebuild on a weekly schedule + on demand, plus when the
  # cell roster or this workflow changes.
  push:
    branches: [main]
    paths:
      - "50-infra/cluster/murakumo/cell-runner/cells.toml"
      - ".github/workflows/kotodama-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "50-infra/cluster/murakumo/cell-runner/cells.toml"
      - ".github/workflows/kotodama-image.yml"
  schedule:
    - cron: "0 6 * * 1"   # weekly — pick up etzhayyim/kotoba Python changes
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: kotodama-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Keep the external checkout outside retired numbered-layer paths.
      - name: Clone etzhayyim/kotoba (kotodama Python source)
        run: git clone --depth 1 https://github.com/etzhayyim/kotoba.git .external/kotoba

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TS="$(date -u +%Y%m%d%H%M%S)"
          {
            echo "short_sha=${SHORT_SHA}"
            echo "ts=${TS}"
            echo "sha_tag=ghcr.io/etzhayyim/kotodama:${SHORT_SHA}-${TS}"
            echo "main_tag=ghcr.io/etzhayyim/kotodama:main"
          } >> "$GITHUB_OUTPUT"

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .external/kotoba
          file: .external/kotoba/crates/kotoba-kotodama/py/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.main_tag }}
          cache-from: type=registry,ref=ghcr.io/etzhayyim/kotodama:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=ghcr.io/etzhayyim/kotodama:buildcache,mode=max' || '' }}
          provenance: false
          build-args: |
            CACHE_BUST=${{ steps.tags.outputs.ts }}

      - name: Report pushed tag
        if: github.event_name != 'pull_request'
        run: |
          echo "::notice::Pushed ${{ steps.tags.outputs.sha_tag }}"
          echo "::notice::Pushed ${{ steps.tags.outputs.main_tag }}"
