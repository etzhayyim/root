name: ossekai-test

# Path-scoped test gate for the ossekai 御節介 information-arbitrage actor. Kept separate
# from the always-on ci.yml constitutional gate so an actor-local test issue does not
# red-light unrelated PRs (ADR-2605302355 pattern). Deploy-autonomy: the same suite is the
# local gate; CI re-asserts it on every PR that touches the actor.

on:
  push:
    branches: [ "main" ]
    paths:
      - '20-actors/ossekai/**'
  pull_request:
    paths:
      - '20-actors/ossekai/**'

jobs:
  ossekai-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Babashka
        run: |
          curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb-install
          chmod +x /tmp/bb-install
          sudo /tmp/bb-install --version 1.12.218
      - name: Run ossekai agent suite (cljc)
        run: bash 20-actors/ossekai/run_tests.sh
