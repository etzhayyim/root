name: ossekai-test

# Path-scoped test gate for the ossekai 御節介 information-arbitrage actor. Kept separate
# from the always-on ci.yml constitutional gate so an actor-local test issue does not
# red-light unrelated PRs (ADR-2605302355 pattern). Deploy-autonomy: the same suite is the
# local gate; CI re-asserts it on every PR that touches the actor.

on:
  push:
    branches: [ "main" ]
    paths:
      - '20-actors/ossekai/**'
  pull_request:
    paths:
      - '20-actors/ossekai/**'

jobs:
  ossekai-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run ossekai agent suite
        run: bash 20-actors/ossekai/run_tests.sh
