name: mitooshi-test

# Path-scoped test gate for the mitooshi 見通し forecasting observatory. Kept separate from
# the always-on ci.yml constitutional gate so an actor-local test issue does not red-light
# unrelated PRs (ADR-2605302355 pattern). Deploy-autonomy: run_tests.sh is the local gate;
# CI re-asserts the full standalone suite on every PR that touches the actor.

on:
  push:
    branches: [ "main" ]
    paths:
      - '20-actors/mitooshi/**'
  pull_request:
    paths:
      - '20-actors/mitooshi/**'

jobs:
  mitooshi-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Babashka
        run: |
          curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb-install
          chmod +x /tmp/bb-install
          sudo /tmp/bb-install --version 1.12.218
      - name: Run mitooshi standalone suite
        run: bash 20-actors/mitooshi/run_tests.sh
