name: kami-engine-sdk + cyber-drill build

# Regression-test for the 2026-05-26 SDK three-free cutover (ADR-2605264300) +
# the cyber-drill prod build unblock (commit b638c27e0). Both are fragile
# multi-layer setups:
#
#   - SDK is a git submodule + workspace member; its dist/ is what
#     downstream apps consume
#   - cyber-drill `link:`s the SDK and resolves `@langchain/langgraph` +
#     `@langchain/core` as external during its SSR (prerender) build —
#     a setup that took 4 iterations of /loop work to land cleanly
#
# Lefthook pre-commit (ci.yml) covers lint + e7m verify but does NOT
# exercise svelte-package or the cyber-drill production build. This
# workflow fills that gap.

on:
  push:
    branches: [main]
    paths:
      - '40-engine/kami-engine/kami-engine-sdk/**'
      - '60-apps/etzhayyim-project-cyber-drill/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/kami-engine-sdk.yml'
  pull_request:
    branches: [main]
    paths:
      - '40-engine/kami-engine/kami-engine-sdk/**'
      - '60-apps/etzhayyim-project-cyber-drill/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/kami-engine-sdk.yml'
  # Manual trigger from the GitHub Actions UI. Useful for:
  #   - auditing a stale branch that pre-dates the workflow's existence
  #   - re-running after a known-good lockfile / workspace fix in a
  #     situation where the path filter wouldn't normally trigger
  #   - debugging — re-running with debug logging enabled
  # No inputs required; the workflow runs against the branch from which
  # it was dispatched.
  #
  # NOTE: GitHub Actions requires workflow_dispatch-triggerable workflows
  # to exist on the **default branch** (`main`). Dispatching from a
  # feature branch via `gh workflow run … --ref <feat-branch>` fails
  # with HTTP 500 until the workflow file has merged to `main` at least
  # once. After the first merge, `--ref` dispatch against feature
  # branches works as documented. Normalized the trigger value from
  # `workflow_dispatch: {}` to `workflow_dispatch:` to match the
  # convention used by sibling workflows (e.g., kotodama-image.yml);
  # the two forms are equivalent at the YAML layer but the no-`{}`
  # form is the GitHub Actions docs-default.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: SDK build + vitest + cyber-drill prod build
    # kami-engine and its SDK are no longer owned by this root. Their
    # standalone repositories run the build; the root retains this workflow
    # only as historical trigger provenance until consumers are extracted.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone kotoba-lang/kami-engine (recursive — incl. kami-engine-sdk)
        # The old root submodule was removed during the multirepo cutover.
        # Materialize the public upstream at the legacy workspace mount until
        # this consumer is itself moved to a flat west repository.
        run: git clone --depth=1 --recurse-submodules --shallow-submodules https://github.com/kotoba-lang/kami-engine.git 40-engine/kami-engine

      - name: Clone etzhayyim/kotoba (pnpm workspace deps)
        # yorishiro-*-mcp workspace packages now live in the etzhayyim/kotoba repo
        # (submodule removed, ADR-2606131645); clone into the pnpm-workspace path.
        run: git clone --depth=1 https://github.com/etzhayyim/kotoba.git 40-engine/kotoba

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install workspace deps
        # `--no-frozen-lockfile` accommodates routine drift from parallel
        # session work (pnpm-lock.yaml is not always committed with every
        # workspace.yaml change). Production deploy paths separately
        # enforce frozen lockfile per app.
        working-directory: 40-engine/kami-engine/kami-engine-sdk
        run: pnpm install --ignore-workspace --no-frozen-lockfile

      - name: Build SDK
        working-directory: 40-engine/kami-engine/kami-engine-sdk
        # `svelte-package -i src/lib` produces dist/ which downstream
        # apps (cyber-drill, baminiku, ...) consume via `link:` or
        # `workspace:*`. Must succeed for the rest of the pipeline.
        run: pnpm run build

      - name: SDK vitest
        working-directory: 40-engine/kami-engine/kami-engine-sdk
        # The webvr/incident-pregel.ts file imports from
        # @langchain/langgraph (a peer dep that vitest's vite-config
        # optional-peer-dep handling stubs unexpectedly under jsdom);
        # 1 of 8 test files fails to load for that reason. The other
        # 82 tests pass. This is tracked as a pre-existing
        # observation in ADR-2605264300 §1 + commit b638c27e0; doesn't
        # block CI but is surfaced as a warning.
        env:
          # vitest emits the `Tests  82 passed` summary with ANSI colour
          # escapes even through a pipe, which broke the grep below (it
          # matched nothing → parsed 0 → false "regressed" failure). Force
          # plain output; the sed strip is a belt-and-suspenders fallback.
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          pnpm test 2>&1 | tee /tmp/sdk-test.log || true
          # Strip any residual ANSI escapes before parsing the summary.
          sed -E 's/\x1b\[[0-9;]*m//g' /tmp/sdk-test.log > /tmp/sdk-test.clean.log
          PASSED=$(grep -oE "Tests +[0-9]+ passed" /tmp/sdk-test.clean.log | grep -oE "[0-9]+" | head -1)
          if [ "${PASSED:-0}" -lt 82 ]; then
            echo "::error::SDK vitest passed count regressed below 82 (got ${PASSED:-0})"
            exit 1
          fi
          echo "::notice::SDK vitest: ${PASSED}/82 expected passing tests"

      - name: cyber-drill prod build
        working-directory: 60-apps/etzhayyim-project-cyber-drill/svelte
        # cyber-drill is NOT in pnpm-workspace.yaml — it installs in
        # isolation via --ignore-workspace and uses
        # `link:../../../40-engine/kami-engine/kami-engine-sdk` for the
        # SDK. The SDK was already built above; the dist/ is what
        # cyber-drill imports during prerender.
        #
        # The build phase exercises the langchain externalize fix from
        # commit b638c27e0 — Rollup must NOT try to resolve
        # @langchain/langgraph / @langchain/core from the SDK's
        # filesystem path during the SSR build.
        run: |
          pnpm install --ignore-workspace --no-frozen-lockfile
          pnpm run build
