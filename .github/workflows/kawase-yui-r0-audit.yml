name: kawase-yui-r0-audit

# CI gate for the kawase-yui (為替結) R0 surface per ADR-2605282200.
#
# Three audit lanes:
#   1. **G7 build-time gate** — verify_no_commercial_remittance.py + its
#      23-test suite. Catches any future commit that strays into
#      commercial-remittance MSB integration (Wise / Western Union /
#      MoneyGram / Remitly / WorldRemit / Xoom / Revolut / OFX /
#      Currencies Direct / Ria / Paysend / Atlantic Money / Sendwave /
#      Boss Revolution / PayPal-Xoom / TransferWise) BEFORE it lands.
#
#   2. **Lexicon schema validation** — validate-lexicons.py on the 8
#      kawase Lexicons; structural enforcement of G3 / G5 / G7
#      const-field invariants at the schema layer.
#
#   3. **Cell R0-honesty audit** — every kawase_* cell must raise
#      RuntimeError on import. If R1 wiring lands without dropping the
#      COUNCIL_FLEET_ATTESTATION_TX_HASH = None guard, this gate fires
#      a warning so reviewers notice the scaffold-to-R1 transition.
#
# Two-layer defense: the lefthook pre-commit gate (committer-local) +
# this CI gate (PR-level) form Pattern A "3-layer enforcement" per the
# registry enforcement matrix retrospective (ADR-2605271200).

on:
  push:
    branches: [main]
    paths:
      - '00-contracts/lexicons/com/etzhayyim/kawase/**'
      - '20-actors/kawase-yui/**'
      - '40-engine/kotoba/crates/kotoba-kotodama/cells/kawase_**/**'
      - '40-engine/kotoba_kawase/**'
      - '50-infra/etzhayyim-kawase-pool/**'
      - '70-tools/scripts/lint/verify_no_commercial_remittance.py'
      - '70-tools/scripts/lint/test_verify_no_commercial_remittance.py'
      - '.github/workflows/kawase-yui-r0-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - '00-contracts/lexicons/com/etzhayyim/kawase/**'
      - '20-actors/kawase-yui/**'
      - '40-engine/kotoba/crates/kotoba-kotodama/cells/kawase_**/**'
      - '40-engine/kotoba_kawase/**'
      - '50-infra/etzhayyim-kawase-pool/**'
      - '70-tools/scripts/lint/verify_no_commercial_remittance.py'
      - '70-tools/scripts/lint/test_verify_no_commercial_remittance.py'
      - '.github/workflows/kawase-yui-r0-audit.yml'
  schedule:
    # Nightly at 04:05 UTC = ~13:05 JST. Off-peak in both regions.
    # Off-minute :05 to deconflict with the other 7 nightly audits.
    - cron: '5 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g7-no-commercial-remittance:
    name: G7 — no commercial remittance MSB integration
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Unit tests for the lint hook (23 must pass)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python3 -m pytest \
            70-tools/scripts/lint/test_verify_no_commercial_remittance.py \
            -v

      - name: Live G7 gate against the working tree
        run: |
          python3 70-tools/scripts/lint/verify_no_commercial_remittance.py
          echo "✓ G7 gate clean — no commercial remittance MSB integration in kawase-yui paths"

  lexicon-schema-validation:
    name: Lexicon schema (8 kawase Lexicons)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate every com.etzhayyim.kawase.* Lexicon
        run: |
          python3 70-tools/scripts/validate-lexicons.py \
            --files \
              00-contracts/lexicons/com/etzhayyim/kawase/depositAttestation.json \
              00-contracts/lexicons/com/etzhayyim/kawase/withdrawIntent.json \
              00-contracts/lexicons/com/etzhayyim/kawase/matchExecution.json \
              00-contracts/lexicons/com/etzhayyim/kawase/fxRateAttestation.json \
              00-contracts/lexicons/com/etzhayyim/kawase/poolStateReport.json \
              00-contracts/lexicons/com/etzhayyim/kawase/rebalanceAttestation.json \
              00-contracts/lexicons/com/etzhayyim/kawase/jurisdictionAttestation.json \
              00-contracts/lexicons/com/etzhayyim/kawase/silenKawaseReview.json \
            --exit-on-error
          echo "✓ 8 kawase Lexicons all validate clean"

  python-facade-r0:
    name: kotoba_kawase R0 — 16 pytest
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run kotoba_kawase R0 tests
        working-directory: 40-engine/kotoba_kawase
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: '.'
        run: |
          python3 -m pytest tests/test_r0.py -v

  cell-r0-honesty:
    name: 5 Pregel cells raise RuntimeError on import
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify each kawase_* cell raises RuntimeError on import
        run: |
          fail=0
          for cell in kawase_pool_match kawase_fx_oracle_watcher kawase_rebalance_proposer kawase_jurisdiction_compliance kawase_silen_review; do
            output=$(python3 -c "
          import sys
          sys.path.insert(0, '40-engine/kotoba/crates/kotoba-kotodama/cells/$cell')
          try:
              import cell
              print('FAIL: $cell.cell imported without raising')
              sys.exit(1)
          except RuntimeError as e:
              msg = str(e)
              if 'scaffold-only' not in msg or 'ADR-2605282200' not in msg:
                  print(f'FAIL: $cell.cell raised but message missing R0-honesty markers: {msg!r}')
                  sys.exit(1)
              print(f'OK: $cell.cell scaffold-only guard intact')
          " 2>&1)
            echo "$output"
            if echo "$output" | grep -q "^FAIL:"; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "✘ At least one kawase_* cell either imported cleanly (R1 wiring landed without ADR ratify)"
            echo "  or raised the wrong error message. Either: (a) the cell's COUNCIL_FLEET_ATTESTATION_TX_HASH"
            echo "  guard was removed prematurely — back it out OR land the R1 ADR; (b) the guard message"
            echo "  no longer mentions scaffold-only / ADR-2605282200 — restore the canonical wording."
            exit 1
          fi
          echo ""
          echo "✓ All 5 kawase_* cells raise RuntimeError on import with R0-honesty marker"
