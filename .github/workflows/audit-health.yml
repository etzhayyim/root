name: audit-health

# Run the monorepo audit aggregator (`70-tools/scripts/audit/all.sh`) on
# every PR + push to main + manual dispatch. Surfaces dependabot defunct
# entries, SDK exports/dist mismatches, stale subrepo URLs, and escape-
# symlinks inside subrepos.
#
# Strict mode is OFF by default — the current baseline (iter-52 of /loop,
# 2026-05-27) has 25 findings: 25 documented-deferred (7 stale subrepo
# URLs ADR-2605211845 + 18 kotoba escape-symlinks ADR-2605262130). The
# manifest-lexicon-drift category was fully zeroed in iter-52 (all 21
# missing lexicons across 5 actors authored iter-48..52). The workflow
# reports the count in the job summary so reviewers can compare against
# baseline; it does not fail PRs on those known findings.
#
# When the documented findings are resolved (kotoba upstream symlink
# coordination + per-app .gitrepo decision), the strict-mode flag can be
# enabled here to gate future drift.

on:
  push:
    branches: [main]
    paths:
      # Audit infrastructure itself.
      - '.github/dependabot.yml'
      - '.github/workflows/audit-health.yml'
      - '70-tools/scripts/audit/**'
      # Subrepo URLs (audited by subrepo-upstream-health +
      # subrepo-symlink-health).
      - '**/.gitrepo'
      # Actor manifests + lexicon JSON files (audited by
      # manifest-lexicon-drift; iter-53 canary regression-guards
      # the just-closed category — needs to fire on these paths
      # to actually catch drift introduction).
      - '20-actors/**/manifest.jsonld'
      - '20-actors/**/manifest.edn'
      - '00-contracts/lexicons/**/*.json'
      # ADR files (audited by adr-cross-ref-health). Any new ADR or
      # rename can change the orphan set and the standalone audit's
      # baseline of 118 (iter-45) is operator-tracked.
      - '90-docs/adr/**/*.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/audit-health.yml'
      - '70-tools/scripts/audit/**'
      - '**/.gitrepo'
      - '20-actors/**/manifest.jsonld'
      - '20-actors/**/manifest.edn'
      - '00-contracts/lexicons/**/*.json'
      - '90-docs/adr/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: monorepo-health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # NOTE: the former "Checkout kami-engine submodule" step was removed
      # 2026-06-17 — 40-engine/kami-engine is no longer a root git-submodule
      # (no .gitmodules entry, no gitlink in the tree), so the targeted
      # `git submodule update … 40-engine/kami-engine` failed with "pathspec
      # did not match", killing the whole monorepo-health job before any audit
      # ran (it failed on every PR + on main). sdk-exports-dist tolerates the
      # absent sdk gracefully; the full audit pytest suite is green without it.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest (for audit script tests)
        run: pip install pytest

      # The aggregator (all.sh → test_all_sh.py) runs pytest over the WHOLE
      # audit dir, which includes the actor-invariant suites (hotaru / mitooshi
      # / noroshi / nusa / todoke …) that shell out to `bb` (babashka) to load
      # the cljc invariant guards. Without bb those tests raise FileNotFoundError
      # and the strict job fails on every PR + on main. Install the official
      # babashka so the invariant suites actually run.
      - name: Install babashka
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install
          sudo ./install
          bb --version

      - name: Run audit script tests (strict — fail on regression)
        env:
          # Bypass langsmith plugin auto-load (pydantic version mismatch
          # in the dev box has historically broken pytest collection).
          # The CI image is clean of langsmith, but the env is safe to
          # set unconditionally so local + CI invocations match.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          # Note: test_all_sh.py is the end-to-end aggregator test,
          # which itself invokes `bash all.sh`. We run it LAST so the
          # other suites are validated first (faster failure signal on
          # individual-script regressions).
          python3 -m pytest \
            70-tools/scripts/audit/test_adr_cross_ref_health.py \
            70-tools/scripts/audit/test_manifest_lexicon_drift.py \
            70-tools/scripts/audit/test_subrepo_scripts.py \
            70-tools/scripts/audit/test_simple_audits.py \
            70-tools/scripts/audit/test_e7m_verify_perf.py \
            70-tools/scripts/audit/test_gitmodules.py \
            70-tools/scripts/audit/test_tadori_invariants.py \
            70-tools/scripts/audit/test_tsukuroi_invariants.py \
            70-tools/scripts/audit/test_karute_invariants.py \
            70-tools/scripts/audit/test_kokoro_invariants.py \
            70-tools/scripts/audit/test_iyashi_invariants.py \
            70-tools/scripts/audit/test_mitate_invariants.py \
            70-tools/scripts/audit/test_futawa_invariants.py \
            70-tools/scripts/audit/test_watatsumi_invariants.py \
            70-tools/scripts/audit/test_all_sh.py \
            -v

      - name: Run audit aggregator (non-strict)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `subrepo-upstream-health.sh` calls `gh repo view` — needs
          # GH_TOKEN to avoid rate-limiting on the GitHub API. The
          # default github.token has read access to public repos.
          bash 70-tools/scripts/audit/all.sh | tee /tmp/audit.log

          # Extract the rollup total and surface it in the GitHub
          # job summary so reviewers see the count at a glance.
          total=$(grep -oE "total findings across all audits: [0-9]+" /tmp/audit.log \
                  | grep -oE "[0-9]+" | tail -1)
          {
            echo "## Audit findings: ${total:-?}"
            echo ""
            echo "Baseline as of iter-52 of /loop (2026-05-27): **25 findings**"
            echo "  - 0 dependabot defunct"
            echo "  - 0 SDK exports/dist mismatches"
            echo "  - 7 stale subrepo URLs (ADR-2605211845)"
            echo "  - 18 kotoba escape-symlinks (ADR-2605262130)"
            echo "  - 0 sibling-convention-drift outliers"
            echo "  - 0 manifest-lexicon-drift (iter-52: all 5 actors closed — wadachi/gov-municipality/infra-utility-connect/yoro-supply/kuni-umi)"
            echo ""
            if [ "${total:-0}" -gt 25 ]; then
              echo "⚠️ Total findings **above baseline** — new drift introduced. Investigate above."
            elif [ "${total:-0}" -lt 25 ]; then
              echo "✅ Total findings **below baseline** — drift was resolved. Update baseline in this workflow's docs + audit/README.md."
            else
              echo "✓ Total findings match baseline. No new drift."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
