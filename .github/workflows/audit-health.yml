name: audit-health

# Run the monorepo audit aggregator (`70-tools/scripts/audit/all.sh`) on
# every PR + push to main + manual dispatch. Surfaces dependabot defunct
# entries, SDK exports/dist mismatches, stale subrepo URLs, and escape-
# symlinks inside subrepos.
#
# Strict mode is OFF by default — the current baseline (iter-51 of /loop,
# 2026-05-27) has 31 findings: 25 documented-deferred (ADR-2605211845 +
# ADR-2605262130) plus 6 manifest-lexicon-drift (1 actor × 6 lexicons;
# was 21 across 5 in iter-47 — iter-48 wadachi, iter-49 gov-municipality,
# iter-50 infra-utility-connect, iter-51 yoro-supply closed; only
# kuni-umi remains). The workflow reports the count in the job summary
# so reviewers can compare against baseline; it does not fail PRs on
# those known findings.
#
# When the documented findings are resolved (kotoba upstream symlink
# coordination + per-app .gitrepo decision), the strict-mode flag can be
# enabled here to gate future drift.

on:
  push:
    branches: [main]
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/audit-health.yml'
      - '70-tools/scripts/audit/**'
      - '40-engine/kami-engine/kami-engine-sdk/package.json'
      - '**/.gitrepo'
  pull_request:
    branches: [main]
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/audit-health.yml'
      - '70-tools/scripts/audit/**'
      - '40-engine/kami-engine/kami-engine-sdk/package.json'
      - '**/.gitrepo'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: monorepo-health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest (for audit script tests)
        run: pip install pytest

      - name: Run audit script tests (strict — fail on regression)
        env:
          # Bypass langsmith plugin auto-load (pydantic version mismatch
          # in the dev box has historically broken pytest collection).
          # The CI image is clean of langsmith, but the env is safe to
          # set unconditionally so local + CI invocations match.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python3 -m pytest \
            70-tools/scripts/audit/test_adr_cross_ref_health.py \
            -v

      - name: Run audit aggregator (non-strict)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `subrepo-upstream-health.sh` calls `gh repo view` — needs
          # GH_TOKEN to avoid rate-limiting on the GitHub API. The
          # default github.token has read access to public repos.
          bash 70-tools/scripts/audit/all.sh | tee /tmp/audit.log

          # Extract the rollup total and surface it in the GitHub
          # job summary so reviewers see the count at a glance.
          total=$(grep -oE "total findings across all audits: [0-9]+" /tmp/audit.log \
                  | grep -oE "[0-9]+" | tail -1)
          {
            echo "## Audit findings: ${total:-?}"
            echo ""
            echo "Baseline as of iter-51 of /loop (2026-05-27): **31 findings**"
            echo "  - 0 dependabot defunct"
            echo "  - 0 SDK exports/dist mismatches"
            echo "  - 7 stale subrepo URLs (ADR-2605211845)"
            echo "  - 18 kotoba escape-symlinks (ADR-2605262130)"
            echo "  - 0 sibling-convention-drift outliers"
            echo "  - 6 manifest-lexicon-drift (iter-51; 1 actor / 6 lexicons; 4 of 5 actors closed; kuni-umi remains)"
            echo ""
            if [ "${total:-0}" -gt 31 ]; then
              echo "⚠️ Total findings **above baseline** — new drift introduced. Investigate above."
            elif [ "${total:-0}" -lt 31 ]; then
              echo "✅ Total findings **below baseline** — drift was resolved. Update baseline in this workflow's docs + audit/README.md."
            else
              echo "✓ Total findings match baseline. No new drift."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

