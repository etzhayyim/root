name: kotoba-wasm-ipfs-deploy

# GitHub-driven deploy for kotoba / actor WASM components (ADR-2606014500).
#
# Build → strip → validate → content-address (CIDv1) happens with NO secrets.
# The resulting .wasm/.cid/.car are always uploaded as workflow artifacts.
#
# The PIN step pushes the CAR into etzhayyim's own kubo pinner over the exact
# RPC kotoba's KuboBlockStore/IpfsPinClient use (/api/v0/dag/import +
# /api/v0/pin/add) and only runs when the repo/environment secrets are set —
# so no signing key or pinning credential ever lives in a dev container.
#
# Required secrets (Settings → Secrets and variables → Actions) for the pin:
#   KOTOBA_IPFS_ENDPOINT   e.g. https://kotobase.gftd.ai   (kubo RPC base)
#   KOTOBA_IPFS_TOKEN      optional Bearer token for that endpoint
#
# It deliberately STOPS at "pinned + CID reported". Updating the actor's DID
# document / registry with the new CID is a separately-signed operator step
# (macOS Keychain, etzhayyim-exclusive) — never automated here.

on:
  workflow_dispatch:
    inputs:
      crate_dir:
        description: "Path to the WASM actor crate (dir containing Cargo.toml)"
        required: true
        default: "orgs/etzhayyim/com-etzhayyim-tsumugi/wasm/tsumugi-core"
      artifact_name:
        description: "Output artifact name (optional; derived from crate name if blank)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-and-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-tools + kubo
        run: |
          set -euo pipefail
          WT=1.225.0; KUBO=v0.34.1
          curl -sSL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WT}/wasm-tools-${WT}-x86_64-linux.tar.gz" | tar xz
          sudo cp "wasm-tools-${WT}-x86_64-linux/wasm-tools" /usr/local/bin/
          curl -sSL "https://dist.ipfs.tech/kubo/${KUBO}/kubo_${KUBO}_linux-amd64.tar.gz" | tar xz
          sudo cp kubo/ipfs /usr/local/bin/
          export IPFS_PATH="$HOME/.ipfs"; ipfs init --profile=lowpower >/dev/null
          echo "IPFS_PATH=$HOME/.ipfs" >> "$GITHUB_ENV"
          wasm-tools --version && ipfs --version

      - name: Build + content-address (no secrets)
        id: build
        run: |
          set -euo pipefail
          chmod +x 70-tools/scripts/deploy/kotoba-wasm-build.sh
          70-tools/scripts/deploy/kotoba-wasm-build.sh \
            "${{ github.event.inputs.crate_dir }}" "${{ github.event.inputs.artifact_name }}"
          DIST="${{ github.event.inputs.crate_dir }}/dist"
          NAME="$(ls "$DIST"/*.cid | head -1 | xargs -n1 basename | sed 's/\.cid$//')"
          CID="$(cat "$DIST/$NAME.cid")"
          echo "name=$NAME"   >> "$GITHUB_OUTPUT"
          echo "cid=$CID"     >> "$GITHUB_OUTPUT"
          echo "dist=$DIST"   >> "$GITHUB_OUTPUT"
          {
            echo "### kotoba-wasm built"
            echo ""
            echo "- artifact: \`$NAME.wasm\`"
            echo "- CID: \`$CID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts (.wasm / .cid / .car)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}-wasm
          path: |
            ${{ steps.build.outputs.dist }}/*.wasm
            ${{ steps.build.outputs.dist }}/*.cid
            ${{ steps.build.outputs.dist }}/*.car

      - name: Pin CAR to etzhayyim kubo (only if secrets present)
        env:
          KOTOBA_IPFS_ENDPOINT: ${{ secrets.KOTOBA_IPFS_ENDPOINT }}
          KOTOBA_IPFS_TOKEN: ${{ secrets.KOTOBA_IPFS_TOKEN }}
          NAME: ${{ steps.build.outputs.name }}
          CID: ${{ steps.build.outputs.cid }}
          DIST: ${{ steps.build.outputs.dist }}
        run: |
          set -euo pipefail
          if [ -z "${KOTOBA_IPFS_ENDPOINT:-}" ]; then
            echo "KOTOBA_IPFS_ENDPOINT not set — artifact-only run (no pin). CID=$CID"
            echo "_No pin endpoint configured — CID \`$CID\` built but not pinned._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          AUTH=()
          [ -n "${KOTOBA_IPFS_TOKEN:-}" ] && AUTH=(-H "Authorization: Bearer ${KOTOBA_IPFS_TOKEN}")
          EP="${KOTOBA_IPFS_ENDPOINT%/}"
          echo "==> dag import CAR into $EP"
          curl -fsSL "${AUTH[@]}" -X POST -F "file=@${DIST}/${NAME}.car" \
            "${EP}/api/v0/dag/import?pin-roots=true" | tee /tmp/import.json
          echo "==> pin add $CID"
          curl -fsSL "${AUTH[@]}" -X POST "${EP}/api/v0/pin/add?arg=${CID}&recursive=true" | tee /tmp/pin.json
          echo "✅ pinned \`$CID\` to \`$EP\`" >> "$GITHUB_STEP_SUMMARY"
