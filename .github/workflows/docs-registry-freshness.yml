name: docs-registry-freshness

# Verify 90-docs/_registry/docs.json stays in sync with canonical EDN and
# descriptive Markdown across the 90-docs/ tree. Catches operators adding,
# editing, or renaming docs without regenerating the machine-readable
# sidecar index.
#
# Parallel pattern to deps-toml-paths.yml (ADR-2605271100 closure
# cycle 48). Mechanism:
#   - PR-gate run: `regen-registry.clj --check` exit 1 on drift → PR blocked
#   - Nightly run: same check + step summary with entry count
#
# The generator is idempotent (sorted by id; entries-only comparison
# ignores `updated_at`), so the only false-positive risk is genuine
# concurrent edits during a PR — which is desired (catch drift early).
#
# Per 90-docs/CLAUDE.md "Documentation System Rules":
#   - EDN documents are canonical for ADR and migration records
#   - JSON-LD は本文の代替ではなく relation/index sidecar
#   - 「同じ判断」を複数 doc に複写しない。正本 1 つを registry で指す
# This workflow enforces the third rule mechanically.

on:
  push:
    branches: [main]
    paths:
      - '90-docs/**/*.md'
      - '90-docs/**/*.edn'
      - '90-docs/_registry/docs.json'
      - '90-docs/_registry/docs.edn'
      - '70-tools/scripts/docs/regen-registry.clj'
      - '.github/workflows/docs-registry-freshness.yml'
  pull_request:
    branches: [main]
    paths:
      - '90-docs/**/*.md'
      - '90-docs/**/*.edn'
      - '90-docs/_registry/docs.json'
      - '90-docs/_registry/docs.edn'
      - '70-tools/scripts/docs/regen-registry.clj'
      - '.github/workflows/docs-registry-freshness.yml'
  schedule:
    # Nightly at 03:23 UTC = ~12:23 JST. Off-minute :23 (different from
    # deps-toml-paths' :17) to spread runner load.
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: docs-registry-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Babashka
        run: |
          curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb-install
          chmod +x /tmp/bb-install
          sudo /tmp/bb-install --version 1.12.218
          bb --version

      - name: Run generator unit tests (regen-registry.clj; 13/13 must pass)
        run: |
          bb 70-tools/scripts/docs/test_regen_registry.clj

      - name: Check registry freshness (PR gate)
        run: |
          bb 70-tools/scripts/docs/regen-registry.clj --check \
            | tee /tmp/registry-check.log
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            echo ""
            echo "✘ docs registry is out of sync with 90-docs/**/*.md source-of-truth."
            echo "  Fix: run the regenerator and stage the updated registry:"
            echo "    bb 70-tools/scripts/docs/regen-registry.clj"
            echo "    git add 90-docs/_registry/docs.json 90-docs/_registry/docs.edn"
            exit "$exit_code"
          fi
          echo "✓ docs registry in sync"

      - name: Step summary
        if: always()
        run: |
          if [ -f 90-docs/_registry/docs.json ]; then
            summary=$(bb -e '(let [d (cheshire.core/parse-string (slurp "90-docs/_registry/docs.json") true)]
                               (println (count (:entries d)) (:updated_at d)))')
            entries=$(echo "$summary" | awk '{print $1}')
            updated=$(echo "$summary" | awk '{print $2}')
            {
              echo "## 90-docs/_registry/docs.json + docs.edn"
              echo ""
              echo "- **Entries**: ${entries}"
              echo "- **updated_at**: ${updated}"
              echo ""
              echo "Baseline as of ADR-2605271100 closure (2026-05-27 cycle 48):"
              echo "  - 657 entries (registry refresh after cycles 44/45/47 docs landed)"
              echo "  - Generator: \`70-tools/scripts/docs/regen-registry.clj\` (babashka)"
              echo "  - Idempotent: sorted by \`id\`; entries-only comparison ignores volatile \`updated_at\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
