name: docs-registry-freshness

# Verify 90-docs/_registry/docs.json stays in sync with the .md source
# of truth across the 90-docs/ tree. Catches operators adding / editing /
# renaming markdown docs without regenerating the machine-readable
# sidecar index.
#
# Parallel pattern to deps-toml-paths.yml (ADR-2605271100 closure
# cycle 48). Mechanism:
#   - PR-gate run: `regen-registry.py --check` exit 1 on drift → PR blocked
#   - Nightly run: same check + step summary with entry count
#
# The generator is idempotent (sorted by id; entries-only comparison
# ignores `updated_at`), so the only false-positive risk is genuine
# concurrent edits during a PR — which is desired (catch drift early).
#
# Per 90-docs/CLAUDE.md "Documentation System Rules":
#   - Markdown 本文が canonical source
#   - JSON-LD は本文の代替ではなく relation/index sidecar
#   - 「同じ判断」を複数 doc に複写しない。正本 1 つを registry で指す
# This workflow enforces the third rule mechanically.

on:
  push:
    branches: [main]
    paths:
      - '90-docs/**/*.md'
      - '90-docs/_registry/docs.json'
      - '90-docs/_registry/docs.edn'
      - '70-tools/scripts/docs/regen-registry.py'
      - '.github/workflows/docs-registry-freshness.yml'
  pull_request:
    branches: [main]
    paths:
      - '90-docs/**/*.md'
      - '90-docs/_registry/docs.json'
      - '90-docs/_registry/docs.edn'
      - '70-tools/scripts/docs/regen-registry.py'
      - '.github/workflows/docs-registry-freshness.yml'
  schedule:
    # Nightly at 03:23 UTC = ~12:23 JST. Off-minute :23 (different from
    # deps-toml-paths' :17) to spread runner load.
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: docs-registry-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run generator unit tests (cycle 57; 10/10 must pass)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python3 -m pytest \
            70-tools/scripts/docs/test_regen_registry.py \
            -v

      - name: Check registry freshness (PR gate)
        run: |
          python3 70-tools/scripts/docs/regen-registry.py --check \
            | tee /tmp/registry-check.log
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            echo ""
            echo "✘ docs registry is out of sync with 90-docs/**/*.md source-of-truth."
            echo "  Fix: run the regenerator and stage the updated registry:"
            echo "    python3 70-tools/scripts/docs/regen-registry.py"
            echo "    git add 90-docs/_registry/docs.json"
            exit "$exit_code"
          fi
          echo "✓ docs registry in sync"

      - name: Step summary
        if: always()
        run: |
          if [ -f 90-docs/_registry/docs.json ]; then
            entries=$(python3 -c "import json; print(len(json.load(open('90-docs/_registry/docs.json'))['entries']))")
            updated=$(python3 -c "import json; print(json.load(open('90-docs/_registry/docs.json'))['updated_at'])")
            {
              echo "## 90-docs/_registry/docs.json"
              echo ""
              echo "- **Entries**: ${entries}"
              echo "- **updated_at**: ${updated}"
              echo ""
              echo "Baseline as of ADR-2605271100 closure (2026-05-27 cycle 48):"
              echo "  - 657 entries (registry refresh after cycles 44/45/47 docs landed)"
              echo "  - Generator: \`70-tools/scripts/docs/regen-registry.py\`"
              echo "  - Idempotent: sorted by \`id\`; entries-only comparison ignores volatile \`updated_at\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
