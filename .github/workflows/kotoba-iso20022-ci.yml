name: kotoba-iso20022-ci

# CI gate for the cleanroom ISO 20022 codec (40-engine/kotoba_iso20022),
# the kawase-yui interop/ingress wire. Mirrors the lefthook pre-commit
# gates with PR-level enforcement (Pattern A "3-layer enforcement",
# ADR-2605271200): committer-local hooks + this CI gate.
#
# Four lanes, all required:
#   1. tests          — full pytest suite (stdlib-only runtime)
#   2. typing         — mypy --strict (the package is strict-clean)
#   3. coverage       — branch coverage with a --fail-under floor
#   4. lexicon        — validate-lexicons.py on the ingressAttestation schema
#
# The runtime stays dependency-free; pytest/mypy/coverage are dev-only.

on:
  push:
    branches: [main]
    paths:
      - '40-engine/kotoba_iso20022/**'
      - '00-contracts/lexicons/com/etzhayyim/iso20022/**'
      - '.github/workflows/kotoba-iso20022-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '40-engine/kotoba_iso20022/**'
      - '00-contracts/lexicons/com/etzhayyim/iso20022/**'
      - '.github/workflows/kotoba-iso20022-ci.yml'
  schedule:
    # Nightly at 04:17 UTC — off-minute :17 to deconflict with sibling audits.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 40-engine/kotoba_iso20022

jobs:
  tests-and-typing:
    name: tests · mypy --strict · coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tooling
        run: python -m pip install --quiet pytest coverage mypy
      - name: Tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: '.'
        run: python -m pytest tests/ -q
      - name: Static typing (mypy --strict)
        run: python -m mypy kotoba_iso20022 --strict
      - name: Branch coverage (fail under 90%)
        env:
          PYTHONPATH: '.'
        run: |
          python -m coverage run -m pytest tests/ -q
          python -m coverage report --fail-under=90

  lexicon:
    name: lexicon schema validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ingressAttestation Lexicon
        run: |
          python 70-tools/scripts/validate-lexicons.py \
            --files 00-contracts/lexicons/com/etzhayyim/iso20022/ingressAttestation.json \
            --exit-on-error
