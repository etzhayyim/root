name: data-ownership-provenance

# Actor data-ownership model (ADR-2607010001) CI gates:
#   - `bb lint:provenance` — every RAD :rad/holds-dataset has the required
#     fields (:dataset-id :layer :cidv1) and its :rad/cidv1 is recorded in
#     80-data (ingest-provenance.json / *-manifest.json / ipfs-pins.kotoba.edn).
#   - `bb rad:ownership-matrix --check` — 80-data/kotoba-rad/ownership-matrix.edn
#     is in sync with actor manifests (:substrate :datasets) + RAD identity
#     journals (:rad/holds-dataset).
# Catches dangling CID references, missing required fields, and matrix drift
# when actors declare/attest holdings. Parallel pattern to docs-registry-freshness.
#
# Both tools are offline (no IPFS daemon) clj/bb over the kotoba Datom log.

on:
  push:
    branches: [main]
    paths:
      - '80-data/kotoba-rad/**'
      - '80-data/**/ingest-provenance.json'
      - '80-data/**/*-manifest.json'
      - '80-data/**/ipfs-pins.kotoba.edn'
      - '20-actors/**/manifest.edn'
      - '20-actors/**/manifest.jsonld'
      - '20-actors/**/actor-manifest.jsonld'
      - '70-tools/src/etzhayyim/data_provenance.cljc'
      - '70-tools/src/etzhayyim/ownership_matrix.cljc'
      - '70-tools/src/etzhayyim/kotoba_rad.cljc'
      - 'bb.edn'
      - '.github/workflows/data-ownership-provenance.yml'
  pull_request:
    branches: [main]
    paths:
      - '80-data/kotoba-rad/**'
      - '80-data/**/ingest-provenance.json'
      - '80-data/**/*-manifest.json'
      - '80-data/**/ipfs-pins.kotoba.edn'
      - '20-actors/**/manifest.edn'
      - '20-actors/**/manifest.jsonld'
      - '20-actors/**/actor-manifest.jsonld'
      - '70-tools/src/etzhayyim/data_provenance.cljc'
      - '70-tools/src/etzhayyim/ownership_matrix.cljc'
      - '70-tools/src/etzhayyim/kotoba_rad.cljc'
      - 'bb.edn'
      - '.github/workflows/data-ownership-provenance.yml'
  schedule:
    # Nightly at 03:37 UTC = ~12:37 JST. Off-minute :37 (distinct from the
    # docs-registry :23 and deps-toml :17 gates) to spread runner load.
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: data-ownership-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Babashka
        run: |
          curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb-install
          chmod +x /tmp/bb-install
          sudo /tmp/bb-install --version 1.12.218
          bb --version

      - name: lint:provenance (RAD holdings cross-reference 80-data)
        run: |
          bb lint:provenance
          # exits non-zero on any holding missing required fields or whose
          # :rad/cidv1 is not recorded in 80-data.

      - name: rad:ownership-matrix --check (matrix freshness)
        run: |
          bb rad:ownership-matrix --check
          # exits non-zero if ownership-matrix.edn is stale vs manifests + journals.
