name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Lefthook
      run: npm install -g @evilmartians/lefthook

    - name: Run Lefthook pre-commit
      run: lefthook run pre-commit

    - name: Test etzhayyim-sdk
      working-directory: 20-actors/etzhayyim-sdk
      run: |
        npm install
        npm run test
