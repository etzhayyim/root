name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history so the substrate-boundary check below can diff
        # against the base branch on pull_request events.
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Lefthook
      run: npm install -g @evilmartians/lefthook

    - name: Run Lefthook pre-commit
      run: lefthook run pre-commit

    - name: Substrate-boundary backstop (PR diff)
      # Lefthook's pre-commit operates on staged files; in CI we want a
      # belt-and-braces check against the actual PR diff so a contributor
      # who skipped the local hook (--no-verify, lefthook not installed)
      # still gets caught. ADR-2605191648.
      if: github.event_name == 'pull_request'
      run: |
        BASE="origin/${{ github.base_ref }}"
        git fetch origin "${{ github.base_ref }}" --depth=200 || true
        CHANGED=$(git diff --name-only "$BASE...HEAD" \
          -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.py' '*.svelte' \
          | tr '\n' ' ')
        if [ -z "$CHANGED" ]; then
          echo "no scannable files in PR diff — skipping"
          exit 0
        fi
        echo "Scanning $(echo $CHANGED | wc -w | tr -d ' ') changed file(s) for substrate-boundary violations…"
        node 70-tools/scripts/lint/substrate-boundary.mjs $CHANGED

    # The @etzhayyim/sdk vitest suite moved to test.yml's path-scoped `sdk-test`
    # job (ADR-2605302355 CI review) so an SDK-local issue no longer red-lights
    # the always-on constitutional gate (lefthook + substrate-boundary) for every
    # docs / Rust / Python / lexicon PR.
