name: yorishiro-audit

# Per ADR-2605211900 Phase 5: every push / PR that touches the yorishiro
# surface (lexicons, kami specs, cells, MCP servers, generator, hook) must
# clear:
#   1. `yorishiro audit` (extension-field correctness across every emitted lexicon)
#   2. the no-external-purchase-purpose lefthook hook (charter purpose denylist)
#   3. regen idempotency (regen of every registered yorishiro produces no diff)
#
# This is the on-CI counterpart to the lefthook hook of the same name — the
# hook guards the developer's machine, this workflow guards main.

on:
  pull_request:
    branches: [main]
    paths:
      - '00-contracts/lexicons/ai/etzhayyim/yorishiro/**'
      - '00-contracts/openapi/kami/**'
      - '00-contracts/kami/**'
      - '70-tools/etzhayyim-cli/yorishiro/**'
      - '70-tools/scripts/lint/no-external-purchase-purpose.mjs'
      - 'skills/etzhayyim-yorishiro-**'
      - '.github/workflows/yorishiro-audit.yml'
  push:
    branches: [main]
    paths:
      - '00-contracts/lexicons/ai/etzhayyim/yorishiro/**'
      - '00-contracts/openapi/kami/**'
      - '00-contracts/kami/**'
      - '70-tools/etzhayyim-cli/yorishiro/**'
      - '70-tools/scripts/lint/no-external-purchase-purpose.mjs'
      - 'skills/etzhayyim-yorishiro-**'
      - '.github/workflows/yorishiro-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    name: yorishiro Charter compliance + regen idempotency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tsx
        run: npm install -g tsx@^4

      - name: yorishiro audit (Charter compliance)
        run: tsx 70-tools/etzhayyim-cli/yorishiro/src/cli.ts audit

      - name: no-external-purchase-purpose hook (all yorishiro lexicons)
        run: |
          shopt -s nullglob
          files=(00-contracts/lexicons/ai/etzhayyim/yorishiro/*/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "(no yorishiro lexicons present — skipping)"
            exit 0
          fi
          node 70-tools/scripts/lint/no-external-purchase-purpose.mjs "${files[@]}"

      - name: regen idempotency (every registered yorishiro)
        run: |
          shopt -s nullglob
          regs=(70-tools/etzhayyim-cli/yorishiro/registry/*.json)
          if [ ${#regs[@]} -eq 0 ]; then
            echo "(no yorishiri registered — skipping)"
            exit 0
          fi
          for r in "${regs[@]}"; do
            name=$(basename "$r" .json)
            echo "::group::regen $name"
            tsx 70-tools/etzhayyim-cli/yorishiro/src/cli.ts regen "$name"
            echo "::endgroup::"
          done
          # If regen produced any diff inside the yorishiro tree, the
          # generator output drifted from its kami spec and must be
          # re-committed. Diff is scoped to yorishiro paths so unrelated
          # uncommitted state (CI checkout is clean anyway) cannot be
          # the source of failure.
          if ! git diff --quiet -- \
              ':(glob)00-contracts/lexicons/ai/etzhayyim/yorishiro/**' \
              ':(glob)skills/etzhayyim-yorishiro-**' \
              ':(glob)70-tools/etzhayyim-cli/yorishiro/registry/**'; then
            echo "::error::regen produced uncommitted diff — generator output is stale"
            git diff --stat -- \
              ':(glob)00-contracts/lexicons/ai/etzhayyim/yorishiro/**' \
              ':(glob)skills/etzhayyim-yorishiro-**' \
              ':(glob)70-tools/etzhayyim-cli/yorishiro/registry/**'
            exit 1
          fi
          echo "regen idempotent across $(ls 70-tools/etzhayyim-cli/yorishiro/registry/*.json | wc -l) yorishiri"

      - name: list summary
        if: always()
        run: tsx 70-tools/etzhayyim-cli/yorishiro/src/cli.ts list || true
