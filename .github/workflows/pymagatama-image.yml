name: pymagatama-image

# Build + push the pymagatama container image used by every Python langserver
# Deployment under 50-infra/k8s/lg-*/ (currently lg-open-unispsc; lg-isin and
# others follow the same pattern). Path-filtered so commits outside the
# Python tree don't burn CI minutes.

on:
  push:
    branches: [main]
    paths:
      - "20-actors/magatama/py/**"
      - "20-actors/magatama/cells/**"
      - "50-infra/cluster/murakumo/cell-runner/cells.toml"
      - ".github/workflows/pymagatama-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "20-actors/magatama/py/**"
      - "20-actors/magatama/cells/**"
      - "50-infra/cluster/murakumo/cell-runner/cells.toml"
      - ".github/workflows/pymagatama-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pymagatama-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TS="$(date -u +%Y%m%d%H%M%S)"
          {
            echo "short_sha=${SHORT_SHA}"
            echo "ts=${TS}"
            echo "sha_tag=ghcr.io/etzhayyim/pymagatama:${SHORT_SHA}-${TS}"
            echo "main_tag=ghcr.io/etzhayyim/pymagatama:main"
          } >> "$GITHUB_OUTPUT"

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 20-actors/magatama/py/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.main_tag }}
          cache-from: type=registry,ref=ghcr.io/etzhayyim/pymagatama:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=ghcr.io/etzhayyim/pymagatama:buildcache,mode=max' || '' }}
          provenance: false
          build-args: |
            CACHE_BUST=${{ steps.tags.outputs.ts }}

      - name: Report pushed tag
        if: github.event_name != 'pull_request'
        run: |
          echo "::notice::Pushed ${{ steps.tags.outputs.sha_tag }}"
          echo "::notice::Pushed ${{ steps.tags.outputs.main_tag }}"
