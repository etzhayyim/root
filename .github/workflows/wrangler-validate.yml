name: wrangler-validate
on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event.label.name == 'deploy-preview' || contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        actor:
          - open-banking
          - hanrei
          - ipaddress
          - sbom
          - kiyo
          - ki
          - koke
          - hakkou
          - otakiage
          - houki
          - houbun
          - isin
          - isbn
          - gtin
          - dns
          - ndc
          - ocel
          - houshi
          - anime
          - manga
          - narou
          - gameka
          - bpmn
          - open-denki
          - yoro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm@10 wrangler@latest
      - name: Install deps
        run: pnpm install --frozen-lockfile || pnpm install
      - name: wrangler deploy --dry-run
        working-directory: 60-apps/etzhayyim-project-${{ matrix.actor }}/xrpc-adapter
        run: wrangler deploy --dry-run --outdir=/tmp/wrangler-out
