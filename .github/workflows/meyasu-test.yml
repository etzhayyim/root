name: meyasu-test

# Path-scoped test gate for the meyasu 目安 unified arbitrage orchestrator. Kept separate
# from the always-on ci.yml constitutional gate so an actor-local test issue does not
# red-light unrelated PRs (ADR-2605302355 pattern). Deploy-autonomy: run_tests.sh is the
# local gate; CI re-asserts it on every PR that touches the actor.

on:
  push:
    branches: [ "main" ]
    paths:
      - '20-actors/meyasu/**'
  pull_request:
    paths:
      - '20-actors/meyasu/**'

jobs:
  meyasu-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # meyasu's suite is pure Clojure/babashka now (ADR-2606142300 D1 clj-native
      # SSoT); the Set up Python + pip install pytest steps predate the port and
      # never invoked anything (run_tests.sh has always shelled to `bb`, not pytest).
      - name: Set up Babashka
        run: |
          curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb-install
          chmod +x /tmp/bb-install
          sudo /tmp/bb-install --version 1.12.218
          bb --version

      - name: Run meyasu agent suite
        run: bash 20-actors/meyasu/run_tests.sh
