name: meyasu-test

# Path-scoped test gate for the meyasu 目安 unified arbitrage orchestrator. Kept separate
# from the always-on ci.yml constitutional gate so an actor-local test issue does not
# red-light unrelated PRs (ADR-2605302355 pattern). Deploy-autonomy: run_tests.sh is the
# local gate; CI re-asserts it on every PR that touches the actor.

on:
  push:
    branches: [ "main" ]
    paths:
      - '20-actors/meyasu/**'
  pull_request:
    paths:
      - '20-actors/meyasu/**'

jobs:
  meyasu-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run meyasu agent suite
        run: bash 20-actors/meyasu/run_tests.sh
