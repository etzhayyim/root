version: 2
updates:
  # Standalone repositories own their own dependency updates; this file covers
  # only packages retained by root.
  - package-ecosystem: "npm"
    directory: "/50-infra/anchor-cron"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/50-infra/etzhayyim-chain-contracts/lib/forge-std"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/50-infra/etzhayyim-did-web"
    schedule:
      interval: "weekly"
  # 7 Foundry-vendored-lib subpath entries removed iter-23 of /loop
  # (2026-05-26). They referenced paths that don't exist on disk:
  #   - etzhayyim-membership-contract/lib/forge-std (not vendored here)
  #   - etzhayyim-paymaster/lib/account-abstraction/contracts (submodule
  #     subpath; dependabot can't scan submodule subpaths)
  #   - etzhayyim-paymaster/lib/forge-std (not vendored at this path —
  #     forge-std lives under etzhayyim-{authz,chain-contracts,k2,...}/
  #     and the l2-anchor-contract/yobel-contract/fiat-bridge paths)
  #   - etzhayyim-paymaster/lib/openzeppelin-contracts/{contracts,
  #     lib/forge-std, lib/forge-std/lib/ds-test, scripts/solhint-custom}
  #     — all submodule subpaths
  # The top-level submodule entries (`lib/account-abstraction` and
  # `lib/openzeppelin-contracts`) themselves are kept above — dependabot
  # CAN scan submodule roots, just not sub-paths inside them.
  # Same hygiene as the ADR-2605265200 retirement (iter-18 commit
  # 18967431a): when a directory disappears, dependabot's entry is dead
  # weight and should be removed so weekly runs stop silently failing.
  - package-ecosystem: "npm"
    directory: "/50-infra/etzhayyim-paymaster/lib/account-abstraction"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/50-infra/etzhayyim-paymaster/lib/openzeppelin-contracts"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/50-infra/etzhayyim-pds-did-web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/50-infra/ipfs-pinner"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/50-infra/mst-projector"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/50-infra/sveltejs-adapter-wasm"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/50-infra/sveltejs-adapter-wasm/demos/demo-javy"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/50-infra/sveltejs-adapter-wasm/demos/demo-ssg"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/50-infra/sveltejs-adapter-wasm/demos/demo-tinygo-qjs"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/50-infra/sveltejs-adapter-wasm/demos/demo1"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/50-infra/sveltejs-adapter-wasm/projects/sveltejs-adapter-wasm/adapter"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/50-infra/vultr/geth-private/contracts"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/50-infra/sveltejs-adapter-wasm/projects/sveltejs-adapter-wasm/wasm/quickjs-engine"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/70-tools/maps-osm-ingest"
    schedule:
      interval: "weekly"
