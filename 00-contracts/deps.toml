2. PublicLandRegistry.sol (Base L2 chainId 8453) — NEW R0 SCAFFOLD.
   ERC-721 + ERC-5192 + ERC-165. All state-mutating functions revert
   `NotYetActivated()`. Activation via Council ≥3 multisig post-Bootstrap-
   Council (post 2026-06-19) in separate activation ADR. Mints only via
