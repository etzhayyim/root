summary = "Process mining contract entrypoint is ai.gftd.apps.bpmn.analyzeProcess"
details = """
The phrase "process mining" maps to the Lexicon query
`ai.gftd.apps.bpmn.analyzeProcess` unless a request explicitly names another
tool. The contract accepts filter params over BPMN/Zeebe OCEL audit events and
returns deterministic KPIs plus optional LLM diagnosis. It is intentionally
Optimize-free and does not assume Operate, Tasklist, Elasticsearch, or
OpenSearch.
"""
impact = "Lexicon authoring, XRPC clients, BPMN analytics contracts"
