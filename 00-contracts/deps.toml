# 00-contracts — Layer 0: AT Protocol contracts
#
# 各サブディレクトリはそれぞれの領域の情報を所有する:
#   - Lexicon JSON: AT Protocol wire format + NSID 定義
#   - BPMN / DMN / Forms: app-level process artifacts

name = "00-contracts"
layer = 0
tier = "production"
role = "contracts"
description = "Layer 0 contracts — AT Protocol Lexicon JSON plus app process artifacts"
language = "json+typescript"

depends_on = []

provides = [
  "lexicons/",                 # AT Protocol Lexicon JSON (wire format)
  "bpmn/",
  "dmn/",
  "forms/",
]

[invariants]
lexicon_nsid_count = 2695

[subdirs.lexicons]
role = "at-protocol-lexicon"
tier = "production"
description = "AT Protocol Lexicon JSON (wire format + NSID 定義)"

[subdirs."lexicons/ai"]
role = "lexicon-ai-gftd"
tier = "production"
description = "ai.gftd.* Lexicon JSON (2344 NSID files, permission scopes, 9 permission-set Lexicons)"

[subdirs."lexicons/ai/gftd"]
role = "lexicon-ai-gftd-scope"
tier = "production"
description = "ai.gftd.* leaf namespace"

[subdirs."lexicons/ai/gftd/apps/graphSosIntel"]
role = "graph-sos-intel-lexicons"
tier = "production"
kind = "lexicon-namespace"
flags = ["editable"]
description = "Graph SoS Intel XRPC query contracts for health, relation inventory, and open findings."

[files."at-protocol-nsids.json"]
role = "nsid-registry"
flags = ["editable"]
description = "Complete AT Protocol NSID registry"

[files."README.md"]
role = "doc"
flags = ["editable"]

[files."schemas/agent-runtime-registration.schema.json"]
role = "public-schema"
kind = "contract"
toolchain = "json-schema"
workspace = "standalone"
flags = ["editable"]
description = "Public ERC-8004-compatible agent runtime registration schema; agentURI document shape for ERC725/IPFS/MCP/k8s runtime discovery."

[files."schemas/k8s-runtime-public.schema.json"]
role = "public-schema"
kind = "contract"
toolchain = "json-schema"
workspace = "standalone"
flags = ["editable"]
description = "Redacted public Kubernetes runtime projection schema for IPFS publication; excludes env, secret refs, service-account tokens, and private URLs."

[knowledge."yoro-bpmn-pyzeebe-social-v2-20260425"]
discovered_on = "2026-04-25"
category = "architecture"
severity = "info"
status = "active"
summary = "Yoro reactive social processes are BPMN definitions backed by PyZeebe service tasks"
details = """
`00-contracts/bpmn/ai/gftd/yoro/{platformPulse,respondToMention,respondToFollow}.bpmn`
remain the process SSoT. The BPMN files now call PyZeebe task types
`yoro.social.{platformPulse,respondToMention,respondToFollow}GraphFallback`
instead of assembling JSON with FEEL or calling PDS directly from the process.
This keeps CF Workers as thin trigger edges and moves long-running actor
execution into K8s/Zeebe/PyZeebe.
"""
impact = "Yoro CF Worker migration, Zeebe process deployment, PyZeebe worker image"

[knowledge."yoro-post-translation-bpmn-gemma-20260514"]
discovered_on = "2026-05-14"
category = "architecture"
severity = "info"
status = "active"
summary = "Yoro post translation is a BPMN-backed LangServer task using Gemma 4 E4B"
details = """
`00-contracts/bpmn/ai/gftd/yoro/{translatePost,translatePostBatch}.bpmn`
define the single-post and multi-language translation processes. They call
PyZeebe task types `yoro.social.translatePost` and
`yoro.social.translatePostBatch` on the yoro actor LangServer worker.
The worker creates translated sibling `app.bsky.feed.post` records and writes
`ai.gftd.apps.media_gamers.record.translationLink` projection rows so
`yoro.gftd.ai` post detail can render language tabs without changing AT URI
semantics. The Murakumo route is pinned to `gemma-4-e4b-it`.
"""
impact = "Yoro multilingual post UX, LangServer task routing, Murakumo Gemma 4 E4B usage"

