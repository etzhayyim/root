[knowledge."graph-consumer-bpmn-bridge-20260425"]
discovered_on = "2026-04-25"
category = "architecture"
severity = "info"
status = "active"
summary = "Graph repo-commit consumer has a BPMN/PyZeebe scheduling bridge"
details = """
`00-contracts/bpmn/ai/gftd/graph/consumeRepoCommits.bpmn` defines the
one-minute graph consumer tick. It calls PyZeebe task type
`graph.repo.consumeCommits`, which invokes the existing Cloudflare Worker
`/consume` endpoint and records each run as
`ai.gftd.apps.graph.consumeTick` in `vertex_repo_record`. This keeps the
projection implementation in the Worker while moving cron/retry ownership to
K8s/Zeebe. The worker pod must set `GRAPH_CONSUMER_URL` to the routable
`/consume` URL before the BPMN timer is activated.
"""
impact = "Graph CF scheduled cron migration, K8s Zeebe worker rollout"

