[knowledge."zeebe-85-compatibility-contracts-20260429"]
discovered_on = "2026-04-29"
category = "license-architecture"
severity = "warning"
status = "active"
summary = "BPMN contracts target the Zeebe 8.5.23 compatibility track until Camunda 8.6+ licensing is resolved"
details = """
ADR-0056 now treats `camunda/zeebe:8.5.23` as the short-term runtime target for
the BPMN contract corpus. Existing BPMN files may continue to use
`zeebe:taskDefinition` and `zeebe:ioMapping` because pyzeebe workers remain the
execution substrate. Do not introduce Camunda Operate / Tasklist / Optimize
dependencies into `00-contracts` BPMN assumptions under this posture.

The 8.5 track is EOL and is accepted only as a compatibility bridge. Any future
move to Camunda 8.6+ self-managed production requires Enterprise/SaaS approval
or an approved OSS/self-owned runtime replacement. Live downgrade from the
current 8.6 broker must use fresh broker state per
`50-infra/vultr/zeebe/8.5-downgrade-runbook.md`; do not assume existing Zeebe
partition data is downgrade-compatible.
"""
impact = "BPMN XML authoring constraints, pyzeebe task contract stability, Camunda licensing posture"
references = [
  "90-docs/adr/0056-bpmn-as-actor.md",
  "50-infra/vultr/zeebe/zeebe.yaml",
  "50-infra/vultr/zeebe/8.5-downgrade-runbook.md",
  "30-graph/graph-schema/migrations/20260429161000_seed_camunda_zeebe_license_policy.ts",
]

