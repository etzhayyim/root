[knowledge."etzhayyim-land-data-substrate-open-only-policy-20260525"]
discovered_on = "2026-05-25"
category = "governance"
severity = "info"
status = "active"
summary = "Open-only license policy for the etzhayyim Land Trust supplementary world-land context data substrate (ADR-2605252330). CC-BY-NC* structurally excluded per Charter Rider §2(e)(i) anti-gatekeeping. Marine Regions / VLIZ / Global Fishing Watch prohibited."
details = """
ADR-2605252330 establishes the license-compatibility filter for the Land Trust
supplementary world-land context data substrate (customary tenure / indigenous
nations / maritime EEZ ingest, separate from the on-chain Land Registry).

License ranks:
- ✅✅ CC0 / Public Domain / US Federal Works (Wikidata, US TIGER, Natural Earth,
  UNCLOS DOALOS) — preferred bedrock
- ✅ CC-BY 4.0 + state open data (OGL-Canada, Australian Gov, FAO, UK OGL) + ODbL
  (OpenStreetMap, application-consumed database) — permitted
- 🟡 CC-BY-SA 4.0 — pin-only carve-out: record-level IPFS pin with licenseMetadata,
  NO statistical mixing into derivative works (Native Land Digital falls here)
- ❌ CC-BY-NC* (any -NC variant) — PROHIBITED, structurally violates §2(e)(i)
- ❌ CC-BY-ND — PROHIBITED, no-derivatives blocks religious-corp work
- ❌ proprietary — PROHIBITED

Doctrinal grounding: Charter Rider §2(e) prohibits artificial restriction of
professional knowledge / data. CC-BY-NC paywall IS such restriction regardless
of the licensor's social-purpose framing. Marine Regions / VLIZ / Global
Fishing Watch / similar CC-BY-NC* are therefore structurally excluded from
the religious-corp substrate — not as a technical license compatibility issue
but as a doctrinal alignment.

Per-domain open-only achievable coverage:
- Customary tenure: ~5% of land area (Wikidata CC0 + OSM ODbL + LandMark
  filtered CC-BY). Native Land Digital pin-only.
- Indigenous nations: ~60% of state-recognized territories (US TIGER public
  domain + Brazil FUNAI + Canada AANDC OGL + Australia NNTT CC-BY + Brazil /
  Colombia / Peru / NZ government open data).
- Maritime EEZ: ~30-40% production-grade (UNCLOS DOALOS state submissions +
  NOAA US-domain + Wikidata bedrock) + 100% Natural Earth coarse-grain.
  Major resolution loss due to VLIZ Marine Regions exclusion.

Pinned-record metadata requirement: every record carries
`coverage_constraint: \"open-only-policy-2605252330\"` so consumers can query
the constraint.

R0 deliverables landed: this ADR (policy only — no code, no contract, no
lexicon, no fetcher), [[adrs]] entry in root deps.toml, this knowledge entry,
adr/README.md index row.

Non-goals R0: no fetcher implementation / no specific source ingest mandate /
no on-chain integration of supplementary data (lives at dataset layer per
ADR-2605241500 IPFS pinning, NOT on Land Registry chain) / no authoritative
claim (supplementary substrate is contextual reference only) / no retroactive
license re-classification.

Activation path = per-source activation ADRs (Wikidata + US TIGER + Australia
NNTT + Brazil FUNAI + Canada AANDC etc.), each Council Lv6+ ≥3 multisig
ratified.
"""
impact = "Doctrinal alignment of data ingest policy with Charter Rider §2(e); license-hygienic IPFS pinning substrate for world-land context; Marine Regions / VLIZ exclusion as doctrinal stance not technical limitation; first-mover open-release signal to indigenous-rights / maritime-research / customary-tenure aggregators"
