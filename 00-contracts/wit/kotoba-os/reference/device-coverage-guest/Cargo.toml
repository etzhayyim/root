# Binding-coverage smoke component (ADR-2606031600): a single plc-control guest
# that touches EVERY kotoba:os device interface, so its tree-shaken imports cover
# the whole device surface (io-{digital,analog,gpio} + fieldbus-{modbus,opcua,
# ethercat,canopen} + datom). Proves all device worlds bind to real WASM imports.
# NOT a realistic controller — a completeness check that the WIT surface compiles.
[package]
name = "device-coverage-guest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "kotoba:os device-surface binding-coverage component (all interfaces)"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.51"
