[package]
name = "tonbo"
version = "0.1.0"
edition = "2024"

[lib]
name = "tonbo"
path = "src/lib.rs"

[[bin]]
name = "tonbo"
path = "src/main.rs"

[dependencies]
arrow = { version = "58", features = ["ipc"] }
arrow-flight = { version = "53", features = ["flight-sql-experimental"] }
arrow-ipc = "54"
arrow-json = "58"
arrow-schema = "58"
async-trait = "0.1"
axum = "0.8"
once_cell = "1"
prometheus = { version = "0.14", features = ["process"] }
chrono = "0.4"
dashmap = "6"
datafusion = "42"
futures = "0.3"
lance = "0.20"
lance-index = "0.20"
lance-linalg = "0.20"
lance-table = "0.20"
object_store = { version = "=0.11.2", features = ["aws"] }
ocra = "0.1.1"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
