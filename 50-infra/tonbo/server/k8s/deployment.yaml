apiVersion: apps/v1
kind: Deployment
metadata:
  name: tonbo
  namespace: default
  labels:
    app.kubernetes.io/name: tonbo
    app.kubernetes.io/component: datafusion
spec:
  replicas: 1
  minReadySeconds: 20
  progressDeadlineSeconds: 900
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tonbo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tonbo
        app.kubernetes.io/component: datafusion
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: tonbo
          image: ghcr.io/gftdcojp/tonbo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
              name: http
            - containerPort: 50050
              name: flightsql
          env:
            # S3/B2-compatible object storage — required
            - name: TONBO_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tonbo-s3-credentials
                  key: TONBO_S3_ACCESS_KEY
            - name: TONBO_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tonbo-s3-credentials
                  key: TONBO_S3_SECRET_KEY
            - name: TONBO_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: tonbo-s3-credentials
                  key: TONBO_S3_ENDPOINT
            - name: TONBO_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: tonbo-s3-credentials
                  key: TONBO_S3_REGION
            - name: TONBO_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: tonbo-s3-credentials
                  key: TONBO_S3_BUCKET
            # Lance dataset URI, e.g. s3://<bucket>/<prefix>
            - name: TONBO_LANCE_URI
              value: s3://my-bucket/my-lancedb
            - name: TONBO_READ_THROUGH_CACHE_BYTES
              value: "0"
            - name: TONBO_S3_VIRTUAL_HOSTED_STYLE
              value: "false"
            - name: LISTEN_ADDR
              value: "0.0.0.0:8084"
            - name: FLIGHT_SQL_ADDR
              value: "0.0.0.0:50050"
            - name: RUST_LOG
              value: tonbo=info,lance=warn
          resources:
            requests:
              cpu: "400m"
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tonbo
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tonbo
---
apiVersion: v1
kind: Service
metadata:
  name: tonbo
  namespace: default
  labels:
    app.kubernetes.io/name: tonbo
spec:
  selector:
    app.kubernetes.io/name: tonbo
  ports:
    - name: http
      port: 8084
      targetPort: http
    - name: flightsql
      port: 50050
      targetPort: flightsql
