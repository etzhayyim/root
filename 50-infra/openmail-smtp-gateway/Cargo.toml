[package]
name = "openmail-smtp-gateway"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "etzhayyim openmail SMTP bridge — terminates legacy SMTP and relays to kotoba-server email XRPC (ADR-2605172200)"

[lib]
name = "openmail_smtp_gateway"
path = "src/lib.rs"

[[bin]]
name = "openmail-smtp-gateway"
path = "src/main.rs"

[dependencies]
# Pure-core deps only (lib compiles + tests without a network stack).
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
# DKIM (RFC 6376 / RFC 8463). No RNG needed: keys come from the member's ARK
# (client-side); this crate only signs/verifies with given keys. ed25519-sha256
# is charter-native; rsa-sha256 is the RFC 8463 co-signature for receiver compat.
sha2 = "0.10"
ed25519-dalek = "2"
rsa = { version = "0.9", features = ["sha2", "pem"] }
# keccak256 for Postage.sol message-hash binding + event-topic computation.
sha3 = "0.10"

# The listener daemon (sockets + HTTP to kotoba-server) lives behind a feature
# so `cargo test` exercises the pure SMTP/render/routing core without pulling
# tokio + reqwest. Build the binary with `--features daemon`.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[features]
default = []
daemon = ["dep:tokio", "dep:reqwest"]
