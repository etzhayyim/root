name = "etzhayyim-legal-comms"
main = "src/worker.ts"
compatibility_date = "2026-05-30"

# Counsel-operated comms gateway (ADR-2605302345 §D2, G18).
# XRPC base: https://legal-comms.etzhayyim.com/xrpc/com.etzhayyim.legal.*
# DNS + route binding deferred to deploy.

# no-server-key: this Worker holds NO legal-act signing key, seal or credential.
# Every legal act is actuated + signed by a human lawyer licensed in the
# destination jurisdiction; the lawyer's signature reference is supplied in the
# request. sendLegalAct (G18) throws without a valid counselActuation, so an
# autonomous (lawyer-absent) filing is impossible by construction.
