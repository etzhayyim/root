apiVersion: etzhayyim.com/v1alpha1
kind: MurakumoMeshTopology
metadata:
  name: etzhayyim-murakumo
  labels:
    etzhayyim.com/topology: murakumo-mesh
  adr:
    - "2605191346"  # no commercial K8s
    - "2605182312"  # 12-tribes naming
    - "2605192415"  # religious-corp daemon architecture
    - "2605191603"  # swarm leader election
    - "2605191524"  # swarm broadcast
    - "2605191645"  # heartbeat
spec:
  controlPlane:
    implementation: launchd + kotodama-cell-runner + tailmesh
    mode: peer-to-peer
    hubCluster: null            # no hub — explicitly null
    memberClusters: null        # no member/hub split — all peers
    leaderElection:
      kind: swarm
      adr: "2605191603"
      perCellRoleLeader: true
      replicaNode: asher
    overlay:
      kind: tailmesh
      crypto: X25519 + XChaCha20-Poly1305
      source: 50-infra/cluster/murakumo/src/murakumo_mesh.rs
      tailscale: forbidden        # explicit ban
      wireguard: forbidden        # explicit ban (replaced by tailmesh)
      karmada: forbidden          # explicit ban
      etcd: forbidden             # explicit ban
      k8sApiServer: forbidden     # explicit ban (per ADR-2605191346)

  fleet:
    name: etzhayyim-murakumo
    source: 50-infra/murakumo/fleet.toml
    nodes:
      - name: naphtali
        hostname: naphtalinomac-mini.local
        role: charter-compliance-leader + kuni-umi-survey-leader
        labels:
          etzhayyim.com/cell-role: charter-leader
          etzhayyim.com/location: murakumo-lan
          etzhayyim.com/gpu.apple-vulkan: "true"
          etzhayyim.com/standing-replica: "false"

      - name: simeon
        hostname: simeonnomac-mini.local
        role: ipfs-pinner + stewardship-leader + kuni-umi-commission-leader
        labels:
          etzhayyim.com/cell-role: steward-leader
          etzhayyim.com/location: murakumo-lan
          etzhayyim.com/gpu.apple-vulkan: "true"
          etzhayyim.com/standing-replica: "false"
        infrastructure:
          - ipfs-pinner
        adr: "2605171800"

      - name: judah
        hostname: judahnomac-mini.local
        role: land-trust-leader
        labels:
          etzhayyim.com/cell-role: land-leader
          etzhayyim.com/location: murakumo-lan
          etzhayyim.com/gpu.apple-vulkan: "true"
          etzhayyim.com/standing-replica: "false"

      - name: zebulun
        hostname: zebulunnomac-mini.local
        role: economic-leader + kuni-umi-planning-leader
        labels:
          etzhayyim.com/cell-role: economic-leader
          etzhayyim.com/location: murakumo-lan
          etzhayyim.com/gpu.apple-vulkan: "true"
          etzhayyim.com/standing-replica: "false"

      - name: levi
        hostname: levinomac-mini.local
        role: membership + council-orchestration + kuni-umi-audit-leader
        labels:
          etzhayyim.com/cell-role: council-leader
          etzhayyim.com/location: murakumo-lan
          etzhayyim.com/gpu.apple-vulkan: "true"
          etzhayyim.com/standing-replica: "false"

      - name: joseph
        hostname: josephnomac-mini.local
        role: phenotype-agent-shard-0 + kuni-umi-construction-leader
        labels:
          etzhayyim.com/cell-role: phenotype-shard-0 + construction-leader
          etzhayyim.com/location: murakumo-lan
          etzhayyim.com/gpu.apple-vulkan: "true"
          etzhayyim.com/standing-replica: "false"
        shard:
          index: 0
          total: 3

      - name: issachar
        hostname: issacharnomac-mini.local
        role: phenotype-agent-shard-1
        labels:
          etzhayyim.com/cell-role: phenotype-shard-1
          etzhayyim.com/location: murakumo-lan
          etzhayyim.com/gpu.apple-vulkan: "true"
          etzhayyim.com/standing-replica: "false"
        shard:
          index: 1
          total: 3

      - name: dan
        hostname: dannomac-mini.local
        role: phenotype-agent-shard-2 + kuni-umi-decommission-leader
        labels:
          etzhayyim.com/cell-role: phenotype-shard-2 + decommission-leader
          etzhayyim.com/location: murakumo-lan
          etzhayyim.com/gpu.apple-vulkan: "true"
          etzhayyim.com/standing-replica: "false"
        shard:
          index: 2
          total: 3

      - name: benjamin
        hostname: benjaminomac-mini.local
        role: force + ethics leader
        labels:
          etzhayyim.com/cell-role: force-leader + ethics-leader
          etzhayyim.com/location: murakumo-lan
          etzhayyim.com/gpu.apple-vulkan: "true"
          etzhayyim.com/standing-replica: "false"
        status: pending_wol_2026_05_18

      - name: asher
        hostname: ashernomac-mini.local
        role: replica + failover (any cell)
        labels:
          etzhayyim.com/cell-role: replica
          etzhayyim.com/location: murakumo-lan
          etzhayyim.com/gpu.apple-vulkan: "true"
          etzhayyim.com/standing-replica: "true"
        replicas_of: ["*"]
        status: pending_wol_2026_05_18

  inferencePods:
    - name: evo-x2
      kind: gpu-inference-pod
      atMember: false                # NOT an AT Protocol member
      did: null                      # NO DID — pod is LAN-only resource
      host_lan: 192.168.1.70
      os: Windows 11 Pro 24H2
      adr: "2605202345"
      labels:
        etzhayyim.com/cell-role: inference-backend
        etzhayyim.com/gpu.amd-rocm: "true"
      endpoints:
        ollama: http://192.168.1.70:11434
        litellm: http://192.168.1.70:4000
        comfyui: http://192.168.1.70:8188

  serviceBoundaries:
    controlPlane:
      inboundFromInternet: false
      peerToPeer: true
      secretStorage: "macOS Keychain (DID_PRIVATE_KEY_ED25519) + 1Password mirror; never git"
    dataPlane:
      crossClusterDns: false            # no cross-cluster — single peer-to-peer mesh
      crossClusterPodCidrMerge: false   # no pod CIDR at all (no K8s)
      explicitGateways:
        - tailmesh                       # in-tree, X25519 + XChaCha20-Poly1305
        - cloudflare-tunnel              # public ingress (murakumo.etzhayyim.com)
      forbiddenGateways:
        - karmada
        - tailscale
        - wireguard
        - vke-loadbalancer
