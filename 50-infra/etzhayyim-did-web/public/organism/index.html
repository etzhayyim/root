<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>etzhayyim — organism · 生命活動</title>
<meta name="description" content="etzhayyim artificial organism — per-cell life activity (clj 内部代謝 / actor 細胞間シグナル / atproto 外界代謝) over the kotoba Datom log.">
<style>
  :root{--bg:#0b0f14;--panel:#121922;--line:#1e2733;--ink:#e6edf3;--mut:#8b97a6;
        --alive:#39d98a;--dormant:#f5a524;--stub:#5b6472;--clj:#39d98a;--act:#7aa2ff;--atp:#f078c0}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 800px at 50% -10%,#10212a,var(--bg));
       color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
  header.hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-bottom:6px}
  header.hd h1{font-size:20px;margin:0;letter-spacing:.02em}
  header.hd .sub{color:var(--mut);font-size:12px}
  .pills{display:flex;gap:8px;margin:10px 0 18px}
  .pill{padding:5px 11px;border-radius:999px;font-weight:600;font-size:13px;border:1px solid var(--line)}
  .pill.a{color:var(--alive)} .pill.d{color:var(--dormant)} .pill.s{color:var(--stub)}
  .pill b{font-size:15px}
  .cols{display:grid;grid-template-columns:1.4fr .9fr;gap:18px}
  @media(max-width:840px){.cols{grid-template-columns:1fr}}
  .dish{display:block;background:radial-gradient(420px 420px at 50% 50%,#0e1620,#0b0f14);
        border:1px solid var(--line);border-radius:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .card h2{margin:.1em 0 .2em;font-size:17px} .card h3{margin:.1em 0 .6em;font-size:14px;color:var(--mut);font-weight:600}
  .muted{color:var(--mut);font-size:12px;margin-bottom:10px}
  .axis{display:flex;align-items:center;gap:8px;margin:7px 0}
  .axis .alab{width:108px;font-size:12px;color:var(--mut)}
  .axis .track{flex:1;height:8px;background:#0c1219;border-radius:6px;overflow:hidden}
  .axis .fill{height:100%;border-radius:6px;transition:width .4s}
  .axis .aval{width:46px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
  ul.facts{list-style:none;padding:0;margin:10px 0 0;font-size:13px}
  ul.facts li{padding:3px 0;border-top:1px solid var(--line);color:#cdd7e1}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .hint{color:var(--mut);font-size:13px;padding:6px 0}
  .pulse{animation:p 2.4s ease-out infinite}
  @keyframes p{0%{opacity:.5;r:0}100%{opacity:0}}
  a{color:var(--act)}
  .foot{color:var(--mut);font-size:11px;margin-top:18px;line-height:1.7}
  /* ── realtime: 呼吸 / 編集中 / コミット ── */
  .dish .cell{transform-box:fill-box;transform-origin:center;
              animation:breath var(--bd,4s) ease-in-out infinite}
  @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
  .dish .cell.working{filter:drop-shadow(0 0 5px var(--alive)) drop-shadow(0 0 10px var(--alive))}
  .dish .cell.flash{animation:flash 1s ease-out !important}
  @keyframes flash{0%{transform:scale(1.8);filter:drop-shadow(0 0 12px #fff)}100%{transform:scale(1)}}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--alive);
        border:1px solid #1c3a2c;background:#0e1c16;padding:3px 10px;border-radius:999px}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--alive);animation:blink 1.4s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .ticks{display:flex;flex-direction:column;max-height:240px;overflow:auto}
  .tick{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line);font-size:12px}
  .tick:first-child{border-top:0}
  .tactor{color:var(--alive);font-weight:600;min-width:78px}
  .tsubj{flex:1;color:#cdd7e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tago{color:var(--mut);font-size:11px;white-space:nowrap}
  .moodhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .moodglyph{font-size:24px;font-weight:700}
  .wbline{margin:10px 0 4px;font-size:13px}
  .narr{margin:2px 0 12px;padding:10px 12px;border-left:3px solid var(--alive);
        background:linear-gradient(90deg,#0e1c16,transparent);border-radius:0 8px 8px 0}
  .narr .narrtext{font-size:15px;line-height:1.7;color:#eaf3ee}
  .narr .muted{margin-top:5px;font-size:11px}
  /* class glyph drawn on each cell — colour is not the only encoding (a11y/色覚) */
  .dish .cellglyph{paint-order:stroke;stroke:rgba(11,15,20,.35);stroke-width:.5px}
  /* staleness badge: a layer overdue past 2× cadence (from health.json) */
  .live.stale{color:var(--dormant);border-color:#4a3a14;background:#1c160e}
  .live.stale .dot{background:var(--dormant);animation:none}
  /* ── IE-flow (情報エネルギー流) layer: net-gain / order-index / Sankey backbone ── */
  .iegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:6px 0 12px}
  .iestat{background:#0c1219;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .iestat .ienum{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
  .iestat .iek{font-size:11px;color:var(--mut);margin-top:2px}
  /* ── IE-flow lab: Sankey + index (left) / datomic-query sliders + sims (right) ── */
  .labgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
  @media(max-width:760px){.labgrid{grid-template-columns:1fr}}
  .labctl{margin:8px 0 10px}
  .labctlhead{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:3px}
  .labctlval{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
  input.labrange{width:100%;accent-color:var(--alive);height:4px;cursor:pointer}
  .labchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
  .labchip{padding:4px 11px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
           border:1px solid var(--line);background:#0c1219;color:var(--mut);user-select:none}
  .labchip:hover{border-color:#39d98a55}
  .labchip.on{background:#0e1c16;color:var(--alive);border-color:#1c3a2c}
  .rewardline{display:flex;align-items:center;gap:12px;margin:12px 0 4px;padding:10px 12px;
              border:1px solid var(--line);border-radius:12px;background:#0c1219}
  .rewardnum{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  /* respect reduced-motion: still alive, just not animated (104 cells breathing is a lot) */
  @media (prefers-reduced-motion: reduce){
    .dish .cell,.dish .cell.flash,.pulse,.live .dot{animation:none !important}
    .dish .cell.working{filter:drop-shadow(0 0 4px var(--alive))}
  }
</style>
</head>
<body>
  <div id="app"><div class="wrap"><p class="hint">organism を読み込み中…</p></div></div>
  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    const n = (v) => new Intl.NumberFormat("en-US").format(Number(v || 0));
    const app = document.getElementById("app");

    Promise.all([
      fetch("./organism.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      fetch("./pulse.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      fetch("./health.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      fetch("./joucho.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      fetch("./trajectory.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      fetch("./sos.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]).then(([org, pulse, health, joucho, traj, sos]) => {
      const summary = org?.summary ?? {};
      const topPulse = Object.entries(pulse?.actors ?? {})
        .sort((a, b) => (b[1]?.lastAt ?? 0) - (a[1]?.lastAt ?? 0))
        .slice(0, 8)
        .map(([actor, info]) => `<li><span class="tactor">${esc(actor)}</span><span class="tsubj">${esc(info?.lastSubject ?? "")}</span><span class="tago">${n(info?.commits ?? 0)} commits</span></li>`)
        .join("");
      const trajCount = Array.isArray(traj?.points) ? traj.points.length : (Array.isArray(traj) ? traj.length : 0);
      const jouchoLine = joucho?.narration ?? joucho?.text ?? joucho?.mood ?? "live mood snapshot";
      app.innerHTML = `
        <div class="wrap">
          <header class="hd">
            <h1>etzhayyim · organism</h1>
            <div class="sub">artificial organism / live body loop</div>
            <div class="live${health?.anyStale ? " stale" : ""}"><span class="dot"></span>${health?.anyStale ? "stale" : "live"}</div>
          </header>
          <div class="pills">
            <div class="pill a"><b>${n(summary.alive ?? 0)}</b> alive</div>
            <div class="pill d"><b>${n(summary.dormant ?? 0)}</b> dormant</div>
            <div class="pill s"><b>${n(summary.stub ?? 0)}</b> stub</div>
            <div class="pill"><b>${n(summary.cells ?? 0)}</b> cells</div>
          </div>
          <div class="cols">
            <div>
              <div class="card">
                <h2>Present state</h2>
                <div class="muted">last update: ${esc(org?.generatedAt ?? "unknown")}</div>
                <div class="narr"><div class="narrtext">${esc(String(jouchoLine))}</div><div class="muted">trajectory points: ${n(trajCount)}</div></div>
                <div class="legend">
                  <span><i style="background:var(--alive)"></i>alive</span>
                  <span><i style="background:var(--dormant)"></i>dormant</span>
                  <span><i style="background:var(--stub)"></i>stub</span>
                </div>
              </div>
              <div class="card">
                <h2>Live activity</h2>
                <h3>recent actors</h3>
                <ul class="ticks">${topPulse || "<li class='tick'><span class='tsubj'>no pulse data</span></li>"}</ul>
              </div>
            </div>
            <div>
              <div class="card">
                <h2>What this shows</h2>
                <div class="wbline">body summary from <code>organism.json</code></div>
                <ul class="facts">
                  <li>heartbeat and mood from <code>pulse.json</code> / <code>joucho.json</code></li>
                  <li>health watchdog: ${esc(health?.anyStale ? "stale layer present" : "all layers current")}</li>
                  <li>system dynamics path: <a href="/sos">/sos</a></li>
                  <li>live loop: <a href="/organism/">this page</a></li>
                </ul>
              </div>
              <div class="card">
                <h2>System of systems</h2>
                <div class="muted">${esc(sos?.title ?? sos?.name ?? "system graph")}</div>
                <p class="hint">${esc(sos?.note ?? "The organism is being rendered from local JSON snapshots. No external script is required.")}</p>
              </div>
            </div>
          </div>
          <div class="foot">If you see this page, the organism has loaded without waiting on scittle. The static snapshot stays readable even when the live browser-runtime layer is absent.</div>
        </div>`;
    }).catch(() => {
      app.innerHTML = '<div class="wrap"><p class="hint">organism の読み込みに失敗しました。<a href="/sos">/sos</a> を開いてください。</p></div>';
    });
  </script>
</body>
</html>
