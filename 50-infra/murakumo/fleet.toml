[[nodes]]
name = "naphtali"
hostname = "naphtalinomac-mini.local"
ip_lan = "192.168.1.18"
role = "charter-compliance-leader + kuni-umi-survey-leader"
cells = [
  "CharterAttestationRequestCell",
  "CharterAttestationFinalizationCell",
  "CharterRehabilitationCell",
  "SiteSurveyCell",  # kuni-umi Phase 1 (ADR-2605201400)
]
