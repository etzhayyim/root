trigger = "mst-listener + escalation from other cells"
adr = ["2605192230", "2605192300"]

# ─── unispsc cells (ADR-2605171300 — 18,342 UNSPSC commodity agents) ─
#
# Substrate boundary (CRITICAL): the K8s overlay at
# 50-infra/k8s/lg-open-unispsc/ depends on Kotoba/Datomic (KOTOBA_URL secret) and
# is the legacy etzhayyim.com path. The etzhayyim cells below run on launchd-
# managed Mac mini nodes only (no K8s per ADR-2605191346); state lives in
# MST/IPFS, never in Kotoba/Datomic.
#
# Registry source-of-truth: 00-contracts/actor-registry/unispsc.json
# (generated by 70-tools/scripts/registry/generate-unispsc-registry.py).
# XRPC façade: yoro-xrpc-adapter Worker handles com.etzhayyim.apps.unispsc.{health,
# listAgents,classify} from bundled rows; invokeAgent dispatches into these
# cells over the LAN cell-runner bridge (Phase β).

[cells.UnispscRegistryCell]
healthz_port = 13023
trigger = "synchronous API"
api_port = 13123
adr = ["2605171300", "2605212030", "2605172000"]
registry_path = "00-contracts/actor-registry/unispsc.json"
warm_lru_max = 4096
notes = "Read-only listAgents/health bridge. Mirrors the xrpc-adapter Worker for in-fleet queries that need to consult per-cell warm state."

[cells.UnispscAgentExecutorCell]
healthz_port_base = 16000  # per-shard, dynamic allocation
trigger = "synchronous API + mst-listener"
api_port_base = 16100  # per-shard
adr = ["2605171300", "2605192415", "2605202345"]
sharding = "by-segment-prefix"
shard_assignments = { shard-0 = "10-29", shard-1 = "30-44", shard-2 = "45-60" }
agents_pkg = "kotodama.langgraph_graphs.unispsc_agents"
warm_lru_max = 4096
cold_start_ms_p50 = 50  # StateGraph compile, per ADR-2605171300
llm_primary = "claude-haiku-4-5"  # classify hot path
llm_escalation = "claude-sonnet-4-6"  # classify ambiguous → escalate
llm_fallback_local = "llama3.2:3b @ evo-x2 (LAN-only, ADR-2605202345)"
listens_to = ["com.etzhayyim.apps.unispsc.invokeAgent"]

# ─── UNSPSC organism fleet cell (ADR-2605240000) ──────────────────────
#
# Wraps every UNSPSC code in this shard's segment range into a tick-able
# organism (joucho personality from ADR-2605240015 + InboxBuffer + Shinka
# cadence + FollowerReward stub from ADR-2605240030). Underlying classify
# graphs are reused unchanged.
#
# Sharding mirrors UnispscAgentExecutorCell:
#   shard-0 joseph   segments 10-29   4,597 organisms
#   shard-1 issachar segments 30-44   8,541 organisms
#   shard-2 dan      segments 45-60   5,204 organisms
#
# Supersedes UnispscOrganismC10101500Cell (single-organism reference,
# ADR-2605232345) — c10101500 is now hosted by shard-0 on joseph.

[cells.UnispscOrganismFleetCell]
healthz_port_base = 13040  # +10 per shard (13040 joseph, 13050 issachar, 13060 dan)
trigger = "lan-api"
api_port_base = 13140
adr = ["2605240000", "2605232345", "2605240015", "2605240030", "2605171300"]
sharding = "by-segment-prefix"
shard_assignments = { shard-0 = "10-29", shard-1 = "30-44", shard-2 = "45-60" }
module = "kotodama.organism.fleet_cell_main"
registry_path = "00-contracts/actor-registry/unispsc.json"
organism_lru_max = 4096
tick_interval_s = 300  # 5-min heartbeat per organism (cooldowns suppress most ticks)
joucho_provider = "deterministic-personality"  # ADR-2605240015 Layer 1
follower_provider = "stub-empty"               # ADR-2605240030 default; MST read deferred
supersedes = ["UnispscOrganismC10101500Cell"]  # subsumed by shard-0 on joseph

# ─── kaizen observer (ADR-2605240200) ─────────────────────────────────
#
# Ecosystem self-reflection actor. Single observer (Deployment, not
# DaemonSet) on levi. Probes shard healthz every 10 min, tails NDJSON
# post queues, runs rule registry, appends KaizenProposal NDJSON lines
# to /var/lib/etzhayyim/kaizen-proposals/observer.ndjson.
#
# Downstream: a PR agent (Wave 4) consumes the proposal queue and opens
# PRs on github.com/etzhayyim/root for human / agent review. The
# observer itself never opens a PR or mutates state.

[cells.KaizenObserverCell]
healthz_port = 13070
trigger = "cron"
cron = "*/10 * * * *"
adr = ["2605240200", "2605240100", "2605240000", "2605232345"]
module = "kotodama.organism.kaizen_cell_main"
entry = "fire"
actor_did = "did:web:etzhayyim.com:actor:kaizen-observer"
proposal_path = "/var/lib/etzhayyim/kaizen-proposals/observer.ndjson"
dedup_window_s = 7200  # 2 hours
notes = "Emits KaizenProposal NDJSON. PR agent (KaizenPrAgentCell) opens GitHub PRs from the queue."

# ─── kaizen PR agent — the self-evolution ACTUATOR (Wave 4, ADR-2605240200) ──
#
# Resident counterpart to KaizenObserverCell. Co-located on levi (the proposal
# queue is a node-local hostPath the observer writes). Drains observer.ndjson
# via kaizen_pr_agent_main.serve_loop → consume_all, applies structured patches
# to a checkout of github.com/etzhayyim/root, and opens PRs / issues — closing
# the recursive self-evolution loop on the fleet.
#
# no-server-key (ADR-2605231525): GH_TOKEN is operator-injected + short-lived,
# NOT a platform master key; dry_run default = drain+patch locally, no push.
[cells.KaizenPrAgentCell]
trigger = "resident"  # serve_loop polls; not a cron-fire
interval_s = 600  # match observer cadence
adr = ["2605240200", "2605240100", "2605240000", "2605231525"]
module = "kotodama.organism.kaizen_pr_agent_main"
entry = "serve_loop"
actor_did = "did:web:etzhayyim.com:actor:kaizen-pr-agent"
proposal_path = "/var/lib/etzhayyim/kaizen-proposals/observer.ndjson"
repo_root = "/workspace/root"
dry_run_default = false  # Wave-4 ENABLED 2026-06-08 (Council Lv7+ unanimity); fails safe — absent GH_TOKEN Secret → auth-skip, no push
k8s_manifest = "50-infra/k8s/unispsc-organism-fleet/kaizen-pr-agent/"
notes = "Drains observer.ndjson → PR/issue. Co-located on levi. Operator-credentialed, no platform key. Wave-4 enabled; repo-clone initContainer syncs etzhayyim/root each start."

