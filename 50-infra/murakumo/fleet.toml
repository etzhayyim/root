[[nodes]]
name = "joseph"
hostname = "josephnomac-mini.local"
ip_lan = "192.168.1.15"
role = "phenotype-agent-shard-0 + kuni-umi-construction-leader + unispsc-executor-shard-0"
cells = [
  "PhenotypeAgent",  # SBT tokenId range 0 to N/3
  "ConstructionOrchestrationCell",  # kuni-umi Phase 3 (ADR-2605201400)
  "UnispscAgentExecutorCell",  # unispsc segments 10-29 (~4260 agents)
]
shard_index = 0
total_shards = 3
replicas_of = []

[[nodes]]
name = "issachar"
hostname = "issacharnomac-mini.local"
ip_lan = "192.168.1.12"
role = "phenotype-agent-shard-1 + unispsc-executor-shard-1"
cells = [
  "PhenotypeAgent",  # SBT tokenId range N/3 to 2N/3
  "UnispscAgentExecutorCell",  # unispsc segments 30-44 (~8800 agents — heaviest shard, segments 31/41/42)
]
shard_index = 1
total_shards = 3
replicas_of = []

[[nodes]]
name = "dan"
hostname = "dannomac-mini.local"
ip_lan = "192.168.1.13"
role = "phenotype-agent-shard-2 + kuni-umi-decommission-leader + unispsc-executor-shard-2"
cells = [
  "PhenotypeAgent",  # SBT tokenId range 2N/3 to N
  "DecommissionCell",  # kuni-umi end-of-life (ADR-2605201400)
  "UnispscAgentExecutorCell",  # unispsc segments 45-60 (~5280 agents)
]
shard_index = 2
total_shards = 3
replicas_of = []

[[nodes]]
name = "benjamin"
hostname = "benjaminomac-mini.local"
ip_lan = "192.168.1.14"  # IP from dnsmasq SSoT; mDNS silent but L2 active
role = "force + ethics leader"
cells = [
  "ForceAuthorizationCell",
  "ForceLogMonitoringCell",
  "EthicsContentClassifierCell",
]
replicas_of = []

[[nodes]]
name = "asher"
hostname = "ashernomac-mini.local"
ip_lan = "192.168.1.21"  # IP from dnsmasq SSoT; mDNS silent but L2 active
role = "replica + failover (any cell) + unispsc-registry-leader"
cells = [
  "UnispscRegistryCell",  # serves listAgents from local file system; non-leader
                          # role so failover for other cells still works
]
replicas_of = ["*"]  # replica of all (UnispscRegistryCell is read-only, no conflict)

