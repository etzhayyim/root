adr = ["2605192230", "2605192300"]

# ─── unispsc cells (ADR-2605171300 — 18,342 UNSPSC commodity agents) ─
#
# Substrate boundary (CRITICAL): the K8s overlay at
# 50-infra/k8s/lg-open-unispsc/ depends on RisingWave (RW_URL secret) and
# is the legacy gftd.ai path. The etzhayyim cells below run on launchd-
# managed Mac mini nodes only (no K8s per ADR-2605191346); state lives in
# MST/IPFS, never in RisingWave.
#
# Registry source-of-truth: 00-contracts/actor-registry/unispsc.json
# (generated by 70-tools/scripts/registry/generate-unispsc-registry.py).
# XRPC façade: yoro-xrpc-adapter Worker handles ai.gftd.apps.unispsc.{health,
# listAgents,classify} from bundled rows; invokeAgent dispatches into these
# cells over the LAN cell-runner bridge (Phase β).

[cells.UnispscRegistryCell]
healthz_port = 13023
trigger = "synchronous API"
api_port = 13123
adr = ["2605171300", "2605212030", "2605172000"]
registry_path = "00-contracts/actor-registry/unispsc.json"
warm_lru_max = 4096
notes = "Read-only listAgents/health bridge. Mirrors the xrpc-adapter Worker for in-fleet queries that need to consult per-cell warm state."

[cells.UnispscAgentExecutorCell]
healthz_port_base = 16000  # per-shard, dynamic allocation
trigger = "synchronous API + mst-listener"
api_port_base = 16100  # per-shard
adr = ["2605171300", "2605192415", "2605202345"]
sharding = "by-segment-prefix"
shard_assignments = { shard-0 = "10-29", shard-1 = "30-44", shard-2 = "45-60" }
agents_pkg = "pymagatama.langgraph_graphs.unispsc_agents"
warm_lru_max = 4096
cold_start_ms_p50 = 50  # StateGraph compile, per ADR-2605171300
llm_primary = "claude-haiku-4-5"  # classify hot path
llm_escalation = "claude-sonnet-4-6"  # classify ambiguous → escalate
llm_fallback_local = "llama3.2:3b @ evo-x2 (LAN-only, ADR-2605202345)"
listens_to = ["ai.gftd.apps.unispsc.invokeAgent"]

# ─── kuni-umi cells (ADR-2605201400) ────────────────────────────────

[cells.SiteSurveyCell]
healthz_port = 13017
trigger = "mst-listener"
listens_to = ["ai.gftd.apps.etzhayyim.kuniUmi.defineDeploymentSite"]
adr = ["2605201400", "2605192245", "2605192330", "2605192200", "2605192230"]
witness_min = 2  # constitutional invariant (ADR-2605201400 §9)

[cells.DeploymentPlanningCell]
healthz_port = 13018
trigger = "mst-listener"
listens_to = ["ai.gftd.apps.etzhayyim.kuniUmi.submitSiteSurvey"]
adr = ["2605201400", "2605171300", "2605172100", "2605192130", "2605192200", "2605192230"]
unispsc_fleet_adr = "2605171300"  # invoked as specialist sub-graph

[cells.ConstructionOrchestrationCell]
healthz_port = 13019
trigger = "mst-listener"
listens_to = ["ai.gftd.apps.etzhayyim.kuniUmi.proposeDeploymentPlan"]
adr = ["2605201400", "2605151200"]
cadence_hz_max = 10  # NEVER drive hard-RT motion; firmware owns that (ADR-2605201400 §3 Phase 3 + §10)
witness_min = 2  # per super-step boundary

[cells.CommissioningCell]
healthz_port = 13020
trigger = "mst-listener"
listens_to = ["ai.gftd.apps.etzhayyim.kuniUmi.recordConstructionProgress"]
listens_to_phase = "handoff-ready"
adr = ["2605201400", "2605151200"]
hands_off_to = "open-ot WASM PLC (defineLoop)"

[cells.AuditWitnessCell]
healthz_port = 13021
trigger = "continuous + super-step boundary + event-driven"
listens_to = ["ai.gftd.apps.etzhayyim.kuniUmi.recordPhysicalAuditEvent"]
adr = ["2605201400", "2605192230", "2605192315", "2605191657"]
witness_min = 2  # constitutional invariant — NEVER reduce
phenotype_feedback = true  # writes Phenotype.effectiveMultiplier delta (ADR-2605192230)

[cells.DecommissionCell]
healthz_port = 13022
trigger = "cron + governance-vote + lifespan-expiry-monitor"
cron = "0 0 1 * *"  # monthly check for lifespanYears expiry
adr = ["2605201400", "2605192345"]
urban_mining_handoff = "60-apps/ai-gftd-project-open-robo/docs/urban-mining-automation-v1.md"

# ─── External inference backends (non-cell, GPU pods) ───────────────
# Per ADR-2605202345. Windows / non-launchd machines that provide LLM
# and image/video inference for cells. Do NOT run magatama cells here
# (launchd-only per ADR-2605202100).

[[inference_backends]]
name = "evo-x2"
host_lan = "192.168.1.70"
role = "gpu-inference-pod"
adr = "2605202345"

[inference_backends.evo-x2.hardware]
chip = "AMD Ryzen AI Max+ 395"
igpu = "Radeon 8060S (gfx1151, RDNA 3.5)"
npu = "AMD XDNA"  # 50 TOPS, status pending (ADR-2605202345 Open Questions)
vram_gib = 32  # BIOS UMA carve-out from 128 GB unified memory
sys_ram_gb = 96
os = "Windows 11 Pro 24H2"

[inference_backends.evo-x2.endpoints.ollama]
url = "http://192.168.1.70:11434"
api = "openai-compatible"
auth = "lan-only"
models = ["llama3.2:3b", "llama3.3:70b"]
backend = "ROCm gfx1151"
verified_perf = { llama32_3b = "83 tok/s", llama33_70b = "1.18 tok/s" }

[inference_backends.evo-x2.endpoints.litellm]
url = "http://192.168.1.70:4000"
api = "openai-compatible"
auth = "bearer master_key"
master_key_env = "EVO_X2_LITELLM_KEY"  # rotate per security policy

[inference_backends.evo-x2.endpoints.comfyui]
url = "http://192.168.1.70:8188"
api = "comfyui-native"
auth = "lan-only"
models = ["animagine-xl-4.0", "waiIllustriousSDXL_v160", "wan2.2_ti2v_5B_fp16"]
verified_perf = { animagine_xl4_1024 = "21 s/25steps", wai_v160_1024 = "25 s/30steps", wan22_5B_1280x704_41f = "502 s" }

[inference_backends.evo-x2.persistence]
ollama_task = "OllamaServer (Scheduled Task, AtStartup, gad/S4U, Highest)"
litellm_task = "LiteLLMProxy (Scheduled Task, AtStartup, gad/S4U, Highest)"
comfyui_task = "ComfyUI (Scheduled Task, AtLogOn, gad, Highest)"

[inference_backends.evo-x2.healthcheck]
endpoints = [
  "GET http://192.168.1.70:11434/v1/models",
  "GET http://192.168.1.70:4000/v1/models (with bearer)",
  "GET http://192.168.1.70:8188/system_stats",
]
prometheus_scrape = true  # pending: add to murakumo prometheus config

[inference_backends.evo-x2.failover]
on_unreachable = "cells fall back to own-node local Ollama gemma3:4b"
replica_recommended = "future M3/M4 Ultra Mac mini with 128 GB unified, or 2nd EVO-X2 class"

# ─── Bootstrap deployment plan (ADR-2605192415 §10) ─────────────────

[bootstrap]
roadmap = [
  { step = "S0", task = "fleet readiness check (10 node WoL + ssh)", node = "*" },
  { step = "S1", task = "scaffolding (50-infra/etzhayyim-charters-compliance/ etc.)", node = "control" },
  { step = "S2", task = "ChartersComplianceRegistry.sol deploy (testnet)", node = "naphtali" },
  { step = "S3", task = "CharterAttestationRequestCell deploy", node = "naphtali" },
  { step = "S4", task = "LandRegistry + LandDonationProcessingCell deploy", node = "judah" },
  { step = "S5", task = "TitheRouter + TitheRoutingCell deploy", node = "zebulun" },
  { step = "S6", task = "PublicFundGovernance + PublicFundGrantCell deploy", node = "zebulun" },
  { step = "S7", task = "ForceAuthorization + force cells deploy", node = "benjamin" },
  { step = "S8", task = "EthicsContentClassifierCell + Gemma fallback", node = "benjamin" },
  { step = "S9", task = "StewardSuccessionCell + LandDisputeResolutionCell", node = "judah" },
  { step = "S9b", task = "UnispscRegistryCell deploy (read-only)", node = "asher" },
  { step = "S9c", task = "UnispscAgentExecutorCell shard-0/1/2 deploy", node = "joseph,issachar,dan" },
  { step = "S10", task = "full e2e test cycle", node = "*" },
  { step = "S11", task = "mainnet migration", node = "*" },
]

# ─── Monitoring ─────────────────────────────────────────────────────

[monitoring]
prometheus_endpoint = "http://murakumo.etzhayyim.local:9090"
dashboard_app = "60-apps/etzhayyim-cell-fleet-dashboard/"
alert_did = "did:web:alert.etzhayyim.com"  # who gets paged on critical failure
