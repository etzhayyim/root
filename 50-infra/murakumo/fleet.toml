# Murakumo Mac-mini Fleet Configuration
#
# 12-tribes naming (per ADR-2605182312): naphtali / simeon / judah / zebulun /
# levi / joseph / issachar / dan / benjamin / asher (10 nodes deployed,
# 2 pending WoL recovery).
#
# Cell placement per ADR-2605192415 §4 (Religious-Corp Daemon Architecture).
# Each node runs `magatama-cell-runner --node <name>` via launchd
# (com.etzhayyim.magatama-cell-runner.plist).

[fleet]
name = "etzhayyim-murakumo"
adr = ["2605192415", "2605191346", "2605182312"]
control_plane = "launchd (macOS) — no commercial K8s per ADR-2605191346"
swarm_leader_election_adr = "2605191603"
swarm_broadcast_adr = "2605191524"
heartbeat_adr = "2605191645"
cell_key_rotation_period_days = 90

# ─── Node ↔ cell assignments ────────────────────────────────────────

[[nodes]]
name = "naphtali"
hostname = "naphtalinomac-mini.local"
role = "charter-compliance-leader"
cells = [
  "CharterAttestationRequestCell",
  "CharterAttestationFinalizationCell",
  "CharterRehabilitationCell",
]
replicas_of = []

[[nodes]]
name = "simeon"
hostname = "simeonnomac-mini.local"
role = "ipfs-pinner + stewardship-leader"
cells = [
  "LandStewardshipMonitoringCell",
]
infrastructure = ["ipfs-pinner (existing, ADR-2605171800)"]
replicas_of = []

[[nodes]]
name = "judah"
hostname = "judahnomac-mini.local"
role = "land-trust-leader"
cells = [
  "LandDonationProcessingCell",
  "LandDisputeResolutionCell",
  "StewardSuccessionCell",
]
replicas_of = []

[[nodes]]
name = "zebulun"
hostname = "zebulunnomac-mini.local"
role = "economic-leader"
cells = [
  "EligibilityCell",
  "TreasuryRebalanceCell",
  "PublicFundGrantCell",
  "TitheRoutingCell",
]
replicas_of = []

[[nodes]]
name = "levi"
hostname = "levinomac-mini.local"
role = "membership + council orchestration"
cells = [
  "AdherentAttestationCell",
  "CouncilLevelAdvancementCell",
  "CouncilDeliberationCell",  # generic, multi-instance per attestation
]
replicas_of = []

[[nodes]]
name = "joseph"
hostname = "josephnomac-mini.local"
role = "phenotype-agent-shard-0"
cells = [
  "PhenotypeAgent",  # SBT tokenId range 0 to N/3
]
shard_index = 0
total_shards = 3
replicas_of = []

[[nodes]]
name = "issachar"
hostname = "issacharnomac-mini.local"
role = "phenotype-agent-shard-1"
cells = [
  "PhenotypeAgent",  # SBT tokenId range N/3 to 2N/3
]
shard_index = 1
total_shards = 3
replicas_of = []

[[nodes]]
name = "dan"
hostname = "dannomac-mini.local"
role = "phenotype-agent-shard-2"
cells = [
  "PhenotypeAgent",  # SBT tokenId range 2N/3 to N
]
shard_index = 2
total_shards = 3
replicas_of = []

[[nodes]]
name = "benjamin"
hostname = "benjaminomac-mini.local"
role = "force + ethics leader"
cells = [
  "ForceAuthorizationCell",
  "ForceLogMonitoringCell",
  "EthicsContentClassifierCell",
]
replicas_of = []
status = "pending_wol_2026_05_18"

[[nodes]]
name = "asher"
hostname = "ashernomac-mini.local"
role = "replica + failover (any cell)"
cells = []  # dynamic — picks up leader role on failover
replicas_of = ["*"]  # replica of all
status = "pending_wol_2026_05_18"

# ─── Per-cell global config ─────────────────────────────────────────

[cells.defaults]
checkpointer = "MstCheckpointSaver"  # ADR-2605191559
checkpointer_adr = "2605191559"
mst_listener_adr = "2605171800"
anchor_pipeline_adr = "2605171800"
log_dir = "/var/log/etzhayyim/cells"
healthz_port_base = 13000  # each cell takes 13000 + offset

[cells.CharterAttestationRequestCell]
healthz_port = 13001
trigger = "mst-listener"
listens_to = ["ai.gftd.apps.etzhayyim.charter-attestation-request"]
adr = ["2605192230", "2605192200"]

[cells.CharterAttestationFinalizationCell]
healthz_port = 13002
trigger = "timer + mst-listener"
period_seconds = 3600  # hourly check for appeal-window expiration
adr = ["2605192230"]

[cells.CharterRehabilitationCell]
healthz_port = 13003
trigger = "mst-listener"
listens_to = ["ai.gftd.apps.etzhayyim.charter-rehabilitation"]
adr = ["2605192230"]

[cells.LandDonationProcessingCell]
healthz_port = 13004
trigger = "mst-listener"
listens_to = ["ai.gftd.apps.etzhayyim.land-donation"]
adr = ["2605192245", "2605192330"]

[cells.LandStewardshipMonitoringCell]
healthz_port = 13005
trigger = "cron"
cron = "0 0 1 * *"  # monthly, 1st day midnight
adr = ["2605192245"]

[cells.LandDisputeResolutionCell]
healthz_port = 13006
trigger = "mst-listener"
listens_to = ["ai.gftd.apps.etzhayyim.land-dispute"]
adr = ["2605192245"]

[cells.StewardSuccessionCell]
healthz_port = 13007
trigger = "mst-listener + heartbeat-monitor"
listens_to = ["ai.gftd.apps.etzhayyim.steward-succession-event"]
heartbeat_check_period_seconds = 86400  # daily
adr = ["2605192345"]

[cells.EligibilityCell]
healthz_port = 13008
trigger = "cron"
cron = "0 */6 * * *"  # every 6 hours
adr = ["2605172300"]

[cells.PhenotypeAgent]
healthz_port_base = 14000  # per-SBT, dynamic allocation
trigger = "mst-listener (per SBT)"
adr = ["2605172300", "2605171300"]

[cells.TreasuryRebalanceCell]
healthz_port = 13009
trigger = "cron"
cron = "0 0 1 * *"  # monthly NAV update
adr = ["2605172300"]

[cells.PublicFundGrantCell]
healthz_port = 13010
trigger = "mst-listener"
listens_to = ["ai.gftd.apps.etzhayyim.public-fund.proposal"]
adr = ["2605192145"]

[cells.TitheRoutingCell]
healthz_port = 13011
trigger = "mst-listener"
listens_to = ["ai.gftd.apps.payment.sent"]
adr = ["2605192130"]

[cells.ForceAuthorizationCell]
healthz_port = 13012
trigger = "mst-listener"
listens_to = ["ai.gftd.apps.etzhayyim.force-authorization-proposal"]
adr = ["2605192315"]

[cells.ForceLogMonitoringCell]
healthz_port = 13013
trigger = "cron + mst-listener"
cron = "0 0 * * *"  # daily compliance check
listens_to = ["ai.gftd.apps.etzhayyim.force-log"]
adr = ["2605192315"]

[cells.EthicsContentClassifierCell]
healthz_port = 13014
trigger = "synchronous API"
api_port = 13114
adr = ["2605192400"]
llm_primary = "claude-sonnet-4-6"
llm_fallback_local = "gemma3:4b (Murakumo Ollama)"

[cells.AdherentAttestationCell]
healthz_port = 13015
trigger = "mst-listener"
listens_to = ["ai.gftd.apps.etzhayyim.oath", "ai.gftd.apps.etzhayyim.commitment"]
adr = ["2605172600"]

[cells.CouncilLevelAdvancementCell]
healthz_port = 13016
trigger = "cron"
cron = "0 0 * * 0"  # weekly, Sunday midnight
adr = ["2605172600", "2605192300"]

[cells.CouncilDeliberationCell]
healthz_port_base = 15000  # per-instance, dynamic
trigger = "mst-listener + escalation from other cells"
adr = ["2605192230", "2605192300"]

# ─── Bootstrap deployment plan (ADR-2605192415 §10) ─────────────────

[bootstrap]
roadmap = [
  { step = "S0", task = "fleet readiness check (10 node WoL + ssh)", node = "*" },
  { step = "S1", task = "scaffolding (50-infra/etzhayyim-charters-compliance/ etc.)", node = "control" },
  { step = "S2", task = "ChartersComplianceRegistry.sol deploy (testnet)", node = "naphtali" },
  { step = "S3", task = "CharterAttestationRequestCell deploy", node = "naphtali" },
  { step = "S4", task = "LandRegistry + LandDonationProcessingCell deploy", node = "judah" },
  { step = "S5", task = "TitheRouter + TitheRoutingCell deploy", node = "zebulun" },
  { step = "S6", task = "PublicFundGovernance + PublicFundGrantCell deploy", node = "zebulun" },
  { step = "S7", task = "ForceAuthorization + force cells deploy", node = "benjamin" },
  { step = "S8", task = "EthicsContentClassifierCell + Gemma fallback", node = "benjamin" },
  { step = "S9", task = "StewardSuccessionCell + LandDisputeResolutionCell", node = "judah" },
  { step = "S10", task = "full e2e test cycle", node = "*" },
  { step = "S11", task = "mainnet migration", node = "*" },
]

# ─── Monitoring ─────────────────────────────────────────────────────

[monitoring]
prometheus_endpoint = "http://murakumo.etzhayyim.local:9090"
dashboard_app = "60-apps/etzhayyim-cell-fleet-dashboard/"
alert_did = "did:web:alert.etzhayyim.com"  # who gets paged on critical failure
