apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: holochain-agent-runtime
  namespace: agent-runtime-holochain
  labels:
    app.kubernetes.io/component: holochain-runtime
  annotations:
    etzhayyim.com/runtime-kind: holochain
    etzhayyim.com/runtime-task-types: actor-event,actor-head,capability-grant
spec:
  serviceName: holochain-agent-runtime
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: holochain-agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: holochain-agent-runtime
    spec:
      containers:
        - name: conductor
          image: ghcr.io/etzhayyim/holochain-agent-runtime:experimental
          ports:
            - name: app-ws
              containerPort: 8888
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
