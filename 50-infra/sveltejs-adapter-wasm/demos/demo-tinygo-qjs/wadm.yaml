apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: svelte-performer-app
  annotations:
    version: v0.1.5
    description: "SvelteKit SSR via TinyGo runtime + QuickJS/Boa engine on wasmCloud"
spec:
  components:
    # TinyGo runtime: serves static assets (client/, prerendered/) and
    # delegates SSR to the JS engine via etzhayyim:svelte-adapter/js-runtime import
    - name: svelte-server
      type: component
      properties:
        # Local dev: file reference to wash build output
        # Production: ghcr.io/etzhayyim/svelte-performer:<tag>
        image: file://../../projects/sveltejs-adapter-wasm/wasm/runtime/build/svelte-wasm-demo_s.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
        - type: link
          properties:
            target: js-engine
            namespace: etzhayyim
            package: svelte-adapter
            interfaces:
              - js-runtime

    # QuickJS/Boa JS engine: implements etzhayyim:svelte-adapter/js-runtime
    # Evaluates the SvelteKit SSR bundle (index.js) and returns rendered HTML
    - name: js-engine
      type: component
      properties:
        # Local dev: file://../../projects/sveltejs-adapter-wasm/wasm/quickjs-engine/target/wasm32-wasip1/release/quickjs_engine.wasm
        # Production: ghcr.io/etzhayyim/quickjs-engine:<tag>
        image: file://../../projects/sveltejs-adapter-wasm/wasm/quickjs-engine/target/wasm32-wasip1/release/quickjs_engine.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1

    # HTTP server capability provider
    - name: http-server
      type: capability
      properties:
        image: ghcr.io/wasmcloud/http-server:0.25.0
      traits:
        - type: link
          properties:
            target: svelte-server
            namespace: wasi
            package: http
            interfaces:
              - incoming-handler
            source_config:
              - name: http-config
                properties:
                  address: 0.0.0.0:8080
