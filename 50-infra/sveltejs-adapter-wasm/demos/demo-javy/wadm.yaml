apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: svelte-javy-demo
  annotations:
    version: v0.0.3
    description: "SvelteKit SSR on wasmCloud via Javy"
spec:
  components:
    - name: svelte-javy
      type: component
      properties:
        image: file://./build/component.wasm
      traits:
        - type: spreadscaler
          properties:
            instances: 1
    - name: http-server
      type: capability
      properties:
        image: ghcr.io/wasmcloud/http-server:0.25.0
      traits:
        - type: link
          properties:
            target: svelte-javy
            namespace: wasi
            package: http
            interfaces: [incoming-handler]
            source_config:
              - name: default-http
                properties:
                  address: 0.0.0.0:8081
