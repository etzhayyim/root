[package]
name = "quickjs-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }
# serde = { version = "1", features = ["derive"] }
# serde_json = "1"
# boa_engine = { version = "0.21", default-features = false }  # TODO: re-enable for full JS evaluation

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "gftdcojp:quickjs-engine"

[package.metadata.component.target]
world = "engine"

[package.metadata.component.target.dependencies]
"gftdcojp:svelte-adapter" = { path = "wit/deps/gftdcojp-svelte-adapter" }
