name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

  tinygo-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.39.0"

      - name: TinyGo smoke build
        run: tinygo build -target=wasip1 -gc=leaking -buildmode=c-shared -no-debug -o /tmp/spin-tinygo-flight-smoke.wasm ./examples/smoke
