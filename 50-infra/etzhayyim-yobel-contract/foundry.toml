[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.27"
optimizer = true
optimizer_runs = 1000000
via_ir = true
remappings = []

# Base L2 deployment target per ADR-2605201800 (yobel settlement substrate).
# RPC endpoints + verification keys come from environment, never committed.
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_MAINNET_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
base_mainnet = { key = "${BASESCAN_API_KEY}", chain = 8453 }

[fuzz]
runs = 1024
