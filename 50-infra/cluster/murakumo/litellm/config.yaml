# LiteLLM config — etzhayyim Murakumo gateway (Mac-mini Tier-1 per ADR-2605191346).
#
# Stateless proxy. No database. Substrate state for inference jobs is held in
# the CF Worker at murakumo.etzhayyim.com via @etzhayyim/sdk (ADR-2605191358);
# this LiteLLM instance only routes OpenAI-compat requests to backends.
#
# Traffic path:
#   CF Worker (murakumo.etzhayyim.com) → https://murakumo-serve.etzhayyim.com/v1/chat/completions
#   → LiteLLM (this gateway, loopback port 4000 on the host Mac-mini)
#   → Backend (RunPod vLLM during transition; Mac-mini Ollama nodes for etzhayyim Tier-1)
#
# Required env on the LiteLLM host:
#   RUNPOD_GEMMA4_OPENAI_BASE  — RunPod serverless endpoint base URL
#                                (e.g. https://api.runpod.ai/v2/vyp99t9px7h4dl/openai/v1)
#   RUNPOD_API_KEY             — RunPod API key (transition only; etzhayyim target is Mac-mini Ollama)
#   LITELLM_MASTER_KEY         — LiteLLM master key (sourced from Keychain on install)

model_list:
  # ── Tier 0 general — default chat model ──
  - model_name: tier0-general
    litellm_params:
      model: openai/gemma-4-e4b-it
      api_base: os.environ/RUNPOD_GEMMA4_OPENAI_BASE
      api_key: os.environ/RUNPOD_API_KEY
      timeout: 180
      stream_timeout: 240

  # ── Tier 0 fast — latency-sensitive callers ──
  - model_name: tier0-fast
    litellm_params:
      model: openai/gemma-4-e4b-it
      api_base: os.environ/RUNPOD_GEMMA4_OPENAI_BASE
      api_key: os.environ/RUNPOD_API_KEY
      timeout: 90
      stream_timeout: 150

  # ── Tier 0 structured — JSON / extraction tasks ──
  - model_name: tier0-structured
    litellm_params:
      model: openai/gemma-4-e4b-it
      api_base: os.environ/RUNPOD_GEMMA4_OPENAI_BASE
      api_key: os.environ/RUNPOD_API_KEY
      timeout: 180
      stream_timeout: 240

  # ── Explicit aliases (backward-compat) ──
  - model_name: gemma4-runpod
    litellm_params:
      model: openai/gemma-4-e4b-it
      api_base: os.environ/RUNPOD_GEMMA4_OPENAI_BASE
      api_key: os.environ/RUNPOD_API_KEY
      timeout: 180
      stream_timeout: 240

  - model_name: tier0-runpod
    litellm_params:
      model: openai/gemma-4-e4b-it
      api_base: os.environ/RUNPOD_GEMMA4_OPENAI_BASE
      api_key: os.environ/RUNPOD_API_KEY
      timeout: 180
      stream_timeout: 240

# ── Router settings ──────────────────────────────────────────────────────────
router_settings:
  num_retries: 3
  timeout: 180
  allowed_fails: 3
  cooldown_time: 30

litellm_settings:
  drop_params: true
  set_verbose: false
  telemetry: false
  cache: false
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # No database — substrate boundary (ADR-2605172000 / 2605191358). Stateless
  # gateway only. Per-tenant usage / billing lives in the CF Worker substrate
  # layer (com.etzhayyim.murakumo.inferenceJob* via @etzhayyim/sdk).
