# ── Router settings ──────────────────────────────────────────────────────────
router_settings:
  num_retries: 3
  timeout: 180
  allowed_fails: 3
  cooldown_time: 30
  routing_strategy: least-busy   # prefer idle nodes over strict round-robin

litellm_settings:
  drop_params: true
  set_verbose: false
  telemetry: false
  cache: false
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # No database — substrate boundary (ADR-2605172000 / 2605191358). Stateless
  # gateway only. Per-tenant usage / billing lives in the CF Worker substrate
  # layer (com.etzhayyim.murakumo.inferenceJob* via @etzhayyim/sdk).
