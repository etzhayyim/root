# LiteLLM config — etzhayyim Murakumo gateway (ADR-2605215000, ADR-2605191346).
#
# Stateless proxy. No database. Substrate state for inference jobs is held in
# the CF Worker at murakumo.etzhayyim.com via @etzhayyim/sdk (ADR-2605191358).
#
# Traffic path:
#   CF Worker (murakumo.etzhayyim.com) → https://murakumo-serve.etzhayyim.com/v1/chat/completions
#   → LiteLLM (this gateway, loopback port 4000 on the host Mac-mini)
#   → Ollama native /api/chat on each of 10 Mac mini nodes (Tailscale)
#
# Required env on the LiteLLM host:
#   LITELLM_MASTER_KEY  — LiteLLM master key (sourced from Keychain on install)
#
# IMPORTANT — callers MUST pass `think: false` in extra_body for QAT models:
#   {"model": "tier0-general", ..., "extra_body": {"think": false}}
#   Omitting think:false causes the reasoning trace to consume the context window.
#
# IMPORTANT — use ollama_chat/ (native /api/chat) NOT ollama/ (OpenAI-compat):
#   OpenAI-compat ep silently ignores options.num_ctx → ctx stays at 4096
#   and long outputs appear truncated ("missing closing brackets").
#   (ADR-2606120500 finding #1)
#
# Model availability (verified 2026-06-13, all 10 nodes):
#   gemma4:e4b-it-qat  — 5 GiB Q4_0 QAT  ~29-31 tok/s per node
#   gemma4:12b-it-qat  — 6 GiB Q4_0 QAT  ~9-11 tok/s per node (1 stream/node)
#   gemma4:e4b         — 8 GiB Q4_K_M     (PTQ, prefer e4b-it-qat for QAT)
#
# Concurrency per node (ADR-2606120500 §fleet):
#   e4b-it-qat: 2 streams/node (serial within node — M4 16GB fills at 1 stream)
#   12b-it-qat: 1 stream/node (2 streams causes timeout on M4 16GB)
#
# Throughput (measured 2026-06-13):
#   e4b single stream: 29-31 tok/s
#   fleet aggregate (10 nodes × 1 concurrent task each): ~300 tok/s
#   fleet 20-task wall: ~2× single-task wall (serial within each node)

