# kotodama-cell-runner cell registry — religious-corp Pregel cells
# Per ADR-2605215200 + ADR-2605202100. Loaded by cell_runner_main.py at startup.
# Cells are spawned per-node based on $ETZHAYYIM_NODE_NAME env var.
#
# Schema notes (matched to fleet.toml structural conventions):
#   - [[cell]] array mirrors [[nodes]] style in fleet.toml
#   - trigger.kind  = "cron" | "mst-listener" | "xrpc"
#   - trigger.expr  = cron expression (for kind = "cron")
#   - trigger.listens_to = [NSID, ...] (for kind = "mst-listener")
#   - node = tribe name matching fleet.toml [[nodes]].name, or "*" for any node
#   - healthz_port must be unique per physical node (13000-14000 range per fleet.toml defaults)
#   - module / entry point to the async cell function in kotodama.primitives.*

[runner]
node_name_env = "ETZHAYYIM_NODE_NAME"
default_log_dir = "/var/log/etzhayyim/cells"
healthz_port_range = [13000, 14000]

# ── Religious-corp Pregel cells ──────────────────────────────────────────────
#
# Topology (per shinka_murakumo.py + joucho_murakumo.py module docstrings):
#
#   ShinkaHeartbeatCell        levi   port 13026  cron */15 * * * *
#   KarmaHegemonObservationCell levi  port 13023  mst-listener kyumeiSignal
#   EvolutionValidationCell    levi   port 13024  mst-listener observeAdherent
#   EvolutionEmissionCell      simeon port 13025  mst-listener validateEvolution
#   JouchoAggregationCell      levi   port 13027  cron 0 * * * *

[[cell]]
name = "ShinkaHeartbeatCell"
module = "kotodama.primitives.shinka_murakumo"
entry = "shinka_heartbeat_cell"
node = "levi"
trigger = { kind = "cron", expr = "*/15 * * * *" }
healthz_port = 13026
adr = ["2605215200"]

[[cell]]
name = "KarmaHegemonObservationCell"
module = "kotodama.primitives.shinka_murakumo"
entry = "karma_hegemon_observation_cell"
node = "levi"
trigger = { kind = "mst-listener", listens_to = ["com.etzhayyim.shinka.kyumeiSignal"] }
healthz_port = 13023
adr = ["2605215200"]

[[cell]]
name = "EvolutionValidationCell"
module = "kotodama.primitives.shinka_murakumo"
entry = "evolution_validation_cell"
node = "levi"
trigger = { kind = "mst-listener", listens_to = ["com.etzhayyim.shinka.observeAdherent"] }
healthz_port = 13024
adr = ["2605215200", "2605215400"]

[[cell]]
name = "EvolutionEmissionCell"
module = "kotodama.primitives.shinka_murakumo"
entry = "evolution_emission_cell"
node = "simeon"
trigger = { kind = "mst-listener", listens_to = ["com.etzhayyim.shinka.validateEvolution"] }
healthz_port = 13025
adr = ["2605215200", "2605171800"]

[[cell]]
name = "JouchoAggregationCell"
module = "kotodama.primitives.joucho_murakumo"
entry = "joucho_aggregation_cell"
node = "levi"
trigger = { kind = "cron", expr = "0 * * * *" }
healthz_port = 13027
adr = ["JOUCHO-MIGRATION-DESIGN.md"]

# ── etzhayyim-langserver L9 cell ─────────────────────────────────────────
#
# Polls fleet LSPs (rust-analyzer / pyright / tsserver / gopls / lua-ls /
# ruby-lsp on dedicated minis) via LSP initialize handshake.
# See: 50-infra/etzhayyim-langserver/ + 40-engine/kotoba/crates/kotoba-kotodama/py/src/
#      kotodama/primitives/langserver_murakumo.py
#
# MST listener wiring deferred (requires lexicon registration under
# 00-contracts/lexicons/com/etzhayyim/langserver/). L9 minimum: in-memory
# cycle result + log line.

[[cell]]
name = "LangserverHealthMonitoringCell"
module = "kotodama.primitives.langserver_murakumo"
entry = "langserver_health_monitoring_cell"
node = "levi"
trigger = { kind = "cron", expr = "*/5 * * * *" }
healthz_port = 13028
adr = ["2605211910"]  # fleet IP baseline; L9 ADR pending separately

# ── unispsc organism (18,342 actors, ADR-2605171300 + ADR-2605192415) ────────
#
# Topology:
#   asher      UnispscRegistryCell             port 13123  (healthz 13023)
#   joseph     UnispscAgentExecutorCell shard-0 port 16100  (healthz 16000)  segments 10-29
#   issachar   UnispscAgentExecutorCell shard-1 port 16101  (healthz 16001)  segments 30-44
#   dan        UnispscAgentExecutorCell shard-2 port 16102  (healthz 16002)  segments 45-60
#
# trigger.kind = "lan-api" — the cell module owns the aiohttp listener and
# the cell-runner just supervises its lifecycle. Reached via LAN by the
# yoro-xrpc-adapter Worker (Phase β tunnel).

[[cell]]
name = "UnispscRegistryCell"
module = "unispsc_registry.cell"
entry = "serve"
node = "asher"
trigger = { kind = "lan-api", healthz_port = 13023, api_port = 13123 }
healthz_port = 13023
api_port = 13123
adr = ["2605171300", "2605192415"]

[[cell]]
name = "UnispscAgentExecutorCell-shard-0"
module = "unispsc_agent_executor.cell"
entry = "serve"
node = "joseph"
trigger = { kind = "lan-api", healthz_port = 16000, api_port = 16100 }
healthz_port = 16000
api_port = 16100
adr = ["2605171300", "2605192415"]

[[cell]]
name = "UnispscAgentExecutorCell-shard-1"
module = "unispsc_agent_executor.cell"
entry = "serve"
node = "issachar"
trigger = { kind = "lan-api", healthz_port = 16001, api_port = 16101 }
healthz_port = 16001
api_port = 16101
adr = ["2605171300", "2605192415"]

[[cell]]
name = "UnispscAgentExecutorCell-shard-2"
module = "unispsc_agent_executor.cell"
entry = "serve"
node = "dan"
trigger = { kind = "lan-api", healthz_port = 16002, api_port = 16102 }
healthz_port = 16002
api_port = 16102
adr = ["2605171300", "2605192415"]

# ── unispsc organism fleet (Wave 2 — ADR-2605240000) ────────────────────────
#
# Per-shard organism daemons that wrap each UNSPSC code as a joucho-driven
# tick-able organism (ADR-2605232345 / 2605240015 / 2605240030). Each
# DaemonSet (50-infra/k8s/unispsc-organism-fleet/shard-N/) is pinned to
# joseph / issachar / dan via nodeSelector — same hosts as the classifier
# shards above so classify graphs stay co-located.
#
# Posts emit to /var/lib/etzhayyim/organism-posts/shard-N.ndjson per
# ADR-2605240100; the TS drainer sidecar (Wave 3) consumes that queue.
#
# Topology:
#   joseph     UnispscOrganismFleetCell-shard-0  port 13040  segments 10-29  ~4597 organisms
#   issachar   UnispscOrganismFleetCell-shard-1  port 13050  segments 30-44  ~8541 organisms
#   dan        UnispscOrganismFleetCell-shard-2  port 13060  segments 45-60  ~5204 organisms

[[cell]]
name = "UnispscOrganismFleetCell-shard-0"
module = "kotodama.organism.fleet_cell_main"
entry = "serve"
node = "joseph"
trigger = { kind = "lan-api", healthz_port = 13040, api_port = 13040 }
healthz_port = 13040
api_port = 13040
adr = ["2605240000", "2605232345", "2605240015", "2605240030", "2605240100"]

[[cell]]
name = "UnispscOrganismFleetCell-shard-1"
module = "kotodama.organism.fleet_cell_main"
entry = "serve"
node = "issachar"
trigger = { kind = "lan-api", healthz_port = 13050, api_port = 13050 }
healthz_port = 13050
api_port = 13050
adr = ["2605240000", "2605232345", "2605240015", "2605240030", "2605240100"]

[[cell]]
name = "UnispscOrganismFleetCell-shard-2"
module = "kotodama.organism.fleet_cell_main"
entry = "serve"
node = "dan"
trigger = { kind = "lan-api", healthz_port = 13060, api_port = 13060 }
healthz_port = 13060
api_port = 13060
adr = ["2605240000", "2605232345", "2605240015", "2605240030", "2605240100"]

# ── kaizen observer (Wave 4 — ADR-2605240200) ────────────────────────────────
#
# Single observer for the whole fleet. Probes shard healthz every 10 min,
# tails NDJSON post queues, runs rule registry, emits KaizenProposal
# NDJSON lines. The downstream PR agent (separate Wave 4 service) reads
# the proposal queue and opens PRs on github.com/etzhayyim/root for human
# / agent review.
#
# DID: did:web:etzhayyim.com:actor:kaizen-observer
# Profile (once drainer federates): /profile/did:web:etzhayyim.com:actor:kaizen-observer

[[cell]]
name = "KaizenObserverCell"
module = "kotodama.organism.kaizen_cell_main"
entry = "fire"
node = "levi"
trigger = { kind = "cron", expr = "*/10 * * * *" }
healthz_port = 13070
adr = ["2605240200", "2605240100", "2605240000", "2605232345"]

# ── yabai CTI persistence (ADR-2605301400 §T3) ───────────────────────────────
#
# Public Tor-exit indicators + case-bound BitTorrent observations only. The
# cell preserves the actor graph locally on every run and transacts to Kotoba
# when YABAI_GRAPH_CID plus KOTOBA_TOKEN or KOTOBA_CACAO_B64 are present.

[[cell]]
name = "YabaiTorTorrentCtiPersistenceCell"
module = "kotodama.primitives.yabai_murakumo"
entry = "serve"
node = "issachar"
trigger = { kind = "lan-api", healthz_port = 13071, api_port = 13171 }
healthz_port = 13071
api_port = 13171
adr = ["2605301400", "2605262130", "2605231525"]

