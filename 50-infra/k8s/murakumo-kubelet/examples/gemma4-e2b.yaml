# Example: schedule a gemma-4-E2B llama-server onto a Murakumo GPU node
# via murakumo-vk. Used as the LLM backend for `mitama-udf/langgraph-server`.
#
# Apply with:
#   kubectl apply -f gemma4-e2b.yaml
#   # wait, then patch langgraph-server env to point at the Murakumo proxy URL
#   #   https://{podid}-8080.proxy.murakumo.net/v1
#
# Cost: RTX A4000 Secure ~$0.32/hr = ~$234/mo if 24/7.
---
apiVersion: v1
kind: Secret
metadata:
  name: gemma4-murakumo-env
  namespace: keiei-llm
type: Opaque
stringData:
  # Used by llama-server's `-hf` flag to fetch the GGUF from HF on
  # container startup (no PVC needed — Murakumo pods are ephemeral and
  # don't bridge k8s volumes).
  HF_TOKEN: ""    # patched in via Helm or kubectl from macOS Keychain at apply time
---
apiVersion: v1
kind: Pod
metadata:
  name: gemma4-e2b-murakumo
  namespace: keiei-llm
  labels:
    app: gemma4-e2b
    murakumo.etzhayyim.com/managed-by: murakumo-kubelet
  annotations:
    murakumo.etzhayyim.com/route: "true"                  # cost-safety gate (mandatory)
    murakumo.etzhayyim.com/gpu-type: "NVIDIA RTX A4000"   # cheapest 16GB Secure GPU
    murakumo.etzhayyim.com/cloud-type: "SECURE"
    murakumo.etzhayyim.com/ports: "8080/http"             # exposes via Murakumo HTTPS proxy
    murakumo.etzhayyim.com/container-disk-gb: "20"
    murakumo.etzhayyim.com/support-public-ip: "false"
spec:
  nodeName: murakumo-vk                             # bind directly; bypass scheduler
  tolerations:
    - key: murakumo.etzhayyim.com/virtual-kubelet
      operator: Equal
      value: "true"
      effect: NoSchedule
  restartPolicy: Always
  containers:
    - name: llama-server
      image: ghcr.io/ggml-org/llama.cpp:server-cuda
      command: ["/app/llama-server"]
      args:
        # `-hf <repo>:<quant>` downloads the GGUF directly on startup.
        # Verified mirror: unsloth/gemma-4-E2B-it-GGUF (see iter129 deploy).
        - "-hf"
        - "unsloth/gemma-4-E2B-it-GGUF:Q4_K_M"
        - "-ngl"
        - "99"                                    # offload all layers to GPU
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8080"
        - "--ctx-size"
        - "8192"
        - "--parallel"
        - "2"
      ports:
        - { containerPort: 8080, protocol: TCP }
      env:
        - name: HF_TOKEN
          valueFrom: { secretKeyRef: { name: gemma4-murakumo-env, key: HF_TOKEN } }
        - name: LLAMA_LOG_LEVEL
          value: "info"
      resources:
        # Doesn't matter much (Murakumo sizes by GPU SKU, not k8s requests),
        # but advertise so the scheduler sees consistent shape.
        requests: { cpu: "2", memory: "4Gi", nvidia.com/gpu: "1" }
        limits:   { cpu: "4", memory: "8Gi", nvidia.com/gpu: "1" }
---
# Headless Service for in-cluster service-discovery.
# langgraph-server can use either:
#   (a) the Murakumo proxy URL https://{podid}-8080.proxy.murakumo.net (recommended)
#   (b) http://gemma4-e2b.keiei-llm.svc.cluster.local:8080 (requires Murakumo
#       public IP — Secure pods with `support-public-ip: true`)
apiVersion: v1
kind: Service
metadata:
  name: gemma4-e2b
  namespace: keiei-llm
  labels: { app: gemma4-e2b }
spec:
  clusterIP: None
  selector: { app: gemma4-e2b }
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
