# Helm values for the dispatcher.etzhayyim.com nginx-ingress controller.
#
# Apply with:
#   helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
#     --namespace ingress-nginx --create-namespace \
#     -f 50-infra/k8s/ingress-nginx-dispatcher-values.yaml
controller:
  config:
    use-forwarded-headers: true
  nodeSelector:
    kubernetes.io/os: linux
    vke.vultr.com/node-pool: osm-ingest-pool
  replicaCount: 1
  service:
    type: LoadBalancer
  tolerations:
    - operator: Exists
