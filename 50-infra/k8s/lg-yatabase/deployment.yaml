---
# lg-yatabase — LangGraph Server (Granian) for yatabase BMC + marketing + sales graphs.
#
# ADR refs:
#   * ADR-2605080600 (LangGraph Server + Granian L3 Runtime)
#   * ADR-2605082100 (LangGraph Checkpointer Storage → RW PG :4566 schema lg_yatabase_checkpoint)
#   * ADR-2605111200 (CF Worker = Edge-Only; RW connection = K8s Pod only)
#
# Single writer for vertex_bmc_* / edge_bmc_* / mv_bmc_*. yatabase CF Worker
# forwards XRPC requests here via src/bmc-forward.ts (HMAC + identity headers).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lg-yatabase
  namespace: mitama-udf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lg-yatabase
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: lg-yatabase
    app.kubernetes.io/component: langgraph-server
    app.kubernetes.io/part-of: yatabase.etzhayyim.com
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lg-yatabase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lg-yatabase
    spec:
      serviceAccountName: lg-yatabase
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: server
          image: ghcr.io/etzhayyim/lg-yatabase:0.0.6-amd64
          imagePullPolicy: Always
          command:
            - uvicorn
            - lg_yatabase.server:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "1"
            - --access-log
            - --log-level
            - info
          env:
            # BMC writes against RisingWave PG :4566 (root role).
            - name: RW_URL
              valueFrom:
                secretKeyRef:
                  name: lg-yatabase-secrets
                  key: RW_URL
            # Optional alias — graph code falls back to RW_URL if unset.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lg-yatabase-secrets
                  key: RW_URL
            # HMAC shared with yatabase CF Worker (bmc-forward.ts) + bpmn-dispatcher.
            - name: DISPATCHER_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: lg-yatabase-secrets
                  key: DISPATCHER_INTERNAL_SECRET
            # x-api-key on /runs. Cron path uses x-cron=1 to bypass.
            - name: LG_YATABASE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-yatabase-secrets
                  key: LG_YATABASE_API_KEY
                  optional: true
            # LLM-judge providers (deterministic decide() still fires when both miss).
            - name: MURAKUMO_BASE_URL
              value: "https://murakumo.etzhayyim.com"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-yatabase-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: YATA_LLM_MODEL
              value: "gemma-4-e4b-it"
            # Optional Stripe key for external:stripe_subscriptions measurement.
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-yatabase-secrets
                  key: STRIPE_SECRET_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lg-yatabase
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: lg-yatabase
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lg-yatabase
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
