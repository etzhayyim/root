---
# Entity/vessel/transport adapter: links legal-entity operators, vessels, and
# cargo/transport legs into the Jukyu graph before equilibrium propagation.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jukyu-transport-adapter
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: jukyu-transport-adapter
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: jukyu.etzhayyim.com
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 1800
      activeDeadlineSeconds: 300
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jukyu-transport-adapter
            app.kubernetes.io/component: cron
        spec:
          tolerations:
            - key: workload
              operator: Equal
              value: osm-ingest
              effect: NoSchedule
          restartPolicy: Never
          containers:
            - name: trigger
              image: curlimages/curl:8.7.1
              command:
                - sh
                - -c
                - |
                  set -e
                  API_KEY="${LG_JUKYU_API_KEY:-}"
                  if [ -n "$API_KEY" ]; then
                    HEADER="-H x-api-key:${API_KEY}"
                  else
                    HEADER=""
                  fi
                  for DOMAIN in naphtha crude_oil semiconductor; do
                    curl -fsS \
                      -X POST \
                      -H "Content-Type: application/json" \
                      $HEADER \
                      --data "{\"domain\":\"${DOMAIN}\"}" \
                      http://lg-jukyu.mitama-udf.svc.cluster.local:8000/cron/domain-adapter/transport
                  done
              env:
                - name: LG_JUKYU_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lg-jukyu-secrets
                      key: LG_JUKYU_API_KEY
                      optional: true
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop: ["ALL"]
---
# Resident 15-minute equilibrium loop. It is a thin in-cluster trigger; all DB
# and Pregel logic runs in the lg-jukyu LangServer pod.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jukyu-equilibrium-loop
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: jukyu-equilibrium-loop
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: jukyu.etzhayyim.com
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 1800
      activeDeadlineSeconds: 600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jukyu-equilibrium-loop
            app.kubernetes.io/component: cron
        spec:
          tolerations:
            - key: workload
              operator: Equal
              value: osm-ingest
              effect: NoSchedule
          restartPolicy: Never
          containers:
            - name: trigger
              image: curlimages/curl:8.7.1
              command:
                - sh
                - -c
                - |
                  set -e
                  API_KEY="${LG_JUKYU_API_KEY:-}"
                  if [ -n "$API_KEY" ]; then
                    HEADER="-H x-api-key:${API_KEY}"
                  else
                    HEADER=""
                  fi
                  curl -fsS \
                    -X POST \
                    -H "Content-Type: application/json" \
                    $HEADER \
                    --data '{"riskThreshold":0.55}' \
                    http://lg-jukyu.mitama-udf.svc.cluster.local:8000/cron/equilibrium
              env:
                - name: LG_JUKYU_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lg-jukyu-secrets
                      key: LG_JUKYU_API_KEY
                      optional: true
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop: ["ALL"]
---
# Signal outbox resident drain. Phase 1 only inspects and exposes pending
