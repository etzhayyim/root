---
# no-server-key: read-only — pending Stage A-E member-signed-writes refactor per ADR-2605231525
# lg-jukyu — resident LangGraph Server for global supply-demand equilibrium.
#
# Cloudflare/SvelteKit stays edge-only. This pod owns RW reads/writes and the
# resident Jukyu agent loop:
#   /cron/equilibrium  -> global balance scan + Pregel-style propagation
#   /cron/outbox-drain -> target-company signal outbox inspection/drain
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lg-jukyu
  namespace: mitama-udf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lg-jukyu
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: lg-jukyu
    app.kubernetes.io/component: langgraph-server
    app.kubernetes.io/part-of: jukyu.etzhayyim.com
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lg-jukyu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lg-jukyu
    spec:
      serviceAccountName: lg-jukyu
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: server
          image: ghcr.io/etzhayyim/kotodama:jukyu-mcp-query-1127e93592e-20260515170344-amd64
          imagePullPolicy: IfNotPresent
          command:
            - granian
            - --interface
            - asgi
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "1"
            - --access-log
            - kotodama.jukyu.server:app
          env:
            - name: RW_URL
              valueFrom:
                secretKeyRef:
                  name: mitama-udf-pool-rw
                  key: RW_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mitama-udf-pool-rw
                  key: RW_URL
            - name: RW_SYNC_POOL
              value: "1"
            - name: JUKYU_RISK_THRESHOLD
              value: "0.55"
            - name: JUKYU_MAX_BALANCE_ROWS
              value: "100"
            - name: JUKYU_MAX_CHAIN_ROWS
              value: "500"
            - name: JUKYU_MAX_EXPOSURE_ROWS
              value: "250"
            - name: LG_JUKYU_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-jukyu-secrets
                  key: LG_JUKYU_API_KEY
                  optional: true
            - name: JUKYU_LLM_URL
              # Point at any OpenAI-compatible /v1/chat/completions endpoint.
              # In etzhayyim deployment, use ameno-langserver or an external
              # provider via the openai-compat gateway. Vendor used
              # keiei-llm-e4b previously; that endpoint is vendor-internal.
              value: "http://ameno-langserver.openmail.svc.cluster.local:8080/v1/chat/completions"
            - name: JUKYU_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-jukyu-secrets
                  key: JUKYU_LLM_API_KEY
                  optional: true
            - name: JUKYU_LLM_EXTRACTION_MODEL
              value: "gemma-4-E4B-it-Q4_K_M.gguf"
            - name: JUKYU_LLM_NARRATIVE_MODEL
              value: "gemma-4-E4B-it-Q4_K_M.gguf"
            - name: JUKYU_LLM_TIMEOUT
              value: "120"
            - name: JUKYU_LLM_ENRICH_MAX
              value: "5"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lg-jukyu
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: lg-jukyu
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lg-jukyu
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
