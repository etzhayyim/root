---
# no-server-key: read-only — pending Stage A-E member-signed-writes refactor per ADR-2605231525
# lg-gov — LangGraph Server for Gov/State Fractal Pregel Graph.
#
# ADR refs:
#   * ADR-2605080600 (LangGraph Server + Granian L3 Runtime)
#   * ADR-2605082100 (LangGraph Checkpointer Storage → RW PG :4566 schema lg_gov_checkpoint)
#
# Hosts gov-fractal-pregel graph (pymagatama.agents.gov_pregel).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lg-gov
  namespace: mitama-udf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lg-gov
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: lg-gov
    app.kubernetes.io/component: langgraph-server
    app.kubernetes.io/part-of: gov.etzhayyim.com
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lg-gov
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lg-gov
    spec:
      serviceAccountName: lg-gov
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: server
          image: ghcr.io/etzhayyim/lg-gov:latest
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - pymagatama.langgraph_server_app:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "2"
            - --access-log
            - --log-level
            - info
          env:
            # Kotoba/Datomic PG :4566 (root role) — checkpointer + vertex writes.
            - name: RW_URL
              valueFrom:
                secretKeyRef:
                  name: lg-gov-secrets
                  key: RW_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lg-gov-secrets
                  key: RW_URL
            # HMAC shared with bpmn-dispatcher.
            - name: DISPATCHER_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: lg-gov-secrets
                  key: DISPATCHER_INTERNAL_SECRET
            # LLM routing
            - name: etzhayyim_LLM_URL
              value: "https://gemma.etzhayyim.com/v1"
            - name: etzhayyim_LLM_MODEL
              value: "gemma-4-E2B-it"
            - name: etzhayyim_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-gov-secrets
                  key: etzhayyim_LLM_API_KEY
                  optional: true
            - name: MURAKUMO_BASE_URL
              value: "https://murakumo.etzhayyim.com"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lg-gov
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: lg-gov
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lg-gov
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
