---
# legal-corpus-worker — always-on LangServer for embed/search/ingest
#
# Handles:
#   legal.corpus.embedText          POST /invoke
#   legal.corpus.searchDocument     POST /invoke
#   legal.corpus.fetchBodyText      POST /invoke
#   legal.corpus.ingestDocument     POST /invoke
#   legal.corpus.embedDocument      POST /invoke
#   legal.corpus.fetchAndEmbed      POST /invoke
#   legal.corpus.fetch*Delta        POST /invoke  (manual trigger)
#
# Timer-triggered fetches are in cronjob-*.yaml.
# ADR-0049, ADR-2605080600
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-corpus-worker
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: legal-corpus-worker
    app.kubernetes.io/component: langserver
    app.kubernetes.io/part-of: legal-corpus
spec:
  # RETIRED 2026-07-17: RW_URL residue from the 2026-05-17 gftdcojp org split.
  # RisingWave was org-wide retired 2026-06-11 (ADR-2606120900/2606120930).
  # Scaled to 0 — see ADR-2605191648 addendum 2026-07-17.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: legal-corpus-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legal-corpus-worker
        app.kubernetes.io/component: langserver
        app.kubernetes.io/part-of: legal-corpus
    spec:
      tolerations:
        - key: workload
          operator: Equal
          value: osm-ingest
          effect: NoSchedule
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: worker
          image: ghcr.io/etzhayyim/legal-corpus-langgraph:latest-amd64
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: RW_URL
              valueFrom:
                secretKeyRef:
                  name: mitama-udf-pool-rw
                  key: RW_URL
            - name: PORT
              value: "8080"
            - name: COURTLISTENER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lg-legal-corpus-secrets
                  key: COURTLISTENER_API_TOKEN
                  optional: true
            - name: CANLII_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-legal-corpus-secrets
                  key: CANLII_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: legal-corpus-worker
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: legal-corpus-worker
    app.kubernetes.io/part-of: legal-corpus
spec:
  selector:
    app.kubernetes.io/name: legal-corpus-worker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# legal-corpus-mcp — lightweight MCP JSON-RPC 2.0 server for AI agent access.
# Proxies search to legal-corpus-worker; queries RW directly for list/status.
# ADR-0049, ADR-2605080600
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-corpus-mcp
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: legal-corpus-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: legal-corpus
spec:
  # RETIRED 2026-07-17: RW_URL residue from the 2026-05-17 gftdcojp org split.
  # RisingWave was org-wide retired 2026-06-11 (ADR-2606120900/2606120930).
  # Scaled to 0 — see ADR-2605191648 addendum 2026-07-17.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: legal-corpus-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legal-corpus-mcp
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/part-of: legal-corpus
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: mcp
          image: ghcr.io/etzhayyim/legal-corpus-langgraph:latest-amd64
          imagePullPolicy: Always
          command: ["python", "/app/mcp_server.py"]
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: RW_URL
              valueFrom:
                secretKeyRef:
                  name: mitama-udf-pool-rw
                  key: RW_URL
            - name: LANGSERVER_URL
              value: "http://legal-corpus-worker.mitama-udf.svc.cluster.local:8080"
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lg-legal-corpus-secrets
                  key: MCP_AUTH_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: legal-corpus-mcp
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: legal-corpus-mcp
    app.kubernetes.io/part-of: legal-corpus
spec:
  selector:
    app.kubernetes.io/name: legal-corpus-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
