---
# One-shot WorldLii historical backfill (OAI-PMH)
# from_date 90 days ago — OAI-PMH has no LIMIT so returns all matching records.
# Safe to re-run: ingest_document_graph is idempotent on canonicalUri.
# ADR-0049, ADR-2605080600
apiVersion: batch/v1
kind: Job
metadata:
  name: legal-corpus-backfill-worldlii
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: legal-corpus-backfill-worldlii
    app.kubernetes.io/component: backfill
    app.kubernetes.io/part-of: legal-corpus
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legal-corpus-backfill-worldlii
        app.kubernetes.io/component: backfill
    spec:
      restartPolicy: Never
      tolerations:
        - key: workload
          operator: Equal
          value: osm-ingest
          effect: NoSchedule
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: run
          image: ghcr.io/etzhayyim/legal-corpus-langgraph:latest-amd64
          imagePullPolicy: Always
          env:
            - name: RW_URL
              valueFrom:
                secretKeyRef:
                  name: mitama-udf-pool-rw
                  key: RW_URL
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          command: ["python", "-c"]
          args:
            - |
              import asyncio, json, sys, datetime
              sys.path.insert(0, '/app')
              from legal_corpus_langgraph import fetch_worldlii_graph

              async def main():
                  from_date = (
                      datetime.date.today() - datetime.timedelta(days=90)
                  ).isoformat()
                  result = await fetch_worldlii_graph.ainvoke({
                      "from_date": from_date,
                      "items": [],
                      "ingest_results": [],
                      "error": None,
                  })
                  count = len(result.get("ingest_results") or [])
                  print(json.dumps({
                      "source": "worldlii",
                      "from_date": from_date,
                      "ingestedCount": count,
                      "error": result.get("error"),
                  }), flush=True)
                  if result.get("error"):
                      sys.exit(1)

              asyncio.run(main())
