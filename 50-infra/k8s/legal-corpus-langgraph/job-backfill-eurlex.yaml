---
# One-shot EUR-Lex historical backfill
# Runs fetch_eurlex_graph across 6 × 30-day windows covering the past 6 months.
# Each window fetches up to 50 documents (SPARQL LIMIT).
# Safe to re-run: ingest_document_graph is idempotent on canonicalUri.
# ADR-0049, ADR-2605080600
apiVersion: batch/v1
kind: Job
metadata:
  name: legal-corpus-backfill-eurlex
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: legal-corpus-backfill-eurlex
    app.kubernetes.io/component: backfill
    app.kubernetes.io/part-of: legal-corpus
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legal-corpus-backfill-eurlex
        app.kubernetes.io/component: backfill
    spec:
      restartPolicy: Never
      tolerations:
        - key: workload
          operator: Equal
          value: osm-ingest
          effect: NoSchedule
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: run
          image: ghcr.io/etzhayyim/legal-corpus-langgraph:latest-amd64
          imagePullPolicy: Always
          env:
            - name: RW_URL
              valueFrom:
                secretKeyRef:
                  name: mitama-udf-pool-rw
                  key: RW_URL
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"
          command: ["python", "-c"]
          args:
            - |
              import asyncio, json, sys, datetime
              sys.path.insert(0, '/app')
              from legal_corpus_langgraph import fetch_eurlex_graph

              # 6-month backfill in 30-day windows (newest-first so errors stop early)
              def windows():
                  today = datetime.date.today()
                  for i in range(6):
                      yield (today - datetime.timedelta(days=30 * (i + 1))).isoformat()

              async def main():
                  total = 0
                  for since in windows():
                      result = await fetch_eurlex_graph.ainvoke({
                          "since_date": since,
                          "items": [],
                          "ingest_results": [],
                          "error": None,
                      })
                      count = len(result.get("ingest_results") or [])
                      total += count
                      print(json.dumps({
                          "source": "eur-lex",
                          "since": since,
                          "count": count,
                          "error": result.get("error"),
                      }), flush=True)
                      if result.get("error"):
                          print(f"Stopping on error for since={since}", file=sys.stderr)
                          sys.exit(1)
                  print(json.dumps({"source": "eur-lex", "total": total}), flush=True)

              asyncio.run(main())
