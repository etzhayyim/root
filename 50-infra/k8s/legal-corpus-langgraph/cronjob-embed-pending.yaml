---
# Nightly embed sweep — runs bge-m3 1024d embedding for all documents
# that have embedding_vec IS NULL (newly ingested since the last sweep).
# Schedule: 07:00 UTC daily, after all source-fetch CronJobs (02:00-06:00 UTC).
# Safe to re-run: skips docs that already have embedding_vec set.
# ADR-0049, ADR-2605080600
apiVersion: batch/v1
kind: CronJob
metadata:
  name: legal-corpus-embed-pending
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: legal-corpus-embed-pending
    app.kubernetes.io/component: langgraph-cronjob
    app.kubernetes.io/part-of: legal-corpus
spec:
  # RETIRED 2026-07-17: RW_URL residue from the 2026-05-17 gftdcojp org split.
  # RisingWave was org-wide retired 2026-06-11 (ADR-2606120900/2606120930).
  # Suspended — see ADR-2605191648 addendum 2026-07-17.
  suspend: true
  schedule: "0 7 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: legal-corpus-embed-pending
            app.kubernetes.io/component: langgraph-cronjob
        spec:
          restartPolicy: Never
          tolerations:
            - key: workload
              operator: Equal
              value: osm-ingest
              effect: NoSchedule
          imagePullSecrets:
            - name: ghcr-creds
          containers:
            - name: run
              image: ghcr.io/etzhayyim/legal-corpus-langgraph:latest-amd64
              imagePullPolicy: Always
              env:
                - name: RW_URL
                  valueFrom:
                    secretKeyRef:
                      name: mitama-udf-pool-rw
                      key: RW_URL
              resources:
                requests:
                  cpu: "1000m"
                  memory: "6Gi"
                limits:
                  cpu: "2000m"
                  memory: "8Gi"
              command: ["python", "-c"]
              args:
                - |
                  import asyncio, json, sys
                  sys.path.insert(0, '/app')
                  from legal_corpus_langgraph import (
                      fetch_and_embed_graph, _fetchall, _embed_text, _vec_literal, _execute
                  )

                  async def embed_direct(vertex_id: str, text: str) -> None:
                      """Embed text and write embedding_vec directly, bypassing LangGraph."""
                      embedding = await _embed_text(text[:2048])
                      vec = _vec_literal(embedding)
                      await _execute(
                          f"UPDATE vertex_legal_corpus_document"
                          f" SET embedding_vec = '{vec}'::vector(1024),"
                          f"     embedding_dim = %s, embedding_model = 'BAAI/bge-m3'"
                          f" WHERE vertex_id = %s",
                          (len(embedding), vertex_id),
                      )

                  async def main():
                      rows = await _fetchall(
                          "SELECT vertex_id, canonical_uri, source_id, title, body_text"
                          " FROM vertex_legal_corpus_document"
                          " WHERE embedding_vec IS NULL"
                          " ORDER BY created_at"
                      )
                      print(json.dumps({"pending": len(rows)}), flush=True)
                      if not rows:
                          print(json.dumps({"done": True, "ok": 0, "fail": 0, "skip": 0}), flush=True)
                          return

                      ok = fail = skip = 0
                      for row in rows:
                          vid = row["vertex_id"]
                          try:
                              if row.get("body_text"):
                                  result = await fetch_and_embed_graph.ainvoke({
                                      "vertex_id":    vid,
                                      "canonical_uri": row["canonical_uri"],
                                      "source_id":    row["source_id"],
                                      "body_text":    row["body_text"],
                                      "embedding":    [],
                                      "dim":          0,
                                      "body_updated": True,
                                      "embed_updated": False,
                                      "error":        None,
                                  })
                                  if not result.get("embed_updated"):
                                      raise RuntimeError(result.get("error") or "embed_updated=False")
                              else:
                                  title = (row.get("title") or "").strip()
                                  if not title:
                                      skip += 1
                                      print(json.dumps({"status": "skip_no_text", "vertex_id": vid[:80]}), flush=True)
                                      continue
                                  await embed_direct(vid, title)
                              ok += 1
                              print(json.dumps({"status": "ok", "vertex_id": vid[:80]}), flush=True)
                          except Exception as e:
                              fail += 1
                              print(json.dumps({"status": "error", "vertex_id": vid[:80], "error": str(e)}), flush=True)

                      print(json.dumps({"done": True, "ok": ok, "fail": fail, "skip": skip}), flush=True)
                      if fail > 0 and ok == 0:
                          sys.exit(1)

                  asyncio.run(main())
