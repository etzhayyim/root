---
# fetchCourtListenerDelta — daily CourtListener opinion delta ingest
# Replaces: fetchCourtListenerDelta.bpmn timer-start R/PT24H
# ADR-0049, ADR-2605080600
apiVersion: batch/v1
kind: CronJob
metadata:
  name: legal-corpus-courtlistener
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: legal-corpus-courtlistener
    app.kubernetes.io/component: langgraph-cronjob
    app.kubernetes.io/part-of: legal-corpus
spec:
  # RETIRED 2026-07-17: RW_URL residue from the 2026-05-17 gftdcojp org split.
  # RisingWave was org-wide retired 2026-06-11 (ADR-2606120900/2606120930).
  # Suspended — see ADR-2605191648 addendum 2026-07-17.
  suspend: true
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: legal-corpus-courtlistener
            app.kubernetes.io/component: langgraph-cronjob
        spec:
          restartPolicy: Never
          tolerations:
            - key: workload
              operator: Equal
              value: osm-ingest
              effect: NoSchedule
          imagePullSecrets:
            - name: ghcr-creds
          containers:
            - name: run
              image: ghcr.io/etzhayyim/legal-corpus-langgraph:latest-amd64
              imagePullPolicy: Always
              env:
                - name: RW_URL
                  valueFrom:
                    secretKeyRef:
                      name: mitama-udf-pool-rw
                      key: RW_URL
                - name: COURTLISTENER_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: lg-legal-corpus-secrets
                      key: COURTLISTENER_API_TOKEN
                      optional: true
              resources:
                requests:
                  cpu: "500m"
                  memory: "4Gi"
                limits:
                  cpu: "2000m"
                  memory: "8Gi"
              command: ["python", "-c"]
              args:
                - |
                  import asyncio, json, sys
                  sys.path.insert(0, '/app')
                  from legal_corpus_langgraph import fetch_courtlistener_graph

                  async def main():
                      result = await fetch_courtlistener_graph.ainvoke({
                          "cursor": None,
                          "secret_ref": "",
                          "items": [],
                          "next_cursor": None,
                          "ingest_results": [],
                          "error": None,
                      })
                      count = len(result.get("ingest_results") or [])
                      print(json.dumps({
                          "source": "courtlistener",
                          "ingestedCount": count,
                          "error": result.get("error"),
                      }))
                      if result.get("error"):
                          sys.exit(1)

                  asyncio.run(main())
