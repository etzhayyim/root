# no-server-key: read-only — pending Stage A-E member-signed-writes refactor per ADR-2605231525
# F4 — generic XRPC dispatcher for BPMN-as-actor.
#
# HTTP server that owns the entire T1/T2 actor surface: turns
# `POST /xrpc/{nsid}` into a LangServer.run_process_with_result call,
# routed via vertex_bpmn_lexicon_binding lookup.
#
# Internal trust: Service is ClusterIP only. Public MCP traffic enters via
# mcp.etzhayyim.com → Cloudflare Tunnel and is forwarded here before
# pod-side LangServer/LangGraph execution.
#
# Extracted from etzhayyim-apps-etzhayyimcojp/50-infra/vultr/mitama-udf-pool/
# templates/dispatcher.yaml (Helm template) per ADR-2605181400 §D2
# amendment 2026-05-22. Helm value placeholders rendered inline with
# operator-tunable defaults. Values that must be supplied at apply time
# are marked REPLACE_ME.
#
# Substrate-boundary NOTE (ADR-2605172100, etzhayyim CLAUDE.md):
#   This Deployment inherits STRIPE_* + RW_URL env from kotodama's
#   lawfirm_billing / lawfirm_checkout / ingest.stripe modules, which
#   are themselves pending substrate-purity cleanup in etzhayyim.
#   Those env vars are preserved here for runtime compatibility; the
#   correct long-term path is kotodama Stripe extraction → drop the
#   STRIPE_* + RW_URL block entirely. See README.md "Substrate boundary".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bpmn-dispatcher
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: bpmn-dispatcher
    app.kubernetes.io/component: bpmn-actor-frontend
    etzhayyim.com/adr: "0049"
spec:
  # RETIRED 2026-07-17: RW_URL residue from the 2026-05-17 gftdcojp org split.
  # RisingWave was org-wide retired 2026-06-11 (ADR-2606120900/2606120930).
  # Scaled to 0 — see ADR-2605191648 addendum 2026-07-17.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: bpmn-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bpmn-dispatcher
        etzhayyim.com/adr: "0049"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: dispatcher
          image: REPLACE_ME_IMAGE_REF  # e.g. ghcr.io/etzhayyim/kotodama:<tag>
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "kotodama.dispatcher_main"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: DISPATCHER_PORT, value: "8080" }
            - { name: AGENTGATEWAY_MCP_URL, value: "http://agentgateway.mitama-udf.svc.cluster.local:8080" }
            - { name: BINDING_TTL_SEC, value: "30" }
            - { name: DISPATCHER_AUTH_MODE, value: "strict" }
            - { name: LANGGRAPH_SERVER_URL, value: "http://lg-pregel.mitama-udf.svc.cluster.local:8000" }
            - { name: MAPS_LANGSERVER_INTERNAL_URL, value: "http://maps-read-langserver.mitama-udf.svc.cluster.local:8000" }
            - { name: MALAK_LANGSERVER_INTERNAL_URL, value: "http://malak-langserver.mitama-udf.svc.cluster.local:8000" }
            - { name: MAMORU_LANGGRAPH_INTERNAL_URL, value: "http://mamoru-langgraph.mitama-udf.svc.cluster.local:8000" }
            - name: DISPATCHER_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: bpmn-dispatcher-auth
                  key: INTERNAL_SECRET
            - { name: RW_DDL_GUARD, value: "1" }
            - { name: RW_ALLOW_HEAVY_DDL, value: "0" }
            - { name: RW_ALLOW_FLUSH, value: "0" }
            - { name: RW_SYNC_POOL, value: "1" }
            # SUBSTRATE-VIOLATION (inherited from kotodama, ADR-2605172100):
            # Kotoba/Datomic URL — kotodama.db_sync uses it for
            # vertex_bpmn_lexicon_binding lookup. Cleanup path:
            # migrate binding registry to AT MST records, drop RW_URL.
                secretKeyRef:
                  name: bpmn-dispatcher-rw
                  key: RW_URL
            - name: PUBLIC_MALAK_ARTIFACT_PREFIX
              value: "artifacts/public-malak"
            - name: PUBLIC_MALAK_ARTIFACT_S3_REGION
              value: "auto"
            - name: PUBLIC_MALAK_ARTIFACT_BUCKET
              valueFrom:
                secretKeyRef:
                  name: public-malak-r2-creds
                  key: PUBLIC_MALAK_ARTIFACT_BUCKET
                  optional: true
            - name: PUBLIC_MALAK_ARTIFACT_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: public-malak-r2-creds
                  key: PUBLIC_MALAK_ARTIFACT_S3_ENDPOINT
                  optional: true
            - name: PUBLIC_MALAK_ARTIFACT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: public-malak-r2-creds
                  key: PUBLIC_MALAK_ARTIFACT_S3_ACCESS_KEY_ID
                  optional: true
            - name: PUBLIC_MALAK_ARTIFACT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: public-malak-r2-creds
                  key: PUBLIC_MALAK_ARTIFACT_S3_SECRET_ACCESS_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-pregel-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            # SUBSTRATE-VIOLATION (inherited from kotodama lawfirm_billing/
            # lawfirm_checkout, ADR-2605172100 §payment hard rule "MUST NOT
            # integrate fiat payment processors"). Cleanup path: kotodama
            # Stripe extraction → drop the entire STRIPE_* block. Until
            # then, dispatcher pod inherits vendor-tier fiat capability.
            - name: STRIPE_US_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lawfirm-stripe
                  key: STRIPE_US_API_KEY
                  optional: true
            - name: STRIPE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: lawfirm-stripe
                  key: STRIPE_PUBLIC_KEY
                  optional: true
            - name: STRIPE_IN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lawfirm-stripe
                  key: STRIPE_IN_API_KEY
                  optional: true
            - name: STRIPE_JP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lawfirm-stripe
                  key: STRIPE_JP_API_KEY
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: lawfirm-stripe
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bpmn-dispatcher
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: bpmn-dispatcher
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bpmn-dispatcher
  ports:
    - name: http
      port: 8080
      targetPort: 8080
