# Phase D pilot #1 infra — CF Tunnel for bpmn-dispatcher.
#
# Topology (ADR-0056 public cutover, 2026-04-24; etzhayyim cutover
# 2026-05-22 per ADR-2605181400 §D2 amendment):
#
#   Client
#     ↓ HTTPS
#   CF edge (any *.etzhayyim.com)
#     ├─ routing-gateway (*.etzhayyim.com/*)
#     │   ├─ /xrpc/* → fetch(https://dispatcher.etzhayyim.com/...)
#     │   └─ (other paths → per-actor Worker binding or 404)
#     ↓
#   CF edge (mcp.etzhayyim.com / dispatcher.etzhayyim.com CNAME)
#     ↓ WireGuard/QUIC tunnel (this Deployment)
#   cloudflared pod (mitama-udf ns)
#     ↓ cluster-internal HTTP
#   bpmn-dispatcher Service (ClusterIP :8080)
#     ↓
#   bpmn-dispatcher pod (aiohttp + F5 watcher → LangServer)
#
# Tunnel ID: REPLACE_ME_TUNNEL_ID
#   Create on etzhayyim CF account:
#     cloudflared tunnel create bpmn-dispatcher
#   Then replace REPLACE_ME_TUNNEL_ID + REPLACE_ME_CREDENTIALS_JSON below.
# DNS (operator pending):
#   dispatcher.etzhayyim.com CNAME REPLACE_ME_TUNNEL_ID.cfargotunnel.com (proxied=True)
#   mcp.etzhayyim.com        CNAME REPLACE_ME_TUNNEL_ID.cfargotunnel.com (proxied=True)
#
# Predecessor on etzhayyim CF account (tunnel ID be2cc0b0-ddee-4ca7-baf1-2bffbef18f31,
# DNS dispatcher.etzhayyim.com / mcp.etzhayyim.com) must be `cloudflared tunnel delete`d
# after this tunnel is HEALTHY and end-to-end verified.

apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-bpmn-dispatcher-credentials
  namespace: mitama-udf
type: Opaque
stringData:
  # From `cloudflared tunnel create bpmn-dispatcher`.
  # Contains {AccountTag, TunnelSecret, TunnelID, Endpoint}.
  # Rotate: `cloudflared tunnel delete bpmn-dispatcher && cloudflared tunnel create bpmn-dispatcher`.
  credentials.json: |
    REPLACE_ME_CREDENTIALS_JSON
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-bpmn-dispatcher-config
  namespace: mitama-udf
data:
  config.yaml: |
    tunnel: REPLACE_ME_TUNNEL_ID
    credentials-file: /etc/cloudflared/creds/credentials.json

    # Metrics + warp-routing disabled; we only need ingress.
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    # Ingress routing (cloudflared evaluates in order, first match wins):
    # mcp.etzhayyim.com/xrpc/com.etzhayyim.mcp.message            → bpmn-dispatcher MCP router
    # dispatcher.etzhayyim.com/xrpc/com.etzhayyim.apps.shinshi.*  → lg-shinshi LangGraph
    # dispatcher.etzhayyim.com/xrpc/com.etzhayyim.animeka.*       → lg-animeka LangGraph
    # dispatcher.etzhayyim.com/* and mcp.etzhayyim.com/*    → bpmn-dispatcher (default)
    # Anything else (catch-all) returns 404.
    #
    # 2026-05-11 (P59, ADR-2605111200 Option A): yata.(bmc|signup|invite|revoke|lead)*
    # no longer routes directly to lg-yatabase. cloudflared on this VKE cannot
    # dial the lg-yatabase pod network namespace (i/o timeout regardless of
    # FQDN / svc IP / pod IP / hostPort / hostNetwork). bpmn-dispatcher can,
    # so the yatabase NSIDs fall through to the catch-all and kotodama's
    # dispatcher proxies them to lg-yatabase via `_proxy_to_lg_yatabase`.
    ingress:
      - hostname: ses-api.etzhayyim.com
        service: http://lg-ses.mitama-udf.svc.cluster.local:8000
        originRequest:
          connectTimeout: 30s
          noTLSVerify: true
      - hostname: dispatcher.etzhayyim.com
        path: ^/xrpc/com\.etzhayyim\.apps\.shinshi\..*$
        service: http://lg-shinshi.mitama-udf.svc.cluster.local:8000
        originRequest:
          connectTimeout: 10s
          noTLSVerify: true
      - hostname: dispatcher.etzhayyim.com
        path: ^/xrpc/com\.etzhayyim\.apps\.animeka\..*$
        service: http://lg-animeka.mitama-udf.svc.cluster.local:8000
        originRequest:
          connectTimeout: 10s
          noTLSVerify: true
      - hostname: dispatcher.etzhayyim.com
        path: ^/xrpc/com\.etzhayyim\.apps\.recap\..*$
        service: http://lg-recap.mitama-udf.svc.cluster.local:8000
        originRequest:
          connectTimeout: 30s
          noTLSVerify: true
      - hostname: dispatcher.etzhayyim.com
        path: ^/xrpc/com\.etzhayyim\.apps\.media_gamers\..*$
        service: http://lg-media-gamers.mitama-udf.svc.cluster.local:8000
        originRequest:
          connectTimeout: 30s
          noTLSVerify: true
      - hostname: dispatcher.etzhayyim.com
        service: http://bpmn-dispatcher.mitama-udf.svc.cluster.local:8080
        originRequest:
          connectTimeout: 10s
          noTLSVerify: true
      - hostname: mcp.etzhayyim.com
        service: http://bpmn-dispatcher.mitama-udf.svc.cluster.local:8080
        originRequest:
          connectTimeout: 10s
          noTLSVerify: true
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-bpmn-dispatcher
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/instance: bpmn-dispatcher
    app.kubernetes.io/component: tunnel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
      app.kubernetes.io/instance: bpmn-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/instance: bpmn-dispatcher
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        vke.vultr.com/node-pool: osm-ingest-pool
      tolerations:
        - key: workload
          operator: Equal
          value: osm-ingest
          effect: NoSchedule
        - operator: Exists
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.4.0
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-bpmn-dispatcher-config
        - name: creds
          secret:
            secretName: cloudflared-bpmn-dispatcher-credentials
