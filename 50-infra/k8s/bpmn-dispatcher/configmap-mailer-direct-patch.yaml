apiVersion: v1
data:
  dispatcher_main.py: "\"\"\"\nF4 \u2014 generic XRPC dispatcher for BPMN-contract\
    \ actors (ADR-0049 follow-on).\n\nSingle HTTP server that owns the entire T1/T2\
    \ actor surface:\n\n    POST /xrpc/{nsid}              \u2014 kick a BPMN process\
    \ named by the\n                                      vertex_bpmn_lexicon_binding\
    \ row\n                                      for `nsid`. Body becomes the\n  \
    \                                    starting variables. Returns the\n       \
    \                               instance result variables JSON.\n\n    GET  /health\
    \                   \u2014 liveness\n    GET  /bindings                 \u2014\
    \ authenticated debug: list known\n                                      nsid\
    \ \u2192 process_id\n    GET  /xrpc/{nsid}              \u2014 convenience for\
    \ parameterless\n                                      lookups; same as POST with\
    \ empty body\n\nAuth: gated by the `DISPATCHER_AUTH_MODE` env var.\n\n    off\
    \                \u2014 no auth check. Original behaviour, kept only\n       \
    \                  for local rollback. LB exposure at this mode\n            \
    \             is a security risk \u2014 see ADR 2604231432\n                 \
    \        security posture.\n    strict              \u2014 require header `x-internal-trust:\n\
    \                         <DISPATCHER_INTERNAL_SECRET>` on every\n           \
    \              `/xrpc/*` call. PDS pipethrough adds this\n                   \
    \      header (dispatch.ts); direct callers must\n                         supply\
    \ it too. Unmatched/absent \u2192 401.\n\n`/health` is always open. `/bindings`\
    \ uses the same gate as `/xrpc/*`\nbecause it reveals the active actor surface.\n\
    \nRun:\n    python -m kotodama.dispatcher_main\n\nEnv:\n    DISPATCHER_PORT\
    \               default 8080\n    AGENTGATEWAY_MCP_URL          pod-side MCP gateway\
    \ URL\n    RW_URL                        required (binding lookup)\n    BINDING_TTL_SEC\
    \               default 30 (in-memory cache window)\n    DISPATCHER_AUTH_MODE\
    \          off | strict (default: strict)\n    DISPATCHER_INTERNAL_SECRET    shared\
    \ secret when mode=strict\n\"\"\"\n\nfrom __future__ import annotations\n\nimport\
    \ asyncio\nimport json\nimport logging\nimport os\nimport re\nimport time\nfrom\
    \ typing import Any\n\nfrom aiohttp import web\n\nfrom kotodama.db_sync import\
    \ sync_cursor\n\nLOG = logging.getLogger(\"dispatcher\")\nlogging.basicConfig(level=logging.INFO,\
    \ format=\"%(asctime)s %(levelname)s %(name)s %(message)s\")\n\nPORT = int(os.environ.get(\"\
    DISPATCHER_PORT\", \"8080\"))\nAGENTGATEWAY_MCP_URL = os.environ.get(\n    \"\
    AGENTGATEWAY_MCP_URL\",\n    \"http://agentgateway-mcp.mitama-udf.svc.cluster.local:8080\"\
    ,\n)\nBINDING_TTL_SEC = int(os.environ.get(\"BINDING_TTL_SEC\", \"30\"))\n\nAUTH_MODE\
    \ = os.environ.get(\"DISPATCHER_AUTH_MODE\", \"strict\").lower()\nINTERNAL_SECRET\
    \ = os.environ.get(\"DISPATCHER_INTERNAL_SECRET\", \"\")\nINTERNAL_TRUST_HEADER\
    \ = \"x-internal-trust\"\nPUBLIC_MALAK_PREFIX = \"com.etzhayyim.apps.publicMalak.\"\
    \n\n# Yatabase pod proxy (ADR-2605111200 Option A, P59 2026-05-11).\n# Cloudflared\
    \ on this VKE cannot reach the lg-yatabase pod network namespace\n# for reasons\
    \ unknown (i/o timeout on every dial \u2014 FQDN, svc IP, pod IP,\n# node IP+hostPort\
    \ all fail) while bpmn-dispatcher CAN reach it. So we\n# proxy the auth/leads\
    \ XRPC surface through here instead of relying on the\n# cloudflared origin dialing\
    \ the pod directly.\nLG_YATABASE_INTERNAL_URL = os.environ.get(\n    \"LG_YATABASE_INTERNAL_URL\"\
    ,\n    \"http://lg-yatabase.mitama-udf.svc.cluster.local:8000\",\n)\nLG_YATABASE_PROXY_PREFIXES\
    \ = (\n    # Everything under the yatabase product surface is owned by the pod.\n\
    \    # Specific NSIDs land on dedicated handlers; unknown ones get a clean\n \
    \   # 404 from FastAPI instead of crashing here.\n    \"com.etzhayyim.apps.yata.\"\
    ,\n)\n\n# lg-animeka pod proxy (P3c 2026-05-12, same pattern as lg-yatabase).\n\
    LG_ANIMEKA_INTERNAL_URL = os.environ.get(\n    \"LG_ANIMEKA_INTERNAL_URL\",\n\
    \    \"http://lg-animeka.mitama-udf.svc.cluster.local:8000\",\n)\nLG_ANIMEKA_PROXY_PREFIXES\
    \ = (\n    \"com.etzhayyim.animeka.\",\n)\n\n# lg-recap pod proxy (2026-05-12,\
    \ same pattern as lg-animeka).\nLG_RECAP_INTERNAL_URL = os.environ.get(\n    \"\
    LG_RECAP_INTERNAL_URL\",\n    \"http://lg-recap.mitama-udf.svc.cluster.local:8000\"\
    ,\n)\nLG_RECAP_PROXY_PREFIXES = (\n    \"com.etzhayyim.apps.recap.\",\n)\n\n#\
    \ lg-mangaka pod proxy (2026-05-12, same pattern as lg-recap).\nLG_MANGAKA_INTERNAL_URL\
    \ = os.environ.get(\n    \"LG_MANGAKA_INTERNAL_URL\",\n    \"http://lg-mangaka.mitama-udf.svc.cluster.local:8000\"\
    ,\n)\nLG_MANGAKA_PROXY_NSIDS = frozenset({\n    \"com.etzhayyim.mangaka.saveDocument\"\
    ,\n    \"com.etzhayyim.mangaka.loadDocument\",\n    \"com.etzhayyim.mangaka.listDocuments\"\
    ,\n})\n\n# lg-shinshi pod proxy (2026-05-13, Zeebe\u2192LangGraph migration Phase\
    \ A).\nLG_SHINSHI_INTERNAL_URL = os.environ.get(\n    \"LG_SHINSHI_INTERNAL_URL\"\
    ,\n    \"http://lg-shinshi.mitama-udf.svc.cluster.local:8000\",\n)\nLG_SHINSHI_PROXY_PREFIXES\
    \ = (\"com.etzhayyim.apps.shinshi.\",)\n\n# lg-narou pod proxy (2026-05-13, Zeebe\u2192\
    LangGraph migration Phase A).\nLG_NAROU_INTERNAL_URL = os.environ.get(\n    \"\
    LG_NAROU_INTERNAL_URL\",\n    \"http://lg-narou.mitama-udf.svc.cluster.local:8000\"\
    ,\n)\nLG_NAROU_PROXY_PREFIXES = (\"com.etzhayyim.narou.\",)\n\n# lg-dougaka pod\
    \ proxy (2026-05-13, Zeebe\u2192LangGraph migration Phase A).\nLG_DOUGAKA_INTERNAL_URL\
    \ = os.environ.get(\n    \"LG_DOUGAKA_INTERNAL_URL\",\n    \"http://lg-dougaka.mitama-udf.svc.cluster.local:8000\"\
    ,\n)\nLG_DOUGAKA_PROXY_PREFIXES = (\"com.etzhayyim.apps.dougaka.\",)\n\n# lg-x\
    \ pod proxy (2026-05-13, Zeebe\u2192LangGraph migration Phase A).\nLG_X_INTERNAL_URL\
    \ = os.environ.get(\n    \"LG_X_INTERNAL_URL\",\n    \"http://lg-x.mitama-udf.svc.cluster.local:8000\"\
    ,\n)\nLG_X_PROXY_PREFIXES = (\"com.etzhayyim.apps.x.\",)\n\n# lg-yukkuri pod proxy\
    \ (2026-05-13, Zeebe\u2192LangGraph migration Phase A).\nLG_YUKKURI_INTERNAL_URL\
    \ = os.environ.get(\n    \"LG_YUKKURI_INTERNAL_URL\",\n    \"http://lg-yukkuri.mitama-udf.svc.cluster.local:8000\"\
    ,\n)\nLG_YUKKURI_PROXY_PREFIXES = (\"com.etzhayyim.apps.yukkuri.\",)\n\n# lg-open-jpn-mynumber\
    \ pod proxy (2026-05-13, Zeebe\u2192LangGraph migration Phase B).\nLG_OPEN_JPN_MYNUMBER_INTERNAL_URL\
    \ = os.environ.get(\n    \"LG_OPEN_JPN_MYNUMBER_INTERNAL_URL\",\n    \"http://lg-open-jpn-mynumber.mitama-udf.svc.cluster.local:8000\"\
    ,\n)\nLG_OPEN_JPN_MYNUMBER_PROXY_PREFIXES = (\"com.etzhayyim.apps.openJpnMynumber.\"\
    ,)\n\n# lg-curpus2skill pod proxy (2026-05-13, Zeebe\u2192LangGraph migration\
    \ Phase B).\nLG_CURPUS2SKILL_INTERNAL_URL = os.environ.get(\n    \"LG_CURPUS2SKILL_INTERNAL_URL\"\
    ,\n    \"http://lg-curpus2skill.mitama-udf.svc.cluster.local:8000\",\n)\nLG_CURPUS2SKILL_PROXY_PREFIXES\
    \ = (\"com.etzhayyim.apps.curpus2skill.\",)\n\n# lg-pd-color pod proxy (2026-05-13,\
    \ Zeebe\u2192LangGraph migration Phase B).\nLG_PD_COLOR_INTERNAL_URL = os.environ.get(\n\
    \    \"LG_PD_COLOR_INTERNAL_URL\",\n    \"http://lg-pd-color.mitama-udf.svc.cluster.local:8000\"\
    ,\n)\nLG_PD_COLOR_PROXY_PREFIXES = (\"com.etzhayyim.apps.pdColor.\",)\n\n# lg-karma\
    \ pod proxy (2026-05-13, Zeebe\u2192LangGraph migration Phase C).\nLG_KARMA_INTERNAL_URL\
    \ = os.environ.get(\n    \"LG_KARMA_INTERNAL_URL\",\n    \"http://lg-karma.mitama-udf.svc.cluster.local:8000\"\
    ,\n)\nLG_KARMA_PROXY_PREFIXES = (\"com.etzhayyim.apps.karma.\",)\n\n# lg-legal-entity\
    \ pod proxy (2026-05-13, Zeebe\u2192LangGraph migration Phase D).\nLG_LEGAL_ENTITY_INTERNAL_URL\
    \ = os.environ.get(\n    \"LG_LEGAL_ENTITY_INTERNAL_URL\",\n    \"http://lg-legal-entity.mitama-udf.svc.cluster.local:8000\"\
    ,\n)\nLG_LEGAL_ENTITY_PROXY_PREFIXES = (\"com.etzhayyim.legalEntity.\",)\n\n#\
    \ lg-organism pod proxy (2026-05-13, Zeebe\u2192LangGraph migration Phase E).\n\
    LG_ORGANISM_INTERNAL_URL = os.environ.get(\n    \"LG_ORGANISM_INTERNAL_URL\",\n\
    \    \"http://lg-organism.mitama-udf.svc.cluster.local:8000\",\n)\nLG_ORGANISM_PROXY_PREFIXES\
    \ = (\n    \"com.etzhayyim.hakkou.\",\n    \"com.etzhayyim.apps.kabi.\",\n   \
    \ \"com.etzhayyim.ki.\",\n    \"com.etzhayyim.apps.kinoko.\",\n    \"com.etzhayyim.apps.kobo.\"\
    ,\n    \"com.etzhayyim.koke.\",\n    \"com.etzhayyim.apps.saikin.\",\n)\n\n# LangGraph\
    \ Server routing (ADR-2605080600 Phase 3).\n# When LANGGRAPH_SERVER_URL is set\
    \ and a binding has routing_target='langgraph',\n# bpmn-dispatcher POSTs to /runs\
    \ instead of calling Zeebe gRPC.\nLANGGRAPH_SERVER_URL = os.environ.get(\n   \
    \ \"LANGGRAPH_SERVER_URL\",\n    \"http://langgraph-server.mitama-udf.svc.cluster.local:8000\"\
    ,\n)\n\n\n# \u2500\u2500\u2500 Binding cache \u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n# vertex_bpmn_lexicon_binding\
    \ lookup is small but hot. Cache for a few\n# seconds so a burst of XRPC traffic\
    \ doesn't hammer kotoba.\n\n_binding_cache: dict[str, tuple[dict[str, Any] | None,\
    \ float]] = {}\n\n\ndef _lookup_binding_sync(nsid: str) -> dict[str, Any] | None:\n\
    \    from kotodama.kotoba_datomic import get_kotoba_client\n    client = get_kotoba_client()\n\
    \    rows = client.select_where(\"vertex_bpmn_lexicon_binding\", \"nsid\", nsid,\
    \ limit=100)\n    active = [r for r in rows if r.get(\"status\") == \"active\"\
    ]\n    if not active:\n        return None\n    row = active[0]\n    timeout_raw\
    \ = row.get(\"result_timeout_ms\")\n    return {\n        \"bpmn_process_id\"\
    : row.get(\"bpmn_process_id\"),\n        \"bpmn_version\": int(row.get(\"bpmn_version\"\
    ) or 0),\n        \"result_timeout_ms\": 60_000 if timeout_raw is None else int(timeout_raw),\n\
    \        \"routing_target\": row.get(\"routing_target\") or \"zeebe\",\n     \
    \   \"langgraph_url\": row.get(\"langgraph_url\")\n    }\n\n\nasync def lookup_binding(nsid:\
    \ str) -> dict[str, Any] | None:\n    now = time.monotonic()\n    hit = _binding_cache.get(nsid)\n\
    \    if hit and (now - hit[1]) < BINDING_TTL_SEC:\n        LOG.info(\"binding\
    \ cache hit nsid=%s ageMs=%d\", nsid, int((now - hit[1]) * 1000))\n        return\
    \ hit[0]\n    try:\n        binding = await asyncio.to_thread(_lookup_binding_sync,\
    \ nsid)\n    except Exception:\n        if hit:\n            LOG.warning(\"binding\
    \ lookup failed nsid=%s; using stale cache\", nsid, exc_info=True)\n         \
    \   return hit[0]\n        raise\n    _binding_cache[nsid] = (binding, now)\n\
    \    return binding\n\n\n# \u2500\u2500\u2500 HTTP handlers \u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \n\nasync def health(_request: web.Request) -> web.Response:\n    return web.json_response({\"\
    status\": \"ok\"})\n\n\nasync def list_bindings(_request: web.Request) -> web.Response:\n\
    \    \"\"\"Debug endpoint \u2014 list active bindings (no cache, fresh DB read).\"\
    \"\"\n    def _all() -> list[dict[str, Any]]:\n        from kotodama.kotoba_datomic\
    \ import get_kotoba_client\n        client = get_kotoba_client()\n        rows\
    \ = client.select_where(\"vertex_bpmn_lexicon_binding\", \"status\", \"active\"\
    , limit=2000)\n        return [\n            {\n                \"nsid\": r.get(\"\
    nsid\"),\n                \"bpmnProcessId\": r.get(\"bpmn_process_id\"),\n   \
    \             \"bpmnVersion\": int(r.get(\"bpmn_version\") or 0),\n          \
    \      \"resultTimeoutMs\": 60_000 if r.get(\"result_timeout_ms\") is None else\
    \ int(r.get(\"result_timeout_ms\")),\n                \"routingTarget\": r.get(\"\
    routing_target\") or \"zeebe\",\n                \"langgraphUrl\": r.get(\"langgraph_url\"\
    ),\n            }\n            for r in rows\n        ]\n    rows = await asyncio.to_thread(_all)\n\
    \    now = time.monotonic()\n    for row in rows:\n        _binding_cache[str(row[\"\
    nsid\"])] = (\n            {\n                \"bpmn_process_id\": row[\"bpmnProcessId\"\
    ],\n                \"bpmn_version\": row[\"bpmnVersion\"],\n                \"\
    result_timeout_ms\": row[\"resultTimeoutMs\"],\n                \"routing_target\"\
    : row[\"routingTarget\"],\n                \"langgraph_url\": row[\"langgraphUrl\"\
    ],\n            },\n            now,\n        )\n    return web.json_response({\"\
    bindings\": rows, \"count\": len(rows)})\n\n\ndef _int_param(value: Any, default:\
    \ int, *, lo: int = 1, hi: int = 500) -> int:\n    try:\n        parsed = int(value)\n\
    \    except (TypeError, ValueError):\n        parsed = default\n    return max(lo,\
    \ min(parsed, hi))\n\n\ndef _bool_param(value: Any) -> bool | None:\n    if value\
    \ is None or value == \"\":\n        return None\n    if isinstance(value, bool):\n\
    \        return value\n    raw = str(value).strip().lower()\n    if raw in {\"\
    1\", \"true\", \"t\", \"yes\", \"y\"}:\n        return True\n    if raw in {\"\
    0\", \"false\", \"f\", \"no\", \"n\"}:\n        return False\n    return None\n\
    \n\ndef _permille(value: Any) -> int | None:\n    if value is None or value ==\
    \ \"\":\n        return None\n    try:\n        return int(float(value) * 1000)\n\
    \    except (TypeError, ValueError):\n        return None\n\n\ndef _request_params(request:\
    \ web.Request, body: dict[str, Any] | None = None) -> dict[str, Any]:\n    params\
    \ = dict(body or {})\n    for key, value in request.query.items():\n        params.setdefault(key,\
    \ value)\n    return params\n\n\ndef _str_param(params: dict[str, Any], key: str,\
    \ default: str = \"\") -> str:\n    value = params.get(key)\n    if value is None:\n\
    \        return default\n    return str(value).strip()\n\n\ndef _public_malak_search_terms(params:\
    \ dict[str, Any]) -> list[str]:\n    raw = params.get(\"searchTerms\") or params.get(\"\
    search_terms\") or params.get(\"queryValue\") or params.get(\"query\")\n    values\
    \ = raw if isinstance(raw, list) else str(raw or \"\").split(\",\")\n    return\
    \ [str(value).strip() for value in values if str(value).strip()]\n\n\ndef _public_malak_crawl_ads_sync(params:\
    \ dict[str, Any]) -> dict[str, Any]:\n    from kotodama.primitives import public_malak_ads\n\
    \n    platform = _str_param(params, \"platform\")\n    query_kind = _str_param(params,\
    \ \"queryKind\", \"search\") or _str_param(params, \"query_kind\", \"search\"\
    )\n    country = _str_param(params, \"country\").upper()\n    search_terms = _public_malak_search_terms(params)\n\
    \    seeds = [\n        {\n            \"platform\": platform,\n            \"\
    queryKind\": query_kind,\n            \"queryValue\": term,\n            \"country\"\
    : country,\n        }\n        for term in search_terms\n    ]\n    out = public_malak_ads.queue_seed_runs(seeds=seeds,\
    \ limit=_int_param(params.get(\"limit\"), 50, hi=500))\n    runs = out.get(\"\
    runs\") if isinstance(out.get(\"runs\"), list) else []\n    first_run = runs[0]\
    \ if runs and isinstance(runs[0], dict) else {}\n    return {\n        \"scraperRunUri\"\
    : first_run.get(\"vertexId\"),\n        \"searchTerms\": search_terms,\n     \
    \   \"country\": country or None,\n        \"platform\": platform or None,\n \
    \       \"status\": \"queued\" if int(out.get(\"queued\") or 0) > 0 else \"completed\"\
    ,\n        \"adsSeen\": 0,\n        \"adsNew\": 0,\n        \"adsUpdated\": 0,\n\
    \        \"queued\": int(out.get(\"queued\") or 0),\n        \"skipped\": int(out.get(\"\
    skipped\") or 0),\n        \"runs\": runs,\n    }\n\n\ndef _public_malak_process_scraper_queue_sync(params:\
    \ dict[str, Any]) -> dict[str, Any]:\n    from kotodama.primitives import public_malak_ads\n\
    \n    return public_malak_ads.process_queue(\n        max_runs=_int_param(params.get(\"\
    limit\") or params.get(\"max\") or params.get(\"maxRuns\"), 3, hi=50),\n     \
    \   timeout_sec=float(_int_param(params.get(\"timeoutSec\") or params.get(\"timeout_sec\"\
    ), 20, lo=1, hi=600)),\n        platform=_str_param(params, \"platform\"),\n \
    \       reclaim_after_sec=_int_param(params.get(\"reclaimAfterSec\"), 1800, lo=60,\
    \ hi=86400),\n    )\n\n\ndef _public_malak_analyze_recent_ads_sync(params: dict[str,\
    \ Any]) -> dict[str, Any]:\n    from kotodama.primitives import public_malak_ads\n\
    \n    return public_malak_ads.analyze_recent(\n        limit=_int_param(params.get(\"\
    limit\"), 10, hi=100),\n        platform=_str_param(params, \"platform\"),\n \
    \       analysis_kind=_str_param(params, \"analysisKind\", \"competitive\") or\
    \ \"competitive\",\n        model_id=_str_param(params, \"modelId\"),\n    )\n\
    \n\ndef _public_malak_cluster_recent_ads_sync(params: dict[str, Any]) -> dict[str,\
    \ Any]:\n    from kotodama.primitives import public_malak_ads\n\n    return\
    \ public_malak_ads.cluster_recent(\n        limit=_int_param(params.get(\"limit\"\
    ), 25, hi=200),\n        platform=_str_param(params, \"platform\"),\n        platform_scope=_str_param(params,\
    \ \"platformScope\", \"platform\") or \"platform\",\n    )\n\n\ndef _public_malak_campaign_view(row:\
    \ Any) -> dict[str, Any]:\n    return {\n        \"vertexId\": row[0],\n     \
    \   \"campaignKey\": row[1],\n        \"platformScope\": row[2],\n        \"advertiserVertexId\"\
    : row[3],\n        \"advertiserName\": row[4],\n        \"landingDomain\": row[5],\n\
    \        \"claimToken\": row[6],\n        \"sampleHeadline\": row[7],\n      \
    \  \"sampleBodyText\": row[8],\n        \"creativeCount\": int(row[9] or 0),\n\
    \        \"platformCount\": int(row[10] or 0),\n        \"firstSeenAt\": row[11],\n\
    \        \"lastSeenAt\": row[12],\n        \"riskScorePermille\": int(row[13]\
    \ or 0),\n        \"summary\": row[14],\n    }\n\n\ndef _public_malak_cluster_creative_view(row:\
    \ Any) -> dict[str, Any]:\n    return {\n        \"vertexId\": row[0],\n     \
    \   \"platform\": row[1],\n        \"platformAdId\": row[2],\n        \"advertiserName\"\
    : row[3],\n        \"headline\": row[4],\n        \"bodyText\": row[5],\n    \
    \    \"landingUrl\": row[6],\n        \"lastSeenAt\": row[7],\n        \"matchBasis\"\
    : row[8],\n    }\n\n\ndef _public_malak_scraper_run_view(row: Any) -> dict[str,\
    \ Any]:\n    return {\n        \"vertexId\": row[0],\n        \"platform\": row[1],\n\
    \        \"queryKind\": row[2],\n        \"queryValue\": row[3],\n        \"country\"\
    : row[4],\n        \"startedAt\": row[5],\n        \"finishedAt\": row[6],\n \
    \       \"status\": row[7],\n        \"adsSeen\": int(row[8] or 0),\n        \"\
    adsNew\": int(row[9] or 0),\n        \"adsUpdated\": int(row[10] or 0),\n    \
    \    \"errorMessage\": row[11],\n        \"userAgent\": row[12],\n        \"proxyCountry\"\
    : row[13],\n        \"playwrightTraceCid\": row[14],\n        \"robotsTxtSnapshotCid\"\
    : row[15],\n        \"rateLimitSleepMs\": int(row[16] or 0),\n    }\n\n\ndef _public_malak_creative_view(row:\
    \ Any) -> dict[str, Any]:\n    return {\n        \"vertexId\": row[0],\n     \
    \   \"platform\": row[1],\n        \"platformAdId\": row[2],\n        \"advertiserVertexId\"\
    : row[3],\n        \"advertiserName\": row[4],\n        \"creativeType\": row[5],\n\
    \        \"headline\": row[6],\n        \"bodyText\": row[7],\n        \"ctaText\"\
    : row[8],\n        \"landingUrl\": row[9],\n        \"displayUrl\": row[10],\n\
    \        \"mediaUrl\": row[11],\n        \"mediaCid\": row[12],\n        \"thumbnailCid\"\
    : row[13],\n        \"languages\": row[14],\n        \"currency\": row[15],\n\
    \        \"impressionsMin\": None if row[16] is None else int(row[16]),\n    \
