    \     )\n    except asyncio.TimeoutError:\n        return web.json_response(\n\
    \            {\"error\": \"ProxyTimeout\", \"nsid\": nsid}, status=504,\n    \
    \    )\n\n\nasync def mcp_route(request: web.Request) -> web.Response:\n    \"\
    \"\"POST /mcp \u2014 MCP JSON-RPC facade for pod-owned tools.\n\n    Tool names\
    \ intentionally use the same Lexicon NSID strings as the XRPC\n    surface. Phase\
    \ 1 routes Shinshi through the lg-shinshi pod MCP endpoint;\n    other app namespaces\
    \ can be added here or moved behind a registry-backed\n    router without changing\
    \ edge callers.\n    \"\"\"\n    try:\n        body = await request.json()\n \
    \   except json.JSONDecodeError as exc:\n        return web.json_response(\n \
    \           {\"jsonrpc\": \"2.0\", \"id\": None, \"error\": {\"code\": -32700,\
    \ \"message\": f\"invalid JSON body: {exc}\"}},\n            status=400,\n   \
    \     )\n    if not isinstance(body, dict):\n        return web.json_response(\n\
    \            {\"jsonrpc\": \"2.0\", \"id\": None, \"error\": {\"code\": -32600,\
    \ \"message\": \"body must be a JSON object\"}},\n            status=400,\n  \
    \      )\n\n    method = str(body.get(\"method\") or \"\")\n    params = body.get(\"\
    params\")\n    tool_name = \"\"\n    if isinstance(params, dict):\n        tool_name\
    \ = str(params.get(\"name\") or \"\")\n\n    if method == \"tools/call\" and not\
    \ tool_name.startswith(\"com.etzhayyim.apps.shinshi.\"):\n        return web.json_response(\n\
    \            {\n                \"jsonrpc\": \"2.0\",\n                \"id\"\
    : body.get(\"id\"),\n                \"error\": {\n                    \"code\"\
    : -32601,\n                    \"message\": f\"no MCP route for tool {tool_name!r}\"\
    ,\n                },\n            },\n            status=404,\n        )\n\n\
    \    import aiohttp as _aiohttp\n    target = f\"{LG_SHINSHI_INTERNAL_URL.rstrip('/')}/mcp\"\
    \n    headers: dict[str, str] = {\"content-type\": \"application/json\"}\n   \
    \ for h in (\n        INTERNAL_TRUST_HEADER,\n        \"x-etzhayyim-actor-did\"\
    ,\n        \"x-etzhayyim-org-did\",\n        \"x-etzhayyim-trace-id\",\n    ):\n\
    \        v = request.headers.get(h)\n        if v is not None:\n            headers[h]\
    \ = v\n    started = time.monotonic()\n    try:\n        async with _aiohttp.ClientSession()\
    \ as session:\n            async with session.post(\n                target,\n\
    \                data=json.dumps(body).encode(\"utf-8\"),\n                headers=headers,\n\
    \                timeout=_aiohttp.ClientTimeout(total=60),\n            ) as resp:\n\
    \                raw = await resp.read()\n                LOG.info(\n        \
    \            \"mcp proxy method=%s tool=%s target=lg-shinshi status=%s ms=%d\"\
    ,\n                    method,\n                    tool_name,\n             \
    \       resp.status,\n                    int((time.monotonic() - started) * 1000),\n\
    \                )\n                content_type = (resp.headers.get(\"content-type\"\
    ) or \"application/json\").split(\";\")[0].strip()\n                return web.Response(status=resp.status,\
    \ body=raw, content_type=content_type)\n    except _aiohttp.ClientError as exc:\n\
    \        LOG.exception(\"mcp proxy failed method=%s tool=%s err=%s\", method,\
    \ tool_name, exc)\n        return web.json_response(\n            {\n        \
    \        \"jsonrpc\": \"2.0\",\n                \"id\": body.get(\"id\"),\n  \
    \              \"error\": {\"code\": -32000, \"message\": f\"MCP proxy failed:\
    \ {str(exc)[:300]}\"},\n            },\n            status=502,\n        )\n \
    \   except asyncio.TimeoutError:\n        return web.json_response(\n        \
    \    {\n                \"jsonrpc\": \"2.0\",\n                \"id\": body.get(\"\
    id\"),\n                \"error\": {\"code\": -32001, \"message\": \"MCP proxy\
    \ timeout\"},\n            },\n            status=504,\n        )\n\n\nasync def\
    \ dispatch(request: web.Request) -> web.Response:\n    \"\"\"POST /xrpc/{nsid}\
    \ \u2014 start a BPMN process and await result.\"\"\"\n    nsid = request.match_info.get(\"\
    nsid\", \"\")\n    LOG.info(\"dispatch start method=%s nsid=%s\", request.method,\
    \ nsid)\n    if not nsid:\n        return web.json_response({\"error\": \"nsid\
    \ required in path\"}, status=400)\n\n    body: dict[str, Any] = {}\n    if request.body_exists\
    \ and request.method == \"POST\":\n        try:\n            body = await request.json()\n\
    \        except json.JSONDecodeError as e:\n            return web.json_response(\n\
    \                {\"error\": f\"invalid JSON body: {e}\"}, status=400,\n     \
    \       )\n        if not isinstance(body, dict):\n            return web.json_response(\n\
    \                {\"error\": \"body must be a JSON object\"}, status=400,\n  \
    \          )\n\n    # ADR-2605091700 Phase 3: fan-out every dispatch to NATS for\
    \ observability,\n    # replay, and decoupling. Subject = `mitama.{nsid}` (nsid\
    \ keeps its dots).\n    nc = request.app.get(\"nats\")\n    if nc is not None:\n\
    \        try:\n            await nc.publish(\n                f\"mitama.{nsid}\"\
    ,\n                json.dumps({\"nsid\": nsid, \"method\": request.method, \"\
    body\": body}).encode(),\n            )\n        except Exception as exc:  # noqa:\
    \ BLE001\n            LOG.debug(\"nats fan-out failed (non-fatal) nsid=%s err=%s\"\
    , nsid, exc)\n\n    direct_response = await public_malak_direct_query(request,\
    \ nsid, body)\n    if direct_response is not None:\n        return direct_response\n\
    \n    # ADR-2605111200 Option A (P59): proxy yatabase auth/leads/bmc XRPC NSIDs\n\
    \    # to lg-yatabase pod over cluster networking that bpmn-dispatcher can\n \
    \   # actually reach (cloudflared cannot dial the lg-yatabase pod network\n  \
    \  # namespace from this VKE \u2014 see deps.toml cycle_20260511_02 blocker).\n\
    \    if any(nsid.startswith(p) for p in LG_YATABASE_PROXY_PREFIXES):\n       \
    \ return await _proxy_to_lg_yatabase(request, nsid, body)\n\n    if any(nsid.startswith(p)\
    \ for p in LG_ANIMEKA_PROXY_PREFIXES):\n        return await _proxy_to_lg_animeka(request,\
    \ nsid, body)\n\n    if any(nsid.startswith(p) for p in LG_RECAP_PROXY_PREFIXES):\n\
    \        return await _proxy_to_lg_recap(request, nsid, body)\n\n    if nsid in\
    \ LG_MANGAKA_PROXY_NSIDS:\n        return await _proxy_to_lg_mangaka(request,\
    \ nsid, body)\n\n    if any(nsid.startswith(p) for p in LG_SHINSHI_PROXY_PREFIXES):\n\
    \        return await _proxy_to_lg_pod(request, nsid, body, LG_SHINSHI_INTERNAL_URL,\
    \ \"lg-shinshi\")\n\n    if any(nsid.startswith(p) for p in LG_NAROU_PROXY_PREFIXES):\n\
    \        return await _proxy_to_lg_pod(request, nsid, body, LG_NAROU_INTERNAL_URL,\
    \ \"lg-narou\")\n\n    if any(nsid.startswith(p) for p in LG_DOUGAKA_PROXY_PREFIXES):\n\
    \        return await _proxy_to_lg_pod(request, nsid, body, LG_DOUGAKA_INTERNAL_URL,\
    \ \"lg-dougaka\")\n\n    if any(nsid.startswith(p) for p in LG_X_PROXY_PREFIXES):\n\
    \        return await _proxy_to_lg_pod(request, nsid, body, LG_X_INTERNAL_URL,\
    \ \"lg-x\")\n\n    if any(nsid.startswith(p) for p in LG_YUKKURI_PROXY_PREFIXES):\n\
    \        return await _proxy_to_lg_pod(request, nsid, body, LG_YUKKURI_INTERNAL_URL,\
    \ \"lg-yukkuri\")\n\n    if any(nsid.startswith(p) for p in LG_OPEN_JPN_MYNUMBER_PROXY_PREFIXES):\n\
    \        return await _proxy_to_lg_pod(request, nsid, body, LG_OPEN_JPN_MYNUMBER_INTERNAL_URL,\
    \ \"lg-open-jpn-mynumber\")\n\n    if any(nsid.startswith(p) for p in LG_CURPUS2SKILL_PROXY_PREFIXES):\n\
    \        return await _proxy_to_lg_pod(request, nsid, body, LG_CURPUS2SKILL_INTERNAL_URL,\
    \ \"lg-curpus2skill\")\n\n    if any(nsid.startswith(p) for p in LG_PD_COLOR_PROXY_PREFIXES):\n\
    \        return await _proxy_to_lg_pod(request, nsid, body, LG_PD_COLOR_INTERNAL_URL,\
    \ \"lg-pd-color\")\n\n    if any(nsid.startswith(p) for p in LG_KARMA_PROXY_PREFIXES):\n\
    \        return await _proxy_to_lg_pod(request, nsid, body, LG_KARMA_INTERNAL_URL,\
    \ \"lg-karma\")\n\n    if any(nsid.startswith(p) for p in LG_LEGAL_ENTITY_PROXY_PREFIXES):\n\
    \        return await _proxy_to_lg_pod(request, nsid, body, LG_LEGAL_ENTITY_INTERNAL_URL,\
    \ \"lg-legal-entity\")\n\n    if any(nsid.startswith(p) for p in LG_ORGANISM_PROXY_PREFIXES):\n\
    \        return await _proxy_to_lg_pod(request, nsid, body, LG_ORGANISM_INTERNAL_URL,\
    \ \"lg-organism\")\n\n    mailer_direct = await _dispatch_mailer_direct(nsid,\
    \ body)\n    if mailer_direct is not None:\n        return mailer_direct\n\n \
    \   binding = await lookup_binding(nsid)\n    if not binding:\n        return\
    \ web.json_response(\n            {\"error\": \"no active binding\", \"nsid\"\
    : nsid}, status=404,\n        )\n    LOG.info(\n        \"dispatch binding nsid=%s\
    \ process=%s timeoutMs=%s\",\n        nsid,\n        binding[\"bpmn_process_id\"\
    ],\n        binding[\"result_timeout_ms\"],\n    )\n\n    timeout_ms = binding[\"\
    result_timeout_ms\"]\n    started = time.monotonic()\n    # Inject the resolved\
    \ bpmn_process_id as a process variable so worker\n    # tasks (e.g. generic.db.insert)\
    \ can scope writes to the binding's\n    # write_table_allowlist. Caller body\
    \ cannot override this (we set\n    # last-write-wins after spread). NSID is also\
    \ injected for audit\n    # correlation; it's not used for enforcement.\n    process_vars\
    \ = {\n        **(body or {}),\n        \"_bpmnProcessId\": binding[\"bpmn_process_id\"\
    ],\n        \"_nsid\": nsid,\n    }\n    LOG.info(\"dispatch process_vars keys=%s\
    \ body_keys=%s\", list(process_vars.keys()), list(body.keys()))\n\n    # Phase\
    \ G (2026-05-13): all vertex_bpmn_lexicon_binding rows migrated to routing_target='langgraph'.\n\
    \    # Zeebe/Spiff fallback removed.\n    return await _dispatch_langgraph(\n\
    \        nsid=nsid,\n        binding=binding,\n        process_vars=process_vars,\n\
    \        started=started,\n    )\n\n\n\n\n\n\n\n\n# \u2500\u2500\u2500 Auth middleware\
    \ \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\n\n@web.middleware\nasync def auth_middleware(request: web.Request, handler):\n\
    \    \"\"\"Gate `/xrpc/*` on shared-secret header when strict mode enabled.\n\n\
    \    `/health` is always open. `/bindings` is gated because it enumerates\n  \
    \  the live NSID \u2192 BPMN process surface.\n    Unknown `DISPATCHER_AUTH_MODE`\
    \ fails closed to avoid mis-configuration\n    silently dropping the gate.\n \
    \   \"\"\"\n    if request.path == \"/health\":\n        return await handler(request)\n\
    \    if not (request.path.startswith(\"/xrpc/\") or request.path == \"/mcp\" or\
    \ request.path == \"/bindings\"):\n        return await handler(request)\n   \
    \ if AUTH_MODE == \"off\":\n        return await handler(request)\n    if AUTH_MODE\
    \ == \"strict\":\n        if not INTERNAL_SECRET:\n            LOG.error(\"DISPATCHER_AUTH_MODE=strict\
    \ but DISPATCHER_INTERNAL_SECRET empty\")\n            return web.json_response(\n\
    \                {\"error\": \"AuthMisconfigured\",\n                 \"message\"\
    : \"dispatcher strict mode requires DISPATCHER_INTERNAL_SECRET\"},\n         \
    \       status=500,\n            )\n        import hmac as _hmac\n        import\
    \ hashlib as _hashlib\n        provided = request.headers.get(INTERNAL_TRUST_HEADER,\
    \ \"\")\n        if not provided:\n            return web.json_response(\n   \
    \             {\"error\": \"Unauthorized\",\n                 \"message\": f\"\
    missing {INTERNAL_TRUST_HEADER} header\"},\n                status=401,\n    \
    \        )\n        # Accept either raw shared-secret (legacy) OR HMAC-SHA256(body,\
    \ secret)\n        # so callers like the yatabase Worker (P55 onwards) that already\
    \ sign\n        # against DISPATCHER_INTERNAL_SECRET keep working.\n        if\
    \ _hmac.compare_digest(provided, INTERNAL_SECRET):\n            return await handler(request)\n\
    \        try:\n            body_bytes = await request.read()\n        except Exception:\
    \  # noqa: BLE001\n            body_bytes = b\"\"\n        expected_hmac = _hmac.new(\n\
    \            INTERNAL_SECRET.encode(\"utf-8\"), body_bytes, _hashlib.sha256\n\
    \        ).hexdigest()\n        if _hmac.compare_digest(provided, expected_hmac):\n\
    \            return await handler(request)\n        return web.json_response(\n\
    \            {\"error\": \"Unauthorized\",\n             \"message\": f\"missing\
    \ or invalid {INTERNAL_TRUST_HEADER} header\"},\n            status=401,\n   \
    \     )\n    LOG.error(\"unknown DISPATCHER_AUTH_MODE=%r (expected off|strict)\"\
    , AUTH_MODE)\n    return web.json_response(\n        {\"error\": \"AuthMisconfigured\"\
    ,\n         \"message\": f\"unknown DISPATCHER_AUTH_MODE={AUTH_MODE!r}\"},\n \
    \       status=500,\n    )\n\n\n# \u2500\u2500\u2500 App bootstrap \u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\n\nasync def make_app() -> web.Application:\n    app = web.Application(middlewares=[auth_middleware])\n\
    \n    # \u2500\u2500\u2500 NATS JetStream fan-out (ADR-2605091700, Phase 3) \u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\n    # Every /xrpc/{nsid} dispatch publishes a copy to NATS subject\n\
    \    # `mitama.{nsid-with-dots}` so all actor invocations become observable\n\
    \    # / replayable / decoupled from RW availability. Fire-and-forget;\n    #\
    \ publish failure does not block the dispatch.\n    nats_url = os.environ.get(\"\
    NATS_URL\", \"\")\n    nats_enabled = bool(nats_url) and os.environ.get(\"DISPATCHER_NATS_ENABLED\"\
    , \"1\") == \"1\"\n    if nats_enabled:\n        try:\n            import nats\
    \ as _nats  # type: ignore[import-not-found]\n            nc = await _nats.connect(\n\
    \                nats_url,\n                max_reconnect_attempts=-1,\n     \
    \           reconnect_time_wait=2,\n                connect_timeout=3,\n     \
    \       )\n            app[\"nats\"] = nc\n            LOG.info(\"dispatcher NATS\
    \ connected url=%s\", nats_url)\n        except Exception as exc:  # noqa: BLE001\n\
    \            LOG.warning(\"dispatcher NATS connect failed (continuing without):\
    \ %s\", exc)\n            app[\"nats\"] = None\n    else:\n        app[\"nats\"\
    ] = None\n    app.router.add_get(\"/health\", health)\n    app.router.add_get(\"\
    /bindings\", list_bindings)\n    # MCP envelope route (ADR-2605082000 \xA72.6\
    \ + ADR-0087). Must be registered\n    # BEFORE the wildcard so /xrpc/com.etzhayyim.mcp.message\
    \ hits the dedicated\n    # handler instead of the BPMN-binding lookup.\n    from\
    \ kotodama.mcp_dispatch import aiohttp_route as _mcp_route, build_default_handlers\n\
    \    app[\"mcp_handlers\"] = build_default_handlers()\n    app.router.add_post(\"\
    /xrpc/com.etzhayyim.mcp.message\", _mcp_route)\n    app.router.add_post(\"/mcp\"\
    , mcp_route)\n    app.router.add_post(\"/xrpc/{nsid}\", dispatch)\n    app.router.add_get(\"\
    /xrpc/{nsid}\", dispatch)\n\n    LOG.info(\n        \"dispatcher ready, agentgateway_mcp_url=%s,\
    \ port=%d, binding_ttl=%ds\",\n        AGENTGATEWAY_MCP_URL,\n        PORT,\n\
    \        BINDING_TTL_SEC,\n    )\n    return app\n\n\ndef main() -> None:\n  \
    \  if not os.environ.get(\"RW_URL\"):\n        LOG.warning(\"RW_URL not set \u2014\
    \ binding lookup will fail\")\n    web.run_app(make_app(), host=\"0.0.0.0\", port=PORT,\
    \ access_log=None)\n\n\nif __name__ == \"__main__\":\n    main()\n"
