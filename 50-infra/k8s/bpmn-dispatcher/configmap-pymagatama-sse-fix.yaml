apiVersion: v1
data:
  dispatcher_main.py: "\"\"\"\nF4 \u2014 generic XRPC dispatcher for BPMN-as-actor\
    \ (ADR-0049 follow-on).\n\nSingle HTTP server that owns the entire T1/T2 actor\
    \ surface:\n\n    POST /xrpc/{nsid}              \u2014 kick a BPMN process named\
    \ by the\n                                      vertex_bpmn_lexicon_binding row\n\
    \                                      for `nsid`. Body becomes the\n        \
    \                              starting variables. Returns the\n             \
    \                         instance result variables JSON.\n\n    GET  /health\
    \                   \u2014 liveness\n    GET  /bindings                 \u2014\
    \ authenticated debug: list known\n                                      nsid\
    \ \u2192 process_id\n    GET  /xrpc/{nsid}              \u2014 convenience for\
    \ parameterless\n                                      lookups; same as POST with\
    \ empty body\n\nAuth: gated by the `DISPATCHER_AUTH_MODE` env var.\n\n    off\
    \                \u2014 no auth check. Original behaviour, kept only\n       \
    \                  for local rollback. LB exposure at this mode\n            \
    \             is a security risk \u2014 see ADR 2604231432\n                 \
    \        security posture.\n    strict              \u2014 require header `x-internal-trust:\n\
    \                         <DISPATCHER_INTERNAL_SECRET>` on every\n           \ # no-server-key: read-only
    \              `/xrpc/*` call. PDS pipethrough adds this\n                   \
    \      header (dispatch.ts); direct callers must\n                         supply\
    \ it too. Unmatched/absent \u2192 401.\n\n`/health` is always open. `/bindings`\
    \ uses the same gate as `/xrpc/*`\nbecause it reveals the active actor surface.\n\
    \nRun:\n    python -m pymagatama.dispatcher_main\n\nEnv:\n    DISPATCHER_PORT\
    \               default 8080\n    ZEEBE_GATEWAY                 default zeebe-gateway:26500\n\
    \    RW_URL                        required (binding lookup)\n    BINDING_TTL_SEC\
    \               default 30 (in-memory cache window)\n    DISPATCHER_AUTH_MODE\
    \          off | strict (default: strict)\n    DISPATCHER_INTERNAL_SECRET    shared\ # no-server-key: read-only
    \ secret when mode=strict\n\"\"\"\n\nfrom __future__ import annotations\n\nimport\
    \ asyncio\nimport json\nimport logging\nimport os\nimport re\nimport time\nfrom\
    \ typing import Any\n\nfrom aiohttp import web\nfrom pyzeebe import ZeebeClient,\
    \ create_insecure_channel\nfrom pyzeebe.errors.process_errors import ProcessInvalidError\n\
    \nfrom pymagatama.kotoba_datomic import get_kotoba_client\nfrom pymagatama.handlers.user_task_sink\
    \ import (\n    register_routes as register_user_task_routes,\n    run_user_task_sink_loop,\n\
    )\n\nLOG = logging.getLogger(\"dispatcher\")\nlogging.basicConfig(level=logging.INFO,\
    \ format=\"%(asctime)s %(levelname)s %(name)s %(message)s\")\n\nPORT = int(os.environ.get(\"\
    DISPATCHER_PORT\", \"8080\"))\nGATEWAY = os.environ.get(\"ZEEBE_GATEWAY\", \"\
    zeebe-gateway:26500\")\nBINDING_TTL_SEC = int(os.environ.get(\"BINDING_TTL_SEC\"\
    , \"30\"))\nSSE_HEARTBEAT_SEC = float(os.environ.get(\"SSE_HEARTBEAT_SEC\", \"\
    10\"))\nSSE_MAX_TIMEOUT_MS = int(os.environ.get(\"SSE_MAX_TIMEOUT_MS\", \"900000\"\
    ))\n\nAUTH_MODE = os.environ.get(\"DISPATCHER_AUTH_MODE\", \"strict\").lower()\n\
    INTERNAL_SECRET = os.environ.get(\"DISPATCHER_INTERNAL_SECRET\", \"\")\nINTERNAL_TRUST_HEADER\ # no-server-key: read-only
    \ = \"x-internal-trust\"\n\n\n# \u2500\u2500\u2500 Binding cache \u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \n\n# vertex_bpmn_lexicon_binding lookup is small but hot. Cache for a few\n#\
    \ seconds so a burst of XRPC traffic doesn't hammer RW.\n\n_binding_cache: dict[str,\
    \ tuple[dict[str, Any] | None, float]] = {}\n\n\ndef _lookup_binding_sync(nsid:\
    \ str) -> dict[str, Any] | None:\n    with sync_cursor() as cur:\n        cur.execute(\n\
    \            \"SELECT bpmn_process_id, bpmn_version, result_timeout_ms, status\
    \ \"\n            \"FROM vertex_bpmn_lexicon_binding \"\n            \"WHERE nsid\
    \ = %s AND status = 'active' \"\n            \"LIMIT 1\",\n            (nsid,),\n\
    \        )\n        row = cur.fetchone()\n    if not row:\n        return None\n\
    \    timeout_raw = row[2]\n    return {\n        \"bpmn_process_id\": row[0],\n\
    \        \"bpmn_version\": int(row[1] or 0),\n        \"result_timeout_ms\": 60_000\
    \ if timeout_raw is None else int(timeout_raw),\n    }\n\n\nasync def lookup_binding(nsid:\
    \ str) -> dict[str, Any] | None:\n    now = time.monotonic()\n    hit = _binding_cache.get(nsid)\n\
    \    if hit and (now - hit[1]) < BINDING_TTL_SEC:\n        LOG.info(\"binding\
    \ cache hit nsid=%s ageMs=%d\", nsid, int((now - hit[1]) * 1000))\n        return\
    \ hit[0]\n    try:\n        binding = await asyncio.to_thread(_lookup_binding_sync,\
    \ nsid)\n    except Exception:\n        if hit:\n            LOG.warning(\"binding\
    \ lookup failed nsid=%s; using stale cache\", nsid, exc_info=True)\n         \
    \   return hit[0]\n        raise\n    _binding_cache[nsid] = (binding, now)\n\
    \    return binding\n\n\n# \u2500\u2500\u2500 HTTP handlers \u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \n\nasync def health(_request: web.Request) -> web.Response:\n    return web.json_response({\"\
    status\": \"ok\"})\n\n\nasync def list_bindings(_request: web.Request) -> web.Response:\n\
    \    \"\"\"Debug endpoint \u2014 list active bindings (no cache, fresh DB read).\"\
    \"\"\n    def _all() -> list[dict[str, Any]]:\n        with sync_cursor() as cur:\n\
    \            cur.execute(\n                \"SELECT nsid, bpmn_process_id, bpmn_version,\
    \ result_timeout_ms \"\n                \"FROM vertex_bpmn_lexicon_binding \"\n\
    \                \"WHERE status = 'active' \"\n                \"ORDER BY nsid\"\
    ,\n            )\n            return [\n                {\n                  \
    \  \"nsid\": r[0],\n                    \"bpmnProcessId\": r[1],\n           \
    \         \"bpmnVersion\": int(r[2] or 0),\n                    \"resultTimeoutMs\"\
    : 60_000 if r[3] is None else int(r[3]),\n                }\n                for\
    \ r in (cur.fetchall() or [])\n            ]\n    rows = await asyncio.to_thread(_all)\n\
    \    now = time.monotonic()\n    for row in rows:\n        _binding_cache[str(row[\"\
    nsid\"])] = (\n            {\n                \"bpmn_process_id\": row[\"bpmnProcessId\"\
    ],\n                \"bpmn_version\": row[\"bpmnVersion\"],\n                \"\
    result_timeout_ms\": row[\"resultTimeoutMs\"],\n            },\n            now,\n\
    \        )\n    return web.json_response({\"bindings\": rows, \"count\": len(rows)})\n\
    \n\ndef _wants_sse(request: web.Request) -> bool:\n    accept = request.headers.get(\"\
    accept\", \"\").lower()\n    stream = request.query.get(\"stream\", \"\").lower()\n\
    \    return \"text/event-stream\" in accept or stream in {\"1\", \"true\", \"\
    sse\"}\n\n\ndef _sse_timeout_ms(request: web.Request, binding_timeout_ms: int)\
    \ -> int:\n    requested = request.query.get(\"timeoutMs\") or request.query.get(\"\
    timeout_ms\")\n    if requested:\n        try:\n            return max(1_000,\
    \ min(int(requested), SSE_MAX_TIMEOUT_MS))\n        except ValueError:\n     \
    \       pass\n    return max(int(binding_timeout_ms or 0), min(SSE_MAX_TIMEOUT_MS,\
    \ 900_000))\n\n\nasync def _sse_send(\n    response: web.StreamResponse,\n   \
    \ event_id: int,\n    event: str,\n    data: dict[str, Any],\n) -> None:\n   \
    \ payload = json.dumps(data, ensure_ascii=False, separators=(\",\", \":\"))\n\
    \    lines = [f\"id: {event_id}\", f\"event: {event}\"]\n    lines.extend(f\"\
    data: {line}\" for line in payload.splitlines() or [\"{}\"])\n    await response.write((\"\
    \\n\".join(lines) + \"\\n\\n\").encode(\"utf-8\"))\n\n\nasync def _dispatch_sse(\n\
    \    request: web.Request,\n    *,\n    nsid: str,\n    binding: dict[str, Any],\n\
    \    process_vars: dict[str, Any],\n    started: float,\n) -> web.StreamResponse:\n\
    \    timeout_ms = _sse_timeout_ms(request, binding[\"result_timeout_ms\"])\n \
    \   response = web.StreamResponse(\n        status=200,\n        headers={\n \
    \           \"Content-Type\": \"text/event-stream\",\n            \"Cache-Control\"\
    : \"no-cache, no-transform\",\n            \"X-Accel-Buffering\": \"no\",\n  \
    \      },\n    )\n    await response.prepare(request)\n\n    cli: ZeebeClient\
    \ = request.app[\"zeebe_client\"]\n    event_id = 1\n    await _sse_send(response,\
    \ event_id, \"started\", {\n        \"ok\": True,\n        \"nsid\": nsid,\n \
    \       \"bpmnProcessId\": binding[\"bpmn_process_id\"],\n        \"timeoutMs\"\
    : timeout_ms,\n    })\n    task = asyncio.create_task(\n        cli.run_process_with_result(\n\
    \            bpmn_process_id=binding[\"bpmn_process_id\"],\n            variables=process_vars,\n\
    \            timeout=timeout_ms,\n        )\n    )\n    deadline = time.monotonic()\
    \ + (timeout_ms / 1000.0) + 5\n    try:\n        while True:\n            remaining\
    \ = deadline - time.monotonic()\n            if remaining <= 0:\n            \
    \    task.cancel()\n                event_id += 1\n                await _sse_send(response,\
    \ event_id, \"error\", {\n                    \"error\": \"process timeout\",\n\
    \                    \"nsid\": nsid,\n                    \"bpmnProcessId\": binding[\"\
    bpmn_process_id\"],\n                    \"timeoutMs\": timeout_ms,\n        \
    \            \"latencyMs\": int((time.monotonic() - started) * 1000),\n      \
    \          })\n                break\n            try:\n                result\
    \ = await asyncio.wait_for(\n                    asyncio.shield(task),\n     \
    \               timeout=min(SSE_HEARTBEAT_SEC, remaining),\n                )\n\
    \                LOG.info(\n                    \"dispatch sse complete nsid=%s\
    \ instance=%s latencyMs=%d\",\n                    nsid,\n                   \
    \ result.process_instance_key,\n                    int((time.monotonic() - started)\
    \ * 1000),\n                )\n                event_id += 1\n               \
    \ await _sse_send(response, event_id, \"complete\", {\n                    \"\
    ok\": True,\n                    \"nsid\": nsid,\n                    \"bpmnProcessId\"\
    : binding[\"bpmn_process_id\"],\n                    \"instanceKey\": result.process_instance_key,\n\
    \                    \"variables\": result.variables or {},\n                \
    \    \"latencyMs\": int((time.monotonic() - started) * 1000),\n              \
    \  })\n                break\n            except asyncio.TimeoutError:\n     \
    \           event_id += 1\n                await _sse_send(response, event_id,\
    \ \"heartbeat\", {\n                    \"ok\": True,\n                    \"\
    nsid\": nsid,\n                    \"bpmnProcessId\": binding[\"bpmn_process_id\"\
    ],\n                    \"latencyMs\": int((time.monotonic() - started) * 1000),\n\
    \                })\n    except (ConnectionResetError, asyncio.CancelledError):\n\
    \        task.cancel()\n        LOG.info(\"dispatch sse client disconnected nsid=%s\"\
    , nsid)\n    except Exception as e:  # noqa: BLE001\n        task.cancel()\n \
    \       LOG.exception(\"dispatch sse failed nsid=%s\", nsid)\n        event_id\
    \ += 1\n        try:\n            await _sse_send(response, event_id, \"error\"\
    , {\n                \"error\": f\"{type(e).__name__}: {str(e)[:300]}\",\n   \
    \             \"nsid\": nsid,\n                \"bpmnProcessId\": binding[\"bpmn_process_id\"\
    ],\n            })\n        except Exception:\n            pass\n    finally:\n\
    \        if not task.done():\n            task.cancel()\n        try:\n      \
    \      await response.write_eof()\n        except Exception:\n            pass\n\
    \    return response\n\n\nasync def dispatch(request: web.Request) -> web.Response:\n\
    \    \"\"\"POST /xrpc/{nsid} \u2014 start a BPMN process and await result.\"\"\
    \"\n    nsid = request.match_info.get(\"nsid\", \"\")\n    LOG.info(\"dispatch\
    \ start method=%s nsid=%s\", request.method, nsid)\n    if not nsid:\n       \
    \ return web.json_response({\"error\": \"nsid required in path\"}, status=400)\n\
    \n    binding = await lookup_binding(nsid)\n    if not binding:\n        return\
    \ web.json_response(\n            {\"error\": \"no active binding\", \"nsid\"\
    : nsid}, status=404,\n        )\n    LOG.info(\n        \"dispatch binding nsid=%s\
    \ process=%s timeoutMs=%s\",\n        nsid,\n        binding[\"bpmn_process_id\"\
    ],\n        binding[\"result_timeout_ms\"],\n    )\n\n    # Parse body (POST)\
    \ or empty dict (GET / no body).\n    body: dict[str, Any] = {}\n    if request.body_exists\
    \ and request.method == \"POST\":\n        try:\n            body = await request.json()\n\
    \        except json.JSONDecodeError as e:\n            return web.json_response(\n\
    \                {\"error\": f\"invalid JSON body: {e}\"}, status=400,\n     \
    \       )\n        if not isinstance(body, dict):\n            return web.json_response(\n\
    \                {\"error\": \"body must be a JSON object\"}, status=400,\n  \
    \          )\n\n    timeout_ms = binding[\"result_timeout_ms\"]\n    started =\
    \ time.monotonic()\n    cli: ZeebeClient = request.app[\"zeebe_client\"]\n   \
    \ # Inject the resolved bpmn_process_id as a process variable so worker\n    #\
    \ tasks (e.g. generic.db.insert) can scope writes to the binding's\n    # write_table_allowlist.\
    \ Caller body cannot override this (we set\n    # last-write-wins after spread).\
    \ NSID is also injected for audit\n    # correlation; it's not used for enforcement.\n\
    \    process_vars = {\n        **(body or {}),\n        \"_bpmnProcessId\": binding[\"\
    bpmn_process_id\"],\n        \"_nsid\": nsid,\n    }\n    if _wants_sse(request)\
    \ and timeout_ms > 0:\n        return await _dispatch_sse(\n            request,\n\
    \            nsid=nsid,\n            binding=binding,\n            process_vars=process_vars,\n\
    \            started=started,\n        )\n    try:\n        if timeout_ms <= 0:\n\
    \            instance = await cli.run_process(\n                bpmn_process_id=binding[\"\
    bpmn_process_id\"],\n                variables=process_vars,\n            )\n\
    \            return web.json_response({\n                \"ok\": True,\n     \
    \           \"asyncStarted\": True,\n                \"nsid\": nsid,\n       \
    \         \"bpmnProcessId\": binding[\"bpmn_process_id\"],\n                \"\
    instanceKey\": int(instance.process_instance_key),\n                \"latencyMs\"\
    : int((time.monotonic() - started) * 1000),\n            })\n\n        result\
    \ = await asyncio.wait_for(\n            cli.run_process_with_result(\n      \
    \          bpmn_process_id=binding[\"bpmn_process_id\"],\n                variables=process_vars,\n\
    \                timeout=timeout_ms,\n            ),\n            timeout=(timeout_ms\
    \ / 1000.0) + 5,\n        )\n        LOG.info(\n            \"dispatch complete\
    \ nsid=%s instance=%s latencyMs=%d\",\n            nsid,\n            result.process_instance_key,\n\
    \            int((time.monotonic() - started) * 1000),\n        )\n        return\
    \ web.json_response({\n            \"ok\": True,\n            \"nsid\": nsid,\n\
    \            \"bpmnProcessId\": binding[\"bpmn_process_id\"],\n            \"\
    instanceKey\": result.process_instance_key,\n            \"variables\": result.variables\
    \ or {},\n            \"latencyMs\": int((time.monotonic() - started) * 1000),\n\
    \        })\n    except asyncio.TimeoutError:\n        return web.json_response(\n\
    \            {\"error\": \"process timeout\", \"nsid\": nsid,\n             \"\
    bpmnProcessId\": binding[\"bpmn_process_id\"],\n             \"timeoutMs\": timeout_ms},\n\
    \            status=504,\n        )\n    except Exception as e:  # noqa: BLE001\n\
    \        LOG.exception(\"dispatch failed nsid=%s\", nsid)\n        return web.json_response(\n\
    \            {\"error\": f\"{type(e).__name__}: {str(e)[:300]}\",\n          \
    \   \"nsid\": nsid,\n             \"bpmnProcessId\": binding[\"bpmn_process_id\"\
    ]},\n            status=500,\n        )\n\n\n# \u2500\u2500\u2500 F5: BPMN sync\
    \ watcher \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n#\n# Scan vertex_bpmn_process_def\
    \ for rows that haven't been deployed to\n# Zeebe yet (deployed_at IS NULL). For\
    \ each, push the XML to Zeebe via\n# deploy_resource and stamp the row so we don't\
    \ redeploy on the next\n# tick. Result: a new T1/T2 actor goes live with TWO SQL\
    \ INSERTs and\n# nothing else \u2014 no kubectl, no helm, no docker push.\n#\n\
    # Polling interval is generous (default 30s) because new-actor cadence\n# is human-scale.\
    \ For tighter SLAs we'd wire this to a RW Streaming\n# Sink instead.\n\nWATCHER_INTERVAL_SEC\
    \ = int(os.environ.get(\"WATCHER_INTERVAL_SEC\", \"30\"))\n\n\ndef _list_pending_defs_sync()\
    \ -> list[tuple]:\n    # Fetch vertex_id/bpmn_process_id/version only \u2014 omitting\
    \ the xml column\n    # avoids a full-scan / large materialization on Kotoba/Datomic\
    \ that hangs >30s\n    # when all 23K xml values are streamed at once. Xml is\
    \ fetched per-row in\n    # _fetch_xml_sync() immediately before deploy.\n   \
    \ with sync_cursor() as cur:\n        cur.execute(\n            \"SELECT vertex_id,\
    \ bpmn_process_id, version \"\n            \"FROM vertex_bpmn_process_def \"\n\
    \            \"WHERE deployed_at IS NULL \"\n            \"  AND COALESCE(status,\
    \ 'active') = 'active' \"\n            \"ORDER BY created_at ASC NULLS LAST \"\
    \n            \"LIMIT 100\",\n        )\n        return list(cur.fetchall() or\
    \ [])\n\n\ndef _fetch_xml_sync(vertex_id: str) -> str | None:\n    with sync_cursor()\
    \ as cur:\n        cur.execute(\n            \"SELECT xml FROM vertex_bpmn_process_def\
    \ WHERE vertex_id = %s LIMIT 1\",\n            (vertex_id,),\n        )\n    \
    \    row = cur.fetchone()\n        return row[0] if row else None\n\n\ndef _mark_deployed_sync(vertex_id:\
    \ str, zeebe_key: int) -> int:\n    with sync_cursor() as cur:\n        cur.execute(\n\
    \            \"UPDATE vertex_bpmn_process_def \"\n            \"SET deployed_at\
    \ = to_char(now(),'YYYY-MM-DD\\\"T\\\"HH24:MI:SS\\\"Z\\\"'), \"\n            \"\
    \    deployed_zeebe_key = %s, \"\n            \"    status = 'active' \"\n   \
    \         \"WHERE vertex_id = %s\",\n            (int(zeebe_key), vertex_id),\n\
    \        )\n        return cur.rowcount\n\n\ndef _mark_invalid_sync(vertex_id:\
    \ str) -> int:\n    \"\"\"Mark a BPMN row inactive after a permanent Zeebe validation\
    \ failure.\n\n    ProcessInvalidError means Zeebe rejected the XML as structurally\
    \ invalid.\n    Retrying will never succeed, so we park the row as inactive to\
    \ stop the\n    watcher loop from spamming errors every 30 seconds.\n    \"\"\"\
    \n    with sync_cursor() as cur:\n        cur.execute(\n            \"UPDATE vertex_bpmn_process_def\
    \ SET status = 'inactive' \"\n            \"WHERE vertex_id = %s AND status IN\
    \ ('active', 'deploying-bulk')\",\n            (vertex_id,),\n        )\n    \
    \    return cur.rowcount\n\n\n_DMN_NS = \"https://www.omg.org/spec/DMN/\"\n\n\n\
    # \u2500\u2500\u2500 Deploy-time write_table_allowlist enforcement (2026-04-25)\
    \ \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n#\n# Worker-side\
    \ enforcement was reverted because injecting a synthetic\n# `_bpmnProcessId` variable\
    \ through every BPMN's ioMapping required\n# regenerating ~100 BPMN files. We\
    \ instead validate at deploy time:\n# parse the BPMN xml here in the F5 watcher,\
    \ extract the literal `table`\n# constants used by `generic.db.insert` ServiceTasks,\
    \ and refuse to\n# deploy if any literal lies outside the binding's declared allowlist.\n\
    #\n# Caller body cannot influence this check (the table values are constants\n\
    # encoded in the BPMN xml itself), so deploy-time is the right boundary:\n# anyone\
    \ who can publish a BPMN must declare its write footprint up front.\n\n# Match\
    \ the FEEL string-literal forms our generators emit, e.g.:\n#     <zeebe:input\
    \ source=\"=&quot;vertex_open_defence_event&quot;\" target=\"table\"/>\n# or unescaped\
    \ equivalents. Liberal \u2014 extracts every `target=\"table\"`\n# input regardless\
    \ of source-literal style.\n_TABLE_INPUT_RE = re.compile(\n    r\"<zeebe:input\\\
    s+source=\\\"=(?:&quot;|\\\")(?P<table>[a-z][a-z0-9_]*)(?:&quot;|\\\")\\s+target=\\\
    \"table\\\"\\s*/>\",\n    re.IGNORECASE,\n)\n\n\ndef _binding_write_allowlist_sync(bpmn_process_id:\
    \ str) -> set[str] | None:\n    \"\"\"Returns the binding's `write_table_allowlist`\
    \ as a set, or None\n    when the binding is unrestricted (NULL column / pre-migration\
    \ row).\n    Empty set = explicit deny-all (handler must reject any write).\"\"\
    \"\n    if not bpmn_process_id:\n        return None\n    try:\n        with sync_cursor()\
    \ as cur:\n            cur.execute(\n                \"SELECT write_table_allowlist\
    \ \"\n                \"FROM vertex_bpmn_lexicon_binding \"\n                \"\
    WHERE bpmn_process_id = %s LIMIT 1\",\n                (bpmn_process_id,),\n \
    \           )\n            row = cur.fetchone()\n    except Exception:  # noqa:\
    \ BLE001  \u2014 column may not exist on old DB\n        return None\n    if not\
    \ row or row[0] is None:\n        return None\n    csv = (row[0] or \"\").strip()\n\
    \    if not csv:\n        return set()\n    return {t.strip() for t in csv.split(\"\
    ,\") if t.strip()}\n\n\ndef _xml_db_insert_tables(xml: str) -> set[str]:\n   \
    \ \"\"\"Return the set of literal `table` values targeted by\n    `generic.db.insert`\
    \ ServiceTasks in the BPMN xml. Non-literal sources\n    (FEEL expression referencing\
    \ a variable) are intentionally not\n    captured \u2014 they cannot be statically\
    \ scoped, and a binding that\n    relies on caller-provided table names should\
    \ not be allow-listed.\"\"\"\n    return set(m.group(\"table\") for m in _TABLE_INPUT_RE.finditer(xml))\n\
    \n\ndef _validate_deploy_scope(bpmn_process_id: str, xml: str) -> str | None:\n\
    \    \"\"\"Return an error string if the BPMN writes to tables outside the\n \
    \   binding's declared allowlist; None if allowed (or unrestricted).\n    The\
    \ watcher uses this to refuse Zeebe deploy.\"\"\"\n    allow = _binding_write_allowlist_sync(bpmn_process_id)\n\
    \    if allow is None:\n        return None  # legacy / unrestricted binding\n\
    \    referenced = _xml_db_insert_tables(xml)\n    if not referenced:\n       \
    \ return None  # no db.insert ServiceTask, nothing to check\n    if not allow:\n\
    \        return (\n            f\"binding {bpmn_process_id} has empty write_table_allowlist\
    \ \"\n            f\"but BPMN xml references tables: {sorted(referenced)}\"\n\
    \        )\n    bad = referenced - allow\n    if bad:\n        return (\n    \
    \        f\"BPMN xml writes to {sorted(bad)} which is outside \"\n           \
    \ f\"binding write_table_allowlist {sorted(allow)} for \"\n            f\"bpmn_process_id={bpmn_process_id!r}\"\
    \n        )\n    return None\n\n\n\ndef _detect_resource_kind(xml: str) -> str:\n\
    \    \"\"\"Inspect XML root namespace to decide bpmn vs dmn deploy.\n    Returns\
    \ 'dmn' if the document declares a DMN namespace; defaults to\n    'bpmn' otherwise\
    \ (back-compat \u2014 existing rows have no marker).\"\"\"\n    head = xml[:512]\n\
    \    if _DMN_NS in head:\n        return \"dmn\"\n    return \"bpmn\"\n\n\nasync\
    \ def watcher_loop(zeebe: ZeebeClient) -> None:\n    \"\"\"Background task: polls\
    \ process_def, deploys pending rows to Zeebe.\n\n    Supports both BPMN and DMN.\
    \ The same `vertex_bpmn_process_def` table\n    holds DMN decisions too \u2014\
    \ they're distinguished by XML namespace at\n    deploy time. For DMN rows the\
    \ `bpmn_process_id` column actually holds\n    the decisionId (DMN has no process\
    \ concept).\n\n    _deployed_in_flight guards against the Kotoba/Datomic DML buffering\
    \ window\n    (~150s at checkpoint_frequency=30 \xD7 barrier_interval_ms=5000).\
    \ After\n    _mark_deployed_sync succeeds, the UPDATE is accepted but invisible\
    \ to\n    subsequent _list_pending_defs_sync queries until the checkpoint flush.\n\
    \    The in-flight set prevents the watcher from re-deploying the same row\n \
    \   on the next tick. Entries are never evicted \u2014 deployed rows stay\n  \
    \  deployed, and a forced re-deploy requires a pod restart.\n    \"\"\"\n    _deployed_in_flight:\
    \ set[str] = set()\n    LOG.info(\"bpmn watcher started, interval=%ds\", WATCHER_INTERVAL_SEC)\n\
    \    while True:\n        try:\n            pending = await asyncio.to_thread(_list_pending_defs_sync)\n\
    \            for vertex_id, bpmn_process_id, version in pending:\n           \
    \     if vertex_id in _deployed_in_flight:\n                    LOG.debug(\n \
    \                       \"skip in-flight vertex_id=%s (rw checkpoint pending)\"\
    ,\n                        vertex_id,\n                    )\n               \
    \     continue\n                xml = await asyncio.to_thread(_fetch_xml_sync,\
    \ vertex_id)\n                if not xml:\n                    LOG.warning(\"\
    skip empty xml for vertex_id=%s\", vertex_id)\n                    continue\n\
    \                # Deploy-time write_table_allowlist gate. If the BPMN xml's\n\
    \                # generic.db.insert task targets a table outside the\n      \
    \          # binding's declared allowlist, refuse the deploy and log.\n      \
    \          # The row stays deployed_at IS NULL so the operator can\n         \
    \       # fix the binding (or the BPMN) and the next watcher tick\n          \
    \      # picks it up. We do NOT auto-mark deployed for poisoned\n            \
    \    # rows \u2014 visible drift is preferable to silent admit.\n            \
    \    scope_err = await asyncio.to_thread(\n                    _validate_deploy_scope,\
    \ bpmn_process_id, xml,\n                )\n                if scope_err:\n  \
    \                  LOG.error(\n                        \"deploy refused for vertex_id=%s\
    \ id=%s: %s\",\n                        vertex_id, bpmn_process_id, scope_err,\n\
    \                    )\n                    continue\n                kind = _detect_resource_kind(xml)\n\
    \                suffix = \".dmn\" if kind == \"dmn\" else \".bpmn\"\n       \
    \         # pyzeebe wants a file path; write to a transient tempfile.\n      \
    \          # The file extension is what tells Zeebe whether the\n            \
    \    # payload is BPMN or DMN \u2014 both ride the same gRPC\n               \
    \ # DeployResource endpoint.\n                import tempfile\n              \
    \  with tempfile.NamedTemporaryFile(\n                    mode=\"w\", suffix=suffix,\
    \ delete=False, encoding=\"utf-8\",\n                ) as f:\n               \
    \     f.write(xml)\n                    tmp_path = f.name\n                try:\n\
    \                    res = await zeebe.deploy_resource(tmp_path)\n           \
    \         key = 0\n                    if kind == \"bpmn\":\n                \
    \        for d in res.deployments:\n                            # Match the row's\
    \ bpmn_process_id; use that key.\n                            if getattr(d, \"\
    bpmn_process_id\", \"\") == bpmn_process_id:\n                               \
    \ key = int(d.process_definition_key)\n                                break\n\
    \                        if key == 0 and res.deployments:\n                  \
    \          key = int(res.deployments[0].process_definition_key)\n            \
    \        else:\n                        # DMN deployments expose decision_definition_key\
    \ /\n                        # decision_requirements_key. We grab the first\n\
    \                        # decision key as the \"deployed key\" marker.\n    \
    \                    for d in res.deployments:\n                            if\
    \ getattr(d, \"dmn_decision_id\", \"\") == bpmn_process_id:\n                \
    \                key = int(getattr(d, \"dmn_decision_key\", 0)\n             \
    \                             or getattr(d, \"decision_key\", 0))\n          \
    \                      break\n                        if key == 0 and res.deployments:\n\
    \                            d0 = res.deployments[0]\n                       \
    \     key = int(getattr(d0, \"dmn_decision_key\", 0)\n                       \
    \               or getattr(d0, \"decision_key\", 0)\n                        \
    \              or getattr(d0, \"decision_requirements_key\", 0)\n            \
    \                          or 0)\n                    updated = await asyncio.to_thread(\n\
    \                        _mark_deployed_sync, vertex_id, key,\n              \
    \      )\n                    _deployed_in_flight.add(vertex_id)\n           \
    \         LOG.info(\n                        \"deployed kind=%s id=%s v%s key=%s\
    \ (rows updated=%d)\",\n                        kind, bpmn_process_id, version,\
    \ key, updated,\n                    )\n                except ProcessInvalidError\
    \ as e:\n                    LOG.error(\n                        \"deploy permanently\
    \ invalid vertex_id=%s kind=%s id=%s \u2014 marking inactive: %s\",\n        \
    \                vertex_id, kind, bpmn_process_id, e,\n                    )\n\
    \                    _deployed_in_flight.add(vertex_id)\n                    await\
    \ asyncio.to_thread(_mark_invalid_sync, vertex_id)\n                except Exception\
    \ as e:  # noqa: BLE001\n                    LOG.exception(\n                \
    \        \"deploy failed for vertex_id=%s kind=%s id=%s: %s\",\n             \
    \           vertex_id, kind, bpmn_process_id, e,\n                    )\n    \
    \            finally:\n                    try:\n                        os.unlink(tmp_path)\n\
    \                    except Exception:\n                        pass\n       \
    \ except Exception:  # noqa: BLE001\n            LOG.exception(\"watcher tick\
    \ failed; will retry\")\n        await asyncio.sleep(WATCHER_INTERVAL_SEC)\n\n\
    \n# \u2500\u2500\u2500 Auth middleware \u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n@web.middleware\nasync def auth_middleware(request:\
    \ web.Request, handler):\n    \"\"\"Gate `/xrpc/*` on shared-secret header when\
    \ strict mode enabled.\n\n    `/health` is always open. `/bindings` is gated because\
    \ it enumerates\n    the live NSID \u2192 BPMN process surface.\n    Unknown `DISPATCHER_AUTH_MODE`\
    \ fails closed to avoid mis-configuration\n    silently dropping the gate.\n \
    \   \"\"\"\n    if request.path == \"/health\":\n        return await handler(request)\n\
    \    if not (request.path.startswith(\"/xrpc/\") or request.path == \"/bindings\"\
    ):\n        return await handler(request)\n    if AUTH_MODE == \"off\":\n    \
    \    return await handler(request)\n    if AUTH_MODE == \"strict\":\n        if\
    \ not INTERNAL_SECRET:\n            LOG.error(\"DISPATCHER_AUTH_MODE=strict but\
    \ DISPATCHER_INTERNAL_SECRET empty\")\n            return web.json_response(\n\ # no-server-key: read-only
    \                {\"error\": \"AuthMisconfigured\",\n                 \"message\"\
    : \"dispatcher strict mode requires DISPATCHER_INTERNAL_SECRET\"},\n         \ # no-server-key: read-only
    \       status=500,\n            )\n        import hmac as _hmac\n        provided\
    \ = request.headers.get(INTERNAL_TRUST_HEADER, \"\")\n        if not provided\
    \ or not _hmac.compare_digest(provided, INTERNAL_SECRET):\n            return\
    \ web.json_response(\n                {\"error\": \"Unauthorized\",\n        \
    \         \"message\": f\"missing or invalid {INTERNAL_TRUST_HEADER} header\"\
    },\n                status=401,\n            )\n        return await handler(request)\n\
    \    LOG.error(\"unknown DISPATCHER_AUTH_MODE=%r (expected off|strict)\", AUTH_MODE)\n\
    \    return web.json_response(\n        {\"error\": \"AuthMisconfigured\",\n \
    \        \"message\": f\"unknown DISPATCHER_AUTH_MODE={AUTH_MODE!r}\"},\n    \
    \    status=500,\n    )\n\n\n# \u2500\u2500\u2500 App bootstrap \u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \n\nasync def make_app() -> web.Application:\n    app = web.Application(middlewares=[auth_middleware])\n\
    \    channel = create_insecure_channel(grpc_address=GATEWAY)\n    zeebe = ZeebeClient(channel)\n\
    \    app[\"zeebe_client\"] = zeebe\n    app.router.add_get(\"/health\", health)\n\
    \    app.router.add_get(\"/bindings\", list_bindings)\n    app.router.add_post(\"\
    /xrpc/{nsid}\", dispatch)\n    app.router.add_get(\"/xrpc/{nsid}\", dispatch)\n\
    \n    # user_task_sink: POST /zeebe/complete-user-task + background activation\
    \ loop.\n    register_user_task_routes(app)\n\n    async def _start_background(_app:\
    \ web.Application) -> None:\n        _app[\"watcher_task\"] = asyncio.create_task(watcher_loop(zeebe))\n\
    \        _app[\"user_task_sink_task\"] = asyncio.create_task(run_user_task_sink_loop())\n\
    \n    async def _stop_background(_app: web.Application) -> None:\n        for\
    \ key in (\"watcher_task\", \"user_task_sink_task\"):\n            t = _app.get(key)\n\
    \            if t:\n                t.cancel()\n                try:\n       \
    \             await t\n                except (asyncio.CancelledError, Exception):\n\
    \                    pass\n\n    app.on_startup.append(_start_background)\n  \
    \  app.on_cleanup.append(_stop_background)\n\n    LOG.info(\"dispatcher ready,\
    \ gateway=%s, port=%d, binding_ttl=%ds\",\n             GATEWAY, PORT, BINDING_TTL_SEC)\n\
    \    return app\n\n\ndef main() -> None:\n    if not os.environ.get(\"RW_URL\"\
    ):\n        LOG.warning(\"RW_URL not set \u2014 binding lookup will fail\")\n\
    \    web.run_app(make_app(), host=\"0.0.0.0\", port=PORT, access_log=None)\n\n\
    \nif __name__ == \"__main__\":\n    main()\n"
