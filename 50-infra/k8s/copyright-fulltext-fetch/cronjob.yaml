---
# no-server-key: read-only — pending Stage A-E member-signed-writes refactor per ADR-2605231525
apiVersion: batch/v1
kind: CronJob
metadata:
  name: copyright-fulltext-fetch
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: copyright-fulltext-fetch
    app.kubernetes.io/component: ingester
    app.kubernetes.io/part-of: copyright.etzhayyim.com
spec:
  # RETIRED 2026-07-17: RW_URL residue from the 2026-05-17 gftdcojp org split.
  # RisingWave was org-wide retired 2026-06-11 (ADR-2606120900/2606120930).
  # Suspended — see ADR-2605191648 addendum 2026-07-17.
  suspend: true
  schedule: "0 */6 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: copyright-fulltext-fetch
        spec:
          restartPolicy: Never
          tolerations:
            - key: workload
              operator: Equal
              value: osm-ingest
              effect: NoSchedule
          imagePullSecrets:
            - name: ghcr-creds
          containers:
            - name: fulltext
              image: ghcr.io/etzhayyim/kotodama:0.3.96-20260508104813-amd64
              imagePullPolicy: IfNotPresent
              command: ["python", "-c"]
              args:
                - |
                  from kotodama.langgraph_graphs.copyright_fulltext import build_graph
                  g = build_graph()
                  r = g.invoke({"batchSize": 50})
                  print("worksQueried:", r.get("worksQueried"))
                  print("blobsStored:", r.get("blobsStored"))
                  print("blobsFailed:", r.get("blobsFailed"))
                  print("ok:", r.get("ok"))
                  print("error:", r.get("error"))
              env:
                - name: RW_URL
                  value: "REDACTED_USE_DATABASE_URL_ENV"
                - name: RW_DDL_GUARD
                  value: "1"
                - name: RW_ALLOW_FLUSH
                  value: "0"
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
