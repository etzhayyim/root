# maps-tilemaker-build — one-shot K8s Job.
#
# Triggered manually (or by a parallel maps-osm-ingest completion hook) after a
# fresh planet / regional PBF is available. Not a CronJob — tilemaker runs
# are expensive and must be scheduled explicitly on a high-memory node pool.
#
# Node selector assumes a Linode LKE pool labelled with node-class=highmem
# (e.g. g7-highmem-16 = 16 vCPU / 128 Gi; adjust for extract vs planet).
#
# Resource profiles:
#   Japan extract  (~2 GB PBF):     cpu 8  / memory 16 Gi / scratch 80 Gi  / ~1 h
#   Europe extract (~30 GB PBF):    cpu 12 / memory 48 Gi / scratch 160 Gi / ~4 h
#   Planet         (~80 GB PBF):    cpu 16 / memory 96 Gi / scratch 300 Gi / ~12 h
#
# Bump resources.requests/limits before `kubectl apply` for planet builds.

apiVersion: batch/v1
kind: Job
metadata:
  name: maps-tilemaker-build
  namespace: maps
  labels:
    app.kubernetes.io/name: maps-tilemaker-build
    app.kubernetes.io/part-of: etzhayyim-project-maps
    app.kubernetes.io/component: tile-generation
spec:
  backoffLimit: 1
  # 24 h wall-clock ceiling — planet runs routinely approach 12 h; give headroom.
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 604800   # keep logs 7 d for postmortem
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maps-tilemaker-build
    spec:
      restartPolicy: Never
      nodeSelector:
        node-class: highmem
      tolerations:
        - key: dedicated
          operator: Equal
          value: tilemaker
          effect: NoSchedule
      containers:
        - name: tilemaker
          image: ghcr.io/etzhayyim/maps-tilemaker-build:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PBF_URL
              value: "https://download.geofabrik.de/asia/japan-latest.osm.pbf"
            - name: R2_BUCKET
              value: "etzhayyim-maps-tiles"
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: etzhayyim-r2-credentials
                  key: account_id
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: etzhayyim-r2-credentials
                  key: access_key_id
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: etzhayyim-r2-credentials
                  key: secret_access_key
            - name: TILEMAKER_CONFIG
              value: "/config/openmaptiles.json"
            - name: TILEMAKER_PROCESS
              value: "/config/openmaptiles.lua"
            - name: CONFIG_FETCH_AT_RUNTIME
              value: "1"
            # Override per-region: Japan bbox ≈ 122,24,146,46. Remove for planet.
            # - name: TILEMAKER_EXTRA
            #   value: "--bbox 122,24,146,46"
          resources:
            requests:
              cpu: "8"
              memory: "16Gi"
              ephemeral-storage: "80Gi"
            limits:
              cpu: "16"
              memory: "96Gi"
              ephemeral-storage: "300Gi"
          volumeMounts:
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 300Gi
