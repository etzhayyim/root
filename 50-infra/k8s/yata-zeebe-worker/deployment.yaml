apiVersion: apps/v1
kind: Deployment
metadata:
  name: yata-zeebe-worker
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: yata-zeebe-worker
    app.kubernetes.io/component: bpmn-worker
    app.kubernetes.io/part-of: yatabase
spec:
  # RETIRED 2026-07-17: RW_URL residue from the 2026-05-17 gftdcojp org split.
  # RisingWave was org-wide retired 2026-06-11 (ADR-2606120900/2606120930).
  # Scaled to 0 — see ADR-2605191648 addendum 2026-07-17.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: yata-zeebe-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yata-zeebe-worker
        app.kubernetes.io/component: bpmn-worker
        app.kubernetes.io/part-of: yatabase
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: worker
          image: "ghcr.io/etzhayyim/kotodama:yata-profile-468c6cbc0906-amd64"
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "kotodama.zeebe_worker_main"]
          env:
            - name: ZEEBE_WORKER_PROFILE
              value: "yata"
            - name: ZEEBE_GATEWAY
              value: "zeebe-gateway.mitama-udf.svc:26500"
            - name: ZEEBE_TIMEOUT_SEC
              value: "300"
            - name: RW_URL
              valueFrom:
                secretKeyRef:
                  name: mitama-udf-pool-rw
                  key: RW_URL
            - name: RW_PSQL_TIMEOUT_SEC
              value: "30"
            - name: RW_SYNC_POOL
              value: "0"
            - name: RW_DDL_GUARD
              value: "1"
            # Tenant schema/table provisioning is a legitimate operational
            # DDL surface for yatabase BaaS (ADR-2605080000 §D8 schema
            # variant). Unlike hot-path UDF workers, yata workers are the
            # CORRECT place for `CREATE SCHEMA` / `CREATE TABLE IF NOT EXISTS`
            # against per-tenant `yata_<sha256(did)[:16]>` namespaces.
            - name: RW_ALLOW_HEAVY_DDL
              value: "1"
            - name: RW_ALLOW_FLUSH
              value: "0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -d /proc/1"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -d /proc/1"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
