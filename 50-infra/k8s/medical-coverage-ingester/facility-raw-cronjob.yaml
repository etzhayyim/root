---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: medical-facility-raw-archiver
  namespace: risingwave
  labels:
    app.kubernetes.io/name: medical-facility-raw-archiver
    app.kubernetes.io/component: source-archiver
    app.kubernetes.io/part-of: iryo.etzhayyim.com
spec:
  schedule: "*/5 * * * *"
  timeZone: "Etc/UTC"
  # 2026-04-30: hold during RisingWave no-license recovery. The raw B2 archiver
  # runs every 5 minutes and was correlated with B2 SlowDown bursts while RW
  # compute had a cold disk cache.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: medical-facility-raw-archiver
        spec:
          serviceAccountName: medical-coverage-ingester
          imagePullSecrets:
            - name: ghcr-pull
          restartPolicy: Never
          containers:
            - name: archiver
              image: ghcr.io/etzhayyim/medical-coverage-ingester:latest
              imagePullPolicy: Always
              env:
                - name: FACILITY_RAW_ONLY
                  value: "true"
                - name: TARGETS
                  value: "facilities_csv"
                - name: MAX_RECORDS_PER_RUN
                  value: "5000"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: B2_BUCKET
                  value: "etzhayyim-nats"
                - name: B2_ENDPOINT
                  value: "https://s3.us-west-004.backblazeb2.com"
                - name: B2_REGION
                  value: "us-west-004"
                - name: B2_PREFIX
                  value: "medical-sources/iryo-shisetsu"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
