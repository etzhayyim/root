---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: medical-facility-b2-replayer-100
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: medical-facility-b2-replayer-100
    app.kubernetes.io/component: b2-replayer
    app.kubernetes.io/part-of: iryo.etzhayyim.com
spec:
  schedule: "*/5 * * * *"
  timeZone: "Etc/UTC"
  # Suspended by default under ADR-2604261900 path topology. This is a
  # backfill path, not a hot-write path; resume only after RW object-store logs
  # are clean and the DDL/backfill gate passes.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: medical-facility-b2-replayer-100
        spec:
          serviceAccountName: medical-coverage-ingester
          imagePullSecrets:
            - name: ghcr-pull
          restartPolicy: Never
          containers:
            - name: replayer
              image: ghcr.io/etzhayyim/medical-coverage-ingester:latest
              imagePullPolicy: Always
              env:
                - name: FACILITY_REPLAY_FROM_B2
                  value: "true"
                - name: TARGETS
                  value: "facilities_csv"
                - name: MAX_RECORDS_PER_RUN
                  value: "100"
                - name: BATCH_SIZE
                  value: "20"
                - name: KOTOBA_URL
                  valueFrom:
                    secretKeyRef:
                      name: medical-coverage-ingester-secrets
                      key: KOTOBA_URL
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: B2_BUCKET
                  value: "etzhayyim-nats"
                - name: B2_ENDPOINT
                  value: "https://s3.us-west-004.backblazeb2.com"
                - name: B2_REGION
                  value: "us-west-004"
                - name: B2_PREFIX
                  value: "medical-sources/iryo-shisetsu"
                - name: RW_IMPLICIT_FLUSH
                  value: "false"
                - name: RW_SKIP_DELETE_BEFORE_INSERT
                  value: "true"
                - name: FACILITY_REPLAY_SKIP_COVERAGE
                  value: "true"
                - name: FACILITY_REPLAY_LEASE_TTL_SECONDS
                  value: "900"
                - name: RW_HEALTH_GATE
                  value: "true"
                - name: RW_MIN_COMPUTE_READY
                  value: "2"
                - name: RW_MIN_COMPUTE_AGE_SECONDS
                  value: "1800"
                - name: RW_COLD_START_POLICY
                  value: "degraded-write"
                - name: RW_DML_RATE_LIMIT
                  value: "5"
                - name: RW_DEGRADED_DML_RATE_LIMIT
                  value: "1"
                - name: RW_STATEMENT_TIMEOUT_SECONDS
                  value: "180"
                - name: RW_SLOWDOWN_WINDOW_SECONDS
                  value: "60"
                - name: RW_SLOWDOWN_MAX
                  value: "1"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "500m"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
