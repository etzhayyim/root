# lg-karute — LangServer pod for the karute Pregel.
#
# Serves the 31-pipeline StateGraph defined at
#   kotodama.projects.karute.pregel:app
# over the LangGraph CLI HTTP runtime (/invoke /batch /stream).
#
# Authoritative:
#   ADR-2605231100 — karute EMR Phase 1
#   ADR-2605231400 — consent capability + iryo billing bridge
#   ADR-2605231603 — per-record rekey + tombstone protocol
#   ADR-2605231700 — audit webhook subsystem
#   ADR-2605231900 — karute deployment topology (this manifest)
#   ADR-2605181100 — encrypted records + Signal keywrap (PHI mandatory)
#   ADR-2605171800 — LangGraph → MstCheckpointSaver → MST → IPFS → L2 anchor
#   ADR-2605180900 — langserver four-call-surface pattern
#
# Pre-requisites:
#   - ghcr.io/etzhayyim/lg-karute image built with kotodama.projects.karute
#   - ghcr.io/etzhayyim/etzhayyim-sdk-checkpointer image
#   - Namespace `mitama-udf` exists (shared with other lg-* pods)
#   - StorageClass with Retain reclaim policy is the cluster default,
#     or override below by setting storageClassName
#
# Pod topology (2-container sidecar, ADR-2605171800 §Stage 1-2):
#
#   ┌───────────────────────────────────────────────────────────────┐
#   │  Pod                                                          │
#   │  ┌──────────────────────┐  /run/etzhayyim/  ┌──────────────┐  │
#   │  │ server (Python)      │◄── checkpointer ─►│ checkpointer │  │
#   │  │ lg-karute            │      .sock        │ (TS, Node)   │  │
#   │  │ MstCheckpointSaver   │   (emptyDir)      │ @etz/sdk     │  │
#   │  └──────────────────────┘                   └──────────────┘  │
#   │                                                     │         │
#   │                       /var/etzhayyim/               │         │
#   │                       checkpointer-state ◄──────────┘         │
#   │                       (PVC, ReadWriteOnce, Retain)            │
#   └───────────────────────────────────────────────────────────────┘
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lg-karute
  namespace: mitama-udf
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lg-karute-checkpointer-state
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: lg-karute
    app.kubernetes.io/part-of: karute.etzhayyim.com
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 16Gi  # PHI envelope queue tends to be busier than uhl-right-neural.
  # storageClassName omitted on purpose — picks up the cluster default.
  # Per ADR-2605181100 the underlying PV reclaim policy MUST be Retain so a
  # `kubectl delete` cannot cascade into key + ciphertext loss.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lg-karute
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: lg-karute
    app.kubernetes.io/component: langgraph-server
    app.kubernetes.io/part-of: karute.etzhayyim.com
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lg-karute
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lg-karute
        app.kubernetes.io/part-of: karute.etzhayyim.com
    spec:
      serviceAccountName: lg-karute
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/etzhayyim/lg-karute:main
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "8080"
            - name: PYTHONUNBUFFERED
              value: "1"
            # Checkpointer wiring (ADR-2605171800 + ADR-2605181100).
            # The Pregel module auto-attaches MstCheckpointSaver when
            # MST_CHECKPOINT_SOCKET is set. PHI sealing is enforced by
            # the sidecar via ETZ_CHECKPOINTER_ENCRYPT_CELLS.
            - name: MST_CHECKPOINT_SOCKET
              value: "/run/etzhayyim/checkpointer.sock"
            - name: MST_CHECKPOINT_CELL_DID
              value: "did:web:karute.etzhayyim.com"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ok
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ok
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: checkpointer-socket
              mountPath: /run/etzhayyim
        - name: checkpointer
          # TS sidecar — ADR-2605171800 Stage 2. Owns MST / IPFS / L2.
          image: ghcr.io/etzhayyim/etzhayyim-sdk-checkpointer:main
          imagePullPolicy: Always
          env:
            - name: ETZ_CHECKPOINTER_SOCKET
              value: "/run/etzhayyim/checkpointer.sock"
            - name: ETZ_CHECKPOINTER_STATE_DIR
              value: "/var/etzhayyim/checkpointer-state"
            - name: ETZ_CHECKPOINTER_ALLOWED_DIDS
              value: "did:web:karute.etzhayyim.com"
            - name: ETZ_CHECKPOINTER_ENCRYPT_CELLS
              # ADR-2605181100 hard rule. EVERY karute payload is PHI;
              # the sidecar AEAD-seals every record with a per-cell
              # XChaCha20-Poly1305 key (lazy-generated, persisted at
              # <stateDir>/keys/) before MST projection. Stages 3-4 only
              # ever address ciphertext.
              value: "did:web:karute.etzhayyim.com"
            - name: ETZ_IPFS_API_URL
              # Stage 3 (IPFS pin) — kubo HTTP API on the simeon node.
              value: "http://simeonnomac-mini.local:5001"
            # Stage 4 (Base L2 anchor) — wired in once the EtzhayyimAnchor
            # contract address lands in deps.toml [platform.l2.anchor_contract].
            # - name: ETZ_ANCHOR_CHAIN_ID
            #   value: "84532"  # Base sepolia
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('fs').statSync(process.env.ETZ_CHECKPOINTER_SOCKET)"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('fs').statSync(process.env.ETZ_CHECKPOINTER_SOCKET)"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: checkpointer-socket
              mountPath: /run/etzhayyim
            - name: checkpointer-state
              mountPath: /var/etzhayyim/checkpointer-state
            - name: tmp-sidecar
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp-sidecar
          emptyDir:
            sizeLimit: 64Mi
        - name: checkpointer-socket
          emptyDir:
            sizeLimit: 1Mi
        - name: checkpointer-state
          persistentVolumeClaim:
            claimName: lg-karute-checkpointer-state
---
apiVersion: v1
kind: Service
metadata:
  name: lg-karute
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: lg-karute
    app.kubernetes.io/part-of: karute.etzhayyim.com
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lg-karute
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
