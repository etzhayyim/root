# no-server-key: read-only — pending Stage A-E member-signed-writes refactor per ADR-2605231525
# atproto PDS pod (ADR-2605111300)
# Bun container + cloudflared sidecar. Public ingress = CF Tunnel → atproto.etzhayyim.com.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atproto-pds
  namespace: atproto
  labels:
    app: atproto-pds
    adr: "2605111300"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: atproto-pds
  template:
    metadata:
      labels:
        app: atproto-pds
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        # ── Main: Bun runtime ──────────────────────────────────────────────
        - name: pds
          image: ghcr.io/etzhayyim/atproto-pds:bun-canary  # bumped per CI tag
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: PORT
              value: "8787"
            - name: RISINGWAVE_URL
              valueFrom: { secretKeyRef: { name: atproto-pds-secrets, key: RISINGWAVE_URL } }
            - name: AUTH_SERVICE_URL
              value: "https://auth.etzhayyim.com"
            - name: PLC_DIRECTORY_URL
              value: "https://plc.etzhayyim.com"
            - name: VAULT_SERVICE_URL
              value: "https://vault.etzhayyim.com"
            - name: APPVIEW_SERVICE_URL
              value: "https://bsky.etzhayyim.com"
            - name: ROUTING_GATEWAY_URL
              value: "https://gateway.etzhayyim.com"
            - name: GRAPH_QUERY_SERVICE_URL
              value: "https://graph.etzhayyim.com"  # TODO: ClusterIP once graph pod moved
            - name: BPMN_DISPATCHER_URL
              value: "http://bpmn-dispatcher.mitama-udf.svc.cluster.local:8080"
            - name: IPFS_API_URL
              value: "https://ipfs.etzhayyim.com"
            - name: LLM_GATEWAY_URL
              value: "https://llm.etzhayyim.com"
            - name: B2_KEY_ID
              valueFrom: { secretKeyRef: { name: atproto-pds-secrets, key: B2_KEY_ID } }
            - name: B2_APPLICATION_KEY
              valueFrom: { secretKeyRef: { name: atproto-pds-secrets, key: B2_APPLICATION_KEY } }
            - name: B2_BUCKET
              value: "etzhayyim-cache"
            - name: SS_REPO_SIGNING_KEK
              valueFrom: { secretKeyRef: { name: atproto-pds-secrets, key: SS_REPO_SIGNING_KEK } }
            - name: SS_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: atproto-pds-secrets, key: SS_SIGNING_KEY } }
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /_app/meta, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /_app/meta, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
        # ── Sidecar: cloudflared tunnel ────────────────────────────────────
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: atproto-pds-tunnel-token, key: token } }
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
      restartPolicy: Always
