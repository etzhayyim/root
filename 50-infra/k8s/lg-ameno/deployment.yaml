# lg-ameno — LangServer pod for the Path-B ameno agent loop.
#
# Hosts kotodama.projects.ameno (Python LangGraph + FastAPI) — same
# StateGraph as the browser appview (reflection + active inference
# lexical + ReAct tools) but server-side via Ollama.
#
# Authoritative ADRs:
#   ADR-2605191257 — Path B Python port
#   ADR-2605191346 — etzhayyim is Vultr-free (K3s on Mac-mini)
#   ADR-2605191229 — Path A daemon (TS reference, same HTTP API)
#   ADR-2605191000 — browser Pregel + reflection (the graph shape)
#
# Pod topology (2-container, Stage 1 of MstCheckpointSaver wire-up):
#
#   ┌─────────────────────────────────────────────────────────────────┐
#   │  Pod (etzhayyim-langserver namespace)                           │
#   │                                                                 │
#   │  ┌─────────────────────┐    /run/etzhayyim/    ┌──────────────┐ │
#   │  │  uvicorn (Python)   │◄──── checkpointer ─►│  checkpointer│ │
#   │  │  kotodama.…ameno  │        .sock         │  (TS, Node)  │ │
#   │  │  FastAPI + Pregel   │     (emptyDir)       │  @etzhayyim  │ │
#   │  │  port 8080          │                      │  /sdk        │ │
#   │  └──────────┬──────────┘                      └──────┬───────┘ │
#   │             │                                        │         │
#   │             │ AMENO_HOME /var/etzhayyim/ameno        │         │
#   │             ▼ (FileCheckpointer; primary today)       ▼         │
#   │        ┌─────────┐                          /var/etzhayyim/    │
#   │        │  PVC 1  │                          checkpointer-state │
#   │        │ 8Gi RWO │                          ┌─────────┐        │
#   │        └─────────┘                          │  PVC 2  │        │
#   │                                             │ 8Gi RWO │        │
#   │                                             └─────────┘        │
#   └─────────────────────────────────────────────────────────────────┘
#
# Stage 1 (this PR): sidecar present, Python server still uses
# FileCheckpointer. Python ↔ sidecar IPC wiring is the follow-up.
# Stage 2-4 (MST projection / IPFS pin / L2 anchor): the sidecar
# already implements them — flipping kotodama to dial the socket
# graduates the deployment without further infra change.
# ADR-2605171800 + ADR-2605191257.

apiVersion: v1
kind: Namespace
metadata:
  name: etzhayyim-langserver
  labels:
    # ADR-2605191346 §2: this namespace is etzhayyim-Murakumo-only.
    # Manifests living here MUST NOT reference Vultr / EKS / GKE.
    etzhayyim.com/tier: "1"
    etzhayyim.com/target: "murakumo-fleet"
    etzhayyim.com/adr: "2605191346"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lg-ameno
  namespace: etzhayyim-langserver
---
# PVC for FileCheckpointer + worker DID + future memory vault.
#
# Holds:
#   - worker-did                              persistent did:web:host:<…>
#   - checkpointer.json                       LangGraph state snapshot
#   - (future) memory.sqlite                  long-term memory vault when
#                                              Path B picks up ADR-2605191206
#
# Reclaim policy MUST be Retain (set on the underlying PV via the
# StorageClass) so `kubectl delete deployment` cannot wipe the DID.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lg-ameno-checkpointer-state
  namespace: etzhayyim-langserver
  labels:
    app.kubernetes.io/name: lg-ameno
    app.kubernetes.io/component: checkpointer-state
  annotations:
    etzhayyim.com/key-loss-is-irreversible: "true"
    etzhayyim.com/adr: "2605171800,2605181100"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lg-ameno-state
  namespace: etzhayyim-langserver
  labels:
    app.kubernetes.io/name: lg-ameno
    app.kubernetes.io/component: ameno-state
    app.kubernetes.io/part-of: ameno.etzhayyim.com
  annotations:
    etzhayyim.com/did-loss-is-irreversible: "true"
    etzhayyim.com/adr: "2605191257,2605191346"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
  # k3s default = local-path-provisioner (Mac-mini SSD). When
  # promoting to a multi-host k3s cluster set storageClassName to a
  # Retain class (e.g. longhorn or rook-ceph).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lg-ameno
  namespace: etzhayyim-langserver
  labels:
    app.kubernetes.io/name: lg-ameno
    app.kubernetes.io/component: langgraph-server
    app.kubernetes.io/part-of: ameno.etzhayyim.com
spec:
  replicas: 1
  strategy:
    # FileCheckpointer is single-writer; RWO PVC reinforces it. Roll
    # one-at-a-time and never overlap.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lg-ameno
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lg-ameno
    spec:
      serviceAccountName: lg-ameno
      imagePullSecrets:
        - name: ghcr-pull
      # Murakumo Mac-mini fleet scheduling: pin to a node labelled
      # `etzhayyim.com/role=murakumo-host`. virtual-kubelet shim nodes
      # (when used for mac-native scheduling, see ADR-2605182312) carry
      # the same label.
      nodeSelector:
        etzhayyim.com/role: "murakumo-host"
      tolerations:
        # virtual-kubelet sets this taint to keep system pods away from
        # the Mac-native execution nodes; we deliberately tolerate it.
        - key: "murakumo.etzhayyim.com/virtual-kubelet"
          operator: "Exists"
          effect: "NoSchedule"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/etzhayyim/lg-ameno:main
          imagePullPolicy: Always
          env:
            - name: AMENO_HOME
              value: "/var/etzhayyim/ameno"
            - name: AMENO_HOST
              value: "0.0.0.0"
            - name: AMENO_PORT
              value: "8080"
            # Ollama runs as a peer Service in this same namespace.
            # Provisioning of the ollama Service / DaemonSet is out of
            # scope of this manifest; it points to a Mac-mini-native
            # Ollama running on each fleet node (TODO: add
            # 50-infra/k8s/ollama-fleet/).
            - name: LOCAL_LLM_PROVIDER
              value: "ollama"
            - name: LOCAL_LLM_ENDPOINT
              value: "http://ollama.etzhayyim-langserver.svc.cluster.local:11434/api/chat"
            - name: LOCAL_LLM_MODEL
              value: "gemma3:4b"
            - name: LOCAL_LLM_TIMEOUT_SEC
              value: "180"
            # Stage 2 substrate persistence — when MST_CHECKPOINT_SOCKET
            # is set, kotodama.projects.ameno.pregel._compile_default()
            # attaches MstCheckpointSaver (ADR-2605171800) instead of the
            # FileCheckpointer fallback. Every put / putWrites op then
            # round-trips to the TS checkpointer sidecar over the shared
            # emptyDir Unix socket — sidecar owns MST / IPFS / L2 anchor.
            - name: MST_CHECKPOINT_SOCKET
              value: "/run/etzhayyim/checkpointer.sock"
            - name: MST_CHECKPOINT_CELL_DID
              value: "did:web:ameno.etzhayyim.com"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Reflection + active inference + tool loop combined run
              # ~6 LLM calls per user turn. Most of the latency budget
              # lives in Ollama, but the FastAPI process needs headroom
              # for SSE buffering of long streams.
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ameno-state
              mountPath: /var/etzhayyim/ameno
            - name: checkpointer-socket
              mountPath: /run/etzhayyim
        - name: checkpointer
          # MstCheckpointSaver sidecar — Stage 2-4 of ADR-2605171800.
          # Implementation is ready (50-infra/etzhayyim-sdk-checkpointer/),
          # awaits kotodama-side dialing of the socket (Stage 1 wire-up
          # is structural; Python integration follows in the next PR).
          image: ghcr.io/etzhayyim/etzhayyim-sdk-checkpointer:main
          imagePullPolicy: Always
          env:
            - name: ETZ_CHECKPOINTER_SOCKET
              value: "/run/etzhayyim/checkpointer.sock"
            - name: ETZ_CHECKPOINTER_STATE_DIR
              value: "/var/etzhayyim/checkpointer-state"
            - name: ETZ_CHECKPOINTER_ALLOWED_DIDS
              value: "did:web:ameno.etzhayyim.com"
            - name: ETZ_CHECKPOINTER_ENCRYPT_CELLS
              # ADR-2605181100 — graph state may include user PII (chat
              # history, tool results, surprise predictions). AEAD-seal
              # every payload with a per-cell XChaCha20-Poly1305 key
              # before MST projection.
              value: "did:web:ameno.etzhayyim.com"
            # Stage 3 (IPFS pin) — activated per ADR-2605191608.
            # Every CAR file produced by sidecar `#commitMst` is pinned via
            # the kubo HTTP API on simeonnomac-mini.local:5001. AEAD seal
            # (ETZ_CHECKPOINTER_ENCRYPT_CELLS above) guarantees pinned
            # bytes are ciphertext per ADR-2605181100.
            - name: ETZ_IPFS_API_URL
              value: "http://simeonnomac-mini.local:5001"
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('fs').statSync(process.env.ETZ_CHECKPOINTER_SOCKET)"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('fs').statSync(process.env.ETZ_CHECKPOINTER_SOCKET)"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: checkpointer-socket
              mountPath: /run/etzhayyim
            - name: checkpointer-state
              mountPath: /var/etzhayyim/checkpointer-state
            - name: tmp-sidecar
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp-sidecar
          emptyDir:
            sizeLimit: 64Mi
        - name: checkpointer-socket
          emptyDir:
            sizeLimit: 1Mi
        - name: checkpointer-state
          persistentVolumeClaim:
            claimName: lg-ameno-checkpointer-state
        - name: ameno-state
          persistentVolumeClaim:
            claimName: lg-ameno-state
---
apiVersion: v1
kind: Service
metadata:
  name: lg-ameno
  namespace: etzhayyim-langserver
  labels:
    app.kubernetes.io/name: lg-ameno
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lg-ameno
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
