apiVersion: apps/v1
kind: Deployment
metadata:
  name: maps-read-langserver
  labels:
    app.kubernetes.io/name: maps-read-langserver
    app.kubernetes.io/part-of: maps-etzhayyim-ai
spec:
  # RETIRED 2026-07-17: RW_URL residue from the 2026-05-17 gftdcojp org split.
  # RisingWave was org-wide retired 2026-06-11 (ADR-2606120900/2606120930).
  # Scaled to 0 — see ADR-2605191648 addendum 2026-07-17.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: maps-read-langserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maps-read-langserver
        app.kubernetes.io/part-of: maps-etzhayyim-ai
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: worker-api
          image: ghcr.io/etzhayyim/kotodama:maps-worldmonitor-market-91d57ab127d-20260514082800-amd64
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - kotodama.worker_api
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: WORKER_API_COMPONENT
              value: maps-read-langserver
            - name: WORKER_API_RUNTIME_KIND
              value: k8s-langserver
            - name: WORKER_API_PORT
              value: "8081"
            - name: RW_SYNC_POOL
              value: "1"
            - name: RW_DDL_GUARD
              value: "1"
            - name: RW_ALLOW_HEAVY_DDL
              value: "0"
            - name: RW_ALLOW_FLUSH
              value: "0"
            - name: RW_URL
              valueFrom:
                secretKeyRef:
                  name: mitama-udf-pool-rw
                  key: RW_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maps-langserver-tunnel-token
                  key: token
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: maps-read-langserver
  labels:
    app.kubernetes.io/name: maps-read-langserver
    app.kubernetes.io/part-of: maps-etzhayyim-ai
spec:
  selector:
    app.kubernetes.io/name: maps-read-langserver
  ports:
    - name: http
      port: 8081
      targetPort: http
