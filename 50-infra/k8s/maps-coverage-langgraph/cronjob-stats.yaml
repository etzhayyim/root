---
# maps-coverage-stats-ticker (LangGraph edition)
#
# Replaces the bpmn-dispatcher curl ticker with an in-pod LangGraph StateGraph
# that calls refresh_coverage_stats() directly.
#
# Single-node graph (chain): START -> refresh -> END
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maps-coverage-stats-ticker
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: maps-coverage-stats-ticker
    app.kubernetes.io/component: langgraph-cronjob
    app.kubernetes.io/part-of: maps
spec:
  # RETIRED 2026-07-17: RW_URL residue from the 2026-05-17 gftdcojp org split.
  # RisingWave was org-wide retired 2026-06-11 (ADR-2606120900/2606120930).
  # Suspended — see ADR-2605191648 addendum 2026-07-17.
  suspend: true
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: maps-coverage-stats-ticker
            app.kubernetes.io/component: langgraph-cronjob
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-creds
          tolerations:
            - key: workload
              operator: Equal
              value: osm-ingest
              effect: NoSchedule
          containers:
            - name: refresh
              image: ghcr.io/etzhayyim/kotodama:ndl-oai-resident-0077fecc6a2-20260509110241-amd64
              imagePullPolicy: IfNotPresent
              env:
                - name: RW_URL
                  valueFrom:
                    secretKeyRef:
                      name: mitama-udf-pool-rw
                      key: RW_URL
                - name: RW_SYNC_POOL
                  value: "0"
                - name: ONLY_ZEROED
                  value: "0"
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
              command: ["python", "-c"]
              args:
                - |
                  import asyncio, json, os
                  from typing import Any, TypedDict

                  from langgraph.graph import StateGraph, START, END

                  from kotodama.ingest.maps_collection import refresh_coverage_stats

                  ONLY_ZEROED = os.environ.get("ONLY_ZEROED", "0") == "1"


                  class StatsState(TypedDict, total=False):
                      onlyZeroed: bool
                      scanned: int
                      updated: int
                      totalCollectedAcrossTargets: int
                      deltas: list


                  async def refresh_node(state: StatsState) -> dict:
                      res = await asyncio.to_thread(
                          refresh_coverage_stats,
                          onlyZeroed=state.get("onlyZeroed", False),
                      )
                      return {
                          "scanned": int(res.get("scanned", 0)),
                          "updated": int(res.get("updated", 0)),
                          "totalCollectedAcrossTargets": int(
                              res.get("totalCollectedAcrossTargets", 0)
                          ),
                          "deltas": list(res.get("deltas") or []),
                      }


                  def build_graph():
                      g = StateGraph(StatsState)
                      g.add_node("refresh", refresh_node)
                      g.add_edge(START, "refresh")
                      g.add_edge("refresh", END)
                      return g.compile()


                  async def main() -> None:
                      graph = build_graph()
                      result = await graph.ainvoke({"onlyZeroed": ONLY_ZEROED})
                      deltas = result.get("deltas") or []
                      print(
                          json.dumps(
                              {
                                  "event": "maps_coverage_stats_refresh",
                                  "scanned": result.get("scanned", 0),
                                  "updated": result.get("updated", 0),
                                  "totalCollected": result.get(
                                      "totalCollectedAcrossTargets", 0
                                  ),
                                  "topDeltas": deltas[:5],
                              },
                              ensure_ascii=False,
                              sort_keys=True,
                          )
                      )


                  asyncio.run(main())
