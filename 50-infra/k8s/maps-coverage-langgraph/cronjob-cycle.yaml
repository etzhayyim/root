---
# maps-coverage-ticker (LangGraph edition)
#
# Replaces the bpmn-dispatcher curl ticker with an in-pod LangGraph StateGraph
# that calls kotodama.ingest.maps_collection primitives directly against
# Kotoba/Datomic. See 50-infra/k8s/maps-coverage-langgraph/README.md.
#
# Graph (Pregel super-step):
#   START -> advance -> (Send fan-out per picked job) -> aggregate -> refresh -> END
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maps-coverage-ticker
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: maps-coverage-ticker
    app.kubernetes.io/component: langgraph-cronjob
    app.kubernetes.io/part-of: maps
spec:
  # RETIRED 2026-07-17: RW_URL residue from the 2026-05-17 gftdcojp org split.
  # RisingWave was org-wide retired 2026-06-11 (ADR-2606120900/2606120930).
  # Suspended — see ADR-2605191648 addendum 2026-07-17.
  suspend: true
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: maps-coverage-ticker
            app.kubernetes.io/component: langgraph-cronjob
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-creds
          tolerations:
            - key: workload
              operator: Equal
              value: osm-ingest
              effect: NoSchedule
          containers:
            - name: cycle
              image: ghcr.io/etzhayyim/kotodama:ndl-oai-resident-0077fecc6a2-20260509110241-amd64
              imagePullPolicy: IfNotPresent
              env:
                - name: RW_URL
                  valueFrom:
                    secretKeyRef:
                      name: mitama-udf-pool-rw
                      key: RW_URL
                - name: RW_SYNC_POOL
                  value: "0"
                - name: ADVANCE_LIMIT
                  value: "4"
                - name: MAX_RECORDS_PER_JOB
                  value: "100"
                - name: REFRESH_AT_END
                  value: "0"
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
              command: ["python", "-c"]
              args:
                - |
                  import asyncio, json, operator, os
                  from typing import Annotated, Any, TypedDict

                  from langgraph.graph import StateGraph, START, END
                  from langgraph.types import Send

                  from kotodama.ingest.maps_collection import (
                      advance_coverage,
                      refresh_coverage_stats,
                  )

                  ADVANCE_LIMIT = int(os.environ.get("ADVANCE_LIMIT", "4"))
                  MAX_RECORDS = int(os.environ.get("MAX_RECORDS_PER_JOB", "100"))
                  REFRESH = os.environ.get("REFRESH_AT_END", "0") == "1"


                  class CoverageState(TypedDict, total=False):
                      advanceLimit: int
                      maxRecordsPerJob: int
                      refresh: bool
                      advanced: int
                      picked: list
                      runs: Annotated[list, operator.add]
                      refreshUpdated: int
                      totalCollected: int
                      remainingGaps: int


                  async def advance_node(state: CoverageState) -> dict:
                      res = await asyncio.to_thread(advance_coverage, limit=state["advanceLimit"])
                      return {
                          "advanced": int(res.get("advanced", 0)),
                          "picked": list(res.get("picked") or []),
                          "remainingGaps": int(res.get("remainingGaps", 0)),
                      }


                  def fanout_runs(state: CoverageState):
                      picked = state.get("picked") or []
                      if not picked:
                          return ["aggregate"]
                      return [Send("run_item", {"item": item}) for item in picked]


                  def run_item(payload: dict) -> dict:
                      item = payload.get("item") or {}
                      return {
                          "runs": [
                              {
                                  "jobId": str(item.get("jobId") or ""),
                                  "sourceDid": item.get("sourceDid"),
                                  "label": item.get("label"),
                                  "status": "queued",
                                  "gapScore": item.get("gapScore"),
                              }
                          ]
                      }


                  def aggregate(state: CoverageState) -> dict:
                      return {}


                  async def refresh_node(state: CoverageState) -> dict:
                      if not state.get("refresh"):
                          return {}
                      res = await asyncio.to_thread(refresh_coverage_stats)
                      return {
                          "refreshUpdated": int(res.get("updated", 0)),
                          "totalCollected": int(res.get("totalCollectedAcrossTargets", 0)),
                      }


                  def build_graph():
                      g = StateGraph(CoverageState)
                      g.add_node("advance", advance_node)
                      g.add_node("run_item", run_item)
                      g.add_node("aggregate", aggregate)
                      g.add_node("refresh", refresh_node)
                      g.add_edge(START, "advance")
                      g.add_conditional_edges("advance", fanout_runs, ["run_item", "aggregate"])
                      g.add_edge("run_item", "aggregate")
                      g.add_edge("aggregate", "refresh")
                      g.add_edge("refresh", END)
                      return g.compile()


                  async def main() -> None:
                      graph = build_graph()
                      result = await graph.ainvoke(
                          {
                              "advanceLimit": ADVANCE_LIMIT,
                              "maxRecordsPerJob": MAX_RECORDS,
                              "refresh": REFRESH,
                          }
                      )
                      print(
                          json.dumps(
                              {
                                  "event": "maps_coverage_cycle",
                                  "advanced": result.get("advanced", 0),
                                  "ran": len(result.get("runs") or []),
                                  "runs": result.get("runs") or [],
                                  "refreshUpdated": result.get("refreshUpdated", 0),
                                  "totalCollected": result.get("totalCollected", 0),
                                  "remainingGaps": result.get("remainingGaps", 0),
                              },
                              ensure_ascii=False,
                              sort_keys=True,
                          )
                      )


                  asyncio.run(main())
