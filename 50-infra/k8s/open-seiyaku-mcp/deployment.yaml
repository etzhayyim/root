apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-seiyaku-mcp
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: open-seiyaku-mcp
    app.kubernetes.io/part-of: etzhayyim.com
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-seiyaku-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-seiyaku-mcp
    spec:
      containers:
        - name: server
          image: ghcr.io/etzhayyim/open-seiyaku-mcp:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
