# EDINET sweep — fetches filing metadata (有価証券報告書 etc.) for JP securities,
# then downloads PDFs if EDINET_SUBSCRIPTION_KEY is set. 10 companies/run,
# ~44 min to sweep all ~9000 JP securities at this pace (runs weekly).
# activeDeadlineSeconds=1800 covers PDF downloads for 10 companies.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: isin-edinet-sweep
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: isin-edinet-sweep
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: isin.etzhayyim.com
spec:
  schedule: "7 2 * * 6"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 7200
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: isin-edinet-sweep
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: curlimages/curl:8.7.1
              command:
                - sh
                - -c
                - |
                  set -e
                  curl -fsS \
                    -X POST \
                    -H "Content-Type: application/json" \
                    --data '{"limit":10}' \
                    http://lg-isin.mitama-udf.svc.cluster.local:8080/cron/edinet-sweep
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop: ["ALL"]
