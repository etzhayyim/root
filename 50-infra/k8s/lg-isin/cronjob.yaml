---
# US securities sweep — advances rolling cursor through SEC EDGAR tickers list,
# batches of 500 with OpenFIGI enrichment. Full 13k-ticker sweep takes ~26 days
# at one run/day; duplicates skipped via UniqueViolationError.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: isin-sweep-us
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: isin-sweep-us
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: isin.etzhayyim.com
spec:
  schedule: "3 2 * * 1-5"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: isin-sweep-us
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: curlimages/curl:8.7.1
              command:
                - sh
                - -c
                - |
                  set -e
                  curl -fsS \
                    -X POST \
                    -H "Content-Type: application/json" \
                    --data '{"batchSize":500}' \
                    http://lg-isin.mitama-udf.svc.cluster.local:8080/cron/sweep-us
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop: ["ALL"]
---
