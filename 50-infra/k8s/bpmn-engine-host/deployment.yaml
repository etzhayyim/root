---
apiVersion: v1
kind: Namespace
metadata:
  name: mitama-udf
  labels:
    app.kubernetes.io/part-of: mitama.etzhayyim.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bpmn-engine-host
  namespace: mitama-udf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bpmn-engine-host
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: bpmn-engine-host
    app.kubernetes.io/component: workflow-engine
    app.kubernetes.io/part-of: mitama.etzhayyim.com
  annotations:
    etzhayyim.com/adr: "2605081200"
    etzhayyim.com/replaces: "zeebe-broker"
spec:
  # PoC: single-shard active. Phase 3 may shard by hash(processInstanceKey).
  # standby replica is a separate Deployment so we can drain independently.
  # RETIRED 2026-07-17: RW_URL residue from the 2026-05-17 gftdcojp org split.
  # RisingWave was org-wide retired 2026-06-11 (ADR-2606120900/2606120930).
  # Scaled to 0 — see ADR-2605191648 addendum 2026-07-17.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bpmn-engine-host
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bpmn-engine-host
    spec:
      serviceAccountName: bpmn-engine-host
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: engine
          image: ghcr.io/etzhayyim/bpmn-engine-host:20260509-readyz-direct-a5f44f49093-amd64
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: BPMN_ENGINE_POOL_MAX
              value: "32"
            - name: BPMN_ENGINE_WRITE_VISIBLE_REQUIRED
              value: "false"
            - name: BPMN_ENGINE_WRITE_VISIBLE_RETRIES
              value: "150"
            - name: BPMN_ENGINE_WRITE_VISIBLE_INTERVAL_S
              value: "0.2"
            - name: BPMN_ENGINE_READYZ_DB_TIMEOUT_S
              value: "2.0"
            - name: KOTOBA_URL
              valueFrom:
                secretKeyRef:
                  name: mitama-udf-pool-rw
                  key: RW_URL
          resources:
            requests:
              cpu: "10m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          # Liveness MUST NOT depend on the asyncio event loop (root
          # CLAUDE.md: pyzeebe watchdog hazard). FastAPI /healthz is a
          # synchronous handler from the engine thread's perspective.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bpmn-engine-host
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: bpmn-engine-host
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bpmn-engine-host
  ports:
    - name: http
      port: 80
      targetPort: http
