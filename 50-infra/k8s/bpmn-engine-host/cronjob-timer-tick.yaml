---
# ADR 2605081200 — Timer reconciler.
#
# Drives `wf.refresh_waiting_tasks()` on every running instance once
# per minute. SpiffWorkflow persists timer state inside `state_json`;
# this CronJob is the wallclock that fires due timers.
#
# Cardinality assumption: <= 200 running instances per tick. For
# heavier load the bulk endpoint accepts `?max_instances=N` and the
# CronJob fans into multiple shards (Phase 3, hash-sharded).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bpmn-engine-timer-tick
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: bpmn-engine-timer-tick
    app.kubernetes.io/component: workflow-engine-timer
    app.kubernetes.io/part-of: mitama.etzhayyim.com
  annotations:
    etzhayyim.com/adr: "2605081200"
spec:
  schedule: "* * * * *"        # every minute
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 30
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 50
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bpmn-engine-timer-tick
        spec:
          restartPolicy: Never
          containers:
            - name: tick
              # `curlimages/curl` is small (5 MB) and pinned. The
              # engine host service is in-cluster ClusterIP, no auth
              # required. If/when an auth gate is added, switch to the
              # engine image with a credential mount.
              image: curlimages/curl:8.10.1
              command:
                - sh
                - -c
                - >-
                  curl -fsS -X POST
                  http://bpmn-engine-host.mitama-udf.svc.cluster.local/v1/timer/tick
                  -H 'content-type: application/json'
                  --max-time 30
              resources:
                requests: { cpu: "10m", memory: "16Mi" }
                limits:   { cpu: "100m", memory: "64Mi" }
