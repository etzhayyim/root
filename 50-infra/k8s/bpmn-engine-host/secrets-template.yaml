# Apply with the actual RW_DSN value injected from 1Password / macOS Keychain
# (root CLAUDE.md "Local Secret Storage = macOS Keychain primary"). DO NOT
# commit a populated copy of this file.
#
#   security find-generic-password -s "etzhayyim.risingwave" -a "RW_DSN" -w \
#     | kubectl create secret generic bpmn-engine-host-secrets \
#         -n mitama-udf --from-file=RW_DSN=/dev/stdin
apiVersion: v1
kind: Secret
metadata:
  name: bpmn-engine-host-secrets
  namespace: mitama-udf
type: Opaque
stringData:
  RW_DSN: "postgresql://USER:PASSWORD@<vendor-rw-host>:4566/dev"
