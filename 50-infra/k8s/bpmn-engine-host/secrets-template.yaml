# Apply with the actual KOTOBA_URL value injected from 1Password / macOS Keychain
# (root CLAUDE.md "Local Secret Storage = macOS Keychain primary"). DO NOT
# commit a populated copy of this file.
#
#   security find-generic-password -s "etzhayyim.kotoba" -a "KOTOBA_URL" -w \
#     | kubectl create secret generic bpmn-engine-host-secrets \
#         -n mitama-udf --from-file=KOTOBA_URL=/dev/stdin
apiVersion: v1
kind: Secret
metadata:
  name: bpmn-engine-host-secrets
  namespace: mitama-udf
type: Opaque
stringData:
  KOTOBA_URL: "postgresql://USER:PASSWORD@<vendor-rw-host>:4566/dev" # placeholder
