# lima-k3s-server.yaml — Lima template for etzhayyim K3s HA dry-run.
#
# Spawns an Ubuntu 24.04 VM with K3s preinstalled. Three of these in a
# Lima fleet form an embedded-etcd HA control plane (3 server nodes).
# On a single Mac mini this is the recommended M1 dry-run; on the real
# fleet the same template is provisioned on 3 separate Mac minis.
#
# Authoritative ADR: 90-docs/adr/2605191346-etzhayyim-vultr-free-murakumo-control-plane.md
#
# Usage (see bring-up.sh):
#   limactl create --name=k3s-server-01 --tty=false lima-k3s-server.yaml
#   limactl start  k3s-server-01
#
# After all three VMs are up, bring-up.sh runs k3s install on each in
# cluster-init / join modes so the SECRET / SAN flags stay outside this
# declarative template.

images:
  # Ubuntu 24.04 LTS server cloud image. Multi-arch — Lima picks the
  # right artefact for the host (arm64 on Apple silicon, amd64 on Intel).
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

# Modest VM sizing — adequate for the control plane plus a handful of
# small workloads. Bump per-VM when you co-locate heavier pods.
cpus: 2
memory: 4GiB
disk: 30GiB

mounts:
  # /tmp/lima is the default 9p host-share. We don't currently need
  # cross-mount visibility for K3s data (everything stays on the VM
  # disk so the cluster survives Lima stop/start), but leaving the
  # default makes copying kubeconfig out trivial.
  - location: "~"
    writable: false
  - location: "/tmp/lima"
    writable: true

# Sane network: each VM gets a stable RFC1918 IP on the lima0 bridge.
# socket_vmnet must be installed on the host — bring-up.sh checks.
networks:
  - lima: shared

# cloud-init payload — only installs base packages and pulls the k3s
# installer. Actual `k3s server` invocation runs from bring-up.sh on the
# host so each VM gets the right --cluster-init or --server flags.
provision:
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      apt-get update
      apt-get install -y \
        ca-certificates \
        curl \
        jq \
        netcat-openbsd
      # Stash the installer for fast reruns; bring-up.sh executes it later.
      curl -fsSL https://get.k3s.io -o /usr/local/bin/k3s-install.sh
      chmod +x /usr/local/bin/k3s-install.sh
      # Enable IP forwarding required by k3s networking (flannel).
      cat > /etc/sysctl.d/99-k3s.conf <<EOF
      net.ipv4.ip_forward=1
      net.bridge.bridge-nf-call-iptables=1
      EOF
      sysctl --system >/dev/null
      # Ensure ssh access for limactl shell.
      systemctl enable --now ssh

probes:
  - description: "k3s installer is staged"
    script: |
      #!/usr/bin/env bash
      set -e
      test -x /usr/local/bin/k3s-install.sh
    hint: |
      The k3s installer should be available at /usr/local/bin/k3s-install.sh.

containerd:
  # K3s ships its own containerd; we don't need Lima's per-VM containerd
  # daemon. Disabling avoids a noisy log + a few MB RAM.
  system: false
  user: false

# Lima quirks: writable=false on $HOME prevents accidental host writes,
# 9p mount of /tmp/lima is the kubeconfig handoff path.
ssh:
  loadDotSSHPubKeys: true
