---
# no-server-key: read-only — pending Stage A-E member-signed-writes refactor per ADR-2605231525
# Batch generation Job for openUnispsc dynamic LangGraph processing logic.
# Processes pending 150,000 commodities via Gemini 3.1 Flash Lite.
apiVersion: batch/v1
kind: Job
metadata:
  name: open-unispsc-batch-spec-gen
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: open-unispsc-batch
    app.kubernetes.io/component: batch-job
    app.kubernetes.io/part-of: unispsc.etzhayyim.com
spec:
  # We want the job to process pending commodities.
  # Adjust parallelism if we want to run multiple pods.
  parallelism: 1
  completions: 1
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-unispsc-batch
    spec:
      serviceAccountName: lg-jukyu # Reuse existing service account for permissions
      imagePullSecrets:
        - name: ghcr-pull
      restartPolicy: OnFailure
      containers:
        - name: batch-runner
          # In production, use the pinned latest hash/tag
          image: ghcr.io/etzhayyim/kotodama:main
          imagePullPolicy: Always
          command:
            - python
            - scripts/run_batch_spec_gen.py
            - "--full"
            - "--limit"
            - "10000"
            - "--concurrency"
            - "10"
          env:
            # Database Connection
            - name: RW_URL
              valueFrom:
                secretKeyRef:
                  name: mitama-udf-pool-rw
                  key: RW_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mitama-udf-pool-rw
                  key: RW_URL
            - name: RW_SYNC_POOL
              value: "1"

            # Gemini API Key (Required for HTTP API fallback inside K8s)
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-secrets
                  key: GEMINI_API_KEY
                  optional: true

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
