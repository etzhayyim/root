# UnispscOrganismFleetCell shard-1 — issachar, segments 30-44 (~8,541 organisms, heaviest shard).

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: unispsc-organism-fleet-shard-1
  namespace: etzhayyim-organism
  labels:
    app.kubernetes.io/name: unispsc-organism-fleet
    etzhayyim.com/shard: "1"
    etzhayyim.com/leader-node: issachar
  annotations:
    etzhayyim.com/adr: "2605240000,2605240015,2605240030,2605240100,2605232100"
    etzhayyim.com/segments: "30-44"
    etzhayyim.com/organism-count: "8541"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unispsc-organism-fleet
      etzhayyim.com/shard: "1"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unispsc-organism-fleet
        etzhayyim.com/shard: "1"
        etzhayyim.com/leader-node: issachar
    spec:
      serviceAccountName: unispsc-organism-fleet-shard-1
      nodeSelector:
        kubernetes.io/hostname: issacharnomac-mini.local
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: cell
          image: ghcr.io/etzhayyim/kotodama:main
          imagePullPolicy: Always
          command:
            - python
            - -m
            - kotodama.organism.fleet_cell_main
          env:
            - name: ETZHAYYIM_NODE
              value: issachar
            - name: UNISPSC_ORGANISM_SHARD_INDEX
              value: "1"
            - name: UNISPSC_ORGANISM_LRU_MAX
              value: "8192"   # heaviest shard — 2x default
            - name: UNISPSC_ORGANISM_TICK_INTERVAL_S
              value: "300"
            - name: UNISPSC_ORGANISM_POST_SINK
              value: ndjson
            - name: UNISPSC_ORGANISM_POST_QUEUE_PATH
              value: /var/lib/etzhayyim/organism-posts/shard-1.ndjson
            - name: ETZ_REPO
              value: /repo
            - name: FLEET_TOML
              value: /repo/50-infra/murakumo/fleet.toml
          ports:
            - name: healthz
              containerPort: 13050
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 90  # heaviest shard — longer cold start
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 400m
              memory: 2Gi
            limits:
              cpu: 3000m
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: repo
              mountPath: /repo
              readOnly: true
            - name: organism-posts
              mountPath: /var/lib/etzhayyim/organism-posts
            - name: tmp
              mountPath: /tmp
        # Drainer sidecar (Wave 3)
        - name: drainer
          image: ghcr.io/etzhayyim/organism-post-drainer:main
          imagePullPolicy: Always
          env:
            - name: ORGANISM_POST_QUEUE_PATH
              value: /var/lib/etzhayyim/organism-posts/shard-1.ndjson
            - name: ETZHAYYIM_PDS_URL
              value: https://atproto.etzhayyim.com
            - name: ETZHAYYIM_SHARD
              value: "1"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: organism-posts
              mountPath: /var/lib/etzhayyim/organism-posts
      volumes:
        - name: repo
          hostPath:
            path: /Users/etzhayyim/etzhayyim-root
            type: Directory
        - name: organism-posts
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
