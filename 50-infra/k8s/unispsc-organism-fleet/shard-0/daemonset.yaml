# UnispscOrganismFleetCell shard-0 — joseph, segments 10-29 (~4,597 organisms).
#
# Two containers: `cell` (Python, ticks organisms) + `drainer` (TS, drains
# NDJSON queue → AT Protocol PDS via @etzhayyim/sdk). The drainer image
# is a Wave 3 deliverable (ADR-2605240100 §Drainer); until it lands the
# cell still writes to the queue but no PDS dispatch happens. To stay
# operational without the drainer, override env UNISPSC_ORGANISM_POST_SINK=logger.

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: unispsc-organism-fleet-shard-0
  namespace: etzhayyim-organism
  labels:
    app.kubernetes.io/name: unispsc-organism-fleet
    etzhayyim.com/shard: "0"
    etzhayyim.com/leader-node: joseph
  annotations:
    etzhayyim.com/adr: "2605240000,2605240015,2605240030,2605240100,2605232100"
    etzhayyim.com/segments: "10-29"
    etzhayyim.com/organism-count: "4597"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unispsc-organism-fleet
      etzhayyim.com/shard: "0"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unispsc-organism-fleet
        etzhayyim.com/shard: "0"
        etzhayyim.com/leader-node: joseph
    spec:
      serviceAccountName: unispsc-organism-fleet-shard-0
      nodeSelector:
        kubernetes.io/hostname: josephnomac-mini.local
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: cell
          image: ghcr.io/etzhayyim/kotodama:main
          imagePullPolicy: Always
          command:
            - python
            - -m
            - kotodama.organism.fleet_cell_main
          env:
            - name: ETZHAYYIM_NODE
              value: joseph
            - name: UNISPSC_ORGANISM_SHARD_INDEX
              value: "0"
            - name: UNISPSC_ORGANISM_LRU_MAX
              value: "4096"
            - name: UNISPSC_ORGANISM_TICK_INTERVAL_S
              value: "300"
            - name: UNISPSC_ORGANISM_POST_SINK
              value: ndjson
            - name: UNISPSC_ORGANISM_POST_QUEUE_PATH
              value: /var/lib/etzhayyim/organism-posts/shard-0.ndjson
            - name: ETZ_REPO
              value: /repo
            - name: FLEET_TOML
              value: /repo/50-infra/murakumo/fleet.toml
          ports:
            - name: healthz
              containerPort: 13040
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: repo
              mountPath: /repo
              readOnly: true
            - name: organism-posts
              mountPath: /var/lib/etzhayyim/organism-posts
            - name: tmp
              mountPath: /tmp
        # Drainer sidecar (Wave 3)
        - name: drainer
          image: ghcr.io/etzhayyim/organism-post-drainer:main
          imagePullPolicy: Always
          env:
            - name: ORGANISM_POST_QUEUE_PATH
              value: /var/lib/etzhayyim/organism-posts/shard-0.ndjson
            - name: ETZHAYYIM_PDS_URL
              value: https://atproto.etzhayyim.com
            - name: ETZHAYYIM_SHARD
              value: "0"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: organism-posts
              mountPath: /var/lib/etzhayyim/organism-posts
      volumes:
        - name: repo
          hostPath:
            path: /Users/etzhayyim/etzhayyim-root
            type: Directory
        - name: organism-posts
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
