# GH_TOKEN Secret TEMPLATE for the kaizen-pr-agent (Wave-4 enablement).
#
# DO NOT COMMIT A REAL TOKEN. This is a template; create the live Secret
# out-of-band with an operator-provisioned, short-lived, least-privilege token
# (no platform master key — ADR-2605231525). The token needs only:
#   - repo:  contents:write (push the kaizen/* branch)  + pull_requests:write
#   - issues:write (issue-only proposals)
# scoped to github.com/etzhayyim/root, ideally a fine-grained PAT with a short
# expiry, rotated per the cell_key_rotation_period_days policy.
#
# Create it directly (preferred — never written to git):
#   kubectl create secret generic kaizen-pr-agent-gh \
#     -n etzhayyim-organism \
#     --from-literal=token="$GH_PR_AGENT_TOKEN"
#
# The Deployment references it as optional, so the pod runs (auth-skip) until
# this Secret exists; once present, the agent opens real PRs/issues.

apiVersion: v1
kind: Secret
metadata:
  name: kaizen-pr-agent-gh
  namespace: etzhayyim-organism
  labels:
    app.kubernetes.io/name: kaizen-pr-agent
type: Opaque
stringData:
  token: "REPLACE_WITH_OPERATOR_INJECTED_SHORT_LIVED_TOKEN"
