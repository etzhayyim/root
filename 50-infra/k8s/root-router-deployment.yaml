apiVersion: apps/v1
kind: Deployment
metadata:
  name: etzhayyim-root-router
  namespace: clean-room-system
  labels:
    app: root-router
spec:
  replicas: 3
  selector:
    matchLabels:
      app: root-router
  template:
    metadata:
      labels:
        app: root-router
    spec:
      containers:
      - name: root-router
        image: registry.etzhayyim.com/root-router:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: WORKERS
          value: "4"
        volumeMounts:
        - name: datomic-journal
          mountPath: /app/80-data/datomic_mock
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: datomic-journal
        persistentVolumeClaim:
          claimName: datomic-pvc
