# ameno-ingress — Cloudflare Tunnel for ameno-daemon.etzhayyim.com.
#
# Sidecar pattern mirrored from 50-infra/k8s/atproto-pds/deployment.yaml.
# The tunnel routes public requests to the lg-ameno ClusterIP Service;
# the daemon's bearer-token middleware (env AMENO_AUTH_TOKEN) enforces
# auth before any graph runs.
#
# Out of scope for v0.1: did:web challenge-response auth. Bearer token
# is the bridge until that lands.
#
# Authoritative:
#   ADR-2605191407 (browser viewer mode, custom URL support)
#   ADR-2605191346 (etzhayyim Vultr-free)

apiVersion: v1
kind: Secret
metadata:
  name: ameno-daemon-tunnel-token
  namespace: etzhayyim-langserver
  # Populate via:
  #   kubectl -n etzhayyim-langserver create secret generic ameno-daemon-tunnel-token \
  #     --from-literal=token=<your-CF-tunnel-token>
  # then `kubectl rollout restart deploy/ameno-tunnel`.
type: Opaque
stringData:
  token: "REPLACE_ME_WITH_CF_TUNNEL_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: ameno-daemon-auth
  namespace: etzhayyim-langserver
  # Bearer token the daemon checks. Browsers pass it via
  # `Authorization: Bearer <token>` (see viewer-mode.ts).
  # Generate a fresh one per cluster:
  #   openssl rand -hex 32
type: Opaque
stringData:
  token: "REPLACE_ME_WITH_RANDOM_32_BYTE_HEX"
---
# cloudflared as its own Deployment (1 replica) so it can fan out to
# multiple in-cluster services in the future without colocating with a
# specific app pod. Tunnel ingress rules live in the Cloudflare dashboard
# config (or a tunnel config file mounted here in a follow-up).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ameno-tunnel
  namespace: etzhayyim-langserver
  labels:
    app.kubernetes.io/name: ameno-tunnel
    app.kubernetes.io/component: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ameno-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ameno-tunnel
    spec:
      nodeSelector:
        etzhayyim.com/role: "murakumo-host"
      tolerations:
        - key: "murakumo.etzhayyim.com/virtual-kubelet"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - "0.0.0.0:2000"
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ameno-daemon-tunnel-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
      restartPolicy: Always
