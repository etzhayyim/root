---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gleif-lei-s3-ingester
  namespace: mitama-udf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gleif-lei-s3-ingester-rw-health
  namespace: mitama-udf
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gleif-lei-s3-ingester-rw-health
  namespace: mitama-udf
subjects:
  - kind: ServiceAccount
    name: gleif-lei-s3-ingester
    namespace: mitama-udf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gleif-lei-s3-ingester-rw-health
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gleif-lei-s3-ingester
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: gleif-lei-s3-ingester
    app.kubernetes.io/component: ingester
    app.kubernetes.io/part-of: open-lei.etzhayyim.com
spec:
  # GLEIF Golden Copy publishes every Monday.  Run Monday 03:00 UTC to
  # ensure the new file is available before we fetch it.
  schedule: "0 3 * * 1"
  timeZone: "Etc/UTC"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      # Full GLEIF dataset (~2.5M records): allow up to 4 hours.
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gleif-lei-s3-ingester
        spec:
          serviceAccountName: gleif-lei-s3-ingester
          imagePullSecrets:
            - name: ghcr-pull
          restartPolicy: Never
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
          containers:
            - name: ingester
              image: ghcr.io/etzhayyim/gleif-lei-s3-ingester:latest
              imagePullPolicy: Always
              volumeMounts:
                - name: tmp
                  mountPath: /tmp/gleif
              env:
                - name: KOTOBA_URL
                  valueFrom:
                    secretKeyRef:
                      name: gleif-lei-s3-ingester-secrets
                      key: KOTOBA_URL
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: B2_BUCKET
                  value: "etzhayyim-nats"
                - name: B2_ENDPOINT
                  value: "https://s3.us-west-004.backblazeb2.com"
                - name: B2_REGION
                  value: "us-west-004"
                - name: DOWNLOAD_DIR
                  value: "/tmp/gleif"
                - name: BATCH_SIZE
                  value: "500"
                - name: MAX_RECORDS
                  value: "0"
                - name: FETCH_TIMEOUT
                  value: "600"
                - name: RW_HEALTH_GATE
                  value: "true"
                - name: RW_MIN_COMPUTE_READY
                  value: "2"
                - name: RW_MIN_COMPUTE_AGE_SECONDS
                  value: "1800"
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
