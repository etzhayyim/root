---
# lg-ses — LangGraph Server (granian ASGI) for SES 案件・状況 ingest pipeline.
#
# ADR refs:
#   * ADR-2605120000 (SES 案件・状況 ingest pipeline)
#   * ADR-2605080600 (LangGraph Server + Granian L3 Runtime)
#   * ADR-2605111200 (CF Worker = Edge-Only; RW connection = K8s Pod only)
#
# Phase 3: POST /cron/outlook-pull called by CronJob every 15 min.
# Phase 1/2: POST /runs accepts manual + email source_kind payloads on demand.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lg-ses
  namespace: mitama-udf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lg-ses
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: lg-ses
    app.kubernetes.io/component: langgraph-server
    app.kubernetes.io/part-of: ses.etzhayyim.com
spec:
  # RETIRED 2026-07-17: RW_URL residue from the 2026-05-17 gftdcojp org split.
  # RisingWave was org-wide retired 2026-06-11 (ADR-2606120900/2606120930).
  # Scaled to 0 — see ADR-2605191648 addendum 2026-07-17.
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lg-ses
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lg-ses
    spec:
      serviceAccountName: lg-ses
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: server
          image: ghcr.io/etzhayyim/lg-ses:0.3.0-amd64
          imagePullPolicy: Always
          command:
            - granian
            - --interface
            - asgi
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "1"
            - --access-log
            - kotodama.ses.server:app
          env:
            # Kotoba/Datomic PG :4566 — vertex_ses_* writes + vertex_m365_sync_state cursor.
            - name: RW_URL
              valueFrom:
                secretKeyRef:
                  name: lg-ses-secrets
                  key: RW_URL
            # x-api-key shared with bpmn-dispatcher and the CronJob.
            - name: LG_SES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-ses-secrets
                  key: LG_SES_API_KEY
                  optional: true
            # Phase indicator reported in /health.
            - name: SES_PHASE
              value: "3"
            # Microsoft 365 app-only credentials (Mail.Read scope).
            - name: M365_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: lg-ses-secrets
                  key: M365_TENANT_ID
            - name: M365_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: lg-ses-secrets
                  key: M365_CLIENT_ID
            - name: M365_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lg-ses-secrets
                  key: M365_CLIENT_SECRET
            # Mailbox to poll (e.g. ses-inbox@etzhayyim).
            - name: SES_MAILBOX_UPN
              valueFrom:
                secretKeyRef:
                  name: lg-ses-secrets
                  key: SES_MAILBOX_UPN
            # AT Protocol identity for SES pipeline records.
            - name: SES_ACTOR_DID
              valueFrom:
                secretKeyRef:
                  name: lg-ses-secrets
                  key: SES_ACTOR_DID
            - name: SES_ORG_DID
              valueFrom:
                secretKeyRef:
                  name: lg-ses-secrets
                  key: SES_ORG_DID
            # LLM for extract_details + classify_anken nodes.
            - name: MURAKUMO_BASE_URL
              value: "https://murakumo.etzhayyim.com"
            - name: etzhayyim_LLM_URL
              value: "https://gemma.etzhayyim.com/v1"
            - name: etzhayyim_LLM_MODEL
              value: "gemma-4-e4b-it"
            - name: etzhayyim_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lg-ses-secrets
                  key: etzhayyim_LLM_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 75m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lg-ses
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: lg-ses
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lg-ses
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
