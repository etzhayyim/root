---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: medical-coverage-mcp
  namespace: mitama-udf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: medical-coverage-mcp
  namespace: mitama-udf
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["medical-coverage-ingester"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - medical-coverage-ingester-secrets
      - medical-coverage-mcp-secrets
      - ghcr-pull
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: medical-coverage-mcp
  namespace: mitama-udf
subjects:
  - kind: ServiceAccount
    name: medical-coverage-mcp
    namespace: mitama-udf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: medical-coverage-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-coverage-mcp
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: medical-coverage-mcp
    app.kubernetes.io/component: mcp-control-plane
    app.kubernetes.io/part-of: iryo.etzhayyim.com
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: medical-coverage-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medical-coverage-mcp
    spec:
      serviceAccountName: medical-coverage-mcp
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: mcp
          image: ghcr.io/etzhayyim/medical-coverage-mcp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NAMESPACE
              value: mitama-udf
            - name: CRONJOB_NAME
              value: medical-coverage-ingester
            - name: APP_LABEL
              value: medical-coverage-ingester
            - name: KOTOBA_URL
              valueFrom:
                secretKeyRef:
                  name: medical-coverage-mcp-secrets
                  key: KOTOBA_URL
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: medical-coverage-mcp-secrets
                  key: MCP_AUTH_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: medical-coverage-mcp
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: medical-coverage-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: medical-coverage-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
