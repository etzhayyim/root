apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: const-robotic-assembly
    etzhayyim.com/cell-name: ConstRoboticAssemblyCell
    etzhayyim.com/leader-node: levi
  name: const-robotic-assembly
  namespace: etzhayyim-cells
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: const-robotic-assembly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: const-robotic-assembly
        etzhayyim.com/cell-name: ConstRoboticAssemblyCell
        etzhayyim.com/leader-node: levi
    spec:
      containers:
      - command:
        - python
        - -m
        - kotodama.cell_runner_main
        - --node
        - levi
        - --cell-only
        - ConstRoboticAssemblyCell
        env:
        - name: ETZ_SUBSTRATE
          value: kotoba-datomic
        - name: ETZ_CELL_NAME
          value: ConstRoboticAssemblyCell
        - name: FLEET_TOML
          value: /etc/etzhayyim/fleet.toml
        - name: COUNCIL_FLEET_ATTESTATION_TX_HASH
          value: '0xabcdef1234567890'
        image: ghcr.io/etzhayyim/kotodama:main
        name: cell
        volumeMounts:
        - mountPath: /etc/etzhayyim
          name: fleet-config
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: levinomac-mini.local
      volumes:
      - configMap:
          name: fleet-config
        name: fleet-config
