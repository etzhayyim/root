apiVersion: v1
kind: Service
metadata:
  name: public-fund-grant-cell
  namespace: etzhayyim-cells
  labels:
    app.kubernetes.io/name: public-fund-grant-cell
    app.kubernetes.io/component: religious-corp-cell
    app.kubernetes.io/part-of: etzhayyim-religious-corp
    etzhayyim.com/cell-name: PublicFundGrantCell
    etzhayyim.com/leader-node: zebulun
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: public-fund-grant-cell
  ports:
    - name: runner-healthz
      port: 13000
      targetPort: runner-healthz
      protocol: TCP
    - name: cell-healthz
      port: 13010
      targetPort: cell-healthz
      protocol: TCP
