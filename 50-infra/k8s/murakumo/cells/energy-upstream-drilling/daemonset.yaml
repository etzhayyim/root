apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: energy-upstream-drilling
    etzhayyim.com/cell-name: EnergyUpstreamDrillingCell
    etzhayyim.com/leader-node: naphtali
  name: energy-upstream-drilling
  namespace: etzhayyim-cells
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: energy-upstream-drilling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: energy-upstream-drilling
        etzhayyim.com/cell-name: EnergyUpstreamDrillingCell
        etzhayyim.com/leader-node: naphtali
    spec:
      containers:
      - command:
        - python
        - -m
        - kotodama.cell_runner_main
        - --node
        - naphtali
        - --cell-only
        - EnergyUpstreamDrillingCell
        env:
        - name: ETZ_SUBSTRATE
          value: kotoba-datomic
        - name: ETZ_CELL_NAME
          value: EnergyUpstreamDrillingCell
        - name: FLEET_TOML
          value: /etc/etzhayyim/fleet.toml
        - name: COUNCIL_FLEET_ATTESTATION_TX_HASH
          value: '0xabcdef1234567890'
        image: ghcr.io/etzhayyim/kotodama:main
        name: cell
        volumeMounts:
        - mountPath: /etc/etzhayyim
          name: fleet-config
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: naphtalinomac-mini.local
      volumes:
      - configMap:
          name: fleet-config
        name: fleet-config
