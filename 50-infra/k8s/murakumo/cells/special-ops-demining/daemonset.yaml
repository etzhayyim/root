apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: special-ops-demining
    etzhayyim.com/cell-name: SpecialOpsDeminingCell
    etzhayyim.com/leader-node: asher
  name: special-ops-demining
  namespace: etzhayyim-cells
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: special-ops-demining
  template:
    metadata:
      labels:
        app.kubernetes.io/name: special-ops-demining
        etzhayyim.com/cell-name: SpecialOpsDeminingCell
        etzhayyim.com/leader-node: asher
    spec:
      containers:
      - command:
        - python
        - -m
        - kotodama.cell_runner_main
        - --node
        - asher
        - --cell-only
        - SpecialOpsDeminingCell
        env:
        - name: ETZ_SUBSTRATE
          value: kotoba-datomic
        - name: ETZ_CELL_NAME
          value: SpecialOpsDeminingCell
        - name: FLEET_TOML
          value: /etc/etzhayyim/fleet.toml
        - name: COUNCIL_FLEET_ATTESTATION_TX_HASH
          value: '0xabcdef1234567890'
        image: ghcr.io/etzhayyim/kotodama:main
        name: cell
        volumeMounts:
        - mountPath: /etc/etzhayyim
          name: fleet-config
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: ashernomac-mini.local
      volumes:
      - configMap:
          name: fleet-config
        name: fleet-config
