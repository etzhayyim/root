apiVersion: v1
kind: Service
metadata:
  name: force-authorization-cell
  namespace: etzhayyim-cells
  labels:
    app.kubernetes.io/name: force-authorization-cell
    app.kubernetes.io/component: religious-corp-cell
    app.kubernetes.io/part-of: etzhayyim-religious-corp
    etzhayyim.com/cell-name: ForceAuthorizationCell
    etzhayyim.com/leader-node: benjamin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: force-authorization-cell
  ports:
    - name: runner-healthz
      port: 13000
      targetPort: runner-healthz
      protocol: TCP
    - name: cell-healthz
      port: 13012
      targetPort: cell-healthz
      protocol: TCP
