apiVersion: v1
kind: Service
metadata:
  name: council-deliberation-cell
  namespace: etzhayyim-cells
  labels:
    app.kubernetes.io/name: council-deliberation-cell
    app.kubernetes.io/component: religious-corp-cell
    app.kubernetes.io/part-of: etzhayyim-religious-corp
    etzhayyim.com/cell-name: CouncilDeliberationCell
    etzhayyim.com/leader-node: levi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: council-deliberation-cell
  ports:
    - name: runner-healthz
      port: 13000
      targetPort: runner-healthz
      protocol: TCP
    - name: cell-healthz
      port: 15000
      targetPort: cell-healthz
      protocol: TCP
