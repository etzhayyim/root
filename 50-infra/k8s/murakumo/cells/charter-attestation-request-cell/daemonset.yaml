apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: charter-attestation-request-cell
  namespace: etzhayyim-cells
  labels:
    app.kubernetes.io/name: charter-attestation-request-cell
    app.kubernetes.io/component: religious-corp-cell
    app.kubernetes.io/part-of: etzhayyim-religious-corp
    etzhayyim.com/cell-name: CharterAttestationRequestCell
    etzhayyim.com/leader-node: naphtali
  annotations:
    etzhayyim.com/leader-node: naphtali
    etzhayyim.com/leader-hostname: naphtalinomac-mini.local
    etzhayyim.com/trigger: mst-listener
    etzhayyim.com/healthz-port: '13001'
    etzhayyim.com/listens-to: ai.gftd.apps.etzhayyim.charter-attestation-request
    etzhayyim.com/adr: 2605192230,2605192200
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: charter-attestation-request-cell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: charter-attestation-request-cell
        app.kubernetes.io/component: religious-corp-cell
        app.kubernetes.io/part-of: etzhayyim-religious-corp
        etzhayyim.com/cell-name: CharterAttestationRequestCell
        etzhayyim.com/leader-node: naphtali
    spec:
      serviceAccountName: charter-attestation-request-cell
      nodeSelector:
        kubernetes.io/hostname: orbstack
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: cell
          image: ghcr.io/etzhayyim/pymagatama:main
          imagePullPolicy: Always
          command:
            - python
            - -m
            - pymagatama.cell_runner_main
            - --node
            - naphtali
            - --cell-only
            - CharterAttestationRequestCell
          env:
            - name: ETZ_SUBSTRATE
              value: yatachain
            - name: ETZ_CHECKPOINTER_SOCKET
              value: /run/etzhayyim/checkpointer.sock
            - name: ETZ_CELL_NAME
              value: CharterAttestationRequestCell
            - name: FLEET_TOML
              value: /repo/50-infra/murakumo/fleet.toml
            - name: ETZ_REPO
              value: /repo
          ports:
            - name: healthz
              containerPort: 13001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: repo
              mountPath: /repo
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: repo
          hostPath:
            path: /Users/junkawasaki/github/etzhayyim-root
            type: Directory
