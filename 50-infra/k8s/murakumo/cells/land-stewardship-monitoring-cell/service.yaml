apiVersion: v1
kind: Service
metadata:
  name: land-stewardship-monitoring-cell
  namespace: etzhayyim-cells
  labels:
    app.kubernetes.io/name: land-stewardship-monitoring-cell
    app.kubernetes.io/component: religious-corp-cell
    app.kubernetes.io/part-of: etzhayyim-religious-corp
    etzhayyim.com/cell-name: LandStewardshipMonitoringCell
    etzhayyim.com/leader-node: simeon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: land-stewardship-monitoring-cell
  ports:
    - name: runner-healthz
      port: 13000
      targetPort: runner-healthz
      protocol: TCP
    - name: cell-healthz
      port: 13005
      targetPort: cell-healthz
      protocol: TCP
