apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: maritime-vessel-nav
    etzhayyim.com/cell-name: MaritimeVesselNavCell
    etzhayyim.com/leader-node: zebulun
  name: maritime-vessel-nav
  namespace: etzhayyim-cells
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: maritime-vessel-nav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maritime-vessel-nav
        etzhayyim.com/cell-name: MaritimeVesselNavCell
        etzhayyim.com/leader-node: zebulun
    spec:
      containers:
      - command:
        - python
        - -m
        - kotodama.cell_runner_main
        - --node
        - zebulun
        - --cell-only
        - MaritimeVesselNavCell
        env:
        - name: ETZ_SUBSTRATE
          value: kotoba-datomic
        - name: ETZ_CELL_NAME
          value: MaritimeVesselNavCell
        - name: FLEET_TOML
          value: /etc/etzhayyim/fleet.toml
        - name: COUNCIL_FLEET_ATTESTATION_TX_HASH
          value: '0xabcdef1234567890'
        image: ghcr.io/etzhayyim/kotodama:main
        name: cell
        volumeMounts:
        - mountPath: /etc/etzhayyim
          name: fleet-config
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: zebulunnomac-mini.local
      volumes:
      - configMap:
          name: fleet-config
        name: fleet-config
