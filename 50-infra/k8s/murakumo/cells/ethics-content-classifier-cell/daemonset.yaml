apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ethics-content-classifier-cell
  namespace: etzhayyim-cells
  labels:
    app.kubernetes.io/name: ethics-content-classifier-cell
    app.kubernetes.io/component: religious-corp-cell
    app.kubernetes.io/part-of: etzhayyim-religious-corp
    etzhayyim.com/cell-name: EthicsContentClassifierCell
    etzhayyim.com/leader-node: benjamin
  annotations:
    etzhayyim.com/leader-node: benjamin
    etzhayyim.com/leader-hostname: benjaminomac-mini.local
    etzhayyim.com/trigger: synchronous API
    etzhayyim.com/healthz-port: '13014'
    etzhayyim.com/adr: 2605192400,2605202345
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ethics-content-classifier-cell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ethics-content-classifier-cell
        app.kubernetes.io/component: religious-corp-cell
        app.kubernetes.io/part-of: etzhayyim-religious-corp
        etzhayyim.com/cell-name: EthicsContentClassifierCell
        etzhayyim.com/leader-node: benjamin
    spec:
      serviceAccountName: ethics-content-classifier-cell
      nodeSelector:
        kubernetes.io/hostname: benjaminomac-mini.local
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: cell
          image: ghcr.io/etzhayyim/pymagatama:main
          imagePullPolicy: Always
          command:
            - python
            - -m
            - pymagatama.cell_runner_main
            - --node
            - benjamin
            - --cell-only
            - EthicsContentClassifierCell
          env:
            - name: ETZ_SUBSTRATE
              value: kotoba-datomic
            - name: ETZ_CHECKPOINTER_SOCKET
              value: /run/etzhayyim/checkpointer.sock
            - name: ETZ_CELL_NAME
              value: EthicsContentClassifierCell
            - name: ETZHAYYIM_LOG_DIR
              value: /tmp/etzhayyim/log
            - name: ETZ_HEALTHZ_BIND
              value: 0.0.0.0
            - name: FLEET_TOML
              value: /etc/etzhayyim/fleet.toml
          ports:
            - name: runner-healthz
              containerPort: 13000
              protocol: TCP
            - name: cell-healthz
              containerPort: 13014
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: runner-healthz
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: runner-healthz
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: fleet-config
              mountPath: /etc/etzhayyim
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: fleet-config
          configMap:
            name: fleet-config
            items:
              - key: fleet.toml
                path: fleet.toml
