apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: power-grid-robotics
    etzhayyim.com/cell-name: PowerGridRoboticsCell
    etzhayyim.com/leader-node: judah
  name: power-grid-robotics
  namespace: etzhayyim-cells
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: power-grid-robotics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: power-grid-robotics
        etzhayyim.com/cell-name: PowerGridRoboticsCell
        etzhayyim.com/leader-node: judah
    spec:
      containers:
      - command:
        - python
        - -m
        - kotodama.cell_runner_main
        - --node
        - judah
        - --cell-only
        - PowerGridRoboticsCell
        env:
        - name: ETZ_SUBSTRATE
          value: kotoba-datomic
        - name: ETZ_CELL_NAME
          value: PowerGridRoboticsCell
        - name: FLEET_TOML
          value: /etc/etzhayyim/fleet.toml
        - name: COUNCIL_FLEET_ATTESTATION_TX_HASH
          value: '0xabcdef1234567890'
        image: ghcr.io/etzhayyim/kotodama:main
        name: cell
        volumeMounts:
        - mountPath: /etc/etzhayyim
          name: fleet-config
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: judahnomac-mini.local
      volumes:
      - configMap:
          name: fleet-config
        name: fleet-config
