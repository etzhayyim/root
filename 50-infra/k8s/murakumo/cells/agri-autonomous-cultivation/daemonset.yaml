apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: agri-autonomous-cultivation
    etzhayyim.com/cell-name: AgriAutonomousCultivationCell
    etzhayyim.com/leader-node: simeon
  name: agri-autonomous-cultivation
  namespace: etzhayyim-cells
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agri-autonomous-cultivation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agri-autonomous-cultivation
        etzhayyim.com/cell-name: AgriAutonomousCultivationCell
        etzhayyim.com/leader-node: simeon
    spec:
      containers:
      - command:
        - python
        - -m
        - pymagatama.cell_runner_main
        - --node
        - simeon
        - --cell-only
        - AgriAutonomousCultivationCell
        env:
        - name: ETZ_SUBSTRATE
          value: kotoba-datomic
        - name: ETZ_CELL_NAME
          value: AgriAutonomousCultivationCell
        - name: FLEET_TOML
          value: /etc/etzhayyim/fleet.toml
        - name: COUNCIL_FLEET_ATTESTATION_TX_HASH
          value: '0xabcdef1234567890'
        image: ghcr.io/etzhayyim/pymagatama:main
        name: cell
        volumeMounts:
        - mountPath: /etc/etzhayyim
          name: fleet-config
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: simeonnomac-mini.local
      volumes:
      - configMap:
          name: fleet-config
        name: fleet-config
