apiVersion: v1
kind: Service
metadata:
  name: site-survey-cell
  namespace: etzhayyim-cells
  labels:
    app.kubernetes.io/name: site-survey-cell
    app.kubernetes.io/component: religious-corp-cell
    app.kubernetes.io/part-of: etzhayyim-religious-corp
    etzhayyim.com/cell-name: SiteSurveyCell
    etzhayyim.com/leader-node: naphtali
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: site-survey-cell
  ports:
    - name: runner-healthz
      port: 13000
      targetPort: runner-healthz
      protocol: TCP
    - name: cell-healthz
      port: 13017
      targetPort: cell-healthz
      protocol: TCP
