apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: maritime-port-crane
    etzhayyim.com/cell-name: MaritimePortCraneCell
    etzhayyim.com/leader-node: issachar
  name: maritime-port-crane
  namespace: etzhayyim-cells
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: maritime-port-crane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maritime-port-crane
        etzhayyim.com/cell-name: MaritimePortCraneCell
        etzhayyim.com/leader-node: issachar
    spec:
      containers:
      - command:
        - python
        - -m
        - pymagatama.cell_runner_main
        - --node
        - issachar
        - --cell-only
        - MaritimePortCraneCell
        env:
        - name: ETZ_SUBSTRATE
          value: kotoba-datomic
        - name: ETZ_CELL_NAME
          value: MaritimePortCraneCell
        - name: FLEET_TOML
          value: /etc/etzhayyim/fleet.toml
        - name: COUNCIL_FLEET_ATTESTATION_TX_HASH
          value: '0xabcdef1234567890'
        image: ghcr.io/etzhayyim/pymagatama:main
        name: cell
        volumeMounts:
        - mountPath: /etc/etzhayyim
          name: fleet-config
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: issacharnomac-mini.local
      volumes:
      - configMap:
          name: fleet-config
        name: fleet-config
