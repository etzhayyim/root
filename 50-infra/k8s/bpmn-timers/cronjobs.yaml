---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etzhayyim-apps-maps-bulkrefreshgtfsjp
  namespace: bpmn-timers
  labels:
    app.kubernetes.io/name: etzhayyim-apps-maps-bulkrefreshgtfsjp
    etzhayyim.com/bpmn-process: maps_bulk_refresh_gtfs_jp
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        spec:
          tolerations:
            - key: workload
              operator: Equal
              value: osm-ingest
              effect: NoSchedule
          containers:
            - name: trigger
              image: curlimages/curl:8.6.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - curl -X POST -sS -o /dev/null -w '%{http_code}\n' http://bpmn-dispatcher.mitama-udf.svc.cluster.local:8080/xrpc/com.etzhayyim.apps.maps.bulkRefreshGtfsJp
          restartPolicy: OnFailure
---
