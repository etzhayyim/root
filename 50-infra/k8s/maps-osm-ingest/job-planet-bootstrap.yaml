---
# Planet PBF first-run bootstrap (~80 GB input, ~4-5 TB Kotoba/Datomic projection,
# ~18-36h wallclock on vc2-8c-32gb). Weekly refreshes go via cronjob.yaml.
#
# Prerequisites:
#   - ghcr.io/etzhayyim/maps-osm-ingest:latest pushed
#   - maps-osm-ingest-secrets { KOTOBA_URL } in `maps` namespace
#   - osm-ingest node pool running (label workload=osm-ingest,
#     taint workload=osm-ingest:NoSchedule) — Vultr vc2-8c-32gb persistent pool
#
# OOM fix (2026-05-14): batch-size 200k→10k, parallelism 12→6,
# dml-rate-limit added. Resources sized for vc2-8c-32gb (8 vCPU / 32Gi).
# Idempotent: restart-safe via DELETE+INSERT at merge checkpoint.
#
# Trigger:
#   kubectl apply -f job-planet-bootstrap.yaml
#   kubectl -n maps logs -f job/maps-osm-ingest-planet-bootstrap
apiVersion: batch/v1
kind: Job
metadata:
  name: maps-osm-ingest-planet-bootstrap
  namespace: maps
  labels:
    app.kubernetes.io/name: maps-osm-ingest
    app.kubernetes.io/part-of: maps.etzhayyim.com
    maps.etzhayyim.com/phase: planet-bootstrap
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 129600  # 36h hard cap (vc2-8c-32gb, conservative)
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maps-osm-ingest
        maps.etzhayyim.com/phase: planet-bootstrap
    spec:
      serviceAccountName: maps-osm-ingest
      imagePullSecrets:
        - name: ghcr-creds
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 300
      tolerations:
        - key: workload
          operator: Equal
          value: osm-ingest
          effect: NoSchedule
      nodeSelector:
        workload: osm-ingest
      # Use cluster-default DNS (Vultr VKE CoreDNS).
      dnsPolicy: ClusterFirst
      containers:
        - name: ingest
          image: ghcr.io/etzhayyim/maps-osm-ingest:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--pbf-url"
            - "https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf"
            - "--db"
            - "$(KOTOBA_URL)"
            - "--source-did"
            - "did:web:maps.etzhayyim.com:planet"
            - "--batch-size"
            - "10000"
            - "--parallelism"
            - "6"
            - "--dml-rate-limit"
            - "100000"
            - "--scratch-dir"
            - "/scratch"
          env:
            - name: RUST_LOG
              value: "info,maps_osm_ingest=info,tokio_postgres=warn"
            - name: KOTOBA_URL
              valueFrom:
                secretKeyRef:
                  name: maps-osm-ingest-secrets
                  key: KOTOBA_URL
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
              ephemeral-storage: "100Gi"
            limits:
              cpu: "7"
              memory: "14Gi"          # fits within vc2-8c-32gb (32 GiB node)
              ephemeral-storage: "120Gi"
          volumeMounts:
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 120Gi
