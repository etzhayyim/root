---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maps-osm-ingest
  namespace: maps
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maps-osm-ingest
  namespace: maps
  labels:
    app.kubernetes.io/name: maps-osm-ingest
    app.kubernetes.io/part-of: maps.etzhayyim.com
spec:
  # Weekly full replace, Sunday 03:00 UTC.
  schedule: "0 3 * * 0"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 129600   # 36h hard cap (vc2-8c-32gb)
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: maps-osm-ingest
        spec:
          serviceAccountName: maps-osm-ingest
          imagePullSecrets:
            - name: ghcr-creds
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 300
          tolerations:
            - key: workload
              operator: Equal
              value: osm-ingest
              effect: NoSchedule
          nodeSelector:
            workload: osm-ingest
          dnsPolicy: ClusterFirst
          containers:
            - name: ingest
              image: ghcr.io/etzhayyim/maps-osm-ingest:latest
              imagePullPolicy: IfNotPresent
              args:
                - "--pbf-url"
                - "https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf"
                - "--db"
                - "$(KOTOBA_URL)"
                - "--source-did"
                - "did:web:maps.etzhayyim.com:planet"
                - "--batch-size"
                - "10000"
                - "--parallelism"
                - "4"
                - "--dml-rate-limit"
                - "100000"
                - "--scratch-dir"
                - "/scratch"
              env:
                - name: RUST_LOG
                  value: "info,maps_osm_ingest=info,tokio_postgres=warn"
                - name: KOTOBA_URL
                  valueFrom:
                    secretKeyRef:
                      name: maps-osm-ingest-secrets
                      key: KOTOBA_URL
              resources:
                requests:
                  cpu: "4"
                  memory: "8Gi"
                  ephemeral-storage: "100Gi"
                limits:
                  cpu: "7"
                  memory: "14Gi"
                  ephemeral-storage: "120Gi"
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
          volumes:
            - name: scratch
              emptyDir:
                sizeLimit: 120Gi
