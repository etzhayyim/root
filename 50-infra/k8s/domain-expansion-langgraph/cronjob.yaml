---
# domain-expansion-langgraph CronJob
#
# Replaces expandDomainCoverage() in 50-infra/cloudflare/workers/atproto/src/app.ts
# (broken since ADR-2605111200 removed env.HYPERDRIVE from CF Workers).
#
# One domain per tick:
#   START -> expand -> END
#   expand calls kotodama.ingest.domain_expansion.expand_one_domain()
#   which: gap query RW → context fetch → LLM classify → PDS writes
#
# Schedule: every 15 minutes.
# Namespace: mitama-udf (shares mitama-udf-pool-rw and pds-service-auth-mint secrets)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: domain-expansion-ticker
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: domain-expansion-ticker
    app.kubernetes.io/component: langgraph-cronjob
    app.kubernetes.io/part-of: pds
spec:
  # RETIRED 2026-07-17: RW_URL residue from the 2026-05-17 gftdcojp org split.
  # RisingWave was org-wide retired 2026-06-11 (ADR-2606120900/2606120930).
  # Suspended — see ADR-2605191648 addendum 2026-07-17.
  suspend: true
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: domain-expansion-ticker
            app.kubernetes.io/component: langgraph-cronjob
        spec:
          restartPolicy: Never
          tolerations:
            - key: workload
              operator: Equal
              value: osm-ingest
              effect: NoSchedule
          imagePullSecrets:
            - name: ghcr-creds
          containers:
            - name: expand
              image: ghcr.io/etzhayyim/kotodama:domain-expansion-abe4017bac0-20260514080645-amd64
              imagePullPolicy: IfNotPresent
              env:
                - name: RW_URL
                  valueFrom:
                    secretKeyRef:
                      name: mitama-udf-pool-rw
                      key: RW_URL
                - name: PDS_INTERNAL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: pds-service-auth-mint
                      key: secret
                - name: ATPROTO_BASE_URL
                  value: "http://atproto-pds.atproto.svc.cluster.local:8787"
                - name: OPENROUTER_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lg-pregel-secrets
                      key: OPENROUTER_API_KEY
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              command: ["python", "-c"]
              args:
                - |
                  import asyncio, json
                  from typing import Any, TypedDict

                  from langgraph.graph import StateGraph, START, END

                  from kotodama.ingest.domain_expansion import expand_one_domain


                  class ExpandState(TypedDict, total=False):
                      result: dict


                  async def expand_node(state: ExpandState) -> dict:
                      result = await expand_one_domain()
                      return {"result": result}


                  def build_graph():
                      g = StateGraph(ExpandState)
                      g.add_node("expand", expand_node)
                      g.add_edge(START, "expand")
                      g.add_edge("expand", END)
                      return g.compile()


                  async def main() -> None:
                      graph = build_graph()
                      state = await graph.ainvoke({})
                      result = state.get("result") or {}
                      print(
                          json.dumps(
                              {"event": "domain_expansion_cycle", **result},
                              ensure_ascii=False,
                              sort_keys=True,
                          )
                      )
                      if not result.get("ok", True):
                          raise SystemExit(1)


                  asyncio.run(main())
