name = "karute-did-web"
main = "src/worker.ts"
compatibility_date = "2026-05-23"

# Routes karute.etzhayyim.com — splits between:
#   - /.well-known/did.json    → DID Document (local, application/did+json)
#   - /xrpc/*                  → proxied to karu7t3e.etzhayyim.com (LangServer Pod)
#   - everything else          → static Svelte bundle (Cloudflare Pages binding)
[[routes]]
pattern = "karute.etzhayyim.com/*"
zone_name = "etzhayyim.com"

# The XRPC subdomain (nanoid-based, per actor convention) is bound directly
# to the LangServer Pod by a separate ingress (CF Tunnel → k3s Service);
# this Worker only catches the karute.etzhayyim.com vanity domain.

[vars]
# XRPC origin reachable from this Worker. Either a CF Tunnel hostname or a
# managed LoadBalancer fronted by ingress-nginx-dispatcher. Empty = Worker
# returns a clean 503 UpstreamNotConfigured instead of an HTML 530.
XRPC_KARUTE_UPSTREAM = ""

# Static asset origin (Cloudflare Pages) where the Svelte bundle is deployed.
# Set after `wrangler pages deploy dist/` lands the project.
KARUTE_STATIC_UPSTREAM = ""

[observability]
enabled = true
head_sampling_rate = 1.0

[placement]
mode = "smart"
