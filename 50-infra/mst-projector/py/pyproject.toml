[project]
name = "mst-projector"
version = "0.0.0"
description = "AT Protocol MST firehose subscriber → LanceDB indexed views (Phase 3, ADR-2605215500)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "cbor2>=5.6",
    "etzhayyim-sdk>=0.0",
    "httpx[asyncio]>=0.27",
    "lancedb>=0.6",
    "typing-extensions>=4.10",
    "websockets>=13.0",
]

[project.scripts]
mst-projector = "mst_projector.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mst_projector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
etzhayyim-sdk = { path = "../../../20-actors/etzhayyim-sdk-py", editable = true }
