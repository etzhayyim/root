name = "etzhayyim-esign-did-web"
main = "src/worker.ts"
compatibility_date = "2026-05-23"

# Route the spec-required did:web resolution path. No other paths exist
# on esign.etzhayyim.com via this Worker — the etzhayyim-esign runtime
# Worker (orgs/etzhayyim/com-etzhayyim-esign/) terminates all other paths once
# the zone DNS record is provisioned and a route binding is added
# (Phase 1).
[[routes]]
pattern = "esign.etzhayyim.com/.well-known/did.json"
zone_name = "etzhayyim.com"

[observability]
enabled = true
head_sampling_rate = 1.0

[placement]
mode = "smart"
