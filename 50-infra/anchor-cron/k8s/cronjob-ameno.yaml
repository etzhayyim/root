# anchor-cron-ameno — Base L2 anchor CronJob for ameno cell state.
#
# Mirror of cronjob.yaml (lg-uhl-right-neural) for the ameno cell DID.
# Reads pending anchors from the lg-ameno Pod's checkpointer-socket via
# hostPath, batches them, submits to EtzhayyimAnchor on Base L2, writes
# receipts back through the same socket. ADR-2605191625.
#
# Pre-requisites identical to anchor-cron-uhl:
#   1. lg-ameno Deployment running with the checkpointer sidecar.
#   2. EtzhayyimAnchor deployed at deps.toml [platform.l2.anchor_contract].
#   3. Funded signer key in Secret `anchor-cron-signer-ameno`.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: anchor-cron-ameno
  namespace: etzhayyim-langserver
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: anchor-cron-ameno
  namespace: etzhayyim-langserver
  labels:
    app.kubernetes.io/name: anchor-cron
    app.kubernetes.io/component: l2-anchor-cron
    app.kubernetes.io/part-of: ameno.etzhayyim.com
spec:
  # 15-minute cadence, same as anchor-cron-uhl. Tune after measuring
  # actual brief throughput once Stage 3 IPFS pin is healthy.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: anchor-cron
        spec:
          serviceAccountName: anchor-cron-ameno
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # Co-locate on the same node as lg-ameno so hostPath socket
          # access is local.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - lg-ameno
                  topologyKey: kubernetes.io/hostname
          nodeSelector:
            etzhayyim.com/role: "murakumo-host"
          tolerations:
            - key: "murakumo.etzhayyim.com/virtual-kubelet"
              operator: "Exists"
              effect: "NoSchedule"
          containers:
            - name: anchor-cron
              image: ghcr.io/etzhayyim/anchor-cron:main
              imagePullPolicy: Always
              env:
                - name: ETZ_ANCHOR_SOCKET
                  value: "/run/etzhayyim/checkpointer.sock"
                - name: ETZ_ANCHOR_CELL_DIDS
                  value: "did:web:ameno.etzhayyim.com"
                - name: ETZ_ANCHOR_CONTRACT
                  # Replace with the deployed EtzhayyimAnchor address per
                  # `deps.toml [platform.l2.anchor_contract]`. Default is
                  # the testnet placeholder.
                  value: "0x5fbdb2315678afecb367f032d93f642f64180aa3"
                - name: ETZ_ANCHOR_RPC_URL
                  value: "https://sepolia.base.org"
                - name: ETZ_ANCHOR_CONFIRMATIONS
                  value: "3"
                - name: ETZ_ANCHOR_BATCH_MAX
                  value: "10"
                - name: ETZ_ANCHOR_WARN_BALANCE_WEI
                  value: "10000000000000000"  # 0.01 ETH
                - name: ETZ_ANCHOR_SIGNER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: anchor-cron-signer-ameno
                      key: key
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "500m"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: checkpointer-socket
                  mountPath: /run/etzhayyim
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: checkpointer-socket
              # Node-local hostPath to the same socket the lg-ameno
              # checkpointer sidecar writes. Aligns with the lg-uhl
              # production pattern; review the original cronjob.yaml
              # top-of-file comment for the (a)/(b) trade-off.
              hostPath:
                path: /var/run/etzhayyim
                type: DirectoryOrCreate
