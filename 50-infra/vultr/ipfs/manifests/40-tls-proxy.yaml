# caddy TLS proxy in front of kubo gateway (mirrors geth-private/40-tls-proxy.yaml).
#
# Cloudflare Workers fetch() can only target standard HTTP ports (80, 443,
# 8080, 8443, ...). Worker → Vultr LB :443 → caddy :8443 → kubo gateway :8080.
# CF zone SSL mode is "Full" (not strict), so caddy serves a self-signed cert
# generated by `tls internal` (or a 10-year leaf provisioned via the
# `caddy-ipfs-cert` Secret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-ipfs-config
  namespace: ipfs
data:
  Caddyfile: |
    {
      auto_https off
    }

    https://ipfs-origin.etzhayyim.com:8443 {
      tls /tls/tls.crt /tls/tls.key
      reverse_proxy http://kubo.ipfs.svc.cluster.local:8080 {
        # Strip any caller-supplied auth header; HMAC enforcement happens at
        # the CF Worker (etzhayyim-ipfs-proxy), never trust upstream-of-proxy.
        header_up -X-etzhayyim-Ipfs-Auth
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-ipfs-tls
  namespace: ipfs
  labels:
    app.kubernetes.io/name: caddy-ipfs-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy-ipfs-tls
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy-ipfs-tls
    spec:
      containers:
        - name: caddy
          image: caddy:2.8.4-alpine
          args: ["caddy", "run", "--config", "/config/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - { name: tls, containerPort: 8443 }
          readinessProbe:
            tcpSocket: { port: tls }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 25m,  memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: config,     mountPath: /config }
            - { name: caddy-data, mountPath: /data }
            - { name: tls,        mountPath: /tls,    readOnly: true }
      volumes:
        - name: config
          configMap:
            name: caddy-ipfs-config
            items: [{ key: Caddyfile, path: Caddyfile }]
        - name: caddy-data
          emptyDir: {}
        - name: tls
          secret:
            secretName: caddy-ipfs-cert
            defaultMode: 0o400
---
apiVersion: v1
kind: Service
metadata:
  name: caddy-ipfs-tls
  namespace: ipfs
  annotations:
    service.beta.kubernetes.io/vultr-loadbalancer-protocol: "tcp"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: caddy-ipfs-tls
  ports:
    - { name: tls, port: 443, targetPort: tls, protocol: TCP }
