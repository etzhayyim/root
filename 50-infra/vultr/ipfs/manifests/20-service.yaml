# Cluster-internal Services for kubo. The gateway and API are ClusterIP only;
# external traffic enters via 40-tls-proxy.yaml (caddy → Vultr LB :443).
# The headless Service `kubo-headless` backs the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: kubo-headless
  namespace: ipfs
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kubo
  ports:
    - { name: gateway, port: 8080, targetPort: gateway, protocol: TCP }
    - { name: api,     port: 5001, targetPort: api,     protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: kubo
  namespace: ipfs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubo
  ports:
    - { name: gateway, port: 8080, targetPort: gateway, protocol: TCP }
    - { name: api,     port: 5001, targetPort: api,     protocol: TCP }
---
# Public swarm. NodePort 30401 on every node + Vultr firewall rule.
# Phase 1.5 will move this behind a TCP LoadBalancer once we measure
# how many real peers we attract.
apiVersion: v1
kind: Service
metadata:
  name: kubo-swarm
  namespace: ipfs
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kubo
  ports:
    - { name: swarm,   port: 4001, targetPort: swarm,   nodePort: 30401, protocol: TCP }
    - { name: swarm-q, port: 4001, targetPort: swarm-q, nodePort: 30401, protocol: UDP }
