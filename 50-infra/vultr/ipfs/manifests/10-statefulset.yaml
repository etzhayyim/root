# Kubo (go-ipfs) on Vultr VKE — ADR-2604261936.
#
# Block data → B2 (s3ds plugin), metadata + identity → 40 Gi PVC. Single
# replica for Phase 1; Phase 2 introduces a second replica + IPFS Cluster
# coordination.
#
# The `ipfs-init-config` ConfigMap (init-config.sh + datastore_spec.json) is
# created by apply.sh `kubectl create configmap --from-file` rather than
# inlined here — keeping it out of this manifest avoids server-side-apply
# overwriting the file content with a placeholder.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubo
  namespace: ipfs
  labels:
    app.kubernetes.io/name: kubo
    app.kubernetes.io/version: "0.31.0"
spec:
  serviceName: kubo-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubo
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-config
          # Phase 1 datastore_spec is literal flatfs JSON (no $-vars), so the
          # init container just stages it into /work for the kubo container's
          # init-config.sh to consume. Phase 1.5 will reintroduce envsubst
          # for the s3ds spec.
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - cp /init/datastore_spec.json /work/datastore_spec.json
          volumeMounts:
            - { name: init-config, mountPath: /init }
            - { name: rendered-config, mountPath: /work }
      containers:
        - name: kubo
          image: ipfs/kubo:v0.31.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          # Run the on-pod init script (which itself is idempotent) then
          # exec the kubo entrypoint daemon. The init script reads the
          # rendered datastore_spec from /work and the live keys from env.
          args:
            - |
              cp /init/init-config.sh /usr/local/bin/init-config.sh
              chmod +x /usr/local/bin/init-config.sh
              export DATASTORE_SPEC=/work/datastore_spec.json
              /usr/local/bin/init-config.sh
              exec /usr/local/bin/start_ipfs daemon --migrate=true --routing=dhtclient
          env:
            - { name: IPFS_PATH, value: /data/ipfs }
            # Phase 1 = flatfs only, so B2 keys are not bound to this container.
            # The `kubo-b2` Secret is still provisioned by apply.sh and stays
            # ready for Phase 1.5 (custom kubo-s3ds image with go-ds-s3 baked in).
          ports:
            - { name: gateway, containerPort: 8080, protocol: TCP }
            - { name: api,     containerPort: 5001, protocol: TCP }
            - { name: swarm,   containerPort: 4001, protocol: TCP }
            - { name: swarm-q, containerPort: 4001, protocol: UDP }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 1Gi }
          readinessProbe:
            # Every /api/v0/* endpoint requires POST (Kubo returns 405 to GET),
            # and kubelet httpGet only emits GET. Use a TCP socket probe on the
            # gateway port — once the daemon prints "Gateway server listening"
            # the port accepts connections.
            tcpSocket: { port: gateway }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            tcpSocket: { port: gateway }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: kubo-repo, mountPath: /data/ipfs }
            - { name: init-config, mountPath: /init, readOnly: true }
            - { name: rendered-config, mountPath: /work, readOnly: true }
      volumes:
        - name: init-config
          configMap:
            name: ipfs-init-config
            items:
              - { key: init-config.sh,      path: init-config.sh,      mode: 0o555 }
              - { key: datastore_spec.json, path: datastore_spec.json, mode: 0o444 }
        - name: rendered-config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: kubo-repo
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: vultr-block-storage-hdd-retain
        resources:
          requests:
            # Vultr block storage minimum is 40 GiB (sub-40 requests fail with
            # "Invalid size - Must be between 40GB and 40000GB"). Kubo's
            # metadata footprint is well under 1 GiB; the rest is headroom.
            storage: 40Gi
