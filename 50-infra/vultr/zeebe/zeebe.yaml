# Zeebe broker (Camunda/Zeebe 8.5.23) — minimum-footprint deploy on mitama-udf ns.
#
# Pinned at 8.5.23 per ADR-0056: avoid Camunda 8.6+ production licensing.
# zeebe-hazelcast-exporter 1.4.0 fails to serialize PROCESS records on 8.6.x
# (Process.getResource() API changed); downgraded 2026-05-05.
#
# Single-broker, single-partition, replication-factor=1. Embedded gateway
# so external clients hit one Service. No Operate / Tasklist / Elasticsearch
# yet — those land later if we need the UI.
#
# License posture (2026-04-30): Zeebe-only broker remains deployed without
# Operate / Tasklist. Re-evaluate before adding Camunda web applications.
#
# Resource budget (risingwave-pool-58gb node, vhf-16c-58gb):
#   Requests: 3Gi mem / 500m cpu
#   Limits  : 6Gi mem / 2000m cpu
# Raised 2026-04-29: 5×R/PT1M netintel BPMNs OOMKilled broker at 2Gi/-Xmx768m.
# Raised 2026-04-30: CreateProcessInstanceWithResult hit broker timeouts while
# pod RSS sat near the 4Gi limit; add heap/native headroom.
#
# Storage: 5Gi PVC on vultr-block-storage. Zeebe writes partition WAL +
# segment files to /usr/local/zeebe/data. Ephemeral was tempting for the
# pilot but partition data is the source of truth for in-flight processes;
# losing it on pod reschedule is unacceptable.
#
# Access pattern (local dev):
#   kubectl -n mitama-udf port-forward svc/zeebe-gateway 26500:26500
#   zbctl status --address localhost:26500 --insecure
#
# Access pattern (in-cluster workers):
#   pyzeebe.ZeebeClient("zeebe-gateway.mitama-udf.svc:26500")
---
apiVersion: v1
kind: Service
metadata:
  name: zeebe-gateway
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: zeebe
    app.kubernetes.io/component: broker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zeebe
  ports:
    - name: gateway
      port: 26500
      targetPort: 26500
    - name: monitoring
      port: 9600
      targetPort: 9600
---
apiVersion: v1
kind: Service
metadata:
  # Headless service for the StatefulSet's stable per-pod DNS names.
  name: zeebe-broker
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: zeebe
    app.kubernetes.io/component: broker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: zeebe
  ports:
    - name: command
      port: 26501
      targetPort: 26501
    - name: internal
      port: 26502
      targetPort: 26502
    - name: gateway
      port: 26500
      targetPort: 26500
    - name: monitoring
      port: 9600
      targetPort: 9600
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zeebe
  namespace: mitama-udf
  labels:
    app.kubernetes.io/name: zeebe
    app.kubernetes.io/component: broker
spec:
  serviceName: zeebe-broker
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zeebe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeebe
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        # camunda/zeebe official image runs as uid 1001.
        fsGroup: 1001
      # Init container: download hazelcast exporter JAR + patch close() NPE.
      # Patch: HazelcastExporter.close() NOP-ed out (10 bytes → 9×NOP + return).
      # Needed because Zeebe 8.5.23 ExporterRepository.validate() calls close()
      # before open(), causing NPE when this.hazelcast is null.
      initContainers:
        - name: download-hazelcast-exporter
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import urllib.request, zipfile, struct, shutil, sys, os
              url = (
                "https://github.com/camunda-community-hub/zeebe-hazelcast-exporter"
                "/releases/download/1.4.0"
                "/zeebe-hazelcast-exporter-1.4.0-jar-with-dependencies.jar"
              )
              jar_path = "/exporters/zeebe-hazelcast-exporter.jar"
              tmp_path = "/exporters/zeebe-hazelcast-exporter.tmp.jar"
              cls_name = "io/zeebe/hazelcast/exporter/HazelcastExporter.class"
              print("Downloading hazelcast exporter...", flush=True)
              urllib.request.urlretrieve(url, jar_path)
              print("Patching HazelcastExporter.close() using class file parser...", flush=True)
              def patch_close(class_data):
                  data = bytearray(class_data)
                  pos = 8
                  cp_count = struct.unpack_from(">H", data, pos)[0]; pos += 2
                  cp = [None]
                  i = 1
                  while i < cp_count:
                      tag = data[pos]; pos += 1
                      if tag == 1:
                          l = struct.unpack_from(">H", data, pos)[0]; pos += 2
                          cp.append(("U", data[pos:pos+l].decode("utf-8","replace"))); pos += l
                      elif tag in (7,8,16,19,20): cp.append((tag,struct.unpack_from(">H",data,pos)[0])); pos+=2
                      elif tag in (9,10,11,12): cp.append((tag,struct.unpack_from(">HH",data,pos))); pos+=4
                      elif tag in (3,4): cp.append((tag,None)); pos+=4
                      elif tag in (5,6): cp.append((tag,None)); pos+=8; cp.append(None); i+=1
                      elif tag==15: cp.append((tag,None)); pos+=3
                      elif tag==18: cp.append((tag,struct.unpack_from(">HH",data,pos))); pos+=4
                      i+=1
                  pos += 6
                  icount=struct.unpack_from(">H",data,pos)[0]; pos+=2+icount*2
                  def skip_member(p):
                      p+=6
                      ac=struct.unpack_from(">H",data,p)[0]; p+=2
                      for _ in range(ac):
                          p+=2; al=struct.unpack_from(">I",data,p)[0]; p+=4+al
                      return p
                  fc=struct.unpack_from(">H",data,pos)[0]; pos+=2
                  for _ in range(fc): pos=skip_member(pos)
                  mc=struct.unpack_from(">H",data,pos)[0]; pos+=2
                  patched=False
                  for _ in range(mc):
                      mn=cp[struct.unpack_from(">H",data,pos+2)[0]]
                      md=cp[struct.unpack_from(">H",data,pos+4)[0]]
                      pos+=6
                      ac=struct.unpack_from(">H",data,pos)[0]; pos+=2
                      for _ in range(ac):
                          an=cp[struct.unpack_from(">H",data,pos)[0]]
                          al=struct.unpack_from(">I",data,pos+2)[0]; pos+=6
                          if mn and mn[1]=="close" and md and md[1]=="()V" and an and an[1]=="Code":
                              cl=struct.unpack_from(">I",data,pos+4)[0]; cs=pos+8
                              for j in range(cl-1): data[cs+j]=0x00
                              data[cs+cl-1]=0xB1
                              print(f"close()V patched: {cl} bytes at {hex(cs)}", flush=True)
                              patched=True
                          pos+=al
                  if not patched: print("WARNING: close()V not found!", flush=True)
                  return bytes(data)
              with zipfile.ZipFile(jar_path,"r") as zin, zipfile.ZipFile(tmp_path,"w",zipfile.ZIP_DEFLATED) as zout:
                  for info in zin.infolist():
                      raw = zin.read(info.filename)
                      if info.filename == cls_name:
                          raw = patch_close(raw)
                      zout.writestr(info, raw)
              shutil.move(tmp_path, jar_path)
              print("JAR_OK", flush=True)
          volumeMounts:
            - name: exporters
              mountPath: /exporters
      containers:
        - name: zeebe
          image: camunda/zeebe:8.5.23
          imagePullPolicy: IfNotPresent
          ports:
            - { name: gateway,    containerPort: 26500 }
            - { name: command,    containerPort: 26501 }
            - { name: internal,   containerPort: 26502 }
            - { name: monitoring, containerPort: 9600  }
          env:
            # Cluster shape (single-broker pilot).
            - { name: ZEEBE_BROKER_CLUSTER_NODEID,            value: "0" }
            - { name: ZEEBE_BROKER_CLUSTER_PARTITIONSCOUNT,   value: "1" }
            - { name: ZEEBE_BROKER_CLUSTER_REPLICATIONFACTOR, value: "1" }
            - { name: ZEEBE_BROKER_CLUSTER_CLUSTERSIZE,       value: "1" }
            # Network — bind 0.0.0.0 so headless Service reaches the pod.
            - { name: ZEEBE_BROKER_NETWORK_HOST,         value: "0.0.0.0" }
            - { name: ZEEBE_BROKER_GATEWAY_NETWORK_HOST, value: "0.0.0.0" }
            # Embedded gateway — no separate gateway pod for the pilot.
            - { name: ZEEBE_BROKER_GATEWAY_ENABLE, value: "true" }
            # JVM heap — 3Gi heap + native arenas → 6Gi container limit.
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms2g -Xmx3g" }
            - { name: ZEEBE_LOG_LEVEL,   value: "INFO" }
            # Keep activation bounded for the shared pyzeebe worker pool.
            - { name: ZEEBE_BROKER_BACKPRESSURE_ALGORITHM,   value: "fixed" }
            - { name: ZEEBE_BROKER_BACKPRESSURE_FIXED_LIMIT, value: "500" }
            # Hazelcast exporter (zeebe-hazelcast-exporter 1.4.0, patched).
            - { name: ZEEBE_BROKER_EXPORTERS_HAZELCAST_CLASSNAME, value: "io.zeebe.hazelcast.exporter.HazelcastExporter" }
            - { name: ZEEBE_BROKER_EXPORTERS_HAZELCAST_JARPATH,    value: "/exporters/zeebe-hazelcast-exporter.jar" }
            - { name: ZEEBE_BROKER_EXPORTERS_HAZELCAST_ARGS_RINGBUFFERSIZE, value: "1000000" }
            - { name: ZEEBE_BROKER_EXPORTERS_HAZELCAST_ARGS_PORT,           value: "5701" }
            # Exclude JOB_BATCH (worker long-poll) + PROCESS_INSTANCE_BATCH — these flood
            # the ringbuffer (2M+ records) and overwrite DEPLOYMENT/PROCESS records before
            # the Simple Monitor can consume them, causing the process list to appear stuck.
            - name: ZEEBE_BROKER_EXPORTERS_HAZELCAST_ARGS_ENABLEDVALUETYPES
              value: >-
                DEPLOYMENT,PROCESS,PROCESS_INSTANCE,PROCESS_INSTANCE_CREATION,PROCESS_EVENT,
                JOB,VARIABLE,TIMER,INCIDENT,MESSAGE,ERROR,
                DECISION,DECISION_REQUIREMENTS,MULTI_INSTANCE,ESCALATION
          resources:
            requests:
              cpu: "500m"
              memory: "3Gi"
            limits:
              cpu: "2000m"
              memory: "6Gi"
          readinessProbe:
            # /ready is up once the partition is leader-ready.
            httpGet:
              path: /ready
              port: monitoring
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: monitoring
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /usr/local/zeebe/data
            - name: exporters
              mountPath: /exporters
      volumes:
        - name: exporters
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: vultr-block-storage
        resources:
          requests:
            storage: 5Gi
---
# ServiceMonitor — Zeebe broker exposes Prometheus metrics on
# :9600/actuator/prometheus (Spring Boot Actuator). Applied here so
# `kubectl apply -f zeebe.yaml` is one-shot. CRD `monitoring.coreos.com`
# is NOT yet installed on this cluster (no Prometheus operator); the
# manifest is harmless until kube-prometheus-stack is added (`kubectl
# apply` skips when CRD missing? — actually it errors. Wrap in conditional
# below). For now apply selectively when Prometheus is live.
#
# Key metrics for #6 (job activation rate):
#   zeebe_job_events_total{action="activated"}  — counter
#   zeebe_actor_task_execution_count_total       — broker-side scheduling
#
# Alert example (PromQL, fires when 0 activations in 5min while jobs pending):
#   sum(rate(zeebe_job_events_total{action="activated"}[5m])) == 0
#   and on()
#   sum(zeebe_job_events_total{action="created"} - on(job_type)
#       zeebe_job_events_total{action="completed"}) > 0
#
# Until Prometheus operator lands, the in-process activation monitor in
# kotodama.zeebe_worker_main._activation_monitor logs WARN/ERROR on
# stale activation counters at 60s cadence — sufficient for this pilot.
#
# apiVersion: monitoring.coreos.com/v1
# kind: ServiceMonitor
# metadata:
#   name: zeebe-broker
#   namespace: mitama-udf
#   labels:
#     app.kubernetes.io/name: zeebe
# spec:
#   selector:
#     matchLabels:
#       app.kubernetes.io/name: zeebe
#       app.kubernetes.io/component: broker
#   endpoints:
#     - port: monitoring
#       path: /actuator/prometheus
#       interval: 30s
