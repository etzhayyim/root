# Zeebe Simple Monitor — https://monitor.etzhayyim.com
#
# Connects to:
#   - Zeebe gRPC gateway: zeebe-gateway.mitama-udf.svc.cluster.local:26500
#   - Zeebe Hazelcast exporter: zeebe-0.zeebe-broker.mitama-udf.svc.cluster.local:5701
#
# Camunda SDK 8.5: gateway-address is deprecated; must use grpc-address (java.net.URI).
#   zeebe.client.broker.grpc-address = grpc://host:port  (no TLS)
#   zeebe.client.broker.rest-address = http://host:port
#
# DB: H2 in-memory. Processes repopulate via BPMN re-deploy (F5 watcher resets deployed_at).
# TODO: Switch to persistent storage once Vultr block storage limit is raised.
#   (hit account max subscriptions as of 2026-05-05; contact Vultr support)
#
# monitor.etzhayyim.com routes via CF Zero Trust tunnel to this Service on :8082.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeebe-simple-monitor
  namespace: mitama-udf
  labels:
    app: zeebe-simple-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zeebe-simple-monitor
  template:
    metadata:
      labels:
        app: zeebe-simple-monitor
    spec:
      containers:
        - name: monitor
          image: ghcr.io/camunda-community-hub/zeebe-simple-monitor:2.9.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            # SPRING_APPLICATION_JSON passes dotted/URI properties that K8s env var names can't express.
            # Camunda SDK 8.5 requires grpc-address (URI) — gateway-address is deprecated/ignored.
            - name: SPRING_APPLICATION_JSON
              value: >-
                {"zeebe.client.broker.grpc-address":"grpc://zeebe-gateway.mitama-udf.svc.cluster.local:26500",
                "zeebe.client.broker.rest-address":"http://zeebe-gateway.mitama-udf.svc.cluster.local:8080",
                "zeebe.client.security.plaintext":true,
                "zeebe.client.worker.hazelcast.connection":"zeebe-0.zeebe-broker.mitama-udf.svc.cluster.local:5701",
                "zeebe.client.worker.hazelcast.clusterName":"dev",
                "management.health.zeebe.enabled":false,
                "spring.datasource.url":"jdbc:h2:mem:zeebe-monitor;DB_CLOSE_DELAY=-1",
                "spring.datasource.driverClassName":"org.h2.Driver"}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: zeebe-simple-monitor
  namespace: mitama-udf
spec:
  type: ClusterIP
  selector:
    app: zeebe-simple-monitor
  ports:
    - name: http
      port: 8082
      targetPort: 8082
