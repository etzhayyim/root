apiVersion: v2
name: zeebe
description: |
  Camunda/Zeebe 8.5.23 broker + simple-monitor + murakumo gateway LoadBalancer.
  Pinned at 8.5.23 per ADR-0056 (avoid 8.6+ licensing).

  Migrated from plain `kubectl apply` (2026-05-08) to local Helm chart so that
  helmfile can manage rollouts with proper history/rollback semantics.
  Templates are verbatim copies of the original manifests — no parameterization
  yet. Future: extract image tag / replica count / resource requests into
  values.yaml as needed.
type: application
version: 0.1.0
