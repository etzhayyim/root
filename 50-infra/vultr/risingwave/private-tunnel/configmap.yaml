apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-risingwave-private-config
  namespace: risingwave
data:
  config.yaml: |
    # Cloudflare Tunnel: risingwave-private (id: a17cdf9d-7b9d-4cf4-a482-66129bc2a43d)
    #
    # Purpose: Hyperdrive over Tunnel — replaces the previous public LoadBalancer
    # exposure of RisingWave at 45.32.79.245:4566 (decommissioned 2026-05-17 after
    # GitGuardian incident). Hyperdrive in CF connects to the cluster privately
    # via this tunnel; no public IP on RW.
    #
    # DNS: risingwave-private.etzhayyim.com CNAME → a17cdf9d-7b9d-4cf4-a482-66129bc2a43d.cfargotunnel.com
    #
    # Origin (in-cluster): tcp://risingwave.risingwave.svc.cluster.local:4566
    # (ClusterIP service; root user auth enabled 2026-05-17)
    tunnel: a17cdf9d-7b9d-4cf4-a482-66129bc2a43d
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: risingwave-private.etzhayyim.com
        service: tcp://risingwave.risingwave.svc.cluster.local:4566
        originRequest:
          connectTimeout: 30s
      - service: http_status:404
