apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-kotoba-private
  namespace: kotoba
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/instance: cloudflared-kotoba-private
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: cloudflared-kotoba-private
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/instance: cloudflared-kotoba-private
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.4.0
          args: ["tunnel", "--config", "/etc/cloudflared/config/config.yaml", "run"]
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 30
            periodSeconds: 60
          ports:
            - containerPort: 2000
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-kotoba-private-config
        - name: creds
          secret:
            secretName: cloudflared-kotoba-private-credentials
