[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.27"
optimizer = true
optimizer_runs = 1000000
via_ir = true
# Read-only access to the repo-root Charter Rider so ConstitutionInvariants.t.sol
# can drift-lock license.charter_rider_text_hash against the actual Rider text
# (ADR-2606062100 §4 — the on-chain Rider-integrity anchor).
fs_permissions = [
  { access = "read", path = "../../CHARTER-RIDER.md" },
  { access = "read", path = "../../00-contracts/lexicons/com/etzhayyim/apps/etzhayyim/priorityConformanceAttestation.json" },
]

# Two-chain target per ADR-2605172300:
#   etzhayyim_private — internal PoA chain (ChainID 2605); endpoint
#                       supplied by deployer env, no public RPC.
#   base / base_sepolia — Base L2 (Coinbase). Used for src/base/*.sol
#                         (KishaPayout settlement).
[rpc_endpoints]
etzhayyim_private = "${ETZHAYYIM_PRIVATE_RPC}"
base              = "https://mainnet.base.org"
base_sepolia      = "https://sepolia.base.org"

[etherscan]
base         = { key = "${BASESCAN_KEY}", url = "https://api.basescan.org/api" }
base_sepolia = { key = "${BASESCAN_KEY}", url = "https://api-sepolia.basescan.org/api" }
