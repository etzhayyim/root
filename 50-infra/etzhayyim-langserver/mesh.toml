# etzhayyim-langserver — mesh binding policy (Layer 5 SSoT)
#
# Bridges L4 (loopback TCP) to fleet-wide reach by binding the TCP listener
# to the host's mesh-IP instead of 127.0.0.1.
#
# Mesh substrate: 50-infra/cluster/murakumo/ (X25519 + XChaCha20-Poly1305).
# Mesh subnet:    10.99.0.0/16 (per murakumo_mesh.rs MESH_SUBNET_PREFIX).
# Mesh IP alloc:  Ipv4Addr(10, 99, H, L) where H,L = blake3(node_id) bytes[0..2].
#
# Each Mac mini already runs the murakumo-mesh tunnel daemon as a LaunchAgent
# (currently legacy-labeled com.etzhayyim.murakumo-mesh; rename to com.etzhayyim.*
# pending cutover). The mesh identity file lives at:
#   ~/.etzhayyim/mesh/identity.json     (current; legacy path)
#   ~/.etzhayyim/mesh/identity.json (target; post-cutover)
#
# JSON schema (mesh identity):
#   { node_id: "naphtali", public_key: "...", secret_key: "...",
#     mesh_ip: "10.99.H.L", ... }

[manifest]
version = "1"
mesh_substrate_path = "50-infra/cluster/murakumo/"
mesh_subnet = "10.99.0.0/16"
mesh_ip_allocator_fn = "allocate_mesh_ip in murakumo_mesh.rs:315"
mesh_identity_paths = [
  "~/.etzhayyim/mesh/identity.json",   # target (post-cutover)
  "~/.etzhayyim/mesh/identity.json",        # current (legacy; CLAUDE.md cutover pending)
]
mesh_daemon_launchd_label = "com.etzhayyim.murakumo-mesh"  # legacy; rename pending
mesh_daemon_launchd_label_target = "com.etzhayyim.murakumo-mesh"

# ─── Bind policy ────────────────────────────────────────────────────────

[bind_policy]
# How langserver TCP listeners choose their bind address:
#   "loopback"  → 127.0.0.1  (L4 default — same-host editors only)
#   "mesh"      → host mesh-IP (this layer — fleet-wide reach)
#   "both"      → start two TCP listeners (loopback + mesh-IP, different ports)
default = "mesh"

# Per-port allocation (mirrors L4 transports.toml; mesh-IP binds use the same port).
# An editor connects via tcp://<mesh-ip>:<port>; no port re-mapping needed.

# ─── Discovery ──────────────────────────────────────────────────────────
#
# scripts/generate-fleet-registry.sh produces lsp-fleet.json that L8 editor
# configs consume. The registry is COMPUTED from hosts.toml + transports.toml
# + per-host mesh identity (when reachable); it is NOT a live state.
#
# Editors should treat lsp-fleet.json as a static catalog and probe the
# socket directly to confirm the LSP is up. L6 health-check sidecar will
# expose a richer liveness endpoint.

[discovery]
fleet_registry_output = "scripts/lsp-fleet.json"   # produced by generate-fleet-registry.sh
fleet_registry_schema = "{ entries: [{ lang, host, mesh_ip, port, socket_path?, status }] }"
schema_status_values = ["pinned", "deployed", "unverified"]

# ─── Constraints (per CLAUDE.md) ────────────────────────────────────────
#
# Substrate hard rules apply: langserver traffic stays on the mesh and does
# NOT cross any commercial K8s control plane or fiat-payment substrate.
# It is "computation only, ephemeral state" (no MST/IPFS/L2 writes), so the
# substrate prohibitions in [platform.substrate] do not constrain L5
# beyond mesh-only routing.
