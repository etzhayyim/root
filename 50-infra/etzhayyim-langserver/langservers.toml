# etzhayyim-langserver — per-language LSP binary pins (Layer 3 SSoT)
#
# This file is the canonical version-pin for every language server we
# permanently host on the Murakumo Mac-mini fleet.
#
# Cross-refs:
#   - Layer 1 host inventory:  hosts.toml
#   - Layer 2 plist template:  launchd/com.etzhayyim.langserver.template.plist
#   - deps.toml mirror:        [platform.langserver]
#
# Each [[langserver]] entry resolves the @@LSP_BIN_PATH@@ and @@LSP_ARGS@@
# placeholders in the L2 plist template. Install methods must be reproducible
# from this manifest (no manual steps); scripts/install-langservers.sh
# consumes this file.
#
# Versions listed are **target pins** — install-langservers.sh refuses to
# install a different version without --force. Bump pins via PR (one PR per
# language, ADR if multi-language coordinated bump).

[manifest]
version = "1"
adr_l3 = "2605211910 (fleet IP baseline), TBD (L3 pin ADR — open if any pin bump rejected)"
default_install_root = "/opt/homebrew"      # apple-silicon homebrew prefix
default_node_global   = "/opt/homebrew/lib/node_modules"
default_gem_user      = "~/.gem/ruby"
default_cargo_home    = "~/.cargo"
default_go_path       = "~/go"
binary_lookup_order   = ["homebrew", "rustup", "go-install", "npm-global", "gem-user", "github-release"]

# ─── Transport prerequisites (used by L4 socat wrapper) ─────────────────

[[prereq]]
name      = "socat"
purpose   = "Bridges Unix domain socket / TCP listener ↔ LSP stdio (L4)."
install   = "brew install socat"
version   = "1.8.0.3"        # latest brew formula at time of pin (2026-Q1)
bin       = "/opt/homebrew/bin/socat"
check_cmd = "socat -V | head -1"

[[prereq]]
name      = "jq"
purpose   = "Used by install-langservers.sh + deploy-mesh.sh for JSON parsing."
install   = "brew install jq"
version   = "1.7.1"
bin       = "/opt/homebrew/bin/jq"
check_cmd = "jq --version"

# ─── Language servers ──────────────────────────────────────────────────

# Rust — rust-analyzer (official, Rust foundation maintained)
[[langserver]]
lang       = "rust"
name       = "rust-analyzer"
version    = "2026-01-13"               # weekly tagged release (verify before install)
install    = "rustup component add rust-analyzer"
install_alt= "Download from https://github.com/rust-lang/rust-analyzer/releases/tag/2026-01-13 (rust-analyzer-aarch64-apple-darwin.gz)"
bin        = "~/.cargo/bin/rust-analyzer"  # via rustup; absolute path resolved per host
args       = ""                          # rust-analyzer speaks stdio by default
runtime_dep= "Rust toolchain (rustup)"
heuristic_ram_mb = 2500                  # observed; varies wildly per workspace
preferred_host_role = "primary"          # placement in hosts.toml.lsp_placement.proposed.rust = joseph

# Python — pyright (Microsoft, BSD-licensed; standard for production)
[[langserver]]
lang       = "python"
name       = "pyright"
version    = "1.1.401"
install    = "npm install -g pyright@1.1.401"
install_alt= "pipx install pyright==1.1.401  (downloads bundled Node)"
bin        = "/opt/homebrew/bin/pyright-langserver"
args       = "--stdio"
runtime_dep= "Node 22 LTS (already present on simeon per [platform.pds]; install on other hosts)"
heuristic_ram_mb = 800
preferred_host_role = "primary"          # → issachar

# TypeScript — typescript-language-server (community, MIT)
[[langserver]]
lang       = "typescript"
name       = "typescript-language-server"
version    = "4.3.4"
typescript_version = "5.7.3"
install    = "npm install -g typescript-language-server@4.3.4 typescript@5.7.3"
bin        = "/opt/homebrew/bin/typescript-language-server"
args       = "--stdio"
runtime_dep= "Node 22 LTS"
heuristic_ram_mb = 1500
preferred_host_role = "primary"          # → dan

# Go — gopls (official, Google)
[[langserver]]
lang       = "go"
name       = "gopls"
version    = "v0.18.1"
install    = "go install golang.org/x/tools/gopls@v0.18.1"
bin        = "~/go/bin/gopls"            # absolute path resolved per host
args       = ""                          # stdio default
runtime_dep= "Go 1.23.x toolchain (brew install go)"
heuristic_ram_mb = 400
preferred_host_role = "primary"          # → naphtali

# Lua — lua-language-server (sumneko, MIT)
[[langserver]]
lang       = "lua"
name       = "lua-language-server"
version    = "3.15.0"
install    = "brew install lua-language-server"  # homebrew formula tracks upstream
bin        = "/opt/homebrew/bin/lua-language-server"
args       = ""                          # stdio default
runtime_dep= "none (statically linked)"
heuristic_ram_mb = 150
preferred_host_role = "primary"          # → zebulun

# Ruby — ruby-lsp (Shopify, MIT) — supersedes solargraph per upstream Ruby direction
[[langserver]]
lang       = "ruby"
name       = "ruby-lsp"
version    = "0.23.0"
install    = "gem install --user-install ruby-lsp -v 0.23.0"
bin        = "~/.gem/ruby/3.3.0/bin/ruby-lsp"  # path varies by ruby version; resolved at install
args       = ""                          # stdio default
runtime_dep= "Ruby 3.3.x (brew install ruby OR rbenv install 3.3.x)"
heuristic_ram_mb = 250
preferred_host_role = "primary"          # → naphtali (co-tenant with go)
notes      = "solargraph is intentionally NOT pinned — superseded by ruby-lsp."

# ─── Verification: each installer step must be idempotent and refuse silent upgrades. ──
#
# install-langservers.sh consumes this manifest, runs per-language install,
# then runs check_cmd-equivalent (e.g. `rust-analyzer --version`) to confirm
# the binary reports the pinned version. Mismatch = exit non-zero (no auto-bump).
