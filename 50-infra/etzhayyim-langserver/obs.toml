# etzhayyim-langserver — observability policy (Layer 7 SSoT)
#
# Three signals, each delivered to a sink the fleet already operates:
#
#   1. Process logs (stdout/stderr)  →  on-disk file via launchd, rotated
#                                       by macOS newsyslog (no extra daemon)
#   2. Metrics                       →  Prometheus textfile on healthz sidecar
#                                       /metrics endpoint (15600-15699 ports)
#   3. Stream (optional)             →  NATS JetStream subject
#                                       etzhayyim.langserver.<host>.<lang>.log
#                                       (opt-in via --apply; default noop)
#
# Per CLAUDE.md substrate hard rules: langserver logs are computation-time
# state only. Do NOT write them to MST / IPFS / L2.

[manifest]
version = "1"
adr_refs = ["2605192415 §7.1 (Tier 1 launchd 常駐)"]

# ─── 1. On-disk logs (already enforced by L2 plist) ─────────────────────

[on_disk]
stdout_path_template = "/Users/<tribe>/.etzhayyim/log/langserver.<lang>.stdout.log"
stderr_path_template = "/Users/<tribe>/.etzhayyim/log/langserver.<lang>.stderr.log"
plist_keys_responsible = ["StandardOutPath", "StandardErrorPath"]
format = "LSP-native (rust-analyzer/pyright/etc. each have their own format)"
format_note = "etzhayyim does not force JSON on third-party LSP servers; structured wrappers can re-emit in L9 cell"

# ─── 2. Rotation via macOS newsyslog ────────────────────────────────────
#
# Drop newsyslog.d/etzhayyim-langserver.conf into /etc/newsyslog.d/ on each
# Mac mini (install.sh in L6 will do this). newsyslog runs daily via
# com.apple.newsyslog launchd job — no extra daemon needed.

[rotation]
mechanism = "macOS newsyslog (system-provided)"
config_template = "newsyslog.d/etzhayyim-langserver.conf"
config_install_path = "/etc/newsyslog.d/etzhayyim-langserver.conf"
config_install_requires_sudo = true
size_limit_mb = 50              # rotate at 50 MiB
keep_count = 5                  # 5 archives → ~250 MiB total per file
mode = "0640"
flags = "Z"                     # gzip-compress rotated files

# ─── 3. Metrics endpoint ────────────────────────────────────────────────

[metrics]
endpoint_path = "/metrics"
serve_via = "healthz-sidecar.py (extended)"
format = "Prometheus textfile (text/plain version=0.0.4)"
scrape_target_template = "http://<mesh-ip>:<port_healthz>/metrics"
recommended_prometheus_job_name = "etzhayyim_langserver"
existing_prometheus_endpoint = "http://murakumo.etzhayyim.local:9090"  # per fleet.toml [monitoring]
metrics_exposed = [
  "etzhayyim_langserver_up{lang,host}",
  "etzhayyim_langserver_uptime_seconds{lang,host}",
  "etzhayyim_langserver_probe_latency_seconds{lang,host,probe='tcp'|'deep'}",
  "etzhayyim_langserver_probe_failures_total{lang,host}",
]

# ─── 4. NATS JetStream (opt-in) ─────────────────────────────────────────
#
# Disabled by default — NATS deployment is itself scaffolded under
# 50-infra/nats-jetstream-* and not yet wired into all Mac minis.
# Enable per-host via:
#   ./scripts/ship-logs-to-nats.sh --apply --nats-url nats://nats.etzhayyim.local:4222

[stream_nats]
enabled_default = false
forwarder_script = "scripts/ship-logs-to-nats.sh"
forwarder_mechanism = "tail -F | nats pub (one subject per file per lang per host)"
subject_template = "etzhayyim.langserver.<host>.<lang>.<stream>"  # <stream> = stdout | stderr
retention_policy_recommendation = "Limits stream, 7d max-age, 1GiB max-bytes per subject"
substrate_constraint = "Compute-time logs; NOT persistent state. Per [platform.substrate] this is allowed since it does not bypass MST/IPFS/L2 for state."

# ─── 5. Constraints (per CLAUDE.md) ─────────────────────────────────────
#
# - L7 adds NO new commercial log shipper (Datadog, Splunk, etc.). Apache
#   2.0 OSS (NATS, Prometheus) only.
# - Logs MUST NOT contain DID private keys, payment secrets, or SBT tokens
#   in plaintext. Sanitization is the LSP's own responsibility; etzhayyim
#   wrapper does not inspect payloads (privacy boundary).
