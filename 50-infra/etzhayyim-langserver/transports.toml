# etzhayyim-langserver — per-language transport config (Layer 4 SSoT)
#
# Defines how each language's LSP is exposed to clients:
#   - primary: Unix domain socket (same-host, fast, fs-permission auth)
#   - secondary: TCP listener on loopback (127.0.0.1)
#
# Layer 5 (mesh) upgrades the TCP bind from 127.0.0.1 → mesh-IP so any
# fleet member can attach. This file is L5-agnostic; mesh binding is a
# runtime decision made by run-langserver.sh based on $ETZHAYYIM_LISTEN_ADDR.
#
# Concurrency model: socat fork mode — one LSP process per client
# connection. This trades higher cold-start cost for connection isolation
# (no inter-client state bleed). A future multiplexer (lsp-proxy /
# lsp-multiplexer) can replace fork mode without changing transports.toml.

[manifest]
version = "1"
port_range = [15500, 15600]     # langserver LSP TCP listeners
port_range_healthz = [15600, 15700]  # L6 healthz HTTP sidecars (lsp_port + 100)
port_range_adr_ref = "2605192415 §4 (port allocation in fleet)"
socket_dir_macos = "/tmp/etzhayyim-langserver-$USER"  # XDG_RUNTIME_DIR is unset on macOS by default
socket_mode = "0600"             # owner-only; fs auth between same-host clients & daemon
socket_dir_mode = "0700"

# socat invocation conventions (consumed by run-langserver.sh):
#
#   Unix:  socat UNIX-LISTEN:$SOCK_PATH,reuseaddr,fork,unlink-early,mode=0600 \
#               EXEC:"$LSP_BIN $LSP_ARGS"
#
#   TCP:   socat TCP-LISTEN:$PORT,bind=$BIND_ADDR,reuseaddr,fork \
#               EXEC:"$LSP_BIN $LSP_ARGS"
#
# $BIND_ADDR defaults to 127.0.0.1; L5 sets it to the mesh-IP for fleet-wide reach.

[socat]
default_listen_options_unix = "reuseaddr,fork,unlink-early,mode=0600"
default_listen_options_tcp  = "reuseaddr,fork"
default_bind_addr_loopback  = "127.0.0.1"
# pty mode is INTENTIONALLY OFF: LSP speaks raw JSON-RPC, a pty would
# inject terminal control sequences and break framing.

# ─── Per-language port + socket allocation ──────────────────────────────

[[transport]]
lang = "rust"
port_tcp = 15510
port_healthz = 15610  # L6 sidecar: lsp_port + 100
socket_basename = "rust.sock"

[[transport]]
lang = "python"
port_tcp = 15511
port_healthz = 15611
socket_basename = "python.sock"

[[transport]]
lang = "typescript"
port_tcp = 15512
port_healthz = 15612
socket_basename = "typescript.sock"

[[transport]]
lang = "go"
port_tcp = 15513
port_healthz = 15613
socket_basename = "go.sock"

[[transport]]
lang = "lua"
port_tcp = 15514
port_healthz = 15614
socket_basename = "lua.sock"

[[transport]]
lang = "ruby"
port_tcp = 15515
port_healthz = 15615
socket_basename = "ruby.sock"

# Reserved range for future languages: 15516-15599 LSP / 15616-15699 healthz (84 slots).
