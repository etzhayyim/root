# /etc/newsyslog.d/etzhayyim-langserver.conf
#
# macOS newsyslog rotation for etzhayyim langserver logs.
# Per ADR-2605192415 §7.1 (Tier 1 launchd 常駐) + this repo's L7 obs.toml.
#
# Install (per host, requires sudo):
#   sudo install -m 0644 \
#     50-infra/etzhayyim-langserver/newsyslog.d/etzhayyim-langserver.conf \
#     /etc/newsyslog.d/etzhayyim-langserver.conf
#
# newsyslog is invoked daily by com.apple.newsyslog (system launchd job).
# No extra daemon is required.
#
# Column reference (newsyslog.conf(5)):
#   logfilename             [owner:group]  mode  count  size(KB)  when  flags  [/pid_file]  [sig_num]
#
# size_limit_mb = 50  → 51200 KB
# keep_count    = 5
# flags = Z (gzip compress when rotated)
# mode = 640

# The @@USERNAME@@ placeholder is replaced per host at install time
# (e.g., 'naphtali', 'simeon', etc. — same as the LaunchAgent user).
# install-newsyslog.sh (lands in L6 follow-up) handles substitution.

/Users/@@USERNAME@@/.etzhayyim/log/langserver.rust.stdout.log       @@USERNAME@@:staff  640  5  51200  *  Z
/Users/@@USERNAME@@/.etzhayyim/log/langserver.rust.stderr.log       @@USERNAME@@:staff  640  5  51200  *  Z
/Users/@@USERNAME@@/.etzhayyim/log/langserver.python.stdout.log     @@USERNAME@@:staff  640  5  51200  *  Z
/Users/@@USERNAME@@/.etzhayyim/log/langserver.python.stderr.log     @@USERNAME@@:staff  640  5  51200  *  Z
/Users/@@USERNAME@@/.etzhayyim/log/langserver.typescript.stdout.log @@USERNAME@@:staff  640  5  51200  *  Z
/Users/@@USERNAME@@/.etzhayyim/log/langserver.typescript.stderr.log @@USERNAME@@:staff  640  5  51200  *  Z
/Users/@@USERNAME@@/.etzhayyim/log/langserver.go.stdout.log         @@USERNAME@@:staff  640  5  51200  *  Z
/Users/@@USERNAME@@/.etzhayyim/log/langserver.go.stderr.log         @@USERNAME@@:staff  640  5  51200  *  Z
/Users/@@USERNAME@@/.etzhayyim/log/langserver.lua.stdout.log        @@USERNAME@@:staff  640  5  51200  *  Z
/Users/@@USERNAME@@/.etzhayyim/log/langserver.lua.stderr.log        @@USERNAME@@:staff  640  5  51200  *  Z
/Users/@@USERNAME@@/.etzhayyim/log/langserver.ruby.stdout.log       @@USERNAME@@:staff  640  5  51200  *  Z
/Users/@@USERNAME@@/.etzhayyim/log/langserver.ruby.stderr.log       @@USERNAME@@:staff  640  5  51200  *  Z
