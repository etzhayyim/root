# etzhayyim-langserver host inventory (Layer 1 SSoT)
#
# Derived from 50-infra/murakumo/fleet.toml (ADRs 2605192415 / 2605182312 / 2605211910).
# Hardware fields (`soc` / `ram_gb` / `arch` / `macos_version`) are **unconfirmed** at
# this layer — they require an SSH probe (see scripts/probe-hardware.sh).
# Run the probe and commit a follow-up that fills the `hw.*` blocks before
# proceeding to L2 plist generation per CLAUDE.md "ハードウェア未確認段階では
# plist は dry-run のみ" constraint.
#
# IP source-of-truth: ARP/mDNS verified 2026-05-21 (ADR-2605211910), Ethernet-side.

[fleet]
name = "etzhayyim-langserver"
parent_fleet = "etzhayyim-murakumo"
parent_fleet_toml = "50-infra/murakumo/fleet.toml"
adr = ["2605192415", "2605191346", "2605182312", "2605211910"]
hw_probe_required = true
hw_probe_script = "scripts/probe-hardware.sh"

