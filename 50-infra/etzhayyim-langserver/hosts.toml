# ─── LSP placement strategy (proposed, finalized at L2) ─────────────────
# Rationale: distribute LSP families across non-critical nodes; avoid
# co-locating with pds (simeon) / litellm (judah) / heavy cron cells (levi).

[lsp_placement.proposed]
# language family → preferred host. Final assignment after L1 HW confirmation.
rust = "joseph"        # rust-analyzer is RAM-hungry (often 2-4 GB per workspace)
python = "issachar"    # pyright moderate (~500 MB-1 GB)
typescript = "dan"     # tsserver moderate (~500 MB-2 GB)
go = "naphtali"        # gopls light (~200-500 MB)
lua = "zebulun"        # lua-language-server very light (~100 MB)
ruby = "naphtali"      # ruby-lsp light (~200 MB) — co-tenant with go
replica = "asher"      # failover for any single-host LSP loss
