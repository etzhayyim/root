# 80-data — Data files (reference datasets, metrics, reports)

name = "80-data"
layer = 2
tier = "production"
role = "data-assets"
description = "Reference datasets, metrics, reports (JSON/CSV/schemas)"
language = "json+csv"

depends_on = []

provides = [
  "dodaf/",       # DoDAF DM2 reference data
  "kosei/",       # Kosei (standards) config
  "mokuteki/",    # Mokuteki (objective function) metadata
  "shannon/",     # Shannon catalog
  "schemas/",     # JSON schemas
  "reports/",     # Generated reports
]

[subdirs.dodaf]
role = "reference-data"
tier = "production"
description = "DoDAF DM2 governance reference"

[subdirs.kosei]
role = "reference-data"
tier = "production"
description = "Kosei (standards) config"

[subdirs."kosei/history"]
role = "history-log"
tier = "production"
flags = ["editable"]

[subdirs."kosei/snapshots"]
role = "snapshot-data"
tier = "production"
flags = ["generated"]

[subdirs.mokuteki]
role = "reference-data"
tier = "production"
description = "Mokuteki objective function data (Shannon 4-layer × Well-Becoming)"

[subdirs."mokuteki/snapshots"]
role = "snapshot-data"
tier = "production"
flags = ["generated"]

[subdirs.shannon]
role = "catalog"
tier = "production"
description = "Shannon catalog (DSM/BayesNet/Bottleneck/Minimize)"

[subdirs."shannon/snapshots"]
role = "snapshot-data"
tier = "production"
flags = ["generated"]

[subdirs.schemas]
role = "json-schemas"
tier = "production"

[subdirs.reports]
role = "generated-reports"
tier = "production"
flags = ["generated"]

[files."india_districts.csv"]
role = "reference-csv"
flags = ["editable"]

[files."reports/deps-graph.md"]
role = "dependency-report"
kind = "report"
flags = ["generated"]
description = "Generated Mermaid dependency graph snapshot"

[files."project-metrics.json"]
role = "metrics"
flags = ["generated"]
