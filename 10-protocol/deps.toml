# 10-protocol — Layer 0-1: AT Protocol XRPC + capability system
#
# The wire protocol layer for AT Protocol XRPC integrations.

name = "10-protocol"
layer = 0
tier = "production"
role = "protocol-layer"
description = "AT Protocol XRPC transport + capability system"
language = "typescript+rust"

depends_on = ["00-contracts"]

provides = [
  "@gftd/xrpc",
]

[invariants]
at_protocol_xrpc = true
capability_count = 9

# ── Core protocol packages ──────────────────────────────

[subdirs.xrpc]
role = "xrpc-transport"
tier = "production"
description = "@gftd/xrpc — XRPC single source (NSID, auth, error, transport). Zero deps."

[files."README.md"]
role = "doc"
flags = ["editable"]
