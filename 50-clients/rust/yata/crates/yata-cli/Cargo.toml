[package]
name        = "yata-cli"
description = "`yata` command-line frontend over the yata Rust client."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[[bin]]
name = "yata"
path = "src/main.rs"

[dependencies]
yata-core   = { workspace = true }
yata-schema = { workspace = true }
yata-query  = { workspace = true }
yata-sparql = { workspace = true }
yata-stream = { workspace = true }
yata-mcp    = { workspace = true }
tokio       = { workspace = true }
clap        = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
