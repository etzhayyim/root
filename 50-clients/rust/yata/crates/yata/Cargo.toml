[package]
name        = "yata"
description = "Rust client for yatabase — real-time graph database with integrated Supabase-style storage."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme      = "../../README.md"

[lib]
doctest = false

[features]
default = ["query", "derive", "tokio-rt"]

# Query / schema
query    = ["dep:yata-query"]
derive   = ["dep:yata-derive"]

# Optional protocol bridges
sparql   = ["dep:yata-sparql"]
stream   = ["dep:yata-stream"]
mcp      = ["dep:yata-mcp"]

# Runtimes (mutually exclusive — pick one)
tokio-rt = []
async-std-rt = []

[dependencies]
yata-core   = { workspace = true }
yata-schema = { workspace = true }

# Optional re-exports
yata-query  = { workspace = true, optional = true }
yata-derive = { workspace = true, optional = true }
yata-sparql = { workspace = true, optional = true }
yata-stream = { workspace = true, optional = true }
yata-mcp    = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"
required-features = ["query", "derive"]
