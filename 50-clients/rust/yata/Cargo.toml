[workspace]
resolver = "2"
members = [
    "crates/yata",
    "crates/yata-core",
    "crates/yata-schema",
    "crates/yata-derive",
    "crates/yata-query",
    "crates/yata-sparql",
    "crates/yata-stream",
    "crates/yata-mcp",
    "crates/yata-cli",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.78"
license      = "Apache-2.0 OR MIT"
repository   = "https://github.com/gftdcojp/yata"
homepage     = "https://yatabase.gftd.ai"
authors      = ["etzhayyim <jun@gftd.group>"]
description  = "Rust client for yatabase — real-time graph database + integrated Supabase-style storage."
keywords     = ["graph", "database", "atproto", "yatabase", "client"]
categories   = ["database", "api-bindings"]

[workspace.dependencies]
# Internal — use path until first crates.io publish, then switch to version-only
yata-core   = { path = "crates/yata-core",   version = "0.1.0" }
yata-schema = { path = "crates/yata-schema", version = "0.1.0" }
yata-derive = { path = "crates/yata-derive", version = "0.1.0" }
yata-query  = { path = "crates/yata-query",  version = "0.1.0" }
yata-sparql = { path = "crates/yata-sparql", version = "0.1.0" }
yata-stream = { path = "crates/yata-stream", version = "0.1.0" }
yata-mcp    = { path = "crates/yata-mcp",    version = "0.1.0" }

# Async runtime
tokio          = { version = "1", features = ["full"] }
async-trait    = "0.1"

# Postgres wire
tokio-postgres = "0.7"

# TLS
tokio-rustls   = "0.26"
rustls         = "0.23"

# Serialisation
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"

# Time / IDs
chrono         = { version = "0.4", features = ["serde"] }
uuid           = { version = "1", features = ["v4", "serde"] }

# HTTP (sparql / mcp HTTP transport)
reqwest        = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# WebSocket (mv subscription)
tokio-tungstenite = "0.24"

# CLI
clap           = { version = "4", features = ["derive"] }

# Errors
thiserror      = "2"

# Logging
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# proc-macros
syn            = { version = "2", features = ["full", "extra-traits"] }
quote          = "1"
proc-macro2    = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
