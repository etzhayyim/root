[package]
name = "murakumo-8bit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Experimental pure-int8 fixed-point training sandbox for Murakumo"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow-array = "57"
arrow-ipc = "57"
arrow-schema = "57"
half = "2"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
wgpu = "24"
