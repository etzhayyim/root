# chigiri legal-aid intake — kotoba WASM Component guest.
#
# Runs INSIDE the kotoba node (wasm32-wasip2, WasmExecutor) instead of an
# external Cloudflare Worker. Build:
#   cargo component build --release --target wasm32-wasip2
# Deploy/run via XRPC com.etzhayyim.apps.kotoba.invoke.run (program_type=wasm-node).
#
# Python guests are blocked on the current kotoba (wasmtime 22 / extended-const);
# the Rust guest path is live-verified (deps.toml). This crate is standalone
# (own [workspace]) so it is not absorbed by the etzhayyim or kotoba workspaces.
[package]
name = "chigiri-legal-aid-guest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.36"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }

[package.metadata.component]
package = "etzhayyim:chigiri-legal-aid"

[package.metadata.component.target]
world = "kotoba-node"

[profile.release]
opt-level = "s"
lto = true
strip = true
