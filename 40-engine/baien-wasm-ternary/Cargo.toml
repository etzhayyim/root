[package]
name = "baien-wasm-ternary"
version = "0.1.0-r0"
edition = "2021"
authors = ["Jun Kawasaki <jun@etzhayyim.com>"]
license = "Apache-2.0"
description = "BitNet b1.58 ternary i2_s kernel for wasm32 — bitnet.cpp API mirror (ADR-2605263200)"
repository = "https://github.com/etzhayyim/root"
readme = "README.md"

# Per ADR-2605263200 G7: clean-room Rust re-impl of microsoft/BitNet
# (bitnet.cpp) public API surface. NOT a vendored fork — the upstream
# under that name is MIT, but we have copied zero source. The matching
# function names + tensor type tags + i2_s data layout are used under
# Google v. Oracle 2021 API fair use (same posture as kami-engine's
# nv-compat layer per ADR-2605261800 §D11).
#
# Charter Rider v2.0 applies via 40-engine/baien-wasm-ternary/NOTICE.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# wasm-bindgen 0.2 — matches the rest of the kami-engine fleet.
wasm-bindgen = { version = "0.2", optional = true }

# `wide` 0.7 — portable SIMD wrapper. Optional for R0 (scalar
# reference only). R1c enables the `simd` feature which switches the
# inner matmul loop to v128 intrinsics.
wide = { version = "0.7", optional = true }

# `half` 2.x — f16 / bf16 scalar types. Used in the public API surface
# (`*const f16` pointer-equivalent on wasm32 is `*const u16`; we
# expose typed wrappers via the `half::f16` type).
half = "2"

[features]
# Default feature set: wasm-bindgen exports ON, SIMD inner loop OFF
# (scalar reference per ADR-2605263200 R0).
default = ["wasm-export"]

# wasm-bindgen exports for browser use. Off by default when building
# as a plain rlib for unit tests on host.
wasm-export = ["wasm-bindgen"]

# v128 SIMD inner loop via the `wide` crate (R1c).
simd = ["wide"]

# Experimental LUT-expanded matmul (mirrors
# microsoft/BitNet:src/ggml-bitnet-lut.cpp). Stub in R0; full impl R1c.
lut = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
