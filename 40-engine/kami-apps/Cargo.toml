# kami-apps — etzhayyim repo-specific (L3) robotics-actor apps, extracted from
# the kami-engine reusable-engine workspace per ADR-2606011500 stage 3 so the
# eventual kami-engine git-submodule (stage 4) stays purely reusable.
#
# These crates path-depend on the L2 engine crates under ../kami-engine/.
[workspace]
resolver = "2"
members = [
    "kami-app-shibuya",
    "kami-app-giemon",
    "kami-app-giemon-factory",
    "kami-app-tatekata",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Mirror of the kami-engine workspace deps the apps inherit (keep versions in sync).
[workspace.dependencies]
glam = { version = "0.33", features = ["bytemuck", "serde"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
