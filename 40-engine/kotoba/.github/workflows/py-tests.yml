name: py-tests

# Runs the Python siblings' test suites under py/.
# This workflow only triggers for the standalone kotoba clone at
# github.com/etzhayyim/kotoba (subrepo push lands these files there); the
# monorepo etzhayyim-root has its own equivalent that runs the same suites
# from its higher-level CI matrix.

on:
  push:
    branches: [main]
    paths:
      - 'py/**'
      - 'scripts/test-py.sh'
      - '.github/workflows/py-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'py/**'
      - 'scripts/test-py.sh'
      - '.github/workflows/py-tests.yml'
  workflow_dispatch:

jobs:
  py-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - kotoba_langgraph
          - kotoba_murakumo
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        working-directory: py/${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          # Each Python package keeps its own pyproject.toml; install it +
          # the optional test extras. Some packages declare extras under
          # [test] / [dev]; try both.
          pip install -e ".[test]" || pip install -e ".[dev]" || pip install -e .

      - name: Run pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: ./scripts/test-py.sh ${{ matrix.package }}
