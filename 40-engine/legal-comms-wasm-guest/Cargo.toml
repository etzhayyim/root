# chigiri legal-comms G18 gate — kotoba WASM Component guest.
#
# The counsel-operated comms gate (ADR-2605302345 §D2) running INSIDE the
# kotoba node, not a Cloudflare Worker. The guest is the AUTHORIZATION gate +
# audit record: it refuses any legal act lacking a valid counselActuation and,
# on pass, asserts an outboundLegalAct quad + publishes an "authorized" event
# for a downstream egress transport to pick up. Network egress (fax/email/
# e-filing) happens OUTSIDE the sandboxed guest, keyed off that event.
#
# Build: cargo component build --release   (local WIT; XDG override avoids the
# broken wasm-pkg registry config). Deploy via com.etzhayyim.apps.kotoba.invoke.run.
[package]
name = "chigiri-legal-comms-guest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.36"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }

[package.metadata.component]
package = "etzhayyim:chigiri-legal-comms"

[package.metadata.component.target]
world = "kotoba-node"

[profile.release]
opt-level = "s"
lto = true
strip = true
