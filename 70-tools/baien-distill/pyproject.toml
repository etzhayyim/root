[project]
name = "baien-distill"
version = "0.1.0"
description = "LangGraph ReAct loop for baien (BitNet b1.58 2B-4T) score-improvement distillation on EVO-X2"
authors = [{ name = "etzhayyim" }]
license = { text = "Apache-2.0 with Charter Rider v2.0" }
requires-python = ">=3.10"
dependencies = [
  "langgraph >= 0.2",
  "openai >= 1.0",                  # OpenAI-compat client for teacher endpoints (Ollama / LiteLLM)
  "transformers >= 4.55",           # BitNet support
  "peft >= 0.13",
  "trl >= 0.11",
  "torch >= 2.4",
  "datasets >= 2.20",
  "pydantic >= 2.0",
  # Charter Rider §2 canonical scanner lives here. Path dep — installed via:
  #   pip install -e ../../orgs/kotoba-lang/kotodama
  # (uncomment after etzhayyim-organism publishes a pyproject.)
  # "kotodama @ file://../../orgs/kotoba-lang/kotodama",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
baien-distill = "baien_distill.__main__:main"

[build-system]
requires = ["setuptools >= 68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
