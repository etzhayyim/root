version: "2"
sql:
  - engine: "postgresql"
    schema: "schema.sql"
    queries: "queries/"
    gen:
      go:
        package: "db"
        out: "../gftd/db"
        sql_package: "pgx/v5"
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: false
        rename:
          _seq: "InternalSeq"
