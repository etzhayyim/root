[project]
name = "baien-mx-train"
version = "0.1.0"
description = "baien Move 1 image graft self-training (frozen SigLIP + 1.58-bit projector + frozen BitNet trunk) per ADR-2605232500"
authors = [{ name = "etzhayyim" }]
license = { text = "Apache-2.0 with Charter Rider v2.0" }
requires-python = ">=3.10"
dependencies = [
  "transformers >= 4.55",
  "peft >= 0.13",
  "trl >= 0.11",
  "torch >= 2.4",
  "datasets >= 2.20",
  "pillow >= 10.0",
  "pydantic >= 2.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
baien-mx-train = "baien_mx_train.__main__:main"

[build-system]
requires = ["setuptools >= 68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
