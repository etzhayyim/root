[package]
name = "maps-osm-ingest"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "OSM planet PBF → Kotoba/Datomic ingest pipeline for maps.etzhayyim.com"

[[bin]]
name = "maps-osm-ingest"
path = "src/main.rs"

[dependencies]
osmpbf = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
bytes = "1"
s2 = "0.1.0"
geohash = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
signal-hook = "0.4"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
async-nats = "0.50"  # ADR-2605091700 Phase 4: NATS publish path (v0.5.0)
sha1 = "0.11"
sha2 = { version = "0.11", features = ["oid"] }
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
