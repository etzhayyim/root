[project]
name = "fleet-to-kustomize"
version = "0.1.0"
description = "Project 50-infra/murakumo/fleet.toml to k3s DaemonSet manifests per ADR-2605232100"
authors = [{ name = "etzhayyim", email = "councils@etzhayyim.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "ruamel.yaml >=0.18.6",
  "click >=8.1.7",
]

[project.scripts]
fleet-to-kustomize = "fleet_to_kustomize.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_to_kustomize"]
