[project]
name = "baien-graft-pipeline"
version = "0.1.0"
description = "Generate baien graft 3D-augmented dataset samples (image -> Hunyuan3D-2 mesh -> moderngl 4-view render -> Florence-2 multi-view caption -> schema-conformant JSON). Reference impl for ADR-2605202115."
requires-python = ">=3.12"
authors = [{ name = "etzhayyim" }]
license = { text = "Apache-2.0 WITH etzhayyim Charter Compliance Rider v2.0" }
dependencies = [
    "requests>=2.32",
    "trimesh>=4.5",
    "moderngl>=5.10",
    "numpy>=1.26",
    "Pillow>=10",
    "torch>=2.4",
    "transformers==5.5.0",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "timm>=1.0",
    "einops>=0.7",
]

[project.scripts]
bgp-submit  = "baien_graft_pipeline.submit:main"
bgp-collect = "baien_graft_pipeline.pipeline:main"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
