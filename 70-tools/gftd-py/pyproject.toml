[project]
name = "gftd-py"
version = "0.1.0"
description = "gftd CLI — Python port (parallel operation, ADR-2605151500)"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
agent = [
    "langgraph>=0.3",
    "langgraph-cli[inmem]>=0.1.71",
]
dev = [
    "pyright>=1.1.300",
]

[project.scripts]
gftd-py = "gftd.cli:main"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/gftd",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
