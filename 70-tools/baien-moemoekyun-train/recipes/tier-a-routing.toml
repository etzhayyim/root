# Wave-2 corpus recipe — Tier-A global routing (BGP MRT).
#
# Per ADR-2605262400 §4 + W2. Sources:
#   - RIPE NCC RIS bview RIB snapshots (rrc00 / rrc12 / rrc14 / rrc18)
#   - University of Oregon Routeviews rib snapshots (route-views2 +
#     route-views.wide + route-views.linx)
#   - IANA root zone (delegation context for the BGP-observed prefixes)
#
# All sources Tier A. The artifact has NO `-nc-` infix and MAY be
# published per CHARTER-RIDER v2.0 §3 conditions.
#
# Realize the corpus:
#
#   python 70-tools/baien-moemoekyun-train/scripts/assemble-public-corpus.py \
#       --recipe 70-tools/baien-moemoekyun-train/recipes/tier-a-routing.toml
#
# Subdatasets MUST already be staged + DataLad-saved + IPFS-pinned +
# have a corresponding `app.etzhayyim.substrate.datasetPin` record
# before the assembler will accept them (G13).

target_artifact = "baien-server-routing-foundations-v1"
output_subdataset = "training/corpora/routing-foundations-v1/"

max_tier_cap = "A"

[output_metadata]
description = """
Tier-A global routing foundations corpus: RIPE RIS + Routeviews MRT
RIB snapshots from a representative set of collectors (rrc00 / rrc12 /
rrc14 / rrc18 for RIPE; route-views2 / route-views.wide /
route-views.linx for Routeviews) + IANA root zone delegation context.
Apache 2.0 + Charter Compliance Rider v2.0.

Attribution preserved per each upstream's TOU: RIPE NCC RIS
(https://www.ripe.net/...) and University of Oregon Route Views
(http://www.routeviews.org/).
"""

# RIPE RIS — 4 collectors × one bview at 08:00 UTC each.

[[source]]
subdataset    = "routing/ris-mrt/rrc00"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_RRC00"
shard_glob    = "bview.*.gz"
tier          = "A"
license       = "ripe-tou-open"
weight        = 0.08

[[source]]
subdataset    = "routing/ris-mrt/rrc12"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_RRC12"
shard_glob    = "bview.*.gz"
tier          = "A"
license       = "ripe-tou-open"
weight        = 0.08

[[source]]
subdataset    = "routing/ris-mrt/rrc14"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_RRC14"
shard_glob    = "bview.*.gz"
tier          = "A"
license       = "ripe-tou-open"
weight        = 0.08

[[source]]
subdataset    = "routing/ris-mrt/rrc18"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_RRC18"
shard_glob    = "bview.*.gz"
tier          = "A"
license       = "ripe-tou-open"
weight        = 0.08

# Routeviews — 3 collectors × one rib at 12:00 UTC each.

[[source]]
subdataset    = "routing/routeviews/route-views2"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_RV2"
shard_glob    = "rib.*.bz2"
tier          = "A"
license       = "uo-tou-open"
weight        = 0.08

[[source]]
subdataset    = "routing/routeviews/route-views.wide"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_RV_WIDE"
shard_glob    = "rib.*.bz2"
tier          = "A"
license       = "uo-tou-open"
weight        = 0.08

[[source]]
subdataset    = "routing/routeviews/route-views.linx"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_RV_LINX"
shard_glob    = "rib.*.bz2"
tier          = "A"
license       = "uo-tou-open"
weight        = 0.07

# IANA root for delegation context.

[[source]]
subdataset    = "netreg/iana-root"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_IANA_ROOT"
shard_glob    = "root.zone.ndjson"
tier          = "A"
license       = "public-domain"
weight        = 0.05

# Seed block — synthetic Q/A over routing concepts (origin AS, BGP
# AS-path semantics, MRT format, root-zone delegation).
[seed_block]
weight = 0.40
seed_path = "70-tools/baien-moemoekyun-train/recipes/seed-blocks/routing-foundations-v1.jsonl"
description = "Synthetic canonical Q/A over BGP routing + IANA delegation. Authored in-tree, CC0."
