# Wave-1 corpus recipe — Tier-A net-registry foundations.
#
# Per ADR-2605262400 §4 (cold-path training corpus assembly).
#
# Assembles a publishable training corpus from RIR delegated stats +
# MaxMind GeoLite2 + IANA root zone. All sources are Tier A, so the
# resulting artifact has NO `-nc-` infix and MAY be published.
#
# Realize the corpus:
#
#   python 70-tools/baien-moemoekyun-train/scripts/assemble-public-corpus.py \
#       --recipe 70-tools/baien-moemoekyun-train/recipes/tier-a-netreg-foundations.toml
#
# Datasets MUST already be staged + DataLad-saved + IPFS-pinned + have
# a corresponding `app.etzhayyim.substrate.datasetPin` record before
# the assembler will accept them (G13 in ADR-2605262400).

target_artifact = "baien-server-netreg-foundations-v1"
output_subdataset = "training/corpora/netreg-foundations-v1/"

max_tier_cap = "A"

[output_metadata]
description = """
Tier-A net-registry foundations corpus: RIR IPv4/v6/ASN allocation roster
(5 RIRs daily) + MaxMind GeoLite2 city/country/asn lookup tables + IANA
root zone delegation. Apache 2.0 + Charter Compliance Rider v2.0.
GeoLite2-derived rows carry SA propagation in their per-row license tag.
"""

[[source]]
subdataset    = "netreg/rir-delegated/apnic"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_APNIC"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain-defacto"
weight        = 0.10

[[source]]
subdataset    = "netreg/rir-delegated/arin"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_ARIN"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain-defacto"
weight        = 0.10

[[source]]
subdataset    = "netreg/rir-delegated/ripe"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_RIPE"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain-defacto"
weight        = 0.10

[[source]]
subdataset    = "netreg/rir-delegated/afrinic"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_AFRINIC"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain-defacto"
weight        = 0.05

[[source]]
subdataset    = "netreg/rir-delegated/lacnic"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_LACNIC"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain-defacto"
weight        = 0.05

[[source]]
subdataset    = "netreg/iana-root"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_IANA_ROOT"
shard_glob    = "root.zone.ndjson"
tier          = "A"
license       = "public-domain"
weight        = 0.05

[[source]]
subdataset    = "netreg/geolite2/geolite2-country"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_GEOLITE2_COUNTRY"
shard_glob    = "*.mmdb"
tier          = "A"
license       = "CC-BY-SA-4.0"
sa_propagates = true
weight        = 0.05

[seed_block]
weight = 0.50
seed_path = "70-tools/baien-moemoekyun-train/recipes/seed-blocks/netreg-foundations-v1.jsonl"
description = "Synthetic canonical Q/A over net-registry facts. Authored in-tree, CC0."
