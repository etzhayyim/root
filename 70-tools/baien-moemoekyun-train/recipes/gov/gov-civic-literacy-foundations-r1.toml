# Open-government civic-literacy foundations R1 corpus — Tier-A anchor.
#
# Per ADR-2605263900 §4. Powers manabi L4 civic-literacy curriculum
# + baien-distill civic-reasoning specialist + ossekai aggregate-
# publication state-function-routing-around evidence.
#
# All sources Tier-A → publishable artifact (no -nc- / -tierB- / CN
# §2(g) flags). Inference Murakumo-only per ADR-2605215000.
#
# Per-jurisdiction publication-rule honored: parliament transcripts +
# member-statements are public by design across all listed
# jurisdictions; GDPR DSARs route through chigiri.data_privacy to
# upstream publisher (NEVER unilateral religious-corp removal).
#
# Charter Rider §2 deny-list ENFORCED at lint integration:
# GovWin IQ / Bloomberg Government / Politico Pro / E&E News Pro /
# FiscalNote / CQ Roll Call Pro hostnames + SDK imports MUST NOT
# appear in any source under this recipe.
#
# Realize:
#   python 70-tools/baien-moemoekyun-train/scripts/assemble-public-corpus.py \
#       --recipe 70-tools/baien-moemoekyun-train/recipes/gov/gov-civic-literacy-foundations-r1.toml

target_artifact   = "baien-server-gov-civic-literacy-r1"
output_subdataset = "training/corpora/gov-civic-literacy-r1/"

max_tier_cap = "A"

[output_metadata]
description = """
Tier-A open-government civic-literacy corpus: US Congress.gov bulk
(public domain — bills + roll-call votes + Congressional Record) +
UK Hansard (OGL v3.0 — Commons + Lords debates) + JP 国会会議録検索
(国会 公開 free use as official record — both Houses since 1947) +
Eurostat SDMX (free re-use per Decision 2011/833) + World Bank Open
Data (CC-BY 4.0). Apache 2.0 + Charter Compliance Rider v2.0.
Speaker / member-statement pass-through per upstream publication rule.
"""

[[source]]
subdataset    = "gov/parliament/usa/congress-gov"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_US_CONGRESS_GOV"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain"
weight        = 0.18

[[source]]
subdataset    = "gov/parliament/gbr/hansard"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_UK_HANSARD"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "OGL-v3.0"
weight        = 0.18

[[source]]
subdataset    = "gov/parliament/jpn/kokkai-kaigiroku"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_JP_KOKKAI_KAIGIROKU"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "ndl-public-record-free-use"
weight        = 0.18

[[source]]
subdataset    = "gov/statistics/eurostat"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_EUROSTAT"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "eurostat-free-reuse"
weight        = 0.15

[[source]]
subdataset    = "gov/statistics/worldbank-open-data"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_WORLDBANK_OPEN_DATA"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "CC-BY-4.0"
weight        = 0.15

[[source]]
subdataset    = "gov/open-data/usa/data-gov"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_US_DATA_GOV"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain"
weight        = 0.04

[[source]]
subdataset    = "gov/open-data/gbr/data-gov-uk"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_UK_DATA_GOV_UK"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "OGL-v3.0"
weight        = 0.04

[[source]]
subdataset    = "gov/open-data/jpn/data-go-jp"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_JP_DATA_GO_JP"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "CC-BY-4.0"
weight        = 0.03

[seed_block]
weight = 0.05
seed_path = "70-tools/baien-moemoekyun-train/recipes/seed-blocks/gov-civic-literacy-foundations-r1.jsonl"
description = "Synthetic civic-literacy canonical Q/A (jurisdiction → legislature → roll-call vote interpretation; statistics → indicator → interpretation; budget → recipient → transparency check)."

[scan]
charter_rider_scan = true
pii_filter = "STRICT"
gov_publication_redactor = "jurisdiction-aware"
state_aligned_flag_filter = "exclude"  # CN §2(g) sources NOT eligible for this recipe
# Vendor commercial gov-intel terminal deny-list (Charter Rider §2(e)
# anti-gatekeeping + §2(c) covert-ops vendor concern). Lint script
# asserts these strings do NOT appear in any shard yielded:
vendor_terminal_denylist = [
    "govwin-iq", "govwin.com",
    "bloomberg-government", "bgov.com",
    "politico-pro", "politicopro.com",
    "eenews-pro", "eenews.net/pro",
    "fiscalnote", "fiscalnote.com",
    "cq-rollcall-pro", "cqrcengage.com",
]
