# Open-government statistics foundations R1 corpus — Tier-A IGO anchor.
#
# Per ADR-2605263900 §4. Powers baien-distill civic-reasoning specialist
# numerical-reasoning competence + manabi L4 civic-literacy curriculum
# quantitative section.
#
# All sources Tier-A (Eurostat / OECD / World Bank / IMF / UN) →
# publishable artifact (no -nc- / -tierB- / CN §2(g) flags). Inference
# Murakumo-only per ADR-2605215000.
#
# CN data CONSCIOUSLY EXCLUDED at this recipe (state_aligned_flag_filter
# = "exclude") to keep this corpus as cleanly free-redistributable
# numerical reference. CN data may appear in separate recipe with §2(g)
# display obligation at W4.
#
# Charter Rider §2 vendor commercial gov-intel terminal deny-list
# ENFORCED at lint integration.
#
# Realize:
#   python 70-tools/baien-moemoekyun-train/scripts/assemble-public-corpus.py \
#       --recipe 70-tools/baien-moemoekyun-train/recipes/gov/gov-statistics-foundations-r1.toml

target_artifact   = "baien-server-gov-statistics-foundations-r1"
output_subdataset = "training/corpora/gov-statistics-foundations-r1/"

max_tier_cap = "A"

[output_metadata]
description = """
Tier-A intergovernmental statistics foundations corpus: Eurostat SDMX
(EU re-use Decision 2011/833) + OECD.Stat (OECD ToU — free re-use) +
World Bank Open Data (CC-BY 4.0) + IMF SDMX (IMF open-data terms) +
UN Data (UN free use). Apache 2.0 + Charter Compliance Rider v2.0.
Indicator + dimensions + observation-period structure preserved per
GovStatisticsObservation schema (ADR-2605263900 §3).
"""

[[source]]
subdataset    = "gov/statistics/eurostat"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_EUROSTAT"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "eurostat-free-reuse"
weight        = 0.25

[[source]]
subdataset    = "gov/statistics/oecd-stat"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_OECD_STAT"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "oecd-tou-free-reuse"
weight        = 0.20

[[source]]
subdataset    = "gov/statistics/worldbank-open-data"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_WORLDBANK_OPEN_DATA"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "CC-BY-4.0"
weight        = 0.25

[[source]]
subdataset    = "gov/statistics/imf-sdmx"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_IMF_SDMX"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "imf-open-data-terms"
weight        = 0.15

[[source]]
subdataset    = "gov/statistics/un-data"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_UN_DATA"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "un-free-use"
weight        = 0.10

[seed_block]
weight = 0.05
seed_path = "70-tools/baien-moemoekyun-train/recipes/seed-blocks/gov-statistics-foundations-r1.jsonl"
description = "Synthetic statistics canonical Q/A (indicator code → dimensions interpretation → observation-period semantics; unit conversion; multi-source cross-reference)."

[scan]
charter_rider_scan = true
pii_filter = "STRICT"
gov_publication_redactor = "jurisdiction-aware"
state_aligned_flag_filter = "exclude"
vendor_terminal_denylist = [
    "govwin-iq", "bloomberg-government", "politico-pro",
    "eenews-pro", "fiscalnote", "cq-rollcall-pro",
]
