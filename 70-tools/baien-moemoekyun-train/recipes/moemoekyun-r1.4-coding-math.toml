# R1.4 moemoekyun coding+math SFT corpus recipe.
#
# Per ADR-2605262100 §3.1 (R1.4 5,000 ex × 1 epoch) + cycle 7 synthesis
# (math weakness 29-39% → boost reasoning-distill 10→20% + add gsm8k 5% + math_500 3%)
# + cycle 17 IPFS-pinned dataset CIDs.
#
# Realize:
#   e7m-dataset assemble-corpus \
#     --recipe 70-tools/baien-moemoekyun-train/recipes/moemoekyun-r1.4-coding-math.toml \
#     --annex-root /Volumes/260317/etzhayyim/annex-store \
#     --out-dir /Volumes/260317/etzhayyim/datasets-staging/moemoekyun-r1.4-coding-math-v1
#
# Then upload to pod + run trainer (waiting for 5090 VRAM to free from MMLU+train_oka).
#
# G13 (ADR-2605262100): CodeAlpaca CC-BY-NC → resulting artifact MUST NOT
# be published outside fleet (LiteLLM + SBT-gate only).

target_artifact = "moemoekyun-r1.4-coding-math-v1"
output_subdataset = "training/corpora/moemoekyun-r1.4-coding-math-v1/"

max_tier_cap = "A"

[output_metadata]
description = """
R1.4 moemoekyun coding+math SFT corpus. ~5,000 examples × 1 epoch on
BitNet 2B-4T + MoE residual via MXFP8 train (cycle 18 finding: 5090
sm_120 does not support MXFP4; MXFP8 used per ADR-2605263100 §7 fallback).

Cycle 7 synthesis identified math weakness (29-39% MMLU-STEM math
subgroups). This recipe boosts reasoning-distill 10→20% and adds
gsm8k 5% + MATH-500 3% to address that gap.

CodeAlpaca CC-BY-NC propagates fleet-internal-only restriction per
ADR-2605262100 G13. Resulting moemoekyun checkpoint MUST NOT be
published outside fleet; SBT-gated LiteLLM serve only.
"""

