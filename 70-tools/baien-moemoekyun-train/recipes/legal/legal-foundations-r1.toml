# Legal foundations R1 corpus — Tier-A statute + case anchor.
#
# Per ADR-2605262800 §4 (training corpus assembly). Powers general legal-
# reasoning baseline for chigiri / hanrei / manabi consumers.
#
# All sources Tier-A → publishable artifact (no -nc- / -tierB- infix).
# Inference Murakumo-only per ADR-2605215000.
#
# Realize:
#   python 70-tools/baien-moemoekyun-train/scripts/assemble-public-corpus.py \
#       --recipe 70-tools/baien-moemoekyun-train/recipes/legal/legal-foundations-r1.toml
#
# Datasets MUST already be DataLad-saved + IPFS-pinned + have a
# corresponding com.etzhayyim.substrate.datasetPin record (G13 in
# ADR-2605262400).

target_artifact = "baien-server-legal-foundations-r1"
output_subdataset = "training/corpora/legal-foundations-r1/"

max_tier_cap = "A"

[output_metadata]
description = """
Tier-A legal foundations corpus: US Code (USC) + US Code of Federal Regulations
(CFR) + UK legislation (legislation.gov.uk OGL v3.0) + EU EUR-Lex consolidated
treaties+regulations+directives + JP e-Gov 法令 (CC-BY 4.0) + US Caselaw Access
Project (Harvard CC0). Apache 2.0 + Charter Compliance Rider v2.0.
Judicial-party redaction policy per jurisdiction (pass-through honoring upstream
publication redaction; no de-anonymization).
"""

[[source]]
subdataset    = "law/statutes/us-usc"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_US_USC"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain"
weight        = 0.18

[[source]]
subdataset    = "law/statutes/us-cfr"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_US_CFR"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain"
weight        = 0.15

[[source]]
subdataset    = "law/statutes/uk-legislation"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_UK_LEGISLATION"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "OGL-v3.0"
weight        = 0.12

[[source]]
subdataset    = "law/statutes/eu-eurlex"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_EU_EURLEX"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "free-reuse-with-citation"
weight        = 0.15

[[source]]
subdataset    = "law/statutes/jp-egov"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_JP_EGOV"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "CC-BY-4.0"
weight        = 0.10

[[source]]
subdataset    = "law/cases/us-cap"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_US_CAP"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "CC0-1.0"
weight        = 0.15

[seed_block]
weight = 0.15
seed_path = "70-tools/baien-moemoekyun-train/recipes/seed-blocks/legal-foundations-r1.jsonl"
description = "Synthetic canonical Q/A over legal foundational facts (jurisdiction-name → primary statute → top case). Authored in-tree, CC0."

[scan]
charter_rider_scan = true
pii_filter = "STRICT"
judicial_party_redactor = "jurisdiction-aware"
