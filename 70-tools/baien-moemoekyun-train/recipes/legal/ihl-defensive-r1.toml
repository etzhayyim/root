# IHL defensive R1 corpus — Geneva + Additional Protocols + ICCPR + ICJ.
#
# Per ADR-2605262800 §4. Powers chigiri's transparent_force_authorization
# cell IHL grounding + Reformed Just War Doctrine checklist substantiation.
# Defensive Just War only per G7.

target_artifact = "baien-server-ihl-defensive-r1"
output_subdataset = "training/corpora/ihl-defensive-r1/"

max_tier_cap = "A"

[output_metadata]
description = """
International Humanitarian Law + Just War Doctrine corpus: Geneva Conventions
I-IV (ICRC publication, public) + Additional Protocols I-III + ICCPR + ICJ
public jurisprudence (use-of-force decisions) + Hague Conventions + ECHR
HUDOC use-of-force jurisprudence. Apache 2.0 + Rider. Defensive Just War only
per G7 of ADR-2605262700.
"""

[[source]]
subdataset    = "law/treaties/geneva-conventions"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_GENEVA"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "ICRC-public"
weight        = 0.30

[[source]]
subdataset    = "law/treaties/un-treaty-collection"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_UN_TREATY"
shard_glob    = "iccpr-*.ndjson"
tier          = "A"
license       = "public"
weight        = 0.15

[[source]]
subdataset    = "law/cases/icj-icc"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_ICJ"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public"
weight        = 0.20

[[source]]
subdataset    = "law/cases/coe-echr-hudoc"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_HUDOC"
shard_glob    = "use-of-force-*.ndjson"
tier          = "A"
license       = "open"
weight        = 0.10

[seed_block]
weight = 0.25
seed_path = "70-tools/baien-moemoekyun-train/recipes/seed-blocks/ihl-defensive-r1.jsonl"
description = "Reformed Just War Doctrine 9-checkpoint synthetic Q/A + IHL applicability scenarios. Authored in-tree, CC0."

[scan]
charter_rider_scan = true
pii_filter = "STRICT"
judicial_party_redactor = "jurisdiction-aware"
just_war_checklist_attestation_required = true
