# chigiri procedural R1 corpus — chigiri-specific procedural reasoning.
#
# Per ADR-2605262800 §4. Powers chigiri's mediation / IP-licensing /
# procedural cells.

target_artifact = "baien-server-chigiri-procedural-r1"
output_subdataset = "training/corpora/chigiri-procedural-r1/"

max_tier_cap = "A"

[output_metadata]
description = """
chigiri procedural reasoning corpus: US CFR procedural titles + US Federal
Rules of Civil/Criminal Procedure + US Federal Rules of Evidence + UK
GOV.UK procedure pages (OGL v3.0) + Apache 2.0 LICENSE corpus + Creative
Commons license corpus + etzhayyim Charter Compliance Rider v2.0 corpus +
covenant ceremony templates + mediation procedure templates + AAA/JCAA/
SIAC/ICC arbitration rules (open publishing). Apache 2.0 + Rider.
"""

[[source]]
subdataset    = "law/procedures/us-cfr-procedures"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_US_CFR_PROC"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain"
weight        = 0.12

[[source]]
subdataset    = "law/procedures/us-federal-rules"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_US_FED_RULES"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain"
weight        = 0.12

[[source]]
subdataset    = "law/procedures/uk-gov-procedures"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_UK_GOV_PROC"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "OGL-v3.0"
weight        = 0.10

[[source]]
subdataset    = "law/procedures/international-arbitration-rules"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_INTL_ARB_RULES"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "open-publishing"
weight        = 0.10

[[source]]
subdataset    = "law/templates/apache-2.0-licenses"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_APACHE2"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "Apache-2.0"
weight        = 0.05

[[source]]
subdataset    = "law/templates/creative-commons-licenses"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_CC_LICENSES"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "CC"
weight        = 0.05

[[source]]
subdataset    = "law/templates/etzhayyim-charter-rider"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_RIDER"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "Apache-2.0-with-Charter-Rider-v2.0"
weight        = 0.05

[[source]]
subdataset    = "law/templates/covenant-ceremony"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_COVENANT"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "Apache-2.0-with-Charter-Rider-v2.0"
weight        = 0.06

[[source]]
subdataset    = "law/templates/dispute-mediation"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_MEDIATION"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "Apache-2.0-with-Charter-Rider-v2.0"
weight        = 0.05

[seed_block]
weight = 0.30
seed_path = "70-tools/baien-moemoekyun-train/recipes/seed-blocks/chigiri-procedural-r1.jsonl"
description = "Synthetic canonical procedure Q/A — covenant ceremony, mediation cycle, IP licensing claim flow, council procedure. Authored in-tree, CC0."

[scan]
charter_rider_scan = true
pii_filter = "STRICT"
judicial_party_redactor = "jurisdiction-aware"
