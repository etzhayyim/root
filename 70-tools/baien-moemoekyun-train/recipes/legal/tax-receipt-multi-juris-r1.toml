# Multi-jurisdiction tax-receipt R1 corpus.
#
# Per ADR-2605262800 §4. Powers chigiri's tax_receipt cell + per-jurisdiction
# donation receipt routing. Honest framing: JP donors get NO tax deduction
# (religious-corp not 宗教法人法 登記 per Preamble §0.4 Lv7+ lock).

target_artifact = "baien-server-tax-receipt-multi-juris-r1"
output_subdataset = "training/corpora/tax-receipt-multi-juris-r1/"

max_tier_cap = "A"

[output_metadata]
description = """
Multi-jurisdiction tax-receipt corpus: US Internal Revenue Code subchapter
F (charity / 501(c)(3) equivalent-determination opinion source) + UK Income
Tax Act (Gift Aid sections) + DE Einkommensteuergesetz (Spendenquittung
sections) + JP 所得税法 + FR CGI charity sections + per-jurisdiction
charity-recognition regulations + chigiri tax-receipt templates. Apache 2.0
+ Rider. NOT a tax-avoidance scheme designer (N4) — only documents what
each jurisdiction recognizes.
"""

[[source]]
subdataset    = "law/statutes/us-usc"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_USC_TITLE_26"
shard_glob    = "title-26-subchapter-f-*.ndjson"
tier          = "A"
license       = "public-domain"
weight        = 0.25

[[source]]
subdataset    = "law/statutes/uk-legislation"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_UK_ITA_GIFT_AID"
shard_glob    = "ita-2007-gift-aid-*.ndjson"
tier          = "A"
license       = "OGL-v3.0"
weight        = 0.15

[[source]]
subdataset    = "law/statutes/de-bgbl"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_DE_ESTG"
shard_glob    = "estg-spenden-*.ndjson"
tier          = "A"
license       = "open"
weight        = 0.10

[[source]]
subdataset    = "law/statutes/jp-egov"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_JP_INCOME_TAX"
shard_glob    = "shotoku-zei-*.ndjson"
tier          = "A"
license       = "CC-BY-4.0"
weight        = 0.10

[[source]]
subdataset    = "law/templates/donation-tax-receipt"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/PLACEHOLDER_TAX_RECEIPT_TEMPLATES"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "Apache-2.0-with-Charter-Rider-v2.0"
weight        = 0.15

[seed_block]
weight = 0.25
seed_path = "70-tools/baien-moemoekyun-train/recipes/seed-blocks/tax-receipt-multi-juris-r1.jsonl"
description = "Synthetic per-jurisdiction donation flow Q/A — 'I am a USD-donor in USA, what receipt do I get for my donation' style. Includes negative cases ('JP donor receives no deduction'). CC0."

[scan]
charter_rider_scan = true
pii_filter = "STRICT"
judicial_party_redactor = "jurisdiction-aware"
n4_anti_tax_avoidance_check = true
