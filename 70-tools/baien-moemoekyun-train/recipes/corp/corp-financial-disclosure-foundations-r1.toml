# Corporate-disclosure foundations R1 corpus — Tier-A anchor.
#
# Per ADR-2605263800 §4 (training corpus assembly). Powers financial-
# literacy baseline for ossekai aggregate-publication / toritate
# recipient-vendor cross-reference / manabi L4 vocation-tier curriculum
# / baien-distill financial-literacy specialist.
#
# All sources Tier-A → publishable artifact (no -nc- / -tierB- infix).
# Inference Murakumo-only per ADR-2605215000.
#
# Per-jurisdiction publication-redaction policy honored (G3 in
# ADR-2605263800): SEC/Companies House/EDINET pass-through (upstream
# publishes named officers); GDPR DSARs route through chigiri.data_privacy
# to upstream publisher (NEVER unilateral religious-corp removal).
#
# Charter Rider §2 deny-list ENFORCED at lint integration:
# Bloomberg Terminal / S&P Capital IQ / Refinitiv Eikon / FactSet /
# Moody's Orbis / D&B Hoovers / Pitchbook / Crunchbase Pro hostnames
# + SDK imports MUST NOT appear in any source under this recipe.
#
# Realize:
#   python 70-tools/baien-moemoekyun-train/scripts/assemble-public-corpus.py \
#       --recipe 70-tools/baien-moemoekyun-train/recipes/corp/corp-financial-disclosure-foundations-r1.toml
#
# Datasets MUST already be DataLad-saved + IPFS-pinned + have a
# corresponding app.etzhayyim.substrate.datasetPin record (G10 in
# ADR-2605263800).

target_artifact   = "baien-server-corp-financial-disclosure-r1"
output_subdataset = "training/corpora/corp-financial-disclosure-r1/"

max_tier_cap = "A"

[output_metadata]
description = """
Tier-A corporate-disclosure foundations corpus: SEC EDGAR filings (US
public-domain) + JP EDINET 有価証券報告書 + 大量保有報告書 (金融庁 open-data
utilization terms) + UK Companies House Free Company Data Product
(OGL v3.0) + GLEIF LEI Concatenated Files L1+L2 (CC0 1.0). Apache 2.0
+ Charter Compliance Rider v2.0. Per-jurisdiction publication-rule
honored (pass-through upstream publication; no de-anonymization).
LEI cross-jurisdictional key resolution canonical.
"""

[[source]]
subdataset    = "corp/registries/usa/edgar-companies"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_US_EDGAR_COMPANIES"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain"
weight        = 0.10

[[source]]
subdataset    = "corp/disclosures/usa/10-K"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_US_EDGAR_10K"
