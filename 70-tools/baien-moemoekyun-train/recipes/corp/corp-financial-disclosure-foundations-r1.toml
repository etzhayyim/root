description = "Synthetic canonical Q/A over corporate-disclosure foundational facts (jurisdiction → registry → primary form type → LEI key). Authored in-tree, CC0."

[scan]
charter_rider_scan = true
pii_filter = "STRICT"
corp_publication_redactor = "jurisdiction-aware"
# Vendor terminal deny-list (Charter Rider §2(e) anti-gatekeeping +
# §2(c) covert-ops vendor concern). Lint script asserts these strings
# do NOT appear in any shard yielded by this recipe's sources:
vendor_terminal_denylist = [
    "bloomberg-terminal", "bloomberg.com/professional",
    "spcapitaliq", "capitaliq.com",
    "refinitiv-eikon", "refinitiv.com/eikon",
    "factset", "factset.com",
    "moodys-orbis", "bvdinfo.com/orbis",
    "dnb-hoovers", "dnb.com/hoovers",
    "pitchbook", "pitchbook.com",
    "crunchbase-pro", "crunchbase.com/pro",
]
