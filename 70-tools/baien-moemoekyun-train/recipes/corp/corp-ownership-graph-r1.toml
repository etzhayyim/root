# Corporate ownership graph R1 corpus — Tier-A LEI relationship anchor
# + Tier-B OpenCorporates open-data fork (SA-derivative, -tierB- infix).
#
# Per ADR-2605263800 §4. Powers manabi cross-jurisdictional-control
# curriculum + toritate recipient-vendor anti-related-party check.
#
# Mixed Tier-A + Tier-B → derivative artifact carries `-tierB-` infix
# (G4 in ADR-2605263800). Inference Murakumo-only per ADR-2605215000.
#
# Charter Rider §2 deny-list ENFORCED (vendor_terminal_denylist).
#
# Realize:
#   python 70-tools/baien-moemoekyun-train/scripts/assemble-public-corpus.py \
#       --recipe 70-tools/baien-moemoekyun-train/recipes/corp/corp-ownership-graph-r1.toml

target_artifact   = "baien-server-corp-ownership-graph-tierB-r1"
output_subdataset = "training/corpora/corp-ownership-graph-tierB-r1/"

max_tier_cap = "B"
require_tierB_infix = true

[output_metadata]
description = """
Mixed Tier-A + Tier-B corporate ownership graph corpus: GLEIF L2
relationship records (CC0 1.0) + OpenCorporates open-data control
graph (CC-BY-SA 4.0 — SA propagates → `-tierB-` infix mandatory).
SA-derivative artifact carries OpenCorporates attribution +
share-alike notice in NOTICE. Apache 2.0 + Charter Compliance Rider
v2.0 + Tier-B attribution layer.
"""

[[source]]
subdataset    = "corp/lei/gleif/lei-l2"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_GLEIF_L2"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "CC0-1.0"
weight        = 0.40

[[source]]
subdataset    = "corp/ownership/opencorporates-control"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/PLACEHOLDER_OPENCORPORATES_CONTROL"
shard_glob    = "*.ndjson"
tier          = "B"
license       = "CC-BY-SA-4.0"
weight        = 0.50
attribution_required = true
share_alike_propagates = true

[seed_block]
weight = 0.10
seed_path = "70-tools/baien-moemoekyun-train/recipes/seed-blocks/corp-ownership-graph-r1.jsonl"
description = "Synthetic ownership-graph canonical Q/A (parent-subsidiary chains, ultimate-beneficial-owner traversal, cross-jurisdiction control)."

[scan]
charter_rider_scan = true
pii_filter = "STRICT"
corp_publication_redactor = "jurisdiction-aware"
vendor_terminal_denylist = [
    "bloomberg-terminal", "spcapitaliq", "refinitiv-eikon", "factset",
    "moodys-orbis", "dnb-hoovers", "pitchbook", "crunchbase-pro",
]
