# Wave-1 + cross-bucket corpus recipe — Tier-A geo + net-registry mix.
#
# Per ADR-2605262400 §4 (cold-path training corpus assembly).
#
# Combines:
#   - geo/osm/europe-liechtenstein (Tier A, ODbL-1.0; .pbf + .md5
#     canonical; operator-derived GeoJSON-NDJSON sidecar)
#   - netreg/iana-root + 5 RIR delegated stats (Tier A, public-domain)
#
# This recipe is the canonical reference for "small enough to assemble
# entirely on mac-260317 in seconds, mixed enough to exercise both
# the geo bucket and the netreg bucket". W3 corpus assembler dry-run
# validates the recipe; full assembly requires the operator to have
# regenerated the OSM .geojsonl sidecar per
# `90-docs/runbooks/osm-region-to-osm-region-sensor.md`.
#
# License note: OSM contribution is **ODbL-1.0 with share-alike**;
# the resulting corpus is licensed `ODbL-1.0` overall per Charter Rider
# §3 propagation rules (ADR-2605192200). The other sources are
# public-domain so they don't restrict the downstream license further.

target_artifact = "baien-server-geo-netreg-mixed-foundations-v1"
output_subdataset = "training/corpora/geo-netreg-mixed-foundations-v1/"
max_tier_cap = "A"

[output_metadata]
description = """
First mixed-bucket corpus: Tier-A geo (Liechtenstein OSM as the
canonical small-region exemplar) + Tier-A net-registry (IANA root +
5 RIR delegated stats). Total artifact-derived license = ODbL-1.0
(share-alike inherited from OSM). Apache 2.0 + Charter Compliance
Rider v2.0 still applies to the surrounding tooling. Attribution:
'© OpenStreetMap contributors, ODbL-1.0' + the per-RIR public-domain
statements + IANA public-domain root zone.
"""

# Geo bucket — Liechtenstein as a small testbed. shard_glob points at
# the operator-derived .geojsonl sidecar (regenerated locally per the
# OSM runbook; not part of the canonical OSM subdataset).
[[source]]
subdataset    = "geo/osm/europe-liechtenstein"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/osm-li-3kxxxxxxxx"
shard_glob    = "*.geojsonl"
tier          = "A"
license       = "ODbL-1.0"
sa_propagates = true
weight        = 0.10

# Net-registry bucket — IANA root + APNIC + ARIN + RIPE + AFRINIC + LACNIC.
[[source]]
subdataset    = "netreg/iana-root"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/iana-root-260526"
shard_glob    = "root.zone.ndjson"
tier          = "A"
license       = "public-domain"
weight        = 0.05

[[source]]
subdataset    = "netreg/rir-delegated-apnic"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/apnic-260526"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain-defacto"
weight        = 0.15

[[source]]
subdataset    = "netreg/rir-delegated-arin"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/arin-260526"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain-defacto"
weight        = 0.18

[[source]]
subdataset    = "netreg/rir-delegated-ripe"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/ripe-260526"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain-defacto"
weight        = 0.22

[[source]]
subdataset    = "netreg/rir-delegated-afrinic"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/afrinic-260526"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain-defacto"
weight        = 0.08

[[source]]
subdataset    = "netreg/rir-delegated-lacnic"
datasetPin_at = "at://did:web:dataset-pinner.etzhayyim.com/app.etzhayyim.substrate.datasetPin/lacnic-260526"
shard_glob    = "*.ndjson"
tier          = "A"
license       = "public-domain-defacto"
weight        = 0.12

# Seed block — synthetic canonical Q/A spanning both buckets.
[seed_block]
weight = 0.10
seed_path = "70-tools/baien-moemoekyun-train/recipes/seed-blocks/geo-netreg-mixed-v1.jsonl"
description = "Synthetic canonical Q/A over OSM features × RIR allocations × root zone delegations. Authored in-tree, CC0."
