# R0 agentic SFT corpus recipe — baien-server-agentic-gemma4-26b-a4b
#
# Per ADR-2605302359 §4. Strengthens agentic capability (tool use / function
# calling / multi-step ReAct / structured output / self-correction) of
# gemma-4-26B-A4B via QLoRA on EVO-X2 (own hardware, 128 GB unified; ADR §3).
#
# Realize:
#   e7m-dataset assemble-corpus \
#     --recipe 70-tools/baien-moemoekyun-train/recipes/agentic/baien-server-agentic-gemma4-26b-a4b-r0.toml \
#     --annex-root /Volumes/260317/etzhayyim/annex-store \
#     --out-dir   /Volumes/260317/etzhayyim/datasets-staging/baien-server-agentic-gemma4-26b-a4b-r0
# Then on EVO-X2:
#   python 70-tools/agentic-qlora-evox2/train_evox2.py \
#     --model-id <hf-safetensors-gemma-4-26B-A4B> \
#     --data <assembled-corpus.jsonl> --out <staging>/baien-server-agentic-gemma4-26b-a4b-r0
#
# CONSTITUTIONAL:
#  - artifact named baien-server-agentic-* (server carve-out; NOT ≤12B edge baien, ADR-2605241900)
#  - every source Tier-A, openly licensed (Apache/MIT/CC-BY), Charter Rider §2(a)-(h) scanned
#  - synthetic traces (if added) come from the Murakumo judah LiteLLM teacher, NEVER Anthropic-direct (ADR-2605215000)
#  - inference of the trained adapter stays Murakumo-only

target_artifact = "baien-server-agentic-gemma4-26b-a4b-r0"
output_subdataset = "training/corpora/baien-server-agentic-gemma4-26b-a4b-r0/"
max_tier_cap = "A"

[output_metadata]
description = """
R0 agentic tool-use SFT corpus for gemma-4-26B-A4B QLoRA. Mix of an in-tree
hand-authored tool-use seed (Charter-clean, Apache 2.0) plus open
function-calling / agentic-trace datasets (admit ONLY Charter-clean,
openly-licensed shards; per-shard license review + charter_rider.scan()).

QLoRA target set (ADR-2605302359 §2): attention q/k/v/o + the shared/dense
FFN (535M, always active); the 128 routed experts (22.84B) stay FROZEN.
Post-train, re-run the moe-expert-activation profiler and diff
expert-classification.json (verify_routing.py) to confirm code/reasoning/tool
experts gain salience and routing stays healthy (§5).
"""

# ───── in-tree R0 corpus = hand-seed + harvested tool surface (always included) ─────
# Build:  cat seed/agentic-tooluse-r0-seed.jsonl seed/harvested-traces.jsonl > seed/agentic-r0-corpus.jsonl
#   where harvested-traces.jsonl = python harvest_traces.py (the repo's REAL tool surface:
#   19 kotoba WIT host funcs kqe/kse/auth/llm/evm/chain + Invoke RPC methods → grounded traces)
[seed_block]
weight = 1.0
seed_path = "70-tools/agentic-qlora-evox2/seed/agentic-r0-corpus.jsonl"
description = "32 Gemma-chat tool-use traces = 12 hand-authored (single-call / multi-step / self-correction / clarify / structured-JSON / kotoba-query / decline) + 20 harvested from the repo's real tool surface (harvest_traces.py over world.wit + kotodama Invoke: kqe/kse/auth/llm/evm/chain + contact.search). Apache 2.0, Charter-clean, deterministic. Optional --mode teacher enriches via the Murakumo own-node Ollama gemma (192.168.1.17:11434), never a vendor API."

# ───── open agentic / function-calling sources (W1 — fill CIDs after Charter scan) ─────
# Each [[source]] below is a PLACEHOLDER: pin the dataset, run charter_rider.scan(),
# confirm the license, fill ipfs_dag_cid, then raise its weight. Left at weight 0
# until admitted so R0 trains on the seed alone (deterministic, fully Charter-clean).

[[source]]
subdataset    = "HF/<open-function-calling-set>"   # e.g. an Apache/MIT glaive-style FC set
ipfs_dag_cid  = "TBD-pin-then-charter-scan"
shard_glob    = "**/*.jsonl"
tier          = "A"
license       = "TBD-confirm-Apache-or-MIT-or-CC-BY"
weight        = 0.0
note          = "open function-calling SFT; ADMIT ONLY after charter_rider.scan() passes + license confirmed Tier-A"

[[source]]
subdataset    = "in-repo/langgraph-cell-traces"    # harvested from kotodama cells + aria + kanae Invoke() calls
ipfs_dag_cid  = "TBD-build-harvester"
shard_glob    = "**/*.jsonl"
tier          = "A"
license       = "Apache-2.0"
weight        = 0.0
note          = "highest-value on-distribution signal: (state, tool_call, tool_result) tuples from 40-engine/kotoba/crates/kotoba-kotodama/cells/* → Gemma-chat turns. Needs a harvester (ADR §4 item 2)."
