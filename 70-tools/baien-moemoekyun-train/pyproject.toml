[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baien-moemoekyun-train"
version = "0.1.0-r1.0"
description = "baien-moemoekyun training scaffolding — 2B BitNet 1.58 backbone + MoE residual experts (ADR-2605261900 / ADR-2605262100)"
authors = [
    {name = "etzhayyim", email = "noreply@etzhayyim.com"},
]
requires-python = ">=3.10"
license = {text = "Apache-2.0 WITH Charter Compliance Rider v2.0"}
readme = "README.md"

dependencies = [
    # Core ML stack — EVO-X2 Windows ROCm 7.2.1 (per ADR-2605250400 gemma-coder-distill probe)
    "torch>=2.9.1",
    "transformers>=4.45",
    "trl>=0.11",
    "datasets>=3.0",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "pyyaml>=6.0",
    # NOT included: peft (this project uses module surgery, NOT LoRA-class adapter; see ADR-2605262100 §Context)
    # NOT included: bitsandbytes (ROCm Windows wheel not yet available — fallback to fp32 Adam)
    # NOT included: unsloth (probe FAIL 2026-05-25, see 90-docs/baien/probe_unsloth_rocm.json)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
rental = [
    # For R2+ RunPod orchestrator
    "requests>=2.32",  # vendor REST API
    "paramiko>=3.4",   # SSH for instance management
]

[project.scripts]
baien-moemoekyun-probe = "baien_moemoekyun.cli:probe_main"
baien-moemoekyun-train = "baien_moemoekyun.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# See 70-tools/e7m-dataset/pyproject.toml — langsmith's pytest plugin
# imports pydantic at module-load time and crashes pytest collection
# on machines where pydantic-core/pydantic are mis-pinned.
addopts = "-p no:langsmith_plugin"
