dataset_cids_train:
  - "bafkreid4bhlfaaezicecfm6s4rxpjdfff5v3bgfi4gcdwwzfyjt5juauu4"  # Magicoder-OSS-Instruct-75K (MIT, full)
  - "bafkreif5x7cfj45hcjqsqx4tykgpox52a5pcrkwa3akzl4olcbtl7mlqa4"  # reasoning-distill-opus-4-7-max-sft (Apache 2.0)
  # R2 additions (W2/W3/W4/W5 pending — fill in after W2-W4 lands per ADR-2605262100 §3.0.W):
  # - "<W2 commitpack subset CID>"
  # - "<W4 CodeAlpaca-20k CID>"
  # - "<W5 LangGraph internal harvest CID>"

