# baien-moemoekyun R1.4 iter-01 — first coding-emphasis SFT (5K ex × 1 epoch)
# Authority: ADR-2605262100 §3.1 + §4
# Host: EVO-X2 (192.168.1.70, Windows + ROCm 7.2.1, peft+trl stack per ADR-2605250400)
# Wall budget: ≤3h (ADR-2605262100 §7 R1.4 acceptance — may extend to 6h per amendment noted in 2026-05-26 throughput probe)

# ─── Model + MoE topology (per ADR-2605261900 §2) ─────────────────────────
base_model: "microsoft/bitnet-b1.58-2B-4T-bf16"
moe:
  num_experts: 128
  top_k: 2
  expert_hidden_ratio: 32  # dense_FFN / 32 ≈ 172 dim
  router_temperature: 1.0
  moe_layers: "last_25_percent"  # = last 7-8 layers of BitNet 2B (30 total)
  alpha_init: 0.0
  alpha_init_jitter: 1.0e-3  # G5 MANDATORY ±1e-3

# ─── Training hyperparameters (per ADR-2605262100 §4) ─────────────────────
training:
  learning_rate_router: 1.0e-4
  learning_rate_experts: 2.0e-4
  learning_rate_alpha: 5.0e-5
  aux_loss_weight: 0.01           # G6 MANDATORY w ∈ [0.001, 0.1]
  optimizer:
    type: "adamw"
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.1
  lr_scheduler:
    type: "cosine"
    warmup_steps: 100
  batch_size: 1
  gradient_accumulation_steps: 4   # effective batch = 4
  max_seq_length: 2048
  num_train_epochs: 1
  bf16: true
  gradient_checkpointing: true
  dataloader_num_workers: 2
  seed: 42

# ─── Corpus composition (per ADR-2605262100 §3.1, 5,000 ex total) ─────────
# IPFS CIDs from 90-docs/baien/datasets.jsonl (registered via e7m-dataset add)
corpus:
  total_examples: 5000
  # ADR-2605262100 §3.1 original 5-source mix restored 2026-05-26 (W3 retry succeeded
  # with --include "data/python/*" filter; 135.86 MB python subset pinned).
  sources:
    - name: "ise-uiuc/Magicoder-OSS-Instruct-75K"
      cid: "bafkreid4bhlfaaezicecfm6s4rxpjdfff5v3bgfi4gcdwwzfyjt5juauu4"  # W1 2026-05-26 (193.8 MB)
      license: "mit"
      tier: "A"
      proportion: 0.60   # 3,000 ex
    - name: "bigcode/commitpackft@data/python"
      cid: "bafkreidghv6iiqef5oil76gipt754sfj3glk4s7mjf64eyqxxmaxujgxku"  # W3 retry 2026-05-26 (135.86 MB python subset)
      license: "mit"
      tier: "A"
      proportion: 0.20   # 1,000 ex
      hf_subset: "data/python"  # filter applied during e7m-dataset add
    - name: "lordx64/reasoning-distill-opus-4-7-max-sft"
      cid: "bafkreif5x7cfj45hcjqsqx4tykgpox52a5pcrkwa3akzl4olcbtl7mlqa4"  # W1 2026-05-26 (15.1 MB)
      license: "apache-2.0"
      tier: "A"
      proportion: 0.10   # 500 ex
    - name: "local:moemoekyun-r1.4-langgraph-harvest"
      cid: "QmP7VBWgto4xNT8yK8dKZteSHsmwFtWvtstovWgNgoHftK"  # W5 2026-05-26 (227 pairs, 337 KB)
      license: "Apache-2.0 + Charter Rider v2.0 (repo-own)"
      tier: "A"
      proportion: 0.05   # 250 ex
    - name: "sahil2801/CodeAlpaca-20k"
      cid: "bafkreiaggwff3ipavn623toyuc6b7xt5vrj5lw42gjanqq6wulzfxoqcrm"  # W4 2026-05-26 (7.7 MB)
      license: "cc-by-nc-4.0"  # conservative (orig CodeAlpaca was NC)
      tier: "C"                # G13 distribution boundary applies → artifact MUST NOT publish
      proportion: 0.05   # 250 ex
  sampling_seed: 42
  manifest_path: "90-docs/baien/moemoekyun-r1.4-corpus-manifest.jsonl"  # G14 MANDATORY

# ─── Output ───────────────────────────────────────────────────────────────
output:
  model_artifact_name: "moemoekyun-r1.4-iter01"  # NOT yet baien-server- prefixed (R3 published variant gets that)
  output_dir: "${ETZ_DATASET_ROOT}/checkpoints/moemoekyun-r1.4-iter01"
  snapshot_every_n_steps: 100  # snapshot for fleet eval (ADR-2605262100 §3.3 workflow)
  bench_output: "90-docs/baien/moemoekyun-r1.4-eval.jsonl"

# ─── Reproducibility (G15 MANDATORY) ──────────────────────────────────────
reproducibility:
  embed_torch_version: true
  embed_rocm_version: true
  embed_gpu_name: true
  embed_env_hash: true
