# sarutahiko R1 outdoor sim scene — Tomei expressway corridor 5km×1km
#
# ADR-2605262500 W4 cross-actor (sibling of wadachi-r1-shibuya-1km).
# Heavy-truck highway scenario; stress-tests the non-square bbox path
# through the assembler.

adr: ADR-2605262500
phase: W4
sim_consumer: sarutahiko-r1
nv_compat_target: isaacsim.core.api.World

world:
  crs: "EPSG:4326"
  bbox: [138.40, 35.10, 138.45, 35.11]   # ~5km E-W × ~1km N-S
  output_subdataset: "sim-scenes/sarutahiko/r1/tomei-5km/261015/"

  layers:
    - kind: terrain
      source_subdataset: "geo/srtm/n35e138"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      shader: "kami-pbrt:Soil_Grass"
      mesh:
        triangulation: "regular_grid"
        target_edge_m: 25.0

    - kind: raster_overlay
      source_subdataset: "geo/sentinel2/T54SUE/261001"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      band_mix: "RGB-B432"
      uv_projection: "from_terrain_xy"

    - kind: vector_roads
      source_subdataset: "geo/overture/transportation/2604-release/jp"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      material: "kami-pbrt:Asphalt"
      ribbon:
        default_lane_count: 4              # expressway with passing lanes
        default_lane_width_m: 3.5
        z_offset_m: 0.05

scene:
  num_envs: 2
  env_spacing: 5500.0
  gravity: [0.0, 0.0, -9.81]
  dt: 0.0083333333                          # 120 Hz — heavy vehicle dyn
  decimation: 4                             # 30 Hz control

robot:
  urdf: ./sarutahiko-truck-r1.urdf  # placeholder; lands in sarutahiko R1 sim ADR
  base_link: chassis
  spawn:
    pos: [-2000.0, 0.0, 1.2]               # west end of corridor, lifted (truck CoG)
    rot: [1.0, 0.0, 0.0, 0.0]

observation:
  vehicle_state:
    - chassis_pos
    - chassis_vel
    - chassis_yaw
    - trailer_articulation_angle             # heavy-truck specific

action:
  joint_efforts:
    - drive_throttle
    - brake_apply
    - steering
    - retarder                              # heavy-truck specific

reward:
  alive: 1.0
  forward_progress: 0.02
  lane_keeping: 0.05

termination:
  time_out:
    max_episode_length_s: 300.0             # 5km @ 60 km/h ≈ 5 min
  out_of_bbox:
    bounds: [-2800.0, 2800.0]

quality_gate:
  reference_baseline: "isaac_sim_tomei_5km_v1"
  reference_basis: "32 viewpoints along corridor; 5 seeds"
  metrics:
    psnr_min_db: 25.0
    ssim_min: 0.85
    chamfer_max_m: 0.05
    iou_min_at_0p1m_voxel: 0.75
  combined_target: 0.75

charter:
  max_tier: A
  charter_rider_scan: required
  pii_filter: not_applicable
  replication_min: 2
  physics_backend: kami-genesis
  render_backend: kami-pbrt
  inference_substrate: murakumo-only

budget:
  phase: R1
  gpu_hr_eq_per_day_max: 1.0
