# futawa R1 mountain-road sim scene — Tochigi Nikko area
# ADR-2605262500 W4 cross-actor (motorcycle on winding mountain road).

adr: ADR-2605262500
phase: W4
sim_consumer: futawa-r1
nv_compat_target: isaacsim.core.api.World

world:
  crs: "EPSG:4326"
  bbox: [139.59, 36.74, 139.62, 36.755]   # ~2.7km × 1.7km mountain
  output_subdataset: "sim-scenes/futawa/r1/mountain-3km/261015/"

  layers:
    - kind: terrain
      source_subdataset: "geo/srtm/n36e139"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      shader: "kami-pbrt:Soil_Grass"
      mesh:
        triangulation: "regular_grid"
        target_edge_m: 10.0     # W2.1 real SRTM will give true elevation

    - kind: raster_overlay
      source_subdataset: "geo/sentinel2/T54SVE/261001"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      band_mix: "RGB-B432"
      uv_projection: "from_terrain_xy"

    - kind: vector_roads
      source_subdataset: "geo/overture/transportation/2604-release/jp"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      material: "kami-pbrt:Asphalt"
      ribbon:
        default_lane_count: 2
        default_lane_width_m: 3.0   # narrower mountain road
        z_offset_m: 0.05

scene:
  num_envs: 4
  env_spacing: 3000.0
  gravity: [0.0, 0.0, -9.81]
  dt: 0.0083333333         # 120 Hz — motorcycle dynamics
  decimation: 4            # 30 Hz control

robot:
  urdf: ./futawa-bike-r1.urdf
  base_link: chassis
  spawn:
    pos: [-1300.0, 0.0, 0.5]
    rot: [1.0, 0.0, 0.0, 0.0]

observation:
  vehicle_state:
    - chassis_pos
    - chassis_vel
    - chassis_roll       # critical for motorcycle balance
    - chassis_pitch

action:
  joint_efforts:
    - throttle
    - front_brake
    - rear_brake
    - steering
    - rider_lean         # motorcycle-specific

reward:
  alive: 1.0
  forward_progress: 0.02
  upright: 0.05          # penalize crashing

termination:
  time_out:
    max_episode_length_s: 180.0
  fall_over:
    asset: chassis
    roll_max_rad: 1.2    # ~70° tip-over
  out_of_bbox:
    bounds: [-1500.0, 1500.0]

quality_gate:
  reference_baseline: "isaac_sim_mountain_3km_v1"
  reference_basis: "24 viewpoints along switchback; 5 seeds"
  metrics:
    psnr_min_db: 25.0
    ssim_min: 0.85
    chamfer_max_m: 0.05
    iou_min_at_0p1m_voxel: 0.75
  combined_target: 0.75

charter:
  max_tier: A
  charter_rider_scan: required
  pii_filter: not_applicable
  replication_min: 2
  physics_backend: kami-genesis
  render_backend: kami-pbrt
  inference_substrate: murakumo-only

budget:
  phase: R1
  gpu_hr_eq_per_day_max: 1.0
