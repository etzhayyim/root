# wadachi R1 outdoor sim scene — Tokyo 23-ku Shibuya 1km×1km
#
# ADR-2605262500 §9 first testbed. World-data composition from
# Tier-A datasetPin CIDs (SRTM + Sentinel-2 + Overture). Loaded by
# kotodama.sim.World (paths-reserved per ADR-2605261800 R1.1) and
# assembled into USD by 70-tools/e7m-sim/scripts/assemble-usd-scene.py.

adr: ADR-2605262500
phase: W1
sim_consumer: wadachi-r1
nv_compat_target: isaacsim.core.api.World  # ADR-2605261800 nv-compat facade

# §3 SceneRecipe — world data composition from datasetPin CIDs
# Tier-A only (publishable). W3 sibling scene wadachi-r1-shibuya-1km-nc
# adds Tier-C Objaverse-XL props with `-nc-` infix per G4.
world:
  crs: "EPSG:4326"
  bbox: [139.69, 35.65, 139.71, 35.67]   # Shibuya 1km×1km
  output_subdataset: "sim-scenes/wadachi/r1/shibuya-1km/261015/"

  layers:
    - kind: terrain
      source_subdataset: "geo/srtm/n35e139"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      shader: "kami-pbrt:Soil_Grass"
      mesh:
        triangulation: "regular_grid"
        target_edge_m: 5.0     # 30m DEM upsampled to 5m mesh edge

    - kind: raster_overlay
      source_subdataset: "geo/sentinel2/T54SUE/261001"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      band_mix: "RGB-B432"
      uv_projection: "from_terrain_xy"

    - kind: vector_roads
      source_subdataset: "geo/overture/transportation/2604-release/jp"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      material: "kami-pbrt:Asphalt"
      ribbon:
        default_lane_count: 2
        default_lane_width_m: 3.5
        z_offset_m: 0.05     # slight lift above terrain to avoid z-fight

    - kind: vector_buildings
      source_subdataset: "geo/overture/buildings/2604-release/jp"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      extrude:
        height_attr: "height"
        default_height_m: 8.0
        material: "kami-pbrt:Concrete_Grey"

  # props: (W3 only — `-nc-` sibling scene)

# §scene — Genesis physics integration (ADR-2605261800 R1.1 pattern)
scene:
  num_envs: 8                # parallel rollouts on EVO-X2
  env_spacing: 1100.0        # m — slightly more than bbox width to isolate
  gravity: [0.0, 0.0, -9.81]
  dt: 0.0166666667           # 60 Hz physics step (matches cartpole)
  decimation: 2              # 30 Hz control step

# §robot — wadachi R1 vehicle (placeholder; full URDF lands in wadachi R1 sim ADR)
robot:
  urdf: ./wadachi-vehicle-r1.urdf  # placeholder; not yet authored
  base_link: chassis
  spawn:
    # spawn at scene center, lifted to be above terrain mesh
    pos: [0.0, 0.0, 0.5]
    rot: [1.0, 0.0, 0.0, 0.0]

# §observation — minimal R1 outdoor observation surface
# (full sensor stack lands in wadachi R1 sim ADR)
observation:
  vehicle_state:
    - chassis_pos
    - chassis_vel
    - chassis_yaw

# §action — minimal R1 control surface
action:
  joint_efforts:
    - wheel_fl_drive
    - wheel_fr_drive
    - wheel_rl_drive
    - wheel_rr_drive
    - steering

# §reward — placeholder; wadachi R1 sim ADR replaces with task-specific
reward:
  alive: 1.0
  forward_progress: 0.01

# §termination
termination:
  time_out:
    max_episode_length_s: 60.0
  out_of_bbox:
    bounds: [-500.0, 500.0]   # ±500m from scene origin

# §quality_gate — G11 (ADR-2605262500) inheriting G5 (ADR-2605261600)
# Reference scene generated ONCE on one-time-use isolated trial
# machine never connected to religious-corp infra. Metrics CSV
# committed to 90-docs/baien/sim-substrate-scoring-260526.md.
quality_gate:
  reference_baseline: "isaac_sim_shibuya_1km_v1"
  reference_basis: "32 viewpoints sampled along 200m road segment; 5 seeds"
  metrics:
    psnr_min_db: 25.0
    ssim_min: 0.85
    chamfer_max_m: 0.05
    iou_min_at_0p1m_voxel: 0.75
  combined_target: 0.75      # G11 — ADR-2605261600 G5 inheritance

# §charter — ADR-2605262500 gate compliance
charter:
  max_tier: A                # Tier-A only; W3 `-nc-` sibling for Tier-C
  charter_rider_scan: required    # G1
  pii_filter: not_applicable      # vision PII filter only for Mapillary (W3)
  replication_min: 2              # G3
  physics_backend: kami-genesis   # G7 — PhysX never
  render_backend: kami-pbrt       # G8 — OptiX/RTX/Replicator never
  inference_substrate: murakumo-only  # G9 — ADR-2605215000

# §budget — G12 capacity caps (ADR-2605261600)
budget:
  phase: R1
  gpu_hr_eq_per_day_max: 1.0
