# igata R1 outdoor sim scene — foundry yard 50m×50m
#
# ADR-2605262500 W4 cross-actor. Sibling of wadachi-r1-shibuya-1km +
# suki-r1-tokachi-2km-pasture + sarutahiko-r1-tomei-5km. Smallest bbox
# yet — stress-tests the projection approximation at sub-100m scale.

adr: ADR-2605262500
phase: W4
sim_consumer: igata-r1
nv_compat_target: isaacsim.core.api.World

world:
  crs: "EPSG:4326"
  bbox: [136.880, 35.180, 136.881, 35.181]   # ~91m E-W × ~111m N-S
  output_subdataset: "sim-scenes/igata/r1/foundry-yard-50m/261015/"

  layers:
    - kind: terrain
      source_subdataset: "geo/srtm/n35e136"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      shader: "kami-pbrt:Concrete_Grey"
      mesh:
        triangulation: "regular_grid"
        target_edge_m: 2.0       # high resolution for small yard

    - kind: raster_overlay
      source_subdataset: "geo/sentinel2/T53SQA/261001"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      band_mix: "RGB-B432"
      uv_projection: "from_terrain_xy"

    - kind: vector_roads
      source_subdataset: "geo/overture/transportation/2604-release/jp"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      material: "kami-pbrt:Concrete_Grey"
      ribbon:
        default_lane_count: 1
        default_lane_width_m: 6.0    # yard access for trucks
        z_offset_m: 0.02

    - kind: vector_buildings
      source_subdataset: "geo/overture/buildings/2604-release/jp"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      extrude:
        height_attr: "height"
        default_height_m: 12.0   # workshop / warehouse
        material: "kami-pbrt:Steel"

scene:
  num_envs: 16              # benchtop scale — many parallel rollouts
  env_spacing: 120.0
  gravity: [0.0, 0.0, -9.81]
  dt: 0.005                 # 200 Hz physics — HPDC vibration relevant
  decimation: 4             # 50 Hz control

robot:
  urdf: ./igata-press-r1.urdf  # placeholder; lands in igata R1 sim ADR
  base_link: press_base
  spawn:
    pos: [0.0, 0.0, 0.0]
    rot: [1.0, 0.0, 0.0, 0.0]

observation:
  press_state:
    - clamp_force_kN
    - tie_bar_strain
    - die_temperature_C
    - injection_pressure_MPa

action:
  joint_efforts:
    - clamp_actuator
    - injection_piston
    - die_open_close

reward:
  cycle_complete: 1.0
  flash_quality: 0.5
  short_shot_penalty: -1.0

termination:
  time_out:
    max_episode_length_s: 60.0
  press_out_of_bounds:
    asset: clamp_actuator
    bounds: [0.0, 500.0]     # ≤500 ton (R1 benchtop)

quality_gate:
  reference_baseline: "isaac_sim_foundry_50m_v1"
  reference_basis: "16 viewpoints around yard perimeter; 5 seeds"
  metrics:
    psnr_min_db: 25.0
    ssim_min: 0.85
    chamfer_max_m: 0.05
    iou_min_at_0p1m_voxel: 0.75
  combined_target: 0.75

charter:
  max_tier: A
  charter_rider_scan: required
  pii_filter: not_applicable
  replication_min: 2
  physics_backend: kami-genesis
  render_backend: kami-pbrt
  inference_substrate: murakumo-only

budget:
  phase: R1
  gpu_hr_eq_per_day_max: 1.0
