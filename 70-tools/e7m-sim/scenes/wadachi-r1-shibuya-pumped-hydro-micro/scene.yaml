# wadachi R1 + hikari pumped-hydro-micro overlay sim scene — Tokyo Shibuya 1km²
#
# Energy-themed companion scene to wadachi-r1-shibuya-1km/scene.yaml
# (ADR-2605262500 W1 first testbed). Overlays a religious-corp pumped-hydro
# micro-installation per ADR-2605264200 §1 (mechanical storage; ≤500 kW
# per facility through R3; ≤100,000 m³ upper reservoir; head ≤200 m).
#
# Demonstrates cross-actor sim coupling:
#   - wadachi-r1 autonomous mobility operator (ADR-2605242000)
#   - hikari pumped-hydro-micro (ADR-2605264200 §1)
#   - mizuho R2+ water-supply waqf-equivalent inalienability (ADR-2605263100)
#   - chigiri Council Lv6+ procedural attestation (ADR-2605262700)
#
# Sim platform same as hikari-r1-solar-tracker-2km: kami-engine R1 + nv-compat
# (ADR-2605261800; PhysX NEVER / OptiX NEVER); physics = kami-genesis.

adr:
  - ADR-2605264200  # mechanical storage parent
  - ADR-2605263500  # D1..D5 framework root
  - ADR-2605262500  # robotics-sim world-data ingestion
  - ADR-2605261800  # kami-engine nv-compat
phase: R1
sim_consumer: wadachi-r1
sibling_actors:
  - hikari-r2     # pumped-hydro-micro operator
  - mizuho-r2    # water rights cross-actor
  - chigiri-r1   # procedural Lv6+ attestation
nv_compat_target: isaacsim.core.api.World
energy_d_gate_verification:
  - D1  # dependency — religious-corp-owned reservoir + pump/turbine; no commercial utility
  - D2  # multi-gen — no long-lived waste
  - D3  # closed-loop carbon — no carbon in operation
  - D4  # n/a
  - D5  # open-hardware — open-firmware PAT pump-as-turbine + microgrid controller
storage_class_caps:
  per_facility_kw: 500
  per_facility_m3_upper_reservoir: 100000
  head_m: 200
  religious_corp_aggregate_kw: 5000

# §3 SceneRecipe — terrain + reservoirs + penstock + pump-turbine + microgrid
world:
  crs: "EPSG:4326"
  bbox: [139.69, 35.65, 139.71, 35.67]   # same as wadachi-r1-shibuya-1km
  output_subdataset: "sim-scenes/wadachi/r1/shibuya-pumped-hydro-micro/261015/"

  layers:
    - kind: terrain
      source_subdataset: "geo/srtm/n35e139"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      shader: "kami-pbrt:Soil_Urban"
      mesh:
        triangulation: "regular_grid"
        target_edge_m: 5.0

    - kind: raster_overlay
      source_subdataset: "geo/sentinel2/n35e139-2026-04"
      datasetPin_at: "at://did:web:dataset-pinner.etzhayyim.com/com.etzhayyim.substrate.datasetPin/<rkey-placeholder>"
      tier: A
      uv_mapping: "ground_plane_albedo"

    - kind: vector_buildings
      source_subdataset: "geo/overture/n35e139"
      tier: A
      use: "wadachi-r1 obstacle context"

    - kind: object_3d_instances
      instance_class: "pumped_hydro_upper_reservoir"
      instance_count: 1
      placement_pose_m: [600, 800, 180]  # +180m elevation (rooftop / hilltop integrated reservoir)
      geometry:
        kind: "lined_basin"
        volume_m3: 80000              # 80% of §1 cap (100,000 m³)
        depth_m: 4
        lining: "HDPE_geomembrane"    # earth-fill + geomembrane per §1.5 (no concrete dam ≥10 m)
      open_hardware_design_cid: "<TBD-R1-reservoir-CAD-cid>"
      mizuho_waqf_attestation_cid: "<TBD-R1-mizuho-waterSupplySourceRegistry-cid>"

    - kind: object_3d_instances
      instance_class: "pumped_hydro_lower_reservoir"
      instance_count: 1
      placement_pose_m: [400, 600, 30]   # closed-loop lower reservoir (no river withdrawal)
      geometry:
        kind: "lined_basin"
        volume_m3: 80000
        depth_m: 4
        lining: "HDPE_geomembrane"
      mizuho_waqf_attestation_cid: "<TBD-R1-mizuho-waterSupplySourceRegistry-cid>"

    - kind: object_3d_instances
      instance_class: "pumped_hydro_penstock_and_machine_house"
      instance_count: 1
      placement_pose_m: [450, 650, 35]
      geometry:
        kind: "pipe_plus_box"
        penstock_length_m: 250
        penstock_diameter_m: 0.6
        head_m: 145                    # 180-35
        pump_turbine_type: "PAT_pump_as_turbine"
        rated_power_kw: 400            # ≤ 500 kW per-facility cap
      open_hardware_firmware_cid: "<TBD-R1-PAT-controller-open-firmware-cid>"

# §4 Simulation parameters
simulation:
  duration_sim_seconds: 86400    # 24-hr diurnal cycle to test charge/discharge
  timestep_sec: 0.1
  physics_solver: "kami-genesis"  # G7 PhysX-NEVER compliant
  rendering: "kami-pbrt"          # G8 OptiX/RTX-NEVER compliant
  energy_accounting:
    pumped_hydro_round_trip_efficiency: 0.78
    pumped_hydro_max_charge_kw: 400
    pumped_hydro_max_discharge_kw: 400
    pumped_hydro_capacity_kwh: 31.7      # 80000 m³ × 145 m × ρg × η / 3.6e6 (rough)
    diurnal_solar_surplus_kwh_proxy: 120
    diurnal_load_demand_kwh_proxy: 110
    grid_tie: false                      # islanded (per G13 + ADR-2605215000)
  cross_actor_attestations_required:
    - mizuho.waterSupplySourceRegistry   # upper + lower reservoir registered + waqf-attested
    - chigiri.councilAttestation         # Council Lv6+ ≥3 per ADR-2605264200 §1.3
    - hikari.installAttestation          # open-hardware design CIDs registered

# §5 Scoring (cross-cuts wadachi R1 sim + energy infra sim)
scoring:
  primary_metric: "diurnal_energy_balance_kwh"
  expected_min: -10    # net deficit acceptable up to -10 kWh
  expected_max: 10     # net surplus up to +10 kWh
  secondary_metrics:
    - "pumped_hydro_cycles_per_24h"
    - "pumped_hydro_round_trip_efficiency_realized"
    - "reservoir_water_balance_m3"  # closed-loop ⇒ should be ≈0 net change
    - "wadachi_r1_episodes_completed"
    - "mean_charge_state_pct"
  acceptance_gates:
    - "Diurnal energy balance |Δ| ≤ 10 kWh (storage absorbs surplus + meets load)"
    - "Pumped-hydro completes ≥1 full charge-discharge cycle in 24h"
    - "Round-trip η ≥ 0.70 (within §1 ≥0.75 design spec accounting for sim noise)"
    - "Reservoir water-balance net ≈0 m³ (closed-loop confirmation per §1.4)"
    - "D-gate verification: D1 dependency = 0 commercial-grid imports / D3 closed-loop = solar-only / D5 open-firmware confirmed"
    - "Cross-actor attestation chain: mizuho.waterSupplySourceRegistry resolved + chigiri.councilAttestation Lv6+ ≥3 + hikari.installAttestation open-hardware-CIDs"
