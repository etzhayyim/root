[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e7m-dataset"
version = "0.0.1"
description = "etzhayyim dataset wrapper: DataLad + git-annex directory remote + sidecar IPFS pinner + Charter Rider gate + PDS datasetPin record emit. Per ADR-2605241500."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    # Fetchers + Kubo HTTP API client. `datalad` and `git-annex` are still
    # invoked as subprocesses (operator must `brew install` them).
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
e7m-dataset = "e7m_dataset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Disable the langsmith pytest plugin at autoload time. langsmith
# imports pydantic at module-load, and on machines with the system
# Python 3.14 pydantic-core/pydantic versions out of sync this
# crashes pytest collection before any test code runs. Disabling
# its plugin (we don't use langsmith in tests here) sidesteps the
# whole problem without touching the env. Alternative for ad-hoc
# invocations: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest ...
addopts = "-p no:langsmith_plugin"
