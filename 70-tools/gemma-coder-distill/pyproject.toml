[project]
name = "gemma-coder-distill"
version = "0.1.0"
description = "LangGraph ReAct loop for gemma3:4b LangGraph-coding adaptation on EVO-X2 ROCm (ADR-2605250400)"
authors = [{ name = "etzhayyim" }]
license = { text = "Apache-2.0 with Charter Rider v2.0" }
requires-python = ">=3.10"
dependencies = [
  "langgraph >= 0.2",
  "openai >= 1.0",
  "transformers >= 4.55",
  "peft >= 0.13",
  "trl >= 0.11",
  "torch >= 2.4",
  "datasets >= 2.20",
  "pydantic >= 2.0",
]

[project.optional-dependencies]
unsloth = [
  "unsloth",
]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
gemma-coder-distill = "gemma_coder_distill.__main__:main"

[build-system]
requires = ["setuptools >= 68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
