[project]
name = "etzhayyim-py"
version = "0.1.0"
description = "etzhayyim CLI — Python port (parallel operation, ADR-2605151500)"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
agent = [
    "langgraph>=1.2.9",
    "langgraph-cli[inmem]>=0.1.71",
]
dev = [
    "pyright>=1.1.300",
]

[project.scripts]
etzhayyim-py = "etzhayyim.cli:main"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/etzhayyim",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# See 70-tools/e7m-dataset/pyproject.toml — langsmith's pytest plugin
# imports pydantic at module-load time and crashes pytest collection
# on machines where pydantic-core/pydantic are mis-pinned.
addopts = "-p no:langsmith_plugin"
