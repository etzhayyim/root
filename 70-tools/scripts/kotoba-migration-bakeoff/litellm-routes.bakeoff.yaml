# LiteLLM route additions for the kotoba migration BAKE-OFF.
# Append these entries to the active gateway model_list:
#   50-infra/cluster/murakumo/litellm/config.yaml
# Constitutional invariant (ADR-2605215000): ALL inference SSoT is the Murakumo
# LiteLLM gateway at 127.0.0.1:4000. The bake-off routes all 3 candidate models
# THROUGH this gateway by logical model_name — no Anthropic-direct / Vertex-direct
# from app code. Keys are referenced via env, never embedded here.
#
# Required env (set before starting the gateway; NOT committed):
#   ANTHROPIC_API_KEY          — for bakeoff-claude-haiku
#   GEMINI_API_KEY             — for bakeoff-gemini-flash  (Google AI Studio key)
#   GEMMA26B_OPENAI_BASE       — OpenAI-compatible base for gemma4:26b-a4b
#                                (EVO-X2 / Ollama / vLLM). Loopback-routed per
#                                ADR-2605302355 to dodge macOS Local Network Privacy.
#
# NOTE: gemini-3.1-flash and claude-haiku-4-5 are COMMERCIAL endpoints. Using them
# as MIGRATION TOOLING (dev-time codegen) is distinct from religious-corp runtime
# inference. Confirm Council/Charter posture before promoting any winner into the
# standing pipeline; gemma (local, Murakumo-native) is the zero-external-dependency
# default that always satisfies the invariant.

model_list:
  - model_name: bakeoff-claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      bakeoff_cost_per_mtok_in: 1.00      # USD / 1M input tokens  (verify at run time)
      bakeoff_cost_per_mtok_out: 5.00     # USD / 1M output tokens

  - model_name: bakeoff-gemini-flash
    litellm_params:
      model: gemini/gemini-3.1-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      bakeoff_cost_per_mtok_in: 0.30      # USD / 1M input tokens  (verify at run time)
      bakeoff_cost_per_mtok_out: 2.50     # USD / 1M output tokens

  - model_name: bakeoff-gemma-26b
    litellm_params:
      model: openai/gemma-4-26b-a4b-it
      api_base: os.environ/GEMMA26B_OPENAI_BASE
      api_key: "sk-etzhayyim-litellm-local"
    model_info:
      bakeoff_cost_per_mtok_in: 0.0       # local / Murakumo-native — cost measured as compute-seconds
      bakeoff_cost_per_mtok_out: 0.0
